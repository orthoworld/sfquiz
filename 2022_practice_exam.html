<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2022 Practice Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F5F3;
    --surface: #FFFFFF;
    --ink: #1B2430;
    --muted: #64707D;
    --border: #DFE3E0;
    --accent: #3B7DD8;
    --accent-dark: #2A5DA8;
    --accent-tint: #EAF1FB;
    --correct: #1E8A5F;
    --correct-bg: #E7F5EE;
    --correct-border: #A9DDC4;
    --incorrect: #BF3F27;
    --incorrect-bg: #FBEAE5;
    --incorrect-border: #EFB7A8;
    --flag: #B9821A;
    --flag-bg: #FCF1DC;
    --flag-border: #ECD9AC;
    --nokey: #7C6FB0;
    --nokey-bg: #EFEBFA;
    --nokey-border: #D6CDEE;
    --explain-text: #384250;
    --claude-orange: #3B7DD8;
    --claude-orange-dark: #2A5DA8;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(27,36,48,0.06), 0 4px 14px rgba(27,36,48,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181B;
      --surface: #1E2226;
      --ink: #E8EAEC;
      --muted: #97A1A9;
      --border: #333A40;
      --accent: #5B9AE6;
      --accent-dark: #3B7DD8;
      --accent-tint: #1B2A3D;
      --correct: #58D399;
      --correct-bg: #17301F;
      --correct-border: #2D5238;
      --incorrect: #F0876D;
      --incorrect-bg: #3A211B;
      --incorrect-border: #62362A;
      --flag: #E3B04B;
      --flag-bg: #362C15;
      --flag-border: #5B4A24;
      --nokey: #BBA9F5;
      --nokey-bg: #2A2440;
      --nokey-border: #453B66;
      --explain-text: #C7CDD3;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
    }
  }
  /* Explicit user override (Settings menu), regardless of system preference */
  :root[data-theme="dark"] {
    --bg: #15181B;
    --surface: #1E2226;
    --ink: #E8EAEC;
    --muted: #97A1A9;
    --border: #333A40;
    --accent: #5B9AE6;
    --accent-dark: #3B7DD8;
    --accent-tint: #1B2A3D;
    --correct: #58D399;
    --correct-bg: #17301F;
    --correct-border: #2D5238;
    --incorrect: #F0876D;
    --incorrect-bg: #3A211B;
    --incorrect-border: #62362A;
    --flag: #E3B04B;
    --flag-bg: #362C15;
    --flag-border: #5B4A24;
    --nokey: #BBA9F5;
    --nokey-bg: #2A2440;
    --nokey-border: #453B66;
    --explain-text: #C7CDD3;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  /* Explicit full-viewport backdrop, independent of document/content height
     or the host page's own background. Covers overscroll/bounce areas on
     iOS and any gap if the rendered content is shorter than the viewport,
     both of which can otherwise reveal the host app's own background
     color showing through instead of ours. Always in sync with the
     current theme since it references the same live CSS variable. */
  .bg-fill {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: -1;
  }
  #app {
    max-width: 1180px;
    margin: 0 auto;
    padding: 20px 20px 60px;
  }
  .cw-banner {
    background: linear-gradient(135deg, var(--claude-orange), var(--claude-orange-dark));
    color: #fff;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Inter', sans-serif;
  }
  .cw-banner-inner {
    max-width: 1180px;
    margin: 0 auto;
    width: 100%;
    display: grid;
    grid-template-columns: auto 1fr auto;
    grid-template-areas: "brand score settings";
    align-items: center;
    gap: 14px;
  }
  @media (max-width: 640px) {
    .cw-banner-inner {
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "brand settings"
        "score score";
      row-gap: 10px;
    }
  }
  .cw-brand {
    grid-area: brand;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cw-home-link {
    color: #fff;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    background: rgba(255,255,255,0.16);
    border-radius: 999px;
    padding: 5px 12px;
    white-space: nowrap;
  }
  .cw-home-link:hover { background: rgba(255,255,255,0.28); }
  .cw-banner-score {
    grid-area: score;
    display: flex;
    justify-content: center;
    min-width: 0;
  }
  .cw-banner-icon {
    flex: 0 0 30px;
    width: 30px;
    height: 30px;
  }
  .cw-banner-title {
    font-weight: 700;
    font-size: 1.4667rem;
    letter-spacing: -0.01em;
  }
  .cw-icons {
    grid-area: settings;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cw-settings { position: relative; }
  .cw-calc { position: relative; }
  .settings-gear {
    background: rgba(255,255,255,0.16);
    border: none;
    border-radius: 8px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
  }
  .settings-gear:hover { background: rgba(255,255,255,0.26); }
  .settings-panel {
    position: absolute;
    top: 42px;
    right: 0;
    width: 264px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    padding: 14px;
    z-index: 20;
    color: var(--ink);
  }
  .settings-panel.hidden { display: none; }
  .calc-panel { width: 224px; }
  .calc-display {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    text-align: right;
    font-family: 'Source Serif 4', serif;
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--ink);
    overflow-x: auto;
    white-space: nowrap;
  }
  .calc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 10px;
  }
  .calc-btn {
    height: 40px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .calc-btn:hover { border-color: var(--accent); }
  .calc-op { background: var(--accent-tint); color: var(--accent-dark); }
  .calc-zero { grid-column: span 2; }
  .calc-equals { background: var(--accent); color: #fff; border-color: var(--accent); }
  .calc-equals:hover { background: var(--accent-dark); }
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .settings-row + .settings-row { margin-top: 14px; }
  .settings-label {
    font-size: 0.8667rem;
    font-weight: 600;
    color: var(--muted);
  }
  .settings-stepper {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .settings-stepper button {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: inherit;
  }
  .settings-stepper button:hover { border-color: var(--accent); color: var(--accent-dark); }
  #font-pct {
    font-size: 0.8rem;
    color: var(--muted);
    min-width: 34px;
    text-align: center;
  }
  .settings-seg {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
  }
  .settings-seg button {
    background: var(--bg);
    border: none;
    border-left: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.7333rem;
    font-weight: 600;
    padding: 5px 7px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .settings-seg button:first-child { border-left: none; }
  .settings-seg button.active { background: var(--accent); color: #fff; }
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 28px;
  }
  header.top h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 1.4rem;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header.top .sub {
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.55;
    margin-top: 6px;
  }
  .score-pill {
    display: flex;
    align-items: center;
    gap: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: 999px;
    padding: 8px 20px;
    box-shadow: var(--shadow);
  }
  .score-pill .stat { text-align: center; }
  .score-pill .stat .num { font-size: 1.1333rem; font-weight: 700; font-family: 'Source Serif 4', serif; }
  .score-pill .stat .lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .score-pill .divider { width: 1px; height: 26px; background: var(--border); }

  .layout {
    display: grid;
    grid-template-columns: 264px 1fr 240px;
    gap: 20px;
    align-items: start;
  }
  /* Intermediate tier: the 3rd (notes) column is the first thing to give
     up its own column on medium widths (common laptop/split-screen sizes)
     -- it's supplementary, so it drops to full width below the question
     rather than squeezing the actual question+options column down to an
     unreadably narrow strip. The nav sidebar + question panel keep their
     normal 2-column arrangement here; only full mobile (<820px) stacks
     everything.  */
  @media (max-width: 1100px) {
    .layout { grid-template-columns: 264px 1fr; }
    .notes-panel { grid-column: 1 / -1; order: 3; position: static; }
    .notes-textarea { min-height: 120px; }
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .nav-panel { order: 2; position: static; }
    .qgrid { grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); }
  }
  @media (max-width: 480px) {
    #app { padding: 14px 14px 40px; }
    header.top h1 { font-size: 1.4rem; }
    header.top { margin-bottom: 22px; gap: 16px; }
    .score-pill { padding: 7px 14px; gap: 12px; }
    .score-pill .stat .num { font-size: 1rem; }
    .score-pill .divider { height: 22px; }
    .qpanel { padding: 18px 16px 16px; min-height: 0; }
    .stem { font-size: 1.1333rem; margin-bottom: 16px; }
    .opt { padding: 11px 12px; font-size: 0.9667rem; }
    .strike-btn { flex-basis: 30px; }
    .confirm-btn { width: 100%; text-align: center; }
    .footer-nav { margin-top: 18px; padding-top: 12px; }
    .navbtn { padding: 9px 14px; font-size: 0.8667rem; }
    .position { font-size: 0.8rem; }
  }

  .nav-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    position: sticky;
    top: 16px;
    box-shadow: var(--shadow);
  }
  .notes-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    position: sticky;
    top: 16px;
    box-shadow: var(--shadow);
  }
  .notes-textarea {
    width: 100%;
    min-height: 220px;
    resize: vertical;
    box-sizing: border-box;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
  }
  .notes-textarea:focus { outline: none; border-color: var(--accent); }
  .notes-hint {
    margin-top: 8px;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .filter-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .filter-tabs button {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 600;
    padding: 5px 9px;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
  }
  .filter-tabs button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .grid-label {
    font-size: 0.7333rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .qgrid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    max-height: 360px;
    overflow-y: auto;
    padding-right: 14px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .qgrid::-webkit-scrollbar { width: 8px; }
  .qgrid::-webkit-scrollbar-track { background: transparent; }
  .qgrid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .qgrid::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  .qgrid button {
    aspect-ratio: 1;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    position: relative;
    padding: 0;
  }
  .qgrid button.current { box-shadow: inset 0 0 0 2px var(--accent-dark); }
  .qgrid button.correct { background: var(--correct-bg); border-color: var(--correct-border); color: var(--correct); }
  .qgrid button.incorrect { background: var(--incorrect-bg); border-color: var(--incorrect-border); color: var(--incorrect); }
  .qgrid button.nokey-done { background: var(--nokey-bg); border-color: var(--nokey-border); color: var(--nokey); }
  .qgrid button .flagdot {
    position: absolute; top: 2px; right: 2px;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--flag);
  }
  .legend {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 0.7667rem;
    color: var(--muted);
  }
  .legend span.sw { display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:6px; vertical-align: -1px;}
  .reset-btn {
    margin-top: 14px;
    width: 100%;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.8rem;
    padding: 7px;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
  }
  .reset-btn:hover { color: var(--incorrect); border-color: var(--incorrect-border); }

  .qpanel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 26px 28px 22px;
    box-shadow: var(--shadow);
    min-height: 420px;
  }
  .qmeta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .qmeta .qnum {
    font-size: 0.8333rem;
    font-weight: 700;
    color: var(--accent-dark);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .flag-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid var(--border);
    padding: 5px 11px;
    border-radius: 7px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
  }
  .flag-toggle.on {
    background: var(--flag-bg);
    border-color: var(--flag-border);
    color: var(--flag);
  }
  .stem {
    font-family: 'Source Serif 4', serif;
    font-size: 1.2667rem;
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .options { display: flex; flex-direction: column; gap: 9px; }
  .opt-row { display: flex; align-items: stretch; gap: 8px; }
  .opt-row .opt { flex: 1; }
  .strike-btn {
    flex: 0 0 34px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    border-radius: 8px;
    cursor: pointer;
    color: var(--muted);
    font-size: 0.8667rem;
    font-weight: 600;
    font-family: inherit;
  }
  .strike-btn:hover { border-color: var(--muted); color: var(--ink); }
  .strike-btn.active { background: var(--ink); border-color: var(--ink); color: #fff; }
  .opt {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    text-align: left;
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    font-family: inherit;
    font-size: 1rem;
    color: var(--ink);
    transition: border-color .12s, background .12s;
  }
  .opt:hover:not(.locked):not(.struck) { border-color: var(--accent); background: var(--accent-tint); }
  .opt .letter {
    flex: 0 0 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.8333rem;
    color: var(--muted);
  }
  .opt .text { padding-top: 2px; }
  .opt.selected .letter { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opt.correct-answer { border-color: var(--correct-border); background: var(--correct-bg); }
  .opt.correct-answer .letter { background: var(--correct); border-color: var(--correct); color: #fff; }
  .opt.wrong-answer { border-color: var(--incorrect-border); background: var(--incorrect-bg); }
  .opt.wrong-answer .letter { background: var(--incorrect); border-color: var(--incorrect); color: #fff; }
  .opt.locked { cursor: default; }
  .opt.struck { cursor: default; background: var(--bg); opacity: 0.6; }
  .opt.struck .text { text-decoration: line-through; }
  .opt.pending-selected { border-color: var(--accent); background: var(--accent-tint); }
  .opt.pending-selected .letter { background: var(--accent); border-color: var(--accent); color: #fff; }

  .confirm-btn {
    margin-top: 6px;
    align-self: flex-start;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
  }
  .confirm-btn:hover:not(:disabled) { background: var(--accent-dark); }
  .confirm-btn:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
  }

  .noopts-box {
    background: var(--nokey-bg);
    border: 1px solid var(--nokey-border);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 0.9333rem;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .reveal-btn {
    margin-top: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
  }

  .explain {
    margin-top: 20px;
    border-top: 1px solid var(--border);
    padding-top: 18px;
    animation: fadein .15s ease-in;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px);} to { opacity:1; transform: translateY(0);} }
  .verdict {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .verdict.correct { background: var(--correct-bg); color: var(--correct); }
  .verdict.incorrect { background: var(--incorrect-bg); color: var(--incorrect); }
  .verdict.nokey { background: var(--nokey-bg); color: var(--nokey); }
  .verdict-emoji { font-size: 1rem; margin-left: 2px; }
  .explain-body { font-size: 0.9667rem; color: var(--explain-text); }
  .explain-body p { margin: 0 0 10px; }
  .explain-body ul { margin: 0 0 10px; padding-left: 20px; }
  .explain-body li { margin-bottom: 6px; }
  .explain-body strong { color: var(--ink); }
  .nokey-note {
    font-size: 0.8667rem;
    color: var(--nokey);
    background: var(--nokey-bg);
    border-radius: 7px;
    padding: 8px 12px;
    margin-bottom: 12px;
  }
  .addendum {
    margin-top: 12px;
    background: var(--flag-bg);

<script>
const QUIZ_DATA = [{"number":1,"stem":"A 45 year old male arrives in emergency after being involved in an industrial accident, severing his left arm. His heart rate is 148 bpm, and he has a blood pressure of 70/45. He is breathing at 40 / min. According to ATLS, what classification of hemorrhagic shock would this represent?","options":[{"letter":"A","text":"Class I"},{"letter":"B","text":"Class II"},{"letter":"C","text":"Class III"},{"letter":"D","text":"Class IV"}],"correct":"D","explanation":"<p>Original key: D. <strong>Agree.</strong></p>\n<p>Why D is correct: ATLS Class IV hemorrhage (&gt;40% blood volume loss) is defined by heart rate &gt;140 bpm, decreased (frankly low) blood pressure, respiratory rate &gt;35/min, negligible urine output, and depressed mental status. This patient (HR 148, SBP 70, RR 40) meets Class IV on every parameter.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A (Class I): &lt;15% loss, normal vitals, HR &lt;100 --- far milder than this presentation.</li>\n\n<li>B (Class II): 15--30% loss, HR 100--120, normal SBP with narrowed pulse pressure, RR 20--30.</li>\n\n<li>C (Class III): 30--40% loss, HR 120--140, decreased SBP, RR 30--40. This patient&#x27;s HR (148) and RR (40) exceed the Class III thresholds.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":2,"stem":"In the treatment of severe hypothermia, which of the following is the most effective method of Active Warming (ie. Which delivers the most calories per hour):","options":[{"letter":"A","text":"Heated air via ventilator"},{"letter":"B","text":"Radiant warmer"},{"letter":"C","text":"Cardiopulmonary bypass"},{"letter":"D","text":"Warm Blankets and Sheets"}],"correct":"C","explanation":"<p>Original key: C. <strong>Agree.</strong></p>\n<p>Why C is correct: Extracorporeal rewarming (cardiopulmonary bypass/ECMO) is the most rapid active core rewarming method, capable of raising core temperature ~7--10\u00b0C/hour, and is preferred in severe hypothermia with hemodynamic instability or cardiac arrest.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A (heated humidified ventilator gas): an active core method but adds only ~1\u00b0C/hour.</li>\n\n<li>B (radiant warmer): active external warming, modest caloric delivery.</li>\n\n<li>D (warm blankets/sheets): passive external rewarming --- the least effective; relies on the patient&#x27;s own thermogenesis.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":3,"stem":"Which of the following factors initiates the intrinsic (contact activation) pathway of the coagulation system:","options":[{"letter":"A","text":"12"},{"letter":"B","text":"9"},{"letter":"C","text":"10"},{"letter":"D","text":"7"}],"correct":"A","explanation":"<p>Original key: A. <strong>Agree.</strong></p>\n<p>Why A is correct: The intrinsic (contact activation) pathway is initiated by Factor XII (Hageman factor) upon contact with a negatively charged surface, activating the sequence XII \u2192 XI \u2192 IX.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>B (IX): a downstream intrinsic-pathway factor, not the initiator.</li>\n\n<li>C (X): the first factor of the common pathway.</li>\n\n<li>D (VII): the initiator of the extrinsic pathway (with tissue factor).</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":4,"stem":"Tranexamic Acid is an antifibrinolytic that works via:","options":[{"letter":"A","text":"Promotes that activation of plasminogen to plasmin"},{"letter":"B","text":"Inhibits the activation of plasminogen to plasmin"},{"letter":"C","text":"Increases degradation of fibrin"},{"letter":"D","text":"Activating the complement cascade"}],"correct":"B","explanation":"<p>Original key: B. <strong>Agree.</strong></p>\n<p>Why B is correct: Tranexamic acid is a lysine analog that competitively blocks the lysine-binding sites on plasminogen, preventing its conversion to plasmin and thereby inhibiting fibrinolysis (clot breakdown).</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A: the opposite mechanism --- promoting plasmin would be profibrinolytic.</li>\n\n<li>C: increasing fibrin degradation is profibrinolytic, the opposite of an antifibrinolytic.</li>\n\n<li>D: TXA has no role in complement activation.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":5,"stem":"A 28 year old female presents hypotensive after protracted vomiting. After physical exam and lab work, you are most likely to note that she has:","options":[{"letter":"A","text":"Hypovolemic hypernatremia"},{"letter":"B","text":"Euvolemic hypernatremia"},{"letter":"C","text":"Hypervolemic hypernatremia"},{"letter":"D","text":"Hyponatremia"}],"correct":"A","explanation":"<p>Original key: A. <strong>Agree.</strong></p>\n<p>Why A is correct: Protracted vomiting causes loss of relatively hypotonic gastric fluid plus reduced oral intake. The net effect is volume depletion (hypovolemia) with free-water loss exceeding sodium loss, producing hypernatremia. Hypotension reflects the volume deficit.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>B (euvolemic): the clinical hypotension indicates volume depletion, not euvolemia.</li>\n\n<li>C (hypervolemic): vomiting causes fluid loss, not overload.</li>\n\n<li>D (hyponatremia): loss of hypotonic fluid raises, rather than lowers, serum sodium in this classic teaching scenario. (Note: real-world sodium after vomiting varies with the composition of losses and intake, but the intended board answer is hypovolemic hypernatremia.)</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":6,"stem":"A patient is noted to have a serum K\u207a (potassium) of 7.1, and new EKG findings including loss of p-waves. Which of the following will you administer first:","options":[{"letter":"A","text":"IV Kayexalate"},{"letter":"B","text":"Oral Kayexalate"},{"letter":"C","text":"Oral Calcium carbonate"},{"letter":"D","text":"IV calcium carbonate"}],"correct":"D","explanation":"<p>Original key: D. <strong>Agree.</strong></p>\n<p>Why D is correct: Severe hyperkalemia (K\u207a 7.1) with ECG changes (loss of P waves) is a cardiac emergency. The first drug is IV calcium to stabilize the myocardial cell membrane and prevent arrhythmia; it acts within minutes. Of the choices, IV calcium is the only membrane-stabilizing agent. (In practice calcium gluconate or calcium chloride is used, not &quot;carbonate,&quot; but D is the only intravenous calcium option.)</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A/B (Kayexalate, IV or oral): sodium polystyrene sulfonate removes potassium slowly over hours and does not protect the heart acutely; IV Kayexalate is not a route that is used.</li>\n\n<li>C (oral calcium carbonate): oral calcium does not provide the rapid membrane stabilization needed in an emergency.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":7,"stem":"The most common electrolyte abnormality associated with Hypokalemia is:","options":[{"letter":"A","text":"Hypernatremia"},{"letter":"B","text":"Hyponatremia"},{"letter":"C","text":"Hypomagnesemia"},{"letter":"D","text":"Hypermagnesemia"}],"correct":"C","explanation":"<p>Original key: C. <strong>Agree.</strong></p>\n<p>Why C is correct: Hypomagnesemia frequently coexists with hypokalemia and promotes renal potassium wasting; refractory hypokalemia often will not correct until magnesium is repleted.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A/B (sodium disorders): not the classically linked companion abnormality of hypokalemia.</li>\n\n<li>D (hypermagnesemia): magnesium tends to be low, not high, alongside potassium.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":8,"stem":"Which of the following amino acids cannot be synthesized by the human body (i.e. Which is an essential amino acid):","options":[{"letter":"A","text":"Glycine"},{"letter":"B","text":"Alanine"},{"letter":"C","text":"Moreen"},{"letter":"D","text":"Leucine"}],"correct":"D","explanation":"<p>Original key: D. <strong>Agree.</strong></p>\n<p>Why D is correct: Leucine is one of the nine essential amino acids (it cannot be synthesized endogenously and must be obtained from diet).</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A (glycine) and B (alanine): both are nonessential amino acids that the body can synthesize.</li>\n\n<li>C (&quot;Moreen&quot;): not an amino acid --- a distractor.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":9,"stem":"An 85 year old chronic user of alcohol presents with hair loss, pallor, glossitis and dermatitis. Which micronutrient deficiency could explain this:","options":[{"letter":"A","text":"Calcium"},{"letter":"B","text":"Biotin"},{"letter":"C","text":"Vitamin K"},{"letter":"D","text":"Selenium"}],"correct":"B","explanation":"<p>Original key: Biotin (B). <strong>Agree.</strong></p>\n<p>Why B is correct: Biotin (vitamin B7) deficiency classically produces alopecia (hair loss) and a scaly periorificial dermatitis, along with glossitis, and can occur with poor intake/alcoholism. This constellation of hair loss + dermatitis + glossitis best fits biotin deficiency among the options (Sweetman et al., Pediatrics, 1981; Koike &amp; Utani, Pediatric Dermatology, 2016).</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A (calcium): deficiency causes neuromuscular irritability/tetany and bone disease, not this dermatologic triad.</li>\n\n<li>C (vitamin K): deficiency causes bleeding/coagulopathy.</li>\n\n<li>D (selenium): deficiency causes cardiomyopathy (Keshan disease) and myopathy, not the described skin/hair picture.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":10,"stem":"When ordering TPN. A typical 65kg male needs approximately how many grams of protein per day?","options":[{"letter":"A","text":"81"},{"letter":"B","text":"194"},{"letter":"C","text":"98"},{"letter":"D","text":"46"}],"correct":"C","explanation":"<p>Original key: C (1.5 g/kg). <strong>Agree.</strong></p>\n<p>Why C is correct: Using ~1.5 g/kg/day (typical for a hospitalized/stressed patient on TPN), 65 kg \u00d7 1.5 = ~98 g/day.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A (81): corresponds to ~1.25 g/kg --- not the round 1.5 g/kg target used here.</li>\n\n<li>B (194): ~3 g/kg, far above standard requirements.</li>\n\n<li>D (46): ~0.7 g/kg, roughly the basal RDA --- below the intended TPN target for this question.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":11,"stem":"The three phases of wound healing are:","options":[{"letter":"A","text":"Inflammation, proliferation, maturation"},{"letter":"B","text":"Injury, inflammation, remodelling"},{"letter":"C","text":"Hemostasis, inflammation, maturation"},{"letter":"D","text":"Epithelial migration, contraction, scarring"}],"correct":"A","explanation":"<p>Original key: A. <strong>Agree.</strong></p>\n<p>Why A is correct: The three classic overlapping phases of wound healing are inflammation, proliferation, and maturation (remodeling). (Hemostasis is sometimes listed as an initial fourth/precursor phase.)</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>B: &quot;injury&quot; is the insult, not a healing phase, and this omits proliferation.</li>\n\n<li>C: substitutes hemostasis for proliferation, omitting the proliferative phase.</li>\n\n<li>D: lists individual events (epithelialization, contraction) rather than the recognized phases.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":12,"stem":"Which cells are most responsible for cessation of hemorrhage through capillary plugging?","options":[{"letter":"A","text":"Platelets and erythrocytes"},{"letter":"B","text":"Platelets and macrophages"},{"letter":"C","text":"Macrophages and erythrocytes"},{"letter":"D","text":"Macrophages and eosinophils"}],"correct":"A","explanation":"<p>Original key: A. <strong>Agree.</strong></p>\n<p>Why A is correct: Immediate hemostasis at the capillary level occurs through a platelet plug together with aggregating red blood cells forming the initial clot (&quot;capillary plugging&quot;).</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>B, C, D: macrophages and eosinophils are inflammatory/phagocytic cells and do not mediate the initial mechanical plugging of capillaries.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":13,"stem":"As wound healing progresses, one can see a steady increase in:","options":[{"letter":"A","text":"Fibronectin"},{"letter":"B","text":"Fibrolastin"},{"letter":"C","text":"Collagen III"},{"letter":"D","text":"Collagen I"}],"correct":"D","explanation":"<p>Original key: Collagen 1 (D). <strong>Agree.</strong></p>\n<p>Why D is correct: During maturation/remodeling, the initial type III collagen is progressively replaced by stronger type I collagen, which steadily increases and restores tensile strength.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A (fibronectin): important early in provisional matrix, but not the marker of the steady late increase.</li>\n\n<li>B (&quot;fibrolastin&quot;): not a recognized matrix protein --- a distractor.</li>\n\n<li>C (collagen III): predominates early and then declines as it is replaced by type I.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":14,"stem":"Scar with excess net collagen deposition and growth beyond the original borders of the wound is called a:","options":[{"letter":"A","text":"Hypertrophic scar"},{"letter":"B","text":"Papule"},{"letter":"C","text":"Keloid"},{"letter":"D","text":"Skin tag"}],"correct":"C","explanation":"<p>Original key: Keloid (C). <strong>Agree.</strong></p>\n<p>Why C is correct: A keloid is defined by excess collagen deposition that extends beyond the original wound margins.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A (hypertrophic scar): raised excess collagen confined within the original wound borders --- the key distinction from a keloid.</li>\n\n<li>B (papule): a small raised skin lesion, unrelated to scarring.</li>\n\n<li>D (skin tag): a benign pedunculated skin growth (acrochordon), not a scar.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":15,"stem":"Which of the following does NOT inhibit wound healing:","options":[{"letter":"A","text":"Malnutrition"},{"letter":"B","text":"Gout"},{"letter":"C","text":"Doxorubicin (Adriamycin)"},{"letter":"D","text":"Ionizing radiation"}],"correct":"B","explanation":"<p>Original key: B. <strong>Agree.</strong></p>\n<p>Why B is correct: Gout is not an established impairer of wound healing; the other three all impair healing.</p>\n<p>Why the others are incorrect (they DO inhibit healing):</p>\n<ul>\n<li>A (malnutrition): protein/calorie and micronutrient deficits impair collagen synthesis and immune function.</li>\n\n<li>C (doxorubicin): cytotoxic chemotherapy impairs fibroblast proliferation and healing.</li>\n\n<li>D (ionizing radiation): damages fibroblasts and vasculature, impairing healing.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":16,"stem":"Which of the following is NOT associated with the \"lethal triad\" of trauma coagulopathy:","options":[{"letter":"A","text":"Tachycardia"},{"letter":"B","text":"Hypothermia"},{"letter":"C","text":"Acidemia"},{"letter":"D","text":"Resuscitation with hypocoagulable fluids"}],"correct":"A","explanation":"<p>Original key: A. <strong>Agree.</strong></p>\n<p>Why A is correct: The &quot;lethal triad&quot; (or &quot;trauma triad of death&quot;) comprises hypothermia, acidosis, and coagulopathy. Tachycardia is a shock sign but is not a component of the triad.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>B (hypothermia) and C (acidemia): two direct members of the triad.</li>\n\n<li>D: resuscitation with dilutional/hypocoagulable fluids drives the coagulopathy limb of the triad, so it is associated.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":17,"stem":"In terms of medical errors, which of the following is correct:","options":[{"letter":"A","text":"Operating on the wrong side is an example of a \"never-event\" that is identifiable, preventable, and has serious consequences."},{"letter":"B","text":"\"Near misses\" should not be reported as no patient harm occurred"},{"letter":"C","text":"A superficial skin infection that occurs after a second year surgical resident is left alone to close the skin incision is an example of negligence on the part of both the surgeon and the resident."},{"letter":"D","text":"A superficial skin infection that occurs after a second year surgical resident is left alone to close the skin incision is an example of negligence of the resident only."}],"correct":"A","explanation":"<p>Original key: A. <strong>Agree.</strong></p>\n<p>Why A is correct: Wrong-side surgery is a classic &quot;never event&quot; --- a serious, largely preventable, and clearly identifiable error, and the definition given is accurate.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>B: near misses SHOULD be reported; capturing them is central to error-prevention/safety culture.</li>\n\n<li>C and D: a superficial skin infection after appropriate skin closure by a competent second-year resident is a recognized surgical complication, not per se negligence of either party.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":18,"stem":"Diabetes mellitus impairs wound healing through:","options":[{"letter":"A","text":"Decreased O\u2082 delivery from insulin effects"},{"letter":"B","text":"Decreased O2 delivery due to end-organ microangiopathy"},{"letter":"C","text":"Increased tissue remodelling from elevated glucose levels"},{"letter":"D","text":"Increased decarboxylation"}],"correct":"B","explanation":"<p>Original key: B. <strong>Agree.</strong></p>\n<p>Why B is correct: Chronic hyperglycemia causes microangiopathy (small-vessel disease), reducing tissue oxygen and nutrient delivery and impairing healing; it also impairs neutrophil function and collagen formation.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A: impaired healing is due to vascular/microangiopathic disease, not a direct oxygen-lowering &quot;insulin effect.&quot;</li>\n\n<li>C: hyperglycemia impairs, rather than beneficially increases, healing/remodeling.</li>\n\n<li>D: &quot;increased decarboxylation&quot; is not a recognized mechanism of diabetic wound impairment.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":19,"stem":"Adult multipotent stem cells can commonly be isolated from:","options":[{"letter":"A","text":"Bone marrow"},{"letter":"B","text":"Liver"},{"letter":"C","text":"Spleen"},{"letter":"D","text":"Kidney"}],"correct":"A","explanation":"<p>Original key: Bone marrow (A). <strong>Agree.</strong></p>\n<p>Why A is correct: Bone marrow is the classic, readily accessible source of adult multipotent stem cells (hematopoietic and mesenchymal stem cells).</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>B, C, D (liver, spleen, kidney): not standard or common sources of clinically isolated adult multipotent stem cells.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":20,"stem":"Case-control studies:","options":[{"letter":"A","text":"Identify cases by exposure and follow for outcome"},{"letter":"B","text":"Exposure and outcome are assessed at the same point in time"},{"letter":"C","text":"Identify cases by outcome and assess for exposure"},{"letter":"D","text":"Should be analyzed using intention to treat analysis"}],"correct":"C","explanation":"<p>Original key: C. <strong>Agree.</strong></p>\n<p>Why C is correct: In a case-control study, subjects are selected by outcome/disease status (cases vs controls) and then assessed retrospectively for prior exposure.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A: describes a cohort study (grouped by exposure, followed for outcome).</li>\n\n<li>B: describes a cross-sectional study (exposure and outcome measured simultaneously).</li>\n\n<li>D: intention-to-treat analysis applies to randomized controlled trials, not case-control studies.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":21,"stem":"Sensitivity of a test can be calculated as follows:","options":[{"letter":"A","text":"[a/(a+c)] \u00d7 100"},{"letter":"B","text":"[a/(a+b)] \u00d7 100"},{"letter":"C","text":"[d/(b+d)] \u00d7 100"},{"letter":"D","text":"[d/(a+d)] \u00d7 100 (Table: a = test-positive/has condition [true positive]; b = test-positive/no condition [false positive]; c = test-negative/has condition [false negative]; d = test-negative/no condition [true negative].)"}],"correct":"A","explanation":"<p>Original key: A. <strong>Agree.</strong></p>\n<p>Why A is correct: Sensitivity = TP/(TP+FN) = a/(a+c) --- the proportion of those with the condition who test positive.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>B [a/(a+b)]: this is positive predictive value.</li>\n\n<li>C [d/(b+d)]: this is specificity.</li>\n\n<li>D [d/(a+d)]: not a standard test characteristic.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":22,"stem":"Specificity of a test can be calculated as follows:","options":[{"letter":"A","text":"[a/(a+c)] \u00d7 100"},{"letter":"B","text":"[a/(a+b)] \u00d7 100"},{"letter":"C","text":"[d/(b+d)] \u00d7 100"},{"letter":"D","text":"[d/(a+d)] \u00d7 100"}],"correct":"C","explanation":"<p>Original key: C. <strong>Agree.</strong></p>\n<p>Why C is correct: Specificity = TN/(TN+FP) = d/(b+d) --- the proportion of those without the condition who test negative.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A [a/(a+c)]: sensitivity.</li>\n\n<li>B [a/(a+b)]: positive predictive value.</li>\n\n<li>D [d/(a+d)]: not a standard test characteristic.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":23,"stem":"Positive Predictive Value (PPV) of a test can be calculated as follows:","options":[{"letter":"A","text":"[a/(a+c)] \u00d7 100"},{"letter":"B","text":"[a/(a+b)] \u00d7 100"},{"letter":"C","text":"[d/(b+d)] \u00d7 100"},{"letter":"D","text":"[d/(a+d)] \u00d7 100"}],"correct":"B","explanation":"<p>Original key: B. <strong>Agree.</strong></p>\n<p>Why B is correct: PPV = TP/(TP+FP) = a/(a+b) --- the proportion of positive tests that are true positives.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A [a/(a+c)]: sensitivity.</li>\n\n<li>C [d/(b+d)]: specificity.</li>\n\n<li>D [d/(a+d)]: not a standard test characteristic (NPV would be d/(c+d)).</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":24,"stem":"An extremely sensitive test will:","options":[{"letter":"A","text":"Correctly rule out most who don't have the condition of concern"},{"letter":"B","text":"Has a high false negative rate"},{"letter":"C","text":"Has a high false positive rate"},{"letter":"D","text":"Correctly identify most who have the condition of concern"}],"correct":"D","explanation":"<p>Original key: D. <strong>Agree.</strong></p>\n<p>Why D is correct: A highly sensitive test has few false negatives, so it correctly identifies most people who truly have the condition (a negative result helps rule out disease --- &quot;SnNout&quot;).</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A: correctly ruling out those without disease describes specificity, not sensitivity.</li>\n\n<li>B: high sensitivity means a LOW false-negative rate.</li>\n\n<li>C: false-positive rate relates to specificity; high sensitivity does not by definition mean high false positives.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":25,"stem":"The Time-Out element of the surgical safety checklist includes the following:","options":[{"letter":"A","text":"Confirmation of antibiotic administration if indicated for the procedure"},{"letter":"B","text":"Confirmation of Foley insertion if indicated for the procedure"},{"letter":"C","text":"Confirmation of endotracheal tube location if indicated for the procedure"},{"letter":"D","text":"Confirmation of EKG lead placement if indicated for the procedure"}],"correct":"A","explanation":"<p>Original key: A. <strong>Agree.</strong></p>\n<p>Why A is correct: The WHO Surgical Safety Checklist &quot;Time-Out&quot; (immediately before incision) explicitly includes confirmation that prophylactic antibiotics were given within the appropriate window if indicated, along with team introductions, confirmation of patient/site/procedure, and review of anticipated critical events.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>B (Foley), C (ETT location), D (EKG lead placement): these are routine anesthetic/nursing setup items and are not the standardized Time-Out checklist confirmations; antibiotic prophylaxis is the checklist item among these.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":26,"stem":"Which of the following is an indication for the use of Fresh Frozen plasma:","options":[{"letter":"A","text":"Von Willebrand disease"},{"letter":"B","text":"Factor VIII deficiency"},{"letter":"C","text":"Fibrinogen deficiency"},{"letter":"D","text":"Massive transfusion"}],"correct":"D","explanation":"<p>Original key: D. <strong>Agree.</strong></p>\n<p>Why D is correct: FFP replaces multiple coagulation factors and is indicated in massive transfusion/massive hemorrhage (and in multi-factor deficiencies, DIC with bleeding, and urgent warfarin reversal when PCC is unavailable) (O&#x27;Shaughnessy et al., Br J Haematol, 2004; Shah et al., Semin Thromb Hemost, 2016).</p>\n<p>Why the others are incorrect (each has a more specific/targeted therapy):</p>\n<ul>\n<li>A (von Willebrand disease): treated with desmopressin or vWF/Factor VIII concentrates.</li>\n\n<li>B (Factor VIII deficiency/hemophilia A): treated with Factor VIII concentrate.</li>\n\n<li>C (fibrinogen deficiency): treated with cryoprecipitate or fibrinogen concentrate.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":27,"stem":"The Sign Out (Debrief) portion of the surgical safety checklist includes all of the following EXCEPT:","options":[{"letter":"A","text":"Identification of adverse events or equipment problems"},{"letter":"B","text":"Completion of counts"},{"letter":"C","text":"Recording of the procedure"},{"letter":"D","text":"Verification of patient position"}],"correct":"D","explanation":"<p>Original key: D. <strong>Agree.</strong></p>\n<p>Why D is correct: This is an &quot;EXCEPT&quot; question. Verification of patient position is part of the pre-incision Time-Out/Sign-In, not the Sign-Out. The Sign-Out (debrief) confirms the name of the procedure recorded, instrument/sponge/needle counts, specimen labeling, equipment problems, and key concerns for recovery.</p>\n<p>Why the others are incorrect (they ARE part of Sign-Out):</p>\n<ul>\n<li>A: reviewing adverse events/equipment problems is a core debrief item.</li>\n\n<li>B: confirming counts are correct is a Sign-Out item.</li>\n\n<li>C: confirming/recording what procedure was done is a Sign-Out item.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":28,"stem":"Risk factors for post-operative pulmonary complications include:","options":[{"letter":"A","text":"Obesity"},{"letter":"B","text":"Peri-operative transfusion"},{"letter":"C","text":"Diabetes"},{"letter":"D","text":"Well-controlled asthma"}],"correct":"B","explanation":"<p>Original key: Periop transfusion (B). <strong>Agree (with a nuance on obesity).</strong></p>\n<p>Why B is correct: Perioperative blood transfusion is a well-established, guideline- and NSQIP-cited independent risk factor for postoperative pulmonary complications (through TRALI, TACO, and transfusion-related immunomodulation); meta-analytic data show roughly a doubling of pulmonary complications (RR ~2.0) (Pang et al., World J Surg Oncol, 2019; Glance et al., Anesthesiology, 2011).</p>\n<p>Why the others are less correct:</p>\n<ul>\n<li>A (obesity): a plausible distractor and associated with atelectasis, but a comparatively weak and historically controversial independent predictor (adjusted OR ~1.1--1.7, and low relative to age, prolonged surgery, CHF, and COPD) (De Oliveira et al., J Am Coll Surg, 2017; Huang et al., Sci Rep, 2025). Among the listed options, perioperative transfusion is the strongest, classic answer.</li>\n\n<li>C (diabetes): not a consistently established independent risk factor for postoperative pulmonary complications.</li>\n\n<li>D (well-controlled asthma): well-controlled asthma is specifically NOT considered a significant risk factor for postoperative pulmonary complications.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":29,"stem":"Which of the following is the most common ECG finding in patients with a pulmonary embolism:","options":[{"letter":"A","text":"Sinus tachycardia"},{"letter":"B","text":"ST segment elevation"},{"letter":"C","text":"Electrical alternans"},{"letter":"D","text":"S1-Q3-T3 pattern"}],"correct":"A","explanation":"<p>Original key: A. <strong>Agree.</strong></p>\n<p>Why A is correct: Sinus tachycardia is the single most common ECG abnormality in acute PE; a 2025 systematic review/meta-analysis of 7,467 patients found sinus tachycardia in ~31%, more than any other finding (Krintratun et al., J Clin Med, 2025).</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>B (ST elevation): uncommon and, when present, more often misleads toward ACS.</li>\n\n<li>C (electrical alternans): associated with large pericardial effusion/tamponade, not PE.</li>\n\n<li>D (S1Q3T3): the &quot;classic&quot; teaching sign, but relatively infrequent (~15% or less) and low sensitivity --- not the most common.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":30,"stem":"A patient with an unrecognized latex allergy has developed an anaphylactic reaction intraoperatively. Immediate treatment includes:","options":[{"letter":"A","text":"Switch to non-latex gloves and equipment"},{"letter":"B","text":"Diphenhydramine and ranitidine (H1 and H2 histamine blockers) intravenously"},{"letter":"C","text":"Epinephrine intravenously, subcutaneously, or endotracheally"},{"letter":"D","text":"All of the above"}],"correct":"D","explanation":"<p>Original key: D (all of the above). <strong>Agree.</strong></p>\n<p>Why D is correct: Management of intraoperative anaphylaxis includes removing the trigger (switch to latex-free gloves/equipment), giving epinephrine (the first-line, life-saving drug), and adjunctive antihistamines (H1 and H2 blockers) --- so all listed measures apply.</p>\n<p>Why the others are incorrect (individually incomplete):</p>\n<ul>\n<li>A alone: removing the allergen is necessary but does not treat established anaphylaxis.</li>\n\n<li>B alone: antihistamines are adjuncts only and are not the primary treatment.</li>\n\n<li>C alone: epinephrine is the single most important drug, but complete management still includes allergen removal and adjuncts --- hence &quot;all of the above&quot; is the best answer.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":31,"stem":"The initial step in managing hypotension in an otherwise stable patient receiving epidural analgesia is:","options":[{"letter":"A","text":"IV fluid bolus"},{"letter":"B","text":"Norepinephrine"},{"letter":"C","text":"Decrease the rate of the epidural infusion"},{"letter":"D","text":"Vasopressin"}],"correct":"A","explanation":"<p>Original key: C (decrease epidural infusion). <strong>Disagree --- see note.</strong></p>\n<p>Why A is the better answer: Epidural-induced hypotension results from local-anesthetic sympathetic blockade causing vasodilation and reduced venous return. In an otherwise stable patient, the standard, most widely taught initial intervention is an IV crystalloid fluid bolus to restore preload, with a vasopressor added if hypotension persists. Guideline/consensus sources on neuraxial hypotension emphasize fluid loading and vasopressors (phenylephrine/ephedrine/norepinephrine) as the mainstays of treatment (ACOG Practice Bulletin, Obstetric Analgesia and Anesthesia, 2019; ASA Statement on Quality Metrics, 2022).</p>\n<p>Note on the disagreement: The original key selected C (decrease the epidural infusion rate). Reducing or holding the infusion is a reasonable adjunct to limit further sympathetic block, but the already-established block will not reverse quickly, so it is not the most effective immediate step. Standard teaching for the initial management of neuraxial hypotension is a fluid bolus (option A), which is why this key marks A as correct. If the exam&#x27;s intended framework treats &quot;reduce the causative infusion&quot; as the first maneuver, C would be their answer --- but this is the point of disagreement.</p>\n<p>Why the remaining options are not the initial step:</p>\n<ul>\n<li>B (norepinephrine): an appropriate vasopressor, but generally a second-line step after (or with) fluids; also a stronger agent than typically needed first for mild, stable hypotension.</li>\n\n<li>D (vasopressin): not a first-line agent for routine neuraxial-induced hypotension.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":32,"stem":"A 55 kg adult female patient is undergoing elective knee arthroplasty. The most appropriate antibiotic prophylaxis order is:","options":[{"letter":"A","text":"Cefazolin 2g IV within 60 minutes prior to skin incision"},{"letter":"B","text":"Cefazolin 1g IV within 30 minutes prior to skin incision"},{"letter":"C","text":"Cefazolin 2g IV immediately prior to skin incision"},{"letter":"D","text":"Cefazolin 1g IV immediately prior to skin incision"}],"correct":"A","explanation":"<p>--- agrees with the original key.</p>\n<p>Why A is correct: Cefazolin is the agent of choice for prosthetic joint arthroplasty, dosed by weight and given so that adequate tissue levels are present at incision. Guidelines and reviews recommend a weight-adjusted dose (2 g for most adults) administered 30--60 minutes before skin incision (Egerci et al., Archives of Orthopaedic and Trauma Surgery, 2024). The FDA label similarly specifies the preoperative dose be given 1/2 to 1 hour before the start of surgery (Cefazolin FDA label).</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>B: 1 g underdoses this indication; while 30 minutes is within the acceptable window, the weight-adjusted arthroplasty dose is 2 g, making A the better order.</li>\n\n<li>C: 2 g is the correct dose, but giving it &quot;immediately prior to skin incision&quot; does not allow time to reach therapeutic tissue concentrations at incision.</li>\n\n<li>D: Wrong on both dose (1 g) and timing (immediately prior).</li>\n</ul>\n<p>Background: For beta-lactam allergy, clindamycin or vancomycin is substituted; vancomycin should start 60--120 minutes before incision because of its longer infusion time (Egerci et al., 2024).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":33,"stem":"You are planning to analyze a study of the incidence of lung cancer in Canada; the following is considered a categorical variable:","options":[{"letter":"A","text":"FEV1"},{"letter":"B","text":"Age"},{"letter":"C","text":"Weight"},{"letter":"D","text":"Patient home province"}],"correct":"D","explanation":"<p>--- agrees with the original key.</p>\n<p>Why D is correct: Home province is a nominal categorical variable --- discrete, unordered groups with no inherent numeric value.</p>\n<p>Why the others are incorrect: FEV1 (a), age (b), and weight (c) are all continuous quantitative variables measured on a numeric scale.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":34,"stem":"A 45 year old was involved in a motorcycle collision. She has an open femoral fracture and partial contralateral foot amputation. She is slightly confused. Her vitals are: Heart rate 130 beats/minute, Blood pressure 80/60, Respiratory rate 36. What percentage of blood loss has she most likely lost?","options":[{"letter":"A","text":"0-15%"},{"letter":"B","text":"15-30%"},{"letter":"C","text":"30-40%"},{"letter":"D","text":"Over 40%"}],"correct":"C","explanation":"<p>--- agrees with the original key.</p>\n<p>Why C is correct: ATLS Class III hemorrhage (30--40%, ~1500--2000 mL) is defined by HR 120--140, a fall in systolic blood pressure, RR 30--40, and altered mental status (anxious/confused). This patient&#x27;s tachycardia (130), hypotension (80/60), tachypnea (36), and confusion fit Class III.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A (Class I, 0--15%): Normal vitals and mentation.</li>\n\n<li>B (Class II, 15--30%): Tachycardia with narrowed pulse pressure but blood pressure is still maintained and mentation only mildly anxious --- this patient is already hypotensive.</li>\n\n<li>D (Class IV, &gt;40%): Marked hypotension with negligible pulse pressure, HR &gt;140, RR &gt;35, lethargy/obtundation, and negligible urine output; her confusion is described as &quot;slight,&quot; favoring Class III over IV.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":35,"stem":"In regards to the Oxygen-hemoglobin dissociation curve, which statement is correct:","options":[{"letter":"A","text":"As the curve is shifted to the right, hemoglobin has an increased affinity for oxygen (easier to bind oxygen)."},{"letter":"B","text":"Red blood cell storage may cause a reduction in 2,3-diphosphoglycerate (2,3-DPG), which leads to a left shift in the curve."},{"letter":"C","text":"Hemorrhagic shock can lead to hypothermia, which leads to a rightward shift in the curve."},{"letter":"D","text":"Decreased tissue perfusion in shock can lead to inadequate tissue perfusion and acidosis, leading to a left shift in the curve."}],"correct":"B","explanation":"<p>--- agrees with the original key.</p>\n<p>Why B is correct: Stored RBCs lose ~90% of their 2,3-DPG within about 2 weeks; low 2,3-DPG increases hemoglobin&#x27;s oxygen affinity and shifts the curve left, impairing peripheral oxygen offloading (Scott et al., Anesthesia &amp; Analgesia, 2016; Adams et al., BioMed Research International, 2014).</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A: A rightward shift indicates decreased oxygen affinity (easier unloading), not increased affinity.</li>\n\n<li>C: Hypothermia increases oxygen affinity and shifts the curve left, not right.</li>\n\n<li>D: Acidosis (Bohr effect) shifts the curve right, favoring oxygen release --- not left.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":36,"stem":"Which of the following is true:","options":[{"letter":"A","text":"In situ cancer refers to tumors in which the malignant cells are demonstrated to breach the basement membrane and penetrate into the surrounding stroma."},{"letter":"B","text":"Dysplasia refers to cells that look abnormal under a microscope but are not cancer."},{"letter":"C","text":"Metaplasia describes the uncontrolled proliferation of cells."},{"letter":"D","text":"Neoplasia is the state of being not typical or normal (abnormality in cells tissue)."}],"correct":"B","explanation":"<p>--- agrees with the original key (which noted &quot;A is an invasive cancer&quot;).</p>\n<p>Why B is correct: Dysplasia denotes disordered, atypical-appearing cells that are premalignant but not yet cancer.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A: Breaching the basement membrane defines invasive carcinoma; carcinoma in situ is confined by the basement membrane.</li>\n\n<li>C: Metaplasia is the reversible replacement of one differentiated cell type by another, not uncontrolled proliferation (that describes neoplasia).</li>\n\n<li>D: Neoplasia is new, autonomous, unregulated growth of tissue --- not merely &quot;abnormality.&quot;</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":37,"stem":"Which of the following statements is true with regards to the AJCC (American Joint Committee on Cancer) TNM staging system:","options":[{"letter":"A","text":"M1, M2, M3 and M4 describe increasing abnormalities based on size of the primary tumour."},{"letter":"B","text":"Many solid tumors are graded as N0 or N1 depending on the absence or presence of lymph node involvement."},{"letter":"C","text":"Tx suggests a large primary tumour."},{"letter":"D","text":"It is only applicable to truncal malignancies."}],"correct":"B","explanation":"<p>--- agrees with the original key.</p>\n<p>Why B is correct: N describes regional lymph node status; N0 = no nodal involvement, N1 (and higher) = increasing nodal involvement.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A: M denotes distant metastasis (M0/M1), not primary tumor size; size is captured by T.</li>\n\n<li>C: Tx means the primary tumor cannot be assessed, not that it is large.</li>\n\n<li>D: TNM applies to malignancies throughout the body, not only truncal ones.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":38,"stem":"A 16 year old male is diagnosed with an osteosarcoma of his proximal tibia. His mother was diagnosed with breast cancer at age 40 and his cousin was diagnosed with a rhabdomyosarcoma. This is most consistent with:","options":[{"letter":"A","text":"Familial Adenomatous Polyposis"},{"letter":"B","text":"Multiple Endocrine Neoplasia Type 2 (MEN2)"},{"letter":"C","text":"PTEN (gene mutated in multiple advanced cancers 1 / MMAC1)"},{"letter":"D","text":"Li-Fraumeni Syndrome"}],"correct":"D","explanation":"<p>--- agrees with the original key.</p>\n<p>Why D is correct: Li-Fraumeni syndrome (germline TP53 mutation) classically clusters sarcomas (osteosarcoma, soft-tissue/rhabdomyosarcoma), early-onset breast cancer, brain tumors, and adrenocortical carcinoma --- matching this family.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A: FAP causes colorectal adenomatous polyposis/carcinoma (APC gene), not this sarcoma/breast cluster.</li>\n\n<li>B: MEN2 causes medullary thyroid carcinoma, pheochromocytoma, and parathyroid disease.</li>\n\n<li>C: PTEN (Cowden syndrome) causes hamartomas with breast, thyroid, and endometrial cancers, not this childhood-sarcoma pattern.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":39,"stem":"ALL of the following are associated with the conversion of normal cells into malignant cells:","options":[{"letter":"A","text":"Resisting cell death; Enabling replicative immortality, Inducing apoptosis; Tumor promoting anti-inflammation."},{"letter":"B","text":"Sustaining proliferative signaling; Avoiding immune destruction; Inducing apoptosis, Evading growth suppressors."},{"letter":"C","text":"Inducing angiogenesis; Enabling replicative immortality; Resisting cell death; Evading growth suppressors."},{"letter":"D","text":"Accelerated cell death, Avoiding immune destruction; Inducing angiogenesis; Tumor promoting anti-inflammation."}],"correct":"C","explanation":"<p>--- agrees with the original key.</p>\n<p>Why C is correct: All four listed are recognized hallmarks of cancer (Hanahan &amp; Weinberg): inducing angiogenesis, enabling replicative immortality, resisting cell death, and evading growth suppressors.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A and B: Both contain &quot;inducing apoptosis,&quot; but cancers resist/evade apoptosis; A also lists &quot;anti-inflammation&quot; whereas the hallmark is tumor-promoting inflammation.</li>\n\n<li>D: &quot;Accelerated cell death&quot; is the opposite of resisting apoptosis, and &quot;anti-inflammation&quot; is incorrect.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":40,"stem":"Radiation therapy in the setting of cancer treatment targets which cell component:","options":[{"letter":"A","text":"Nucleus"},{"letter":"B","text":"Mitochondria"},{"letter":"C","text":"Golgi complex"},{"letter":"D","text":"Cell membrane"}],"correct":"A","explanation":"<p>--- agrees with the original key.</p>\n<p>Why A is correct: Ionizing radiation exerts its lethal effect primarily through DNA damage (double-strand breaks) in the nucleus, directly and via reactive oxygen species.</p>\n<p>Why the others are incorrect: Mitochondria (b), Golgi (c), and the cell membrane (d) are not the principal targets of therapeutic radiation.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":41,"stem":"Which of the following is a contraindication to the use of Octaplex:","options":[{"letter":"A","text":"Factor 5 Leiden"},{"letter":"B","text":"Heparin Induced Thrombocytopenia"},{"letter":"C","text":"Patient with a deep vein thrombosis within the last year"},{"letter":"D","text":"Patient on Apixaban (Eliquis)"}],"correct":"B","explanation":"<p>--- agrees with the original key.</p>\n<p>Why B is correct: Octaplex is a 4-factor prothrombin complex concentrate that contains heparin; it is contraindicated in patients with heparin-induced thrombocytopenia (Rodgers, American Journal of Hematology, 2012; Rocca &amp; ten Cate, New England Journal of Medicine, 2026). In a HIT history, a heparin-free 3-factor PCC (Factor IX complex) is used instead (NCCN Cancer-Associated VTE Guideline, 2026).</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A: Factor V Leiden is a prothrombotic state warranting caution but is not an absolute labeled contraindication.</li>\n\n<li>C: A remote DVT is a relative thrombotic risk factor, not a contraindication.</li>\n\n<li>D: PCC is in fact used to reverse factor Xa inhibitor--associated bleeding when specific reversal agents are unavailable; apixaban use is not a contraindication.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":42,"stem":"Identify the proto-oncogene that supports tumour growth through gene amplification:","options":[{"letter":"A","text":"BRCA1"},{"letter":"B","text":"Ras (via gene mutation)"},{"letter":"C","text":"HER2/neu"},{"letter":"D","text":"p53"}],"correct":"C","explanation":"<p>--- agrees with the original key.</p>\n<p>Why C is correct: HER2/neu (ERBB2) is a proto-oncogene that drives tumor growth via gene amplification (e.g., in breast cancer).</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A and D: BRCA1 and p53 are tumor suppressor genes, not amplified proto-oncogenes.</li>\n\n<li>B: Ras is activated by point mutation, not gene amplification (as the option itself states).</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":43,"stem":"Which one of these statements is true?","options":[{"letter":"A","text":"Barrett's esophagus is an example of intestinal anaplasia"},{"letter":"B","text":"In situ cancer means that it does cross the basal membrane"},{"letter":"C","text":"Benign tumors are often associated with cell anaplasia"},{"letter":"D","text":"Hyperplasia happens when there is a multiplication of benign cells"}],"correct":"D","explanation":"<p>--- agrees with the original key.</p>\n<p>Why D is correct: Hyperplasia is an increase in the number of otherwise normal (benign) cells.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A: Barrett&#x27;s esophagus is intestinal metaplasia, not anaplasia.</li>\n\n<li>B: Carcinoma in situ does not cross the basement membrane (crossing it defines invasion).</li>\n\n<li>C: Anaplasia (loss of differentiation) is a feature of malignant, not benign, tumors.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":44,"stem":"Which of the following improve cardiac output:","options":[{"letter":"A","text":"Beta-blockers"},{"letter":"B","text":"Diuretics"},{"letter":"C","text":"Inotropic drugs"},{"letter":"D","text":"Postoperative atrial fibrillation"}],"correct":"C","explanation":"<p>--- agrees with the original key.</p>\n<p>Why C is correct: Positive inotropes increase myocardial contractility and stroke volume, raising cardiac output.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A: Beta-blockers reduce heart rate and contractility, lowering cardiac output acutely.</li>\n\n<li>B: Diuretics reduce preload/volume and do not directly increase output.</li>\n\n<li>D: Atrial fibrillation with loss of atrial kick and rapid rates typically reduces cardiac output.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":45,"stem":"Which of the following materials will elicit the least local inflammatory response?","options":[{"letter":"A","text":"Chromic"},{"letter":"B","text":"Silk"},{"letter":"C","text":"Teflon coated dexon"},{"letter":"D","text":"Polyprolylene"}],"correct":"D","explanation":"<p>--- agrees with the original key.</p>\n<p>Why D is correct: Polypropylene (e.g., Prolene) is an inert, nonabsorbable monofilament that provokes minimal tissue reaction.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A: Chromic gut is absorbable and elicits a notable inflammatory/proteolytic reaction.</li>\n\n<li>B: Silk is a braided natural material with one of the highest tissue-reactivity profiles.</li>\n\n<li>C: Dexon (polyglycolic acid) is absorbable and more reactive than an inert monofilament.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":46,"stem":"Vitamin C is important for which step in wound healing:","options":[{"letter":"A","text":"Hydroxylation of Proline to Hydroxyproline"},{"letter":"B","text":"Conversion of Procollagen to Collagen"},{"letter":"C","text":"Collagen Cross Linking"},{"letter":"D","text":"Collagen Secretion by Fibroblasts"}],"correct":"A","explanation":"<p>--- agrees with the original key.</p>\n<p>Why A is correct: Vitamin C (ascorbate) is a required cofactor for prolyl (and lysyl) hydroxylase, enabling hydroxylation of proline to hydroxyproline --- essential for stable collagen triple-helix formation.</p>\n<p>Why the others are incorrect: Procollagen cleavage (b), cross-linking (c, largely lysyl oxidase/copper-dependent), and fibroblast secretion (d) are downstream steps not directly dependent on the ascorbate-requiring hydroxylation reaction.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":47,"stem":"Following laparotomy, which is most often contributing to post-operative wound dehiscence:","options":[{"letter":"A","text":"Increased intra-abdominal pressure"},{"letter":"B","text":"Anemia"},{"letter":"C","text":"Diabetes mellitus"},{"letter":"D","text":"Advanced age"}],"correct":"A","explanation":"<p>--- agrees with the original key.</p>\n<p>Why A is correct: Acutely raised intra-abdominal pressure (coughing, vomiting, ileus/distension, straining) mechanically stresses the fascial closure and is the leading immediate contributor to abdominal wound/fascial dehiscence.</p>\n<p>Why the others are incorrect: Anemia (b), diabetes (c), and advanced age (d) impair healing and are risk factors, but the most common precipitating mechanical factor is increased intra-abdominal pressure.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":48,"stem":"Which of the following is most significant in preventing diathermy injury:","options":[{"letter":"A","text":"Strength of the Current"},{"letter":"B","text":"The Contact Surface Area of the Ground"},{"letter":"C","text":"Distance of the Ground from the Cathode"},{"letter":"D","text":"The Waveform of the Current"}],"correct":"B","explanation":"<p>--- agrees with the original key.</p>\n<p>Why B is correct: A large contact surface area of the return (dispersive/ground) electrode distributes current at low density, preventing focal heating and burns; a small or partially detached pad concentrates current and causes injury.</p>\n<p>Why the others are incorrect: Current strength (a) and waveform (d) determine the cutting/coagulation effect but are managed at the active electrode; distance from the &quot;cathode&quot; (c) is not the key determinant of return-electrode burns.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":49,"stem":"Which of the following is NOT part of the American College of Surgeons Code of Professional conduct:","options":[{"letter":"A","text":"Acknowledge and support the needs of patients' families"},{"letter":"B","text":"Respect the knowledge, dignity, and perspective of other health care professionals"},{"letter":"C","text":"Disclose adverse events and medical errors only if they cause serious harm"},{"letter":"D","text":"Serve as effective advocates of our patients' needs"}],"correct":"C","explanation":"<p>--- agrees with the original key.</p>\n<p>Why C is correct: The Code calls for honest, transparent disclosure of adverse events and errors --- not disclosure limited to cases of serious harm. Conditioning disclosure on severity of harm is contrary to the Code.</p>\n<p>Why the others are incorrect: Supporting families (a), respecting other professionals (b), and advocating for patients (d) are all affirmative elements of the ACS Code of Professional Conduct.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":50,"stem":"A man has 1st degree burns to his entire right arm, 2nd degree burns to his anterior thorax and abdomen and 3rd degree burns circumferentially to his left thigh and lower leg. The total percent Body Surface Area (% BSA) burned is:","options":[{"letter":"A","text":"18%"},{"letter":"B","text":"27%"},{"letter":"C","text":"35%"},{"letter":"D","text":"45%"}],"correct":"C","explanation":"<p>--- agrees with the original key.</p>\n<p>Why C is correct: First-degree (superficial) burns are excluded from %TBSA. By the rule of nines, the anterior thorax and abdomen (anterior trunk) \u2248 18% (second degree), and a circumferential left thigh (~9%) plus circumferential left lower leg (~9%) \u2248 18% (third degree), totaling roughly 36% --- best matched by 35%.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A (18%): Counts only one region.</li>\n\n<li>B (27%): Undercounts the combined trunk and lower-limb burns.</li>\n\n<li>D (45%): Would require counting the first-degree right arm, which is excluded, and overstates the leg contribution.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":51,"stem":"Which type of von Willebrand's disease is usually unresponsive to treatment with desmopressin and may require VWF concentrates:","options":[{"letter":"A","text":"Type 1"},{"letter":"B","text":"Type 2"},{"letter":"C","text":"Type 3"},{"letter":"D","text":"The acquired variant"}],"correct":"C","explanation":"<p>--- agrees with the original key.</p>\n<p>Why C is correct: Type 3 VWD has a near-complete absence of endogenous VWF, so desmopressin (which releases stored endothelial VWF) is ineffective; treatment requires VWF \u00b1 FVIII concentrate. Desmopressin is considered contraindicated in type 3 because of lack of efficacy (ASH/ISTH/NHF/WFH 2021 VWD Guidelines; Leebeek &amp; Atiq, British Journal of Haematology, 2019).</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A: Most type 1 patients (especially VWF \u22650.30 IU/mL) respond to desmopressin.</li>\n\n<li>B: Many type 2 subtypes respond partially; type 2B is avoided due to thrombocytopenia, but type 3 is the classic &quot;unresponsive, needs concentrate&quot; answer.</li>\n\n<li>D: Acquired VWD is managed variably (e.g., IVIG, treating the underlying disorder); type 3 is the intended answer.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":52,"stem":"The following are all findings of a traumatic aortic disruption on a chest radiograph:","options":[{"letter":"A","text":"Widened mediastinum, left sided tracheal deviation, depression of right main stem bronchus"},{"letter":"B","text":"Deviation NG tube to the right, depression of left main stem bronchus, apical or pleural cap"},{"letter":"C","text":"Loss of space between pulm artery and aorta, right hemothorax, # of 1st rib / 2nd rib / scapula"},{"letter":"D","text":"Widened paratracheal stripe, mediastinal width > 8cm, left sided tracheal deviation"}],"correct":"B","explanation":"<p>--- the original key marked this &quot;?&quot;; the answer key here selects B, and this is noted as a disagreement (the item was left unanswered).</p>\n<p>Why B is correct: The recognized radiographic signs of traumatic aortic injury include rightward deviation of the trachea and nasogastric tube, depression of the left mainstem bronchus, and a left apical/pleural cap --- all three appear in option B and are internally consistent (American Society of Echocardiography multimodality imaging statement, 2015; 2022 ACC/AHA Aortic Disease Guideline).</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A: Tracheal deviation is rightward (not left), and it is the left mainstem bronchus that is depressed (not the right) --- two errors.</li>\n\n<li>C: Loss of the aortopulmonary window and 1st/2nd rib fractures are genuine associations, but the hemothorax of aortic injury is characteristically left-sided, not right.</li>\n\n<li>D: Widened paratracheal stripe and mediastinal width &gt;8 cm are valid, but tracheal deviation is rightward, not left.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":53,"stem":"In a patient with Childs Class B cirrhosis, which of the following coagulation associated factors is LEAST likely to be affected:","options":[{"letter":"A","text":"Factor V"},{"letter":"B","text":"Factor VII"},{"letter":"C","text":"Factor VIII"},{"letter":"D","text":"Factor IX"}],"correct":"C","explanation":"<p>--- agrees with the original key.</p>\n<p>Why C is correct: Factor VIII is synthesized largely by hepatic sinusoidal endothelium and extrahepatic endothelium and behaves as an acute-phase reactant; it is typically preserved or even elevated in cirrhosis, making it the least likely to fall.</p>\n<p>Why the others are incorrect: Factors V (a), VII (b), and IX (d) are hepatocyte-synthesized and decline with impaired hepatic synthetic function; factor VII, with the shortest half-life, falls earliest.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":54,"stem":"A 37 year old man is involved in a high speed motor vehicle collision. He is hemodynamically stable. A supine chest x-ray shows a pulmonary contusion and possible widened mediastinum. What is the most appropriate study to diagnose the presence of a traumatic injury to the aorta?","options":[{"letter":"A","text":"FAST scan"},{"letter":"B","text":"Helical thin-cut CT angiography"},{"letter":"C","text":"Thoracic aortogram"},{"letter":"D","text":"Diagnostic Peritoneal Lavage"}],"correct":"B","explanation":"<p>--- agrees with the original key.</p>\n<p>Why B is correct: In a hemodynamically stable patient, CT angiography of the chest is the diagnostic modality of choice for blunt traumatic aortic injury --- rapid, widely available, with sensitivity approaching 100% and a very high negative predictive value (EAST Practice Management Guideline, 2015; 2021 ACC/AHA Chest Pain Guideline; Granieri et al. meta-analysis, J Trauma Acute Care Surg, 2025).</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A: FAST evaluates for hemoperitoneum/pericardial fluid, not the thoracic aorta.</li>\n\n<li>C: Aortography is invasive and now reserved for equivocal cases or endovascular intervention, not first-line screening/diagnosis.</li>\n\n<li>D: DPL assesses intra-abdominal hemorrhage, not aortic injury.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":55,"stem":"Essential skills for developing cultural competence include all of the following EXCEPT:","options":[{"letter":"A","text":"Knowledge, respect, and validation of differing values, cultures, and beliefs, including sexual orientation, gender, age, race, ethnicity, and class"},{"letter":"B","text":"Dealing with hostility and discomfort as a result of cultural discord"},{"letter":"C","text":"Understanding language barriers and working with interpreters"},{"letter":"D","text":"Eliciting a social and medical history based on the culture of t
