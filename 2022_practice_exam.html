he current Country in which the patient lives"}],"correct":"D","explanation":"<p>--- agrees with the original key.</p>\n<p>Why D is correct: Cultural competence requires eliciting history in the context of the patient&#x27;s own culture and beliefs, not the culture of the country in which they currently reside; assuming the latter is itself a cultural bias.</p>\n<p>Why the others are incorrect: Respecting/validating differing values (a), managing cultural discord (b), and using interpreters/addressing language barriers (c) are all core cultural-competence skills.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":56,"stem":"In which of the following procedures are prophylactic antibiotics indicated:","options":[{"letter":"A","text":"Scheduled cholecystectomy in a 65 yo male"},{"letter":"B","text":"Scheduled splenectomy for ITP (Immune Thrombocytopenic Purpura) in a 35 yo female"},{"letter":"C","text":"Emergency Colonoscopy in a 78 year old male"},{"letter":"D","text":"Emergency caesarian section in a 25 yo female"}],"correct":"D","explanation":"<p>--- agrees with the original key.</p>\n<p>Why D is correct: Cesarean delivery is a clean-contaminated procedure for which preoperative antibiotic prophylaxis is a standard, evidence-based measure that reduces postoperative infection.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A: Routine prophylaxis in low-risk elective cholecystectomy is not clearly indicated (reserved for high-risk features such as age &gt;70, acute cholecystitis, or common-duct stones).</li>\n\n<li>B: Elective splenectomy management centers on preoperative vaccination against encapsulated organisms rather than routine surgical antibiotic prophylaxis.</li>\n\n<li>C: Colonoscopy (even urgent, diagnostic) does not routinely require antibiotic prophylaxis.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":57,"stem":"A 45 yo woman presents with a 1 cm chronic ulceration of the skin over a burn scar on the forearm. The lesion is there for 6 months and is not painful. She was burned 15 years ago and no skin graft was needed. Which of the following is the most likely diagnosis?","options":[{"letter":"A","text":"Squamous cell carcinoma"},{"letter":"B","text":"Malignant fibrous histiocytoma"},{"letter":"C","text":"Chronic infection"},{"letter":"D","text":"Heterotopic ossification"}],"correct":"A","explanation":"<p>--- agrees with the original key.</p>\n<p>Why A is correct: A chronic, non-healing ulcer arising in an old burn scar is a Marjolin ulcer --- most commonly a well-differentiated squamous cell carcinoma.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>B: Malignant fibrous histiocytoma can arise in scars but is far less common than SCC in this classic presentation.</li>\n\n<li>C: A stable 6-month lesion without systemic or local signs of infection is better explained by malignant degeneration.</li>\n\n<li>D: Heterotopic ossification is deep soft-tissue/periarticular bone formation, not a cutaneous ulcer.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":58,"stem":"A patient is undergoing preoperative evaluation. When asked to open her mouth, you can see the soft palate and only the base of the uvula. According to the Mallampati Classification, she is:","options":[{"letter":"A","text":"Class I"},{"letter":"B","text":"Class II"},{"letter":"C","text":"Class III"},{"letter":"D","text":"Class IV"}],"correct":"C","explanation":"<p>--- agrees with the original key.</p>\n<p>Why C is correct: Mallampati Class III = soft palate and base of the uvula visible.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A (Class I): Soft palate, fauces, entire uvula, and pillars visible.</li>\n\n<li>B (Class II): Soft palate, fauces, and uvula visible.</li>\n\n<li>D (Class IV): Only the hard palate visible; soft palate not seen.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":59,"stem":"A 46 yo woman is about to have an elective laparoscopic cholecystectomy. She has asthma, which is well controlled with occasional salbutamol. Which of the following corresponds to her ASA score?","options":[{"letter":"A","text":"I"},{"letter":"B","text":"II"},{"letter":"C","text":"III"},{"letter":"D","text":"IV"}],"correct":"B","explanation":"<p>--- agrees with the original key.</p>\n<p>Why B is correct: ASA II = a patient with mild systemic disease that is well controlled and without substantive functional limitation; well-controlled asthma is the standard example.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A (ASA I): A normal healthy patient with no systemic disease.</li>\n\n<li>C (ASA III): Severe systemic disease with substantive functional limitation (e.g., poorly controlled asthma with recent exacerbations).</li>\n\n<li>D (ASA IV): Severe systemic disease that is a constant threat to life.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":60,"stem":"An adult trauma patient presents after having suffered extensive facial injuries and cannot be intubated. What are your landmarks for an emergency airway?","options":[{"letter":"A","text":"Palpate the sternal notch and make the incision into the airway approximately 2 cm above this"},{"letter":"B","text":"Palpate the thyroid notch of the thyroid cartilage and make the incision just above this"},{"letter":"C","text":"Palpate the cricoid cartilage and make the incision into the airway just above this"},{"letter":"D","text":"Palpate the cricoid cartilage and make the incision into the airway just below this"}],"correct":"C","explanation":"<p>(agrees with the provided key)</p>\n<p><strong>Why C is correct:</strong> Emergency cricothyroidotomy is performed through the cricothyroid membrane, a soft midline space bounded by the thyroid cartilage superiorly and the cricoid cartilage inferiorly. Palpating the cricoid cartilage and incising just above it places the incision directly over this membrane, which is the target for front-of-neck access (Accilien et al., Journal of Medical Insight, 2024; \u0160ifrer et al., European Archives of Oto-Rhino-Laryngology, 2021).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A</strong> --- The suprasternal notch is only used as a distal reference for incision length when landmarks are impalpable (an ~80 mm vertical incision commencing ~30 mm above the notch); it is not the site of airway entry, and &quot;2 cm above the sternal notch&quot; does not reliably localize the cricothyroid membrane (Fennessy et al., British Journal of Anaesthesia, 2019).</li>\n\n<li><strong>B</strong> --- Incising just above the thyroid notch enters the thyrohyoid region above the larynx, not the airway; the cricothyroid membrane lies below the thyroid cartilage.</li>\n\n<li><strong>D</strong> --- Incising just below the cricoid cartilage enters the trachea below the cricoid ring rather than the cricothyroid membrane and risks bleeding and posterior wall/esophageal injury.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":61,"stem":"A 55 year old male suffers serious head trauma from an MVA. In the emergency department is mumbling incomprehensibly and not following any commands. When you apply sternal rub, he moans with his eyes closed. When you apply pressure to his thumb nail he pulls his hand away. What is his GCS?","options":[{"letter":"A","text":"5"},{"letter":"B","text":"6"},{"letter":"C","text":"7"},{"letter":"D","text":"8"}],"correct":"C","explanation":"<p>(agrees with the provided key)</p>\n<p><strong>Why C is correct:</strong> Scoring the three components (Baucher et al., PLoS One, 2025):</p>\n<ul>\n<li><strong>Eye = 1</strong> --- eyes remain closed even to a painful sternal rub (no eye opening).</li>\n\n<li><strong>Verbal = 2</strong> --- mumbling/moaning represents incomprehensible sounds.</li>\n\n<li><strong>Motor = 4</strong> --- pulling the hand away from nailbed pressure is withdrawal from pain (not localizing, which would require reaching toward a central stimulus).</li>\n</ul>\n<p>Total = 1 + 2 + 4 = <strong>7</strong>, which falls in the severe TBI range.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A (5)</strong> and <strong>B (6)</strong> --- would require a lower motor score (e.g., abnormal flexion = 3 or extension = 2); the patient withdraws (M4), so the sum cannot be 5 or 6.</li>\n\n<li><strong>D (8)</strong> --- would require, for example, eye opening to pain (E2); his eyes stay closed (E1), so the total is 7, not 8.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":62,"stem":"Informed consent requires:","options":[{"letter":"A","text":"Capacity, disclosure, understanding, free of coercion"},{"letter":"B","text":"Capacity, disclosure, maturity, autonomy"},{"letter":"C","text":"Capacity, disclosure, maturity, autonomy"},{"letter":"D","text":"Capacity, competence, autonomy, free of coercion"}],"correct":"A","explanation":"<p>(agrees with the provided key)</p>\n<p><strong>Why A is correct:</strong> Valid informed consent rests on the patient having decision-making <strong>capacity</strong>, receiving adequate <strong>disclosure</strong> of relevant information, <strong>understanding/comprehending</strong> that information, and making a <strong>voluntary</strong> choice free of coercion (with authorization following). This maps precisely to option A (Grady, New England Journal of Medicine, 2015; Sattin et al., Neurology/AAN Position Statement, 2022).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>B and C</strong> (identical as printed) --- &quot;maturity&quot; is not a formal element of adult informed consent, and they omit the essential requirement of understanding and voluntariness. Autonomy is the underlying principle, not a discrete procedural element replacing comprehension.</li>\n\n<li><strong>D</strong> --- substitutes &quot;competence&quot; (a legal determination) and &quot;autonomy&quot; for the core elements and omits both disclosure of understandable information and comprehension; it is less complete than A.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":63,"stem":"A 35 year old female fell from a 2 story construction site and suffered a femur fracture and spinal cord injury. She is stable and has just returned from the OR where she underwent repair of the femur fracture. There is no active bleeding. What venous thromboembolic prophylaxis orders are most appropriate?","options":[{"letter":"A","text":"Pneumatic stockings and early ambulation"},{"letter":"B","text":"Dalteparin (Fragmin) 5000 units subcutaneously daily"},{"letter":"C","text":"Enoxaparin (Lovenox) 30 mg subcutaneously daily"},{"letter":"D","text":"Heparin 5000 units subcutaneously twice a day"}],"correct":"B","explanation":"<p>(agrees with the provided key)</p>\n<p><strong>Why B is correct:</strong> This patient is at especially high VTE risk (major trauma with acute spinal cord injury plus a lower-extremity fracture) with no active bleeding, so pharmacologic prophylaxis with low-molecular-weight heparin is indicated. Dalteparin 5000 units SC daily is the correct high-risk prophylactic dose, and LMWH is preferred over unfractionated heparin in this population (Gould et al., ACCP Guidelines, Chest, 2012; Ley et al., Western Trauma Association Algorithm, Journal of Trauma and Acute Care Surgery, 2020; Weitz, New England Journal of Medicine, 1997).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A</strong> --- Mechanical prophylaxis with early ambulation is inadequate as sole prophylaxis in a spinal-cord-injured patient who cannot ambulate; guidelines recommend adding mechanical measures to pharmacologic prophylaxis, not substituting for it, in high-risk trauma (Gould et al., Chest, 2012).</li>\n\n<li><strong>C</strong> --- Enoxaparin 30 mg <strong>once daily</strong> is an inadequate regimen; the validated prophylactic dosing in spinal cord injury/trauma is 30 mg twice daily (or 40 mg twice daily as increasingly standard in trauma), so once-daily 30 mg underdoses this high-risk patient (Weitz, New England Journal of Medicine, 1997; Ley et al., 2020).</li>\n\n<li><strong>D</strong> --- Low-dose unfractionated heparin is less effective than LMWH in acute spinal cord injury and is not the preferred agent for this especially-high-risk group (Gould et al., Chest, 2012).</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":64,"stem":"Which of the following is TRUE about Informed consent:","options":[{"letter":"A","text":"Ensures the patient understands the diagnostic or therapeutic intervention, while giving the patient an opportunity to ask questions or seek a second opinion"},{"letter":"B","text":"Is synonymous with signing the consent form"},{"letter":"C","text":"Is different from shared decision making"},{"letter":"D","text":"Involves autonomy of the patients and can occur regardless of the capacity of the patient to make their own decisions"}],"correct":"A","explanation":"<p>(agrees with the provided key)</p>\n<p><strong>Why A is correct:</strong> Informed consent is an ongoing communication process that ensures the patient understands the nature and purpose of the intervention, its risks, benefits, and alternatives, and provides the opportunity to ask questions (and, implicitly, to seek further information or a second opinion) before authorizing care (ACR--SIR--SPR Practice Parameter on Informed Consent, 2021; Grady, New England Journal of Medicine, 2015).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>B</strong> --- Consent is explicitly <em>not</em> the mere act of signing a form; the signature documents but does not constitute the consent process (ACR--SIR--SPR, 2021).</li>\n\n<li><strong>C</strong> --- Informed consent and shared decision making overlap and are complementary rather than fundamentally distinct; consent is the culmination of a shared, participatory dialogue (ACOG Committee Opinion, 2021).</li>\n\n<li><strong>D</strong> --- Valid consent requires that the patient have decision-making capacity; when capacity is lacking, a surrogate provides authorization. Consent cannot proceed &quot;regardless&quot; of capacity (Grady, New England Journal of Medicine, 2015).</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":65,"stem":"In healthy individuals, which of the following locations in the human body generally does not possess resident microflora (microbes):","options":[{"letter":"A","text":"Skin"},{"letter":"B","text":"Biliary tract"},{"letter":"C","text":"Oropharynx"},{"letter":"D","text":"Distal colon"}],"correct":"B","explanation":"<p>(agrees with the provided key)</p>\n<p><strong>Why B is correct:</strong> In healthy individuals bile is classically bacteriologically sterile: tight junctions between hepatocytes, a competent sphincter of Oddi, antibacterial bile salts, biliary IgA, and continuous bile flow keep the biliary tract free of resident organisms. Culture studies of bile from people without biliary pathology yield no growth, whereas bacterobilia appears with obstruction or stones (Subhani et al., Alimentary Pharmacology &amp; Therapeutics, 1999; Tajeddin et al., European Journal of Clinical Microbiology &amp; Infectious Diseases, 2016).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A (skin)</strong>, <strong>C (oropharynx)</strong>, and <strong>D (distal colon)</strong> are all heavily colonized by dense resident microbial communities in health; the distal colon in particular carries the highest bacterial load in the body.</li>\n</ul>\n<p>Nuance: newer culture-independent 16S rRNA studies suggest a low-biomass biliary microbiome may exist, but by the classic culture-based teaching this question tests, the biliary tract is the sterile site --- B remains correct.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":66,"stem":"The diagnosis of a necrotizing soft tissue infection is made by:","options":[{"letter":"A","text":"Bacterial cultures"},{"letter":"B","text":"Air on x-ray"},{"letter":"C","text":"Clinical findings"},{"letter":"D","text":"Operative findings"}],"correct":"C","explanation":"<p>--- agrees with the provided key, with one important caveat noted below.</p>\n<p><strong>Why C is correct:</strong> Necrotizing soft tissue infection is fundamentally a <strong>clinical diagnosis</strong>. The decision to act rests on clinical features---pain out of proportion to exam, rapid progression, systemic toxicity, tenderness beyond visible erythema---and treatment (emergent surgical exploration) must not be delayed for laboratory tests or imaging. About 50% of cases are initially misdiagnosed, so a high index of clinical suspicion is paramount (White et al., Bone &amp; Joint Journal, 2026; McDermott et al., JAMA Surgery, 2024; Hua et al., Lancet Infectious Diseases, 2023).</p>\n<p><strong>Important caveat (why D is defensible):</strong> Surgical exploration is described as the confirmatory gold standard, revealing grey necrotic fascia, &quot;dishwater&quot; pus, non-contracting muscle, lack of bleeding, and a positive finger test (Hua et al., Lancet Infectious Diseases, 2023; Cochrane review, Hua et al., 2018). If this exam intends &quot;definitive confirmation,&quot; operative findings (D) would be the answer. However, as written---contrasting clinical judgment against tests that should never delay the operating room---the intended teaching point is that the <em>diagnosis is clinical</em> (C). The key&#x27;s answer is accepted, with the understanding that clinical suspicion mandates operative exploration, which then confirms it.</p>\n<p><strong>Why A and B are incorrect:</strong></p>\n<ul>\n<li><strong>A</strong> --- Cultures require days, so they cannot make a time-critical diagnosis; deep tissue cultures obtained at operation guide antibiotics but do not establish the initial diagnosis (Stevens et al., IDSA Guidelines, 2014).</li>\n\n<li><strong>B</strong> --- Gas on plain radiography has poor sensitivity (~25--49% of cases) and its absence never excludes necrotizing infection; imaging must not delay surgery (Fernando et al., Annals of Surgery, 2019).</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":67,"stem":"Which of the following statement about the impact of nutrition in wound healing is TRUE:","options":[{"letter":"A","text":"Vitamin C deficiency affects collagen contraction"},{"letter":"B","text":"Vitamin B6 deficiency causes impaired collagen cross-linking"},{"letter":"C","text":"Vitamin A deficiency affects collagen production"},{"letter":"D","text":"Vitamin K deficiency leads to impaired fibroplasia"}],"correct":"C","explanation":"<p>(the provided key states &quot;Not A&quot;; the specific true statement is <strong>C</strong>)</p>\n<p><strong>Why C is correct:</strong> Vitamin A is required for normal wound healing; retinoic acid enhances production of extracellular matrix components including <strong>type I collagen</strong> and fibronectin and increases fibroblast and keratinocyte proliferation. Vitamin A deficiency therefore impairs collagen production (Polcz and Barbul, Nutrition in Clinical Practice, 2019).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A</strong> --- Vitamin C (ascorbate) is a cofactor for prolyl and lysyl hydroxylase, so its deficiency impairs collagen *synthesis, hydroxylation, and cross-linking/triple-helix stability*---not &quot;collagen contraction&quot; (wound contraction is a myofibroblast-mediated process). The stated mechanism is wrong (Pichan et al., New England Journal of Medicine, 2021; Peterkofsky, American Journal of Clinical Nutrition, 1991).</li>\n\n<li><strong>B</strong> --- Collagen cross-linking is mediated by lysyl oxidase (a copper-dependent enzyme); impaired hydroxylation-dependent cross-linking is characteristic of vitamin C, not vitamin B6, deficiency. Vitamin B6 is not the classic cross-linking cofactor described here.</li>\n\n<li><strong>D</strong> --- Vitamin K is essential for \u03b3-carboxylation of clotting factors (hemostasis); it is not the driver of fibroplasia, so this statement is false.</li>\n</ul>\n<p>This confirms the key&#x27;s &quot;Not A&quot; --- the affirmatively true statement is C.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":68,"stem":"A 76-year old female presented with a type-A aortic dissection and had emergent cardiac surgery for repair. The dissection started in the aortic sinuses and extended to both iliac arteries. An aortic replacement under circulatory arrest was performed. There were significant coagulopathy issues and the surgery took significantly longer than expected. She has a history of hypertension and is obese (BMI = 38). Three days after her surgery, she is more alert and complaining of numbness and tingling along her right little finger and the ulnar half of her ring finger. This discomfort is also accompanied by weakness of her right grip. What is the most likely cause of this patient symptoms?","options":[{"letter":"A","text":"Axillary artery dissection"},{"letter":"B","text":"Ulnar nerve compression"},{"letter":"C","text":"Deep vein thrombosis"},{"letter":"D","text":"Stroke"}],"correct":"B","explanation":"<p>(agrees with the provided key)</p>\n<p><strong>Why B is correct:</strong> Numbness/tingling confined to the little finger and the ulnar half of the ring finger, plus grip weakness, is the classic ulnar nerve sensory-motor distribution. After a prolonged operation with the arm positioned on the table, perioperative ulnar neuropathy from compression at the elbow (cubital tunnel) is the most likely cause of this focal, non-vascular, non-central deficit.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A</strong> --- Axillary artery dissection would cause limb ischemia (pain, pallor, pulselessness, coolness) rather than an isolated ulnar sensory distribution.</li>\n\n<li><strong>C</strong> --- Deep vein thrombosis produces limb swelling and pain, not a dermatomal/peripheral-nerve sensory pattern with focal motor weakness.</li>\n\n<li><strong>D</strong> --- Stroke typically causes a broader, non-peripheral-nerve deficit (e.g., whole-hand or hemibody involvement, facial or language findings), not sensory loss restricted to a single peripheral nerve territory.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":69,"stem":"Prophylactic antibiotics are recommended to decrease the incidence of wound infection after surgical procedures. Which of the following statement is TRUE:","options":[{"letter":"A","text":"IV Vancomycin is recommended for elective craniotomy"},{"letter":"B","text":"IV cefazolin is recommended for an elective aortic valve replacement"},{"letter":"C","text":"IV vancomycin is recommended for urgent iliac artery repair"},{"letter":"D","text":"IV ciprofloxacin is recommended for elective inguinal hernia repair"}],"correct":"B","explanation":"<p>(agrees with the provided key)</p>\n<p><strong>Why B is correct:</strong> A first-generation cephalosporin---cefazolin---is the recommended primary prophylactic agent for cardiac surgery, including prosthetic valve replacement, because the predominant surgical-site pathogens are staphylococci (Engelman et al., Society of Thoracic Surgeons Guideline, 2007; Wilson et al., AHA Guideline, 2007).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A</strong> --- Cefazolin, not vancomycin, is the standard prophylactic agent for clean neurosurgical procedures such as elective craniotomy; vancomycin is reserved for \u03b2-lactam allergy or high institutional MRSA prevalence (Bassetti et al., Minerva Anestesiologica, 2015).</li>\n\n<li><strong>C</strong> --- Vascular procedures (including iliac artery repair) are covered with cefazolin as first-line; vancomycin is not the routine choice and is used only for allergy or MRSA risk.</li>\n\n<li><strong>D</strong> --- Cefazolin (or cefuroxime) is the appropriate agent for inguinal hernia repair with mesh; ciprofloxacin is not recommended for this clean procedure (Orelio et al., Cochrane Database of Systematic Reviews, 2020).</li>\n</ul>\n<p><strong>Summary of agreement with the provided key:</strong> All ten items (60--69) match the uploaded answer sheet. The only clarifications are that Q67&#x27;s affirmative true statement is specifically <strong>C</strong> (the sheet noted only &quot;Not A&quot;), and Q66&#x27;s &quot;clinical findings&quot; (C) is accepted with the caveat that surgical exploration is the confirmatory gold standard.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":70,"stem":"Regarding a power of attorney for personal care, which of the following is TRUE:","options":[{"letter":"A","text":"A power of attorney can override decisions on the patient's behalf, even if the patient is still competent"},{"letter":"B","text":"It is an instrument through which one person grants another the legal authority to make decisions on their behalf in the event they should become incapable"},{"letter":"C","text":"A power of attorney does not need to act on behalf of the patient's best interest"},{"letter":"D","text":"Keeping a record of decisions made on the incapable persons behalf is not a requirement of the power of attorney"}],"correct":"B","explanation":"<p>(matches the provided key)</p>\n<p>Why B is correct: A power of attorney for personal care is a legal instrument executed by a competent person that appoints a surrogate (agent/proxy) to make health and personal-care decisions on their behalf, taking effect only once the person loses decision-making capacity. The agent &quot;stands in the shoes&quot; of the patient and the document can be designed to become effective only when the principal becomes decisionally incapacitated (High, Journal of the American Geriatrics Society, 1987). A durable/springing power of attorney names a surrogate to make medical decisions &quot;at a point of future incapacity&quot; (Zietlow et al., Journal of the American Geriatrics Society, 2022).</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A is incorrect: While the person retains capacity, they make their own decisions; the agent&#x27;s authority activates only at incapacity. A POA cannot override a competent patient&#x27;s own choices, and the principal may revoke it at any time they retain capacity (Zietlow et al., Journal of the American Geriatrics Society, 2022).</li>\n\n<li>C is incorrect: A surrogate is legally obligated to act in the patient&#x27;s best interest (or per the patient&#x27;s known wishes/substituted judgment). A POA can be overridden precisely when the named agent is not acting in the incapacitated person&#x27;s best interest (Zietlow et al., Journal of the American Geriatrics Society, 2022).</li>\n\n<li>D is incorrect: Acting as a surrogate carries a duty of accountability, which includes record-keeping of decisions made on the incapable person&#x27;s behalf; this is a requirement, not an exemption.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":71,"stem":"Which antibiotic is a second generation cephalosporin","options":[{"letter":"A","text":"Cefotaxime"},{"letter":"B","text":"Cephalexin"},{"letter":"C","text":"Cefoxitin"},{"letter":"D","text":"Ceftriaxone"}],"correct":"C","explanation":"<p>(matches the provided key)</p>\n<p>Why C is correct: Cefoxitin is a second-generation cephalosporin (technically a cephamycin subgroup), with expanded gram-negative activity and notably good anaerobic coverage including Bacteroides fragilis (Molavi, American Family Physician, 1991; Lee et al., Drugs, 2015). Standard classifications list the second generation as cefuroxime, cefoxitin, cefotetan, cefaclor, and cefprozil (Vuppalanchi et al., Alimentary Pharmacology &amp; Therapeutics, 2025).</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A (cefotaxime) is incorrect: it is a third-generation cephalosporin.</li>\n\n<li>B (cephalexin) is incorrect: it is a first-generation cephalosporin.</li>\n\n<li>D (ceftriaxone) is incorrect: it is a third-generation cephalosporin (Vuppalanchi et al., Alimentary Pharmacology &amp; Therapeutics, 2025; Lee et al., Drugs, 2015).</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":72,"stem":"Confidentiality includes all of the following EXCEPT:","options":[{"letter":"A","text":"Information can be disclosed to anyone as long as you have the consent from your patient"},{"letter":"B","text":"Confidential information can be disclosed if there is a threat to the general public"},{"letter":"C","text":"Mandatory reporting to the authorities is required for a suspected case of child abuse"},{"letter":"D","text":"A court order to testify in court is not required without the consent of the patient"}],"correct":"D","explanation":"<p>(matches the provided key)</p>\n<p>Why D is the correct answer (i.e., the false/EXCEPT statement): This statement is untrue. A valid court order (subpoena/judicial order) legally compels a clinician to disclose confidential information or testify, and patient consent is NOT required in that circumstance. Because the question asks for the exception, D --- the one statement that does not hold --- is the answer.</p>\n<p>Why the others are incorrect (they are all TRUE elements of confidentiality practice):</p>\n<ul>\n<li>A is a true statement: disclosure is permitted with the patient&#x27;s consent.</li>\n\n<li>B is a true statement: confidentiality may be breached to protect the public from a serious/imminent threat (the duty-to-protect/warn exception).</li>\n\n<li>C is a true statement: suspected child abuse triggers mandatory reporting to authorities regardless of consent, a recognized legal exception to confidentiality.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":73,"stem":"A severely ill patient on Total Parenteral Nutrition (TPN) for 2 weeks develops dermatitis and alopecia. What is the most likely trace mineral deficiency:","options":[{"letter":"A","text":"Copper"},{"letter":"B","text":"Chromium"},{"letter":"C","text":"Zinc"},{"letter":"D","text":"Selenium"}],"correct":"C","explanation":"<p>(matches the provided key)</p>\n<p>Why C is correct: The combination of dermatitis (classically periorificial/acral) plus alopecia is the hallmark of zinc deficiency, and it is a well-described complication of TPN without adequate zinc supplementation. In TPN patients, plasma zinc below ~20 mcg/100 mL produces dermatitis followed by alopecia (Zinc Chloride Injection FDA label). The original TPN case series described a syndrome of diarrhea, peri-oral dermatitis, and alopecia responsive to zinc repletion (Kay et al., Annals of Surgery, 1976), and acquired acrodermatitis enteropathica from zinc-depleted PN presents with periorificial/acral dermatitis and alopecia (Wiznia et al., Pediatric Dermatology, 2019).</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A (copper) is incorrect: copper deficiency causes anemia, neutropenia, and myeloneuropathy, not the dermatitis-alopecia pattern.</li>\n\n<li>B (chromium) is incorrect: chromium deficiency in TPN manifests as impaired glucose tolerance/hyperglycemia and peripheral neuropathy.</li>\n\n<li>D (selenium) is incorrect: selenium deficiency causes cardiomyopathy (Keshan disease) and myopathy, not dermatitis with alopecia.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":74,"stem":"A patient with Crohn's disease suffered a significant brain and lung injury from a motor vehicle collision. Which of the following is most appropriate for long term (> 4 weeks) nutritional care:","options":[{"letter":"A","text":"Nasogastric feeds"},{"letter":"B","text":"Nasojejunal feeds"},{"letter":"C","text":"Total Parenteral Nutrition (TPN)"},{"letter":"D","text":"Percutaneous endoscopic gastrostomy (PEG)"}],"correct":"D","explanation":"<p>(matches the provided key --- &quot;PEG tube&quot;)</p>\n<p>Why D is correct: When enteral access is anticipated for more than 4 weeks and the gut is functional, a percutaneous route is preferred over nasoenteric tubes. PEG has become the preferred method for long-term enteral nutrition, and guidelines reserve percutaneous placement for an expected duration of 4 or more weeks (Micic et al., AGA Clinical Practice Update, Gastroenterology, 2025; Abdelfattah &amp; Kaspar, Digestive Diseases and Sciences, 2022). This patient has a functioning GI tract (Crohn&#x27;s disease does not preclude gastric feeding) and a neurologic injury requiring durable access, making PEG most appropriate.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A (nasogastric) is incorrect: NG tubes are appropriate only for short-term (&lt;4 weeks) access; beyond that they carry higher rates of dislodgement, discomfort, ulceration, and aspiration (Micic et al., Gastroenterology, 2025).</li>\n\n<li>B (nasojejunal) is incorrect: also a short-term/nasal route, reserved for aspiration risk or gastric dysmotility, not durable &gt;4-week feeding.</li>\n\n<li>C (TPN) is incorrect: enteral nutrition is almost always preferred to parenteral when the gut works; TPN carries infectious, metabolic, and hepatic risks and is not indicated here since the GI tract is functional (Krafft et al., Digestive Diseases and Sciences, 2025).</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":75,"stem":"Which of the following is true regarding kidney transplant:","options":[{"letter":"A","text":"The one year survival is equal between deceased donor kidneys and living donor kidneys"},{"letter":"B","text":"The most common cause of graft loss is recipient death from cardiovascular disease"},{"letter":"C","text":"Kidney allografts are usually placed as close as possible to the original kidney location"},{"letter":"D","text":"HLA typing is not necessary pre-op"}],"correct":"B","explanation":"<p>(matches the provided key)</p>\n<p>Why B is correct: Death with a functioning graft (DWFG) is one of the two leading mechanisms of overall graft loss (roughly half of late losses), and cardiovascular disease is consistently the leading single cause of that death. Cardiovascular mortality remains the leading cause of death in kidney transplant recipients (Awan et al., American Journal of Nephrology, 2018), and CVD is the most frequent cause of DWFG (Mayrdorfer et al., NDT, 2023; Hariharan et al., New England Journal of Medicine, 2021).</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A is incorrect: living-donor kidneys have superior survival, including better short- and long-term outcomes, so 1-year survival is not equal (Burton et al., NDT, 2019).</li>\n\n<li>C is incorrect: the allograft is placed heterotopically in the iliac fossa (extraperitoneal, anastomosed to iliac vessels and bladder), NOT near the native kidneys, which are usually left in place.</li>\n\n<li>D is incorrect: HLA typing (and crossmatching) is a necessary pre-op step to assess immunologic compatibility and rejection risk.</li>\n</ul>\n<p>Note on scope: The printed answer key lists items 1--83, but only questions 70--75 have legible stems on this page. Questions with stems not shown cannot be independently verified here.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":76,"stem":"With regard to clinical rejection in transplant medicine which of the following is true.","options":[{"letter":"A","text":"Chronic rejection is the most common"},{"letter":"B","text":"Acute rejection occurs within 12 hours"},{"letter":"C","text":"Hyper-acute rejection is triggered by the donors ABO blood group antigens"},{"letter":"D","text":"Pre-transplant blood cross-matching does not decrease the incidence"}],"correct":"C","explanation":"<p>(agrees with the original key)</p>\n<p><strong>Why C is correct:</strong> Hyperacute rejection occurs within minutes to hours of reperfusion and is caused by preformed recipient antibodies binding donor antigens --- chiefly ABO blood group antigens and HLA on the graft endothelium --- triggering complement activation, endothelial necrosis, platelet deposition, and thrombosis (Nankivell and Alexander, New England Journal of Medicine, 2010; Alelign et al., Journal of Immunology Research, 2017). The donor ABO antigens are the target that the preformed antibodies recognize, making this statement true.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A</strong> --- Although chronic rejection is a major cause of late graft loss, this statement is not the intended &quot;true&quot; answer; more importantly, it is not an unambiguous fact in the way C is, and acute rejection episodes are also common. C is the definitively correct statement.</li>\n\n<li><strong>B</strong> --- Rejection occurring within ~12 hours describes hyperacute (minutes to hours), not acute rejection. Acute rejection typically develops over days to weeks to months (Alelign et al., Journal of Immunology Research, 2017).</li>\n\n<li><strong>D</strong> --- Pre-transplant cross-matching detects donor-specific antibodies and has largely eliminated hyperacute rejection; it clearly decreases incidence (Nankivell and Alexander, New England Journal of Medicine, 2010).</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":77,"stem":"Which of the following is an absolute contraindication to renal transplant:","options":[{"letter":"A","text":"HIV infection"},{"letter":"B","text":"Hepatits B infection"},{"letter":"C","text":"Cardiac stent placed 2 years prior"},{"letter":"D","text":"A patient with Hodgkins Lymphoma on chemotherapy"}],"correct":"D","explanation":"<p>(agrees with the original key)</p>\n<p><strong>Why D is correct:</strong> Active, untreated malignancy --- here Hodgkin lymphoma undergoing active chemotherapy --- is an absolute contraindication to transplantation. Immunosuppression would accelerate tumor progression, and a disease-free interval after cancer treatment is required before a patient can be listed.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A</strong> --- Well-controlled HIV with suppressed viral load and adequate CD4 count is no longer an absolute contraindication; HIV-positive patients are routinely transplanted.</li>\n\n<li><strong>B</strong> --- Hepatitis B infection is manageable with antiviral therapy and is not an absolute contraindication.</li>\n\n<li><strong>C</strong> --- A cardiac stent placed 2 years earlier reflects treated, stable coronary disease and is not a contraindication; it may warrant cardiac clearance but does not preclude transplant.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":78,"stem":"The three most common symptoms that affect quality of life during end of life care include:","options":[{"letter":"A","text":"Delirium, withdrawal, pain"},{"letter":"B","text":"Confusion, pain, indecision"},{"letter":"C","text":"Respiratory distress, pain, and cognitive impairment"},{"letter":"D","text":"Loss of bladder function, respiratory distress, pain"}],"correct":"C","explanation":"<p>(agrees with the original key)</p>\n<p><strong>Why C is correct:</strong> Pain, dyspnea/respiratory distress, and cognitive impairment (including delirium) are consistently cited among the most common and distressing symptoms affecting quality of life at the end of life, and together they best capture the recognized triad.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A</strong> --- &quot;Withdrawal&quot; is not a standard end-of-life symptom category in this context; delirium and pain are, but the grouping is incomplete.</li>\n\n<li><strong>B</strong> --- &quot;Indecision&quot; is not a recognized end-of-life symptom affecting quality of life.</li>\n\n<li><strong>D</strong> --- Loss of bladder function is common but is generally less central to quality-of-life burden than cognitive impairment; this grouping is not the best answer.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":79,"stem":"When comparing the composition of plasma and Normal saline which of the following statements is TRUE:","options":[{"letter":"A","text":"NS has a greater concentration of Na versus plasma"},{"letter":"B","text":"NS has a lower osmolality versus plasma"},{"letter":"C","text":"NS has a higher pH versus plasma"},{"letter":"D","text":"NS and plasma have similar bicarbonate concentrations"}],"correct":"A","explanation":"<p>(agrees with the original key)</p>\n<p><strong>Why A is correct:</strong> 0.9% (&quot;normal&quot;) saline contains 154 mmol/L of sodium, higher than plasma sodium (~140 mmol/L).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>B</strong> --- NS has a calculated osmolarity of ~308 mOsm/L, higher (not lower) than plasma (~285--295 mOsm/L).</li>\n\n<li><strong>C</strong> --- NS has a pH of roughly 5.0--5.5, lower (not higher) than plasma pH of ~7.4; large-volume NS causes a hyperchloremic metabolic acidosis.</li>\n\n<li><strong>D</strong> --- NS contains no bicarbonate (0 mmol/L), whereas plasma contains ~24 mmol/L; they are not similar.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":80,"stem":"What is the most common cause of hypercalcemia:","options":[{"letter":"A","text":"Malignancy"},{"letter":"B","text":"Granulomatous disease"},{"letter":"C","text":"Primary hyperparathyroidism"},{"letter":"D","text":"Chronic lithium toxicity"}],"correct":"C","explanation":"<p>(agrees with the original key)</p>\n<p><strong>Why C is correct:</strong> Primary hyperparathyroidism and malignancy together account for ~90% of hypercalcemia. Primary hyperparathyroidism is the single most common cause overall and in the ambulatory/outpatient setting (Walker and Shane, JAMA, 2022; Vodopivec et al., New England Journal of Medicine, 2020).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A</strong> --- Malignancy is the most common cause in hospitalized patients but not the most common cause overall; it is the correct answer only in the inpatient context.</li>\n\n<li><strong>B</strong> --- Granulomatous disease (e.g., sarcoidosis) is an uncommon cause, accounting for a small minority of cases.</li>\n\n<li><strong>D</strong> --- Chronic lithium toxicity is a rare, medication-related cause.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":81,"stem":"A palliative care consultation would be required for:","options":[{"letter":"A","text":"Initiation of comfort care"},{"letter":"B","text":"Withdrawal of medications"},{"letter":"C","text":"Initiation of transdermal narcotics"},{"letter":"D","text":"Implementation of palliative home care services"}],"correct":"D","explanation":"<p>(agrees with the original key)</p>\n<p><strong>Why D is correct:</strong> Basic symptom management can be delivered by the primary team, but formal arrangement/implementation of palliative home care services typically requires a specialist palliative care consultation and referral to coordinate the service.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A</strong> --- Initiation of comfort care can be undertaken by the primary/treating team without a dedicated palliative care consult.</li>\n\n<li><strong>B</strong> --- Withdrawal (deprescribing) of medications is within the scope of the primary team.</li>\n\n<li><strong>C</strong> --- Initiation of transdermal opioids for symptom control is a routine prescribing decision that does not require a specialist consult.</li>\n</ul>\n<p>Note: this item reflects a program/knowledge convention rather than a strong evidence base; the keyed answer (D) is the best fit among the options.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":82,"stem":"Which of the following antimicrobials agents has very limited activity against Pseudomonas Aeruginosa (ie. There is significant rate of resistance):","options":[{"letter":"A","text":"Ceftazidime"},{"letter":"B","text":"Tobramycin"},{"letter":"C","text":"Levofloxacin"},{"letter":"D","text":"Vancomycin"}],"correct":"D","explanation":"<p>(agrees with the original key)</p>\n<p><strong>Why D is correct:</strong> Vancomycin is a glycopeptide active essentially only against gram-positive organisms; it has no meaningful activity against Pseudomonas aeruginosa (a gram-negative bacillus).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A</strong> --- Ceftazidime is a classic antipseudomonal third-generation cephalosporin.</li>\n\n<li><strong>B</strong> --- Tobramycin is an aminoglycoside with reliable antipseudomonal activity.</li>\n\n<li><strong>C</strong> --- Levofloxacin is the respiratory fluoroquinolone with the most antipseudomonal activity in its class.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":83,"stem":"Based on the summary of Surviving Sepsis campaign guidelines which of the following is true:","options":[{"letter":"A","text":"Transfusion of red blood cells should occur when the hemoglobin drops below 90 (<9.0g/dl)"},{"letter":"B","text":"Source control should always occur before starting empiric antibiotics"},{"letter":"C","text":"Intravenous hydrocortisone should be initiated once aggressive fluid resuscitation fails"},{"letter":"D","text":"The first line choice for a vasopressor is norepinephrine"}],"correct":"D","explanation":"<p>(agrees with the original key)</p>\n<p><strong>Why D is correct:</strong> The Surviving Sepsis Campaign issues a strong recommendation for norepinephrine as the first-line vasopressor over dopamine, epinephrine, vasopressin, selepressin, and angiotensin II (Evans et al., Surviving Sepsis Campaign Guidelines, 2021).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A</strong> --- The guidelines recommend a restrictive transfusion strategy with a hemoglobin trigger of 70 g/L (7.0 g/dL), not 90 (Evans et al., 2021).</li>\n\n<li><strong>B</strong> --- Empiric broad-spectrum antibiotics should be given as early as possible (ideally within 1 hour); antibiotics are not withheld until source control. Source control is pursued as soon as feasible but does not precede antibiotics.</li>\n\n<li><strong>C</strong> --- IV hydrocortisone is suggested for patients with septic shock and an ongoing vasopressor requirement (i.e., when vasopressors fail to restore hemodynamic stability), not when fluid resuscitation alone fails.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":84,"stem":"Which of the following is a clinical manifestation of hypercalcemia:","options":[{"letter":"A","text":"Paresthesias"},{"letter":"B","text":"Prolonged QT interval"},{"letter":"C","text":"Seizures"},{"letter":"D","text":"Kidney stones"}],"correct":"D","explanation":"<p>(agrees with the original key)</p>\n<p><strong>Why D is correct:</strong> Nephrolithiasis is a classic manifestation of hypercalcemia (&quot;stones, bones, abdominal groans, and psychiatric moans&quot;).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A</strong> --- Paresthesias (perioral and acral) are features of hypocalcemia, not hypercalcemia.</li>\n\n<li><strong>B</strong> --- Hypercalcemia shortens the QT interval; a prolonged QT is characteristic of hypocalcemia.</li>\n\n<li><strong>C</strong> --- Seizures are associated with hypocalcemia; hypercalcemia more typically causes lethargy, confusion, somnolence, and coma.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":85,"stem":"The principalist approach incorporates which guiding principles:","options":[{"letter":"A","text":"Disclosure, autonomy, beneficence, and justice"},{"letter":"B","text":"Disclosure, autonomy, beneficence, and nonmaleficence"},{"letter":"C","text":"Autonomy, beneficence, nonmaleficence, and capacity"},{"letter":"D","text":"Autonomy, justice, beneficence, and nonmaleficence"}],"correct":"D","explanation":"<p>(agrees with the original key)</p>\n<p><strong>Why D is correct:</strong> The four principles of biomedical ethics (Beauchamp and Childress) are autonomy, justice, beneficence, and nonmaleficence --- exactly the set listed in D.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A</strong> and <strong>B</strong> --- Both substitute &quot;disclosure&quot; for one of the four principles; disclosure is a component of informed consent, not one of the four core principles.</li>\n\n<li><strong>C</strong> --- Substitutes &quot;capacity&quot; for justice; capacity is a clinical/decision-making concept, not one of the four principles.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":86,"stem":"A patient under general anaesthesia rapidly develops elevated core body temperature, muscle rigidity and sympathetic nervous system activation. Which of the following statements is correct regarding this presentation:","options":[{"letter":"A","text":"This condition is associated with hypercarbia, hypoxemia and rhabdomyolysis"},{"letter":"B","text":"This condition is inherited according to an autosomal recessive pattern"},{"letter":"C","text":"This condition is most commonly triggered by volatile anaesthetic such as nitrous oxide or xenon gas"},{"letter":"D","text":"This condition is associated with arrhythmias, hypokalemia, and alkalosis"}],"correct":"A","explanation":"<p>(agrees with the original key)</p>\n<p><strong>Why A is correct:</strong> The presentation is malignant hyperthermia. Uncontrolled sarcoplasmic calcium release causes a hypermetabolic state with increased CO2 production (hypercarbia), increased oxygen consumption with hypoxemia, sustained muscle contraction, and rhabdomyolysis (Rosenberg et al., Orphanet Journal of Rare Diseases, 2015; GeneReviews, Nonsyndromic Malignant Hyperthermia Susceptibility, 2025).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>B</strong> --- In humans MH is inherited in an autosomal dominant pattern (most commonly RYR1 variants), not autosomal recessive (autosomal recessive inheritance is seen in pigs).</li>\n\n<li><strong>C</strong> --- MH is triggered by potent volatile agents (halothane, sevoflurane, desflurane, isoflurane, enflurane) and the depolarizing relaxant succinylcholine. Nitrous oxide and xenon are considered non-triggering (&quot;safe&quot;) agents, so this statement is false.</li>\n\n<li><strong>D</strong> --- MH causes hyperkalemia and metabolic/respiratory acidosis (not hypokalemia and alkalosis); arrhythmias occur but are driven by hyperkalemia and acidosis.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":87,"stem":"Which type of shock does NOT result in hypotension and tachycardia:","options":[{"letter":"A","text":"Hemorrhagic shock"},{"letter":"B","text":"Septic shock"},{"letter":"C","text":"Neurogenic shock"},{"letter":"D","text":"Cardiogenic shock"}],"correct":"C","explanation":"<p>(agrees with the original key)</p>\n<p><strong>Why C is correct:</strong> Neurogenic shock results from loss of sympathetic outflow (injury above ~T6), producing hypotension with bradycardia (and warm, well-perfused extremities from vasodilation) rather than the compensatory tachycardia seen in other shock states (Sweis and Biller, Current Neurology and Neuroscience Reports, 2017; Ahuja et al., Nature Reviews Disease Primers, 2017).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A</strong> --- Hemorrhagic (hypovolemic) shock produces hypotension with compensatory tachycardia.</li>\n\n<li><strong>B</strong> --- Septic (distributive) shock produces hypotension with tachycardia.</li>\n\n<li><strong>D</strong> --- Cardiogenic shock typically produces hypotension with tachycardia.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":88,"stem":"This herbal medicine is associated with a potential risk of increased bleeding due to its effect on platelet aggregation:","options":[{"letter":"A","text":"Gingko"},{"letter":"B","text":"Kava"},{"letter":"C","text":"St. John's Wort"},{"letter":"D","text":"Echinacea"}],"correct":"A","explanation":"<p>(agrees with the original key)</p>\n<p><strong>Why A is correct:</strong> Ginkgo biloba is associated with increased bleeding risk attributed to antiplatelet activity via antagonism of platelet-activating factor (ginkgolide B); case reports describe intracranial and other hemorrhages, particularly with concomitant antiplatelet/anticoagulant use (Valli and Giardina, Journal of the American College of Cardiology, 2002; Liperoti et al., Journal of the American College of Cardiology, 2017).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>B</strong> --- Kava is chiefly associated with hepatotoxicity, not platelet-mediated bleeding.</li>\n\n<li><strong>C</strong> --- St. John&#x27;s Wort is a potent CYP450/P-glycoprotein inducer causing drug interactions (e.g., reduced efficacy of warfarin, cyclosporine, oral contraceptives), not an antiplatelet bleeding risk.</li>\n\n<li><strong>D</strong> --- Echinacea is an immunomodulator without a recognized antiplatelet bleeding effect.</li>\n</ul>\n<p>Note on ginkgo: controlled trials of standardized extracts have been inconsistent and some meta-analyses show no significant effect on platelet aggregation or coagulation parameters, but the platelet-mediated bleeding association remains the standard teaching and the intended answer.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":89,"stem":"According to the NRC Classification of Operative Wounds, entrance of the genitourinary or biliary tracts in the presence of infected urine or bile, is classified as:","options":[{"letter":"A","text":"Class I wound"},{"letter":"B","text":"Class II wound"},{"letter":"C","text":"Class III wound"},{"letter":"D","text":"Class IV wound"}],"correct":"C","explanation":"<p>Why C (Class III / contaminated) is correct: Under the National Research Council / CDC (HICPAC) schema, a contaminated (Class III) wound includes operations with a major break in sterile technique, gross spillage from the GI tract, and incisions with acute, nonpurulent inflammation. Entering the biliary or urinary tract when the bile or urine is already infected introduces this acute inflammatory contamination without frank pus or a perforated viscus, placing it in Class III (Centers for Disease Control and Prevention/HICPAC surgical wound classification, 1999; American College of Obstetricians and Gynecologists, Obstetrics &amp; Gynecology, 2018).</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A (Class I / clean): A clean wound involves no inflammation and the uninfected respiratory, alimentary, genital, or urinary tract is not entered. Infected bile/urine is by definition inflamed and infected.</li>\n\n<li>B (Class II / clean-contaminated): The biliary tract, appendix, vagina, and oropharynx qualify as clean-contaminated only when entered under controlled conditions &quot;provided no evidence of infection or major break in technique is encountered.&quot; The presence of infection specifically excludes Class II.</li>\n\n<li>D (Class IV / dirty-infected): Class IV requires existing purulent clinical infection or a perforated viscus (e.g., abscess, gross pus, devitalized traumatic tissue). Infected bile/urine alone, without frank pus or perforation, is contaminated rather than dirty (CDC/HICPAC classification, 1999).</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":90,"stem":"Which of the following components help to develop a culture of safety in surgical practice:","options":[{"letter":"A","text":"Allowing the surgeon to be in charge in the operating room without question."},{"letter":"B","text":"Promoting individualism and professional autonomy"},{"letter":"C","text":"Recognizing the effects of stress and fatigue on surgeons' decision-making"},{"letter":"D","text":"Recognizing that surgery is generally a low risk field and generally not prone to errors"}],"correct":"C","explanation":"<p>Why C is correct: A culture of safety rests on acknowledging human factors --- including how stress, fatigue, and workload degrade judgment and technical performance --- and on flattening hierarchy so any team member can raise concerns.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A: Unquestioned authority (a steep authority gradient) suppresses speaking up and is a recognized contributor to error, the opposite of a safety culture.</li>\n\n<li>B: Individualism undermines the standardization, checklists, and teamwork that safety culture depends on.</li>\n\n<li>D: Surgery is a high-risk, error-prone environment; assuming otherwise breeds complacency.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":91,"stem":"Accurately describe how body composition changes with advanced age. (ICW = intracellular water; ECW = extracellular water; TBW = total body water)","options":[{"letter":"A","text":"Decreased ICW, increased ECW, decreased TBW, decreased protein, decreased fat"},{"letter":"B","text":"Increased ICW, decreased ECW, unchanged TBW, decreased protein, decreased fat"},{"letter":"C","text":"Decreased ICW, increased ECW, unchanged TBW, decreased protein, increased fat"},{"letter":"D","text":"Decreased ICW, decreased ECW, decreased TBW, decreased protein, increased fat"}],"correct":"D","explanation":"<p>Why D is correct: With aging, lean body (cell) mass falls, so intracellular water and body protein decrease; total body water falls (from ~60% to ~50% of body weight); and adipose tissue increases. Absolute extracellular water declines modestly, so the ECW:ICW ratio rises even as both fall in absolute terms.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A: Fat increases rather than decreases with age.</li>\n\n<li>B: ICW falls (not rises) and TBW is not unchanged --- it declines.</li>\n\n<li>C: TBW is not unchanged; it decreases with age.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":92,"stem":"Describe how the kidney is involved in control of pH.","options":[{"letter":"A","text":"Protons are secreted into the filtrate in the distal convoluted tubule"},{"letter":"B","text":"Sodium is transported into the filtrate in the distal convoluted tubule"},{"letter":"C","text":"Glycine is converted into ammonium, which buffers the filtrate"},{"letter":"D","text":"Ammonium is the only important buffer of protons in the filtrate"}],"correct":"A","explanation":"<p>Why A is correct: The kidney regulates acid--base balance by secreting protons (H+) into the tubular filtrate --- via the proximal tubule and, for fine control, the distal nephron/collecting-duct \u03b1-intercalated cells --- while reclaiming bicarbonate. Of the options offered, proton secretion into the filtrate is the correct mechanism.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>B: Sodium is reabsorbed from the filtrate, not secreted into it, and Na+ handling is not the primary pH-control step.</li>\n\n<li>C: The principal source of renal ammonium is glutamine metabolism, not glycine.</li>\n\n<li>D: Ammonium is a major titratable/buffer system, but phosphate and bicarbonate also buffer; ammonium is not the &quot;only&quot; important buffer.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":93,"stem":"A young diabetic patient is seen in the ER with nausea and vomiting, pronounced thirst, excessive urine production and severe abdominal pain. What is expected to be seen on blood tests and ABGs:","options":[{"letter":"A","text":"Metabolic acidosis with a compensatory respiratory alkalosis and elevated blood glucose levels"},{"letter":"B","text":"Metabolic alkalosis with a compensatory respiratory acidosis and elevated blood glucose levels"},{"letter":"C","text":"Metabolic acidosis with a compensatory respiratory alkalosis and elevated blood levels of sodium and potassium"},{"letter":"D","text":"Metabolic acidosis with elevated blood levels of phosphate, magnesium, and calcium"}],"correct":"A","explanation":"<p>Why A is correct: The presentation is diabetic ketoacidosis --- a high-anion-gap metabolic acidosis from ketoacid accumulation, with compensatory hyperventilation (Kussmaul respirations) producing a respiratory alkalosis, alongside hyperglycemia.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>B: DKA produces acidosis, not alkalosis.</li>\n\n<li>C: The primary derangement is acidosis with hyperglycemia; sodium is typically low/normal (pseudohyponatremia) and total-body potassium is depleted despite a variable measured level, so &quot;elevated sodium and potassium&quot; is wrong.</li>\n\n<li>D: DKA is not characterized by elevated phosphate, magnesium, and calcium; phosphate and total-body potassium are typically depleted.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":94,"stem":"Which statement is correct regarding postoperative hyponatremia;","options":[{"letter":"A","text":"The most common initial symptoms are severe thirst and muscle twitching"},{"letter":"B","text":"Menstruating women are at special risk of developing postoperative hyponatremia"},{"letter":"C","text":"It is caused by reduced activity of arginine vasopressin"},{"letter":"D","text":"It can be improved by a mannitol infusion, which helps to retain sodium"}],"correct":"B","explanation":"<p>Why B is correct: In a classic case-control study of postoperative hyponatremia, menstruant women were about 25 times more likely to die or sustain permanent brain damage from hyponatremic encephalopathy than men or postmenopausal women; estrogen and vasopressin impair the brain&#x27;s adaptive volume regulation (Ayus, Wheeler &amp; Arieff, Annals of Internal Medicine, 1992; Adrogu\u00e9, Tucker &amp; Madias, JAMA, 2022).</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A: Early symptoms are nonspecific (headache, nausea, malaise); &quot;severe thirst and muscle twitching&quot; is not the characteristic early presentation.</li>\n\n<li>C: Postoperative hyponatremia results from increased (not reduced) arginine vasopressin release, driving free-water retention.</li>\n\n<li>D: Mannitol is an osmotic diuretic that does not &quot;retain sodium&quot;; it is not standard therapy for postoperative hyponatremia.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":95,"stem":"A central venous catheter is inserted for a severely hypotensive patient in the ER. This is done in suboptimal conditions with several breaks in aseptic technique. What is the best course of action:","options":[{"letter":"A","text":"Remove the catheter and replace within one hour even if patient still hypotensive"},{"letter":"B","text":"Start Cefazolin 1 gm intravenous every 8 hours and keep same catheter."},{"letter":"C","text":"Remove and replace catheter in different location within 24 hours if patient stable"},{"letter":"D","text":"Only change catheter if patient has fever for greater then 24 hrs."}],"correct":"C","explanation":"<div class=\"addendum\"><p class=\"addendum-label\">Note (answer-key disagreement)</p><p>The original answer sheet marked this question \u201cA?\u201d The reviewing key explicitly disagrees and concludes the correct answer is <strong>C</strong>, based on CDC catheter-infection-prevention guidance. The explanation below reflects the corrected answer (C), and also explains why A is not the safest choice.</p></div><p>Why C is correct: The CDC guideline for the prevention of intravascular catheter-related infections states that when aseptic technique cannot be ensured --- e.g., a line placed during a medical emergency --- the catheter should be replaced &quot;as soon as possible,&quot; and no later than 48 hours (O&#x27;Grady et al., CDC Guidelines for the Prevention of Intravascular Catheter-Related Infections, 2011). Replacement should use a fresh insertion site rather than a guidewire exchange when contamination/infection is the concern (American Society of Anesthesiologists Practice Guidelines for Central Venous Access, Anesthesiology, 2020). Option C --- remove and replace at a different site within 24 hours once the patient is stable --- best captures this.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A: Replacing &quot;within one hour even if patient still hypotensive&quot; is unsafe and unnecessary --- the priority is resuscitation and hemodynamic stabilization; replacement is done once feasible/stable (within 48 hours), not forced within an hour during shock. This is why the &quot;A?&quot; on the sheet is incorrect.</li>\n\n<li>B: Prophylactic antibiotics with catheter retention is not indicated; the contaminated line should be removed, and antibiotics do not substitute for source control.</li>\n\n<li>D: Waiting for &gt;24 hours of fever ignores the known breach in technique and delays removal of a probable infection source.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":96,"stem":"Which of the following is true regarding surgical site infections (SSI):","options":[{"letter":"A","text":"The use of drains has clearly been shown to reduce SSI in clean and clean-contaminated surgery."},{"letter":"B","text":"Chronic Obstructive pulmonary disease is an independent risk factor for the development of a SSI."},{"letter":"C","text":"Hypothermia is definitely associated with an increased incidence of SSI."},{"letter":"D","text":"The duration of a procedure has no impact on the risk of a SSI."}],"correct":"C","explanation":"<p>Why C is the intended correct answer: Perioperative hypothermia has long been linked to increased SSI. A landmark RCT in colorectal surgery found normothermia reduced SSI (6% vs 19%), and the WHO recommends intraoperative warming to reduce SSI (Allegranzi et al., Lancet Infectious Diseases, 2016). Caveat for the word &quot;definitely&quot;: more recent evidence is mixed --- the large PROTECT trial found similar deep/organ-space infection rates at 35.5\u00b0C vs 37\u00b0C, and a 2025 meta-analysis found a significant association only below 35\u00b0C (Sessler et al., Lancet, 2022; Chen et al., BMC Anesthesiology, 2025). C remains the best answer among the four, but &quot;definitely&quot; overstates current certainty.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A: Drains have not been shown to reduce SSI in clean/clean-contaminated surgery and may increase infection risk.</li>\n\n<li>B: COPD is not among the well-established independent SSI risk factors (diabetes, obesity, smoking, malnutrition, prolonged operative time are). This makes B a weaker choice than C, though it is not clearly false in all datasets.</li>\n\n<li>D: Longer operative duration clearly increases SSI risk, so this statement is false.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":97,"stem":"Based on the American Heart Association for cardiac risk stratification for non-cardiac surgery which of the following procedures would be deemed LOW risk (~ < 1%) for a peri-operative cardiac event?","options":[{"letter":"A","text":"Femoral-popliteal bypass surgery"},{"letter":"B","text":"Radical retropubic prostatectomy"},{"letter":"C","text":"ORIF of hip in 82 year old male"},{"letter":"D","text":"Ureteroscopy and lithotripsy of an obstructing ureteric stone"}],"correct":"D","explanation":"<p>Why D is correct: Low risk is defined as a &lt;1% risk of major adverse cardiac events. Minimally invasive/endoscopic genitourinary procedures such as ureteroscopy and lithotripsy carry the lowest cardiac risk of the options (2024 ACC/AHA Perioperative Guideline, Circulation/JACC, 2024; Smilowitz &amp; Berger, JAMA, 2020).</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A: Infrainguinal/peripheral vascular surgery is among the highest-risk procedures for perioperative MACE.</li>\n\n<li>B: Radical retropubic prostatectomy is a major intraperitoneal/pelvic operation, generally intermediate risk.</li>\n\n<li>C: Hip ORIF is intermediate-risk orthopedic surgery, and advanced age (82) further raises perioperative cardiac risk.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":98,"stem":"Which of the following is NOT a well-described risk factor for ARDS in the surgical patient?","options":[{"letter":"A","text":"Poorly controlled diabetes mellitus"},{"letter":"B","text":"Sepsis"},{"letter":"C","text":"Chronic CHF"},{"letter":"D","text":"Gastric content aspiration"},{"letter":"E","text":"Uremia"}],"correct":"A","explanation":"<p>Why A is correct: Diabetes mellitus is not a well-described risk factor for ARDS; multiple analyses suggest it is neutral or even protective against ARDS development (though it does not reduce mortality once ARDS occurs) (Boyle et al., LUNG SAFE, Critical Care, 2018; Kolahian et al., Reviews in Endocrine &amp; Metabolic Disorders, 2019).</p>\n<p>Why the others are incorrect (i.e., they ARE recognized associations):</p>\n<ul>\n<li>B: Sepsis is the single most common precipitant of ARDS.</li>\n\n<li>D: Gastric content aspiration is a classic direct pulmonary insult causing ARDS.</li>\n\n<li>C and E: Chronic CHF and uremia predispose to pulmonary edema and are described contributors to acute lung injury in surgical patients; they are far better recognized than diabetes, which is why A is the best &quot;NOT&quot; answer. (Note: some COVID-era literature reports diabetes as a risk factor, but the classic surgical teaching and large ARDS cohorts support A.)</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":99,"stem":"Which of the following inhalation anesthetic agents has the fastest onset of action and quickest emergence?","options":[{"letter":"A","text":"Halothane"},{"letter":"B","text":"Isoflurane"},{"letter":"C","text":"Desflurane"},{"letter":"D","text":"Diethyl ether"}],"correct":"C","explanation":"<p>Why C is correct: Onset and emergence speed are governed by blood-gas solubility --- the lower the coefficient, the faster the wash-in and wash-out. Desflurane has the lowest blood-gas partition coefficient (~0.42) of the volatile agents, giving the fastest induction and quickest emergence (Patel &amp; Goa, Drugs, 1995; Smiley, Anesthesia &amp; Analgesia, 1992).</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A (halothane, ~2.4) and B (isoflurane, ~1.4): substantially more soluble, so slower onset/emergence.</li>\n\n<li>D (diethyl ether): very high solubility and slow, prolonged induction and emergence (and flammable); largely obsolete.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":100,"stem":"What is the most common clinical complications encountered in the non-cardiac surgery post-anesthesia care unit?","options":[{"letter":"A","text":"Hypotension"},{"letter":"B","text":"Cardiac dysrhythmia"},{"letter":"C","text":"Nausea and vomiting"},{"letter":"D","text":"Altered mental status"}],"correct":"C","explanation":"<p>Why C is correct: Postoperative nausea and vomiting is the most frequent complication in the PACU after non-cardiac surgery, affecting a substantial proportion of patients.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li>A, B, D: Hypotension, dysrhythmia, and altered mental status all occur in the PACU but are considerably less common than PONV.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":101,"stem":"Which of the following is NOT a contraindication for Enteral Feeding?","options":[{"letter":"A","text":"Neurological disease"},{"letter":"B","text":"Intestinal Obstruction"},{"letter":"C","text":"High output fistulas"},{"letter":"D","text":"GI Bleed"}],"correct":"A","explanation":"<p><strong>Why A (Neurological disease) is correct:</strong> Neurological disease is not a contraindication to enteral feeding --- it is one of the classic <em>indications</em>. Patients with stroke, dysphagia, or other neurologic conditions who cannot safely take food by mouth are precisely the population for whom enteral (tube) feeding is used, provided the gut is functional (Gramlich and Guenter, New England Journal of Medicine, 2025).</p>\n<p><strong>Why the incorrect answers are incorrect:</strong></p>\n<ul>\n<li><strong>b. Intestinal Obstruction</strong> --- Mechanical bowel obstruction is a recognized contraindication to enteral feeding; feeding proximal to an obstruction risks distension, aspiration, and perforation. ASPEN and the ACG list mechanical GI obstruction among absolute contraindications (Worthington et al., ASPEN, 2017; McClave et al., American College of Gastroenterology, 2016).</li>\n\n<li><strong>c. High output fistulas</strong> --- A high-output fistula is a standard contraindication because enteral intake increases fistula output and prevents effective nutrient delivery (Worthington et al., ASPEN, 2017; Gramlich and Guenter, New England Journal of Medicine, 2025).</li>\n\n<li><strong>d. GI Bleed</strong> --- Upper GI (severe intestinal) hemorrhage is listed as a contraindication to enteral nutrition (Worthington et al., ASPEN, 2017; Gramlich and Guenter, New England Journal of Medicine, 2025).</li>\n</ul>\n<p><strong>Background:</strong> Other recognized contraindications include severe hemodynamic instability/shock, prolonged ileus, intractable vomiting or diarrhea, major GI (mesenteric) ischemia, and uncontrolled peritonitis (Worthington et al., ASPEN, 2017; McClave et al., American College of Gastroenterology, 2016).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":102,"stem":"How much protein per day is routinely recommended for most post-op surgical patients?","options":[{"letter":"A","text":"0.86 g / kg"},{"letter":"B","text":"3.0 g / kg"},{"letter":"C","text":"1.2-1.5 g / kg"},{"letter":"D","text":"0.7 g / kg for women and 1.0 g / kg for men"}],"correct":"C","explanation":"<p><strong>Why C (1.2--1.5 g/kg) is correct:</strong> Current expert-consensus recommendations call for 1.2--1.5 g of protein per kilogram per day in acutely ill patients and in well-nourished patients after surgery, reflecting the catabolic surgical stress response (Cederholm and Bosaeus, New England Journal of Medicine, 2024).</p>\n<p><strong>Why the incorrect answers are incorrect:</strong></p>\n<ul>\n<li><strong>a. 0.86 g/kg</strong> --- Approximates the healthy-adult maintenance requirement (~0.8 g/kg/day derived from nitrogen-balance studies), which is inadequate for the catabolic postoperative state (Cederholm and Bosaeus, New England Journal of Medicine, 2024).</li>\n\n<li><strong>b. 3.0 g/kg</strong> --- Far exceeds surgical requirements; ~3 g/kg/day is only cited for pediatric major-burn patients, not adult post-op patients. In adults even 1.5--2.0 g/kg is reserved for major burns/multitrauma (Porter et al., Lancet, 2016; McClave et al., SCCM/ASPEN, 2016).</li>\n\n<li><strong>d. 0.7 g/kg women / 1.0 g/kg men</strong> --- Both below and does not match any post-op recommendation; these sub-maintenance figures would worsen a negative nitrogen balance after surgery (Cederholm and Bosaeus, New England Journal of Medicine, 2024).</li>\n</ul>\n<p><strong>Background:</strong> Requirements escalate with catabolic burden --- roughly 0.8--1.2 g/kg/day in healthy adults, 1.2--1.5 g/kg/day in acute illness or post-surgery, and 1.5--2.0 g/kg/day (or higher) in severe burns or multiple trauma; targets are reduced in significant hepatic or renal impairment (Cederholm and Bosaeus, New England Journal of Medicine, 2024).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":103,"stem":"Which of the following conditions does NOT lead to an increase in protein requirements?","options":[{"letter":"A","text":"Chronic Wound complication"},{"letter":"B","text":"Obesity"},{"letter":"C","text":"Fistula"},{"letter":"D","text":"Burns"}],"correct":"B","explanation":"<p><strong>Why B (Obesity) is correct:</strong> Obesity, by itself, is not a hypercatabolic or protein-losing state and does not raise daily protein requirements the way active tissue injury does. It is categorized among chronic disease-related conditions with only low-grade inflammation, in contrast to the acute high-inflammation states that drive protein needs up (McClave et al., American College of Gastroenterology, 2016).</p>\n<p><strong>Why the incorrect answers are incorrect:</strong></p>\n<ul>\n<li><strong>a. Chronic Wound complication</strong> --- Wound healing demands increased protein for collagen synthesis and tissue repair, raising requirements (Chapple et al., Critical Care, 2026).</li>\n\n<li><strong>c. Fistula</strong> --- Fistulas cause direct, ongoing protein and nitrogen losses through the effluent, increasing needs (McClave et al., American College of Gastroenterology, 2016).</li>\n\n<li><strong>d. Burns</strong> --- Severe burns produce a profoundly hypermetabolic, hypercatabolic state with large exudative protein losses, requiring 1.5--2.0 g/kg/day in adults (Porter et al., Lancet, 2016; McClave et al., SCCM/ASPEN, 2016).</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":104,"stem":"How is cardiac output calculated?","options":[{"letter":"A","text":"(heart rate) x (diastolic blood pressure)"},{"letter":"B","text":"(heart rate) x (stroke volume)"},{"letter":"C","text":"(heart rate) \u00f7 (stroke volume)"},{"letter":"D","text":"(heart rate) x (systolic blood pressure)"}],"correct":"B","explanation":"<p><strong>Why B (heart rate \u00d7 stroke volume) is correct:</strong> Cardiac output is the volume of blood ejected by the heart per minute and equals stroke volume multiplied by heart rate (CO = SV \u00d7 HR). This is the standard definition applied in both physiology and echocardiographic hemodynamic assessment (K\u0159ivohlav\u00fd et al., Scientific Reports, 2026; Lisi et al., Heart Failure Reviews, 2024).</p>\n<p><strong>Why the incorrect answers are incorrect:</strong></p>\n<ul>\n<li><strong>a. HR \u00d7 diastolic blood pressure</strong> --- Blood pressure is a product of cardiac output and systemic vascular resistance, not a factor used to compute cardiac output; this yields no meaningful hemodynamic quantity.</li>\n\n<li><strong>c. HR \u00f7 stroke volume</strong> --- Dividing rather than multiplying is dimensionally wrong and does not produce volume-per-minute.</li>\n\n<li><strong>d. HR \u00d7 systolic blood pressure</strong> --- HR \u00d7 systolic pressure approximates the &quot;rate--pressure product,&quot; an index of myocardial oxygen demand, not cardiac output.</li>\n</ul>\n<p><strong>Background:</strong> Because CO = SV \u00d7 HR, cardiac index (CO normalized to body surface area) and stroke volume are derived from this relationship. Note that tachycardia can maintain a normal minute cardiac output even when stroke volume falls, so per-beat parameters (stroke volume) are sometimes more informative than the per-minute value (Lisi et al., Heart Failure Reviews, 2024).</p>","no_key":false,"no_options":false,"free_answer":null}];</script>
<script>
(function(){
  const STORAGE_KEY = 'progress-v1';
  // Namespaced by page title so multiple quiz files hosted/opened together
  // (outside Claude, where window.storage isn't available) don't clobber
  // each other's saved progress in the same browser's localStorage.
  const LOCAL_STORAGE_KEY = 'examquiz-progress:' + (document.title || 'default');
  let state = { answers: {}, flagged: {}, struck: {}, notes: {} }; // answers[num]={selected,correct}; struck[num]={LETTER:true}; notes[num]=string
  let filter = 'all';
  let currentIndex = 0;
  let pendingSelections = {}; // qnum -> letter, chosen but not yet confirmed (session-only)
  let notesSaveTimer = null;
