<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2008 Practice Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F5F3;
    --surface: #FFFFFF;
    --ink: #1B2430;
    --muted: #64707D;
    --border: #DFE3E0;
    --accent: #3B7DD8;
    --accent-dark: #2A5DA8;
    --accent-tint: #EAF1FB;
    --correct: #1E8A5F;
    --correct-bg: #E7F5EE;
    --correct-border: #A9DDC4;
    --incorrect: #BF3F27;
    --incorrect-bg: #FBEAE5;
    --incorrect-border: #EFB7A8;
    --flag: #B9821A;
    --flag-bg: #FCF1DC;
    --flag-border: #ECD9AC;
    --nokey: #7C6FB0;
    --nokey-bg: #EFEBFA;
    --nokey-border: #D6CDEE;
    --explain-text: #384250;
    --claude-orange: #3B7DD8;
    --claude-orange-dark: #2A5DA8;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(27,36,48,0.06), 0 4px 14px rgba(27,36,48,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181B;
      --surface: #1E2226;
      --ink: #E8EAEC;
      --muted: #97A1A9;
      --border: #333A40;
      --accent: #5B9AE6;
      --accent-dark: #3B7DD8;
      --accent-tint: #1B2A3D;
      --correct: #58D399;
      --correct-bg: #17301F;
      --correct-border: #2D5238;
      --incorrect: #F0876D;
      --incorrect-bg: #3A211B;
      --incorrect-border: #62362A;
      --flag: #E3B04B;
      --flag-bg: #362C15;
      --flag-border: #5B4A24;
      --nokey: #BBA9F5;
      --nokey-bg: #2A2440;
      --nokey-border: #453B66;
      --explain-text: #C7CDD3;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
    }
  }
  /* Explicit user override (Settings menu), regardless of system preference */
  :root[data-theme="dark"] {
    --bg: #15181B;
    --surface: #1E2226;
    --ink: #E8EAEC;
    --muted: #97A1A9;
    --border: #333A40;
    --accent: #5B9AE6;
    --accent-dark: #3B7DD8;
    --accent-tint: #1B2A3D;
    --correct: #58D399;
    --correct-bg: #17301F;
    --correct-border: #2D5238;
    --incorrect: #F0876D;
    --incorrect-bg: #3A211B;
    --incorrect-border: #62362A;
    --flag: #E3B04B;
    --flag-bg: #362C15;
    --flag-border: #5B4A24;
    --nokey: #BBA9F5;
    --nokey-bg: #2A2440;
    --nokey-border: #453B66;
    --explain-text: #C7CDD3;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  /* Explicit full-viewport backdrop, independent of document/content height
     or the host page's own background. Covers overscroll/bounce areas on
     iOS and any gap if the rendered content is shorter than the viewport,
     both of which can otherwise reveal the host app's own background
     color showing through instead of ours. Always in sync with the
     current theme since it references the same live CSS variable. */
  .bg-fill {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: -1;
  }
  #app {
    max-width: 1180px;
    margin: 0 auto;
    padding: 20px 20px 60px;
  }
  .cw-banner {
    background: linear-gradient(135deg, var(--claude-orange), var(--claude-orange-dark));
    color: #fff;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Inter', sans-serif;
  }
  .cw-banner-inner {
    max-width: 1180px;
    margin: 0 auto;
    width: 100%;
    display: grid;
    grid-template-columns: auto 1fr auto;
    grid-template-areas: "brand score settings";
    align-items: center;
    gap: 14px;
  }
  @media (max-width: 640px) {
    .cw-banner-inner {
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "brand settings"
        "score score";
      row-gap: 10px;
    }
    /* 3 icon buttons (notes/calculator/settings) plus the full brand
       cluster (bone + "All Quizzes" pill + "OrthoWorld" title) cannot
       both fit on one row at real phone widths (~375-430px) -- confirmed
       overflowing off the right edge of the viewport at 390px wide, with
       the calculator/settings icons partly or fully cut off. Dropping
       the "OrthoWorld" text here is the fix: the bone icon + home-link
       pill still clearly brand the page (and the domain itself is
       visible in the browser chrome), and it frees enough width that
       the icon row no longer needs to shrink itself to compensate. If
       you ever add a 4th banner icon, re-measure at 375px/390px again
       before assuming this still fits -- don't just eyeball it at
       desktop width.  */
    .cw-banner-title { display: none; }
  }
  .cw-brand {
    grid-area: brand;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cw-home-link {
    color: #fff;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    background: rgba(255,255,255,0.16);
    border-radius: 999px;
    padding: 5px 12px;
    white-space: nowrap;
  }
  .cw-home-link:hover { background: rgba(255,255,255,0.28); }
  .cw-banner-score {
    grid-area: score;
    display: flex;
    justify-content: center;
    min-width: 0;
  }
  .cw-banner-icon {
    flex: 0 0 30px;
    width: 30px;
    height: 30px;
  }
  .cw-banner-title {
    font-weight: 700;
    font-size: 1.4667rem;
    letter-spacing: -0.01em;
  }
  .cw-icons {
    grid-area: settings;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cw-settings { position: relative; }
  .cw-calc { position: relative; }
  .cw-notes { position: relative; }
  .settings-gear {
    background: rgba(255,255,255,0.16);
    border: none;
    border-radius: 8px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
  }
  .settings-gear:hover { background: rgba(255,255,255,0.26); }
  .settings-panel {
    position: absolute;
    top: 42px;
    right: 0;
    width: 264px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    padding: 14px;
    z-index: 20;
    color: var(--ink);
  }
  .settings-panel.hidden { display: none; }
  .calc-panel { width: 224px; }
  .notes-popup-panel { width: 280px; }
  .calc-display {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    text-align: right;
    font-family: 'Source Serif 4', serif;
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--ink);
    overflow-x: auto;
    white-space: nowrap;
  }
  .calc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 10px;
  }
  .calc-btn {
    height: 40px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .calc-btn:hover { border-color: var(--accent); }
  .calc-op { background: var(--accent-tint); color: var(--accent-dark); }
  .calc-zero { grid-column: span 2; }
  .calc-equals { background: var(--accent); color: #fff; border-color: var(--accent); }
  .calc-equals:hover { background: var(--accent-dark); }
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .settings-row + .settings-row { margin-top: 14px; }
  .settings-link {
    display: block;
    width: 100%;
    color: var(--ink);
    font-size: 0.8667rem;
    font-weight: 600;
    text-decoration: none;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .settings-link:hover { color: var(--accent-dark); }
  .settings-label {
    font-size: 0.8667rem;
    font-weight: 600;
    color: var(--muted);
  }
  .settings-stepper {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .settings-stepper button {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: inherit;
  }
  .settings-stepper button:hover { border-color: var(--accent); color: var(--accent-dark); }
  #font-pct {
    font-size: 0.8rem;
    color: var(--muted);
    min-width: 34px;
    text-align: center;
  }
  .settings-seg {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
  }
  .settings-seg button {
    background: var(--bg);
    border: none;
    border-left: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.7333rem;
    font-weight: 600;
    padding: 5px 7px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .settings-seg button:first-child { border-left: none; }
  .settings-seg button.active { background: var(--accent); color: #fff; }
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 28px;
  }
  header.top h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 1.4rem;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header.top .sub {
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.55;
    margin-top: 6px;
  }
  .score-pill {
    display: flex;
    align-items: center;
    gap: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: 999px;
    padding: 8px 20px;
    box-shadow: var(--shadow);
  }
  .score-pill .stat { text-align: center; }
  .score-pill .stat .num { font-size: 1.1333rem; font-weight: 700; font-family: 'Source Serif 4', serif; }
  .score-pill .stat .lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .score-pill .divider { width: 1px; height: 26px; background: var(--border); }

  .layout {
    display: grid;
    grid-template-columns: 264px 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .nav-panel { order: 2; position: static; }
    .qgrid { grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); }
  }
  @media (max-width: 480px) {
    #app { padding: 14px 14px 40px; }
    header.top h1 { font-size: 1.4rem; }
    header.top { margin-bottom: 22px; gap: 16px; }
    .score-pill { padding: 7px 14px; gap: 12px; }
    .score-pill .stat .num { font-size: 1rem; }
    .score-pill .divider { height: 22px; }
    .qpanel { padding: 18px 16px 16px; min-height: 0; }
    .qmeta { flex-direction: column; align-items: flex-start; gap: 10px; }
    .qmeta-actions { width: 100%; }
    .flag-toggle, .report-btn { flex: 1; justify-content: center; }
    .stem { font-size: 1.1333rem; margin-bottom: 16px; }
    .opt { padding: 11px 12px; font-size: 0.9667rem; }
    .strike-btn { flex-basis: 30px; }
    .confirm-btn { width: 100%; text-align: center; }
    .footer-nav { margin-top: 18px; padding-top: 12px; flex-wrap: wrap; }
    .position { order: -1; flex-basis: 100%; text-align: center; margin-bottom: 10px; font-size: 0.8rem; }
    .navbtn { padding: 9px 14px; font-size: 0.8667rem; }
  }

  .nav-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    position: sticky;
    top: 16px;
    box-shadow: var(--shadow);
  }
  .notes-panel-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .notes-panel-title .grid-label { margin-bottom: 0; }
  .notes-qnum {
    font-size: 0.75rem;
    color: var(--muted);
    font-weight: 600;
  }
  .notes-textarea {
    width: 100%;
    min-height: 220px;
    resize: vertical;
    box-sizing: border-box;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
  }
  .notes-textarea:focus { outline: none; border-color: var(--accent); }
  .notes-hint {
    margin-top: 8px;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .filter-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .filter-tabs button {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 600;
    padding: 5px 9px;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
  }
  .filter-tabs button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .grid-label {
    font-size: 0.7333rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .qgrid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    max-height: 360px;
    overflow-y: auto;
    padding-right: 14px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .qgrid::-webkit-scrollbar { width: 8px; }
  .qgrid::-webkit-scrollbar-track { background: transparent; }
  .qgrid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .qgrid::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  .qgrid button {
    aspect-ratio: 1;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    position: relative;
    padding: 0;
  }
  .qgrid button.current { box-shadow: inset 0 0 0 2px var(--accent-dark); }
  .qgrid button.correct { background: var(--correct-bg); border-color: var(--correct-border); color: var(--correct); }
  .qgrid button.incorrect { background: var(--incorrect-bg); border-color: var(--incorrect-border); color: var(--incorrect); }
  .qgrid button.nokey-done { background: var(--nokey-bg); border-color: var(--nokey-border); color: var(--nokey); }
  .qgrid button .flagdot {
    position: absolute; top: 2px; right: 2px;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--flag);
  }
  .legend {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 0.7667rem;
    color: var(--muted);
  }
  .legend span.sw { display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:6px; vertical-align: -1px;}
  .reset-btn {
    margin-top: 14px;
    width: 100%;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.8rem;
    padding: 7px;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
  }
  .reset-btn:hover { color: var(--incorrect); border-color: var(--incorrect-border); }

  .qpanel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 26px 28px 22px;
    box-shadow: var(--shadow);
    min-height: 420px;
  }
  .qmeta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .qmeta .qnum {
    font-size: 0.8333rem;
    font-weight: 700;
    color: var(--accent-dark);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .flag-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid var(--border);
    padding: 5px 11px;
    border-radius: 7px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
  }
  .flag-toggle.on {
    background: var(--flag-bg);
    border-color: var(--flag-border);
    color: var(--flag);
  }
  .qmeta-actions {
    display: flex;
    gap: 8px;
  }
  .report-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid var(--border);
    padding: 5px 11px;
    border-radius: 7px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
    text-decoration: none;
  }
  .report-btn:hover {
    border-color: #c0392b;
    color: #c0392b;
  }
  .stem {
    font-family: 'Source Serif 4', serif;
    font-size: 1.2667rem;
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .options { display: flex; flex-direction: column; gap: 9px; }
  .opt-row { display: flex; align-items: stretch; gap: 8px; }
  .opt-row .opt { flex: 1; }
  .strike-btn {
    flex: 0 0 34px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    border-radius: 8px;
    cursor: pointer;
    color: var(--muted);
    font-size: 0.8667rem;
    font-weight: 600;
    font-family: inherit;
  }
  .strike-btn:hover { border-color: var(--muted); color: var(--ink); }
  .strike-btn.active { background: var(--ink); border-color: var(--ink); color: #fff; }
  .opt {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    text-align: left;
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    font-family: inherit;
    font-size: 1rem;
    color: var(--ink);
    transition: border-color .12s, background .12s;
  }
  .opt:hover:not(.locked):not(.struck) { border-color: var(--accent); background: var(--accent-tint); }
  .opt .letter {
    flex: 0 0 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.8333rem;
    color: var(--muted);
  }
  .opt .text { padding-top: 2px; }
  .opt.selected .letter { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opt.correct-answer { border-color: var(--correct-border); background: var(--correct-bg); }
  .opt.correct-answer .letter { background: var(--correct); border-color: var(--correct); color: #fff; }
  .opt.wrong-answer { border-color: var(--incorrect-border); background: var(--incorrect-bg); }
  .opt.wrong-answer .letter { background: var(--incorrect); border-color: var(--incorrect); color: #fff; }
  .opt.locked { cursor: default; }
  .opt.struck { cursor: default; background: var(--bg); opacity: 0.6; }
  .opt.struck .text { text-decoration: line-through; }
  .opt.pending-selected { border-color: var(--accent); background: var(--accent-tint); }
  .opt.pending-selected .letter { background: var(--accent); border-color: var(--accent); color: #fff; }

  .confirm-btn {
    margin-top: 6px;
    align-self: flex-start;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
  }
  .confirm-btn:hover:not(:disabled) { background: var(--accent-dark); }
  .confirm-btn:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
  }

  .noopts-box {
    background: var(--nokey-bg);
    border: 1px solid var(--nokey-border);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 0.9333rem;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .reveal-btn {
    margin-top: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
  }

  .explain {
    margin-top: 20px;
    border-top: 1px solid var(--border);
    padding-top: 18px;
    animation: fadein .15s ease-in;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px);} to { opacity:1; transform: translateY(0);} }
  .verdict {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .verdict.correct { background: var(--correct-bg); color: var(--correct); }
  .verdict.incorrect { background: var(--incorrect-bg); color: var(--incorrect); }
  .verdict.nokey { background: var(--nokey-bg); color: var(--nokey); }
  .verdict-emoji { font-size: 1rem; margin-left: 2px; }
  .explain-body { font-size: 0.9667rem; color: var(--explain-text); }
  .explain-body p { margin: 0 0 10px; }
  .explain-body ul { margin: 0 0 10px; padding-left: 20px; }
  .explain-body li { margin-bottom: 6px; }
  .explain-body strong { color: var(--ink); }
  .nokey-note {
    font-size: 0.8667rem;
    color: var(--nokey);
    background: var(--nokey-bg);
    border-radius: 7px;
    padding: 8px 12px;
    margin-bottom: 12px;
  }
  .addendum {
    margin-top: 12px;
    background: var(--flag-bg);
    border: 1px solid var(--flag-border);
    border-radius: 8px;
    padding: 10px 14px;
  }
  .addendum p { margin: 0 0 6px; }
  .addendum p:last-child { margin-bottom: 0; }
  .addendum-label {
    font-size: 0.7333rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--flag);
    margin-bottom: 4px !important;

  .footer-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--border);

  .navbtn {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 9px 18px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    color: var(--ink);
    font-family: inherit;
  }
  .navbtn:hover:not(:disabled):not(.primary) { border-color: var(--accent); color: var(--accent-dark); }
  .navbtn:disabled { opacity: 0.4; cursor: not-allowed; }
  .navbtn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .navbtn.primary:hover:not(:disabled) { background: var(--accent-dark); color: #fff; }
  .position { color: var(--muted); font-size: 0.8667rem; }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 0.9667rem;
  }

<script>
const QUIZ_DATA = [{"number":1,"stem":"A 37 year old man is involved in a high speed motor vehicle collision. He is hemodynamically stable. A supine chest x-rays shows a pulmonary contusion and possible widened mediastinum. The most appropriate study to diagnosis the presence of a traumatic injury to the aorta is?","options":[{"letter":"A","text":"Transesophageal echocardiogram."},{"letter":"B","text":"Helical thin-cut CT angiography."},{"letter":"C","text":"Thoracic aortogram."},{"letter":"D","text":"MR scan of the thorax."}],"correct":"B","explanation":"<p>Why B is correct: In a hemodynamically stable patient, CT angiography of the chest is the diagnostic modality of choice for blunt traumatic aortic injury, with sensitivity and negative predictive value approaching 100%. It is fast, widely available, non-invasive, and simultaneously evaluates other thoracic and abdominal injuries (Fabian et al., Bruckner et al.; EAST practice management guideline; Granieri et al. meta-analysis). CT has replaced aortography as the reference standard.</p>\n<p>Why the others are incorrect:</p>\n<p>A) TEE is operator-dependent, cannot visualize the distal ascending aorta/arch branches well, and is reserved mainly for unstable patients who cannot go to CT.</p>\n\n<p>C) Thoracic aortogram was the historical gold standard but is invasive, slower, and now reserved for equivocal cases or during endovascular repair.</p>\n\n<p>D) MR of the thorax is too slow and logistically impractical for acute trauma.</p>\n<p>Background: EAST strongly recommends contrast CT of the chest for suspected blunt aortic injury; current management favors thoracic endovascular aortic repair (TEVAR) for grade II\u2013IV injuries.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":2,"stem":"Which of the following statements about the use of intravenous fat emulsions in the nutritionally depleted surgical patient is NOT true?","options":[{"letter":"A","text":"Daily infusion is associated with a higher incidence of infection."},{"letter":"B","text":"Critically ill patients achieve nitrogen balance more easily with a mixture of glucose and lipid compounds than with glucose alone."},{"letter":"C","text":"The requirements for essential fatty acids can be met with 1500 ml of 10% lipid per week."},{"letter":"D","text":"A 500 ml bottle of 20% lipid contains about 900 kilocalories."}],"correct":"A","explanation":"<p>Why A is the &quot;NOT true&quot; statement: Routine daily lipid administration is standard in modern parenteral nutrition and has not been reliably shown to increase infection when given at appropriate rates. The historical concern related to rapid infusion and reticuloendothelial/immune impairment, but a blanket statement that daily infusion raises infection is the least defensible of the four.</p>\n<p>Why the others are true:</p>\n<p>B) Adding lipid provides non-protein calories that spare protein and improve nitrogen balance compared with glucose alone.</p>\n\n<p>C) Essential fatty acid requirements are met with roughly 500 mL of 10% emulsion two to three times weekly; 1500 mL of 10% per week readily suffices.</p>\n\n<p>D) A 20% emulsion yields ~2 kcal/mL, so 500 mL \u2248 900\u20131000 kcal (&quot;about 900&quot; is approximately correct).</p>\n<p>Note: This is a weakly constructed item. Option D&#x27;s arithmetic (\u22481000 kcal) makes it a plausible alternative &quot;not true&quot; choice, but the word &quot;about&quot; keeps it defensible, leaving A as the intended answer.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":3,"stem":"In the acute-phase response to injury or infection, levels of which of the following serum proteins is decreased?","options":[{"letter":"A","text":"C-reactive protein."},{"letter":"B","text":"Fibrinogen."},{"letter":"C","text":"Ceruloplasmin."},{"letter":"D","text":"Albumin."}],"correct":"D","explanation":"<p>Why D is correct: Albumin is a negative acute-phase reactant; hepatic synthesis is downregulated during the acute-phase response, so serum levels fall.</p>\n<p>Why the others are incorrect: CRP (A), fibrinogen (B), and ceruloplasmin (C) are positive acute-phase reactants whose levels rise with inflammation.</p>\n<p>Background: Other negative acute-phase proteins include transferrin and prealbumin (transthyretin), which is why these markers are unreliable indices of nutrition during acute illness.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":4,"stem":"A 50 year old man develops severe septic shock following manipulation of an impacted ureteric stone. He is treated with aggressive volume resuscitation, vasopressor therapy, and mechanical ventilation. Which of the following therapies may further help him to survive his shock?","options":[{"letter":"A","text":"Infusion of IL-1 receptor antagonist."},{"letter":"B","text":"High dose steroid administration."},{"letter":"C","text":"Infusion of antiendotoxin antibodies."},{"letter":"D","text":"Infusion of activated protein C."}],"correct":"D","explanation":"<p>Why D was the intended answer: At the time of this exam, recombinant human activated protein C (drotrecogin alfa, Xigris) was the only agent approved for severe sepsis, based on the PROWESS trial showing a 28-day mortality reduction.</p>\n<p>Why the others are incorrect: IL-1 receptor antagonist (A) and antiendotoxin antibodies (C) failed to improve survival in trials. High-dose steroids (B) do not benefit septic shock and may cause harm (this is distinct from low-dose hydrocortisone for pressor-refractory shock).</p>\n<p>Note (evidence changed since 2008): Drotrecogin alfa was withdrawn worldwide in 2011 after the PROWESS-SHOCK trial showed no mortality benefit (28-day mortality 26.4% vs 24.2%, RR 1.09, P=0.31). Activated protein C is no longer available or recommended. Today, none of the four listed options is an accepted sepsis therapy; current care centers on early antibiotics, source control, balanced-fluid resuscitation, and vasopressors.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":5,"stem":"A 46 year old woman who has been on long-term prednisone therapy for rheumatoid arthritis needs an abdominal hysterectomy for fibroids. Which of the following complications may be expected to occur in this patient with greater than average frequency?","options":[{"letter":"A","text":"Poor wound healing."},{"letter":"B","text":"Pulmonary embolus."},{"letter":"C","text":"Ileus."},{"letter":"D","text":"Renal failure."}],"correct":"A","explanation":"<p>Why A is correct: Chronic corticosteroids impair fibroblast proliferation, collagen synthesis, and epithelialization, and blunt the inflammatory phase of healing, increasing rates of wound dehiscence and infection. These patients also require perioperative stress-dose steroid consideration.</p>\n<p>Why the others are incorrect: Chronic prednisone is not a specific independent risk factor for pulmonary embolus (B), ileus (C), or renal failure (D) relative to the surgery itself.</p>\n<p>Background: Vitamin A has been used to partially reverse the wound-healing impairment of corticosteroids.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":6,"stem":"The incidence of post-operative venous thromboembolism is increased in patients with genetically determined procoagulant states. The following are all procoagulant states, EXCEPT:","options":[{"letter":"A","text":"Antithrombin-III deficiency."},{"letter":"B","text":"Resistance to activated protein C (Factor V Leiden)."},{"letter":"C","text":"Antiphospholipid antibodies (lupus anticoagulant)."},{"letter":"D","text":"Hypohomocystinemia."}],"correct":"D","explanation":"<p>Why D is correct: It is HYPERhomocysteinemia, not hypohomocystinemia, that is prothrombotic. Low homocysteine is not a recognized thrombophilia.</p>\n<p>Why the others are incorrect: Antithrombin-III deficiency (A), Factor V Leiden/activated protein C resistance (B), and antiphospholipid antibody syndrome (C) are all established hypercoagulable states.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":7,"stem":"A 30 year old woman is being evaluated for abdominal pain in the Emergency Room when she suddenly develops a grand mal seizure with tonic clonic movements. The initial pharmacologic management of her seizure should be?","options":[{"letter":"A","text":"Phenytoin (dilantin) 1 gram IV (loading dose)."},{"letter":"B","text":"Lorazepam 0.1 mg/kg IV."},{"letter":"C","text":"Proprofol 40 mgs bolus IV."},{"letter":"D","text":"Phenobarbital 10 mgs/kg IV over 1 hour."}],"correct":"B","explanation":"<p>Why B is correct: A rapidly acting benzodiazepine is first-line therapy for an acute generalized tonic-clonic seizure/status epilepticus. IV lorazepam 0.1 mg/kg (max 4 mg per dose) is the American Epilepsy Society-recommended first-line agent (IM midazolam if no IV access).</p>\n<p>Why the others are incorrect: Phenytoin/fosphenytoin (A) is a second-line agent given after a benzodiazepine. Propofol (C) is reserved for refractory status requiring anesthesia/intubation, not initial management. Phenobarbital (D) is an alternative but slower and more sedating; it is not first-line.</p>\n<p>Background: The VA Cooperative Study (Treiman et al.) established lorazepam&#x27;s efficacy for overt status epilepticus.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":8,"stem":"A 65 year old woman presents to the Emergency Room with a right hip fracture. She is scheduled for open reduction and internal fixation the following day. The orthopedic resident notices that the patient is tachycardic and hyper-reflexic. Blood tests confirm that the patient has hyperthyroidism. The appropriate peri-operative management of this condition is?","options":[{"letter":"A","text":"Close observation in the ICU post-operatively."},{"letter":"B","text":"Begin propylthiouracil and proceed with surgery."},{"letter":"C","text":"Begin beta blockage with propranolol and proceed with surgery."},{"letter":"D","text":"Arrange urgent radio-iodine ablation and proceed with surgery."}],"correct":"C","explanation":"<p>Why C is correct: For semi-urgent surgery in a patient with symptomatic hyperthyroidism, beta-blockade (propranolol) rapidly controls the adrenergic manifestations (tachycardia, tremor) and reduces the risk of intraoperative thyroid storm. Propranolol also partially blocks peripheral T4-to-T3 conversion.</p>\n<p>Why the others are incorrect: Antithyroid drugs such as propylthiouracil (B) take weeks to render a patient euthyroid and do not provide rapid control for surgery the next day. Radioiodine ablation (D) is not an acute perioperative measure and takes weeks to months. Observation alone (A) leaves the adrenergic state untreated and risks thyroid storm.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":9,"stem":"Resuscitation from hypovolemic shock requires large quantities of fluids. Which of the following parameters are NOT helpful in assessing the adequacy of fluid resuscitation?","options":[{"letter":"A","text":"Serum lactate."},{"letter":"B","text":"Base deficit calculated from arterial blood gases."},{"letter":"C","text":"Near infrared spectroscopy."},{"letter":"D","text":"Central venous pressure."}],"correct":"D","explanation":"<p>Why D is correct: CVP is a poor static measure of intravascular volume status and does not reliably predict fluid responsiveness or the adequacy of resuscitation.</p>\n<p>Why the others are incorrect: Serum lactate (A) and base deficit (B) are validated markers of global tissue hypoperfusion and their trends track resuscitation adequacy. Near-infrared spectroscopy (C) provides tissue oxygenation data reflecting perfusion.</p>\n<p>Background: Dynamic indices (pulse pressure variation, stroke volume variation, passive leg raise) and lactate clearance are preferred over static CVP.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":10,"stem":"A 27 year old man is brought to the Emergency Room after being thrown from a motorcycle at high speed. His systolic blood pressure is 60. A chest x-ray shows a widened mediastinum. In addition to appropriate resuscitation, the next step in his management should be:","options":[{"letter":"A","text":"Immediate left thoracotomy."},{"letter":"B","text":"CT thorax."},{"letter":"C","text":"Aortic ach angiogram and possible stenting."},{"letter":"D","text":"Abdominal ultrasound (FAST)."}],"correct":"D","explanation":"<p>Why D is correct: This patient is profoundly hypotensive. A contained aortic injury rarely causes sustained hypotension (free rupture is usually immediately fatal), so persistent shock demands a rapid search for another hemorrhage source. Bedside FAST identifies intra-abdominal bleeding without moving an unstable patient. Contrast this with Question 1, where the stable patient goes to CT angiography.</p>\n<p>Why the others are incorrect: An unstable patient should not go to CT (B) or angiography/stenting (C). Empiric left thoracotomy (A) is not indicated for a widened mediastinum without another indication (e.g., loss of vitals).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":11,"stem":"A 70 year old man with a history of ischemic heart disease, two prior myocardial infarctions, and prior coronary artery bypass grafting, is scheduled to undergo right total hip replacement. Echocardiography confirms a decreased ejection fraction of 40% and no significant valvular disease. Stress thallium scan confirms a fixed perfusion defect inferiorly and no evidence of reversible ischemia. Pre-operative medical therapy to reduce cardiac morbidity and mortality in this patient should include?","options":[{"letter":"A","text":"An ACE inhibitor."},{"letter":"B","text":"Beta-adenergic blockade."},{"letter":"C","text":"Hydralazine afterload reduction."},{"letter":"D","text":"Digoxin."}],"correct":"B","explanation":"<p>Why B was the intended answer: In a patient with established ischemic heart disease undergoing noncardiac surgery, perioperative beta-blockade was the guideline-endorsed strategy in 2008 to reduce perioperative cardiac events, and beta-blockers reduce nonfatal MI.</p>\n<p>Why the others are less appropriate: Hydralazine (C) and digoxin (D) do not reduce perioperative cardiac morbidity/mortality in this setting. ACE inhibitors (A) are guideline-directed therapy for reduced-EF heart failure but were not the classic perioperative risk-reduction answer; ACE inhibitors also carry a risk of perioperative hypotension.</p>\n<p>Note (evidence changed since 2008): The POISE trial (2008) showed that high-dose metoprolol started 2\u20134 hours before surgery in beta-blocker\u2013na\u00efve patients reduced MI but increased stroke and all-cause mortality. Current guidance is to CONTINUE beta-blockers in patients already taking them, and to initiate only cautiously and at least 7 days preoperatively with titration \u2014 never as acute high-dose loading.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":12,"stem":"Regarding tight control of serum glucose levels in diabetic patients undergoing cardiac surgery, which of the following statements is correct?:","options":[{"letter":"A","text":"It has no affect on the incidence of post-op complications."},{"letter":"B","text":"It significantly reduces the incidence of deep sternal wound infections."},{"letter":"C","text":"It enhances neurtophil phagocytosis."},{"letter":"D","text":"It increases urine output."}],"correct":"B","explanation":"<p>Why B is correct: Perioperative insulin infusion to control hyperglycemia significantly reduces deep sternal wound infection after CABG. This is a Class 1 (LOE B-R) recommendation in the 2021 ACC/AHA/SCAI revascularization guideline.</p>\n<p>Why the others are incorrect: Glucose control clearly affects complications (A is false). While hyperglycemia impairs neutrophil function, &quot;enhances phagocytosis&quot; (C) is not the established clinical rationale/endpoint. Increased urine output (D) is a consequence of osmotic diuresis from hyperglycemia, not a benefit of control.</p>\n<p>Note (evidence refined since 2008): The optimal target has moved toward maintaining glucose &lt;180 mg/dL rather than very tight (&lt;110\u2013140 mg/dL) control. NICE-SUGAR (2009) showed very tight control increased hypoglycemia and mortality in general ICU patients, so &quot;tight&quot; is now interpreted as moderate control.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":13,"stem":"A 50 year old trauma patient is admitted to the ICU with a GCS of 8, unilateral posturing, an intracranial pressure (ICP) of 25, and a mean arterial pressure of 90. All of the following treatments will help to prevent secondary brain injury, EXCEPT?:","options":[{"letter":"A","text":"Sedation and muscle paralysis."},{"letter":"B","text":"CSF fluid drainage for persistent elevated ICP."},{"letter":"C","text":"Administration of the calcium-channel blocker nimodipine."},{"letter":"D","text":"Mild hyperventilation to a pCO2 of 35 mm/Hg."}],"correct":"C","explanation":"<p>Why C is correct: Nimodipine improves outcomes in aneurysmal subarachnoid hemorrhage (by reducing vasospasm-related deficits) but has no proven role in traumatic brain injury and does not prevent secondary injury after TBI.</p>\n<p>Why the others are incorrect: Sedation/paralysis (A) lowers cerebral metabolic demand and ICP. CSF drainage via ventriculostomy (B) is a first-tier ICP-lowering measure. Mild hyperventilation to pCO2 ~35 (D) transiently reduces ICP through cerebral vasoconstriction; aggressive hyperventilation (&lt;30) is avoided because it risks ischemia.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":14,"stem":"During fasting, the liver produces energy substraits by all of the following mechanisms, EXCEPT?","options":[{"letter":"A","text":"Glycogenolysis."},{"letter":"B","text":"Glycolysis."},{"letter":"C","text":"Gluconeogenesis from alanine."},{"letter":"D","text":"Formation of ketone bodies from fatty acids."}],"correct":"B","explanation":"<p>Why B is correct: During fasting the liver produces glucose (gluconeogenesis) and ketones for the rest of the body; it does not undergo net glycolysis (which consumes glucose). Fasting metabolism is catabolic and glucose-sparing.</p>\n<p>Why the others are incorrect: Glycogenolysis (A) supplies glucose in early fasting. Gluconeogenesis from alanine (C) via the glucose-alanine cycle sustains glucose production. Ketone body formation from fatty acids (D) provides fuel for the brain and other tissues during prolonged fasting.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":15,"stem":"Apoptosis (programmed cell death) is an important regulatory mechanism that limits inflammatory tissue injury. Inducers of apoptosis include all of the following, EXCEPT?","options":[{"letter":"A","text":"Hyperglycemia."},{"letter":"B","text":"Oxidant stress."},{"letter":"C","text":"Radiation."},{"letter":"D","text":"Cytokines."}],"correct":"A","explanation":"<p>Why A is the intended answer: Oxidant stress, radiation, and death-signaling cytokines (e.g., TNF, Fas ligand) are classic, well-established triggers of apoptosis. Hyperglycemia is the least established of these as a direct inducer in this context and is the intended exception.</p>\n<p>Why the others are incorrect: Oxidant stress (B), radiation (C, via DNA damage and p53 activation), and cytokines (D, via death-receptor pathways) are all recognized apoptosis inducers.</p>\n<p>Note: This item is imperfect \u2014 chronic hyperglycemia can promote apoptosis in some tissues (e.g., endothelial and neuronal cells) \u2014 but relative to the other three canonical inducers, hyperglycemia is the intended answer.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":16,"stem":"A 50 year old grossly malnourished alcoholic undergoes surgery for perforated gastric ulcer. Post-operatively, he is started on total parental nutrition because of sepsis and prolonged ileus. He is at risk of developing severe hypophosphatemia secondary to refeeding syndrome. Symptoms of severe hypophosphatemia include all of the following EXCEPT?","options":[{"letter":"A","text":"Myocardial depression."},{"letter":"B","text":"Atrial and ventricular arrhythmias."},{"letter":"C","text":"Muscle weakness leading to respiratory failure."},{"letter":"D","text":"Confusion, stupor, coma, seizures."}],"correct":"B","explanation":"<p>Why B was the intended exception: Traditional teaching attributed the cardiac manifestation of severe hypophosphatemia primarily to reduced myocardial contractility (depression), while arrhythmias were considered more characteristic of hypokalemia and hypomagnesemia.</p>\n<p>Why the others are features: Myocardial depression/cardiomyopathy (A), diaphragmatic weakness causing respiratory failure (C), and neurologic disturbances including confusion, coma, and seizures (D) are all well-described consequences of severe hypophosphatemia.</p>\n<p>Note (flawed item): Current literature does list cardiac arrhythmias \u2014 including ventricular arrhythmias \u2014 as a recognized manifestation of severe acute hypophosphatemia, so strictly speaking all four options can occur. This question does not have a cleanly correct exception by modern evidence; B is the intended answer.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":17,"stem":"The syndrome of inappropriate secretion of anti-diuretic hormone (SIADH) may be caused by all of the following, EXCEPT?","options":[{"letter":"A","text":"Lung tumours."},{"letter":"B","text":"Congestive heart failure."},{"letter":"C","text":"Closed head injury."},{"letter":"D","text":"Alcohol withdrawal."}],"correct":"B","explanation":"<p>Why B is correct: CHF causes hyponatremia through non-osmotic ADH release, but this occurs in a hypervolemic, edematous state and is by definition NOT SIADH. SIADH requires euvolemia with the exclusion of edematous states (heart failure, cirrhosis, nephrosis).</p>\n<p>Why the others are incorrect: Lung tumors (A, ectopic ADH from small cell carcinoma), closed head injury (C, CNS causes), and alcohol withdrawal (D, a recognized CNS-associated cause) can all produce SIADH.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":18,"stem":"The proliferative phase of wound healing is characterized by collagen deposition and remodeling as well as wound contraction. The cell most responsible for this is?","options":[{"letter":"A","text":"The myocyte."},{"letter":"B","text":"The fibroblast."},{"letter":"C","text":"The macrophage."},{"letter":"D","text":"The endothelial cell."}],"correct":"B","explanation":"<p>Why B is correct: Fibroblasts synthesize collagen and, when differentiated into myofibroblasts, mediate wound contraction. They are the dominant cell of the proliferative phase.</p>\n<p>Why the others are incorrect: Myocytes (A) are not central to wound healing. Macrophages (C) orchestrate the inflammatory phase and secrete growth factors but do not deposit collagen. Endothelial cells (D) drive angiogenesis, a supporting process, not collagen deposition/contraction.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":19,"stem":"A 20 year old man sustained severe left thoracic trauma after a fall of 20 feet. He is awake, alert, and neurologically intact. Pulse oximetry demonstrates a 90% oxygen saturation on nasal prong O2 at 4l/min. Chest x-ray shows a left pneumothorax and a chest tube is placed which drains 500 mls of blood. An abdominal CT scan is normal. Over the next 4 hours the chest tube drains 250 mls/hr and the patient has intermittent hypotension. The next step in management should be?","options":[{"letter":"A","text":"Placement of a second chest tube."},{"letter":"B","text":"CT angio of thorax."},{"letter":"C","text":"Vasopressor therapy."},{"letter":"D","text":"Emergency thoracotomy."}],"correct":"D","explanation":"<p>Why D is correct: Ongoing hemorrhage of ~250 mL/hr over 4 hours (roughly 200 mL/hr for 2\u20134 hours, or &gt;1500 mL initial output) with hemodynamic instability meets criteria for operative exploration of a hemothorax.</p>\n<p>Why the others are incorrect: A second chest tube (A) does not address surgical bleeding. CT angiography (B) delays definitive control in an unstable, actively bleeding patient. Vasopressors (C) do not treat ongoing hemorrhage and can worsen perfusion.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":20,"stem":"A 37 year old farmer rolls his tractor and is trapped underneath for four hours. He has a crush injury to both legs including bilateral femur fractures. Twenty-four hours after admission, he was found to have the following blood work: Na 140, K 5.7, Cl 100, HCO3 10, Cr 220, CPK 15,000. The first step in preventing renal failure in this patient is?","options":[{"letter":"A","text":"Loop diuretic administration."},{"letter":"B","text":"Mannitol administration."},{"letter":"C","text":"Restoring adequate circulating volume."},{"letter":"D","text":"Alkalinization of urine with sodium bicarbonate."}],"correct":"C","explanation":"<p>Why C is correct: The cornerstone of preventing rhabdomyolysis-associated acute kidney injury is early, aggressive isotonic IV fluid resuscitation to restore renal perfusion and establish brisk urine output. This must precede any other measure.</p>\n<p>Why the others are incorrect: Loop diuretics (A) are not first-line and may worsen intravascular depletion. Mannitol (B) and urinary alkalinization with bicarbonate (D) are adjuncts of uncertain/controversial benefit that are considered only after adequate volume repletion and urine flow are established.</p>\n<p>Background: Target urine output is roughly 200\u2013300 mL/hr; fluids should ideally start within 6 hours of injury.</p>\n<p><strong>Questions 21\u201323.</strong> For each, select the one most closely associated answer: A) case control study, B) cohort study, C) both, D) neither.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":21,"stem":"For each of the following three questions, select the one answer that is closely associated with the question stem: Prospective design","options":[{"letter":"A","text":"Case control study."},{"letter":"B","text":"Cohort study."},{"letter":"C","text":"Both."},{"letter":"D","text":"Neither."}],"correct":"B","explanation":"<p>Why B is correct: Cohort studies classically follow exposed and unexposed groups forward in time (prospective), measuring incident outcomes. Why the others are incorrect: Case-control studies (A) are inherently retrospective, starting from outcome (cases vs controls) and looking back at exposures; &quot;both&quot; (C) and &quot;neither&quot; (D) are therefore incorrect for a prospective design.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":22,"stem":"For each of the following three questions, select the one answer that is closely associated with the question stem: Reasonable design when outcome is rare","options":[{"letter":"A","text":"Case control study."},{"letter":"B","text":"Cohort study."},{"letter":"C","text":"Both."},{"letter":"D","text":"Neither."}],"correct":"A","explanation":"<p>Why A is correct: Case-control design is efficient for rare outcomes because it samples on the basis of the outcome, ensuring adequate numbers of cases without following huge populations. Why the others are incorrect: A cohort study (B) would require an impractically large sample and long follow-up to accrue rare events; C and D do not fit.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":23,"stem":"For each of the following three questions, select the one answer that is closely associated with the question stem: Strength of association (conclusions) similar to randomized trials","options":[{"letter":"A","text":"Case control study."},{"letter":"B","text":"Cohort study."},{"letter":"C","text":"Both."},{"letter":"D","text":"Neither."}],"correct":"C","explanation":"<p>Why C is correct: Well-designed observational studies \u2014 both cohort and case-control \u2014 have been shown to yield estimates of treatment effect similar to those of randomized trials (Concato et al. and Benson &amp; Hartz, NEJM 2000). Why the others are incorrect: Restricting this to one design (A or B) is inaccurate, and &quot;neither&quot; (D) contradicts the published comparisons.</p>\n<p>Note: This is a debatable item; some would argue cohort designs alone, but the classic literature encompassed both observational designs.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":24,"stem":"Which of the following statements concerning the metabolic response to simple starvation is NOT true?","options":[{"letter":"A","text":"Starvation results in a respiratory quotient of 0.6-0.7, indicative of fat as a primary fuel source."},{"letter":"B","text":"The Cori and Alanine cycles provide carbon for gluconeogenesis in the liver."},{"letter":"C","text":"Resting energy expenditure decreases in simple starvation."},{"letter":"D","text":"Lipogenesis ensures maintenance of fat reserves."}],"correct":"D","explanation":"<p>Why D is correct: In starvation, the body undergoes net lipolysis to mobilize fat stores for fuel \u2014 not lipogenesis. Fat reserves are consumed, not maintained.</p>\n<p>Why the others are true: A low respiratory quotient of ~0.7 (A) reflects fat oxidation as the primary fuel. The Cori (lactate) and glucose-alanine cycles (B) supply carbon skeletons for hepatic gluconeogenesis. Resting energy expenditure falls (C) as an adaptive, energy-conserving response to simple starvation (in contrast to the hypermetabolism of injury/sepsis).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":25,"stem":"A patient who develops angioedema after the administration of penicillin is scheduled for a craniotomy to ablate a seizure focus. Which of the following options is most appropriate with respect to antibiotic prophylaxis?","options":[{"letter":"A","text":"No antibiotic prophylaxis."},{"letter":"B","text":"Cefazolin 1 gram IV at the time of induction."},{"letter":"C","text":"Vancomycin 1 gram IV at the time of induction."},{"letter":"D","text":"Vancomycin 1 gram and Gentamyacin 160 mgs IV at the time of induction."}],"correct":"C","explanation":"<p>Why C was the intended answer: Craniotomy is a clean procedure that warrants antibiotic prophylaxis. Given a history of penicillin-induced angioedema (an IgE-mediated reaction), 2008-era teaching avoided beta-lactams entirely and used vancomycin as the alternative for clean neurosurgery.</p>\n<p>Why the others are incorrect: No prophylaxis (A) is inappropriate for craniotomy. Adding gentamicin (D) provides unnecessary gram-negative coverage and nephro-/ototoxicity risk for routine clean cranial surgery. Cefazolin (B) was avoided under the older assumption of significant penicillin\u2013cephalosporin cross-reactivity.</p>\n<p>Note (evidence changed since 2008): Cefazolin has a unique R1 side chain and negligible cross-reactivity with penicillins. Reaction rates in penicillin-allergic patients are ~0.7\u20130.8%, and the 2022 AAAAI/ACAAI drug allergy practice parameter states a structurally dissimilar cephalosporin such as cefazolin can be given even after penicillin anaphylaxis without testing. By current standards, cefazolin (B) would be an acceptable \u2014 arguably preferred \u2014 prophylactic agent; it should be avoided only for severe delayed reactions (e.g., SJS/TEN, DRESS). Vancomycin remains a reasonable choice, especially where MRSA risk is high.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":26,"stem":"Hepatocellular carcinoma is epidemiologically associated with all of the following, EXCEPT?","options":[{"letter":"A","text":"Hepatitis A."},{"letter":"B","text":"Hepatitis B."},{"letter":"C","text":"Hepatitis C."},{"letter":"D","text":"Alcoholic cirrhosis."}],"correct":"A","explanation":"<p>Why A is correct: Hepatitis A is an acute, self-limited fecal-orally transmitted infection that does not cause chronic infection or cirrhosis, and therefore is not a risk factor for HCC.</p>\n<p>Why the others are incorrect:</p>\n<p>B) Hepatitis B is a leading global cause of HCC and is directly oncogenic (viral DNA integration), causing cancer even without cirrhosis.</p>\n\n<p>C) Hepatitis C is a major cause of cirrhosis and HCC, chiefly through chronic inflammation and fibrosis.</p>\n\n<p>D) Alcoholic cirrhosis is an established risk factor; nearly any cause of cirrhosis predisposes to HCC.</p>\n<p>Background: HCC arises predominantly in the setting of chronic liver disease/cirrhosis (viral hepatitis B/C, alcohol, and now metabolic dysfunction\u2013associated steatohepatitis). Only chronic hepatitides drive carcinogenesis.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":27,"stem":"A 75 year old woman undergoes bilateral total knee replacement. On the third post-operative day, she developed hypotension with a blood pressure of 90/60, heart rate 120. An electrocardiogram shows marked ST segment depression in the lateral leads. The initial management of this hypotension should be?","options":[{"letter":"A","text":"IV fluid bolus."},{"letter":"B","text":"Initiate inotropic support."},{"letter":"C","text":"Emergency cardiac catheterization to attempt coronary revascularization."},{"letter":"D","text":"Support cardiac function with intra-aortic balloon pump."}],"correct":"A","explanation":"<p>Why A is correct: On POD3 after bilateral TKA, hypotension with reflex tachycardia most likely reflects hypovolemia (blood loss, third-spacing, inadequate replacement). The ST depression represents demand ischemia driven by hypotension and tachycardia. Restoring preload with a fluid bolus treats the underlying cause and reduces myocardial oxygen demand. Initial management addresses volume first.</p>\n<p>Why the others are incorrect:</p>\n<p>B) Inotropes increase myocardial oxygen demand and are inappropriate before correcting hypovolemia; they can worsen demand ischemia.</p>\n\n<p>C) Emergency catheterization is not the initial step for demand ischemia secondary to a correctable hemodynamic cause; the ECG shows depression, not STEMI.</p>\n\n<p>D) An intra-aortic balloon pump is an advanced device reserved for cardiogenic shock refractory to initial measures, not first-line here.</p>\n<p>Background: ST-segment depression is usually subendocardial demand ischemia (type 2 MI physiology). Optimize preload, heart rate, oxygenation, and pain, then reassess.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":28,"stem":"A 25 year old man driving a motorcycle strikes a guard rail and is taken to the nearest Emergency Room. He is found to have multiple left rib fractures and a small pneumothorax on chest x-ray. A CT scan shows a subcapsulsar hematoma of the spleen. A chest tube is inserted but unfortunately entered the abdomen and ruptures the subcapsular hematoma necessitating laparotomy and splenectomy. Post-operatively the patient is doing well in the Intensive Care Unit. What should the surgeon tell the patients wife?","options":[{"letter":"A","text":"\u201cHe is doing well.\u201d"},{"letter":"B","text":"\u201cHis spleen was injured and we had to take it out.\u201d"},{"letter":"C","text":"\u201cUnfortunately, we caused his spleen to bleed while treating his lung injury and we had to take the spleen out.\u201d"},{"letter":"D","text":"\u201cI am sorry, we almost killed your husband with a chest tube, but fortunately we were able to rescue him.\u201d"}],"correct":"C","explanation":"<p>Why C is correct: Ethical practice requires honest, factual disclosure of adverse events and complications. Option C accurately and clearly explains what happened and what was done, in language that is truthful without being sensational.</p>\n<p>Why the others are incorrect:</p>\n<p>A) Omits the complication entirely \u2014 a failure of disclosure.</p>\n\n<p>B) Is technically incomplete and misleading; it implies the spleen injury alone mandated removal, concealing the iatrogenic cause.</p>\n\n<p>D) Is factually distorted and inflammatory (&quot;almost killed,&quot; &quot;rescue&quot;), overstating events and undermining informed communication.</p>\n<p>Background: Disclosure of medical error should be prompt, truthful, and clear, with an expression of regret and a factual account \u2014 neither concealed nor dramatized.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":29,"stem":"Metabolic acidosis with a high anion gap maybe be produced by all of the following, EXCEPT?","options":[{"letter":"A","text":"Hypovolemic shock."},{"letter":"B","text":"Acute renal failure."},{"letter":"C","text":"Acetylsalicylic acid intoxication."},{"letter":"D","text":"Chronic diarrhea."}],"correct":"D","explanation":"<p>Why D is correct: Chronic diarrhea causes a normal anion gap (hyperchloremic) metabolic acidosis from gastrointestinal bicarbonate loss, not a high anion gap acidosis.</p>\n<p>Why the others are incorrect:</p>\n<p>A) Hypovolemic shock produces lactic acidosis (elevated anion gap) from tissue hypoperfusion.</p>\n\n<p>B) Acute renal failure causes retention of unmeasured anions (sulfates, phosphates, organic acids) \u2192 high anion gap.</p>\n\n<p>C) Salicylate intoxication produces a high anion gap acidosis (accumulation of lactate and ketoacids/salicylate), classically with a coexisting respiratory alkalosis.</p>\n<p>Background: High anion gap acidosis mnemonic (GOLD MARK / MUDPILES) includes lactate, renal failure, and salicylates. GI bicarbonate loss is the prototypical normal-gap acidosis.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":30,"stem":"Radiation therapy for malignancy primarily depends on DNA damage. The extent of DNA damage following radiotherapy is dependent on all of the following, EXCEPT?","options":[{"letter":"A","text":"Cellular oxygen level."},{"letter":"B","text":"The phase of the cell cycle."},{"letter":"C","text":"Use of radiation sensitizers such as 5-flouoroucil."},{"letter":"D","text":"Tissue intracellular pH."}],"correct":"D","explanation":"<p>Why D is correct: Intracellular pH is not a recognized determinant of radiation-induced DNA damage.</p>\n<p>Why the others are incorrect:</p>\n<p>A) The &quot;oxygen effect&quot; is fundamental: oxygen fixes free-radical DNA damage, making well-oxygenated tissue more radiosensitive; hypoxic tumor cells are radioresistant.</p>\n\n<p>B) Radiosensitivity varies through the cell cycle (most sensitive in M and G2, most resistant in late S phase).</p>\n\n<p>C) Radiosensitizers such as 5-fluorouracil enhance radiation-induced DNA damage.</p>\n<p>Background: The classic &quot;4 Rs&quot; of radiobiology (repair, reoxygenation, repopulation, redistribution) plus the oxygen effect govern radiation response; pH is not among them.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":31,"stem":"A 45 year old man who was involved in a motor vehicle accident remains hypotensive despite attempted resuscitation with crystalloids. Abdominal sonography reveals a large amount of fluid in the abdomen. The patient states that he will not accept blood transfusions for religious reasons. The next step in his management should be?","options":[{"letter":"A","text":"Angiography and embolization of bleeding sites."},{"letter":"B","text":"Secure an emergency court order for blood transfusion."},{"letter":"C","text":"Exploratory laparotomy without blood products."},{"letter":"D","text":"Administration of vasopressor."}],"correct":"C","explanation":"<p>Why C is correct: A hemodynamically unstable patient with a positive FAST has ongoing intra-abdominal hemorrhage requiring immediate surgical control of the bleeding source. A competent adult&#x27;s refusal of blood must be respected; surgery proceeds without transfusion.</p>\n<p>Why the others are incorrect:</p>\n<p>A) Angioembolization is inappropriate for an unstable patient who needs operative control; it delays definitive hemorrhage control.</p>\n\n<p>B) A competent adult may refuse blood; overriding this refusal by court order violates autonomy and is not the appropriate action.</p>\n\n<p>D) Vasopressors do not address the source of hemorrhage and are not a substitute for surgical control in exsanguinating trauma.</p>\n<p>Background: Respect for autonomy is paramount for a competent patient (e.g., Jehovah&#x27;s Witness). Definitive hemorrhage control still proceeds, using blood-conservation strategies (cell salvage where acceptable, hemostatic agents, permissive approaches).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":32,"stem":"Which of the following statements about post-operative infections is NOT true?","options":[{"letter":"A","text":"Increases in patients with diabetes mellitus."},{"letter":"B","text":"Can be reduced with clipping versus dry shaving."},{"letter":"C","text":"Can be reduced by perioperative delivery of 80% oxygen."},{"letter":"D","text":"Can be reduced by maintaining mild (35%) intra-operative hypothermia."}],"correct":"D","explanation":"<p>Why D is correct (the false statement): Intra-operative hypothermia increases surgical site infection risk (vasoconstriction, impaired neutrophil function, reduced tissue oxygenation). Maintaining normothermia \u2014 not hypothermia \u2014 reduces infection.</p>\n<p>Why the others are true:</p>\n<p>A) Diabetes/hyperglycemia impairs immune function and increases infection risk.</p>\n\n<p>B) Clipping causes fewer microscopic skin injuries than razor shaving and lowers SSI risk; shaving is discouraged.</p>\n\n<p>C) Supplemental perioperative oxygen was reported to reduce SSI in colorectal surgery (the accepted teaching at the time, though later trials produced mixed results).</p>\n<p>Background: Core SSI-prevention bundles emphasize normothermia, glycemic control, appropriate hair removal (clip, don&#x27;t shave), and timely antibiotic prophylaxis.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":33,"stem":"Which of the following statements concerning post-operative hyponatremia is NOT true?","options":[{"letter":"A","text":"Hyperglycemia may be a cause of hyponatremia."},{"letter":"B","text":"Following craniotomy, hyponatremia despite adequate salt administration is usually caused by occult renal dysfunction."},{"letter":"C","text":"Hyponatremia may occur when water is used to replace sodium-containing fluids."},{"letter":"D","text":"In oliguric patients, cellular catabolism with resultant metabolic acidosis increases cellular release of water and can contribute to hyponatremia."}],"correct":"B","explanation":"<p>Why B is correct (the false statement): Post-craniotomy hyponatremia is caused by SIADH or cerebral salt wasting \u2014 not &quot;occult renal dysfunction.&quot; These neuroendocrine mechanisms, not intrinsic renal failure, explain persistent hyponatremia despite salt replacement.</p>\n<p>Why the others are true:</p>\n<p>A) Hyperglycemia causes dilutional (translocational) hyponatremia by osmotically drawing water into the extracellular space.</p>\n\n<p>C) Replacing sodium-containing losses with electrolyte-free water produces hyponatremia.</p>\n\n<p>D) Catabolism generates endogenous water and can contribute to hyponatremia in oliguric patients.</p>\n<p>Background: Distinguish SIADH (euvolemic, concentrated urine, treat with fluid restriction) from cerebral salt wasting (hypovolemic, treat with salt and volume) after intracranial pathology.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":34,"stem":"Which of following statements concerning reperfusion injury is correct?","options":[{"letter":"A","text":"Reperfusion injury is initiated by the formation of oxygen-derived free radicals."},{"letter":"B","text":"Free radicals cause membrane lipid peroxidation rendering capillary vessels more permeable."},{"letter":"C","text":"The deleterious effects of free radicals is worsened by superoxide dismutase."},{"letter":"D","text":"Neutrophils play no role in reperfusion injury."}],"correct":"A","explanation":"<p>Why A is correct: Reperfusion injury is initiated by a burst of reactive oxygen species generated when oxygen is reintroduced to previously ischemic tissue (e.g., via xanthine oxidase).</p>\n<p>Why the others are incorrect:</p>\n<p>C) Superoxide dismutase is a protective antioxidant enzyme that scavenges superoxide; it mitigates, not worsens, free-radical injury.</p>\n\n<p>D) Neutrophils are central to reperfusion injury, causing further oxidative damage and microvascular plugging.</p>\n<p>Note on a flawed item: Option B (&quot;free radicals cause membrane lipid peroxidation rendering capillary vessels more permeable&quot;) is also a true statement. This question has two defensible correct answers; A best captures the initiating event, but B is not wrong.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":35,"stem":"During an emergency appendectomy, a surgical resident sustains an injury from a contaminated hollow-bore needle with spontaneous bleeding. Which of the following blood-borne diseases is most like to be transmitted, assuming the patient was infected with all of these?","options":[{"letter":"A","text":"HIV."},{"letter":"B","text":"Hepatitis B."},{"letter":"C","text":"Hepatitis C."},{"letter":"D","text":"Malaria."}],"correct":"B","explanation":"<p>Why B is correct: Per-percutaneous-exposure transmission risk is highest for hepatitis B, historically cited at roughly 6\u201330% (up to ~40% if source is HBeAg-positive) (Beltrami et al., Clin Microbiol Rev, 2000; Gerberding, New England Journal of Medicine, 1995).</p>\n<p>Why the others are less likely:</p>\n<p>A) HIV transmission risk after percutaneous exposure is ~0.3%.</p>\n\n<p>C) Hepatitis C risk is intermediate, ~1.8% (recent estimates as low as ~0.2%).</p>\n\n<p>D) Malaria is only rarely transmitted via needlestick.</p>\n<p>Background: Approximate hierarchy per percutaneous exposure: HBV (highest) \u226b HCV (~1.8%) &gt; HIV (~0.3%). A vaccinated, immune healthcare worker is at virtually no risk for HBV \u2014 reinforcing the value of HBV vaccination.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":36,"stem":"A five week old boy had a five day history of vomiting and resultant weight loss of 0.4 kgs (4.0 kgs to 3.6 kgs). Examination finds his anterior fontanels flattened and his mucous membranes dry. Laboratory data are as follows: Na 132, K 3.2, Cl 91, CO2 28, Capillary pH 7. This patient is suffering from which of the following acid-base disorders?","options":[{"letter":"A","text":"None."},{"letter":"B","text":"Metabolic alkalosis."},{"letter":"C","text":"Respiratory alkalosis."},{"letter":"D","text":"Compensated metabolic acidosis."}],"correct":"B","explanation":"<p>Why B is correct: A 5-week-old with projectile vomiting and dehydration is the classic presentation of hypertrophic pyloric stenosis, producing a hypochloremic, hypokalemic metabolic alkalosis. The labs fit precisely: elevated bicarbonate (CO2 28), low chloride (91), and low potassium (3.2) from loss of gastric HCl.</p>\n<p>Why the others are incorrect:</p>\n<p>A) There is a clear derangement.</p>\n\n<p>C) Respiratory alkalosis would show a low pCO2 with low bicarbonate, not an elevated bicarbonate.</p>\n\n<p>D) A compensated metabolic acidosis would show a low bicarbonate, the opposite of this picture.</p>\n<p>Background: Correct the volume and electrolyte/acid-base derangement with saline and potassium first; pyloromyotomy is definitive but is never an emergency before resuscitation.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":37,"stem":"A 47 year old man undergoes resection of a large retroperitoneal liposarcoma. Post-operatively he develops acute renal failure requiring intermittent hemodialysis. A dietitian estimates that he requires 70 grams of protein and 2500 kilocalories per day for optimal wound healing. Since he is in acute renal failure, his nutritional goal should be adjusted to:","options":[{"letter":"A","text":"Same \u2014 70 grams protein, 2500 kilocalories."},{"letter":"B","text":"Low protein diet \u2014 35 grams protein, 2500 kilocalories."},{"letter":"C","text":"Adjusted low protein diet \u2014 35 grams protein, 1500 kilocalories."},{"letter":"D","text":"Hyperalimentation \u2014 100 grams protein, 3500 kilocalories."}],"correct":"A","explanation":"<p>Why A is correct: Once a patient is receiving renal replacement therapy (hemodialysis), protein should NOT be restricted. Dialysis removes nitrogenous waste and also causes amino acid losses, so full protein and caloric provision is required to support wound healing and counter catabolism.</p>\n<p>Why the others are incorrect:</p>\n<p>B, C) Protein restriction is a strategy to delay dialysis in non-dialyzed CKD; it is inappropriate and harmful once dialysis has begun, especially in a catabolic post-surgical patient.</p>\n\n<p>D) Overfeeding/hyperalimentation risks metabolic complications and is not indicated.</p>\n<p>Background: Critically ill patients on renal replacement therapy typically need higher protein delivery (often ~1.5 g/kg/day or more), not restriction.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":38,"stem":"An 85 year old man undergoes open reduction and internal fixation for a right hip fracture. On post-operative day three he suffers a massive myocardial infarction and is transferred to the Intensive Care Unit where he is ventilated. In the ICU, he develops pneumonia, acute renal failure, and a large left middle cerebral artery stroke. All physicians caring for the patient agree that the situation is hopeless, but the patient\u2019s family demands continuation of all care, including ventilation and haemodialysis, because of religious beliefs. What should his treating physician do at this time?","options":[{"letter":"A","text":"Refuse to provide futile care and extubate the patient."},{"letter":"B","text":"Ask the hospital lawyer to obtain a court order to allow the patient to be extubated."},{"letter":"C","text":"Negotiate with the family with the help of an appropriate religious leader."},{"letter":"D","text":"Continue all treatment and hope the patient dies soon, thus freeing up the ICU bed."}],"correct":"C","explanation":"<p>Why C is correct: When conflict arises over goals of care rooted in religious belief, the appropriate first step is communication and negotiation, engaging culturally and spiritually appropriate support (a religious leader) alongside ethics consultation to reach a shared understanding.</p>\n<p>Why the others are incorrect:</p>\n<p>A) Unilateral withdrawal without process is inappropriate and disregards the family and due process.</p>\n\n<p>B) Legal action is a last resort after communication, mediation, and ethics consultation have failed.</p>\n\n<p>D) Is unethical, dishonest, and prioritizes resources over patient/family-centered care.</p>\n<p>Background: Disputes over potentially non-beneficial (&quot;futile&quot;) care are managed with a graded process: communication, family meetings, spiritual/cultural support, ethics consultation, and only rarely formal dispute-resolution/legal mechanisms.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":39,"stem":"You are reviewing a study comparing medical vs. surgical treatment of inflammatory bowel disease. You notice that the patients referred for surgery tended to be younger and fitter than those treated medically. The validity of this study is therefore compromised because of:","options":[{"letter":"A","text":"Selection bias."},{"letter":"B","text":"Measurement bias."},{"letter":"C","text":"Confounding variables."},{"letter":"D","text":"External validity (generalizeability)."}],"correct":"C","explanation":"<p>Why C is correct: Age and fitness are independently associated with both the exposure (being chosen for surgery) and the outcome (recovery/survival). Such variables distort the observed treatment\u2013outcome relationship, which is the definition of confounding. Younger, fitter patients would fare better regardless of treatment, making surgery appear falsely superior.</p>\n<p>Why the others are less correct:</p>\n<p>A) Selection bias describes systematic error in how participants enter or are retained in a study; here the core threat is the imbalance in prognostic factors between groups, i.e., confounding. (This item can be argued either way, but confounding is the strongest single answer.)</p>\n\n<p>B) Measurement bias concerns systematic error in how outcomes/exposures are measured.</p>\n\n<p>D) External validity concerns generalizability to other populations, not the internal validity threat described.</p>\n<p>Background: Confounding can be addressed by randomization (prevents it), or in observational data by restriction, matching, stratification, or multivariable adjustment.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":40,"stem":"Patients requiring massive blood transfusion often become cooagulopathic. Which of the following factors is NOT a significant cause of such coagulopathy?","options":[{"letter":"A","text":"Dilution of coagulation factors."},{"letter":"B","text":"Metabolic acidosis."},{"letter":"C","text":"Hypocalcaemia."},{"letter":"D","text":"Hypothermia."}],"correct":"C","explanation":"<p>Why C was the intended answer: The classic &quot;lethal triad&quot; of trauma coagulopathy comprises dilution/consumption of clotting factors, acidosis, and hypothermia. Hypocalcemia was traditionally taught as a cardiovascular/citrate-toxicity concern rather than a primary driver of coagulopathy, making it the &quot;NOT a significant cause&quot; answer.</p>\n<p>Why the others are significant causes:</p>\n<p>A) Dilution of coagulation factors with crystalloid and packed red cells is a central mechanism.</p>\n\n<p>B) Acidosis impairs the function of coagulation factor enzyme complexes.</p>\n\n<p>D) Hypothermia slows enzymatic clotting reactions and impairs platelet function.</p>\n<p>Note \u2014 evidence evolving since 2008: Ionized calcium is essential for the coagulation cascade (Factors normally require calcium \u2014 &quot;Factor IV&quot;), and citrate in transfused products chelates calcium. Contemporary massive-transfusion practice reframes the triad as a &quot;lethal diamond&quot; that includes hypocalcemia, and emphasizes monitoring and repleting ionized calcium during resuscitation. By a strict modern reading, all four options contribute; C remains the best answer only within the historical triad framework.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":41,"stem":"A 78 year old woman falls in her nursing home and sustains a scalp laceration. She is unconscious for four minutes. She has a history of chronic atrial fibrillation for which she takes coumadin. In the Emergency room she has a normal neurological exam and normal CT head. Her INR is 2.2. After the laceration is sutured, management should consist of?","options":[{"letter":"A","text":"Transfer back to nursing home."},{"letter":"B","text":"Admission to hospital, reversal of anticoagulation."},{"letter":"C","text":"MR imaging of head."},{"letter":"D","text":"Admit to ICU for observation overnight."}],"correct":"D","explanation":"<p>Why D is correct: An anticoagulated elderly patient with head trauma and loss of consciousness, even with a normal initial CT, is at risk for delayed intracranial hemorrhage. Guidelines recommend admission and neurological observation (\u226524 h) with repeat imaging only for deterioration. Among the choices, admission for observation is the appropriate disposition.</p>\n<p>Why the others are incorrect:</p>\n<p>A) Discharging an anticoagulated patient after significant head trauma w
