r":"B","text":"The treatment of choice is vancomycin."},{"letter":"C","text":"MRSA is more virulent than methacillin sensitive staph aureus."},{"letter":"D","text":"Hospitalized patients colonize with MRSA require contact isolation."}],"correct":"C","explanation":"<p>Why C is the correct choice (the false statement): Methicillin resistance is a marker of antibiotic resistance, not of intrinsic virulence. MSSA is at least as virulent as MRSA; indeed, for susceptible strains, beta-lactams outperform vancomycin, and MSSA bacteremia can be equally or more aggressive. Some community MRSA strains (e.g., USA300) carry virulence factors like PVL, but as a blanket statement, &quot;MRSA is more virulent than MSSA&quot; is incorrect.</p>\n<p>Why the other statements are correct (and therefore not the answer):</p>\n<p>A) True\u2014MRSA is a major nosocomial pathogen and also causes community-associated infections.</p>\n\n<p>B) True in the exam&#x27;s era\u2014vancomycin was the standard treatment of choice for serious MRSA infection (alternatives include linezolid, daptomycin).</p>\n\n<p>D) True\u2014MRSA colonization/infection warrants contact precautions in hospitalized patients per infection-control practice.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":91,"stem":"The most accurate test for the diagnosis of adrenal insufficiency is critically ill patients is?","options":[{"letter":"A","text":"Morning serum cortisol level."},{"letter":"B","text":"Morning serum ACTH level."},{"letter":"C","text":"Corticotrophin (ACTH) stimulation test."},{"letter":"D","text":"Metapyrone overnight test."}],"correct":"C","explanation":"<p>Why C is the best answer: The high-dose (250-\u00b5g) cosyntropin/ACTH stimulation test is the standard dynamic test for adrenal insufficiency and is the test the SCCM/ESICM suggest (over the hemodynamic response to hydrocortisone) when evaluating critical-illness\u2013related corticosteroid insufficiency (CIRCI). A subnormal cortisol response identifies impaired adrenal reserve better than a single static level.</p>\n<p>Why the others are incorrect:</p>\n<p>A) A single morning cortisol is unreliable in critical illness, where diurnal rhythm is lost and cortisol-binding globulin falls; only very high or very low values are informative.</p>\n\n<p>B) Morning ACTH helps distinguish primary from secondary adrenal insufficiency but is not the most accurate diagnostic test in the critically ill.</p>\n\n<p>D) The overnight metyrapone test is cumbersome and unsafe in critically ill patients (it can precipitate adrenal crisis) and is not used in this setting.</p>\n<p>Note \u2014 genuine controversy: The SCCM/ESICM CIRCI task force could not reach consensus that the ACTH stimulation test is superior to a random plasma cortisol (&lt;10 \u00b5g/dL) for diagnosing CIRCI, and the Surviving Sepsis Campaign suggests NOT using the ACTH test to select septic-shock patients for hydrocortisone. Thus &quot;most accurate&quot; overstates the certainty; C remains the best of the listed options but the evidence is nuanced.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":92,"stem":"The key components of informed consent, or the process by which physicians and patients make decisions together, include each of the following, EXCEPT?","options":[{"letter":"A","text":"Disclosure."},{"letter":"B","text":"Competency."},{"letter":"C","text":"Comprehension."},{"letter":"D","text":"Compliance."}],"correct":"D","explanation":"<p>Why D is the correct choice (the exception): The recognized elements of informed consent are disclosure (of the diagnosis, proposed intervention, risks, benefits, and alternatives), competency/capacity (the patient can make the decision), comprehension (the patient understands the information), and voluntariness (freedom from coercion). Compliance (adherence to treatment) is not a component of the consent process.</p>\n<p>Why the others are incorrect (they are true components):</p>\n<p>A) Disclosure is a core element.</p>\n\n<p>B) Competency/capacity is a core element.</p>\n\n<p>C) Comprehension is a core element.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":93,"stem":"Significant protein loss after severe injury is common. Which of the following statements concerning this situation is correct?","options":[{"letter":"A","text":"It results from impaired protein synthesis."},{"letter":"B","text":"It occurs primarily from skeletal muscle."},{"letter":"C","text":"It occurs primarily at the site of injury."},{"letter":"D","text":"It can be prevented by enteral but not parenteral feeding."}],"correct":"B","explanation":"<p>Why B is correct: The catabolic response to severe injury/sepsis mobilizes amino acids primarily by accelerated proteolysis of skeletal muscle. These amino acids (notably alanine and glutamine) support hepatic gluconeogenesis, acute-phase protein synthesis, and wound healing, at the cost of progressive lean body mass loss.</p>\n<p>Why the others are incorrect:</p>\n<p>A) The net loss is driven mainly by increased protein breakdown (catabolism), not simply impaired synthesis; hepatic synthesis of acute-phase proteins actually increases.</p>\n\n<p>C) The protein loss is systemic, drawn predominantly from skeletal muscle throughout the body, not localized to the wound.</p>\n\n<p>D) Nutritional support (enteral or parenteral) attenuates but cannot fully prevent the obligatory catabolism of critical illness; enteral feeding is preferred for other reasons (gut integrity, fewer infectious complications), but the statement as written is false.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":94,"stem":"Regarding renal function during states of hemorrhagic shock, which of the following statements is correct?","options":[{"letter":"A","text":"The blood flow to the kidney, like that to the brain, is maintained until late in the course of hemorrhagic shock."},{"letter":"B","text":"Renal ischemia longer than 10 minutes produces irreversible renal damage in most patients."},{"letter":"C","text":"Fractional excretion of Na is less than 1-2% in most patients with hemorrhagic shock."},{"letter":"D","text":"Alteration in the serum BUN level is as sensitive a measurement of renal function as is serum creatinine."}],"correct":"C","explanation":"<p>Why C is correct: In hemorrhagic (prerenal) shock, the kidney avidly conserves sodium and water via the renin-angiotensin-aldosterone axis and sympathetic activation. This produces a low fractional excretion of sodium (FeNa &lt;1%, generally &lt;1\u20132%), the classic prerenal signature, provided tubular function is intact.</p>\n<p>Why the others are incorrect:</p>\n<p>A) Renal blood flow is NOT preferentially preserved like cerebral or coronary flow; the kidney is sacrificed early via vasoconstriction to redistribute flow to brain and heart.</p>\n\n<p>B) The kidney tolerates warm ischemia longer than 10 minutes; irreversible damage generally requires substantially longer, and much prerenal azotemia is reversible with prompt resuscitation.</p>\n\n<p>D) BUN is less specific/sensitive than creatinine as a marker of renal function; it is heavily influenced by volume status, protein intake, GI bleeding, and catabolism.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":95,"stem":"Which of the following treatments is used for the preoperative preparation of patients with a known pheochromocytoma?","options":[{"letter":"A","text":"Fluids, blood, or both."},{"letter":"B","text":"Diuretics."},{"letter":"C","text":"Alpha antagonists."},{"letter":"D","text":"Beta agonists."}],"correct":"C","explanation":"<p>Why C is correct: Preoperative preparation for pheochromocytoma centers on alpha-adrenergic blockade (phenoxybenzamine, or selective alpha-1 blockers such as doxazosin/prazosin/terazosin), started at least 7\u201314 days before surgery to control blood pressure and prevent intraoperative hypertensive crises. Alpha blockade is combined with volume/salt loading; a beta-blocker may be added afterward to control reflex tachycardia\u2014but only after adequate alpha blockade, never before (to avoid unopposed alpha-mediated vasoconstriction).</p>\n<p>Why the others are incorrect:</p>\n<p>A) Volume expansion (high-salt diet and fluids) is an important adjunct, but the defining and essential pharmacologic step is alpha blockade; blood transfusion is not routine preparation.</p>\n\n<p>B) Diuretics are contraindicated\u2014these patients are volume-contracted, and diuresis worsens hemodynamic instability.</p>\n\n<p>D) Beta-agonists would exacerbate catecholamine excess and are contraindicated; the concern is with beta-blockers (which must follow, not precede, alpha blockade).</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":96,"stem":"A 60 year old man undergoes total gastrectomy for carcinoma of the stomach. Post-operatively he develops an anastomotic leak at the esophageal anastomoses and undergoes further surgery and percutaneous drainage of multiple abscesses. Over the course of his hospital stay, he is noted to have marked wasting of his skeletal muscles. This is primarily caused by:","options":[{"letter":"A","text":"Disease atrophy."},{"letter":"B","text":"Malnutrition."},{"letter":"C","text":"Elevated levels of counter-regulatory hormones (cortisol, glycogen, epinephrine)."},{"letter":"D","text":"Elevated levels of cytokines such as interlukin-2 and tumour necrosis factor."}],"correct":"D","explanation":"<p>Why D is the intended answer: The profound muscle wasting of prolonged sepsis/critical illness (here, an anastomotic leak with ongoing intra-abdominal sepsis) is driven substantially by pro-inflammatory cytokines. TNF-\u03b1 was historically named &quot;cachectin&quot; precisely because of its role in cachexia; together with IL-1 and IL-6 it activates the ubiquitin-proteasome pathway of muscle proteolysis. This ongoing cytokine-mediated catabolism, rather than simple starvation, best explains the marked wasting.</p>\n<p>Why the other options are incorrect (or less complete):</p>\n<p>A) &quot;Disuse atrophy&quot; contributes to some degree but does not account for the severity/rapidity of sepsis-associated wasting.</p>\n\n<p>B) Malnutrition alone (simple starvation) causes a slower, adaptive loss with reduced energy expenditure; it does not explain the accelerated catabolism seen with sepsis, which persists despite nutritional support.</p>\n\n<p>C) Counter-regulatory hormones (cortisol, glucagon, catecholamines) are genuine co-drivers of catabolism and could be defended as a contributor; however, the question frames the sustained septic muscle wasting as primarily cytokine-mediated.</p>\n<p>Caveat: Option D lists &quot;interleukin-2,&quot; which is atypical for cachexia (IL-2 is chiefly a T-cell growth factor); the key catabolic cytokine is TNF-\u03b1 (with IL-1/IL-6). The item conflates these, and counter-regulatory hormones (C) are a legitimate co-mechanism\u2014so this question is imperfectly constructed.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":97,"stem":"A 75 year old woman is recovering from total abdominal hysterectomy. On post-operative day five, as she is being helped out of bed, she suffers sudden cardiac arrest. You are the first doctor to arrive at the bedside, 60 seconds later. ECG monitor shows slow ventricular fibrillation. Your first action should be?","options":[{"letter":"A","text":"Intubate patient."},{"letter":"B","text":"Initiate chest compressions."},{"letter":"C","text":"Defibrillate patient."},{"letter":"D","text":"Administer 1 mg epinephrine IV and recheck rhythm."}],"correct":"C","explanation":"<p>Why C is correct: This is a witnessed/monitored arrest with ventricular fibrillation identified within ~1 minute. For a shockable rhythm (VF/pulseless VT) that is witnessed or monitored with a defibrillator immediately available, immediate defibrillation is the priority, because early defibrillation of short-duration VF\u2014while myocardial energy substrates remain intact\u2014gives the highest likelihood of successful defibrillation and survival. Every minute of delay reduces survival.</p>\n<p>Why the others are incorrect:</p>\n<p>A) Airway/intubation is not the first priority in VF arrest; it must not delay defibrillation.</p>\n\n<p>B) Chest compressions are essential and should be provided during any delay in obtaining/charging the defibrillator, but when a defibrillator is immediately at hand for witnessed VF, the shock takes precedence. (If a defibrillator were not immediately available, begin CPR.)</p>\n\n<p>D) Epinephrine is given after initial defibrillation attempts in the ACLS algorithm for shockable rhythms; it is not the first action.</p>\n<p>Note \u2014 2025 AHA guidance: For a monitored/witnessed VF arrest with a defibrillator already applied or immediately accessible, defibrillate immediately; provide CPR in the interim if there is any delay readying the device.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":98,"stem":"Which of the following statements concerning post-operative ulnar neuropathy is correct?","options":[{"letter":"A","text":"It is more common in females."},{"letter":"B","text":"It can be prevented by padding the arms during anesthesia."},{"letter":"C","text":"It is the least common perioperative nerve injury."},{"letter":"D","text":"It may have delayed onset of symptoms."}],"correct":"D","explanation":"<p>Why D is correct: Perioperative ulnar neuropathy characteristically may present in a delayed fashion, sometimes days after surgery, and can occur even when careful positioning and padding were documented\u2014a pattern well described in the ASA Closed Claims analyses.</p>\n<p>Why the others are incorrect:</p>\n<p>A) Ulnar neuropathy is substantially more common in males (contributing factors include a larger/more exposed cubital tunnel anatomy and body habitus).</p>\n\n<p>B) It is not reliably prevented by arm padding; many cases occur despite appropriate positioning and padding, implicating factors beyond external compression.</p>\n\n<p>C) It is the most common (not least common) perioperative peripheral nerve injury.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":99,"stem":"Rapid sequence induction of anaesthesia is commonly used for emergency surgery in patients who may have significant quantities of fluid in the stomach. Which of the following statements about rapid sequence induction is correct?","options":[{"letter":"A","text":"Pre-oxygenation is not necessary."},{"letter":"B","text":"Only a depolarizing muscle relaxant can be used."},{"letter":"C","text":"Cricothyroid pressure has been shown to decrease the incidence of aspiration pneumonitis."},{"letter":"D","text":"Hypotension may result in hypovolemic patients."}],"correct":"D","explanation":"<p>Why D is correct: RSI induction agents (e.g., propofol, thiopental) and the loss of sympathetic tone can precipitate significant hypotension, particularly in hypovolemic or hemodynamically compromised patients\u2014a key reason to choose hemodynamically stable agents (e.g., etomidate, ketamine) and resuscitate before induction when possible.</p>\n<p>Why the others are incorrect:</p>\n<p>A) Pre-oxygenation (denitrogenation) is essential in RSI to maximize the apneic oxygen reserve, since ventilation is avoided between induction and intubation.</p>\n\n<p>B) A depolarizing agent (succinylcholine) is classic, but non-depolarizing agents (high-dose rocuronium) provide comparable rapid conditions and are routinely used; it is not true that only a depolarizing agent can be used.</p>\n\n<p>C) Cricoid pressure (Sellick maneuver, applied to the cricoid\u2014not &quot;cricothyroid&quot;) has never been shown in rigorous trials to reduce aspiration pneumonitis; its efficacy is unproven and debated. The statement as written is incorrect.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":100,"stem":"Which of the following is NOT an adverse event associated with the use of quinoline antibiotics (such as ciprofloxacin)?","options":[{"letter":"A","text":"Tendonitis and possible tendon rupture."},{"letter":"B","text":"Seizures."},{"letter":"C","text":"Clostridium difficile colitis."},{"letter":"D","text":"Narrowing of QT interval."}],"correct":"D","explanation":"<p>Why D is the correct choice (the false statement): Fluoroquinolones PROLONG (not narrow) the QT interval, increasing the risk of torsades de pointes\u2014especially with other QT-prolonging drugs or electrolyte abnormalities. &quot;Narrowing of the QT interval&quot; is not a recognized quinolone effect.</p>\n<p>Why the other statements are correct (true adverse effects, so not the answer):</p>\n<p>A) Tendinopathy and tendon rupture (notably the Achilles) are well-documented and carry an FDA boxed warning.</p>\n\n<p>B) CNS effects including seizures (lowered seizure threshold) are recognized adverse effects.</p>\n\n<p>C) Fluoroquinolones are among the antibiotics most strongly associated with C. difficile colitis.</p>\n","no_key":false,"no_options":false,"free_answer":null}];</script>
<script>
(function(){
  const STORAGE_KEY = 'progress-v1';
  // Namespaced by page title so multiple quiz files hosted/opened together
  // (outside Claude, where window.storage isn't available) don't clobber
  // each other's saved progress in the same browser's localStorage.
  const LOCAL_STORAGE_KEY = 'examquiz-progress:' + (document.title || 'default');
  let state = { answers: {}, flagged: {}, struck: {}, notes: {} }; // answers[num]={selected,correct}; struck[num]={LETTER:true}; notes[num]=string
  let filter = 'all';
  let currentIndex = 0;
  let pendingSelections = {}; // qnum -> letter, chosen but not yet confirmed (session-only)
  let notesSaveTimer = null;
  const BANNER_POPUP_IDS = ['calc-panel', 'settings-panel', 'notes-panel-popup'];

  // Builds a pre-filled link to the bug-report Google Form for a given
  // question, using this page's exam title (its <h1>) and the question
  // number. Configured once per skill in quiz_template.html via
  // window.BUG_REPORT_CONFIG -- see SKILL.md's bug-reporting section.
  // Returns '' (and the caller hides the button) if that config still has
  // its placeholder values, so an unconfigured quiz never ships a broken
  // "Report issue" link that quietly goes nowhere.
  function buildReportUrl(questionNumber) {
    const cfg = window.BUG_REPORT_CONFIG || {};
    if (!cfg.formBaseUrl || cfg.formBaseUrl.indexOf('REPLACE_WITH') === 0) return '';
    const examTitle = (document.querySelector('header.top h1') || {}).textContent || document.title || '';
    try {
      const url = new URL(cfg.formBaseUrl);
      url.searchParams.set('usp', 'pp_url');
      if (cfg.examEntryId) url.searchParams.set(cfg.examEntryId, examTitle.trim());
      if (cfg.questionEntryId) url.searchParams.set(cfg.questionEntryId, String(questionNumber));
      return url.toString();
    } catch (e) {
      return '';
    }
  }

  // Closes every banner popover (calculator, settings, notes) except the
  // one whose panel id is passed in -- keeps the three mutually exclusive
  // without each toggle handler needing to know about the other two by
  // name. Add new banner popovers to BANNER_POPUP_IDS above and they get
  // this behavior for free.
  function closeOtherBannerPopups(exceptPanelId) {
    BANNER_POPUP_IDS.forEach(id => {
      if (id === exceptPanelId) return;
      const el = document.getElementById(id);
      if (el) el.classList.add('hidden');
    });
  }

  const FILTERS = [
    ['all', 'All'],
    ['unanswered', 'Unanswered'],
    ['incorrect', 'Incorrect'],
    ['flagged', 'Flagged'],
  ];

  function questionStatus(q) {
    const a = state.answers[q.number];
    if (!a) return 'unanswered';
    if (q.no_options || q.no_key) return 'nokey-done';
    return a.correct ? 'correct' : 'incorrect';
  }

  function visibleList() {
    return QUIZ_DATA.filter(q => {
      if (filter === 'unanswered') return !state.answers[q.number];
      if (filter === 'incorrect') {
        const a = state.answers[q.number];
        return a && !a.correct && !q.no_options && !q.no_key;
      }
      if (filter === 'flagged') return !!state.flagged[q.number];
      return true;
    });
  }

  function renderFilters() {
    const el = document.getElementById('filter-tabs');
    el.innerHTML = '';
    FILTERS.forEach(([key, label]) => {
      const b = document.createElement('button');
      b.textContent = label;
      if (filter === key) b.classList.add('active');
      b.onclick = () => { filter = key; currentIndex = 0; renderAll(); };
      el.appendChild(b);
    });
  }

  function renderGrid() {
    const grid = document.getElementById('qgrid');
    grid.innerHTML = '';
    const list = visibleList();
    if (list.length === 0) {
      const empty = document.createElement('div');
      empty.style.gridColumn = '1 / -1';
      empty.style.color = 'var(--muted)';
      empty.style.fontSize = '12.5px';
      empty.style.textAlign = 'center';
      empty.style.padding = '10px 0';
      empty.textContent = 'No questions here.';
      grid.appendChild(empty);
      return;
    }
    list.forEach((q, i) => {
      const b = document.createElement('button');
      b.textContent = q.number;
      const status = questionStatus(q);
      if (status !== 'unanswered') b.classList.add(status);
      if (i === currentIndex) b.classList.add('current');
      if (state.flagged[q.number]) {
        const dot = document.createElement('span');
        dot.className = 'flagdot';
        b.appendChild(dot);
      }
      b.onclick = () => { currentIndex = i; renderAll(); scrollToTop(); };
      grid.appendChild(b);
    });
  }

  function renderStats() {
    const answeredNums = Object.keys(state.answers);
    const gradable = answeredNums.filter(n => {
      const q = QUIZ_DATA.find(x => x.number == n);
      return q && !q.no_options && !q.no_key;
    });
    const correctCount = gradable.filter(n => state.answers[n].correct).length;
    document.getElementById('stat-answered').textContent = answeredNums.length;
    document.getElementById('stat-correct').textContent = correctCount;
    document.getElementById('stat-pct').textContent = gradable.length
      ? Math.round(100 * correctCount / gradable.length) + '%'
      : '—';
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderPanel() {
    const panel = document.getElementById('qpanel');
    const list = visibleList();
    if (list.length === 0) {
      panel.innerHTML = '<div class="empty-state">Nothing to show for this filter. Try a different tab on the left.</div>';
      return;
    }
    if (currentIndex >= list.length) currentIndex = list.length - 1;
    const q = list[currentIndex];
    const answer = state.answers[q.number];
    const flagged = !!state.flagged[q.number];
    const pending = pendingSelections[q.number]; // letter picked but not confirmed yet

    let html = '';
    html += '<div class="qmeta">';
    html += '<div class="qnum">Question ' + q.number + '</div>';
    html += '<div class="qmeta-actions">';
    html += '<button class="flag-toggle ' + (flagged ? 'on' : '') + '" id="flag-btn">' + (flagged ? '&#9873; Flagged' : '&#9872; Flag for review') + '</button>';
    const reportUrl = buildReportUrl(q.number);
    if (reportUrl) {
      html += '<a class="report-btn" id="report-btn" href="' + reportUrl + '" target="_blank" rel="noopener">&#128027; Report issue</a>';
    }
    html += '</div>';
    html += '</div>';
    html += '<div class="stem">' + escapeHtml(q.stem) + '</div>';

    if (q.no_options) {
      if (!answer) {
        html += '<div class="noopts-box">This question\'s original answer choices weren\'t fully captured in the source material — only the key fact is available.</div>';
        html += '<button class="reveal-btn" id="reveal-btn">Reveal answer</button>';
      } else {
        html += '<div class="explain">';
        html += '<div class="verdict nokey">Key fact</div>';
        html += '<div class="explain-body"><p><strong>' + escapeHtml(q.free_answer || '') + '</strong></p>' + q.explanation + '</div>';
        html += '</div>';
      }
    } else if (q.options) {
      html += '<div class="options">';
      q.options.forEach(opt => {
        const struck = !answer && !!(state.struck[q.number] && state.struck[q.number][opt.letter]);
        let cls = 'opt';
        if (answer) {
          cls += ' locked';
          if (opt.letter === q.correct) cls += ' correct-answer';
          else if (opt.letter === answer.selected) cls += ' wrong-answer';
          if (opt.letter === answer.selected) cls += ' selected';
        } else if (struck) {
          cls += ' struck';
        } else if (pending === opt.letter) {
          cls += ' pending-selected';
        }
        html += '<div class="opt-row">';
        html += '<button class="' + cls + '" data-letter="' + opt.letter + '"' + (struck ? ' disabled' : '') + '>';
        html += '<span class="letter">' + opt.letter + '</span>';
        html += '<span class="text">' + escapeHtml(opt.text) + '</span>';
        html += '</button>';
        if (!answer) {
          html += '<button class="strike-btn ' + (struck ? 'active' : '') + '" data-strike-letter="' + opt.letter + '" title="Cross out this option">&#9587;</button>';
        }
        html += '</div>';
      });
      html += '</div>';

      if (!answer) {
        html += '<button class="confirm-btn" id="confirm-btn" ' + (pending ? '' : 'disabled') + '>Confirm answer</button>';
      }

      if (answer) {
        html += '<div class="explain">';
        if (q.no_key) {
          html += '<div class="verdict nokey">Reviewed</div>';
          html += '<div class="nokey-note">No answer key was available for this question in the source material, so it isn\'t graded — use it for your own review.</div>';
        } else {
          html += '<div class="verdict ' + (answer.correct ? 'correct' : 'incorrect') + '">' + (answer.correct ? '✓ Correct' : '✗ Incorrect — correct answer is ' + q.correct) + (answer.emoji ? ' <span class="verdict-emoji">' + answer.emoji + '</span>' : '') + '</div>';
        }
        html += '<div class="explain-body">' + q.explanation + '</div>';
        html += '</div>';
      }
    }

    html += '<div class="footer-nav">';
    html += '<button class="navbtn" id="prev-btn" ' + (currentIndex === 0 ? 'disabled' : '') + '>&larr; Previous</button>';
    html += '<div class="position">Position ' + (currentIndex + 1) + ' of ' + list.length + '</div>';
    html += '<button class="navbtn primary" id="next-btn" ' + (currentIndex === list.length - 1 ? 'disabled' : '') + '>Next &rarr;</button>';
    html += '</div>';

    panel.innerHTML = html;

    if (!answer && q.options) {
      panel.querySelectorAll('.opt:not(.struck)').forEach(btn => {
        btn.onclick = () => {
          pendingSelections[q.number] = btn.getAttribute('data-letter');
          renderPanel(); // just re-render the panel, no need to touch grid/stats for a pending pick
        };
      });
      panel.querySelectorAll('.strike-btn').forEach(btn => {
        btn.onclick = () => toggleStrike(q.number, btn.getAttribute('data-strike-letter'));
      });
      const cb = document.getElementById('confirm-btn');
      if (cb) cb.onclick = () => {
        if (pendingSelections[q.number]) confirmAnswer(q, pendingSelections[q.number]);
      };
    }
    if (q.no_options) {
      const rb = document.getElementById('reveal-btn');
      if (rb) rb.onclick = () => confirmAnswer(q, null);
    }
    document.getElementById('flag-btn').onclick = () => toggleFlag(q.number);
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    if (prevBtn) prevBtn.onclick = () => { if (currentIndex > 0) { currentIndex--; renderAll(); scrollToTop(); } };
    if (nextBtn) nextBtn.onclick = () => { const l = visibleList(); if (currentIndex < l.length - 1) { currentIndex++; renderAll(); scrollToTop(); } };
  }

  const CELEBRATE_EMOJIS = ['🎉', '🌟', '✨', '🙌', '🎊', '👏', '💪', '🥳'];
  const SAD_EMOJIS = ['🥲', '😿', '🫠', '🙈', '🥺', '😢'];

  function pickEmoji(correct) {
    const arr = correct ? CELEBRATE_EMOJIS : SAD_EMOJIS;
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function confirmAnswer(q, letter) {
    const correct = q.no_options ? true : (letter === q.correct);
    const graded = !q.no_options && !q.no_key; // only genuinely-scored answers get a reaction emoji
    state.answers[q.number] = {
      selected: letter,
      correct: correct,
      emoji: graded ? pickEmoji(correct) : null,
    };
    delete pendingSelections[q.number];
    saveProgress();
    renderAll();
  }

  function toggleStrike(num, letter) {
    if (!state.struck[num]) state.struck[num] = {};
    if (state.struck[num][letter]) {
      delete state.struck[num][letter];
    } else {
      state.struck[num][letter] = true;
      if (pendingSelections[num] === letter) delete pendingSelections[num];
    }
    saveProgress();
    renderPanel();
  }

  function toggleFlag(num) {
    if (state.flagged[num]) delete state.flagged[num];
    else state.flagged[num] = true;
    saveProgress();
    renderAll();
  }

  async function saveProgress() {
    const payload = JSON.stringify(state);
    let savedViaClaude = false;
    try {
      if (window.storage) {
        await window.storage.set(STORAGE_KEY, payload, false);
        savedViaClaude = true;
      }
    } catch (e) {
      // window.storage can be flaky/transient in some sessions -- fall through
      // to the localStorage backup below rather than treating this as fatal.
    }
    if (savedViaClaude) return;
    try {
      localStorage.setItem(LOCAL_STORAGE_KEY, payload);
    } catch (e) {
      // Only genuinely worth surfacing if BOTH save paths failed -- otherwise
      // this is just noise, since the other path already has the data safe.
      console.error('Could not save progress via window.storage or localStorage', e);
    }
  }

  async function loadProgress() {
    try {
      if (window.storage) {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          if (parsed && parsed.answers) state = Object.assign({ answers: {}, flagged: {}, struck: {}, notes: {} }, parsed);
        }
        return;
      }
    } catch (e) {
      // no saved progress yet via window.storage, that's fine
    }
    try {
      const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.answers) state = Object.assign({ answers: {}, flagged: {}, struck: {}, notes: {} }, parsed);
      }
    } catch (e) {
      // no saved progress yet via localStorage either, that's fine
    }
  }

  function renderAll() {
    renderFilters();
    renderGrid();
    renderStats();
    renderPanel();
    renderNotes();
  }

  // Notes are keyed by question number and persisted as part of the same
  // `state` blob as answers/flags (see saveProgress/loadProgress), so they
  // ride along with existing progress-save/reset behavior for free. This
  // only needs to run when the CURRENT question changes -- renderPanel()
  // re-renders its own innerHTML independently and never touches this
  // textarea, so calling this only from renderAll() (not on every
  // in-panel re-render, e.g. picking a pending answer) avoids yanking
  // focus/cursor away from someone mid-note.
  function renderNotes() {
    const ta = document.getElementById('notes-textarea');
    if (!ta) return;
    const qnumLabel = document.getElementById('notes-qnum');
    const list = visibleList();
    if (list.length === 0) { ta.value = ''; ta.disabled = true; if (qnumLabel) qnumLabel.textContent = ''; return; }
    ta.disabled = false;
    let idx = currentIndex;
    if (idx >= list.length) idx = list.length - 1;
    const q = list[idx];
    if (qnumLabel) qnumLabel.textContent = 'Question ' + q.number;
    ta.value = state.notes[q.number] || '';
    ta.oninput = () => {
      clearTimeout(notesSaveTimer);
      notesSaveTimer = setTimeout(() => {
        const val = ta.value;
        if (val) state.notes[q.number] = val;
        else delete state.notes[q.number];
        saveProgress();
      }, 400);
    };
  }

  document.getElementById('reset-btn').onclick = async () => {
    if (!confirm('Clear all your saved answers and flags for this quiz?')) return;
    state = { answers: {}, flagged: {}, struck: {}, notes: {} };
    pendingSelections = {};
    currentIndex = 0;
    try {
      if (window.storage) await window.storage.delete(STORAGE_KEY, false);
    } catch (e) {}
    try {
      localStorage.removeItem(LOCAL_STORAGE_KEY);
    } catch (e) {}
    renderAll();
  };

  // ---- Settings: text size + light/dark override ----------------------
  const SETTINGS_KEY = 'ui-settings-v1';
  const SETTINGS_LOCAL_KEY = 'examquiz-ui-settings';
  const FONT_STEPS = [13, 14, 15, 16, 17, 18, 19]; // px; index 2 (15px) is the default/100%

  // Explicit light/dark palettes, mirroring the CSS custom properties in
  // quiz_template.html's :root and @media(prefers-color-scheme:dark) blocks.
  // Applied as INLINE styles on <html> (not just a data-theme attribute) so
  // an explicit user override always repaints reliably -- some WebKit/iOS
  // Safari versions don't consistently repaint custom-property values that
  // only change via an attribute-selector match, so relying solely on
  // `:root[data-theme="light"]` CSS could silently leave the old (dark)
  // painted colors on screen even though the DOM attribute is correct.
  // Inline style mutation is always synchronously repainted, so this is the
  // robust path; the CSS attribute selectors stay in place too as a harmless
  // no-op reinforcement for engines that don't have this quirk.
  const THEME_VARS = {
    light: {
      '--bg': '#F3F5F3', '--surface': '#FFFFFF', '--ink': '#1B2430', '--muted': '#64707D',
      '--border': '#DFE3E0', '--accent': '#3B7DD8', '--accent-dark': '#2A5DA8', '--accent-tint': '#EAF1FB',
      '--correct': '#1E8A5F', '--correct-bg': '#E7F5EE', '--correct-border': '#A9DDC4',
      '--incorrect': '#BF3F27', '--incorrect-bg': '#FBEAE5', '--incorrect-border': '#EFB7A8',
      '--flag': '#B9821A', '--flag-bg': '#FCF1DC', '--flag-border': '#ECD9AC',
      '--nokey': '#7C6FB0', '--nokey-bg': '#EFEBFA', '--nokey-border': '#D6CDEE',
      '--explain-text': '#384250',
      '--shadow': '0 1px 2px rgba(27,36,48,0.06), 0 4px 14px rgba(27,36,48,0.05)',
    },
    dark: {
      '--bg': '#15181B', '--surface': '#1E2226', '--ink': '#E8EAEC', '--muted': '#97A1A9',
      '--border': '#333A40', '--accent': '#5B9AE6', '--accent-dark': '#3B7DD8', '--accent-tint': '#1B2A3D',
      '--correct': '#58D399', '--correct-bg': '#17301F', '--correct-border': '#2D5238',
      '--incorrect': '#F0876D', '--incorrect-bg': '#3A211B', '--incorrect-border': '#62362A',
      '--flag': '#E3B04B', '--flag-bg': '#362C15', '--flag-border': '#5B4A24',
      '--nokey': '#BBA9F5', '--nokey-bg': '#2A2440', '--nokey-border': '#453B66',
      '--explain-text': '#C7CDD3',
      '--shadow': '0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25)',
    },
  };
  let settings = { fontStep: 2, theme: 'system' };

  async function loadSettings() {
    let raw = null;
    try {
      if (window.storage) {
        const res = await window.storage.get(SETTINGS_KEY, false);
        if (res && res.value) raw = res.value;
      }
    } catch (e) {}
    if (raw === null) {
      try { raw = localStorage.getItem(SETTINGS_LOCAL_KEY); } catch (e) {}
    }
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        if (parsed) settings = Object.assign(settings, parsed);
      } catch (e) {}
    }
  }

  async function saveSettings() {
    const payload = JSON.stringify(settings);
    try {
      if (window.storage) { await window.storage.set(SETTINGS_KEY, payload, false); return; }
    } catch (e) {}
    try { localStorage.setItem(SETTINGS_LOCAL_KEY, payload); } catch (e) {}
  }

  function applyFontStep() {
    const px = FONT_STEPS[settings.fontStep];
    document.documentElement.style.fontSize = px + 'px';
    const pctEl = document.getElementById('font-pct');
    if (pctEl) pctEl.textContent = Math.round((px / 15) * 100) + '%';
  }

  function applyTheme() {
    const rootStyle = document.documentElement.style;
    const allVarNames = Object.keys(THEME_VARS.light);
    if (settings.theme === 'system') {
      allVarNames.forEach(name => rootStyle.removeProperty(name));
      document.documentElement.removeAttribute('data-theme');
    } else {
      const vars = THEME_VARS[settings.theme] || THEME_VARS.light;
      allVarNames.forEach(name => rootStyle.setProperty(name, vars[name]));
      document.documentElement.setAttribute('data-theme', settings.theme);
    }
    document.querySelectorAll('#theme-seg button').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-theme-choice') === settings.theme);
    });
  }

  // ---- Basic on-screen calculator ---------------------------------------
  // Session-only, deliberately not persisted -- this is scratch arithmetic
  // for working through a question, not part of quiz state. Implemented as
  // an explicit state machine (not eval()) so it behaves like a real
  // 4-function calculator: each operator press immediately resolves any
  // pending operation left-to-right, rather than respecting precedence.
  const calcState = { display: '0', prevValue: null, operator: null, waitingForOperand: false };

  function calcRound(n) {
    // Avoids floating-point noise like 0.1 + 0.2 -> 0.30000000000000004.
    return Math.round((n + Number.EPSILON) * 1e10) / 1e10;
  }

  function calcCompute(a, b, op) {
    switch (op) {
      case 'add': return calcRound(a + b);
      case 'subtract': return calcRound(a - b);
      case 'multiply': return calcRound(a * b);
      case 'divide': return b === 0 ? 0 : calcRound(a / b);
      default: return b;
    }
  }

  function calcInputDigit(digit) {
    if (calcState.waitingForOperand) {
      calcState.display = digit;
      calcState.waitingForOperand = false;
    } else {
      calcState.display = calcState.display === '0' ? digit : calcState.display + digit;
    }
  }

  function calcInputDecimal() {
    if (calcState.waitingForOperand) {
      calcState.display = '0.';
      calcState.waitingForOperand = false;
      return;
    }
    if (calcState.display.indexOf('.') === -1) calcState.display += '.';
  }

  function calcClear() {
    calcState.display = '0';
    calcState.prevValue = null;
    calcState.operator = null;
    calcState.waitingForOperand = false;
  }

  function calcBackspace() {
    if (calcState.waitingForOperand) return;
    calcState.display = calcState.display.length > 1 ? calcState.display.slice(0, -1) : '0';
  }

  function calcPercent() {
    calcState.display = String(calcRound(parseFloat(calcState.display) / 100));
  }

  function calcPerformOperation(nextOperator) {
    const inputValue = parseFloat(calcState.display);
    if (calcState.prevValue === null) {
      calcState.prevValue = inputValue;
    } else if (calcState.operator) {
      calcState.prevValue = calcCompute(calcState.prevValue, inputValue, calcState.operator);
      calcState.display = String(calcState.prevValue);
    }
    calcState.waitingForOperand = true;
    calcState.operator = nextOperator;
  }

  function calcEquals() {
    if (calcState.operator === null || calcState.prevValue === null) return;
    const inputValue = parseFloat(calcState.display);
    calcState.display = String(calcCompute(calcState.prevValue, inputValue, calcState.operator));
    calcState.prevValue = null;
    calcState.operator = null;
    calcState.waitingForOperand = true;
  }

  function initCalculator() {
    const toggle = document.getElementById('calc-toggle');
    const panel = document.getElementById('calc-panel');
    const display = document.getElementById('calc-display');
    if (!toggle || !panel || !display) return;

    function updateDisplay() { display.textContent = calcState.display; }

    toggle.onclick = (e) => {
      e.stopPropagation();
      const opening = panel.classList.contains('hidden');
      if (opening) closeOtherBannerPopups('calc-panel');
      panel.classList.toggle('hidden');
    };
    document.addEventListener('click', (e) => {
      if (!panel.classList.contains('hidden') && !panel.contains(e.target) && e.target !== toggle) {
        panel.classList.add('hidden');
      }
    });

    panel.querySelectorAll('.calc-btn').forEach(btn => {
      btn.onclick = () => {
        const action = btn.getAttribute('data-calc');
        if (/^[0-9]$/.test(action)) calcInputDigit(action);
        else if (action === 'decimal') calcInputDecimal();
        else if (action === 'clear') calcClear();
        else if (action === 'backspace') calcBackspace();
        else if (action === 'percent') calcPercent();
        else if (action === 'equals') calcEquals();
        else calcPerformOperation(action); // add / subtract / multiply / divide
        updateDisplay();
      };
    });
  }

  function initNotesPopup() {
    const toggle = document.getElementById('notes-toggle');
    const panel = document.getElementById('notes-panel-popup');
    if (!toggle || !panel) return;

    toggle.onclick = (e) => {
      e.stopPropagation();
      const opening = panel.classList.contains('hidden');
      if (opening) closeOtherBannerPopups('notes-panel-popup');
      panel.classList.toggle('hidden');
      // Notes content can go stale while the popup is closed (e.g. after
      // navigating questions with the popup shut), so refresh on open --
      // cheap, and avoids a second code path just to keep it in sync.
      if (opening) renderNotes();
    };
    document.addEventListener('click', (e) => {
      if (!panel.classList.contains('hidden') && !panel.contains(e.target) && e.target !== toggle) {
        panel.classList.add('hidden');
      }
    });
  }

  function initSettingsUI() {
    const toggle = document.getElementById('settings-toggle');
    const panel = document.getElementById('settings-panel');
    toggle.onclick = (e) => {
      e.stopPropagation();
      const opening = panel.classList.contains('hidden');
      if (opening) closeOtherBannerPopups('settings-panel');
      panel.classList.toggle('hidden');
    };
    document.addEventListener('click', (e) => {
      if (!panel.classList.contains('hidden') && !panel.contains(e.target) && e.target !== toggle) {
        panel.classList.add('hidden');
      }
    });

    document.getElementById('font-dec').onclick = () => {
      settings.fontStep = Math.max(0, settings.fontStep - 1);
      applyFontStep();
      saveSettings();
    };
    document.getElementById('font-inc').onclick = () => {
      settings.fontStep = Math.min(FONT_STEPS.length - 1, settings.fontStep + 1);
      applyFontStep();
      saveSettings();
    };
    document.querySelectorAll('#theme-seg button').forEach(btn => {
      btn.onclick = () => {
        settings.theme = btn.getAttribute('data-theme-choice');
        applyTheme();
        saveSettings();
      };
    });

    applyFontStep();
    applyTheme();
  }

  (async function init() {
    await loadSettings();
    initSettingsUI();
    initCalculator();
    initNotesPopup();
    await loadProgress();
    renderAll();
  })();
})();
</script>
</body>
</html>
