ith LOC forgoes the observation period needed to detect delayed bleeding.</p>\n\n<p>B) With a normal CT and a therapeutic (not supratherapeutic) INR of 2.2, routine reversal of anticoagulation is not indicated and carries thrombotic risk in a patient with AF; reversal is reserved for demonstrated hemorrhage.</p>\n\n<p>C) MRI adds little acutely; CT is the appropriate modality for acute traumatic hemorrhage, and routine repeat imaging without deterioration is low-yield.</p>\n<p>Note \u2014 evidence since 2008: Contemporary data quantify delayed ICH after a normal initial CT in anticoagulated patients at roughly 2%, rarely requiring neurosurgery (Pess\u00f4a et al., World Neurosurgery, 2024). Observation for ~24 h captures most clinically significant events; &quot;ICU&quot; specifically may exceed what is needed, but admission/observation is clearly correct over discharge. INR 2.2 is therapeutic, so reversal is not automatically indicated with a normal scan.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":42,"stem":"A 60 year old woman suffers an isolated liver injury in a motor vehicle accident. Three months earlier, she was treated with prednisone and plasmaphoresis for idiopathic thrombocytopenic purpura. Her platelet counts have remained normal since therapy was discontinued two months earlier. Twelve hours after admission her blood pressure is 80/40, heart rate 120, CVP 3 mm/hg, Hgb 105. The next step in her management should be?","options":[{"letter":"A","text":"Laparotomy."},{"letter":"B","text":"Transfuse of two units packed red blood cells."},{"letter":"C","text":"Hydrocortisone 100 mgs IV bolus."},{"letter":"D","text":"Levophed infusion."}],"correct":"A","explanation":"<p>Why A is correct: This patient shows hemodynamic instability (BP 80/40, HR 120) with a low CVP (3) 12 hours after an isolated liver injury \u2014 a picture of ongoing hemorrhage and failed nonoperative management. Persistent instability from a solid-organ injury mandates operative hemorrhage control.</p>\n<p>Why the others are incorrect:</p>\n<p>B) Transfusion is a necessary adjunct during resuscitation but does not control the bleeding source; relying on transfusion alone in an unstable, bleeding patient delays definitive care. (Blood should be given concurrently, but the decisive &quot;next step&quot; is the OR.)</p>\n\n<p>C) There is no indication for stress-dose steroids; her ITP is quiescent with normal platelets and she is not steroid-dependent in this scenario.</p>\n\n<p>D) Vasopressors mask hypovolemia and do not address surgical bleeding.</p>\n<p>Background: Nonoperative management of blunt liver injury requires hemodynamic stability. Hemodynamic deterioration despite resuscitation is the classic indication to convert to operative management (or angioembolization in selected stable patients \u2014 but not in overt instability).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":43,"stem":"Which one of the following clinical signs or symptoms is NOT associated with a serum sodium concentration below 125 mEq/l?","options":[{"letter":"A","text":"Headache."},{"letter":"B","text":"Bradycardia."},{"letter":"C","text":"Hypoventilation."},{"letter":"D","text":"Hyperthermia."}],"correct":"D","explanation":"<p>Why D is correct: Severe hyponatremia causes cerebral edema and rising intracranial pressure. The resulting features include headache, and with increasing ICP, bradycardia and hypoventilation (components of the Cushing response/brainstem effect). Hyperthermia is not a characteristic feature; if anything, hypothermia may occur.</p>\n<p>Why the others are associated:</p>\n<p>A) Headache is an early symptom of hyponatremic cerebral edema.</p>\n\n<p>B) Bradycardia can accompany raised intracranial pressure.</p>\n\n<p>C) Hypoventilation/respiratory depression occurs with severe hyponatremic encephalopathy.</p>\n<p>Background: Symptomatic hyponatremia (Na &lt;125, particularly if acute) risks seizures, herniation, and death; acute severe symptomatic hyponatremia is treated with hypertonic (3%) saline.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":44,"stem":"A patient requires re-operation one month after a vertical midline abdominal incision has been made. Which of the following procedures will promote the most rapid gain in strength of the new incision?","options":[{"letter":"A","text":"Use a separate transverse incision."},{"letter":"B","text":"Excise the midline scar with a 1 cm margin."},{"letter":"C","text":"Reopen the midline incision without scar excision."},{"letter":"D","text":"The rate of strength gained is not affected by the incision technique."}],"correct":"C","explanation":"<p>Why C is correct: A wound reopened through a recently healed incision benefits from the &quot;secondary healing&quot; (recurrent wound) phenomenon \u2014 the healing machinery is already active, so the reincised wound regains tensile strength faster than a fresh wound in unwounded tissue.</p>\n<p>Why the others are incorrect:</p>\n<p>A) A separate fresh incision in previously unwounded tissue must begin the healing/strength-gain process from the start, gaining strength more slowly.</p>\n\n<p>B) Excising the scar removes the active healing tissue and effectively creates a fresh wound, negating the accelerated response.</p>\n\n<p>D) Incision technique does affect the rate of strength recovery, as described above.</p>\n<p>Background: The early accelerated healing of a re-incised recent wound reflects primed fibroblasts and ongoing collagen synthesis/remodeling.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":45,"stem":"What is the fundamental tissue property measured by a CT scan?","options":[{"letter":"A","text":"Atomic number."},{"letter":"B","text":"Density."},{"letter":"C","text":"Relative x-ray attenuation."},{"letter":"D","text":"Hydrogen content."}],"correct":"C","explanation":"<p>Why C is correct: CT reconstructs images from the relative attenuation of x-rays passing through tissue, expressed in Hounsfield units (water = 0, air = \u22121000, dense bone strongly positive). Attenuation is the directly measured property.</p>\n<p>Why the others are incorrect:</p>\n<p>A) Atomic number influences attenuation but is not the measured quantity.</p>\n\n<p>B) Physical density contributes to attenuation but is not itself what CT measures; Hounsfield units are attenuation-based.</p>\n\n<p>D) Hydrogen (proton) content is the basis of MRI signal, not CT.</p>\n<p>Background: Hounsfield units are defined relative to the linear attenuation coefficient of water.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":46,"stem":"Which of the following is the best screening test for significant carotid stenosis in a patient with an asymptomatic carotid bruit?","options":[{"letter":"A","text":"MR angiography."},{"letter":"B","text":"Four-vessel cerebral angiography."},{"letter":"C","text":"CT angiography."},{"letter":"D","text":"Duplex ultrasound scanning."}],"correct":"D","explanation":"<p>Why D is correct: Carotid duplex ultrasound is the first-line screening test for carotid stenosis: noninvasive, inexpensive, without radiation or contrast, and accurate for quantifying stenosis by velocity criteria.</p>\n<p>Why the others are incorrect:</p>\n<p>A) MR angiography is more costly and typically used as a confirmatory/adjunct study, not first-line screening.</p>\n\n<p>B) Catheter cerebral angiography is invasive with stroke risk; it is reserved for problem-solving, not screening.</p>\n\n<p>C) CT angiography involves radiation and iodinated contrast; useful confirmatory test but not the screening modality.</p>\n<p>Background: Duplex findings are commonly confirmed with a second modality (CTA/MRA) before intervention.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":47,"stem":"All of the following are clinical features of acute hypocalcemia, EXCEPT?","options":[{"letter":"A","text":"Chvostek's sign \u2014 facial muscle spasm on stimulation of the facial nerve."},{"letter":"B","text":"Trousseau's sign \u2014 carpal spasms following inflation of a blood pressure cuff."},{"letter":"C","text":"Hypertension."},{"letter":"D","text":"Prolonged QT interval."}],"correct":"C","explanation":"<p>Why C is correct: Hypertension is not a feature of acute hypocalcemia; severe hypocalcemia tends to depress myocardial contractility and can cause hypotension.</p>\n<p>Why the others are features:</p>\n<p>A) Chvostek&#x27;s sign reflects neuromuscular irritability from hypocalcemia.</p>\n\n<p>B) Trousseau&#x27;s sign (carpopedal spasm on cuff inflation) is a classic hypocalcemic sign.</p>\n\n<p>D) Hypocalcemia prolongs the QT interval and can precipitate arrhythmias.</p>\n<p>Background: Acute hypocalcemia (e.g., post-thyroidectomy/parathyroid injury) causes tetany, paresthesias, laryngospasm, seizures, QT prolongation, and reduced cardiac contractility.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":48,"stem":"All the following patients require intubation and mechanical ventilation. In which ONE of these patients is the use of succinylcholine contraindicated?","options":[{"letter":"A","text":"Patient with cardiogenic shock."},{"letter":"B","text":"Patient with 70% 3rd degree burns."},{"letter":"C","text":"Trauma patient with Lefort III facial fracture."},{"letter":"D","text":"Patient with severe hypokalemia."}],"correct":"B","explanation":"<p>Why B is correct: Major burns cause upregulation of extrajunctional acetylcholine receptors; succinylcholine then triggers massive potassium efflux, causing life-threatening hyperkalemia, arrhythmias, and cardiac arrest. Burns are a classic contraindication.</p>\n<p>Why the others are less correct:</p>\n<p>A) Cardiogenic shock is not a specific contraindication to succinylcholine.</p>\n\n<p>C) A LeFort III fracture may complicate airway management but is not itself a contraindication to succinylcholine (though it may favor other approaches).</p>\n\n<p>D) Succinylcholine transiently raises serum potassium (~0.3\u20131 mEq/L); severe hypokalemia is not a listed FDA contraindication, and succinylcholine could arguably even be relatively tolerated. It is not the best answer.</p>\n<p>Important timing caveat (per FDA labeling and clinical pharmacology): Succinylcholine is contraindicated after the acute phase of a major burn \u2014 receptor upregulation develops over days, with hyperkalemia risk peaking ~7\u201310 days post-burn. In the first ~24\u201348 hours after the burn it can still be used in an otherwise healthy patient. The question does not specify the time since injury; among these options, the extensive burn is unambiguously the intended contraindication.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":49,"stem":"A patient wants your advice about recovery after an attack of acute low back pain. The best available study of this question describes time-to-time recover for a cohort of patients with low back pain. The study found that several variables were related to prognosis: severity of pain at onset, presence of lumbar disc disease, neurological deficit such as weakness and numbness, activity following the attack and spinal manipulation. Which approach would provide the most information in tailoring prognosis to your particular patient?","options":[{"letter":"A","text":"Stratified analysis."},{"letter":"B","text":"Matching."},{"letter":"C","text":"Multivariate analysis."},{"letter":"D","text":"Sensitivity analysis."}],"correct":"C","explanation":"<p>Why C is correct: When multiple prognostic variables act simultaneously, multivariate (multivariable) analysis models their combined and independent contributions, allowing an individualized prognosis based on a specific patient&#x27;s profile of characteristics.</p>\n<p>Why the others are incorrect:</p>\n<p>A) Stratified analysis handles only a few categories at a time and becomes unwieldy with many variables (sparse strata).</p>\n\n<p>B) Matching is a design technique to control confounding in comparative studies, not a method to tailor an individual prognosis from multiple predictors.</p>\n\n<p>D) Sensitivity analysis tests the robustness of results to assumptions; it does not generate individualized prognostic estimates.</p>\n<p>Background: Multivariable prognostic models (e.g., regression) yield individualized risk/recovery estimates from a set of predictors.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":50,"stem":"A 70 year old man is about to undergo a left total hip replacement. He has a history of significant penicillin allergy. Which of the following drugs would NOT be appropriate for use as a prophylactic agent for this patient?","options":[{"letter":"A","text":"Cefazolin."},{"letter":"B","text":"Clindamycin."},{"letter":"C","text":"Erythromycin."},{"letter":"D","text":"Vancomycin."}],"correct":"A","explanation":"<p>Why cefazolin was the intended answer in 2008: With a history of &quot;significant&quot; penicillin allergy, cefazolin (a cephalosporin sharing the beta-lactam ring) was traditionally avoided because of presumed cross-reactivity, making it the &quot;not appropriate&quot; choice.</p>\n<p>Why the alternatives were considered appropriate:</p>\n<p>B) Clindamycin is a standard non-beta-lactam alternative for orthopedic prophylaxis in beta-lactam allergy.</p>\n\n<p>D) Vancomycin is an accepted alternative in patients with beta-lactam allergy (and for MRSA risk).</p>\n\n<p>C) Erythromycin is a non-beta-lactam; while not a preferred modern orthopedic prophylactic agent, it was listed as a non-cross-reactive option and so was not the intended &quot;not appropriate&quot; answer relative to cefazolin.</p>\n<p>Note \u2014 evidence reversed since 2008: Current allergy guidance establishes that cefazolin has a unique R1 side chain not shared with penicillins, and its cross-reactivity is very low even in confirmed penicillin allergy (reaction rate ~0.7\u20130.8%) (Khan et al., AAAAI Drug Allergy Practice Parameter, 2022; Singla et al., JAMA, 2024). Cefazolin is now recommended as first-line surgical prophylaxis even for most penicillin-allergic patients \u2014 including those with prior anaphylaxis \u2014 reserving avoidance for severe delayed reactions (e.g., SJS/TEN, DRESS). Using a second-line agent instead is associated with higher surgical site infection rates. By current standards, cefazolin would be appropriate, so this question&#x27;s premise no longer holds.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":51,"stem":"A 22 year old man is brought to the Emergency Room after a motor vehicle collision. His blood pressure is 80/40 and his heart rate is 140 after 2000-ccs bolus of normal saline. His GCS is 7 (eyes closed, no verbalization, purposeful movement of all four extremities). He has crepitus and palpable rib fractures on the left with equal breath sounds bilaterally. He has an obvious femur fracture also on the left. The most likely explanation for this hemodynamic picture is?","options":[{"letter":"A","text":"Intracranial hemorrhage."},{"letter":"B","text":"Left tension pneumothorax."},{"letter":"C","text":"Inter-abdominal hemorrhage."},{"letter":"D","text":"Blood loss associated with femur fracture."}],"correct":"C","explanation":"<p><em>Why C is correct:</em> The patient remains in class III\u2013IV shock (hypotension, HR 140) despite a 2 L crystalloid bolus. Persistent shock after initial resuscitation in blunt trauma points to ongoing hemorrhage, and the abdomen (along with the pelvis) is the most likely occult reservoir capable of exsanguinating blood loss. This mandates FAST/CT and likely laparotomy.</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>A (intracranial hemorrhage):</strong> Isolated intracranial bleeding does not cause hypotension in adults except as a terminal (Cushing/agonal) event. Hypotension in a trauma patient must be assumed hemorrhagic until proven otherwise. The low GCS is concerning but is not the source of shock.</p>\n\n<p><strong>B (tension pneumothorax):</strong> Excluded by equal, bilateral breath sounds. Tension pneumothorax also produces respiratory distress and distended neck veins, not described here.</p>\n\n<p><strong>D (femur fracture):</strong> A closed femur fracture typically sequesters ~1\u20131.5 L (up to ~40% of a class III deficit), which alone rarely sustains refractory shock after 2 L resuscitation. It contributes but is not the most likely primary explanation.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":52,"stem":"Which of the following is the most important stimulus for triggering the endocrine response after injury?","options":[{"letter":"A","text":"Afferent nerve stimuli from the injured area."},{"letter":"B","text":"Hypovolemia."},{"letter":"C","text":"Tissue acidosis."},{"letter":"D","text":"Local wound factors."}],"correct":"B","explanation":"<p><em>Why B is correct:</em> The neuroendocrine stress response is triggered chiefly by a decrease in effective circulating volume, sensed by baroreceptors and volume receptors, which activates the sympathoadrenal axis and the hypothalamic\u2013pituitary\u2013adrenal axis (ADH, ACTH/cortisol, catecholamines, aldosterone, renin\u2013angiotensin). Volume/pressure change is the dominant afferent signal.</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>A (afferent nociceptive input):</strong> Pain/afferent nerve traffic from the wound is an important co-stimulus and can initiate the response even before volume loss, but it is not considered the single most important trigger.</p>\n\n<p><strong>C (tissue acidosis) and D (local wound factors):</strong> These modulate the local and systemic inflammatory (cytokine) response but are secondary contributors to the systemic endocrine response compared with volume depletion.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":53,"stem":"Many drugs used in surgical practice are bound to plasma proteins. Which of the following statements is correct?","options":[{"letter":"A","text":"Albumin is the plasma protein largely responsible for binding drugs."},{"letter":"B","text":"Binding is usually irreversible."},{"letter":"C","text":"Binding to plasma proteins is highly specific, that is, the binding locus is specific for a given drug."},{"letter":"D","text":"Bound drug has enhanced glomerular filtration."}],"correct":"A","explanation":"<p><em>Why A is correct:</em> Albumin is the most abundant plasma protein and the major carrier for acidic and neutral drugs (alpha-1-acid glycoprotein binds many basic drugs). Only the free (unbound) fraction is pharmacologically active.</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>B (irreversible):</strong> Protein binding is a rapidly reversible equilibrium; bound and free drug interconvert continuously.</p>\n\n<p><strong>C (highly specific):</strong> Binding is relatively non-specific and of low affinity; many drugs compete for the same albumin sites, which underlies displacement interactions.</p>\n\n<p><strong>D (enhanced filtration):</strong> Protein-bound drug is too large to be filtered at the glomerulus. Binding therefore <em>reduces</em> glomerular filtration; only free drug is filtered.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":54,"stem":"Which of the following can cause spuriously elevated pulse oximeter readings?","options":[{"letter":"A","text":"Methemoglobinemia."},{"letter":"B","text":"Finger nail polish."},{"letter":"C","text":"Hyperbilirubinemia."},{"letter":"D","text":"IV methylene blue."}],"correct":"A","explanation":"<p><em>Why A is correct:</em> Methemoglobin absorbs light nearly equally at 660 and 940 nm, driving the SpO\u2082 reading toward a fixed ~85% regardless of true saturation. When the true arterial saturation is below 85%, the oximeter therefore reads falsely <em>high</em> (spuriously elevated). Co-oximetry is required for an accurate measurement.</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>B (nail polish):</strong> Certain colors (blue, black, green) cause falsely <em>low</em> readings.</p>\n\n<p><strong>C (hyperbilirubinemia):</strong> Does not significantly affect two-wavelength pulse oximetry (it does interfere with some co-oximeter measurements).</p>\n\n<p><strong>D (IV methylene blue):</strong> A transient intravascular dye that absorbs at 660 nm and causes falsely <em>low</em> readings.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":55,"stem":"A 53 year old woman who underwent brain tumour resection four days ago develops left lower extremity pain and swelling. An ultrasound examination demonstrates clot in the femoral popliteal veins on the left. The most appropriate treatment for this is?","options":[{"letter":"A","text":"Begin ambulation and discontinue bed rest."},{"letter":"B","text":"Begin intravenous heparin administration."},{"letter":"C","text":"Use intermittent leg compression and graduated-compression stockings."},{"letter":"D","text":"Place an IVC filter."}],"correct":"D","explanation":"<p><em>Why D is correct:</em> This is a proximal (femoropopliteal) DVT with a high risk of proximal propagation/pulmonary embolism, but therapeutic anticoagulation is contraindicated within days of intracranial tumor surgery because of catastrophic intracranial hemorrhage risk. A retrievable IVC filter provides PE protection while anticoagulation is withheld.</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>A (ambulation alone):</strong> Does not treat an established proximal DVT and does not prevent PE.</p>\n\n<p><strong>B (IV heparin):</strong> Full anticoagulation 4 days after craniotomy risks fatal intracranial bleeding and is contraindicated here.</p>\n\n<p><strong>C (mechanical prophylaxis):</strong> Intermittent compression/stockings are <em>prophylaxis</em>, not treatment of an existing proximal clot, and are insufficient for established DVT with PE risk.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":56,"stem":"A 19 year old man is shot in the abdomen. When EMS arrives his vitals are heart rate 130, blood pressure 90/60, respiratory rate 20. EMS calls you at the base hospital to ask for advice. You should ask the EMS team to?","options":[{"letter":"A","text":"Bring the patient to the Emergency Room ASAP."},{"letter":"B","text":"Administer 1,000 cc 10% dextran solution on route to the ER."},{"letter":"C","text":"Intubate the patient in the field and administer fluid on route to the ER."},{"letter":"D","text":"Administer fluid bolus in the field over 10 minutes and then transport patient to the ER."}],"correct":"A","explanation":"<p><em>Why A is correct:</em> Penetrating truncal trauma with hemorrhagic shock requires operative hemorrhage control. Field time should be minimized; the definitive intervention is in the operating room. &quot;Scoop and run&quot; with en-route resuscitation improves survival over on-scene delays.</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>B (dextran):</strong> Colloid/dextran offers no survival benefit, can worsen coagulopathy and platelet function, and delays transport.</p>\n\n<p><strong>C (field intubation):</strong> A hemodynamically compensated, breathing patient (RR 20) does not need field intubation; induction can precipitate hemodynamic collapse and delays transport. Airway can be managed en route or on arrival if needed.</p>\n\n<p><strong>D (10-minute field bolus):</strong> Delaying transport for a timed field bolus is inappropriate. In uncontrolled penetrating hemorrhage, aggressive pre-hospital crystalloid can raise pressure, dislodge clot, and worsen bleeding; permissive hypotension until surgical control is preferred.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":57,"stem":"A 57 year old man requires mechanical ventilation because of respiratory failure secondary to a blood transfusion (TRALI). Despite an FI02 of 0.5, his PO2 is noted to be only 60. The cause of this man\u2019s hypoxemia is?","options":[{"letter":"A","text":"Right to left shunt."},{"letter":"B","text":"V/Q mismatch."},{"letter":"C","text":"Increased diffusion barrier."},{"letter":"D","text":"Decreased mixed venous O2 saturation."}],"correct":"A","explanation":"<p><em>Why A is correct:</em> TRALI produces non-cardiogenic pulmonary edema with alveolar flooding, physiologically identical to ARDS. Perfused but non-ventilated (fluid-filled) alveoli create a true right-to-left shunt, the hallmark of which is hypoxemia that is refractory to supplemental oxygen \u2014 exactly the picture here (PO\u2082 60 on FiO\u2082 0.5).</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>B (V/Q mismatch):</strong> V/Q mismatch causes hypoxemia that corrects readily with supplemental O\u2082; it does not explain refractory hypoxemia on FiO\u2082 0.5.</p>\n\n<p><strong>C (increased diffusion barrier):</strong> Diffusion limitation is a minor contributor and is largely overcome by increasing FiO\u2082; it is not the dominant mechanism in alveolar-filling disease.</p>\n\n<p><strong>D (decreased mixed venous O\u2082):</strong> Low mixed venous saturation can worsen the effect of a shunt but is not the primary cause of hypoxemia in TRALI/ARDS.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":58,"stem":"A 30 year old man is involved in a motor vehicle accident. He requires emergency splenectomy and open reduction and internal fixation of a left femur fracture. On post-operative day two in the Intensive Care Unit, he develops a decreasing level of consciousness (GCS 14) and severe hypoxemia, necessitating intubation and mechanical ventilation. He was noted to have petechiae on his chest. The cause of his respiratory failure is likely?:","options":[{"letter":"A","text":"Aspiration."},{"letter":"B","text":"Fat embolism syndrome."},{"letter":"C","text":"Adult respiratory distress syndrome (ARDS)."},{"letter":"D","text":"Nosocomial pneumonia."}],"correct":"B","explanation":"<p><em>Why B is correct:</em> The classic triad \u2014 hypoxemia, neurologic changes, and a petechial rash (often axillary/conjunctival/upper chest) \u2014 appearing 24\u201372 hours after a long-bone fracture is diagnostic of fat embolism syndrome (Gurd criteria). The timing (POD 2), femur fracture, and petechiae make this the best answer.</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>A (aspiration):</strong> Possible in trauma, but aspiration does not explain the petechial rash and typically presents earlier with a focal infiltrate.</p>\n\n<p><strong>C (ARDS):</strong> ARDS is a syndrome/final common pathway that could develop, but the petechiae + neurologic changes + long-bone fracture specifically identify fat embolism as the etiology; ARDS is a less specific answer.</p>\n\n<p><strong>D (nosocomial pneumonia):</strong> Too early (POD 2) for ventilator-associated/hospital-acquired pneumonia, and it does not cause petechiae or the acute neurologic decline described.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":59,"stem":"An 85 year old man develops septic shock following attempted removal of an obstructing right ureteric stone. He is transferred to the ICU and resuscitation is begun with fluids and pressors. Which of the following antibiotics would NOT be appropriate for use in this patient while awaiting blood and urine culture results?","options":[{"letter":"A","text":"Ceftriaxone."},{"letter":"B","text":"Ciprofloxacin."},{"letter":"C","text":"Gentamycin."},{"letter":"D","text":"Imipenem."}],"correct":"C","explanation":"<p><em>Why C is correct:</em> In an 85-year-old with obstructive urosepsis, aminoglycosides are the least appropriate empiric choice: obstruction plus septic hypoperfusion predisposes to acute kidney injury, and gentamicin is nephrotoxic (and ototoxic), with additional risk from age-related reduced renal reserve. Aminoglycoside monotherapy is also suboptimal for gram-negative urosepsis when equally effective, less toxic agents are available.</p>\n<p><em>Why the others are incorrect (all appropriate empiric gram-negative coverage):</em></p>\n<p><strong>A (ceftriaxone):</strong> Standard empiric coverage for community gram-negative urosepsis.</p>\n\n<p><strong>B (ciprofloxacin):</strong> Excellent urinary gram-negative coverage and penetration (local resistance patterns permitting).</p>\n\n<p><strong>D (imipenem):</strong> Broad-spectrum carbapenem appropriate for severe/complicated urosepsis, particularly with resistant-organism risk.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":60,"stem":"A 31 year old man was a belted driver involved in a high-speed motor vehicle collision. His air bag deployed. He was found apparently uninjured at the scene. In the Emergency Room, he has right sided weakness despite a normal CT head. The next step in is management should be?","options":[{"letter":"A","text":"Close observation with serial neurological examination."},{"letter":"B","text":"Neck immobilization and C-spine x-ray."},{"letter":"C","text":"CT angiogram of neck."},{"letter":"D","text":"EEG."}],"correct":"C","explanation":"<p><em>Why C is correct:</em> A focal neurologic deficit (hemiparesis) with a <em>normal</em> non-contrast head CT after high-speed blunt trauma is the classic presentation of blunt cerebrovascular injury (carotid or vertebral artery dissection), which causes ischemic stroke before infarct is visible on early CT. CT angiography of the neck is the appropriate diagnostic study.</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>A (observation):</strong> Inappropriate to simply observe a lateralizing deficit; a treatable vascular injury/stroke must be excluded urgently.</p>\n\n<p><strong>B (C-spine imaging):</strong> Cervical spine clearance is important in trauma but does not explain or evaluate the hemiparesis with a normal head CT.</p>\n\n<p><strong>D (EEG):</strong> No clinical suggestion of seizure; EEG would not identify the vascular cause of a fixed focal deficit.</p>\n<p><em>Dated note (post-2008):</em> CT angiography is now firmly the first-line screening modality for blunt cerebrovascular injury, having replaced catheter angiography for screening, and expanded (modified Denver) screening criteria are standard of care.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":61,"stem":"In a septic patient, cytokine-mediated effects on trace element metabolism include which of the following?","options":[{"letter":"A","text":"Decreased serum iron level."},{"letter":"B","text":"Increased serum zinc level."},{"letter":"C","text":"Increased serum copper level."},{"letter":"D","text":"Decreased serum manganese level."}],"correct":"A","explanation":"<p><em>Why A is correct:</em> The acute-phase/cytokine response (IL-6\u2013driven hepcidin, plus lactoferrin sequestration) produces hypoferremia \u2014 a fall in serum iron \u2014 as part of nutritional immunity. This is a hallmark trace-element change of sepsis and inflammation.</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>B (increased zinc):</strong> Serum zinc <em>decreases</em> in sepsis (redistribution into liver/metallothionein), not increases.</p>\n\n<p><strong>C (increased copper):</strong> Serum copper actually <em>rises</em> because ceruloplasmin is a positive acute-phase reactant. <strong>Note:</strong> by strict biochemistry this statement is also true, making the item imperfectly constructed; however, the <em>decrease in serum iron</em> is the classic single answer intended, and it is the most specific and universally cited cytokine-mediated change.</p>\n\n<p><strong>D (decreased manganese):</strong> Manganese is not a characteristic acute-phase trace-element change.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":62,"stem":"Pre-operative non-invasive testing for the presence of inducible myocardial ischemia would be most appropriate for which of the following patients?","options":[{"letter":"A","text":"A healthy 60 year old man without historical cardiac risk factors scheduled for a gastrectomy for gastric adenocarcinoma."},{"letter":"B","text":"A patient with a history of myocardial infarction one year ago and good exercise tolerance undergoing a laparoscopic cholecystectomy."},{"letter":"C","text":"A patient with diabetes and renal insufficiency undergoing an inquinal hernia repair."},{"letter":"D","text":"A patient with limited exercise tolerance and diabetes undergoing a right hemi colectomy."}],"correct":"D","explanation":"<p><em>Why D is correct:</em> Preoperative stress testing is indicated only when the patient has poor or unknown functional capacity (&lt;4 METs) AND clinical risk factors AND is undergoing elevated-risk surgery, AND when the result would change management. This patient (limited exercise tolerance + diabetes + intra-abdominal colectomy) meets all criteria.</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>A (healthy, no risk factors):</strong> Even for major surgery, no clinical risk factors means testing is not indicated.</p>\n\n<p><strong>B (MI 1 year ago, good exercise tolerance, low-risk surgery):</strong> Good functional capacity (\u22654 METs) and low-risk surgery (lap chole) obviate stress testing regardless of history.</p>\n\n<p><strong>C (diabetes + renal insufficiency, hernia repair):</strong> Although he has risk factors, inguinal hernia repair is a low-risk procedure, so testing would not change management.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":63,"stem":"With regard to the spread of neoplasm, which of the following statements is FALSE?","options":[{"letter":"A","text":"Metastatic cells enter the lymph node via the subcapsular space and later permeate the sinusoids of the node."},{"letter":"B","text":"Carcinoma-in-situ is a lesion with histopathological characteristics of malignancy without detectable invasion beyond the basement membrane."},{"letter":"C","text":"Lymphatic involvement is common with epithelial neoplasms, whereas most sarcomas metastasize hematogenously."},{"letter":"D","text":"The metastatic process is highly efficient, as evidenced by the fact that the number of circulating tumour cells correlates with the metastatic burden."}],"correct":"D","explanation":"<p><em>Why D is correct (i.e., is the false statement):</em> Metastasis is a highly <em>inefficient</em> process. The vast majority of tumor cells that enter the circulation die (from shear, immune clearance, anoikis, failure to establish at distant sites); only a tiny fraction form clinically apparent metastases. Circulating tumor cell counts do not simply equate to metastatic burden.</p>\n<p><em>Why the others are correct (true) statements:</em></p>\n<p><strong>A:</strong> Lymphatic metastases classically arrive first in the subcapsular sinus, then extend through the nodal sinusoids \u2014 the basis for sentinel node biopsy.</p>\n\n<p><strong>B:</strong> Carcinoma-in-situ is defined by malignant cytology confined by an intact basement membrane, without invasion.</p>\n\n<p><strong>C:</strong> Carcinomas (epithelial) preferentially spread via lymphatics, whereas sarcomas (mesenchymal) characteristically metastasize hematogenously (typically to lung).</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":64,"stem":"A 67 year old man is admitted to hospital for treatment of bilateral pulmonary emboli with a heparin infusion. The patient\u2019s platelet count on admission was 250,000 and three days later, it is noted to be 75,000. On physical examination, the patient is noted to have ischemic changes in the right upper and lower extremities. Which of the following statements concerning this situation is correct?","options":[{"letter":"A","text":"Low molecular heparin can be safely used as a substitute for unfractionated heparin."},{"letter":"B","text":"Venous thrombosis is the most like cause of this man\u2019s recent physical findings."},{"letter":"C","text":"Subcutaneous administration of heparin is not associated with this problem."},{"letter":"D","text":"Direct thrombin-inhibitors are used as the first line of treatment."}],"correct":"D","explanation":"<p><em>Why D is correct:</em> The picture is heparin-induced thrombocytopenia (HIT type II): a &gt;50% platelet drop ~5 days (here day 3, consistent with possible prior exposure) into heparin therapy, with new thrombosis. Management is immediate cessation of all heparin and anticoagulation with a non-heparin agent \u2014 a direct thrombin inhibitor (argatroban, bivalirudin) or danaparoid/fondaparinux.</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>A (switch to LMWH):</strong> LMWH cross-reacts with HIT antibodies and is contraindicated.</p>\n\n<p><strong>B (venous thrombosis):</strong> The limb ischemia reflects <em>arterial</em> thrombosis, a characteristic and limb-threatening feature of HIT; it is not simply venous.</p>\n\n<p><strong>C (route matters):</strong> HIT can occur with any heparin exposure \u2014 IV, subcutaneous, or even catheter flushes.</p>\n<p><em>Dated note (post-2008):</em> Argatroban, danaparoid, and fondaparinux remain standard; direct oral anticoagulants (e.g., rivaroxaban) are now also increasingly used for HIT, particularly once clinically stable. Warfarin must be avoided until platelet recovery.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":65,"stem":"A 25 year old woman is involved in a motor vehicle accident. On arrival in the Emergency Room, the GCS is 7. CSF is seen in her left ear. There are obvious extremity fractures in both legs. The patient is intubated. With regards to her head injury, what is the most important treatment prior to getting a CT scan of the head?","options":[{"letter":"A","text":"Maintain normal blood pressure and oxygenation."},{"letter":"B","text":"Hyperventilate patient to a pCO2 level of 25."},{"letter":"C","text":"Administer 250 cc's 10% mannitol over 30 minutes."},{"letter":"D","text":"Administer Ancef 1 gram IV."}],"correct":"A","explanation":"<p><em>Why A is correct:</em> Preventing secondary brain injury is the top priority in severe TBI. Even a single episode of hypotension or hypoxia markedly worsens outcome. Maintaining adequate MAP/cerebral perfusion pressure and oxygenation takes precedence over any specific ICP-directed maneuver before imaging.</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>B (hyperventilation to pCO\u2082 25):</strong> Aggressive/prophylactic hyperventilation causes cerebral vasoconstriction and ischemia and is harmful; if used at all, only briefly as a temporizing measure for impending herniation, targeting ~30\u201335 mmHg.</p>\n\n<p><strong>C (mannitol):</strong> Reserved for signs of raised ICP or herniation and should not precede exclusion of hypovolemia; in a polytrauma patient it can worsen intravascular volume depletion.</p>\n\n<p><strong>D (cefazolin):</strong> Prophylactic antibiotics for basilar skull fracture with CSF leak (otorrhea) are not recommended and do not reduce meningitis risk; irrelevant to acute stabilization.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":66,"stem":"Which of the following statements about packed red blood cells after three weeks of storage is TRUE?","options":[{"letter":"A","text":"Affinity for oxygen decreases."},{"letter":"B","text":"They must be used within one week."},{"letter":"C","text":"24 hour post-transfusion red cell survival is less that 50%."},{"letter":"D","text":"Potassium concentration increases."}],"correct":"D","explanation":"<p><em>Why D is correct:</em> During storage (the &quot;storage lesion&quot;), the Na\u207a/K\u207a-ATPase slows and potassium leaks out of red cells into the supernatant, so extracellular/plasma potassium rises progressively \u2014 clinically relevant in massive or rapid transfusion, in neonates, and in renal failure.</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>A (oxygen affinity decreases):</strong> 2,3-DPG falls during storage, which <em>increases</em> hemoglobin&#x27;s oxygen affinity (shifts the curve left); affinity does not decrease.</p>\n\n<p><strong>B (one-week use):</strong> Stored PRBCs have a shelf life of roughly 35\u201342 days depending on the preservative; three-week-old units are well within limits.</p>\n\n<p><strong>C (survival &lt;50%):</strong> Regulatory standards require ~\u226575% of transfused red cells to survive at 24 hours; it is not below 50%.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":67,"stem":"Which of the following conditions is NOT a risk factor for post-operative cardiac morbidity?","options":[{"letter":"A","text":"S3 gallop rhythm on auscultation."},{"letter":"B","text":"More than five pvcs/minute on an ECG."},{"letter":"C","text":"Coronary artery stenting in the past six months."},{"letter":"D","text":"Significant aortic stenosis."}],"correct":"C","explanation":"<p><em>Why C is the intended answer:</em> In the classic Goldman/Detsky cardiac risk indices, the independent predictors include an S\u2083 gallop/elevated JVP (heart failure), frequent ventricular ectopy (&gt;5 PVCs/min), and significant aortic stenosis. Coronary revascularization was historically regarded as risk-<em>reducing</em> rather than a listed risk factor, so it is the outlier among these options.</p>\n<p><em>Why the others are incorrect (they ARE risk factors):</em></p>\n<p><strong>A (S\u2083 gallop):</strong> Sign of decompensated heart failure \u2014 one of the strongest predictors of perioperative cardiac events.</p>\n\n<p><strong>B (&gt;5 PVCs/min):</strong> A classic Goldman-index predictor of perioperative cardiac morbidity.</p>\n\n<p><strong>D (aortic stenosis):</strong> Significant/severe AS substantially increases perioperative cardiac risk.</p>\n<p><em>Important dated caveat:</em> By current standards, coronary stenting <em>within the preceding 6 months</em> is in fact a major perioperative risk factor \u2014 elective non-cardiac surgery is generally deferred because of stent-thrombosis risk when dual antiplatelet therapy is interrupted (recommended delays are ~30 days after bare-metal and up to 6\u201312 months after drug-eluting stents). This item is therefore outdated: read strictly today, recent stenting is <em>not</em> risk-free. The answer holds only within the historical Goldman-index framing.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":68,"stem":"A 37 year old homeless man presents in the Emergency Room with left leg pain. He has numerous bruises and abrasions on both legs. He has an area of erythema, tenderness, and induration starting on the medial aspect of the left ankle and extending up the leg to the knee. The left inquinal lymph nodes are enlarged and tender. The microorganism most likely responsible for this clinical scenario is?","options":[{"letter":"A","text":"Actinomycoses."},{"letter":"B","text":"Enterococcus."},{"letter":"C","text":"Staphylococcus aureus."},{"letter":"D","text":"Streptococcus pyogenes."}],"correct":"D","explanation":"<p><em>Why D is correct:</em> Rapidly spreading, non-suppurative cellulitis with an ascending pattern, lymphangitic streaking, and tender regional (inguinal) lymphadenopathy is classic for group A streptococcus. Streptococci elaborate spreading factors (streptokinase, hyaluronidase) that produce diffuse, non-purulent, ascending infection.</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>A (Actinomyces):</strong> Causes chronic, indurated, sinus-tract\u2013forming infections (e.g., cervicofacial &quot;lumpy jaw&quot;), not acute ascending leg cellulitis.</p>\n\n<p><strong>B (Enterococcus):</strong> A gut/urinary and intra-abdominal/wound pathogen; not a typical primary cause of spreading limb cellulitis with lymphangitis.</p>\n\n<p><strong>C (Staphylococcus aureus):</strong> More typically causes localized, purulent infection (abscess, furuncle, purulent cellulitis) rather than the diffuse, spreading, lymphangitic pattern described \u2014 although S. aureus is the other common cause of cellulitis, the ascending non-purulent lymphangitic picture favors strep.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":69,"stem":"A 65 year old diabetic man is scheduled for arteriography using non-ionic contract. His serum creatinine is 200. In addition to hydration, which of the following is indicated to reduce the risk of contrast-induced nephropathy?","options":[{"letter":"A","text":"Low dose dopamine infusion."},{"letter":"B","text":"Mannitol infusion."},{"letter":"C","text":"Hydrocortisone IV."},{"letter":"D","text":"Acetylcysteine IV."}],"correct":"D","explanation":"<p><em>Why D was the intended answer:</em> At the time of the exam, N-acetylcysteine, together with volume expansion, was widely recommended as an inexpensive, low-risk adjunct to reduce contrast-induced nephropathy in high-risk (diabetic, chronic kidney disease) patients.</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>A (low-dose dopamine):</strong> No renoprotective benefit and potential for arrhythmia; abandoned for renal protection.</p>\n\n<p><strong>B (mannitol):</strong> Osmotic diuresis does not prevent, and may worsen, contrast nephropathy.</p>\n\n<p><strong>C (hydrocortisone):</strong> Steroids are used to prevent contrast <em>allergic</em> reactions, not nephrotoxicity.</p>\n<p><em>Dated note (post-2008):</em> Subsequent large randomized data (notably the 2018 PRESERVE trial) showed that N-acetylcysteine does <strong>not</strong> prevent contrast-associated acute kidney injury, and sodium bicarbonate offers no advantage over saline. Current practice relies on intravenous isotonic fluid hydration and minimizing/holding nephrotoxins; NAC is no longer recommended. Note also the item&#x27;s internal inconsistency \u2014 NAC was classically given orally, not IV.</p>\n<p><strong>Questions 70\u201372 (matching set)</strong></p>\n<p>Options: A) corticosteroids B) cyclosporine C) mycophenolate mofetil D) sirolimus</p>","no_key":false,"no_options":false,"free_answer":null},{"number":70,"stem":"For each of the following three questions, select the one answer that is most closely associated with the question stem: Blocks the calcineurin pathway","options":[{"letter":"A","text":"Corticosteroids."},{"letter":"B","text":"Cyclosporine."},{"letter":"C","text":"Mycophenolate mofetil."},{"letter":"D","text":"Sirolimus."}],"correct":"B","explanation":"<p><em>Why B is correct:</em> Cyclosporine binds cyclophilin; the complex inhibits calcineurin, the calcium/calmodulin-dependent phosphatase, thereby preventing downstream T-cell activation and IL-2 transcription. (Tacrolimus is the other calcineurin inhibitor but is not an option.)</p>\n<p><em>Why not the others:</em> Corticosteroids act on transcription (NF-\u03baB); mycophenolate blocks purine synthesis; sirolimus inhibits mTOR \u2014 none acts on calcineurin.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":71,"stem":"For each of the following three questions, select the one answer that is most closely associated with the question stem: Inhibitor of nuclear factor of activated T-cells","options":[{"letter":"A","text":"Corticosteroids."},{"letter":"B","text":"Cyclosporine."},{"letter":"C","text":"Mycophenolate mofetil."},{"letter":"D","text":"Sirolimus."}],"correct":"A","explanation":"<p><em>Explanation and caveat:</em> Strictly, &quot;nuclear factor of activated T-cells&quot; (NFAT) is the transcription factor activated by calcineurin, so the calcineurin inhibitors (cyclosporine/tacrolimus) are the true NFAT inhibitors \u2014 but cyclosporine is already the answer to Q70, and only one drug can be assigned per clue. Corticosteroids act by inhibiting a nuclear transcription factor (NF-\u03baB), suppressing pro-inflammatory cytokine transcription, and are the best remaining match for a &quot;nuclear factor&quot; clue. <strong>Note on item construction:</strong> this question is imprecisely worded \u2014 NFAT and NF-\u03baB are distinct, and the phrasing overlaps mechanistically with the calcineurin clue in Q70. Sirolimus (D) is left unmatched in this set.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":72,"stem":"For each of the following three questions, select the one answer that is most closely associated with the question stem: Inhibits calcium-independent pathways for T and B cell activation","options":[{"letter":"A","text":"Corticosteroids."},{"letter":"B","text":"Cyclosporine."},{"letter":"C","text":"Mycophenolate mofetil."},{"letter":"D","text":"Sirolimus."}],"correct":"C","explanation":"<p><em>Why C is correct:</em> Mycophenolate inhibits inosine monophosphate dehydrogenase (IMPDH), blocking de novo purine synthesis. Because both T and B lymphocytes depend on de novo purine synthesis for proliferation (they lack an effective salvage pathway), it selectively suppresses T- and B-cell activation/proliferation \u2014 a calcium-independent mechanism.</p>\n<p><em>Why not the others:</em> Cyclosporine works through the calcium-<em>dependent</em> calcineurin pathway; corticosteroids are broadly anti-inflammatory; sirolimus (mTOR inhibitor) is calcium-independent but predominantly targets IL-2\u2013driven T-cell proliferation rather than being described as the T- and B-cell antiproliferative agent.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":73,"stem":"Which of the following statements concerning glucagon is correct?","options":[{"letter":"A","text":"Major stimulants for the secretion of glucagon include hypoglycemia and exercise."},{"letter":"B","text":"The effects of glucagon are inhibited by cortisol."},{"letter":"C","text":"Glucagon plays a major role in the development of post-injury hyperglycemia."},{"letter":"D","text":"Somatostatin potentiates glucagon release from islet cells."}],"correct":"A","explanation":"<p><em>Why A is correct:</em> Glucagon secretion from pancreatic alpha cells is stimulated by hypoglycemia, exercise, amino acids, catecholamines/sympathetic activity, and stress \u2014 driving hepatic glycogenolysis and gluconeogenesis.</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>B (cortisol inhibits glucagon):</strong> Cortisol is synergistic/permissive with the counter-regulatory hormones and does not inhibit glucagon&#x27;s effects.</p>\n\n<p><strong>C (major role in post-injury hyperglycemia):</strong> Post-injury (&quot;stress&quot;) hyperglycemia is driven predominantly by catecholamines and cortisol together with insulin resistance; glucagon contributes but is not the major driver.</p>\n\n<p><strong>D (somatostatin potentiates):</strong> Somatostatin <em>inhibits</em> the secretion of both glucagon and insulin.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":74,"stem":"Which of the following statements concerning the cytokine interleukin-1 (IL-1) is NOT correct?","options":[{"letter":"A","text":"The cells most responsible for IL-1 production are monocytes and macrophages."},{"letter":"B","text":"IL-1 may induce fever."},{"letter":"C","text":"T-lymphocyte production of IL-2 is inhibited by IL-1."},{"letter":"D","text":"IL-1 may augment wound healing by increasing fibroblast proliferation and collagen synthesis."}],"correct":"C","explanation":"<p><em>Why C is the incorrect statement (and therefore the answer):</em> IL-1 is a co-stimulator of T-lymphocyte activation and <em>enhances</em> IL-2 production and IL-2 receptor expression; it does not inhibit IL-2. This is the false statement the question seeks.</p>\n<p><em>Why the others are correct (true) statements:</em></p>\n<p><strong>A:</strong> Activated monocytes/macrophages are the principal source of IL-1.</p>\n\n<p><strong>B:</strong> IL-1 is an endogenous pyrogen acting on the hypothalamus to cause fever.</p>\n\n<p><strong>D:</strong> IL-1 promotes fibroblast proliferation and collagen synthesis, contributing to wound healing.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":75,"stem":"Planned primary multimodality therapy results in improved survival or reduced morbidity of treatment in all of the following tumours, EXCEPT?","options":[{"letter":"A","text":"Infiltrating carcinoma of the breast."},{"letter":"B","text":"Wilms tumour."},{"letter":"C","text":"Melanoma."},{"letter":"D","text":"Sarcoma of the extremities."}],"correct":"C","explanation":"<p><em>Why C is correct (the exception):</em> At the time of the exam, cutaneous melanoma was managed principally by adequate surgical excision (with lymph node evaluation); adjuvant chemotherapy and radiation had limited impact on survival, so planned multimodality therapy did not reliably improve outcomes as it does for the other listed tumors.</p>\n<p><em>Why the others are incorrect (multimodality helps):</em></p>\n<p><strong>A (breast carcinoma):</strong> Multimodality therapy \u2014 surgery, radiation, endocrine/chemo/targeted therapy \u2014 clearly improves survival and enables breast conservation.</p>\n\n<p><strong>B (Wilms tumour):</strong> A paradigm of successful multimodality care (surgery + chemotherapy \u00b1 radiation) with excellent survival.</p>\n\n<p><strong>D (extremity sarcoma):</strong> Limb-sparing surgery combined with radiation (\u00b1 chemotherapy) reduces morbidity (avoids amputation) while maintaining local control.</p>\n<p><em>Dated note (post-2008):</em> Melanoma management has been transformed since this exam. Immune checkpoint inhibitors (anti\u2013PD-1, anti\u2013CTLA-4) and BRAF/MEK-targeted therapy now provide substantial survival benefit in adjuvant and metastatic settings, so effective systemic multimodality therapy is very much a reality for melanoma today.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":76,"stem":"A 60 year old trauma patient undergoes tracheostomy because of prolonged respiratory failure. Five days following the procedure, large quantities of bright red blood are noted to be coming from within and around the tracheostomy tube. The presumed diagnosis is?","options":[{"letter":"A","text":"Pulmonary embolus."},{"letter":"B","text":"Necrotizing pneumonia."},{"letter":"C","text":"Tracheitis."},{"letter":"D","text":"Tracheo-innominate artery fistula."}],"correct":"D","explanation":"<p>Why D is correct: Brisk, bright-red bleeding from and around a tracheostomy in the days-to-weeks after placement is the classic presentation of a tracheo-innominate artery fistula (TIF), caused by erosion of the tube (tip or cuff) into the innominate (brachiocephalic) artery. It typically occurs 3 days to 6 weeks post-tracheostomy, with a peak in the first 1\u20132 weeks. A &quot;herald bleed&quot; (sentinel minor bleed) often precedes catastrophic hemorrhage. It is a surgical emergency: initial control is by hyperinflating the cuff or applying digital compression of the artery against the sternum (Utley maneuver) while proceeding emergently to the OR.</p>\n<p>Why the others are incorrect:</p>\n<p>A) Pulmonary embolus does not cause external bright-red bleeding through a tracheostomy.</p>\n\n<p>B) Necrotizing pneumonia may cause hemoptysis but not large-volume pulsatile bleeding from around the stoma at this interval.</p>\n\n<p>C) Tracheitis causes mucopurulent secretions and possibly blood-streaking, not massive bright-red hemorrhage.</p>\n<p>Background: TIF is rare (&lt;1% of tracheostomies) but lethal. Risk factors include low tracheostomy placement, high cuff pressures, excessive tube movement, prolonged intubation, and steroids.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":77,"stem":"A 75 year old woman is scheduled to undergo a right total hip replacement. She takes coumadin for chronic atrial fibrillation. Which is the most appropriate management of her anticoagulation pre-operatively?","options":[{"letter":"A","text":"Stop coumadin five days pre-operatively and check the INR on the day of surgery."},{"letter":"B","text":"Stop coumadin five days pre-operatively, initiate low molecular weight heparin subcutaneously twice a day and hold heparin for 12 hours prior to surgery."},{"letter":"C","text":"Stop coumadin five days pre-operatively, admit patient to hospital and start IV unfractionated heparin infusion. Stop heparin infusion 6 hours preoperatively."},{"letter":"D","text":"Stop coumadin one day pre-operatively and administer vitamin K1 10 mgs subcutaneously. Check INR on day of surgery."}],"correct":"B","explanation":"<p>Why B was the 2008-intended answer: Stopping warfarin 5 days before surgery allows the INR to normalize, and &quot;bridging&quot; with therapeutic LMWH was historically standard to minimize the window of subtherapeutic anticoagulation in a patient with atrial fibrillation. LMWH is held ~12\u201324 hours before surgery (last therapeutic dose 24 hours prior; the &quot;12 hours&quot; figure applies to prophylactic dosing).</p>\n<p>Note \u2014 evidence has changed since 2008: The BRIDGE trial (2015) showed that in patients with atrial fibrillation, forgoing bridging was noninferior to LMWH bridging for arterial thromboembolism and roughly halved major bleeding. Current guidance (e.g., ACC 2017 and CHEST) recommends no bridging for most AF patients and reserves bridging for those at high thromboembolic risk (recent stroke/TIA/systemic embolism within 3 months, mechanical heart valve, rheumatic valvular disease, or prior thromboembolism during a prior interruption). For this woman with chronic AF and no stated high-risk features, simply stopping warfarin ~5 days before surgery and confirming an acceptable INR on the day of surgery (option A) reflects contemporary best practice. Bridging (B) is now considered net-harmful in average-risk AF.</p>\n<p>Why the other options are incorrect:</p>\n<p>C) Inpatient IV unfractionated heparin bridging is more costly and no more effective than LMWH; it is not the preferred bridging strategy and is unnecessary in average-risk AF.</p>\n\n<p>D) Stopping warfarin only 1 day pre-op will not reliably normalize the INR; giving 10 mg subcutaneous vitamin K produces unpredictable, prolonged warfarin resistance and is inappropriate for elective surgery.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":78,"stem":"A 35 year old man suffers a significant closed head injury and ruptured spleen in a motor vehicle accident. He undergoes emergency laparotomy and splenectomy and is transferred to the Intensive Care Unit post-operatively. He has a history of deep venous thrombosis due to antithrombin-III deficiency. The preferred VTE prophylaxis for this patient is?","options":[{"letter":"A","text":"Antithrombin III concentrate to maintain levels at 80 to 120% of normal."},{"letter":"B","text":"Enoxaparin 30 mgs subcutaneously bid."},{"letter":"C","text":"Heparin 5000 units subcutaneously bid."},{"letter":"D","text":"Heparin infusion to keep PTT >60."}],"correct":"A","explanation":"<p>Why A is correct: This patient has two competing problems: a very high VTE risk (major trauma, splenectomy, antithrombin-III deficiency, prior DVT) and a fresh closed head injury that contraindicates full therapeutic anticoagulation. Heparins (both UFH and LMWH) act by potentiating antithrombin, so in a patient with AT-III deficiency their efficacy is blunted. Repleting antithrombin III with concentrate to normal levels restores the substrate needed for endogenous and heparin-mediated anticoagulation and is the preferred strategy in AT-III\u2013deficient patients at high thrombotic risk when standard prophylaxis is inadequate or unsafe. Mechanical prophylaxis (intermittent pneumatic compression) should be used concurrently but is not among the options.</p>\n<p>Why the others are incorrect:</p>\n<p>B) and C) Standard prophylactic-dose LMWH/UFH depend on antithrombin and are less effective in AT-III deficiency; prophylactic dosing also carries the additional concern of any anticoagulant early after head injury.</p>\n\n<p>D) A therapeutic heparin infusion (PTT &gt;60) is frankly contraindicated in the acute phase of a significant closed head injury and will also be ineffective without adequate antithrombin.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":79,"stem":"Clostridium difficile colitis is becoming increasingly common. Which of the following statements about this disease is correct?","options":[{"letter":"A","text":"Not all antibiotics can cause Clostridium difficile colitis."},{"letter":"B","text":"Clostridium difficile colitis always induces severe diarrhea."},{"letter":"C","text":"The mainstay of treatment is oral Vancomycin."},{"letter":"D","text":"Emergency colectomy may be required."}],"correct":"D","explanation":"<p>Why D is correct: Fulminant C. difficile infection (hypotension/shock, ileus, or toxic megacolon) occurs in 1\u20133% of cases and carries 30\u201340% mortality. When it is refractory to medical therapy or complicated by megacolon/perforation, emergency subtotal colectomy with end ileostomy (or diverting loop ileostomy with colonic lavage) can be life-saving.</p>\n<p>Why the others are incorrect:</p>\n<p>A) Virtually all antibiotics have been implicated in C. difficile colitis (most commonly clindamycin, fluoroquinolones, cephalosporins, and penicillins); the statement that &quot;not all&quot; can cause it is misleading and not the best answer.</p>\n\n<p>B) CDI severity is a spectrum from asymptomatic carriage and mild diarrhea to fulminant disease; it does not &quot;always&quot; cause severe diarrhea, and fulminant cases may present with ileus and paradoxically little diarrhea.</p>\n\n<p>C) In 2008, oral vancomycin (or metronidazole) was the mainstay. This statement is now outdated: fidaxomicin (200 mg twice daily \u00d7 10 days) is preferred first-line over vancomycin for nonfulminant CDI in current IDSA/SHEA and AGA guidance because of lower recurrence, and metronidazole is reserved for fulminant disease (with vancomycin) or low-risk patients when preferred agents are unavailable. High-dose oral vancomycin remains the mainstay specifically for fulminant disease. Regardless, D is the single correct statement as written.</p>\n<p>Note \u2014 evidence has changed since 2008: The shift to fidaxomicin as preferred first-line therapy and the demotion of metronidazole postdate this exam.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":80,"stem":"Endocarditis prophylaxis is recommended for which of the following patients?","options":[{"letter":"A","text":"A patient with mitral valve prolapse without murmur undergoing rigid bronchoscopy."},{"letter":"B","text":"A patient with a history of rheumatic fever with normal cardiac valves undergoing prostatic biopsy."},{"letter":"C","text":"A patient with a prosthetic aortic valve undergoing endoscopic retrograde cholangiography for biliary obstruction."},{"letter":"D","text":"A patient with hypertrophic cardiomyopathy undergoing tympanoplasty tube insertion."}],"correct":"C","explanation":"<p>Why C is correct: A prosthetic cardiac valve places a patient in the highest-risk category for adverse outcomes from infective endocarditis, one of the conditions for which the AHA continues to recommend prophylaxis. Of the four scenarios, this is the only patient with a high-risk cardiac lesion and, importantly, ERCP for biliary obstruction involves an established/active biliary infection, in which antibiotic coverage (directed at enterococci) is appropriate. This is the best answer.</p>\n<p>Why the others are incorrect:</p>\n<p>A) Mitral valve prolapse (with or without murmur) is not a high-risk lesion and does not warrant prophylaxis.</p>\n\n<p>B) A history of rheumatic fever with normal valves is not a high-risk condition; prophylaxis is not indicated.</p>\n\n<p>D) Hypertrophic cardiomyopathy is not on the AHA high-risk list, and tympanostomy tube insertion is not an indication for prophylaxis.</p>\n<p>Note \u2014 current guidance: Under the 2007 AHA update (in effect at the time) and the 2020 ACC/AHA valve guideline, prophylaxis is limited to the highest-risk cardiac conditions (prosthetic valves/prosthetic repair material, prior IE, certain congenital heart disease, cardiac transplant valvulopathy) and, for procedural triggers, primarily dental procedures involving gingival/periapical manipulation. Routine prophylaxis is explicitly not recommended for GI or GU procedures (including ERCP, EGD, colonoscopy, cystoscopy) in the absence of active infection; when active GI/GU infection is present (as in this obstructed, infected biliary tree), giving an agent active against enterococci in a prosthetic-valve patient is reasonable. This nuance reinforces C as the answer.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":81,"stem":"A 45 year old man develops hyperglycemia despite adequate levels of circulating insulin during his recovery from a laparotomy for trauma with splenectomy. Post traumatic insulin resistance is primarily due to?","options":[{"letter":"A","text":"Cortisol."},{"letter":"B","text":"Insulin antibodies."},{"letter":"C","text":"Reduced insulin receptors."},{"letter":"D","text":"Increased insulin clearance."}],"correct":"A","explanation":"<p>Why A is correct: The post-injury &quot;ebb and flow&quot; stress response is characterized by surges of counter-regulatory hormones\u2014cortisol, catecholamines, and glucagon\u2014that produce a state of peripheral insulin resistance and hepatic gluconeogenesis. This &quot;stress hyperglycemia&quot; occurs despite adequate or elevated insulin levels. Cortisol is the principal driver among the listed options, promoting gluconeogenesis, lipolysis, and proteolysis and impairing peripheral glucose uptake.</p>\n<p>Why the others are incorrect:</p>\n<p>B) Insulin antibodies are not a feature of the acute injury response.</p>\n\n<p>C) Receptor down-regulation is not the primary mechanism; the resistance is largely post-receptor and hormonally driven.</p>\n\n<p>D) Insulin clearance is not primarily increased; circulating insulin is adequate/high, which is the point of the vignette.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":82,"stem":"A 65 year old man is injured in a motor vehicle collision. He suffers a chest wall injury consisting of a flail segment (5-9th ribs) and an underlying pulmonary contusion without hemo or pneumothorax. After resuscitation, he is receiving 4 l O2 per minute by nasal canula. He rates his pain as 8/10 and cannot take a deep breath or cough. His respiratory rate is 24 and he has mild respiratory acidosis. Urine output is 40 ml/h. Spinal injury has been ruled out. Which of the following is the most appropriate next step?","options":[{"letter":"A","text":"Endotracheal intubation and mechanical ventilatory support."},{"letter":"B","text":"Continuous epidural analgesia."},{"letter":"C","text":"Fluid resuscitation."},{"letter":"D","text":"Non-invasive ventilatory support with bi-PAP."}],"correct":"B","explanation":"<p>Why B is correct: In flail chest with pulmonary contusion, the dominant physiologic problem driving hypoventilation is severe pain that prevents deep breathing and coughing, leading to atelectasis, secretion retention, and worsening gas exchange. Aggressive analgesia\u2014thoracic epidural analgesia is the preferred modality\u2014improves tidal volumes, cough, and pulmonary toilet, and reduces the need for intubation, ventilator days, and pneumonia. This patient is awake, protecting his airway, and only mildly acidotic; optimizing analgesia is the correct next step.</p>\n<p>Why the others are incorrect:</p>\n<p>A) Intubation and mechanical ventilation is reserved for patients who fail less invasive measures (progressive respiratory failure, exhaustion, refractory hypoxemia/hypercapnia). It is premature here before adequate analgesia is provided.</p>\n\n<p>C) Aggressive fluid resuscitation is potentially harmful in pulmonary contusion (worsens edema); his urine output (40 mL/h) already indicates adequate perfusion.</p>\n\n<p>D) Non-invasive positive-pressure ventilation can be a useful adjunct, but the primary, guideline-supported intervention for flail chest is analgesia; controlling pain often obviates the need for any ventilatory support.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":83,"stem":"Which of the following statements regarding the transcription factor NFKB is correct?","options":[{"letter":"A","text":"It is anti-inflammatory."},{"letter":"B","text":"It inhibits TNF and IL1 transcription."},{"letter":"C","text":"Its activation increases iNOS expression."},{"letter":"D","text":"Its primary site of action is the cytoplasm."}],"correct":"C","explanation":"<p>Why C is correct: NF-\u03baB is a master pro-inflammatory transcription factor. Upon activation, it up-regulates transcription of numerous inflammatory genes, including inducible nitric oxide synthase (iNOS), TNF-\u03b1, IL-1, IL-6, adhesion molecules, and COX-2.</p>\n<p>Why the others are incorrect:</p>\n<p>A) NF-\u03baB is pro-inflammatory, not anti-inflammatory.</p>\n\n<p>B) It promotes (does not inhibit) TNF and IL-1 transcription.</p>\n\n<p>D) NF-\u03baB is held inactive in the cytoplasm bound to I\u03baB; upon activation and I\u03baB degradation, it translocates to the nucleus, where it acts as a transcription factor. Its site of action is the nucleus, not the cytoplasm.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":84,"stem":"Regarding indexes of tissue perfusion, which of the following statements is correct?","options":[{"letter":"A","text":"Normal cardiac index precludes tissue hypoxia."},{"letter":"B","text":"Normal or high mixed venous oxygen saturation (SvO2) precludes tissue hypoxia."},{"letter":"C","text":"High plasma lactate levels always reflect tissue hypoxia."},{"letter":"D","text":"There is a supply dependence of oxygen consumption on oxygen delivery in some circumstances."}],"correct":"D","explanation":"<p>Why D is correct: Normally, oxygen consumption (VO2) is independent of oxygen delivery (DO2) across a wide range because tissues increase extraction as delivery falls. Below a critical DO2 threshold, extraction is maximal and VO2 becomes &quot;supply-dependent,&quot; falling as delivery falls\u2014this is the hallmark of tissue oxygen debt and is seen in shock states (and, some argue, pathologically in sepsis/ARDS).</p>\n<p>Why the others are incorrect:</p>\n<p>A) A normal global cardiac index can coexist with regional or microcirculatory hypoperfusion and tissue hypoxia (e.g., distributive shock).</p>\n\n<p>B) A normal or high SvO2 does not exclude tissue hypoxia; in sepsis, impaired oxygen extraction and microcirculatory shunting can leave SvO2 high despite ongoing cellular hypoxia.</p>\n\n<p>C) Lactate can be elevated for non-hypoxic reasons (accelerated aerobic glycolysis, catecholamines/beta-2 stimulation, impaired hepatic clearance, thiamine deficiency, certain toxins/drugs), so high lactate does not &quot;always&quot; reflect tissue hypoxia.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":85,"stem":"Which part of the cell is thought to be the target of radiation damage?","options":[{"letter":"A","text":"Mitochondria."},{"letter":"B","text":"Nucleus."},{"letter":"C","text":"Nucleolus."},{"letter":"D","text":"Cell membrane."}],"correct":"B","explanation":"<p>Why B is correct: The principal target of ionizing radiation is nuclear DNA. Radiation causes single- and double-strand DNA breaks (directly and via reactive oxygen species), and unrepaired double-strand breaks lead to loss of reproductive/clonogenic capacity\u2014the basis of radiotherapy&#x27;s cytotoxic effect.</p>\n<p>Why the others are incorrect:</p>\n<p>A) Mitochondria contribute to ROS-mediated injury and apoptosis but are not the primary radiation target.</p>\n\n<p>C) The nucleolus is a subnuclear structure; the critical target is genomic DNA broadly, not the nucleolus specifically.</p>\n\n<p>D) Membrane lipid peroxidation occurs but is a secondary effect; lethal radiation injury is attributed to DNA damage.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":86,"stem":"A 50 year old woman is found to have an adenocarcinoma of the cecum. Consent is obtained for \u201cright hemicolectomy\u201d. At surgery a right hemicolectomy is carried out without difficulty. No evidence of metastatic disease is found except for a very bulky right ovary, highly suggestive of metastatic disease (Krukenberg tumour). In this situation, the surgeon should?","options":[{"letter":"A","text":"Close the abdomen and obtain informed consent for future right oophorectomy post operatively from the patient."},{"letter":"B","text":"Consult a gynecologist about the appropriate action to take in the Operating Room."},{"letter":"C","text":"Scrub out of the case and obtain consent for right oophorectomy from the patient\u2019s husband."},{"letter":"D","text":"Carry out right oophorectomy and inform the patient post-operatively."}],"correct":"A","explanation":"<p>Why A is correct: The patient consented only to a right hemicolectomy. An unexpected but non-life-threatening finding (a suspicious ovary) that was not discussed pre-operatively does not meet the threshold for proceeding without consent. Absent a genuine emergency, respect for patient autonomy requires completing the consented procedure, then discussing the finding with the competent patient and obtaining informed consent for a subsequent oophorectomy. This is the ethically and medicolegally correct course.</p>\n<p>Why the others are incorrect:</p>\n<p>B) Intraoperative consultation with gynecology addresses the technical/oncologic question but does not solve the consent problem; the patient still has not consented to oophorectomy.</p>\n\n<p>C) A competent adult patient&#x27;s spouse cannot provide consent on her behalf; substitute decision-making applies only when the patient lacks capacity.</p>\n\n<p>D) Performing an unconsented, non-emergent oophorectomy and informing her afterward violates informed-consent principles (battery), even if oncologically defensible.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":87,"stem":"A 50 year old man is admitted to the day surgery unit prior to craniotomy for meningioma. He is noted to be hypertensive and tremulous. He admits to daily heavy alcohol use including the night prior to surgery. The optimal management of this patient is?","options":[{"letter":"A","text":"Cancel surgery, rebook when the patient has abstained from alcohol for one month."},{"letter":"B","text":"Transfer the patient to a detoxification centre and reschedule surgery in one week."},{"letter":"C","text":"Admit the patient to the Neurosurgery Ward, sedate with benzodiazepine, reschedule surgery when the patient is free of withdrawal symptoms."},{"letter":"D","text":"Carry on with surgery and observe patient in the Intensive Care Unit postoperatively."}],"correct":"C","explanation":"<p>Why C is correct: This is elective surgery in a patient with signs of impending/early alcohol withdrawal (hypertension, tremor) after heavy chronic use. Proceeding risks intraoperative and postoperative delirium tremens, autonomic instability, and seizures\u2014especially dangerous with an intracranial procedure. The correct approach is to admit, manage withdrawal with benzodiazepines (the mainstay of prophylaxis/treatment), and defer the elective craniotomy until he is medically stable and through the withdrawal window.</p>\n<p>Why the others are incorrect:</p>\n<p>A) A full month of abstinence is unnecessary and impractical for a patient who needs tumor surgery; the immediate issue is safe management of acute withdrawal.</p>\n\n<p>B) Transfer to an outside detox facility fragments care; this patient needs inpatient medical management and timely surgery once stabilized.</p>\n\n<p>D) Proceeding with elective craniotomy in a patient at high risk for withdrawal/DTs is unsafe.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":88,"stem":"Nephrotoxicity from IV contrast agents is:","options":[{"letter":"A","text":"Caused by contract precipitation in the distal tubule."},{"letter":"B","text":"Reduced by oral acetylcystine."},{"letter":"C","text":"Increased by iso-osmolar contrast mediums."},{"letter":"D","text":"Independent of baseline renal function."}],"correct":"B","explanation":"<p>Why B was the intended answer: At the time of the exam, oral N-acetylcysteine plus hydration was widely recommended to reduce contrast-induced nephropathy, based on early positive but heterogeneous trials. By elimination it was the &quot;best&quot; of the four options.</p>\n<p>Note \u2014 evidence has changed since 2008 (this item is now flawed): The large PRESERVE trial (2018) found that N-acetylcysteine did NOT reduce contrast-associated acute kidney injury (and IV sodium bicarbonate was no better than saline). Current evidence therefore contradicts option B, and only isotonic IV hydration is supported. Under contemporary evidence none of the four options is cleanly correct.</p>\n<p>Why the other options are incorrect on their merits:</p>\n<p>A) The mechanism is renal medullary hypoxia/ischemia and direct tubular epithelial toxicity (with oxidative stress), not simple precipitation of contrast in the distal tubule.</p>\n\n<p>C) Iso-osmolar and low-osmolar contrast agents are less nephrotoxic than the older high-osmolar agents; iso-osmolar contrast does not increase nephrotoxicity.</p>\n\n<p>D) Pre-existing renal impairment (especially diabetic nephropathy) is the single strongest risk factor; nephrotoxicity is very much dependent on baseline renal function.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":89,"stem":"A 50 year old homeless alcoholic is admitted to hospital for treatment of left leg cellulitis. You are concerned that this patient may be very malnourished and require special dietary therapy. The best method of determining the nutritional status of this patient is?","options":[{"letter":"A","text":"History and physical examination (subjective global assessment)."},{"letter":"B","text":"Calculate the creatinine-height index."},{"letter":"C","text":"Test for delayed hypersensitivity reaction to common recall antigens."},{"letter":"D","text":"Measure serum albumin and transferrin."}],"correct":"A","explanation":"<p>Why A is correct: The Subjective Global Assessment\u2014which integrates history (weight change, dietary intake, GI symptoms, functional capacity) with physical findings (muscle wasting, subcutaneous fat loss, edema)\u2014is a validated, reliable, inexpensive bedside tool and the best overall method for assessing nutritional status. It outperforms isolated biochemical markers in predicting nutrition-related outcomes.</p>\n<p>Why the others are incorrect:</p>\n<p>B) The creatinine-height index requires accurate 24-hour urine collection and a known ideal weight; it is cumbersome and confounded by renal function and muscle mass.</p>\n\n<p>C) Delayed-type hypersensitivity (anergy) testing is nonspecific and confounded by illness, infection, and immunosuppression.</p>\n\n<p>D) Serum albumin and transferrin are negative acute-phase reactants; in acute illness/inflammation they fall independent of nutrition and are poor markers of nutritional status.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":90,"stem":"Which of the following statements regarding methacillin resistent staph aureus (MRSA) is NOT correct?","options":[{"letter":"A","text":"MSRA is a common nosocomial pathogen, but it can also be detected in the community."},{"lette
