t failure?","options":[{"letter":"1","text":"IgA Nephropathy."},{"letter":"2","text":"Glomerulonephritis."},{"letter":"3","text":"PCKD."},{"letter":"4","text":"Chronic allograft nephropathy."}],"correct":"2","explanation":"<p><strong>Why 2 is correct:</strong> Excluding death with a functioning graft, the leading causes of graft loss are alloimmune injury (chronic rejection/chronic allograft nephropathy) and recurrent glomerulonephritis. In the standard hierarchy --- death with functioning graft, then chronic allograft nephropathy/chronic rejection, then recurrent glomerulonephritis --- recurrent/de novo glomerulonephritis ranks third and is described as the second most predominant <em>intrinsic</em> cause of graft loss after alloimmune injury (Hariharan et al., NEJM, 2021; Wekerle et al., Lancet, 2017).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>4 (chronic allograft nephropathy):</strong> this is a <em>higher</em>-ranked cause (the leading death-censored cause of late graft loss via progressive fibrosis/chronic rejection), not third.</p>\n\n<p><strong>1 (IgA nephropathy):</strong> a specific form of recurrent glomerulonephritis, i.e., a subset of option 2 rather than a separately ranked leading cause.</p>\n\n<p><strong>3 (PCKD):</strong> polycystic kidney disease is a common cause of native kidney failure leading to transplant, but it does not recur in the allograft and is not a leading cause of graft failure.</p>\n<p><strong>Background:</strong> &quot;Death with a functioning graft&quot; (from cardiovascular disease, infection, and malignancy) is itself a major overall cause of graft loss and is sometimes listed first in these rankings.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":81,"stem":"Radiation therapy is measured in RADs and Grays (Gy). How many RADs are in one Gy?","options":[{"letter":"1","text":"10."},{"letter":"2","text":"100 (1 rad = 0.01 Gy)."},{"letter":"3","text":"1000."},{"letter":"4","text":"10000."}],"correct":"2","explanation":"<p><em>Why 100 is correct:</em> The gray is the SI unit of absorbed dose, defined as 1 joule per kilogram. One rad equals 0.01 Gy (100 erg/g), so 1 Gy = 100 rad by definition. This is a fixed unit conversion.</p>\n<p><em>Why the others are incorrect:</em> 10, 1000, and 10,000 do not correspond to the rad-to-gray relationship; they would imply 1 rad = 0.1, 0.001, or 0.0001 Gy respectively, all of which are false.</p>\n<p><em>Background:</em> The centigray (cGy) is now the common clinical unit and is numerically identical to the rad (1 cGy = 1 rad), which is why modern radiation oncology prescriptions in cGy map directly onto older rad-based literature.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":82,"stem":"A 67 year old female diabetic presents with flank pain and fever. CT scan shows perinephric gas. What organism is the most likely cause?","options":[{"letter":"1","text":"Staph aureus."},{"letter":"2","text":"E coli (E. Coli + Klebsiella)."},{"letter":"3","text":"Pseudomonas."},{"letter":"4","text":"Proteus mirabilis."}],"correct":"2","explanation":"<p><em>Why E. coli is correct:</em> Perinephric/renal parenchymal gas in a diabetic describes emphysematous pyelonephritis, over 90% of which occurs in diabetics. E. coli is isolated in 50--75% of cases and was the most common organism (83.8%) in a recent large cohort (Ngo et al., World Journal of Urology, 2025; Joshi et al., NEJM, 1999).</p>\n<p><em>Why the others are incorrect:</em> Klebsiella pneumoniae is the second most common cause but less frequent than E. coli. Proteus and Pseudomonas are recognized but uncommon gas-forming uropathogens. Staphylococcus aureus is a gram-positive organism and is not a typical cause of emphysematous pyelonephritis, which is driven by gas-producing gram-negative Enterobacteriaceae fermenting glucose and lactate.</p>\n<p><em>Background:</em> Diagnosis is by CT (plain films show gas in only ~1/3). Management combines glycemic control, fluid resuscitation, and antibiotics; percutaneous drainage or nephrectomy is reserved for severe or refractory disease per the Huang-Tseng classification.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":83,"stem":"A patient presents with obvious rhabdomyolosis. What electrolyte derangements will you expect to see?","options":[{"letter":"1","text":"Hypercalcemia, hyperphosphatemia."},{"letter":"2","text":"Hypocalcemia, hyperphosphatemia (1st hypocalcemia, then hyper. High PO+K)."},{"letter":"3","text":"Hypercalcemia, hypophosphatemia."},{"letter":"4","text":"Hypocalcemia, hyperphosphatemia (Options 2 and 4 are identical as transcribed; the intended answer is hypocalcemia with hyperphosphatemia.)."}],"correct":"2","explanation":"<p><em>Why hypocalcemia with hyperphosphatemia is correct:</em> Damaged myocytes release phosphate (hyperphosphatemia) and potassium (hyperkalemia). Early hypocalcemia results from calcium entering damaged cells and precipitating with phosphate in necrotic muscle, compounded by reduced calcitriol from hyperphosphatemia-induced 1\u03b1-hydroxylase inhibition (AAST consensus, 2021; Bosch et al., NEJM, 2009).</p>\n<p><em>Why the others are incorrect:</em> Hypercalcemia is not the early picture --- it occurs only during the recovery/polyuric phase as calcium is mobilized from healing muscle and calcitriol rebounds. Hypophosphatemia is the opposite of the expected phosphate release from lysed muscle.</p>\n<p><em>Background:</em> Because early hypocalcemia is largely due to calcium sequestration in muscle, calcium repletion is avoided unless the patient is symptomatic or has severe hyperkalemia, since exogenous calcium can worsen calcium-phosphate deposition. Hyperkalemia and hyperuricemia are the other expected derangements.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":84,"stem":"How does a harmonic scalpel work?","options":[{"letter":"1","text":"Pneumatic air."},{"letter":"2","text":"Electromagnetic."},{"letter":"3","text":"Microwave."},{"letter":"4","text":"Ultrasound (LigaSure is bipolar)."}],"correct":"4","explanation":"<p><em>Why ultrasound is correct:</em> The harmonic scalpel converts electrical energy into mechanical blade vibration at ~55.5 kHz, denaturing tissue proteins by cleaving hydrogen bonds to form a coagulum that seals vessels at low temperatures (50--100\u00b0C) (Cannizzaro et al., Head &amp; Neck, 2016; Cheng et al., World Journal of Surgical Oncology, 2018).</p>\n<p><em>Why the others are incorrect:</em> Pneumatic, electromagnetic, and microwave energy are not the operating principle. As the original key notes, LigaSure is a bipolar electrosurgical vessel-sealing device --- a distinct technology that denatures collagen and elastin, not an ultrasonic one.</p>\n<p><em>Background:</em> Compared with monopolar/bipolar electrocautery (150--400\u00b0C), the ultrasonic mechanism produces less lateral thermal spread, a key advantage near nerves and in laparoscopic fields. Both harmonic and LigaSure reliably seal vessels up to ~5--7 mm.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":85,"stem":"A patient you examine is found to have a positive Trousseau's sign and prolonged QT segment on his ECG. What is the underlying diagnosis?","options":[{"letter":"1","text":"Hypocalcemia."},{"letter":"2","text":"Hypercalcemia."},{"letter":"3","text":"Hyperkalemia."},{"letter":"4","text":"Hypermagnesia."}],"correct":"1","explanation":"<p><em>Why hypocalcemia is correct:</em> Low ionized calcium increases neuromuscular excitability (Trousseau sign --- carpopedal spasm with cuff inflation; Chvostek sign) and prolongs the QT interval, predisposing to torsades de pointes (American Thyroid Association, 2018; Sell et al., AFP, 2022). The Trousseau sign is relatively specific, positive in only ~1% of healthy individuals.</p>\n<p><em>Why the others are incorrect:</em> Hypercalcemia causes a shortened QT, the opposite finding. Hyperkalemia produces peaked T waves and QRS widening, not QT prolongation with tetany. Hypermagnesemia causes hyporeflexia and hypotension, not tetany with a positive Trousseau sign.</p>\n<p><em>Background:</em> Every 1 mg/dL fall in serum calcium prolongs QTc by roughly 13 ms. Common surgical settings include post-thyroidectomy/parathyroidectomy hypoparathyroidism and massive transfusion (citrate chelation).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":86,"stem":"Which of the following situations is an appropriate indication for bariatric surgery?","options":[{"letter":"1","text":"BMI > 30 with obesity-related co-morbities."},{"letter":"2","text":"BMI > 35 (with co-morbidities)."},{"letter":"3","text":"BMI > 40."},{"letter":"4","text":"Obesity and type 2 diabetes mellitus."}],"correct":"3","explanation":"<p><em>Why BMI &gt; 40 is correct under classic criteria:</em> The 1991 NIH consensus criteria --- in force when this exam was written --- endorsed bariatric surgery for BMI \u226540 regardless of comorbidity, or BMI \u226535 with an obesity-related comorbidity (Arterburn et al., JAMA, 2020). BMI &gt;40 alone is the only option that satisfies the classic criteria as literally worded.</p>\n<p><em>Why the others were considered incorrect (2015 framing):</em> Option 1 (BMI &gt;30) fell below the classic threshold except in narrow trial contexts. Option 2 as transcribed (&quot;BMI &gt;35&quot;) is incomplete without the required comorbidity. Option 4 (&quot;obesity and type 2 diabetes&quot;) does not specify a qualifying BMI.</p>\n<p><em>Note --- this item is outdated:</em> The 2022 ASMBS/IFSO guidelines now recommend metabolic/bariatric surgery for BMI \u226535 regardless of comorbidity, and consider it for BMI 30--34.9 with metabolic disease (e.g., type 2 diabetes), with lower thresholds for Asian populations (Elmaleh-Sachs et al., JAMA, 2023; Kermansaravi et al., Scientific Reports, 2024). Under current criteria, options 1 and 4 would also be defensible, so the &quot;single best answer&quot; no longer holds.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":87,"stem":"A trauma patient comes into the ER. They have a right pubic ramus fracture and there is obvious blood/hematuria coming from the penis. What is the next step:","options":[{"letter":"1","text":"CT KUB."},{"letter":"2","text":"Cystoscopy and retrograde uretherogram."},{"letter":"3","text":"Cystoscopy alone."},{"letter":"4","text":"CT urogram with delayed images to assess collecting system and bladder."}],"correct":"2","explanation":"<p><em>Why retrograde urethrogram is correct:</em> Blood at the urethral meatus with a pelvic (pubic ramus) fracture is the classic presentation of urethral injury. The AUA Urotrauma Guideline states clinicians <em>should</em> perform retrograde urethrography in patients with blood at the meatus after pelvic trauma, and that blind catheter passage before RUG should be avoided (AUA, 2020). The WSES-AAST guideline concurs: RUG is the procedure of choice and should be performed <em>before</em> any other genitourinary maneuver (Coccolini et al., World Journal of Emergency Surgery, 2019). Among the listed options, option 2 is the one that includes retrograde urethrography.</p>\n<p><em>Why the original answer (option 4, CT urogram) is incorrect:</em> Urethral injury cannot be diagnosed or excluded by CT urogram --- the urethra is not opacified by intravenous contrast on delayed images, and CT is used to evaluate the kidneys, ureters, and bladder, not the urethra. Delaying dedicated urethral imaging risks converting a partial to a complete disruption if a catheter is passed blindly.</p>\n<p><em>Why the other options are incorrect:</em> CT KUB (option 1) evaluates the upper tracts and stones, not the urethra. Cystoscopy alone (option 3) requires instrumenting the urethra, which is exactly what should be deferred until RUG defines the injury (flexible cystoscopy is an alternative diagnostic modality in selected/penile injuries but is not &quot;alone&quot; the first step over RUG in this classic pelvic-fracture presentation).</p>\n<p><em>Caveat on option wording:</em> The best pure answer would be &quot;retrograde urethrogram first.&quot; Option 2 pairs it with cystoscopy, but it is the only choice containing the guideline-mandated first step, and is clearly preferable to the CT urogram originally selected.</p>\n<p><em>Background:</em> On RUG, contrast extravasation with bladder filling indicates a partial (incomplete) injury; extravasation without bladder filling indicates a complete disruption. If bladder drainage is urgently needed and RUG is not immediately available, a single gentle catheter attempt by an experienced provider, or a suprapubic catheter, is appropriate.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":88,"stem":"Trauma patient comes in with open distal tibia fracture with large soft tissue defect after ORIF. What is the best definitive coverage option for this injury?","options":[{"letter":"1","text":"STSG directly onto periosteum (distal tibia; can be done over intact periosteum)."},{"letter":"2","text":"FTSG."},{"letter":"3","text":"VAC dressing."},{"letter":"4","text":"Muscle flap (1st third Gastros, 2nd third soleus)."}],"correct":"4","explanation":"<p><em>Why a muscle flap is correct:</em> A large soft tissue defect over an open tibia with exposed bone/hardware requires vascularized flap coverage to create a barrier against infection and support bone healing. Skin grafts will not survive over exposed cortical bone denuded of periosteum (Chan et al., Cochrane, 2022; Shafiq et al., JAAOS, 2021). Coverage within ~72 hours of fixation reduces deep infection.</p>\n<p><em>Why the others are incorrect:</em> STSG (option 1) and FTSG (option 2) require a vascularized bed and fail over bare cortex or hardware --- a graft directly onto exposed distal tibial bone is not definitive coverage. VAC/NPWT (option 3) is a valuable temporizing dressing and bridge to reconstruction, but it is not definitive soft tissue coverage.</p>\n<p><em>Background:</em> The classic reconstructive teaching by tibial third --- gastrocnemius for the proximal third, soleus for the middle third, and free tissue transfer (or local fasciocutaneous flaps) for the distal third --- reflects the limited local muscle available distally. The &quot;muscle flap&quot; answer is correct against the alternatives; note that a distal-third defect specifically often needs a free flap rather than a local muscle flap.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":89,"stem":"What cancer have we had great success with treating prior to its development in asymptomatic individuals that are at risk of developing the cancer due to family history?","options":[{"letter":"1","text":"Breast."},{"letter":"2","text":"Lung."},{"letter":"3","text":"Thyroid."},{"letter":"4","text":"Melanoma."}],"correct":"1","explanation":"<p><em>Why breast is correct:</em> In BRCA1/2 pathogenic variant carriers and those with a compelling family history, risk-reducing bilateral mastectomy reduces breast cancer incidence by roughly 90--95%, and is offered as a preventive option in asymptomatic high-risk women (ASCO/ASTRO/SSO, 2020; ACOG Practice Bulletin, 2017; Jatoi &amp; Kemp, JAMA, 2021). This is the paradigm of prophylactic cancer surgery in an at-risk, asymptomatic, family-history-driven population.</p>\n<p><em>Why the others are incorrect:</em> There is no established prophylactic surgical prevention for lung cancer or melanoma in asymptomatic at-risk individuals; prevention relies on risk-factor modification and surveillance. Prophylactic thyroidectomy does exist but for a specific germline setting (RET/MEN2 medullary thyroid cancer), not the general family-history breast paradigm the question describes; among these four options, breast is the intended and best answer.</p>\n<p><em>Background:</em> Risk-reducing salpingo-oophorectomy similarly reduces ovarian (and breast) cancer risk in BRCA carriers, and a 2026 meta-analysis suggests an overall survival benefit with risk-reducing bilateral mastectomy (O&#x27;Reilly et al., JAMA Surgery, 2026).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":90,"stem":"What is a primary principle of oncologic surgery?","options":[{"letter":"1","text":"Follow up treatment with adjuvant chemotherapy and radiotherapy."},{"letter":"2","text":"Resection after tissue diagnosis is confirmed ie. biopsy."},{"letter":"3","text":"Pretreatment with neoadjuvant chemotherapy then total resection."},{"letter":"4","text":"Resection of the entire oncologic mass with negative resection margins."}],"correct":"2","explanation":"<p><em>Why tissue diagnosis before resection is correct:</em> Obtaining a histologic diagnosis before definitive resection is a foundational oncologic principle --- it confirms malignancy, guides the extent of resection, and prevents inappropriate radical surgery for benign or non-surgical (e.g., lymphoma) disease.</p>\n<p><em>Why the others are less correct:</em> Adjuvant therapy (option 1) and neoadjuvant therapy (option 3) are adjuncts applied to specific tumor types and stages, not universal primary principles of the surgery itself.</p>\n<p><em>Note:</em> Option 4 --- complete resection with negative (R0) margins --- is equally a cardinal principle of curative oncologic surgery, which makes this a genuinely ambiguous single-best-answer item. The marked answer is defensible because tissue diagnosis logically precedes and governs the decision to resect, but option 4 would also be a correct statement of oncologic surgical principle.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":91,"stem":"What is the most common form of transport for CO2?","options":[{"letter":"1","text":"Bound to hemoglobin."},{"letter":"2","text":"Dissolved in blood."},{"letter":"3","text":"As carbonic acid (Carbonic acid is unstable, converts to HCO3 +H, this buffering system is the most common form of transport) -- the reaction happens in the RBCs."},{"letter":"4","text":"Bound to albumin."}],"correct":"3","explanation":"<p><strong>Why 3 is correct:</strong> CO\u2082 diffuses into red blood cells, where carbonic anhydrase catalyzes its hydration to carbonic acid (H\u2082CO\u2083), which dissociates to HCO\u2083\u207b and H\u207a. Bicarbonate then exits the RBC in exchange for chloride (the chloride shift / Hamburger effect). Transport as bicarbonate accounts for roughly 70--90% of total CO\u2082 carriage in blood --- by far the dominant form (Ltaief et al., Critical Care, 2021; Hsia, New England Journal of Medicine, 1998). The original key&#x27;s answer choice, while awkwardly worded (&quot;as carbonic acid&quot;), correctly identifies the carbonic acid/bicarbonate buffering system as the mechanism.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1 (bound to hemoglobin):</strong> Carbaminohemoglobin accounts for only ~10% of CO\u2082 transport.</p>\n\n<p><strong>2 (dissolved in blood):</strong> Dissolved CO\u2082 (measured as PaCO\u2082) represents only ~5--10%.</p>\n\n<p><strong>4 (bound to albumin):</strong> Binding to plasma proteins carries only a very small fraction of CO\u2082.</p>\n<p><strong>Background:</strong> The Haldane effect describes how deoxygenated hemoglobin increases CO\u2082 uptake (as both bicarbonate and carbaminohemoglobin), optimizing CO\u2082 loading in tissues and unloading in the lungs.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":92,"stem":"What is the most common cause of death in the surgical ICU?","options":[{"letter":"1","text":"Multiple organ dysfunction syndrome (MODS)."},{"letter":"2","text":"Pneumonia."},{"letter":"3","text":"Sepsis."},{"letter":"4","text":"Cardiovascular complications."}],"correct":"1","explanation":"<p><strong>Why 1 is correct:</strong> In a large prospective study of 3,700 predominantly surgical critically ill patients, acute refractory MODS was the single most frequent cause of death in the ICU, accounting for 47% of deaths (Mayr et al., Critical Care, 2006). MODS represents the common final pathway of critical illness, frequently precipitated by sepsis but also by trauma, shock, and major surgery.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>2 (pneumonia):</strong> A common ICU infection and contributor to mortality, but not the leading direct cause of death.</p>\n\n<p><strong>3 (sepsis):</strong> Sepsis is the most common trigger leading to MODS, but death is ultimately attributed to the resulting organ dysfunction; in this classic surgical ICU dataset MODS predominated as the cause of death. (Note: some series that classify by immediate cause list sepsis highest --- the distinction is whether sepsis or the organ failure it produces is coded as the terminal event.)</p>\n\n<p><strong>4 (cardiovascular complications):</strong> Cardiovascular failure was an important risk factor for death but not the most frequent cause in the surgical ICU population.</p>\n<p><strong>Background:</strong> MODS is defined as progressive, potentially reversible physiologic dysfunction in two or more organ systems. Severity scores (SOFA, APACHE II) track the organ dysfunction that drives mortality.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":93,"stem":"What has been found to be the best way to reduce surgical site infection in areas of the body with hair?","options":[{"letter":"1","text":"Ask the patient to shave the area with a razor the night before surgery."},{"letter":"2","text":"Shave the patient in the OR with a razor before surgery."},{"letter":"3","text":"Trim the area with clippers before surgery."},{"letter":"4","text":"Leave the hairy area intact."}],"correct":"3","explanation":"<p><strong>Why 3 is correct:</strong> When hair removal is necessary, clipping is preferred because it avoids the microscopic skin trauma caused by razors. A meta-analysis of randomized trials found razor shaving carried a significantly higher SSI rate than clipping (4.4% vs 2.5%; RR 1.64), and WHO strongly recommends that if hair must be removed, it be done with clippers only, shortly before surgery, never with a razor (Seidelman et al., JAMA, 2023; Allegranzi et al., Lancet Infectious Diseases, 2016; Tanner &amp; Melen, Cochrane, 2021).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1 and 2 (razor shaving, night before or in OR):</strong> Razor shaving increases SSI risk; shaving the night before is worst, as microscopic cuts allow overnight bacterial colonization.</p>\n\n<p><strong>4 (leave intact):</strong> Not removing hair is also acceptable and equivalent to clipping for SSI risk, but the question asks the best approach when hair removal is needed for the operative field; among the listed options, clipping is the evidence-based answer. Note that &quot;no removal&quot; and clipping carry statistically similar SSI rates, so option 4 is defensible on infection grounds --- but clipping (option 3) is the standard when exposure/marking requires hair removal.</p>\n<p><strong>Background:</strong> If clipping is done, it should occur in the preoperative holding area rather than the OR to reduce contamination from loose hair.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":94,"stem":"What happens if a tracheostomy is inserted through the 1st tracheal ring (increased risk of what?)","options":[{"letter":"1","text":"Subglottic stenosis."},{"letter":"2","text":"Tracheoinnominate fistula."},{"letter":"3","text":"Vocal cord paralysis."},{"letter":"4","text":"No complication."}],"correct":"1","explanation":"<p><strong>Why 1 is correct:</strong> A tracheostomy placed too high --- through the first tracheal ring or involving the cricoid cartilage --- damages the subglottic airway and markedly increases the risk of subglottic/laryngotracheal stenosis. Complication rates rise significantly when tracheostomies are located over the first three to four tracheal rings compared with placement below the third ring (Fiedler et al., European Archives of Oto-Rhino-Laryngology, 2022). The recommended entry point is between the second and third tracheal rings.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>2 (tracheoinnominate fistula):</strong> This catastrophic complication is caused by placement too LOW (below the 4th--5th ring) or an overinflated cuff/malpositioned tip eroding into the innominate artery --- the opposite direction of error.</p>\n\n<p><strong>3 (vocal cord paralysis):</strong> Relates to recurrent laryngeal nerve injury, not tracheostomy ring level.</p>\n\n<p><strong>4 (no complication):</strong> Incorrect; high placement is a well-recognized cause of stenosis.</p>\n<p><strong>Background:</strong> The cricoid cartilage is the only complete cartilaginous ring in the airway and the narrowest point in adults/children; injuring it or the immediately adjacent first ring compromises this critical zone.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":95,"stem":"What substance does a PET scan detect?","options":[{"letter":"1","text":"Gadolinium."},{"letter":"2","text":"Technetium."},{"letter":"3","text":"Fluorodeoxyglucose."},{"letter":"4","text":"Dipyrimadole."}],"correct":"3","explanation":"<p><strong>Why 3 is correct:</strong> The most widely used PET radiotracer is \u00b9\u2078F-fluorodeoxyglucose (\u00b9\u2078F-FDG), a glucose analogue that is taken up by metabolically active cells via glucose transporters and phosphorylated by hexokinase, trapping it intracellularly. Regions of hypermetabolism (e.g., malignant tumors) show increased FDG uptake. FDG-PET is FDA-approved and constitutes the majority of clinical PET workload, especially in oncology (Hussain et al., BioMed Research International, 2022; Morris &amp; Perkins, Lancet, 2012; McAteer et al., BMC Medicine, 2025).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1 (gadolinium):</strong> An MRI contrast agent, not a PET tracer.</p>\n\n<p><strong>2 (technetium):</strong> \u2079\u2079\u1d50Tc is a SPECT (single-photon) radiotracer, not a positron emitter.</p>\n\n<p><strong>4 (dipyridamole):</strong> A pharmacologic vasodilator stress agent, not an imaging tracer.</p>\n<p><strong>Background:</strong> PET detects paired 511-keV gamma photons produced when a positron (from \u00b9\u2078F, \u00b9\u00b9C, \u00b9\u00b3N, or \u00b9\u2075O) annihilates with an electron.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":96,"stem":"What substance is most commonly used for cardiac stress tests?","options":[{"letter":"1","text":"Technetium 99 (Cardiolite\u00a9)."},{"letter":"2","text":"Thallium."},{"letter":"3","text":"Dipyrimadole (Persantine\u00a9)."},{"letter":"4","text":"Iodine."}],"correct":"3","explanation":"<p><strong>Why 3 is correct (with an update note):</strong> Among the options, dipyridamole is the only pharmacologic stress agent. Vasodilator agents (dipyridamole, adenosine, regadenoson) are the preferred method to stress the heart in patients who cannot exercise for myocardial perfusion imaging (ACR Practice Parameter for Cardiac Scintigraphy, 2024). Technetium and thallium are the perfusion RADIOTRACERS that image the stress result --- they are not the &quot;stress&quot; agent itself. So for a question specifically about the stress substance, dipyridamole is the best answer.</p>\n<p><strong>Note --- disagreement/update with the original key&#x27;s era:</strong> The original key marked dipyridamole, which is defensible, but this is now outdated. Regadenoson, a selective A\u2082A adenosine receptor agonist given as a fixed 0.4-mg bolus, has become the most commonly used pharmacologic cardiac stress agent in the United States (ACR Cardiac PET/CT Practice Parameter, 2023). If the question is instead interpreted as asking for the most common radiotracer, \u2079\u2079\u1d50Tc (option 1) would be correct, since technetium-based agents are the most commonly used perfusion tracers and thallium-201 is now largely avoided due to higher radiation exposure. The item is ambiguous between &quot;stress agent&quot; and &quot;radiotracer.&quot;</p>\n<p><strong>Why the others are incorrect (as a &quot;stress agent&quot;):</strong></p>\n<p><strong>1 (technetium) and 2 (thallium):</strong> Radiotracers for imaging perfusion, not stressors.</p>\n\n<p><strong>4 (iodine):</strong> Used in CT contrast and thyroid imaging, not cardiac stress testing.</p>\n<p><strong>Background:</strong> Vasodilators induce coronary flow heterogeneity (steal) rather than raising myocardial oxygen demand; dobutamine is the alternative when vasodilators are contraindicated (e.g., severe bronchospasm).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":97,"stem":"Release of adrenocorticotropin hormone (ACTH) occurs from where?","options":[{"letter":"1","text":"Hypothalamus."},{"letter":"2","text":"Anterior pituitary."},{"letter":"3","text":"Posterior pituitary."},{"letter":"4","text":"Adrenal gland."}],"correct":"2","explanation":"<p><strong>Why 2 is correct:</strong> ACTH is synthesized and secreted by corticotroph cells of the anterior pituitary. It is cleaved from the precursor pro-opiomelanocortin (POMC) in response to hypothalamic CRH, and it stimulates cortisol production by the adrenal cortex (Miller &amp; Auchus, JAMA Surgery, 2020; Karaca et al., Reviews in Endocrine &amp; Metabolic Disorders, 2021).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1 (hypothalamus):</strong> Produces corticotropin-releasing hormone (CRH), the upstream stimulus for ACTH --- not ACTH itself.</p>\n\n<p><strong>3 (posterior pituitary):</strong> Releases oxytocin and antidiuretic hormone (ADH/vasopressin), which are synthesized in the hypothalamus.</p>\n\n<p><strong>4 (adrenal gland):</strong> The target of ACTH; it produces cortisol, not ACTH.</p>\n<p><strong>Background:</strong> The hypothalamic-pituitary-adrenal (HPA) axis: CRH (hypothalamus) \u2192 ACTH (anterior pituitary) \u2192 cortisol (adrenal cortex), with cortisol providing negative feedback.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":98,"stem":"What is the most common extracellular cation?","options":[{"letter":"1","text":"Sodium."},{"letter":"2","text":"Potassium (intracellular)."},{"letter":"3","text":"Chloride (anion)."},{"letter":"4","text":"Bicarbonate (anion)."}],"correct":"1","explanation":"<p><strong>Why 1 is correct:</strong> Sodium is the principal cation and osmotic agent of the extracellular fluid, with a normal concentration of ~135--145 mmol/L (vs ~10--12 mmol/L intracellularly). It accounts for ~90% of extracellular osmolality and governs ECF volume and blood pressure (Qiao et al., Nature Communications, 2025; Strazzullo &amp; Abate, Advances in Nutrition, 2025).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>2 (potassium):</strong> The most abundant INTRAcellular cation (~98% of total body potassium is intracellular).</p>\n\n<p><strong>3 (chloride):</strong> The most abundant extracellular ANION, not a cation.</p>\n\n<p><strong>4 (bicarbonate):</strong> An anion, not a cation.</p>\n<p><strong>Background:</strong> The Na\u207a/K\u207a-ATPase pump maintains the transmembrane sodium and potassium gradients essential for resting membrane potential and secondary active transport.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":99,"stem":"You are seeing a patient in your office with a confirmed diagnosis of rectal cancer with a large mass 2 cm from the anal verge. You plan to initiate treatment before definitive surgical resection. What is this form of treatment called?","options":[{"letter":"1","text":"Adjuvant theapy."},{"letter":"2","text":"Neoadjuvant therapy."},{"letter":"3","text":"Debulking."},{"letter":"4","text":"Cytoreduction."}],"correct":"2","explanation":"<p><strong>Why 2 is correct:</strong> Neoadjuvant therapy is treatment (chemotherapy, radiotherapy, or chemoradiotherapy) given BEFORE definitive surgical resection. For clinical stage II/III rectal cancer, neoadjuvant long-course chemoradiotherapy (or short-course radiotherapy, or total neoadjuvant therapy) is standard to downstage the tumor, improve local control, and facilitate sphincter preservation --- especially relevant for a very low tumor 2 cm from the anal verge (You et al., ASCRS Clinical Practice Guidelines, 2020; Keller et al., Nature Reviews Gastroenterology &amp; Hepatology, 2020).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1 (adjuvant therapy):</strong> Treatment given AFTER the primary surgical resection.</p>\n\n<p><strong>3 (debulking):</strong> Surgical removal of as much tumor as possible when complete resection isn&#x27;t feasible --- a surgical, not pre-surgical medical, concept.</p>\n\n<p><strong>4 (cytoreduction):</strong> Similar surgical concept (reducing tumor burden, often with intraperitoneal disease), not preoperative therapy.</p>\n<p><strong>Background:</strong> For low rectal tumors near the anal verge, neoadjuvant therapy can enable sphincter-sparing surgery and, in complete clinical responders, a &quot;watch-and-wait&quot; nonoperative approach at experienced centers.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":100,"stem":"While inserting a central venous line in the right internal jugular you observe a large air embolism. What do you [do] as your initial management?","options":[{"letter":"1","text":"Trendelenburg & L lateral decubitus positioning."},{"letter":"2","text":"Allow blood to trickle out of vein."},{"letter":"3","text":"Sit the patient 90 degrees upright."},{"letter":"4","text":"Early sign is increased CO2."}],"correct":"1","explanation":"<p><strong>Why 1 is correct:</strong> The immediate maneuver for venous air embolism is the Durant maneuver --- placing the patient in Trendelenburg (head-down) with a left lateral decubitus tilt. This traps air in the apex of the right ventricle, away from the right ventricular outflow tract and pulmonary artery, relieving the airlock obstruction. Administer 100% oxygen and, if a catheter is in the heart, attempt to aspirate the air (McGee &amp; Gould, New England Journal of Medicine, 2003; Maddukuri et al., Echocardiography, 2006; Milford et al., Pediatric Surgery International, 2020).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>2 (allow blood to trickle out):</strong> Does nothing to relieve the intracardiac airlock and wastes critical time.</p>\n\n<p><strong>3 (sit upright 90\u00b0):</strong> Worsens the situation for VENOUS air embolism by promoting air migration into the RV outflow tract/pulmonary circulation. (Upright positioning is used intraoperatively in some neurosurgical contexts to reduce venous air entry, but is not the rescue maneuver once embolism occurs.)</p>\n\n<p><strong>4 (increased CO\u2082):</strong> A distractor phrased as a fact rather than a management step; end-tidal CO\u2082 actually DECREASES with significant pulmonary air embolism, and end-tidal CO\u2082 has low sensitivity compared with echocardiography/precordial Doppler.</p>\n<p><strong>Background:</strong> Prevention is key: keep the patient in Trendelenburg during IJ/subclavian insertion and removal, occlude catheter hubs at all times, and use the Valsalva maneuver or positive inspiratory pressure during high-risk steps.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":101,"stem":"What percentage lies within 2 standard deviations of the mean?","options":[{"letter":"1","text":"68%."},{"letter":"2","text":"95%."},{"letter":"3","text":"99.7%."},{"letter":"4","text":"50%."}],"correct":"2","explanation":"<p>Why 95% is correct: For a normal (Gaussian) distribution, the empirical (68--95--99.7) rule states that ~95% of values fall within 2 standard deviations of the mean (more precisely 95.4%). This underpins the conventional 95% confidence interval, which spans roughly \u00b11.96 SD.</p>\n<p>Why the others are incorrect:</p>\n<p>68% is the proportion within 1 SD of the mean, not 2.</p>\n\n<p>99.7% is the proportion within 3 SD of the mean.</p>\n\n<p>50% corresponds to the interquartile-type split around the median (\u00b10.674 SD), not a whole-number SD multiple.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":102,"stem":"Regarding LMWH, which is true:","options":[{"letter":"1","text":"Its use is safe in patients who have had HIT."},{"letter":"2","text":"Causes less bleeding than unfractionated heparin."},{"letter":"3","text":"Works by inhibiting antithrombin III activity."},{"letter":"4","text":"Works by potentiating antithrombin III activity."}],"correct":"4","explanation":"<p>Note of disagreement with the original key, which highlighted both option 2 and option 4. This is a flawed item with two defensible true statements; option 4 is the single unambiguously correct choice.</p>\n<p>Why potentiating antithrombin III is correct: LMWH, like unfractionated heparin, is an indirect anticoagulant. It binds antithrombin (formerly antithrombin III) through a specific pentasaccharide sequence and accelerates antithrombin-mediated inhibition of coagulation factors. Because most LMWH chains are too short (&lt;18 saccharide units) to bridge antithrombin to thrombin, LMWH preferentially catalyzes inhibition of factor Xa, giving an anti-Xa:anti-IIa ratio of roughly 2:1 to 4:1 (versus 1:1 for unfractionated heparin) (Levy and Connors, NEJM, 2021; Garcia et al., ACCP, Chest, 2012; Nutescu et al., J Thromb Thrombolysis, 2016).</p>\n<p>Why the others are incorrect:</p>\n<p>Safe in prior HIT: incorrect. Because of concern for cross-reactivity of HIT antibodies with LMWH, patients with HIT should not be switched to LMWH (Jacobs, JAGS, 2003).</p>\n\n<p>Inhibiting antithrombin III activity: incorrect and the opposite of the true mechanism --- LMWH potentiates (enhances) antithrombin activity, it does not inhibit it.</p>\n\n<p>Causes less bleeding than UFH (option 2): partly supported but not a clean answer. A Cochrane review of VTE treatment found fewer bleeding events with fixed-dose LMWH than adjusted-dose UFH (Robertson and Jones, Cochrane, 2017), and LMWH has a more predictable dose response. However, the ACCP guideline states there is no evidence that the differing anti-Xa:anti-IIa ratios translate into consistent differences in bleeding, so &quot;less bleeding&quot; is context-dependent rather than a definitional truth. Option 4 is therefore the better single best answer.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":103,"stem":"A patient takes daily ASA. They require an elective surgical procedure. What is the best plan regarding stopping this medication?","options":[{"letter":"1","text":"Continue taking it and operate."},{"letter":"2","text":"Stop taking it the night before surgery."},{"letter":"3","text":"Stop taking it 5 days before surgery."},{"letter":"4","text":"Stop taking it 7 days before surgery."}],"correct":"4","explanation":"<p>Note: correct under classic teaching but partially outdated by current guidance.</p>\n<p>Why 7 days is the best listed option: The classic rationale is that aspirin irreversibly acetylates platelet cyclooxygenase for the platelet&#x27;s ~7--10 day lifespan, so ~7 days allows a substantial cohort of new, functional platelets to circulate. Among the four options, only 7 days reflects this pharmacology.</p>\n<p>Why the others are less correct:</p>\n<p>Continue and operate: for many procedures this is actually now preferred (see note), but as a blanket rule it does not fit older exam framing for procedures with meaningful bleeding risk.</p>\n\n<p>Night before: far too short --- negligible recovery of platelet function.</p>\n\n<p>5 days: this is the standard interval for clopidogrel, not aspirin.</p>\n<p>Important update: Current guidance no longer treats routine 7-day aspirin cessation as the default. The 2022 ACCP guideline suggests continuing aspirin through most non-cardiac surgery, and when interruption is required (e.g., intracranial or spinal surgery) stopping it \u22647 days beforehand; the POISE-2 trial found no net benefit and increased bleeding from perioperative aspirin manipulation in many patients (Douketis et al., ACCP, Chest, 2022). The 2024 ACC/AHA perioperative guideline lists an aspirin interruption interval of ~4 days (Thompson et al., Circulation/JACC, 2024). The exam&#x27;s &quot;7 days&quot; answer is defensible for the era but should be read against these updates.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":104,"stem":"A patient with renal failure is on TPN. They require adjustment of their TPN prescription. What would you decrease in their formula?","options":[{"letter":"1","text":"Lipids."},{"letter":"2","text":"Magnesium."},{"letter":"3","text":"Calcium."},{"letter":"4","text":"Acetate."}],"correct":"2","explanation":"<p>Why magnesium is correct: Magnesium is renally excreted and accumulates in renal failure, so magnesium (along with potassium and phosphate) should be reduced or closely restricted in TPN for patients with impaired renal clearance to avoid hypermagnesemia.</p>\n<p>Why the others are incorrect:</p>\n<p>Lipids: an energy source not primarily governed by renal clearance; no routine reduction is required for renal failure alone.</p>\n\n<p>Calcium: patients with renal failure tend toward hypocalcemia (impaired 1,25-vitamin D activation and hyperphosphatemia), so calcium is generally not decreased.</p>\n\n<p>Acetate: acetate is metabolized to bicarbonate and is often increased, not decreased, to help buffer the metabolic acidosis of renal failure.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":105,"stem":"When considering surgery in a pregnant individual what do you need to be aware of?","options":[{"letter":"1","text":"The fetus has entered the pelvis as of the 3rd trimester."},{"letter":"2","text":"The fundus is at the umbilicus at 20 weeks."},{"letter":"3","text":"They should be positioned directly on their back."},{"letter":"4","text":"The fundus is at the costophrenic angle at 24 weeks."}],"correct":"2","explanation":"<p>Why this is correct: The uterine fundus reaches the umbilicus at approximately 20 weeks&#x27; gestation, a standard landmark; before ~12 weeks it is a pelvic organ, and fundal height in centimeters roughly approximates gestational age in weeks between ~20 and 36 weeks.</p>\n<p>Why the others are incorrect:</p>\n<p>Fetal engagement into the pelvis is a late third-trimester/term event (fetal head, not a general &quot;as of the 3rd trimester&quot; rule).</p>\n\n<p>Supine positioning is specifically to be avoided after ~20 weeks because the gravid uterus compresses the inferior vena cava and aorta (aortocaval compression), reducing venous return; left lateral tilt is used instead.</p>\n\n<p>The fundus does not reach the costophrenic angle; near term it reaches the costal margin/xiphoid (~36 weeks), not at 24 weeks.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":106,"stem":"If you wanted to study the effects of surgical sponges left in patients following surgery what type of trial/study would be the best option?","options":[{"letter":"1","text":"Multi-centre, double blinded, randomized controlled trial."},{"letter":"2","text":"Non-blinded RCT."},{"letter":"3","text":"Prospective cohort study."},{"letter":"4","text":"Retrospective case series."}],"correct":"4","explanation":"<p>Why a retrospective case series is correct: Retained surgical items are rare, unintended events. It is unethical and impossible to randomize patients to have sponges left inside them, so prospective/randomized designs cannot be used. The events are best studied by retrospectively assembling the cases that have occurred --- a case series (or case reports) is the appropriate and highest feasible level of evidence for rare, unplanned occurrences (Frieden, NEJM, 2017; Taha and Abuawwad, Syst Rev, 2025).</p>\n<p>Why the others are incorrect:</p>\n<p>A blinded or non-blinded RCT would require deliberately leaving sponges in patients --- ethically prohibited and infeasible.</p>\n\n<p>A prospective cohort would require anticipating and following exposed patients, but the exposure is unpredictable and rare, making prospective accrual impractical.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":107,"stem":"Which of the following is most suggestive of an incomplete spinal cord injury?","options":[{"letter":"1","text":"Preserved perianal sensation."},{"letter":"2","text":"Presence of bulbocavernous reflex."},{"letter":"3","text":"Deep tendon reflexes below the level of injury."},{"letter":"4","text":"Absent anal sphincter function."}],"correct":"1","explanation":"<p>Why preserved perianal sensation is correct: Completeness is defined by &quot;sacral sparing.&quot; An injury is incomplete when there is preserved sensory or motor function in the lowest sacral segments (S4--S5) --- light touch or pinprick at the perianal region, deep anal pressure, or voluntary anal contraction. Preserved perianal sensation is the hallmark of an ASIA-incomplete lesion (Rupp et al., ASIA ISNCSCI 2019, 2021; Ahuja et al., Nat Rev Dis Primers, 2017; Chiles and Cooper, NEJM, 1996).</p>\n<p>Why the others are incorrect:</p>\n<p>Bulbocavernosus reflex: its return signals the end of spinal shock (validating that the neurological exam is now reliable), not the completeness of the injury; it can be present in complete injuries.</p>\n\n<p>Deep tendon reflexes below the level of injury: reflect resolution of spinal shock and upper motor neuron patterning, not sacral sparing, and can occur in complete injuries.</p>\n\n<p>Absent anal sphincter function: absence of voluntary anal contraction indicates loss of sacral motor function, consistent with a complete injury --- the opposite of incompleteness.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":108,"stem":"A young patient arrives in the trauma bay after an MVC. He is hypotensive with a normal heart rate. Which is likely contributing to his physiologic presentation?","options":[{"letter":"1","text":"Blood loss."},{"letter":"2","text":"Spine injury."},{"letter":"3","text":"Intra-abdominal injury."},{"letter":"4","text":"Head injury."}],"correct":"2","explanation":"<p>Why spine injury is correct: Hypotension with a normal (or slow) heart rate suggests neurogenic shock from a cervical or high-thoracic (\u2265T6) spinal cord injury. Loss of descending sympathetic outflow with unopposed vagal tone causes vasodilation and loss of the expected compensatory tachycardia, producing hypotension with bradycardia or an inappropriately normal heart rate, warm extremities, and a wide pulse pressure (Ahuja et al., Nat Rev Dis Primers, 2017; Sweis and Biller, Curr Neurol Neurosci Rep, 2017).</p>\n<p>Why the others are incorrect:</p>\n<p>Blood loss (hemorrhagic shock): the expected response is tachycardia with hypotension; a normal heart rate argues against pure hypovolemia as the sole explanation (though hemorrhage must still be actively excluded).</p>\n\n<p>Intra-abdominal injury: causes shock via hemorrhage, which would again typically produce tachycardia.</p>\n\n<p>Head injury: isolated brain injury does not cause hypotension in adults (except as a terminal/Cushing event); hypotension after trauma should never be attributed to the head injury alone.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":109,"stem":"Which one of the following is NOT one of the four principles of medical ethics?","options":[{"letter":"1","text":"Autonomy."},{"letter":"2","text":"Beneficence."},{"letter":"3","text":"Trustworthiness."},{"letter":"4","text":"Non-maleficence."}],"correct":"3","explanation":"<p>Why trustworthiness is correct (as the answer to &quot;NOT a principle&quot;): The four classic Beauchamp and Childress principles of biomedical ethics are respect for autonomy, beneficence, non-maleficence, and justice. Trustworthiness is not one of the four; justice is the fourth principle (Executive Committee et al., JACC, 2021; Levin, Headache, 2020; Elmer et al., AHA, 2025).</p>\n<p>Why the others are incorrect (they ARE principles):</p>\n<p>Autonomy: respect for the patient&#x27;s right to make informed, uncoerced choices.</p>\n\n<p>Beneficence: acting in the patient&#x27;s best interest / promoting good.</p>\n\n<p>Non-maleficence: the duty to do no harm.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":110,"stem":"What is the best study you could do for a condition considered a rare diagnosis?","options":[{"letter":"1","text":"RCT."},{"letter":"2","text":"Cohort study."},{"letter":"3","text":"Cross sectional study."},{"letter":"4","text":"Case report."}],"correct":"4","explanation":"<p>Why case report is correct: For very rare conditions, small numbers and geographic dispersion make adequately powered RCTs, cohorts, and cross-sectional studies difficult or impossible. Case reports and case series provide the detailed descriptive evidence that is often the only feasible and most informative approach, and aggregating them can generate hypotheses and inform diagnosis and treatment (Frieden, NEJM, 2017; Taha and Abuawwad, Syst Rev, 2025).</p>\n<p>Why the others are less suitable:</p>\n<p>RCT: usually not feasible for rare diseases due to insufficient sample size (though novel adaptive, crossover, and n-of-1 designs are increasingly used).</p>\n\n<p>Cohort study: requires following an adequately sized exposed group over time --- hard to assemble for rare conditions.</p>\n\n<p>Cross-sectional study: estimates prevalence/associations at a point in time and is inefficient and low-yield for a rare diagnosis.</p>\n<p>Background reading:</p>\n<p>LMWH vs UFH mechanism and clinical differences: Levy and Connors, NEJM, 2021; ACCP parenteral anticoagulants guideline (Garcia et al., Chest, 2012).</p>\n\n<p>Perioperative antiplatelet management: ACCP 2022 (Douketis et al., Chest); 2024 ACC/AHA perioperative cardiovascular guideline (Thompson et al.).</p>\n\n<p>Spinal cord injury classification and neurogenic shock: ASIA ISNCSCI 2019 revision (Rupp et al., 2021); Ahuja et al., Nat Rev Dis Primers, 2017.</p>\n\n<p>Principles of biomedical ethics: Beauchamp and Childress framework as summarized in Levin, Headache, 2020.</p>\n\n<p>Study designs for rare diseases: Frieden, NEJM, 2017.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":111,"stem":"A patient with known intervertebral disc herniation and back pain presents with progression of their symptoms. Which of following is an indication for urgent surgical intervention?","options":[{"letter":"1","text":"Diminished deep tendon reflexes."},{"letter":"2","text":"Numbness on the dorsum of the foot."},{"letter":"3","text":"Bladder dysfunction."},{"letter":"4","text":"Severe back pain."}],"correct":"3","explanation":"<p><em>Why 3 is correct:</em> New bladder dysfunction --- typically painless urinary retention with overflow incontinence --- is the hallmark of cauda equina syndrome, a surgical emergency. Cauda equina compression produces flaccid lower-limb weakness, saddle anesthesia, and areflexic bowel/bladder, and urgent decompression is advised to preserve sphincter function (Rupp et al., <em>Topics in Spinal Cord Injury Rehabilitation</em>, 2021).</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>1. Diminished deep tendon reflexes</strong> and **2. numbness on the dorsum of the foot** are common radiculopathy findings (e.g., L5) that are managed non-operatively in the first instance.</p>\n\n<p><strong>4. Severe back pain</strong> alone, without a neurologic emergency, is not an indication for urgent surgery.</p>\n<p><em>Background:</em> Red-flag features mandating urgent imaging/decompression include urinary retention, saddle anesthesia, bilateral sciatica, and progressive motor deficit.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":112,"stem":"A patient on the ward recently arrived from PAR after a hemithyroidectomy. She develops increasing respiratory distress. She becomes stridorous. What should you do?","options":[{"letter":"1","text":"Take her to the CT scanner."},{"letter":"2","text":"Cut open sutures and evacuate hematoma at bedside."},{"letter":"3","text":"Treat with diphenhydramine and epi."},{"letter":"4","text":"Rush her to the OR."}],"correct":"2","explanation":"<p><em>Why 2 is correct:</em> Stridor and respiratory distress shortly after thyroidectomy indicate a compressive neck hematoma, a life-threatening airway emergency. When the airway is obstructed, immediate bedside opening of the wound to decompress the hematoma takes priority --- it can relieve airway compression and also facilitates subsequent intubation. Series and consensus guidance support emergent bedside clot evacuation for patients deteriorating in the recovery room (Dixon et al., <em>World Journal of Surgery</em>, 2014; ATA consensus, 2026). ATA guidance lists &quot;open wound if obstructed&quot; as an immediate airway maneuver, and notes that intubation, while protective, is secondary to decompressing the hematoma and may be very difficult once obstruction is established.</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>1. CT scanner</strong> dangerously delays treatment of an obvious clinical diagnosis.</p>\n\n<p><strong>3. Diphenhydramine and epinephrine</strong> treats angioedema/anaphylaxis, not a mechanical hematoma.</p>\n\n<p><strong>4. Rush to the OR</strong> wastes time when the airway is failing now; decompress at the bedside first, then proceed to the OR for formal evacuation and hemostasis.</p>\n<p><em>Background:</em> ~64--89% of post-thyroidectomy hematomas occur within 6--12 h; minimal dressings are recommended to allow early detection.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":113,"stem":"During a procedure to remove a renal mass you unexpectedly hit the bowel. There is gross fecal spillage into the abdomen as the bowel was not prepped. What should the wound be classified as?","options":[{"letter":"1","text":"Clean."},{"letter":"2","text":"Clean-contaminated."},{"letter":"3","text":"Contaminated."},{"letter":"4","text":"Dirty."}],"correct":"3","explanation":"<p><em>Why 3 is correct:</em> Under the CDC/HICPAC surgical wound classification, a Class III (contaminated) wound includes &quot;operations with major breaks in sterile technique or gross spillage from the gastrointestinal tract.&quot; Intraoperative gross fecal spillage into a previously non-infected field is the textbook example of a contaminated wound (Liu et al., Cochrane, 2018; HICPAC 1999).</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>1. Clean</strong> involves no entry into the alimentary/respiratory/GU tract and no inflammation.</p>\n\n<p><strong>2. Clean-contaminated</strong> is controlled entry into the GI/respiratory/GU tract without unusual contamination.</p>\n\n<p><strong>4. Dirty (Class IV)</strong> applies to old traumatic wounds with devitalized tissue or existing clinical infection/perforated viscera --- i.e., organisms present in the field before the operation. Here contamination occurred during the operation in a previously clean field, so it is contaminated, not dirty. (Some systems, e.g., GlobalSurg, classify established faecal peritonitis as dirty, but a fresh intraoperative spillage is Class III.)</p>\n<p><em>Background:</em> Wound class predicts SSI risk; large-bowel/contaminated cases carry ~10% SSI rates versus &lt;1--2% for clean cases.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":114,"stem":"A patient recently underwent a surgical procedure in the oral cavity. Shortly thereafter they developed increased swelling and pain in the lower jaw and upper neck. The swelling became very firm and even involved the tongue and floor of the mouth. The patient became increasingly tachypneic and stridorous. They had odynophagia and dysphagia. What is you management?","options":[{"letter":"1","text":"Attempt I&D and initiate IV antibiotics right away."},{"letter":"2","text":"Insert an endotracheal tube and take to the OR."},{"letter":"3","text":"Insert a nasotracheal tube and take to the OR."},{"letter":"4","text":"Treat with diphendydramine and epinephrine."}],"correct":"3","explanation":"<p><em>Why securing the airway first is correct:</em> This is Ludwig&#x27;s angina --- bilateral sublingual/submandibular cellulitis with posterior tongue displacement causing supraglottic obstruction. The standard of care is to secure the airway first, then perform incision and drainage; conservative management (antibiotics alone) carries a nearly 10-fold higher risk of airway compromise than early drainage (Eskander et al., <em>NEJM</em>, 2019). Because floor-of-mouth swelling and trismus make orotracheal laryngoscopy difficult, a nasal route is frequently favored, and awake fiberoptic nasotracheal intubation has a high success rate in deep neck infections (Ovassapian et al., <em>Anesthesia &amp; Analgesia</em>, 2005).</p>\n<p><em>Technique caveat:</em> The safest approach is an <strong>awake</strong> technique --- awake fiberoptic intubation (often nasotracheal) or awake tracheostomy under local anesthesia --- with surgical-airway backup immediately available. <strong>Blind</strong> nasotracheal intubation is hazardous in this setting and should be avoided; tracheostomy is recommended if fiberoptic intubation fails or is not feasible (Ovassapian et al., 2005; Wolfe et al., <em>Journal of Critical Care</em>, 2011).</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>1. I&amp;D + antibiotics without first securing the airway</strong> risks catastrophic obstruction during the procedure.</p>\n\n<p><strong>2. Endotracheal (orotracheal) tube</strong> is often not feasible because of trismus and floor-of-mouth swelling; the nasal/fiberoptic route or a surgical airway is preferred, which is why option 3 is the better of the two.</p>\n\n<p><strong>4. Diphenhydramine and epinephrine</strong> treats allergic angioedema, not a bacterial cellulitis.</p>\n<p><em>Background:</em> Overall mortality of Ludwig&#x27;s angina is ~8%; dental infection is the most common source.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":115,"stem":"A patient has been diagnosed with anterior cord syndrome. What function is preserved?","options":[{"letter":"1","text":"Vibration (+proprioception)."},{"letter":"2","text":"Temperature."},{"letter":"3","text":"Motor."},{"letter":"4","text":"Pain."}],"correct":"1","explanation":"<p><em>Why 1 is correct:</em> Anterior cord syndrome results from injury/ischemia of the anterior two-thirds of the cord (anterior spinal artery territory), damaging the corticospinal and spinothalamic tracts while sparing the dorsal columns. This produces loss of motor function, pain, and temperature below the lesion, with preserved light touch, vibration, and proprioception (Rupp et al., ASIA ISNCSCI 2019; Ahuja et al., <em>Nature Reviews Disease Primers</em>, 2017).</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>2. Temperature</strong> and <strong>4. pain</strong> travel in the spinothalamic tracts, which are damaged and therefore lost.</p>\n\n<p><strong>3. Motor</strong> function travels in the corticospinal tracts, which are also damaged and lost.</p>\n<p><em>Background:</em> Anterior cord syndrome carries the worst prognosis of the incomplete cord syndromes; a classic cause is aortic surgery/hypotension compromising the artery of Adamkiewicz.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":116,"stem":"An elderly gentleman falls down a flight of stairs. He is maintained in a cervical collar and a CT scan demonstrates chronic cervical spine degenerative change but no fractures or focal areas of malalignment or instability. Despite this he has motor weakness, primarily involving the upper myotomes with comparatively better function in the lower extremities. He has an intense burning pain in his hands? What is his diagnosis?","options":[{"letter":"1","text":"Brown-Sequard syndrome."},{"letter":"2","text":"Anterior cord syndrome."},{"letter":"3","text":"Central cord syndrome."},{"letter":"4","text":"Complete spinal cord injury."}],"correct":"3","explanation":"<p><em>Why 3 is correct:</em> This is the classic presentation --- an elderly patient with pre-existing cervical spondylosis sustaining a hyperextension injury (fall) without fracture, producing disproportionately greater weakness in the upper limbs than the lower limbs, often with dysesthetic burning in the hands. Central cord syndrome is the most common incomplete cord syndrome (Nowak et al., <em>JAAOS</em>, 2009; Ahuja et al., <em>Nature Reviews Disease Primers</em>, 2017).</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>1. Brown-S\u00e9quard syndrome</strong> (cord hemisection, usually penetrating trauma) causes ipsilateral motor/proprioception loss and contralateral pain/temperature loss.</p>\n\n<p><strong>2. Anterior cord syndrome</strong> causes loss of motor, pain, and temperature with preserved dorsal columns --- not selective upper-limb weakness.</p>\n\n<p><strong>4. Complete spinal cord injury</strong> has no sacral sparing and no preserved function below the level --- inconsistent with the relatively preserved lower limbs.</p>\n<p><em>Background:</em> The upper-limb-predominant pattern reflects the medial (cervical) location of the arm fibers in the corticospinal tract; management is initial blood-pressure support with surgical decompression selectively/early in appropriate patients.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":117,"stem":"A young male arrives in your trauma bay after a MVC rollover. After examining him he appears to have a significant spinal cord injury. There is no motor function below C7 and absent anal sensation and tone. He is hypotensive and bradycardic. Upon further assessment what may indicate when he is no longer in spinal shock?","options":[{"letter":"1","text":"Improved SBP."},{"letter":"2","text":"Return of bulbocavernosus reflex."},{"letter":"3","text":"Increased perianal sensation."},{"letter":"4","text":"Subtle gain of motor function."}],"correct":"2","explanation":"<p><em>Why 2 is correct:</em> The bulbocavernosus reflex (an S2--S4 reflex arc) is classically absent during spinal shock; its return signals resolution of spinal shock and allows accurate classification of the injury as complete or incomplete (Quadri et al., <em>Neurosurgical Review</em>, 2020; Ko et al., <em>Spinal Cord</em>, 1999).</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>1. Improved SBP</strong> relates to resolution of neurogenic shock (hemodynamic), which is distinct from spinal shock (reflex).</p>\n\n<p><strong>3. Increased perianal sensation</strong> and **4. subtle gain of motor function** indicate an incomplete injury and neurologic recovery, not specifically the end of spinal shock.</p>\n<p><em>Caveat:</em> Recent registry data (Mansoor Ali et al., <em>Journal of Neurotrauma</em>, 2023) found the bulbocavernosus reflex does not provide reliable prognostic value in acute SCI, though its return remains the traditional marker of the end of spinal shock.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":118,"stem":"What is the total blood volume in a 65kg male?","options":[{"letter":"1","text":"3.5L."},{"letter":"2","text":"4L."},{"letter":"3","text":"5.5L."},{"letter":"4","text":"7L."}],"correct":"3","explanation":"<p><em>Why 3 is the best choice:</em> Reference values for adult men are approximately 75--80 mL/kg (Oberholzer et al., <em>American Journal of Hematology</em>, 2024, report ~80 mL/kg in men). At 75--80 mL/kg, a 65-kg man has ~4.9--5.2 L, making 5.5 L the closest option. Even the classic ATLS estimate (~70 mL/kg, ~7% of body weight) yields ~4.55 L, which is above the 4 L option.</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>1. 3.5L</strong> (~54 mL/kg) and <strong>2. 4L</strong> (~62 mL/kg) underestimate.</p>\n\n<p><strong>4. 7L</strong> (~108 mL/kg) substantially overestimates.</p>\n<p><em>Background:</em> Blood volume correlates most strongly with lean body mass; the classic &quot;70 mL/kg (adult), 80 mL/kg (neonate)&quot; rules of thumb are approximations.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":119,"stem":"As a process, apoptosis involves:","options":[{"letter":"1","text":"Only mitochondria are involved."},{"letter":"2","text":"Creation of O2 free radical that destroy cellular components."},{"letter":"3","text":"A single gene and protein responsible for the process."},{"letter":"4","text":"Controlled degradation via a caspase cascade."}],"correct":"4","explanation":"<p><em>Why 4 is correct:</em> Apoptosis is programmed cell death executed by a cascade of cysteine-aspartate proteases (caspases). Initiator caspases (caspase-8 extrinsic, caspase-9 intrinsic) activate effector caspases (caspase-3/-7), which cleave cellular substrates producing the ordered morphological features of apoptosis (Kowalski et al., <em>Journal of Cellular Biochemistry</em>, 2023; Dho et al., <em>Experimental &amp; Molecular Medicine</em>, 2025).</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>1. Only mitochondria</strong> is wrong --- the mitochondria are central to the intrinsic pathway, but the extrinsic (death-receptor) pathway is mitochondria-independent at initiation.</p>\n\n<p><strong>2. O2 free radical destruction</strong> describes oxidative necrosis, not the regulated, non-inflammatory process of apoptosis.</p>\n\n<p><strong>3. A single gene/protein</strong> is incorrect --- apoptosis involves many genes and proteins (Bcl-2 family, Apaf-1, caspases, IAPs).</p>\n<p><em>Background:</em> Apoptosis is generally non-inflammatory and culminates in apoptotic bodies cleared by phagocytosis, distinguishing it from necrosis/pyroptosis.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":120,"stem":"Which of the following is a qualitative variable?","options":[{"letter":"1","text":"Nationality."},{"letter":"2","text":"Age."},{"letter":"3","text":"Height."},{"letter":"4","text":"Weight."}],"correct":"1","explanation":"<p><em>Why 1 is correct:</em> Nationality is a categorical (nominal, qualitative) variable --- it names a category without inherent numeric order or magnitude.</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>2. Age</strong>, <strong>3. height</strong>, and <strong>4. weight</strong> are quantitative (continuous) variables measured on a numeric scale.</p>\n<p><em>Background:</em> Qualitative variables are nominal or ordinal; quantitative variables are discrete or continuous. The distinction determines which descriptive statistics and tests are appropriate.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":121,"stem":"Which of the following best describes the concept of variance?","options":[{"letter":"1","text":"The average value of the squared difference between measurements and the population mean measurement."},{"letter":"2","text":"Values to the left of the mean are just as likely to be observed as values to the right of the mean by the same amount."},{"letter":"3","text":"A measure of the variability of measurements across subjects."},{"letter":"4","text":"Absence of a systematic pattern."}],"correct":"1","explanation":"<p><em>Why 1 is correct:</em> Variance is precisely defined as the average of the squared deviations of each observation from the mean (Turner &amp; Houle, <em>Headache</em>, 2019; Black et al., <em>Journal of Evaluation in Clinical Practice</em>, 2026). Its square root is the standard deviation.</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>2.</strong> describes symmetry of a distribution (e.g., a normal distribution), not variance.</p>\n\n<p><strong>3.</strong> is a loose, general description of dispersion/variability --- true in spirit but not the specific definition of variance (it better fits the general concept or standard deviation).</p>\n\n<p><strong>4.</strong> describes randomness, not variance.</p>\n<p><em>Background:</em> Because variance is in squared units, standard deviation (its square root) is usually reported for interpretability in the data&#x27;s original units.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":122,"stem":"Often studies will quote a p-value. What does this actually mean?","options":[{"letter":"1","text":"The chance that the test erroneously rejects the null hypothesis when the null hypothesis is false."},{"letter":"2","text":"The probability of rejecting the null hypothesis of a study question when that hypothesis is true."}],"correct":"2","explanation":"<p><em>Why 2 is the intended answer:</em> Of the two options, option 2 correctly captures that the p-value is computed under the assumption that the null hypothesis is true. Option 1 is internally contradictory (&quot;erroneously rejects... when the null is false&quot;).</p>\n<p><em>Precise-definition caveat:</em> Strictly, the p-value is the probability of obtaining a result at least as extreme as that observed, assuming the null hypothesis is true (Turner &amp; Deng, <em>Headache</em>, 2020; Biau et al., <em>Clinical Orthopaedics and Related Research</em>, 2010). The wording in option 2 (&quot;probability of rejecting the null when it is true&quot;) more precisely describes the significance level/Type I error rate (alpha), which is fixed before the study, rather than the data-dependent p-value. Given the options, option 2 is nonetheless the correct choice.</p>\n<p><em>Background:</em> Common misinterpretation is treating the p-value as the probability that the null hypothesis is true --- it is not. Confidence intervals are recommended alongside p-values.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":123,"stem":"A question about confidence intervals. What is the chance that values obtained fall outside of the 95% confidence interval?","options":[{"letter":"1","text":"95/100."},{"letter":"2","text":"1/95."},{"letter":"3","text":"1/19."},{"letter":"4","text":"1/20."}],"correct":"4","explanation":"<p><em>Why 4 is correct:</em> A 95% confidence level corresponds to alpha = 0.05, i.e., 5% = 1/20 falling outside the interval.</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>1. 95/100</strong> is the proportion inside the interval, not outside.</p>\n\n<p><strong>2. 1/95</strong> and <strong>3. 1/19</strong> do not correspond to 5% (1/19 \u2248 5.3%, a near-distractor but not exact).</p>\n<p><em>Background:</em> A 95% CI means that, over repeated sampling, 95% of such intervals would contain the true population parameter --- a frequentist, long-run interpretation.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":124,"stem":"What function does a Kaplan-Meier, or product limit estimator, have?","options":[{"letter":"1","text":"Determines significance of a study."},{"letter":"2","text":"Ensures a study has adequate power."},{"letter":"3","text":"Defines a curve that estimates survival function for a specific population."},{"letter":"4","text":"Compares two groups over multiple variables."}],"correct":"3","explanation":"<p><em>Why 3 is correct:</em> The Kaplan-Meier (product-limit) estimator is a non-parametric method that estimates the survival function S(t) --- the probability of remaining event-free over time --- and importantly accommodates censored data (Kaplan &amp; Meier method; Yang et al., <em>Scientific Reports</em>, 2022; Liu et al., <em>BMC Medical Research Methodology</em>, 2021).</p>\n<p><em>Why the others are incorrect:</em></p>\n<p><strong>1. Determines significance</strong> --- comparing two survival curves is the role of the log-rank test, not the KM estimator itself.</p>\n\n<p><strong>2. Ensures adequate power</strong> describes sample-size/power calculation.</p>\n\n<p><strong>4. Compares two groups over multiple variables</strong> describes multivariable regression (e.g., Cox proportional hazards).</p>\n<p><em>Background:</em> KM curves are step functions that drop at each event time; censored observations are marked with tick marks. Group comparison uses the log-rank test; adjusted hazard ratios use Cox regression.</p>","no_key":false,"no_options":false,"free_answer":null}];</script>
<script>
(function(){
  const STORAGE_KEY = 'progress-v1';
  // Namespaced by page title so multiple quiz files hosted/opened together
  // (outside Claude, where window.storage isn't available) don't clobber
  // each other's saved progress in the same browser's localStorage.
  const LOCAL_STORAGE_KEY = 'examquiz-progress:' + (document.title || 'default');
  let state = { answers: {}, flagged: {}, struck: {}, notes: {} }; // answers[num]={selected,correct}; struck[num]={LETTER:true}; notes[num]=string
  let filter = 'all';
  let currentIndex = 0;
  let pendingSelections = {}; // qnum -> letter, chosen but not yet confirmed (session-only)
  let notesSaveTimer = null;
  const BANNER_POPUP_IDS = ['calc-panel', 'settings-panel', 'notes-panel-popup'];

  // Closes every banner popover (calculator, settings, notes) except the
  // one whose panel id is passed in -- keeps the three mutually exclusive
  // without each toggle handler needing to know about the other two by
  // name. Add new banner popovers to BANNER_POPUP_IDS above and they get
  // this behavior for free.
  function closeOtherBannerPopups(exceptPanelId) {
    BANNER_POPUP_IDS.forEach(id => {
      if (id === exceptPanelId) return;
      const el = document.getElementById(id);
      if (el) el.classList.add('hidden');
    });
  }

  const FILTERS = [
    ['all', 'All'],
    ['unanswered', 'Unanswered'],
    ['incorrect', 'Incorrect'],
    ['flagged', 'Flagged'],
  ];

  function questionStatus(q) {
    const a = state.answers[q.number];
    if (!a) return 'unanswered';
    if (q.no_options || q.no_key) return 'nokey-done';
    return a.correct ? 'correct' : 'incorrect';
  }

  function visibleList() {
    return QUIZ_DATA.filter(q => {
      if (filter === 'unanswered') return !state.answers[q.number];
      if (filter === 'incorrect') {
        const a = state.answers[q.number];
        return a && !a.correct && !q.no_options && !q.no_key;
      }
      if (filter === 'flagged') return !!state.flagged[q.number];
      return true;
    });
  }

  function renderFilters() {
    const el = document.getElementById('filter-tabs');
    el.innerHTML = '';
    FILTERS.forEach(([key, label]) => {
      const b = document.createElement('button');
      b.textContent = label;
      if (filter === key) b.classList.add('active');
      b.onclick = () => { filter = key; currentIndex = 0; renderAll(); };
      el.appendChild(b);
    });
  }

  function renderGrid() {
    const grid = document.getElementById('qgrid');
    grid.innerHTML = '';
    const list = visibleList();
    if (list.length === 0) {
      const empty = document.createElement('div');
      empty.style.gridColumn = '1 / -1';
      empty.style.color = 'var(--muted)';
      empty.style.fontSize = '12.5px';
      empty.style.textAlign = 'center';
      empty.style.padding = '10px 0';
      empty.textContent = 'No questions here.';
      grid.appendChild(empty);
      return;
    }
    list.forEach((q, i) => {
      const b = document.createElement('button');
      b.textContent = q.number;
      const status = questionStatus(q);
      if (status !== 'unanswered') b.classList.add(status);
      if (i === currentIndex) b.classList.add('current');
      if (state.flagged[q.number]) {
        const dot = document.createElement('span');
        dot.className = 'flagdot';
        b.appendChild(dot);
      }
      b.onclick = () => { currentIndex = i; renderAll(); scrollToTop(); };
      grid.appendChild(b);
    });
  }

  function renderStats() {
    const answeredNums = Object.keys(state.answers);
    const gradable = answeredNums.filter(n => {
      const q = QUIZ_DATA.find(x => x.number == n);
      return q && !q.no_options && !q.no_key;
    });
    const correctCount = gradable.filter(n => state.answers[n].correct).length;
    document.getElementById('stat-answered').textContent = answeredNums.length;
    document.getElementById('stat-correct').textContent = correctCount;
    document.getElementById('stat-pct').textContent = gradable.length
      ? Math.round(100 * correctCount / gradable.length) + '%'
      : '—';
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderPanel() {
    const panel = document.getElementById('qpanel');
    const list = visibleList();
    if (list.length === 0) {
      panel.innerHTML = '<div class="empty-state">Nothing to show for this filter. Try a different tab on the left.</div>';
      return;
    }
    if (currentIndex >= list.length) currentIndex = list.length - 1;
    const q = list[currentIndex];
    const answer = state.answers[q.number];
    const flagged = !!state.flagged[q.number];
    const pending = pendingSelections[q.number]; // letter picked but not confirmed yet

    let html = '';
    html += '<div class="qmeta">';
    html += '<div class="qnum">Question ' + q.number + '</div>';
    html += '<button class="flag-toggle ' + (flagged ? 'on' : '') + '" id="flag-btn">' + (flagged ? '&#9873; Flagged' : '&#9872; Flag for review') + '</button>';
    html += '</div>';
    html += '<div class="stem">' + escapeHtml(q.stem) + '</div>';

    if (q.no_options) {
      if (!answer) {
        html += '<div class="noopts-box">This question\'s original answer choices weren\'t fully captured in the source material — only the key fact is available.</div>';
        html += '<button class="reveal-btn" id="reveal-btn">Reveal answer</button>';
      } else {
        html += '<div class="explain">';
        html += '<div class="verdict nokey">Key fact</div>';
        html += '<div class="explain-body"><p><strong>' + escapeHtml(q.free_answer || '') + '</strong></p>' + q.explanation + '</div>';
        html += '</div>';
      }
    } else if (q.options) {
      html += '<div class="options">';
      q.options.forEach(opt => {
        const struck = !answer && !!(state.struck[q.number] && state.struck[q.number][opt.letter]);
        let cls = 'opt';
        if (answer) {
          cls += ' locked';
          if (opt.letter === q.correct) cls += ' correct-answer';
          else if (opt.letter === answer.selected) cls += ' wrong-answer';
          if (opt.letter === answer.selected) cls += ' selected';
        } else if (struck) {
          cls += ' struck';
        } else if (pending === opt.letter) {
          cls += ' pending-selected';
        }
        html += '<div class="opt-row">';
        html += '<button class="' + cls + '" data-letter="' + opt.letter + '"' + (struck ? ' disabled' : '') + '>';
        html += '<span class="letter">' + opt.letter + '</span>';
        html += '<span class="text">' + escapeHtml(opt.text) + '</span>';
        html += '</button>';
        if (!answer) {
          html += '<button class="strike-btn ' + (struck ? 'active' : '') + '" data-strike-letter="' + opt.letter + '" title="Cross out this option">&#9587;</button>';
        }
        html += '</div>';
      });
      html += '</div>';

      if (!answer) {
        html += '<button class="confirm-btn" id="confirm-btn" ' + (pending ? '' : 'disabled') + '>Confirm answer</button>';
      }

      if (answer) {
        html += '<div class="explain">';
        if (q.no_key) {
