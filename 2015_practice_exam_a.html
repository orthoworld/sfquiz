nhibitors was marketed, and 4-factor PCC (e.g., octaplex) was used off-label as the nonspecific hemostatic option. Andexanet alfa was still investigational.</p>\n<p><strong>Critical update since 2015:</strong></p>\n<p>Andexanet alfa (Andexxa) received FDA approval in 2018 as a specific reversal agent for apixaban and rivaroxaban in life-threatening or uncontrolled bleeding --- it is not FDA-approved for the elective perioperative/urgent-surgery indication (Joglar et al., ACC/AHA/ACCP/HRS AF Guideline, 2023).</p>\n\n<p>Andexanet alfa was subsequently withdrawn from the US market in December 2025, after the FDA and manufacturer could not agree on a path to convert its accelerated approval to full approval amid unresolved thrombotic-safety concerns (FDA Orange Book, 2025).</p>\n\n<p>For a patient on rivaroxaban requiring urgent surgery today, current practice is to check DOAC levels (or anti-Xa activity) when available and, if elevated or unavailable and bleeding risk is high, reverse with 4-factor PCC; specific antidote use is limited by approval status and availability (Douketis &amp; Spyropoulos, JAMA, 2024).</p>\n<p><strong>Why the other options are/were incorrect as a specific antidote:</strong></p>\n<p><strong>Octaplex (4F-PCC):</strong> A nonspecific hemostatic agent --- reasonable and now guideline-supported off-label for Xa-inhibitor reversal, but not a &quot;specific reversal agent.&quot;</p>\n\n<p><strong>FFP:</strong> Does not meaningfully reverse direct factor Xa inhibitors.</p>\n\n<p><strong>Vitamin K:</strong> Ineffective against DOACs; it reverses vitamin K antagonists (warfarin) only.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":39,"stem":"What happens to old stored units of packed RBC's over time?","options":[{"letter":"1","text":"Decreased O2 carrying capacity."},{"letter":"2","text":"Increased 2-3 DPG (decreased, thus left shift of curve)."},{"letter":"3","text":"Metabolic alkalosis (?conversion of citrate to HCO3)."},{"letter":"4","text":"Decrease K+ (hyperkalemia)."}],"correct":"1","explanation":"<p><strong>Why decreased oxygen delivery is the correct description of the storage lesion:</strong> During refrigerated storage (up to 42 days), red cells undergo progressive biochemical change collectively termed the &quot;storage lesion.&quot; 2,3-diphosphoglycerate (2,3-DPG) is depleted within 2--3 weeks, shifting the oxyhemoglobin dissociation curve leftward and impairing oxygen off-loading to tissues; ATP falls, cells become rigid and spheroechinocytic, and in vivo oxygen delivery is reduced (Mart\u00ed-Carvajal et al., Cochrane, 2015; Karafin et al., J Clin Invest, 2025; Good et al., Cochrane, 2015). Option 1 best captures this.</p>\n<p><strong>Why the marked answer (metabolic alkalosis) is wrong for the stored unit:</strong> Stored blood becomes progressively acidotic, not alkalotic --- lactate accumulates and intracellular pH falls as glycolysis slows (Nemkov et al., Sci Rep, 2025; Flegel et al., Br J Haematol, 2014). A metabolic alkalosis is a delayed phenomenon in the recipient, occurring only after transfusion when citrate anticoagulant is metabolized to bicarbonate by the liver. The parenthetical rationale in the original key describes that recipient effect, but the question asks what happens to the unit &quot;over time&quot; during storage, where the change is acidosis.</p>\n<p><strong>Why the other distractors are incorrect (as written):</strong></p>\n<p><strong>Increased 2,3-DPG:</strong> The opposite is true --- 2,3-DPG decreases (the original note correctly recognizes this).</p>\n\n<p><strong>Decreased K+:</strong> The opposite is true --- extracellular potassium rises as the cold-impaired Na+/K+-ATPase allows potassium to leak out, producing a hyperkalemia risk with rapid/large-volume transfusion (the original note correctly recognizes this).</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":40,"stem":"How can you prevent the coagulopathy associated with a massive transfusion?","options":[{"letter":"1","text":"TEG should guide your transfusion."},{"letter":"2","text":"Give a 1:1 or 1:1.5 PRBC to FFP ratio."},{"letter":"3","text":"Switch from NS to plasmalyte."},{"letter":"4","text":"Administer boluses of sodium bicarbonate."}],"correct":"2","explanation":"<p><strong>Why balanced ratio transfusion is correct:</strong> Empiric, balanced component therapy with a high plasma-to-RBC ratio is the cornerstone of preventing and treating dilutional/trauma-induced coagulopathy in massive transfusion. The landmark PROPPR trial showed a 1:1:1 ratio (plasma:platelets:RBC) achieved faster hemostasis and lower 24-hour mortality from exsanguination than a 1:1:2 ratio, and guidelines endorse ratios in the 1:1 to 1:2 range (Moore et al., Nat Rev Dis Primers, 2021; Takiguchi et al., Sci Rep, 2025). Observational data support that plasma:RBC ratios of roughly 1:1 up to 1.5:1 are associated with improved survival, with a plateau beyond ~1.5 (Fujiwara et al., JAMA Surgery, 2024).</p>\n<p><strong>Why the other options are incorrect:</strong></p>\n<p><strong>TEG-guided transfusion:</strong> Viscoelastic testing is a valuable adjunct to tailor component therapy, but it does not by itself replace the empiric balanced-ratio strategy that must begin immediately in exsanguinating hemorrhage before results are available; the evidence for TEG-guided resuscitation in trauma remains mixed.</p>\n\n<p><strong>Switch from NS to Plasma-Lyte:</strong> Balanced crystalloids may reduce hyperchloremic acidosis, but crystalloid choice does not prevent the coagulopathy of massive transfusion; excessive crystalloid worsens dilutional coagulopathy.</p>\n\n<p><strong>Sodium bicarbonate boluses:</strong> Do not correct or prevent coagulopathy and can cause metabolic and ionized-calcium derangements.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":41,"stem":"Clinical scenario describes thyroid storm in a patient. What is the initial treatment?","options":[{"letter":"1","text":"Steroids."},{"letter":"2","text":"Lugol's solution."},{"letter":"3","text":"Propylthiouracil (PTU)."},{"letter":"4","text":"Ablation with radioactive iodine."}],"correct":"3","explanation":"<p><em>Note: The original key marks both option 1 (Steroids) and option 3 (PTU). This is internally inconsistent. The single best &quot;initial&quot; specific therapy among these choices is the thionamide (PTU); steroids are an important adjunct but not the primary answer.</em></p>\n<p><strong>Why PTU is correct:</strong> Thyroid storm management targets the thyroid hormone excess at multiple points, but the antithyroid drug (thionamide) is the agent that blocks new hormone synthesis, and PTU is specifically preferred in storm because --- unlike methimazole --- it also inhibits peripheral conversion of T4 to the more active T3 (Wiersinga et al., Lancet Diabetes &amp; Endocrinology, 2023; Lee and Pearce, JAMA, 2023). A typical loading dose is 500--1000 mg followed by 250 mg every 4 hours. Critically, the sequence matters: iodine must be given at least one hour AFTER the thionamide to avoid providing substrate for further hormone synthesis (Kopp et al., Journal of Clinical Endocrinology &amp; Metabolism, 2026). In practice a beta-blocker (e.g., propranolol) is also given early for adrenergic symptom control, but among the four options listed, PTU is the definitive initial treatment.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1. Steroids</strong> --- Glucocorticoids (hydrocortisone 300 mg load, then 100 mg every 8 h) are a genuine component of therapy because they reduce peripheral T4-to-T3 conversion and treat relative adrenal insufficiency, but they are adjunctive rather than the primary agent that halts hormone production (Kopp et al., 2026).</p>\n\n<p><strong>2. Lugol&#x27;s solution</strong> --- Inorganic iodine blocks hormone release (Wolff-Chaikoff effect) but must be administered at least 1 hour after the thionamide; giving it first (or as the &quot;initial&quot; step) risks worsening thyrotoxicosis by supplying iodine substrate, particularly in nodular goiter (Kopp et al., 2026; Wiersinga et al., 2023).</p>\n\n<p><strong>4. Radioactive iodine ablation</strong> --- This is definitive treatment for the underlying hyperthyroidism in the outpatient setting, not acute storm therapy; it has no role in the emergency stabilization of thyroid storm.</p>\n<p><strong>Background:</strong> The four pharmacologic pillars of storm are thionamide \u2192 iodine (delayed) \u2192 beta-blocker \u2192 glucocorticoid, plus ICU-level supportive care and treatment of the precipitant. Refractory cases may require plasmapheresis or emergency thyroidectomy (Lee and Pearce, JAMA, 2023).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":42,"stem":"What is the time of onset for transfusion-related acute lung injury (TRALI)?","options":[{"letter":"1","text":"6 hrs."},{"letter":"2","text":"18 hrs."},{"letter":"3","text":"24 hrs."},{"letter":"4","text":"36 hrs."}],"correct":"1","explanation":"<p><strong>Why 6 hrs is correct:</strong> By consensus definition, TRALI is acute hypoxemia and non-cardiogenic (permeability) pulmonary edema that develops during or within 6 hours of transfusion (Semple et al., Blood, 2019; Shaz et al., Blood, 2011). Most cases begin within 1--2 hours of starting the transfusion. It is driven by a two-hit mechanism --- a predisposing inflammatory state in the recipient plus donor anti-leukocyte (anti-HLA/anti-HNA) antibodies or bioactive lipids in the product --- and remains a leading cause of transfusion-related death (Liu et al., BMC Pulmonary Medicine, 2025).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>2. 18 hrs / 3. 24 hrs / 4. 36 hrs</strong> --- All exceed the diagnostic 6-hour window. Respiratory compromise that first appears after 6 hours does not meet the TRALI definition and should prompt consideration of alternative diagnoses (e.g., TACO, pneumonia, evolving ARDS from another cause).</p>\n<p><strong>Background:</strong> TRALI must be distinguished from transfusion-associated circulatory overload (TACO), which also occurs within 6 hours but is a hydrostatic (cardiogenic) edema. High-plasma-volume products (FFP, apheresis platelets) carry the highest risk.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":43,"stem":"Patient is POD #1 from a bowel surgery. They are febrile at 39.5. What is the most important thing to exclude?","options":[{"letter":"1","text":"Atelectasis."},{"letter":"2","text":"Anastomotic leak."},{"letter":"3","text":"Pneumonia."},{"letter":"4","text":"Invasive wound infection."}],"correct":"2","explanation":"<p><strong>Why anastomotic leak is correct:</strong> Among the listed causes of postoperative fever, anastomotic leak is the most dangerous and therefore the &quot;most important to exclude.&quot; A high fever, tachycardia, and leukocytosis are the most common signs of a leak, and although leaks are classically detected around days 5--10, very early leaks (within 48 hours) do occur and reflect technical failure of the anastomosis (Gastrointestinal Surgical Emergencies Textbook, American College of Surgeons, 2021). Failure to recognize a leak promptly is strongly associated with progression to sepsis, reoperation, and death --- outcome is driven more by delayed diagnosis than by the leak itself (Savitch et al., JAMA Surgery, 2026). Physiologic derangement (rising heart rate) can be evident as early as POD 1 in patients who ultimately declare a leak (Stearns et al., Colorectal Disease, 2019).</p>\n<p><strong>Why the others are incorrect / less critical:</strong></p>\n<p><strong>1. Atelectasis</strong> --- Classically cited for early postoperative fever, but it is benign and not the priority to exclude when the fever is high (39.5 \u00b0C); it does not carry the mortality risk of a leak.</p>\n\n<p><strong>3. Pneumonia</strong> --- A relevant cause of postoperative fever but typically develops slightly later and is less immediately life-threatening than a leak on POD 1.</p>\n\n<p><strong>4. Invasive wound infection</strong> --- The original key flags this as a possibility. Necrotizing (invasive) wound infection is a genuine surgical emergency, but it is far less common than a leak in the first 24 hours and usually has local wound findings; anastomotic leak remains the single most important intra-abdominal catastrophe to rule out.</p>\n<p><strong>Background:</strong> Early high fever after bowel surgery warrants a low threshold for CT of the abdomen/pelvis with contrast and surgical reassessment rather than attributing it to atelectasis.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":44,"stem":"A 4-year-old child involved in a MVC. He opens his eyes to voice, is crying loudly but is consolable and quiets down when his mother talks to him, and withdraws to pain stimuli. What is his GCS?","options":[{"letter":"1","text":"11."},{"letter":"2","text":"14."},{"letter":"3","text":"8."},{"letter":"4","text":"9."}],"correct":"1","explanation":"<p><strong>Why 11 is correct:</strong> Scoring the three components:</p>\n<p><strong>Eye opening to voice = 3</strong> (E3: opens eyes to sound/speech).</p>\n\n<p><strong>Verbal, consolable crying = 4</strong> (V4: irritable, consolable crying --- the pediatric verbal equivalent).</p>\n\n<p><strong>Motor, withdraws to pain = 4</strong> (M4: withdrawal from painful stimulus).</p>\n<p>Total = 3 + 4 + 4 = <strong>11</strong>, consistent with a moderate injury (GCS 9--12) (ACS Best Practices in TBI, 2024; Brain Trauma Foundation Prehospital Guidelines, 3rd ed., 2023).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>2. 14</strong> --- Would require near-normal eye, verbal, and motor responses; this child has a subnormal response in all three domains.</p>\n\n<p><strong>3. 8 / 4. 9</strong> --- Too low; both would require greater impairment (e.g., no eye opening to voice, or only pain-localizing/decorticate responses). This child opens eyes to voice and is consolable, which are relatively preserved responses.</p>\n<p><strong>Background:</strong> For preverbal or young children, the pediatric GCS assigns a full verbal score for age-appropriate cooing/babbling; irritable but consolable crying scores 4. A summed score \u2264 8 defines severe injury.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":45,"stem":"A patient declared brain dead in the ICU, awaiting organ donation, suddenly starts to pass large volumes of urine and serum Na\u207a rises to 151. What should you do?","options":[{"letter":"1","text":"Fluid restrict."},{"letter":"2","text":"Increase maintenance fluid rate."},{"letter":"3","text":"Give Desmopressin infusion."},{"letter":"4","text":"(blank)."}],"correct":"3","explanation":"<p><strong>Why desmopressin is correct:</strong> Polyuria plus rising serum sodium (151 mmol/L) in a brain-dead patient is the classic presentation of central diabetes insipidus (arginine vasopressin deficiency), which occurs in the large majority of brain-dead donors (~79%) owing to loss of posterior pituitary/hypothalamic function (Wei\u00df et al., Journal of Clinical Medicine, 2024). Management is to clamp the renal free-water loss with desmopressin (intermittent) or continuous vasopressin, while replacing the free-water deficit with hypotonic fluid and correcting the hypernatremia (Meyfroidt et al., Intensive Care Medicine, 2019; Garrahy et al., Clinical Endocrinology, 2019). Recognizing and treating AVP deficiency also protects donor kidney function and improves transplantable organ quality.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1. Fluid restrict</strong> --- Would worsen hypernatremia and hypovolemia in a patient losing large volumes of dilute urine; the problem is free-water loss, not overload.</p>\n\n<p><strong>2. Increase maintenance fluid rate</strong> --- Replacing volume alone without antidiuretic hormone does not stop the ongoing renal free-water loss; polyuria and hypernatremia will persist. Free-water replacement is an adjunct, but the definitive step is desmopressin.</p>\n<p><strong>Background:</strong> In donors, vasopressin also provides hemodynamic support and can reduce catecholamine requirement, an additional reason it is favored.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":46,"stem":"Patient with hemophilia going for surgery (joint replacement). How should you manage factor replacement?","options":[{"letter":"1","text":"Factor 100% pre-op then 50% for 5 days post-op."},{"letter":"2","text":"Factor 100% pre-op then 100% for 5 days post-op."},{"letter":"3","text":"Factor 100% pre-op then 50% for 10 days post-op."},{"letter":"4","text":"Factor 100% pre-op then 100% for 10--14 days post-op."}],"correct":"4","explanation":"<p><strong>Why option 4 is the best answer:</strong> Major surgery (including orthopedic/joint replacement) in hemophilia requires correction of factor to ~80--100 IU/dL preoperatively and sustained replacement across an extended postoperative course of roughly 10--14 days, until wound healing and suture removal at ~2 weeks (Hermans et al., Haemophilia, 2009; Sackstein et al., Haemophilia, 2021). The discriminating correct feature among these options is the 10--14 day duration --- orthopedic wounds need protection well beyond 5 days, so options 1 and 2 (5 days) are inadequate.</p>\n<p><em>Nuance / partial disagreement:</em> The literal wording &quot;100% for 10--14 days&quot; overstates modern practice. Contemporary protocols taper the target: peak ~80--100 IU/dL preoperatively and on POD 1--3, ~60--80 IU/dL on POD 4--6, and ~30--60 IU/dL through POD 7--14 (Sackstein et al., 2021; Wang et al., BMC Musculoskeletal Disorders, 2023). So the correct concept is &quot;full correction preoperatively, then maintained (tapering) replacement for 10--14 days,&quot; which option 4 approximates best.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1. 50% for 5 days</strong> --- Both the target trough and, critically, the 5-day duration are insufficient for a major orthopedic wound.</p>\n\n<p><strong>2. 100% for 5 days</strong> --- Correct early intensity but far too short a duration for joint replacement.</p>\n\n<p><strong>3. 50% for 10 days</strong> --- The 10-day duration is reasonable, but a 50% target throughout is too low for the high-risk early postoperative period, when troughs near 80 IU/dL are needed on days 1--3.</p>\n<p><strong>Background:</strong> Perioperative hemophilia care is multidisciplinary, with pharmacokinetic testing, inhibitor screening, daily factor level monitoring in the first week, and mechanical (rather than routine pharmacologic) VTE prophylaxis.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":47,"stem":"What is the most common cause of toxic shock syndrome?","options":[{"letter":"1","text":"Staph aureus."},{"letter":"2","text":"Strep pyogenes."},{"letter":"3","text":"Staph aureus exotoxin (enterotoxin type B)."},{"letter":"4","text":"Strep pyogenes exotoxin."}],"correct":"3","explanation":"<p><strong>Why option 3 is correct:</strong> TSS is a superantigen-mediated disease: staphylococcal exotoxins cross-link MHC class II with T-cell receptors, causing massive polyclonal T-cell activation and a cytokine storm (fever, rash, hypotension, multiorgan dysfunction) (Tuffs et al., Molecular Microbiology, 2019; Di Bella et al., European Journal of Clinical Microbiology &amp; Infectious Diseases, 2025). Because the question distinguishes the organism from its toxin, the toxin-based answer (option 3) is the mechanistically correct choice --- TSS is caused by the exotoxin, not merely the presence of the organism.</p>\n<p><em>Caveat / partial disagreement:</em> The parenthetical &quot;enterotoxin type B&quot; is not the predominant toxin. The single most common toxin is toxic shock syndrome toxin-1 (TSST-1), which accounts for 85--100% of menstrual TSS and 40--60% of non-menstrual cases; staphylococcal enterotoxins B and C account for a minority (chiefly some non-menstrual cases) (Schoergenhofer et al., EClinicalMedicine, 2024; Ondusko and Nolt, AAP/Pediatrics in Review, 2018). The correct concept is &quot;Staph aureus superantigen exotoxin,&quot; best represented by TSST-1.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1. Staph aureus</strong> --- The organism is the source, but TSS is defined by toxin production; a colonizing strain that does not produce a superantigen does not cause TSS.</p>\n\n<p><strong>2. Strep pyogenes / 4. Strep pyogenes exotoxin</strong> --- Group A streptococcal superantigens (e.g., SpeA) do cause streptococcal TSS, but this is less common than staphylococcal TSS and is typically associated with invasive soft-tissue infection; it is not the single most common cause.</p>\n<p><strong>Background:</strong> Treatment combines aggressive fluid resuscitation, source control, and antibiotics that include a protein-synthesis inhibitor (clindamycin) to suppress toxin production, plus anti-staphylococcal coverage (often vancomycin for MRSA).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":48,"stem":"Patient with sickle cell disease is pre-op. Hgb: 56 (g/L). What should you do?","options":[{"letter":"1","text":"Nothing, they have a well-compensated chronic anemia."},{"letter":"2","text":"Transfuse (original key annotates: transfuse pre-op to Hb 100)."},{"letter":"3","text":"Give hydroxyurea."},{"letter":"4","text":"(blank)."}],"correct":"2","explanation":"<p><em>Disagreement with the original key: option 1 (&quot;do nothing&quot;) is bolded as correct in the source, which is incorrect. A sickle cell patient with Hgb 56 g/L (5.6 g/dL) undergoing surgery under general anesthesia should be transfused. Note also that the &quot;130&quot; figure written in option 2 is the wrong target --- the correct target is ~100 g/L.</em></p>\n<p><strong>Why preoperative transfusion to ~100 g/L is correct:</strong> For patients with sickle cell anemia undergoing a procedure involving general anesthesia, guidelines recommend simple (top-up) transfusion to a preoperative hemoglobin of 10 g/dL (100 g/L) (NHLBI Expert Panel Report, 2014; Yawn et al., JAMA, 2014). The pivotal TAPS trial and the earlier Vichinsky preoperative transfusion trial support raising Hgb to ~100 g/L to reduce acute chest syndrome and other postoperative complications; simple transfusion is non-inferior to exchange for low/medium-risk surgery. A Hgb of 5.6 g/dL is well below the typical steady-state baseline and mandates transfusion. The ASH 2020 guideline similarly advises aiming for a total hemoglobin &gt; 9 g/dL before surgery (Chou et al., Blood Advances, 2020).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1. &quot;Nothing / well-compensated anemia&quot;</strong> --- Incorrect for a patient going to the operating room; foregoing transfusion at Hgb 5.6 g/dL leaves the patient at high risk of perioperative acute chest syndrome, vaso-occlusion, and death.</p>\n\n<p><strong>2. &quot;Transfuse until Hgb 130&quot;</strong> --- Transfusion is correct, but the target of 130 g/L is wrong and dangerous: post-transfusion hemoglobin should not exceed ~110 g/L (11 g/dL) because raising the Hgb above this level increases blood viscosity and precipitates vaso-occlusion. The correct target is ~100 g/L.</p>\n\n<p><strong>3. Hydroxyurea</strong> --- A disease-modifying maintenance therapy that takes weeks to months to act; it has no role in acute preoperative preparation.</p>\n<p><strong>Background:</strong> For high-risk surgery (neurosurgery, cardiac), or patients with a high baseline Hgb, exchange transfusion targeting HbS &lt; 30% is preferred; management should involve a sickle cell expert.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":49,"stem":"What is the cause of hyperacute rejection in organ transplantation?","options":[{"letter":"1","text":"ABO incompatibility."},{"letter":"2","text":"Pre-formed antibodies."},{"letter":"3","text":"T-cell mediated response."},{"letter":"4","text":"MHC incompatibility."}],"correct":"2","explanation":"<p><strong>Why pre-formed antibodies is correct:</strong> Hyperacute rejection occurs within minutes to hours of reperfusion and is caused by pre-existing (pre-formed) donor-specific antibodies in the recipient that bind antigens on the graft vascular endothelium, activating the complement cascade and producing endothelial injury, platelet deposition, thrombotic occlusion, and rapid graft necrosis (Nankivell and Alexander, NEJM, 2010; Panebianco et al., Clinical Transplantation, 2026). This is the broadest and most complete answer because it encompasses both anti-HLA and anti-ABO antibodies.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1. ABO incompatibility</strong> --- A specific example of pre-formed (natural anti-ABO IgM) antibody--mediated injury, and therefore a subset of the correct answer rather than the most complete choice (Biglarnia et al., Nature Reviews Nephrology, 2018).</p>\n\n<p><strong>3. T-cell mediated response</strong> --- This is the mechanism of acute cellular rejection (days to weeks), not the antibody-driven, complement-mediated process of hyperacute rejection.</p>\n\n<p><strong>4. MHC incompatibility</strong> --- HLA/MHC mismatch is the substrate for rejection generally, but mismatch alone without pre-formed antibody does not cause hyperacute rejection; sensitization (prior transfusion, pregnancy, or transplant) generating pre-formed antibody is required.</p>\n<p><strong>Background:</strong> Improved pre-transplant crossmatching (complement-dependent cytotoxicity and flow cytometry) to detect donor-specific antibodies has made hyperacute rejection rare (Pescovitz, Clinical Transplantation, 2006).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":50,"stem":"Why is meperidine (Demerol) not used anymore?","options":[{"letter":"1","text":"High therapeutic ceiling dose."},{"letter":"2","text":"Potential buildup of toxic metabolites (normeperidine with long-term use)."},{"letter":"3","text":"Low therapeutic index."},{"letter":"4","text":"Cost."}],"correct":"2","explanation":"<p><strong>Why option 2 is correct:</strong> Hepatic N-demethylation of meperidine produces normeperidine, an active metabolite with potent central excitatory neurotoxicity (irritability, tremor, myoclonus, and seizures). Normeperidine has a long half-life (~15--30 hours versus 2--5 hours for the parent drug) and is renally eliminated, so it accumulates with repeated dosing and in renal or hepatic impairment (Friesen et al., BMC Geriatrics, 2016; AGA Institute Review of Endoscopic Sedation, Gastroenterology, 2007; FDA Demerol label). This, plus a short analgesic duration that promotes frequent dosing and a dangerous interaction with MAO inhibitors, led to meperidine being placed on the Beers list and largely abandoned.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1. High therapeutic ceiling dose</strong> --- Not the reason for its decline; the issue is metabolite toxicity, not a ceiling effect.</p>\n\n<p><strong>3. Low therapeutic index</strong> --- Meperidine&#x27;s problem is a specific neurotoxic metabolite rather than a narrow overall therapeutic index in the usual sense; this is not the classically cited reason.</p>\n\n<p><strong>4. Cost</strong> --- Meperidine is inexpensive; cost is not why it fell out of favor.</p>\n<p><strong>Background:</strong> Because normeperidine is renally cleared, the elderly and patients with renal insufficiency are at greatest risk; meperidine is also contraindicated with MAOIs owing to a potentially fatal serotonergic/excitatory reaction.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":51,"stem":"A young patient presents to the ER with a closed head injury. He has a fixed and non-reactive right pupil. What should you do first?","options":[{"letter":"1","text":"Burr hole right side in the ER."},{"letter":"2","text":"Burr hole left side in the ER."},{"letter":"3","text":"CT head."},{"letter":"4","text":"Take to the OR immediately."}],"correct":"3","explanation":"<p><strong>Why &quot;CT head&quot; is correct:</strong> A unilateral fixed, dilated pupil after head trauma signals third-nerve (CN III) compression from uncal/transtentorial herniation, most often driven by an expanding ipsilateral mass lesion such as an epidural or acute subdural hematoma (Stocchetti et al., Lancet Neurology, 2017). In a hemodynamically stable patient, an immediate non-contrast CT head localizes and characterizes the lesion and directs definitive craniotomy. Critically, medical anti-herniation measures (head elevation, osmotherapy with mannitol or hypertonic saline, brief controlled hyperventilation) should be initiated <em>concurrently</em> while imaging is obtained --- CT and bridging therapy are not mutually exclusive (Stocchetti and Maas, New England Journal of Medicine, 2014; Chieregato et al., Acta Neurochirurgica, 2017).</p>\n<p><strong>Caveat / nuance:</strong> &quot;CT head&quot; is correct only for a patient stable enough for the scanner. If the patient is actively deteriorating and no CT is available, the historical answer would be emergent surgical decompression --- but modern practice replaces blind ER burr holes with a formal craniotomy/craniectomy in the OR, guided by imaging whenever feasible. Even with fixed pupils, aggressive and timely medical + surgical management produces meaningful survival and recovery in selected patients, so nihilism is unwarranted (Griepp et al., Journal of Neurosurgery, 2024; World Neurosurgery, 2022).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1 &amp; 2 (Burr hole, right or left, in the ER):</strong> Blind exploratory burr holes are largely obsolete where CT is available; they are imprecise, and localizing a lesion without imaging risks operating on the wrong side. A blown pupil is usually ipsilateral to the lesion, so a &quot;left-side&quot; burr hole would frequently be wrong.</p>\n\n<p><strong>4 (Take to the OR immediately):</strong> Premature --- without CT localization the surgeon does not know the lesion type or location. Immediate OR without imaging is reserved for the rare in-extremis, imaging-unavailable scenario.</p>\n<p><strong>Background reading:</strong> Uncal herniation \u2192 ipsilateral CN III palsy (fixed dilated pupil) \u00b1 contralateral hemiparesis. Cushing&#x27;s triad (hypertension, bradycardia, irregular respirations) is a late sign of raised ICP.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":53,"stem":"Femoral puncture for an endovascular procedure. Which of the following is true?","options":[{"letter":"1","text":"Can cause a retroperitoneal bleed causing shock."},{"letter":"2","text":"Blue toes are a frequent side effect and will resolve with observation."},{"letter":"3","text":"3-5% serious complication rate (6% total complications)."},{"letter":"4","text":"?"}],"correct":"1","explanation":"<p><strong>Why &quot;retroperitoneal bleed causing shock&quot; is correct:</strong> A high femoral puncture (above the inguinal ligament, into the external iliac artery) is the principal risk factor for retroperitoneal hemorrhage (RPH), because the vessel above the femoral head cannot be compressed against bone to achieve hemostasis (Wiley et al., Catheterization and Cardiovascular Interventions, 2002; Krishnan et al., Neurology, 2021). RPH is occult, can be rapidly fatal, and presents with unexplained hypotension/shock, back or flank pain, and a falling hematocrit. In angiographic studies, RPH occurred essentially exclusively with abnormally high (or low) arteriotomy locations and not with an optimal mid--femoral-head puncture (Sherev et al., Cath Cardiovasc Interv, 2005).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>2 (Blue toes resolve with observation):</strong> &quot;Blue toe syndrome&quot; is distal atheroembolism, not a benign self-limited event; it reflects cholesterol/thrombotic embolization and can cause tissue loss. It is neither &quot;frequent&quot; nor reliably self-resolving.</p>\n\n<p><strong>3 (3--5% serious complication rate; 6% total):</strong> Overstates serious complications. Major access-site complications are far less common --- RPH incidence is roughly 0.12--0.44%, and serious vascular complication rates overall are on the order of ~1% in the cited series.</p>\n\n<p><strong>4:</strong> Left blank in the source.</p>\n<p><strong>Background reading:</strong> Target the common femoral artery over the medial third of the femoral head (below the inferior epigastric artery, above the bifurcation). Suspect RPH in any post-catheterization patient with hypotension + back/flank pain; confirm with CT and resuscitate, reverse anticoagulation, and consider balloon tamponade, covered stent, or surgery.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":54,"stem":"Which of the following will cause inaccurate oxygen saturation readings?","options":[{"letter":"1","text":"Arrhythmia."},{"letter":"2","text":"Peripheral vasodilation."},{"letter":"3","text":"Hypoperfusion."},{"letter":"4","text":"Anemia (has to be very severe <50)."}],"correct":"3","explanation":"<p><strong>Why &quot;hypoperfusion&quot; is correct:</strong> Pulse oximetry depends on detecting a pulsatile arterial waveform. In low-flow/low-perfusion states --- shock, hypotension, hypothermia, severe vasoconstriction --- the signal-to-noise ratio falls and readings become unreliable or unobtainable (Wemple et al., New England Journal of Medicine, 2024). Guidelines explicitly caution against relying on SpO\u2082 in patients in shock and recommend arterial blood gas as the gold standard in that setting (Prescott et al., Surviving Sepsis Campaign, 2026).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1 (Arrhythmia):</strong> Irregular rhythm may cause minor beat-to-beat variability but is not a classic or major cause of inaccurate saturation values.</p>\n\n<p><strong>2 (Peripheral vasodilation):</strong> It is vaso<em>constriction</em> and poor perfusion that degrade the signal; vasodilation generally preserves or improves pulsatile flow.</p>\n\n<p><strong>4 (Anemia, only if very severe &lt;50):</strong> The option effectively concedes anemia affects accuracy only at extreme levels. In routine ranges SpO\u2082 remains reasonably accurate; error rises meaningfully only with profound anemia (with a tendency to falsely <em>overestimate</em> saturation) (Crooks et al., Emergency Medicine Journal, 2024). Thus hypoperfusion is the single best answer.</p>\n<p><strong>Background reading:</strong> Other important sources of error: carboxyhemoglobin (falsely high), methemoglobinemia (trends toward ~85%), methylene blue and certain nail polishes (falsely low), motion artifact, and overestimation in patients with darker skin pigmentation, especially at low saturations.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":55,"stem":"What is the best way to assess cardiac output in shock?","options":[{"letter":"1","text":"Heart rate."},{"letter":"2","text":"BP."},{"letter":"3","text":"Urine output."},{"letter":"4","text":"?"}],"correct":"3","explanation":"<p><strong>Why &quot;urine output&quot; is correct:</strong> Among the bedside options offered, urine output is the best surrogate for adequate cardiac output because it reflects real-time end-organ (renal) perfusion. Oliguria (classically &lt;0.5 mL/kg/hr, or &lt;30 mL/hr in adults) is a recognized clinical hypoperfusion criterion in cardiogenic and other shock states (Samsky et al., JAMA, 2021; Waksman et al., SHARC, Circulation, 2023). Restoration of urine flow has long been advocated as a marker of restored perfusion (Padkins et al., Cath Cardiovasc Interv, 2021).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1 (Heart rate):</strong> Nonspecific; influenced by pain, fever, medications (beta-blockers), and rhythm. Tachycardia signals distress but does not quantify output.</p>\n\n<p><strong>2 (Blood pressure):</strong> Blood pressure can be maintained by compensatory vasoconstriction despite a critically low cardiac output (&quot;normotensive/compensated shock&quot;), so a normal BP does not confirm adequate output.</p>\n\n<p><strong>4:</strong> Left blank in the source.</p>\n<p><strong>Background reading:</strong> Definitive cardiac-output measurement requires hemodynamic tools (pulmonary artery catheter, echocardiography, or calibrated CO monitors). Serum lactate is a complementary, sensitive marker of global hypoperfusion.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":56,"stem":"Right sided MI --- which is true?","options":[{"letter":"1","text":"Inotropes are contraindicated."},{"letter":"2","text":"ECG is inaccurate at diagnosis."},{"letter":"3","text":"Fluid resus/bolus will improve prognosis."},{"letter":"4","text":"?"}],"correct":"3","explanation":"<p><strong>Why &quot;fluid resuscitation&quot; is the best answer:</strong> The ischemic right ventricle is stiff and preload-dependent, so RV infarction with hypotension is treated first by optimizing preload with IV volume and restoring AV synchrony/physiologic rhythm; nitrates and beta-blockers are specifically avoided because they drop preload and worsen hypotension (Goldstein et al., JACC, 2024; ACC/AHA STEMI guideline, Antman et al., JACC, 2004). Early reperfusion is what most improves survival.</p>\n<p><strong>Important nuance:</strong> Volume is first-line but not unlimited --- classic hemodynamic data show that once RV/LV filling pressures are adequate, further volume loading does <em>not</em> improve cardiac index and can be harmful, at which point dobutamine (or a vasopressor-inotrope) is added (Dell&#x27;Italia et al., Circulation, 1985). So &quot;fluid improves prognosis&quot; holds as the initial maneuver in the hypotensive under-filled patient, with the caveat that over-resuscitation is counterproductive.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1 (Inotropes are contraindicated):</strong> False --- inotropic support (e.g., dobutamine) is explicitly recommended when hypotension persists after volume challenge (Goldstein et al., JACC, 2024).</p>\n\n<p><strong>2 (ECG is inaccurate at diagnosis):</strong> False --- the right-sided precordial lead V4R showing ST elevation is a sensitive, standard ECG diagnostic for RV infarction.</p>\n\n<p><strong>4:</strong> Left blank in the source.</p>\n<p><strong>Background reading:</strong> Suspect RV MI in inferior STEMI with hypotension, clear lungs, and elevated JVP (the classic triad). Confirm with V4R and echocardiography; avoid nitrates, morphine, and diuretics.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":57,"stem":"What is the acceptable urine output in a kid <1yrs?","options":[{"letter":"1","text":"0.5cc/kg/hr."},{"letter":"2","text":"1cc/kg/hr."},{"letter":"3","text":"2cc/kg/hr."},{"letter":"4","text":"3cc//kg/hr."}],"correct":"2","explanation":"<p><strong>Assessment --- disputed / answer depends on the reference used.</strong> This is a genuinely ambiguous item, and the exam key&#x27;s own question mark is warranted.</p>\n<p><strong>Common surgical/textbook teaching</strong> uses an age tier: **adults ~0.5 mL/kg/hr, children ~1 mL/kg/hr, and infants ~2 mL/kg/hr.** By that convention, an infant under 1 year would be **option 3 (2 cc/kg/hr).**</p>\n\n<p><strong>Contemporary pediatric guidance</strong> cites a <em>range</em> of **1--2 mL/kg/hr for infants and young children** (and 0.5--1 mL/kg/hr for older children) (Vasileiadis et al., European Journal of Pediatrics, 2024). Neonatal literature states urine output should be **at least 1 mL/kg/hr** after the first day of life (O&#x27;Brien and Walker, Paediatric Anaesthesia, 2014).</p>\n<p><strong>Bottom line for the exam:</strong> Both 1 and 2 cc/kg/hr fall within accepted infant targets. The marked answer (1 cc/kg/hr) represents the accepted <em>minimum</em>, while classic teaching for infants specifically often cites 2 cc/kg/hr. Answer as the source intends (1 cc/kg/hr) but recognize option 3 is equally defensible depending on the reference.</p>\n<p><strong>Why 0.5 and 3 cc/kg/hr are less correct:</strong></p>\n<p><strong>1 (0.5 cc/kg/hr):</strong> This is the <em>adult</em> oliguria threshold; it is too low for an infant, whose obligate urine output is higher due to limited renal concentrating ability.</p>\n\n<p><strong>4 (3 cc/kg/hr):</strong> Above the usual target range; sustained output this high suggests a concentrating defect or over-resuscitation rather than a &quot;normal acceptable&quot; minimum.</p>\n<p><strong>Background reading:</strong> Infants have higher weight-indexed water turnover and lower maximal urinary concentrating ability than adults, which is why acceptable urine output per kg is higher in the youngest patients.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":58,"stem":"A child comes to your emergency department with a two day history of left knee and hip pain worse with weight bearing. The pain has worsened and now he can't walk on that leg. He has a fever of 38.5 degrees. His WBC is 15. His CRP is 10 and ESR is 40. Upon exam he won't let you move his left hip and cries out in pain. What is should you do?","options":[{"letter":"1","text":"Obtain urgent MRI."},{"letter":"2","text":"Start Cloxacillin IV."},{"letter":"3","text":"Obtain urgent CT scan."},{"letter":"4","text":"Obtain ultrasound guided aspiration of the hip joint."}],"correct":"4","explanation":"<p><strong>Why &quot;ultrasound-guided aspiration&quot; is correct:</strong> This child meets all four Kocher criteria for septic arthritis of the hip --- fever, inability to bear weight, elevated ESR, and leukocytosis --- giving a probability of septic arthritis over ~90% (Marin et al., AAP Technical Report, 2024). Definitive diagnosis requires synovial fluid analysis (cell count/differential, Gram stain, culture); imaging alone cannot distinguish septic arthritis from transient synovitis. Ultrasound confirms the effusion and guides accurate aspiration, and US-guided hip aspiration is highly accurate for diagnosing (and can help avoid unnecessary arthrotomy for) septic hip arthritis (Shet et al., ACR Appropriateness Criteria, 2022; PIDS/IDSA guideline, 2024). Septic arthritis is a surgical emergency --- the joint must be sampled and, if purulent, drained promptly to prevent cartilage destruction.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1 (Urgent MRI):</strong> MRI is valuable when osteomyelitis or adjacent soft-tissue infection is suspected, or when ultrasound is negative, but it does not provide the fluid needed for definitive diagnosis and should not delay aspiration.</p>\n\n<p><strong>2 (Start Cloxacillin IV):</strong> Antibiotics are essential, but arthrocentesis/aspiration should generally be obtained <em>first</em> to preserve culture yield --- unless the child is ill-appearing/septic, in which case antibiotics are given without delaying resuscitation (PIDS/IDSA, 2024). Antibiotics alone are inadequate management of a septic joint.</p>\n\n<p><strong>3 (Urgent CT scan):</strong> CT adds radiation, has uncertain accuracy for septic arthritis, and is not the diagnostic modality of choice.</p>\n<p><strong>Background reading:</strong> Kocher criteria (fever &gt;38.5\u00b0C, non-weight-bearing, ESR &gt;40, WBC &gt;12k). Most common organism overall is <em>Staphylococcus aureus</em>; <em>Kingella kingae</em> predominates in ages 6 months--4 years.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":59,"stem":"Mesenchymal cells can be transformed into osteoblasts which are responsible for building bone. Which substance is responsible for the transformation of mesenchymal cells into osteoblasts?","options":[{"letter":"1","text":"Calcium."},{"letter":"2","text":"Parathyroid hormone."},{"letter":"3","text":"Bone morphogenetic protein."},{"letter":"4","text":"RANKL."}],"correct":"3","explanation":"<p><strong>Why &quot;bone morphogenetic protein&quot; is correct:</strong> BMPs (members of the TGF-\u03b2 superfamily; notably BMP-2, -4, -6, -7, -9) bind BMP receptors and activate SMAD 1/5/8 signaling, upregulating RUNX2 --- the master transcription factor that commits mesenchymal stem cells to the osteoblast lineage and drives bone formation (Zhu et al., Cell Discovery, 2024; Aslani et al., Journal of Cellular Physiology, 2019). Recombinant human BMP-2 is FDA-approved and used clinically to promote bone regeneration in place of autograft (Kim et al., Experimental &amp; Molecular Medicine, 2025).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1 (Calcium):</strong> A substrate for mineralization of osteoid, not a signal that transforms mesenchymal cells into osteoblasts.</p>\n\n<p><strong>2 (Parathyroid hormone):</strong> Regulates calcium homeostasis; net effect is typically catabolic on bone (continuous exposure), though intermittent PTH is anabolic. It is not the differentiation signal in question.</p>\n\n<p><strong>4 (RANKL):</strong> Drives osteo<em>clast</em> differentiation and bone <em>resorption</em> (RANKL--RANK interaction), the opposite of osteoblastic bone building.</p>\n<p><strong>Background reading:</strong> RUNX2 and Osterix (SP7) are key osteoblast transcription factors; the RANKL/RANK/OPG axis governs osteoclast activity and bone remodeling balance.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":60,"stem":"Normal anion gap metabolic acidosis caused by","options":[{"letter":"1","text":"Diarrhea."},{"letter":"2","text":"Methanol."},{"letter":"3","text":"Shock."},{"letter":"4","text":"DKA."}],"correct":"1","explanation":"<p><strong>Why &quot;diarrhea&quot; is correct:</strong> Diarrhea causes gastrointestinal loss of bicarbonate; to preserve electroneutrality, chloride is retained, producing a hyperchloremic, <em>normal</em> anion gap metabolic acidosis (Berend et al., New England Journal of Medicine, 2014; Korang et al., Cochrane, 2021). The urinary anion gap is negative in diarrheal acidosis (intact renal ammonium excretion), helping distinguish it from renal tubular acidosis.</p>\n<p><strong>Why the others are incorrect (all cause an ELEVATED anion gap):</strong></p>\n<p><strong>2 (Methanol):</strong> Accumulation of formic acid --- a classic high-anion-gap acidosis (and elevated osmolar gap).</p>\n\n<p><strong>3 (Shock):</strong> Tissue hypoperfusion generates lactic acid --- a high-anion-gap acidosis.</p>\n\n<p><strong>4 (DKA):</strong> Ketoacid accumulation (\u03b2-hydroxybutyrate, acetoacetate) --- a high-anion-gap acidosis.</p>\n<p><strong>Background reading:</strong> Normal (hyperchloremic) anion gap acidosis mnemonic &quot;HARDUPS/USED CARP&quot; --- GI bicarbonate loss (diarrhea), renal tubular acidosis, carbonic anhydrase inhibitors, ureteral diversion, saline infusion. High anion gap mnemonic &quot;GOLD MARK&quot; or &quot;MUDPILES&quot; --- methanol, uremia, DKA, propylene glycol, isoniazid, lactate, ethylene glycol, salicylates.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":61,"stem":"What is the best dressing to use following the application of a split-thickness skin graft:","options":[{"letter":"1","text":"Wet-to-dry gauze."},{"letter":"2","text":"Flamazine."},{"letter":"3","text":"Mafenide-acetate."},{"letter":"4","text":"VAC dressing."}],"correct":"4","explanation":"<p><strong>Why VAC dressing is correct:</strong> Negative-pressure wound therapy (NPWT/VAC) is the only graft-fixation method shown in randomized trials and meta-analyses to <em>improve</em> graft take versus conventional dressings. A 2025 meta-analysis of 16 RCTs found NPWT produced ~8% higher overall graft take, higher graft success (OR 1.86), and lower graft loss and reoperation rates (Lee et al., JPRAS, 2025). A dedicated RCT in irregular, high-mobility areas showed take of 97.2% versus 90.2% for tie-over bolster (Cao et al., Plastic and Reconstructive Surgery, 2022). NPWT applies uniform pressure, eliminates shear, and evacuates hematoma/seroma --- the three main causes of early graft failure.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>Wet-to-dry gauze</strong> is a debridement dressing; it disrupts the delicate fibrin/neovascular interface and causes shear, both of which reduce take.</p>\n\n<p><strong>Flamazine (silver sulfadiazine)</strong> is a topical antimicrobial for burn wounds; it does not secure a graft and its pseudo-eschar can impair take.</p>\n\n<p><strong>Mafenide-acetate</strong> is a topical antimicrobial used for burn eschar (penetrates cartilage); it is not a graft-securing dressing.</p>\n<p><strong>Background:</strong> A tie-over bolster remains a widely used and acceptable standard, and evidence for NPWT superiority is limited by RCT quality (Patel et al., Annals of Plastic Surgery, 2021). Among the four options offered, however, VAC is the best-supported answer. Optimal negative pressure appears to be ~80 mmHg.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":62,"stem":"A patient sustained a burn to his distal left leg 20 years ago. This required skin grafting and it healed well causing no issue for many years. Recently, the exact same location of his previous burn injury has begun to discharge fluid and appears mildly ulcerated. What should you do to manage this patient?","options":[{"letter":"1","text":"Apply a VAC to the wound."},{"letter":"2","text":"Re-excision and graft."},{"letter":"3","text":"Silver sulfadiazine and observe."},{"letter":"4","text":"Biopsy the lesion."}],"correct":"4","explanation":"<p><strong>Why biopsy is correct:</strong> A chronic burn scar that breaks down and ulcerates after a long latency is a <strong>Marjolin ulcer</strong> (malignant transformation) until proven otherwise. Squamous cell carcinoma accounts for ~71% of scar malignancies, with a mean latency exceeding 30 years (Ma et al., Archives of Dermatological Research, 2024). The uniform recommendation is prompt biopsy of any suspicious mass or non-healing ulcer within a chronic burn scar (Al-Zacko, Burns, 2013; Sisti et al., Journal of Burn Care &amp; Research, 2018). Tissue diagnosis dictates the extent of subsequent excision and the need for nodal staging.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>Apply a VAC</strong> treats the wound as benign and delays a cancer diagnosis.</p>\n\n<p><strong>Re-excision and graft</strong> is premature without a histologic diagnosis --- margins and reconstruction depend on tumor type, depth, and stage; blind grafting risks recurrence under the graft.</p>\n\n<p><strong>Silver sulfadiazine and observe</strong> treats it as a simple chronic wound and dangerously delays diagnosis of an aggressive malignancy.</p>\n<p><strong>Background:</strong> Marjolin ulcers are aggressive with a substantial local recurrence and nodal metastasis rate. Because pseudoepitheliomatous hyperplasia can mimic SCC, generous or repeat biopsy is often required.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":63,"stem":"A patient presents to the ER in septic shock. He is febrile at 38.7 degrees. His heart rate is 105. His respiratory rate is 26. His O2 sat is 98% on 2L nasal prongs. His blood pressure is 88/56 after 2L of crystalloid. His WBC is 3.0. His CVP is 4. How many of the SIRS qualifying criteria does this patient have?","options":[{"letter":"1","text":"Three."},{"letter":"2","text":"Four."},{"letter":"3","text":"Five."},{"letter":"4","text":"Six."}],"correct":"2","explanation":"<p><strong>Why four is correct:</strong> The four SIRS criteria are temperature &gt;38\u00b0C or &lt;36\u00b0C, heart rate &gt;90/min, respiratory rate &gt;20/min (or PaCO\u2082 &lt;32 mmHg), and WBC &gt;12 or &lt;4 \u00d710\u2079/L (or &gt;10% bands). This patient meets all four:</p>\n<p><strong>Temperature 38.7\u00b0C</strong> (&gt;38) \u2713</p>\n\n<p><strong>Heart rate 105</strong> (&gt;90) \u2713</p>\n\n<p><strong>Respiratory rate 26</strong> (&gt;20) \u2713</p>\n\n<p><strong>WBC 3.0</strong> (&lt;4) \u2713</p>\n<p><strong>Why the others are incorrect:</strong> There are only four SIRS criteria in total, so &quot;five&quot; and &quot;six&quot; are impossible. &quot;Three&quot; undercounts --- the leukopenia (WBC 3.0) is the easily missed fourth criterion (low WBC counts just as much as high). Blood pressure, O\u2082 saturation, and CVP are <strong>not</strong> SIRS criteria (they define shock/organ dysfunction, not SIRS).</p>\n<p><strong>Background:</strong> SIRS \u22652 with suspected infection was the older sepsis definition. Sepsis-3 (2016) replaced SIRS with the SOFA/qSOFA framework because SIRS is neither sensitive nor specific, but SIRS counting remains a common exam item.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":64,"stem":"A 60 [kg] patient arrives in the ER with third degree burns to his entire chest and abdomen as well as the entire backs of both legs. How much fluid will they require in the first 8 hours of their resuscitation?","options":[{"letter":"1","text":"Normal saline at 540 mL/hr."},{"letter":"2","text":"Lactated Ringer's at 540 mL/hr."},{"letter":"3","text":"Normal saline at 405 mL/hr."},{"letter":"4","text":"Lactated Ringer's at 405 mL/hr."}],"correct":"2","explanation":"<p><strong>Why LR at 540 mL/hr is correct:</strong> The Parkland formula gives 4 mL \u00d7 weight (kg) \u00d7 %TBSA over 24 hours, with <strong>half in the first 8 hours</strong>, using <strong>lactated Ringer&#x27;s</strong>.</p>\n<p>TBSA burned = anterior trunk (chest + abdomen, 18%) + posterior surface of both legs (9% each, 18%) = <strong>36%</strong>.</p>\n\n<p>24-hour volume = 4 \u00d7 60 \u00d7 36 = <strong>8,640 mL</strong>.</p>\n\n<p>First 8 hours = half = 4,320 mL \u2192 <strong>4,320 \u00f7 8 = 540 mL/hr</strong>.</p>\n<p>Lactated Ringer&#x27;s is the crystalloid of choice; the ABRUPT trial confirmed the 4 mL/kg/%TBSA target is accurate for burns &gt;20% TBSA (Greenhalgh et al., Annals of Surgery, 2023).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>Options with 405 mL/hr</strong> correspond to ~27% TBSA and undercount the posterior legs.</p>\n\n<p><strong>Normal saline options</strong> are wrong on fluid type --- large-volume NS causes hyperchloremic metabolic acidosis and is not the Parkland fluid; LR&#x27;s balanced composition and mild anti-inflammatory effect make it preferred (Greenhalgh, NEJM, 2019).</p>\n<p><strong>Background:</strong> The Parkland estimate is only a <em>starting</em> rate; all subsequent titration is to urine output (0.5--1.0 mL/kg/hr in adults). Over-resuscitation (&quot;fluid creep&quot;) causes compartment syndromes and ARDS.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":65,"stem":"A 6 week old male is seen in the ER with a history of projectile vomiting for the previous 48 hours. He had weighed 4 kg last week when he was seen at his well back check. Now the child weighs 3.6 kg and has a flattened anterior fontanelle. On abdominal exam, a palpable olive sized mass is detected in the right of midline in the RUQ. A capillary blood gas and electrolyte panel are ordered and the most likely pattern would be:","options":[{"letter":"1","text":"Na 135, K 3.0, Cl 65, HCO3 20."},{"letter":"2","text":"Na 130, K 2.5, Cl 88, HCO3 28."},{"letter":"3","text":"Na 135, K 2.5, Cl 112, HCO3 30."},{"letter":"4","text":"Na 135, K 3.5, Cl 103, HCO3 14."}],"correct":"2","explanation":"<p><strong>Why option 2 is correct:</strong> This is classic infantile hypertrophic pyloric stenosis, which produces a <strong>hypochloremic, hypokalemic metabolic alkalosis</strong> from loss of gastric HCl in the vomitus (van den Bunder et al., Paediatric Anaesthesia, 2020). Option 2 is the only pattern showing all three: low chloride (88), low potassium (2.5), and elevated bicarbonate (28).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>Option 1</strong> has a low-ish Cl but a <em>normal</em> HCO\u2083 (20) and thus no alkalosis.</p>\n<p><strong>Option 3</strong> has an elevated chloride (112) --- the opposite of the expected hypochloremia.</p>\n<p><strong>Option 4</strong> shows a low HCO\u2083 (14) --- a metabolic <em>acidosis</em>, the reverse of the expected picture.</p>\n<p><strong>Background:</strong> Ongoing vomiting plus volume depletion activates the RAAS; the kidney conserves Na\u207a and water at the expense of K\u207a and H\u207a, producing <strong>paradoxical aciduria</strong> despite systemic alkalosis. Pyloric stenosis is a <em>medical</em> emergency first --- fluid and electrolyte correction must precede pyloromyotomy.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":66,"stem":"The American Society of Anesthesiologist (ASA) classification for a 45 year old, poorly-controlled type 2 diabetic (blood glucose measurements usually 8-12), with a BMI of 39 is:","options":[{"letter":"1","text":"I."},{"letter":"2","text":"II."},{"letter":"3","text":"III."},{"letter":"4","text":"IV."}],"correct":"3","explanation":"<p><strong>Why III is correct:</strong> The 2020 ASA Physical Status statement lists <strong>&quot;poorly controlled DM ... with or without end organ dysfunction&quot;</strong> as an explicit ASA III example (severe systemic disease with substantive functional limitation). The poorly controlled diabetes alone places this patient at III.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>I</strong> is a normal healthy patient.</p>\n\n<p><strong>II</strong> (mild systemic disease) covers <em>well-controlled</em>, non-insulin-dependent DM and obesity with BMI 30--40 <em>without</em> other severe disease --- but this patient&#x27;s diabetes is poorly controlled.</p>\n\n<p><strong>IV</strong> requires a severe disease that is a <em>constant threat to life</em> (e.g., recent MI, sepsis, ejection fraction severely reduced) --- not met here.</p>\n<p><strong>Background:</strong> BMI 39 is class II obesity (30--40), which by itself is ASA II; morbid obesity (BMI \u226540) is an ASA III criterion. Here it is the poorly controlled diabetes, not the BMI, that drives the classification to III.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":67,"stem":"Which of the following best describes stage III cancer?","options":[{"letter":"1","text":"T2N0M0 breast cancer."},{"letter":"2","text":"T1N1M1 melanoma."},{"letter":"3","text":"T3N2M0 colon cancer."},{"letter":"4","text":"T1sN0M0 breast cancer."},{"letter":"5","text":"T3N1M1 lung cancer."}],"correct":"3","explanation":"<p><strong>Why T3N2M0 colon cancer is correct:</strong> In colorectal cancer, any node-positive disease without distant metastasis (any T, N1--N2, M0) is <strong>stage III</strong>. T3N2M0 is regional nodal spread without metastasis --- stage III (IIIB/IIIC).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>T2N0M0 breast</strong> = node-negative, no metastasis \u2192 stage I.</p>\n\n<p><strong>T1N1M1 melanoma</strong> = M1 (distant metastasis) \u2192 stage IV by definition.</p>\n\n<p><strong>T1sN0M0 breast</strong> = Tis (carcinoma in situ) \u2192 stage 0.</p>\n\n<p><strong>T3N1M1 lung</strong> = M1 \u2192 stage IV.</p>\n<p><strong>Background:</strong> The unifying rule: <strong>any M1 = stage IV</strong>, and <strong>Tis/T0N0M0 = stage 0</strong>, regardless of primary site. Stage III generally denotes locoregional nodal involvement without distant spread.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":68,"stem":"Which of the following ventilation strategies is recommended for patients with ARDS?","options":[{"letter":"1","text":"Ventilator mode should be synchronized intermittent mandatory ventilation."},{"letter":"2","text":"PEEP of 5 cm H2O."},{"letter":"3","text":"Increase respiratory rate >24 breaths/min."},{"letter":"4","text":"Tidal volumes should be 6 ml/kg."}],"correct":"4","explanation":"<p><strong>Why 6 mL/kg is correct:</strong> Lung-protective ventilation with <strong>low tidal volume (~6 mL/kg predicted body weight)</strong> and plateau pressure &lt;30 cm H\u2082O is the cornerstone of ARDS management, established by the ARMA/ARDSNet trial (9% absolute mortality reduction vs 12 mL/kg) and reaffirmed by the 2023 ESICM guidelines (4--8 mL/kg PBW) (Meyer et al., Lancet, 2021; Angus et al., JAMA, 2023).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>SIMV mode:</strong> No ventilator mode has been shown superior to any other, provided lung-protective targets are respected --- so mandating SIMV is incorrect.</p>\n\n<p><strong>PEEP of 5 cm H\u2082O:</strong> 5 cm H\u2082O is only a common <em>starting</em> point that is then titrated with FiO\u2082 to oxygenation; fixing PEEP at 5 is not &quot;the strategy.&quot;</p>\n\n<p><strong>Increase RR &gt;24:</strong> Rate is raised (up to ~35/min) only to compensate for the reduced minute ventilation from low tidal volumes and to manage permissive hypercapnia --- it is a consequence, not the protective strategy itself.</p>\n<p><strong>Background:</strong> Tidal volume is based on <strong>predicted</strong> (not actual) body weight, derived from height and sex. If plateau pressure stays &gt;30 cm H\u2082O at 6 mL/kg, tidal volume is reduced further, to as low as 4 mL/kg.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":69,"stem":"What is the earliest sign of sepsis?","options":[{"letter":"1","text":"Alkalosis (secondary to tachypnea?)."},{"letter":"2","text":"Hypotension."},{"letter":"3","text":"Fever."},{"letter":"4","text":"Tachycardia."}],"correct":"1","explanation":"<p><strong>Why respiratory alkalosis is correct:</strong> Increased respiratory rate is one of the earliest and most common manifestations of sepsis, and the resulting hyperventilation produces a <strong>primary respiratory alkalosis</strong> (low PaCO\u2082) before overt hemodynamic compromise (Hotchkiss et al., Nature Reviews Disease Primers, 2016; Lelubre &amp; Vincent, Nature Reviews Nephrology, 2018). The concept being tested is that <strong>tachypnea/respiratory alkalosis precedes hypotension and shock</strong>.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>Hypotension</strong> is a <em>late</em> sign, reflecting decompensated shock after compensatory mechanisms fail.</p>\n\n<p><strong>Fever</strong> is common but is frequently absent (or replaced by hypothermia) and is not consistently the earliest change; it is also nonspecific.</p>\n\n<p><strong>Tachycardia</strong> occurs early but generally accompanies (rather than clearly precedes) the tachypnea/respiratory alkalosis emphasized in this classic teaching.</p>\n<p><strong>Background:</strong> Note the item is really testing tachypnea \u2192 respiratory alkalosis as the earliest <em>measurable</em> abnormality. Clinically, tachypnea and an unexplained respiratory alkalosis in an at-risk patient should prompt an immediate sepsis evaluation. (Respiratory rate \u226522 is also one of the three qSOFA criteria.)</p>","no_key":false,"no_options":false,"free_answer":null},{"number":70,"stem":"What is the most common heterotopic organ transplant?","options":[{"letter":"1","text":"Cornea."},{"letter":"2","text":"Liver."},{"letter":"3","text":"Heart and lung."},{"letter":"4","text":"Kidney."}],"correct":"4","explanation":"<p><strong>Why kidney is correct:</strong> A kidney transplant is placed <strong>heterotopically</strong> --- in the iliac fossa/retroperitoneum rather than the native renal bed, with anastomosis to the iliac vessels and bladder. The kidney is also by far the most commonly transplanted solid organ (~95,000/year worldwide), making it the most common heterotopic transplant (Cooper et al., Cochrane Database of Systematic Reviews, 2022).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>Cornea</strong> is replaced in its native anatomic position (orthotopic) and is avascular tissue, not a solid organ graft.</p>\n\n<p><strong>Liver</strong> transplantation is almost always <strong>orthotopic</strong> (native liver removed, graft placed in the same position).</p>\n\n<p><strong>Heart and lung</strong> transplants are standardly <strong>orthotopic</strong>; heterotopic (&quot;piggyback&quot;) heart transplantation is a rare niche procedure for selected high-risk recipients (Fl\u00e9cher et al., European Journal of Cardio-Thoracic Surgery, 2013).</p>\n<p><strong>Background:</strong> Heterotopic simply means the graft is placed in a site other than the native anatomic position. The kidney is the prototypical heterotopic transplant --- this same concept underlies Question 2 of this exam (femoral nerve injury from an iliac-fossa kidney graft).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":71,"stem":"The Bonferroni correction is:","options":[{"letter":"1","text":"Used as a measure of variability of measurements across subjects."},{"letter":"2","text":"A method used to counteract the problem of multiple comparisons."},{"letter":"3","text":"Used to compare two heterogenous populations."},{"letter":"4","text":"The ratio of the probabilities of two events."}],"correct":"2","explanation":"<p><strong>Why 2 is correct:</strong> Each time a statistical test is run on the same data, the probability of at least one false-positive (type I error) rises --- the family-wise error rate (FWER). The Bonferroni correction controls this by dividing the target alpha (e.g., 0.05) by the number of comparisons, so with 10 tests only p \u2264 0.005 is considered significant. It is the best-known, if most conservative, multiplicity adjustment (Guglielmetti et al., Langenbeck&#x27;s Archives of Surgery, 2022; Yassin et al., PLoS One, 2024).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1 (variability across subjects):</strong> describes the standard deviation/variance, not a multiplicity correction.</p>\n\n<p><strong>3 (comparing two heterogeneous populations):</strong> describes a between-group comparison test (e.g., t-test), not an alpha adjustment.</p>\n\n<p><strong>4 (ratio of probabilities of two events):</strong> describes a relative risk or odds ratio.</p>\n<p><strong>Background:</strong> Because Bonferroni is stringent (it reduces true positives as well as false ones), less conservative alternatives such as the Holm-Bonferroni and Benjamini-Hochberg methods are often preferred.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":72,"stem":"What is the most common brain tumor?","options":[{"letter":"1","text":"Metastases."},{"letter":"2","text":"Astrocytoma (most common primary)."},{"letter":"3","text":"Meningioma."},{"letter":"4","text":"Glioblastoma."}],"correct":"1","explanation":"<p><strong>Why 1 is correct:</strong> Brain metastases are roughly nine times more common than primary brain tumors and affect 30--40% of patients with cancer. Lung (most frequent source), breast, and melanoma account for the majority (Parida &amp; Malladi, Nature Reviews Cancer, 2025; Achrol et al., Nature Reviews Disease Primers, 2019).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>2 (astrocytoma) / 4 (glioblastoma):</strong> Glioblastoma is the most common <em>malignant primary</em> brain tumor (~14% of all primary tumors, ~51% of malignant ones), but primary tumors as a whole are far outnumbered by metastases.</p>\n\n<p><strong>3 (meningioma):</strong> the most common <em>non-malignant primary</em> CNS tumor (~40% of primary tumors), but again a primary tumor and less common than metastatic disease overall (Ostrom et al., CBTRUS, Neuro-Oncology).</p>\n<p><strong>Background:</strong> The distinction the question tests is &quot;most common tumor overall&quot; (metastatic) versus &quot;most common primary&quot; (glioblastoma malignant; meningioma non-malignant).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":73,"stem":"What is the indication for thoracotomy with ongoing chest tube drainage in hemothorax if it initially put out 750 mL?","options":[{"letter":"1","text":"100 mL/h for 2-4 hours."},{"letter":"2","text":"200 mL/h for 2-4 hours."},{"letter":"3","text":"500 ml/h for 2-4 hours."},{"letter":"4","text":"800 ml/h for 2-4 hours."}],"correct":"2","explanation":"<p><strong>Why 2 is correct:</strong> The classic ATLS/trauma teaching is that operative intervention is indicated for an initial chest-tube output &gt;1,500 mL or ongoing drainage of &gt;200 mL/h for 2--4 hours (or persistent transfusion requirement to maintain hemodynamic stability). The AAST/ACS damage-control protocol cites this exact figure: &quot;&gt;1500 mL output on initial placement or &gt;200 mL/h for 2 to 4 hours&quot; (LaGrone et al., AAST/ACS, 2024; Deshpande et al., JOMI, 2024).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1 (100 mL/h):</strong> below the accepted surgical threshold.</p>\n\n<p><strong>3 (500 mL/h) / 4 (800 mL/h):</strong> these rates would prompt intervention but are well above the established cut-off; the lowest ongoing rate meeting the criterion is the intended answer, and no guideline uses 500 or 800 mL/h as the defined threshold.</p>\n<p><strong>Background:</strong> Exact numbers vary slightly by source (WSES: &gt;200 mL/h over 3 consecutive hours; updated German trauma guidance has moved toward &quot;ongoing relevant blood loss&quot; rather than a fixed number), and current practice emphasizes overall physiologic status over any single volume. VATS, not a second chest tube, is preferred for a retained clotted hemothorax.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":74,"stem":"The absence of which micronutrient will impair wound healing:","options":[{"letter":"1","text":"Ca."},{"letter":"2","text":"Zn."},{"letter":"3","text":"Cu."},{"letter":"4","text":"Fe."}],"correct":"2","explanation":"<p><strong>Why 2 is correct:</strong> Zinc is a cofactor for &gt;300 enzymes involved in DNA and protein synthesis, and its deficiency is a well-established cause of delayed/impaired wound healing, skin breakdown, and increased infection risk. Zinc deficiency reduces the inflammatory-phase cytokine response (IL-1\u03b2, TNF-\u03b1) and neutrophil infiltration required for normal healing (Livingstone, Nutrition in Clinical Practice, 2015; Lim et al., Journal of Nutrition, 2004).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1 (calcium):</strong> essential for coagulation and bone, but not the classic micronutrient tied to impaired soft-tissue wound healing.</p>\n\n<p><strong>3 (copper):</strong> copper (via lysyl oxidase and the chaperone Atox1) does contribute to collagen cross-linking and angiogenesis, but overt copper-deficient wound failure is far less commonly tested/encountered than zinc deficiency.</p>\n\n<p><strong>4 (iron):</strong> important for oxygen delivery and collagen synthesis (as a cofactor with vitamin C for prolyl hydroxylase), but zinc is the single best answer among the choices.</p>\n<p><strong>Background:</strong> Vitamin C and protein deficiencies are the other classically tested nutritional causes of poor wound healing.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":75,"stem":"What is most common cancer that metastasizes to bone?","options":[{"letter":"1","text":"Adrenal."},{"letter":"2","text":"Thyroid (most commonly breast, prostate, lung, thyroid, kidney)."},{"letter":"3","text":"Liver."},{"letter":"4","text":"Colon."}],"correct":"2","explanation":"<p><strong>Why 2 is correct (among these choices):</strong> Thyroid carcinoma is one of the five classic osteotropic (&quot;bone-seeking&quot;) malignancies --- breast, prostate, lung, kidney, and thyroid --- and characteristically produces osteolytic bone metastases. Of the four options offered, thyroid is the only established bone-seeking primary (Coleman et al., Nature Reviews Disease Primers, 2020; Bruschi et al., Cancer Medicine, 2025).</p>\n<p><strong>Important caveat / partial disagreement:</strong> As worded (&quot;most common cancer that metastasizes to bone&quot;), thyroid is <strong>not</strong> the true answer in absolute terms. Breast (~70% bone-metastasis prevalence), prostate (~85%), and lung dominate clinical bone-metastatic disease, and because of their high incidence they account for &gt;80% of all patients with metastatic bone disease. Thyroid carries only a ~6% bone-metastasis prevalence. The question is defensible only because it restricts the choices to adrenal, thyroid, liver, and colon --- none of which except thyroid is a classic bone-seeking tumor.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1 (adrenal) / 3 (liver) / 4 (colon):</strong> none are among the classic osteotropic primaries; colon and liver metastasize preferentially to liver/lung, and bone involvement is uncommon (colon ~1%).</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":76,"stem":"Fractures undergoing secondary bone healing progress through a series of stages. What is occurring at the stage where soft callus becomes evident?","options":[{"letter":"1","text":"Reduction in inflammation and relief of pain."},{"letter":"2","text":"A soft tissue bridge forms after 21 to 28 days."},{"letter":"3","text":"Mineralization occurring 2-6 months after fx."},{"letter":"4","text":"The fracture is completely healed at that time."}],"correct":"1","explanation":"<p><strong>Why 1 is correct:</strong> Secondary (endochondral) bone healing proceeds through four overlapping phases: (a) acute inflammation/hematoma, (b) soft callus formation, (c) hard callus formation, and (d) remodeling. The soft callus phase begins only after the acute inflammatory phase resolves --- a fibrocartilaginous (granulation/cartilage) scaffold forms as inflammation subsides, which clinically corresponds to decreasing pain and swelling. Thus, &quot;reduction in inflammation and relief of pain&quot; is the process coinciding with the appearance of soft callus (Hofbauer et al., Journal of Clinical Investigation, 2024; Han et al., Advanced Materials, 2024).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>2 (soft tissue bridge after 21--28 days):</strong> the soft callus/fibrocartilaginous bridge begins forming within the first days-to-weeks after injury, not specifically at 21--28 days; the timing stated overstates when the soft callus first appears.</p>\n\n<p><strong>3 (mineralization at 2--6 months):</strong> this describes the hard callus phase (endochondral ossification, woven bone), which follows the soft callus stage.</p>\n\n<p><strong>4 (completely healed):</strong> describes the end of the remodeling phase, which takes months to years.</p>\n<p><strong>Caveat:</strong> The options awkwardly mix a clinical descriptor (option 1) with histologic/temporal descriptors (options 2--3), which is why the question is somewhat ambiguous; option 1 is nonetheless the best fit for what characterizes the soft callus stage.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":77,"stem":"What is the first thing you do in management of patient with ECG changes from hyperkalemia?","options":[{"letter":"1","text":"Insulin bolus."},{"letter":"2","text":"Lasix."},{"letter":"3","text":"IVF."},{"letter":"4","text":"IV calcium."}],"correct":"4","explanation":"<p><strong>Why 4 is correct:</strong> When hyperkalemia produces ECG changes (or K\u207a \u22656.5 mmol/L), the immediate first step is IV calcium (gluconate or chloride) to stabilize the cardiac cell membrane and reduce myocyte excitability, preventing lethal arrhythmia. Its effect begins within 1--3 minutes (Geldermann et al., EMJ, 2026; Sarwar et al., JACC, 2016).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1 (insulin bolus):</strong> insulin (with glucose) shifts potassium intracellularly and is a cornerstone of therapy, but it does not protect the myocardium and is given <em>after</em> membrane stabilization; it also acts more slowly (30--60 min).</p>\n\n<p><strong>2 (Lasix):</strong> loop diuretics enhance renal potassium elimination but act slowly and require adequate renal function; not the emergent first step.</p>\n\n<p><strong>3 (IVF):</strong> does not rapidly protect the heart or lower potassium.</p>\n<p><strong>Background:</strong> The classic sequence is stabilize (IV calcium) \u2192 shift (insulin/glucose, \u03b22-agonist, \u00b1 bicarbonate) \u2192 eliminate (diuretics, potassium binders, dialysis). Sodium polystyrene sulfonate is no longer recommended for acute management.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":78,"stem":"With respect to cosmetic surgery in Canada:","options":[{"letter":"1","text":"It is held to a higher legal standard than surgery done for pathology."},{"letter":"2","text":"Only done for people who are completely healthy with no medical problems."},{"letter":"3","text":"Complications of cosmetic surgery should not be required to be treated in public hospital unless the patient pays out of pocket."},{"letter":"4","text":"It should absolutely not be done in patients older than 70."}],"correct":"1","explanation":"<p><strong>Why 1 is correct:</strong> Purely elective, non-therapeutic cosmetic procedures are subject to a heightened standard of disclosure and consent under Canadian medicolegal doctrine: because there is no medical necessity, courts expect fuller disclosure of even remote risks, and the threshold for negligence/informed-consent liability is correspondingly higher than for medically indicated surgery. (This is a medicolegal/ethics teaching point; no primary clinical-trial literature addresses it directly in the retrieved sources.)</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>2 (only completely healthy patients):</strong> false --- patients with well-controlled comorbidities may undergo cosmetic surgery after appropriate risk assessment.</p>\n\n<p><strong>3 (complications not treated in public hospital unless paid):</strong> false and ethically untenable --- complications are treated as any other medical need.</p>\n\n<p><strong>4 (never over age 70):</strong> false --- age alone is not an absolute contraindication; physiologic status governs candidacy.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":79,"stem":"The Epstein Barr virus is associated with which malignancy:","options":[{"letter":"1","text":"Adult T cell leukemia."},{"letter":"2","text":"Nasopharyngeal carcinoma."},{"letter":"3","text":"Kaposi's sarcoma."},{"letter":"4","text":"Thyroid cancer."}],"correct":"2","explanation":"<p><strong>Why 2 is correct:</strong> EBV (HHV-4) is strongly and causally associated with undifferentiated nasopharyngeal carcinoma (a latency II epithelial malignancy), as well as Burkitt lymphoma, Hodgkin lymphoma, certain diffuse large B-cell lymphomas, extranodal NK/T-cell lymphoma, EBV-associated gastric carcinoma, and post-transplant lymphoproliferative disease (Damania et al., Cell, 2022; Lin et al., Journal of Medical Virology, 2026).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1 (adult T-cell leukemia):</strong> caused by HTLV-1, not EBV.</p>\n\n<p><strong>3 (Kaposi&#x27;s sarcoma):</strong> caused by HHV-8 (KSHV).</p>\n\n<p><strong>4 (thyroid cancer):</strong> no established EBV association.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":80,"stem":"What is the third most common cause of Kidney Transplan
