<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2015 Practice Exam A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F5F3;
    --surface: #FFFFFF;
    --ink: #1B2430;
    --muted: #64707D;
    --border: #DFE3E0;
    --accent: #3B7DD8;
    --accent-dark: #2A5DA8;
    --accent-tint: #EAF1FB;
    --correct: #1E8A5F;
    --correct-bg: #E7F5EE;
    --correct-border: #A9DDC4;
    --incorrect: #BF3F27;
    --incorrect-bg: #FBEAE5;
    --incorrect-border: #EFB7A8;
    --flag: #B9821A;
    --flag-bg: #FCF1DC;
    --flag-border: #ECD9AC;
    --nokey: #7C6FB0;
    --nokey-bg: #EFEBFA;
    --nokey-border: #D6CDEE;
    --explain-text: #384250;
    --claude-orange: #3B7DD8;
    --claude-orange-dark: #2A5DA8;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(27,36,48,0.06), 0 4px 14px rgba(27,36,48,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181B;
      --surface: #1E2226;
      --ink: #E8EAEC;
      --muted: #97A1A9;
      --border: #333A40;
      --accent: #5B9AE6;
      --accent-dark: #3B7DD8;
      --accent-tint: #1B2A3D;
      --correct: #58D399;
      --correct-bg: #17301F;
      --correct-border: #2D5238;
      --incorrect: #F0876D;
      --incorrect-bg: #3A211B;
      --incorrect-border: #62362A;
      --flag: #E3B04B;
      --flag-bg: #362C15;
      --flag-border: #5B4A24;
      --nokey: #BBA9F5;
      --nokey-bg: #2A2440;
      --nokey-border: #453B66;
      --explain-text: #C7CDD3;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
    }
  }
  /* Explicit user override (Settings menu), regardless of system preference */
  :root[data-theme="dark"] {
    --bg: #15181B;
    --surface: #1E2226;
    --ink: #E8EAEC;
    --muted: #97A1A9;
    --border: #333A40;
    --accent: #5B9AE6;
    --accent-dark: #3B7DD8;
    --accent-tint: #1B2A3D;
    --correct: #58D399;
    --correct-bg: #17301F;
    --correct-border: #2D5238;
    --incorrect: #F0876D;
    --incorrect-bg: #3A211B;
    --incorrect-border: #62362A;
    --flag: #E3B04B;
    --flag-bg: #362C15;
    --flag-border: #5B4A24;
    --nokey: #BBA9F5;
    --nokey-bg: #2A2440;
    --nokey-border: #453B66;
    --explain-text: #C7CDD3;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  /* Explicit full-viewport backdrop, independent of document/content height
     or the host page's own background. Covers overscroll/bounce areas on
     iOS and any gap if the rendered content is shorter than the viewport,
     both of which can otherwise reveal the host app's own background
     color showing through instead of ours. Always in sync with the
     current theme since it references the same live CSS variable. */
  .bg-fill {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: -1;
  }
  #app {
    max-width: 1180px;
    margin: 0 auto;
    padding: 20px 20px 60px;
  }
  .cw-banner {
    background: linear-gradient(135deg, var(--claude-orange), var(--claude-orange-dark));
    color: #fff;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Inter', sans-serif;
  }
  .cw-banner-inner {
    max-width: 1180px;
    margin: 0 auto;
    width: 100%;
    display: grid;
    grid-template-columns: auto 1fr auto;
    grid-template-areas: "brand score settings";
    align-items: center;
    gap: 14px;
  }
  @media (max-width: 640px) {
    .cw-banner-inner {
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "brand settings"
        "score score";
      row-gap: 10px;
    }
    /* 3 icon buttons (notes/calculator/settings) plus the full brand
       cluster (bone + "All Quizzes" pill + "OrthoWorld" title) cannot
       both fit on one row at real phone widths (~375-430px) -- confirmed
       overflowing off the right edge of the viewport at 390px wide, with
       the calculator/settings icons partly or fully cut off. Dropping
       the "OrthoWorld" text here is the fix: the bone icon + home-link
       pill still clearly brand the page (and the domain itself is
       visible in the browser chrome), and it frees enough width that
       the icon row no longer needs to shrink itself to compensate. If
       you ever add a 4th banner icon, re-measure at 375px/390px again
       before assuming this still fits -- don't just eyeball it at
       desktop width.  */
    .cw-banner-title { display: none; }
  }
  .cw-brand {
    grid-area: brand;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cw-home-link {
    color: #fff;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    background: rgba(255,255,255,0.16);
    border-radius: 999px;
    padding: 5px 12px;
    white-space: nowrap;
  }
  .cw-home-link:hover { background: rgba(255,255,255,0.28); }
  .cw-banner-score {
    grid-area: score;
    display: flex;
    justify-content: center;
    min-width: 0;
  }
  .cw-banner-icon {
    flex: 0 0 30px;
    width: 30px;
    height: 30px;
  }
  .cw-banner-title {
    font-weight: 700;
    font-size: 1.4667rem;
    letter-spacing: -0.01em;
  }
  .cw-icons {
    grid-area: settings;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cw-settings { position: relative; }
  .cw-calc { position: relative; }
  .cw-notes { position: relative; }
  .settings-gear {
    background: rgba(255,255,255,0.16);
    border: none;
    border-radius: 8px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
  }
  .settings-gear:hover { background: rgba(255,255,255,0.26); }
  .settings-panel {
    position: absolute;
    top: 42px;
    right: 0;
    width: 264px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    padding: 14px;
    z-index: 20;
    color: var(--ink);
  }
  .settings-panel.hidden { display: none; }
  .calc-panel { width: 224px; }
  .notes-popup-panel { width: 280px; }
  .calc-display {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    text-align: right;
    font-family: 'Source Serif 4', serif;
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--ink);
    overflow-x: auto;
    white-space: nowrap;
  }
  .calc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 10px;
  }
  .calc-btn {
    height: 40px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .calc-btn:hover { border-color: var(--accent); }
  .calc-op { background: var(--accent-tint); color: var(--accent-dark); }
  .calc-zero { grid-column: span 2; }
  .calc-equals { background: var(--accent); color: #fff; border-color: var(--accent); }
  .calc-equals:hover { background: var(--accent-dark); }
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .settings-row + .settings-row { margin-top: 14px; }
  .settings-label {
    font-size: 0.8667rem;
    font-weight: 600;
    color: var(--muted);
  }
  .settings-stepper {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .settings-stepper button {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: inherit;
  }
  .settings-stepper button:hover { border-color: var(--accent); color: var(--accent-dark); }
  #font-pct {
    font-size: 0.8rem;
    color: var(--muted);
    min-width: 34px;
    text-align: center;
  }
  .settings-seg {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
  }
  .settings-seg button {
    background: var(--bg);
    border: none;
    border-left: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.7333rem;
    font-weight: 600;
    padding: 5px 7px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .settings-seg button:first-child { border-left: none; }
  .settings-seg button.active { background: var(--accent); color: #fff; }
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 28px;
  }
  header.top h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 1.4rem;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header.top .sub {
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.55;
    margin-top: 6px;
  }
  .score-pill {
    display: flex;
    align-items: center;
    gap: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: 999px;
    padding: 8px 20px;
    box-shadow: var(--shadow);
  }
  .score-pill .stat { text-align: center; }
  .score-pill .stat .num { font-size: 1.1333rem; font-weight: 700; font-family: 'Source Serif 4', serif; }
  .score-pill .stat .lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .score-pill .divider { width: 1px; height: 26px; background: var(--border); }

  .layout {
    display: grid;
    grid-template-columns: 264px 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .nav-panel { order: 2; position: static; }
    .qgrid { grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); }
  }
  @media (max-width: 480px) {
    #app { padding: 14px 14px 40px; }
    header.top h1 { font-size: 1.4rem; }
    header.top { margin-bottom: 22px; gap: 16px; }
    .score-pill { padding: 7px 14px; gap: 12px; }
    .score-pill .stat .num { font-size: 1rem; }
    .score-pill .divider { height: 22px; }
    .qpanel { padding: 18px 16px 16px; min-height: 0; }
    .stem { font-size: 1.1333rem; margin-bottom: 16px; }
    .opt { padding: 11px 12px; font-size: 0.9667rem; }
    .strike-btn { flex-basis: 30px; }
    .confirm-btn { width: 100%; text-align: center; }
    .footer-nav { margin-top: 18px; padding-top: 12px; }
    .navbtn { padding: 9px 14px; font-size: 0.8667rem; }
    .position { font-size: 0.8rem; }
  }

  .nav-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    position: sticky;
    top: 16px;
    box-shadow: var(--shadow);
  }
  .notes-panel-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .notes-panel-title .grid-label { margin-bottom: 0; }
  .notes-qnum {
    font-size: 0.75rem;
    color: var(--muted);
    font-weight: 600;
  }
  .notes-textarea {
    width: 100%;
    min-height: 220px;
    resize: vertical;
    box-sizing: border-box;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
  }
  .notes-textarea:focus { outline: none; border-color: var(--accent); }
  .notes-hint {
    margin-top: 8px;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .filter-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .filter-tabs button {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 600;
    padding: 5px 9px;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
  }
  .filter-tabs button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .grid-label {
    font-size: 0.7333rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .qgrid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    max-height: 360px;
    overflow-y: auto;
    padding-right: 14px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .qgrid::-webkit-scrollbar { width: 8px; }
  .qgrid::-webkit-scrollbar-track { background: transparent; }
  .qgrid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .qgrid::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  .qgrid button {
    aspect-ratio: 1;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    position: relative;
    padding: 0;
  }
  .qgrid button.current { box-shadow: inset 0 0 0 2px var(--accent-dark); }
  .qgrid button.correct { background: var(--correct-bg); border-color: var(--correct-border); color: var(--correct); }
  .qgrid button.incorrect { background: var(--incorrect-bg); border-color: var(--incorrect-border); color: var(--incorrect); }
  .qgrid button.nokey-done { background: var(--nokey-bg); border-color: var(--nokey-border); color: var(--nokey); }
  .qgrid button .flagdot {
    position: absolute; top: 2px; right: 2px;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--flag);
  }
  .legend {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 0.7667rem;
    color: var(--muted);
  }
  .legend span.sw { display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:6px; vertical-align: -1px;}
  .reset-btn {
    margin-top: 14px;
    width: 100%;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.8rem;
    padding: 7px;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
  }
  .reset-btn:hover { color: var(--incorrect); border-color: var(--incorrect-border); }

  .qpanel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 26px 28px 22px;
    box-shadow: var(--shadow);
    min-height: 420px;
  }
  .qmeta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .qmeta .qnum {
    font-size: 0.8333rem;
    font-weight: 700;
    color: var(--accent-dark);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .flag-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid var(--border);
    padding: 5px 11px;
    border-radius: 7px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
  }
  .flag-toggle.on {
    background: var(--flag-bg);
    border-color: var(--flag-border);
    color: var(--flag);
  }
  .stem {
    font-family: 'Source Serif 4', serif;
    font-size: 1.2667rem;
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .options { display: flex; flex-direction: column; gap: 9px; }
  .opt-row { display: flex; align-items: stretch; gap: 8px; }
  .opt-row .opt { flex: 1; }
  .strike-btn {
    flex: 0 0 34px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    border-radius: 8px;
    cursor: pointer;
    color: var(--muted);
    font-size: 0.8667rem;
    font-weight: 600;
    font-family: inherit;
  }
  .strike-btn:hover { border-color: var(--muted); color: var(--ink); }
  .strike-btn.active { background: var(--ink); border-color: var(--ink); color: #fff; }
  .opt {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    text-align: left;
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    font-family: inherit;
    font-size: 1rem;
    color: var(--ink);
    transition: border-color .12s, background .12s;
  }
  .opt:hover:not(.locked):not(.struck) { border-color: var(--accent); background: var(--accent-tint); }
  .opt .letter {
    flex: 0 0 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.8333rem;
    color: var(--muted);
  }
  .opt .text { padding-top: 2px; }
  .opt.selected .letter { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opt.correct-answer { border-color: var(--correct-border); background: var(--correct-bg); }
  .opt.correct-answer .letter { background: var(--correct); border-color: var(--correct); color: #fff; }
  .opt.wrong-answer { border-color: var(--incorrect-border); background: var(--incorrect-bg); }
  .opt.wrong-answer .letter { background: var(--incorrect); border-color: var(--incorrect); color: #fff; }
  .opt.locked { cursor: default; }
  .opt.struck { cursor: default; background: var(--bg); opacity: 0.6; }
  .opt.struck .text { text-decoration: line-through; }
  .opt.pending-selected { border-color: var(--accent); background: var(--accent-tint); }
  .opt.pending-selected .letter { background: var(--accent); border-color: var(--accent); color: #fff; }

  .confirm-btn {
    margin-top: 6px;
    align-self: flex-start;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
  }
  .confirm-btn:hover:not(:disabled) { background: var(--accent-dark); }
  .confirm-btn:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
  }

  .noopts-box {
    background: var(--nokey-bg);
    border: 1px solid var(--nokey-border);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 0.9333rem;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .reveal-btn {
    margin-top: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
  }

  .explain {
    margin-top: 20px;
    border-top: 1px solid var(--border);
    padding-top: 18px;
    animation: fadein .15s ease-in;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px);} to { opacity:1; transform: translateY(0);} }
  .verdict {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .verdict.correct { background: var(--correct-bg); color: var(--correct); }
  .verdict.incorrect { background: var(--incorrect-bg); color: var(--incorrect); }
  .verdict.nokey { background: var(--nokey-bg); color: var(--nokey); }
  .verdict-emoji { font-size: 1rem; margin-left: 2px; }
  .explain-body { font-size: 0.9667rem; color: var(--explain-text); }
  .explain-body p { margin: 0 0 10px; }
  .explain-body ul { margin: 0 0 10px; padding-left: 20px; }
  .explain-body li { margin-bottom: 6px; }
  .explain-body strong { color: var(--ink); }

<script>
const QUIZ_DATA = [{"number":1,"stem":"What is the most obvious clinical sign of an impending compartment syndrome?","options":[{"letter":"1","text":"Numbness in the affected area."},{"letter":"2","text":"Absent palpable pulses in the affected compartment."},{"letter":"3","text":"Pain out of proportion to that which is expected and severe pain with passive stretch of the affected compartment."},{"letter":"4","text":"Pallor or dusky color in the affected area."}],"correct":"3","explanation":"<p>Why 3 is correct: Acute compartment syndrome is a clinical diagnosis. The earliest and most reliable findings are severe pain out of proportion to the injury (and not relieved by analgesia) plus pain on passive stretch of the muscles within the compartment (von Keudell et al., Lancet, 2015; Mortensen et al., JAMA Surgery, 2019).</p>\n<p>Why the others are incorrect:</p>\n<p>1 (Numbness/paresthesia): Sensory change occurs but is a later sign of nerve ischemia, not the earliest.</p>\n\n<p>2 (Absent pulses): Pulselessness is a late, ominous finding portending irreversible damage; a palpable pulse never rules out compartment syndrome (Broadhurst &amp; Robinson, Muscle &amp; Nerve, 2020).</p>\n\n<p>4 (Pallor/dusky color): Also a late ischemic finding.</p>\n<p>Background: The classic &quot;6 Ps&quot; (pain, pain on passive stretch, paresthesia, pallor, pulselessness, paralysis) evolve over time; pulselessness and paralysis are late. Intracompartmental pressure measurement supports equivocal cases; irreversible necrosis occurs within ~6 hours.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":2,"stem":"A 75 year old male undergoes a heterotopic kidney transplant and it is placed in the right retroperitoneal region. Post operatively he is unable to extend his knee and is having difficulty walking. He has numbness and pain on the anterior aspect of his thigh. What most likely injury has occurred?","options":[{"letter":"1","text":"Obturator nerve."},{"letter":"2","text":"Femoral nerve."},{"letter":"3","text":"Lateral femoral cutaneous nerve of thigh."},{"letter":"4","text":"Sciatic nerve."}],"correct":"2","explanation":"<p>Why 2 is correct: The femoral nerve (L2--L4) innervates the quadriceps (knee extension) and supplies sensation to the anterior thigh via the anterior cutaneous branches and the medial leg via the saphenous nerve. Loss of knee extension plus anterior thigh numbness localizes precisely to the femoral nerve, which is vulnerable to compression/retraction during retroperitoneal iliac fossa transplant.</p>\n<p>Why the others are incorrect:</p>\n<p>1 (Obturator): Supplies thigh adductors and a small medial thigh sensory patch, not knee extension.</p>\n\n<p>3 (Lateral femoral cutaneous): Purely sensory to the lateral thigh (meralgia paresthetica); no motor deficit.</p>\n\n<p>4 (Sciatic): Would cause posterior thigh/hamstring and below-knee deficits with foot drop, not isolated knee extension loss and anterior thigh sensory loss.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":3,"stem":"In terms of classification of melanoma, Clark level 4 corresponds to invasion into what layer of skin?","options":[{"letter":"1","text":"Epidermis only."},{"letter":"2","text":"Superficial papillary dermis."},{"letter":"3","text":"Reticular dermis."},{"letter":"4","text":"Deep papillary dermis."}],"correct":"3","explanation":"<p>Why 3 is correct: In the Clark model, level I = epidermis (in situ), level II = papillary dermis, level III = fills/expands the papillary dermis to the papillary--reticular junction, level IV = invasion into the reticular dermis, and level V = subcutaneous fat (Mandal\u00e0 &amp; Massi, Virchows Archiv, 2014; Tsilimigras et al., Nature Reviews Disease Primers, 2021).</p>\n<p>Why the others are incorrect:</p>\n<p>1 (Epidermis only): Clark level I.</p>\n\n<p>2 (Superficial papillary dermis): Clark level II.</p>\n\n<p>4 (&quot;Deep papillary dermis&quot;): Not a standard Clark level; the reticular dermis is the correct descriptor for level IV.</p>\n<p>Background: Since AJCC 7th/8th editions, Breslow thickness (and ulceration/mitotic rate) has replaced Clark level as the primary T-staging criterion, with Clark level retained only as a tertiary criterion in select thin lesions.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":4,"stem":"In diabetic foot ulcers what is the underlying mechanism?","options":[{"letter":"1","text":"Vasculopathy."},{"letter":"2","text":"Small vessel arthrosclerosis."},{"letter":"3","text":"Venous insufficiency."},{"letter":"4","text":"Neuropathy."}],"correct":"4","explanation":"<p>Why 4 is correct: The dominant, near-universal contributor is peripheral neuropathy (sensory loss of protective sensation, motor-driven deformity, and autonomic dryness), which combines with repetitive trauma and callus to produce ulceration (Armstrong et al., JAMA, 2023; Schaper et al., IWGDF 2023 update, 2024). The vast majority of diabetic foot ulcers involve neuropathy.</p>\n<p>Why the others are incorrect:</p>\n<p>1 (Vasculopathy) / 2 (small-vessel atherosclerosis): Peripheral arterial disease is present in up to ~50% and impairs healing, but is a contributing/compounding factor rather than the primary mechanism; the concept of an occlusive &quot;small-vessel&quot; diabetic microangiopathy as the ulcer cause is outdated.</p>\n\n<p>3 (Venous insufficiency): Causes venous stasis ulcers (typically the gaiter area), a different entity.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":5,"stem":"What antibiotic do you use to treat a cat bite?","options":[{"letter":"1","text":"Amox-clav."},{"letter":"2","text":"3rd generation cephalosporin."},{"letter":"3","text":"Vancomycin."},{"letter":"4","text":"Flagyl."}],"correct":"1","explanation":"<p>Why 1 is correct: Amoxicillin-clavulanate is first-line because it covers Pasteurella multocida (the predominant cat-bite pathogen) plus streptococci, staphylococci, and oral anaerobes (Stevens et al., IDSA SSTI guideline, 2014; Ortiz &amp; Lezcano, American Family Physician, 2023).</p>\n<p>Why the others are incorrect:</p>\n<p>2 (3rd-gen cephalosporin): Does not reliably cover anaerobes; not the standard single agent.</p>\n\n<p>3 (Vancomycin): Gram-positive coverage only; misses Pasteurella and anaerobes.</p>\n\n<p>4 (Flagyl/metronidazole): Anaerobic coverage only; misses Pasteurella and streptococci.</p>\n<p>Background: Penicillin-allergic alternatives are clindamycin plus a fluoroquinolone (adults) or clindamycin plus trimethoprim-sulfamethoxazole (children). Pasteurella is resistant to first-generation cephalosporins, macrolides (erythromycin), and clindamycin monotherapy.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":6,"stem":"What is the most common cause of carpal tunnel?","options":[{"letter":"1","text":"Anterior (volar) ganglion cyst."},{"letter":"2","text":"Trauma."},{"letter":"3","text":"Sarcoidosis."},{"letter":"4","text":"Tenosynovitis."}],"correct":"4","explanation":"<p>Why 4 is correct: Among the listed options, non-specific flexor tenosynovitis (synovial hypertrophy/edema of the flexor tendon sheaths, increasing pressure in the carpal tunnel) is the best answer for an identifiable mechanism of median nerve compression.</p>\n<p>Why the others are incorrect:</p>\n<p>1 (Ganglion cyst) and 2 (Trauma): Recognized but uncommon secondary causes.</p>\n\n<p>3 (Sarcoidosis): A rare infiltrative cause.</p>\n<p>Background: Strictly, most carpal tunnel syndrome is idiopathic; when a cause is identified, tenosynovial thickening is typical. Systemic associations include pregnancy, hypothyroidism, diabetes, rheumatoid arthritis, and amyloidosis.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":7,"stem":"What is the most sensitive method to diagnose c-diff?","options":[{"letter":"1","text":"CT abdo pelvis."},{"letter":"2","text":"Enema."},{"letter":"3","text":"Sigmoidoscopy."}],"correct":"1","explanation":"<p>Note of disagreement: This question appears to have been incompletely or inaccurately transcribed. None of the listed options is the most sensitive test for Clostridioides difficile infection, and imaging (CT) is not a diagnostic test for C. difficile itself. The most sensitive laboratory tests are stool nucleic acid amplification testing (NAAT/PCR), with reported sensitivity ~93--100% (and ~96% pooled), and toxigenic stool culture as the historical gold standard; glutamate dehydrogenase (GDH) antigen is also highly sensitive as a screen (van Prehn et al., JAMA, 2025; Kelly et al., ACG guideline, 2021; Miller et al., IDSA/ASM, 2024).</p>\n<p>If the question truly means &quot;most sensitive method&quot; of the laboratory options, the answer is NAAT/PCR (or toxigenic culture). Current guidelines favor a two-step algorithm (sensitive GDH or NAAT screen, then specific toxin EIA) because NAAT alone cannot distinguish colonization from active infection. Among the three transcribed options, none is defensible as &quot;most sensitive&quot;; endoscopy showing pseudomembranes is specific but insensitive, and CT reflects complications (e.g., toxic megacolon), not a primary diagnostic test.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":8,"stem":"In what trimester does the fetus receive the most exposure to radiation with x-rays?","options":[{"letter":"1","text":"First."},{"letter":"2","text":"Second."},{"letter":"3","text":"Third."},{"letter":"4","text":"All are equal exposure."}],"correct":"3","explanation":"<p>The item conflates two distinct concepts:</p>\n<p>Fetal radiosensitivity (risk of teratogenesis) is greatest in the first trimester during organogenesis (~weeks 2--8), when the same absorbed dose carries the highest risk of malformation.</p>\n\n<p>Fetal absorbed dose from a given maternal abdominopelvic x-ray tends to be higher later in gestation, as the enlarging uterus brings more fetal tissue into the primary beam --- which supports the marked answer &quot;third.&quot;</p>\n<p>Because the stem asks about &quot;exposure&quot; (dose received) rather than sensitivity/risk, the third trimester is the more defensible reading, and 4 (&quot;all equal&quot;) is incorrect. If the intended concept was greatest vulnerability to radiation injury, the answer would instead be the first trimester. The distinction between dose and risk should be kept in mind.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":9,"stem":"A patient has perioral tingling after having received lidocaine. What is another symptom of lidocaine toxicity?","options":[{"letter":"1","text":"Seizure."},{"letter":"2","text":"Diarrhea."},{"letter":"3","text":"Leg swelling."},{"letter":"4","text":"Nausea."}],"correct":"1","explanation":"<p>Why 1 is correct: Local anesthetic systemic toxicity (LAST) progresses from early CNS excitatory signs --- perioral/tongue numbness, metallic taste, tinnitus, visual changes, agitation --- to seizures (the most common serious CNS manifestation), then CNS depression and cardiovascular collapse at higher levels (Lavonas et al., AHA, 2023; Cao et al., AHA, 2025; Heath et al., Paediatric Anaesthesia, 2023).</p>\n<p>Why the others are incorrect:</p>\n<p>2 (Diarrhea), 3 (Leg swelling), 4 (Nausea): Not features of the LAST neuro-cardiotoxic syndrome.</p>\n<p>Background: Treatment is airway/circulatory support plus IV lipid emulsion 20%. Bupivacaine is the most cardiotoxic agent; lidocaine has a more favorable cardiovascular-collapse-to-CNS (CC/CNS) ratio.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":10,"stem":"A 21 year old girl has an injury causing possible exposure to tetanus. She had all of her childhood vaccinations and a booster at the age of","options":[{"letter":"18","text":"How do you treat?"},{"letter":"1","text":"Tetanus toxoid (Td)."},{"letter":"2","text":"Tetanus vaccination series (T Ig)."},{"letter":"3","text":"No treatment."},{"letter":"4","text":"Tetanus toxoid and vaccination series (Td + T Ig)."}],"correct":"3","explanation":"<p>Why 3 is correct: She completed a primary series and had a tetanus-containing booster 3 years ago. Per CDC/ACIP, a patient with \u22653 prior doses needs a booster only if &gt;10 years (clean minor wound) or &gt;5 years (all other/dirty wounds) since the last dose. At 3 years post-booster, no additional toxoid or immune globulin is indicated regardless of wound type (Havers et al., ACIP/CDC, 2020; ACIP Adult Immunization Schedule, 2025; Erg\u00f6n\u00fcl et al., Lancet, 2026).</p>\n<p>Why the others are incorrect:</p>\n<p>1 (Td): Not indicated within the 5-year window.</p>\n\n<p>2 (TIg) / 4 (Td + TIg): Tetanus immune globulin is reserved for high-risk (dirty) wounds in patients with incomplete/unknown primary vaccination (or immunodeficiency); this fully vaccinated patient needs neither.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":11,"stem":"In a healing three day old wound what provides the most strength?","options":[{"letter":"1","text":"Suture."},{"letter":"2","text":"Fibroblasts."},{"letter":"3","text":"Macrophages."},{"letter":"4","text":"Platelets."}],"correct":"1","explanation":"<p>Why 1 is correct: At day 3 the wound is still in the inflammatory/early proliferative phase; intrinsic tensile strength is minimal because collagen deposition has barely begun. The suture (or other closure material) provides essentially all mechanical strength during this period.</p>\n<p>Why the others are incorrect:</p>\n<p>2 (Fibroblasts): Begin collagen synthesis around days 3--5, but meaningful tensile strength from collagen accrues over the following weeks (proliferative/remodeling phases).</p>\n\n<p>3 (Macrophages): Orchestrate inflammation and debridement but do not confer tensile strength.</p>\n\n<p>4 (Platelets): Drive initial hemostasis and cytokine release (hours), not day-3 strength.</p>\n<p>Background: Wound tensile strength reaches only ~20% of final by ~3 weeks and plateaus near ~80% during remodeling over months.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":12,"stem":"A woman comes to your ER with injuries [consistent] with intimate partner violence. She is a frequent flyer and you suspect she is being abused by her husband. She has 2 young children at home. What should you do?","options":[{"letter":"1","text":"Call protective services for the woman."},{"letter":"2","text":"Bring the spouse in and confront him about what you suspect he is doing."},{"letter":"3","text":"Tell the woman you are worried about her children's safety."},{"letter":"4","text":"Be supportive and just listen to the woman and hope she will tell you about the abuse."}],"correct":"3","explanation":"<p>Why 3 is correct: A competent adult cannot be compelled to leave or to report on her own behalf (respect for autonomy), but children in a household with intimate partner violence are a distinct safety concern that triggers a physician&#x27;s duty to protect minors. Expressing concern for the children&#x27;s safety is both patient-centered and consistent with mandatory child-protection obligations.</p>\n<p>Why the others are incorrect:</p>\n<p>1 (Call protective services for the woman): Adult protective services generally apply to vulnerable/incapacitated adults, not a competent adult who has not consented.</p>\n\n<p>2 (Confront the spouse): Can escalate danger and breaches confidentiality; contraindicated.</p>\n\n<p>4 (Passively wait): Fails the duty to address child safety and provide resources/safety planning.</p>\n<p>Note: This is an ethics/policy item rather than an evidence-graded clinical question; the &quot;best&quot; answer reflects balancing autonomy with child-protection duties.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":13,"stem":"In comparing LMWH and heparin a true difference includes:","options":[{"letter":"1","text":"Binds more strongly to antithrombin."},{"letter":"2","text":"Has less bleeding than heparin."},{"letter":"3","text":"Has a shorter half life than heparin."},{"letter":"4","text":"?"}],"correct":"2","explanation":"<p>Why 2 is correct: LMWH produces a more predictable anticoagulant response with reduced nonspecific protein/cell binding and a favorable anti-Xa:anti-IIa ratio, translating into a lower bleeding tendency than unfractionated heparin (Weitz, NEJM, 1997; Jacobs, JAGS, 2003; Han et al., Am J Reprod Immunol, 2021).</p>\n<p>Why the others are incorrect:</p>\n<p>1 (&quot;Binds more strongly to antithrombin&quot;): Both act via antithrombin; LMWH does not bind antithrombin more strongly --- its shorter chains simply shift activity toward factor Xa inhibition over thrombin (IIa).</p>\n\n<p>3 (&quot;Shorter half-life&quot;): The opposite --- LMWH has a longer plasma half-life (roughly 2--4\u00d7 UFH), enabling once/twice-daily subcutaneous dosing.</p>\n<p>Background: LMWH also has ~100% subcutaneous bioavailability, needs no routine monitoring, and carries a lower risk of heparin-induced thrombocytopenia; it is renally cleared, so caution/dose adjustment applies in renal failure.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":14,"stem":"Steroid hormones modify cell physiology by binding to regulatory units on DNA. For this to occur, the molecule must first be bound by an appropriate receptor. These receptors are located in the?","options":[{"letter":"1","text":"Extracellular space."},{"letter":"2","text":"Cell membrane."},{"letter":"3","text":"Cytoplasm."},{"letter":"4","text":"Nucleus."}],"correct":"3","explanation":"<p>Why 3 is correct: Classic steroid hormones (e.g., cortisol, aldosterone, sex steroids) are lipophilic, diffuse across the cell membrane, and bind cytoplasmic receptors; the hormone--receptor complex then translocates to the nucleus to modulate gene transcription.</p>\n<p>Why the others are incorrect:</p>\n<p>1 (Extracellular space): Steroids cross the membrane; their receptors are intracellular.</p>\n\n<p>2 (Cell membrane): Peptide hormones and catecholamines use membrane receptors, not steroids.</p>\n\n<p>4 (Nucleus): Thyroid hormone and some steroid receptors (e.g., estrogen) are predominantly nuclear, but the classic teaching answer for &quot;steroid hormones&quot; as a class is the cytoplasmic receptor that subsequently acts on nuclear DNA.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":15,"stem":"If you were to pick a local anesthetic that had the longest duration of action and least cardiotoxicity which would it be?","options":[{"letter":"1","text":"Procaine."},{"letter":"2","text":"Lidocaine."},{"letter":"3","text":"Bupivocaine."},{"letter":"4","text":"Ropivicaine."}],"correct":"4","explanation":"<p>Why 4 is correct: Ropivacaine is long-acting and is less cardiotoxic than bupivacaine (lower affinity/binding duration at cardiac sodium channels), giving the best combination of long duration with reduced cardiotoxicity (Cao et al., AHA, 2025; Lavonas et al., AHA, 2023).</p>\n<p>Why the others are incorrect:</p>\n<p>1 (Procaine): Short-acting ester.</p>\n\n<p>2 (Lidocaine): Intermediate duration and less cardiotoxic than bupivacaine, but shorter-acting than ropivacaine.</p>\n\n<p>3 (Bupivacaine): Long-acting but the most cardiotoxic of the amides --- the specific agent the question is steering away from.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":16,"stem":"What is the most sensitive marker of fascial infection?","options":[{"letter":"1","text":"Grey dish water appearance."},{"letter":"2","text":"Redness and swelling."},{"letter":"3","text":"Quick spreading with fever."},{"letter":"4","text":"Purulent discharge."}],"correct":"1","explanation":"<p>Why 1 is correct: In necrotizing fasciitis, exploration reveals characteristic thin, gray, malodorous &quot;dishwater&quot; fluid with easy finger dissection along fascial planes and non-bleeding, non-contracting muscle --- findings that indicate deep fascial necrosis when overlying skin changes may still be modest.</p>\n<p>Why the others are incorrect:</p>\n<p>2 (Redness/swelling): Nonspecific; present in ordinary cellulitis.</p>\n\n<p>3 (Rapid spread with fever): Suggestive of severe soft-tissue infection but not the specific operative marker of fascial-plane involvement.</p>\n\n<p>4 (Purulent discharge): More typical of abscess/pyogenic infection than of necrotizing fasciitis, which classically lacks frank pus.</p>\n<p>Background: Necrotizing fasciitis is a surgical emergency; pain out of proportion, systemic toxicity, crepitus, and bullae are clues, but definitive diagnosis and treatment are operative debridement.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":17,"stem":"How does Coag work vs. cut on cautery?","options":[{"letter":"1","text":"High amplitude waves in short bursts."},{"letter":"2","text":"High amplitude waves continuous."},{"letter":"3","text":"Lower amplitude waves in short bursts."},{"letter":"4","text":"Lower amplitude waves continuous (CUT)."}],"correct":"1","explanation":"<p>Why 1 is correct for Coag: The coagulation mode uses a high-voltage, interrupted (low duty-cycle) waveform --- high-amplitude bursts delivered intermittently --- which produces heating that desiccates and coagulates tissue rather than cleanly vaporizing it.</p>\n<p>Why the others are incorrect (for Coag):</p>\n<p>2 (High amplitude continuous): Not the coag waveform.</p>\n\n<p>3 (Lower amplitude short bursts): Not standard.</p>\n\n<p>4 (Lower amplitude continuous): This describes the Cut mode --- a continuous, lower-voltage waveform that concentrates energy to vaporize tissue with minimal lateral thermal spread. (The stem itself labels option 4 as CUT.)</p>\n<p>Background: &quot;Blend&quot; settings interpolate between these by varying the duty cycle.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":18,"stem":"Cause of pulmonary vasoconstriction?","options":[{"letter":"1","text":"Low PaO2."},{"letter":"2","text":"Low alveolar O2 (PAO2)."},{"letter":"3","text":"Metabolic alkalosis."},{"letter":"4","text":"Low CVP."}],"correct":"2","explanation":"<p>Why 2 is correct: Hypoxic pulmonary vasoconstriction is driven primarily by low alveolar oxygen tension (PAO2), which constricts local pulmonary arterioles to divert blood from poorly ventilated to better-ventilated alveoli, optimizing ventilation--perfusion matching.</p>\n<p>Why the others are incorrect:</p>\n<p>1 (Low PaO2): Mixed venous/arterial oxygen contributes, but the principal stimulus is alveolar (PAO2), not arterial PaO2.</p>\n\n<p>3 (Metabolic alkalosis): Alkalosis tends to cause pulmonary vasodilation; acidosis/hypercapnia potentiate vasoconstriction.</p>\n\n<p>4 (Low CVP): A systemic venous pressure/volume parameter, not a determinant of hypoxic pulmonary vasoconstriction.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":19,"stem":"Which medication will decrease the therapeutic effects of warfarin?","options":[{"letter":"1","text":"Cephalosporins."},{"letter":"2","text":"Amiodarone."},{"letter":"3","text":"Beta blockers."},{"letter":"4","text":"Oral contraception."}],"correct":"4","explanation":"<p>Why 4 is correct: Estrogen-containing oral contraceptives have a procoagulant effect (increased clotting factors) that opposes warfarin, reducing its anticoagulant effect and lowering the INR.</p>\n<p>Why the others are incorrect:</p>\n<p>1 (Cephalosporins): Certain cephalosporins potentiate warfarin (disrupt vitamin K--producing gut flora / NMTT side chain), increasing INR.</p>\n\n<p>2 (Amiodarone): A potent CYP2C9/3A4 inhibitor that increases warfarin levels and INR (enhances effect) --- requires warfarin dose reduction.</p>\n\n<p>3 (Beta blockers): No clinically significant effect on warfarin&#x27;s anticoagulant activity.</p>\n<p>Background: The stem&#x27;s phrasing about &quot;inducing&quot; is loose. The clinically relevant point is that OCPs are the option that diminishes warfarin&#x27;s therapeutic (anticoagulant) effect.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":20,"stem":"Case describes a pediatric trauma patient that comes to hospital in shock. Upon two failed peripheral attempts at IV access, what is the next best immediate way of obtaining vascular access?","options":[{"letter":"1","text":"Triple lumen femoral groin CVC."},{"letter":"2","text":"Left subclavian line."},{"letter":"3","text":"Cordis in right internal jugular."},{"letter":"4","text":"Intraosseous line in proximal tibia."}],"correct":"4","explanation":"<p>Why 4 is correct: In a child in shock after two failed peripheral IV attempts (or ~90 seconds), the recommended next step is intraosseous access, classically the proximal tibia. It is fast, reliable, and allows administration of fluids, blood, and all resuscitation drugs.</p>\n<p>Why the others are incorrect:</p>\n<p>1 (Femoral CVC), 2 (Subclavian line), 3 (IJ Cordis): Central venous access is slower, more technically difficult in a hypovolemic child with collapsed veins, and carries higher procedural risk; it is not the immediate next step.</p>\n<p>Background: IO flow can be augmented with a pressure bag; central access can follow once the patient is stabilized.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":21,"stem":"Which describes the correct anatomic location of a saphenous vein cut-down?","options":[{"letter":"1","text":"2cm superior and anterior to the medial malleolus."},{"letter":"2","text":"2cm inferior and anterior to the medial malleolus."},{"letter":"3","text":"2cm superior and anterior to the lateral malleolus."},{"letter":"4","text":"2cm inferior and anterior to the lateral malleolus."}],"correct":"1","explanation":"<p><strong>Why 1 is correct:</strong> The great (long) saphenous vein has a constant, reliable course as it passes just anterior and superior to the <strong>medial</strong> malleolus, which is exactly why ATLS teaches this as the standard venous cut-down site --- the vein is superficial and predictably located there even when collapsed from hypovolemia. Anatomic and imaging studies confirm the great saphenous vein runs along the medial aspect of the ankle in the pre-malleolar region, making a small transverse incision anterosuperior to the medial malleolus the classic approach (Picquet et al., Surgical and Radiologic Anatomy, 2006; Hamada et al., Scientific Reports, 2021).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>2 (inferior and anterior to the medial malleolus):</strong> The saphenous vein courses upward from the foot; the reliable exposure point is anterosuperior, not below, the malleolus. An incision inferior to the malleolus risks encountering smaller, more variable tributaries on the dorsum of the foot.</p>\n\n<p><strong>3 and 4 (lateral malleolus):</strong> The great saphenous system is a <strong>medial</strong> structure. The lateral malleolus is the territory of the small (short) saphenous vein, which runs posterior to the lateral malleolus --- not the standard cut-down vessel and not located &quot;anterior&quot; to the lateral malleolus.</p>\n<p><strong>Background:</strong> The saphenous nerve travels immediately adjacent to the vein at the ankle and is at risk during cut-down; blunt dissection minimizes injury.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":22,"stem":"The Bacille Calmette-Gu\u00e9rin vaccine is an example of which type of immunity?","options":[{"letter":"1","text":"Passive non-specific."},{"letter":"2","text":"Passive specific."},{"letter":"3","text":"Active non-specific."},{"letter":"4","text":"Active specific."}],"correct":"3","explanation":"<p><strong>The defensible answer by standard immunology is 4 --- active specific</strong>, though the question is genuinely ambiguous. A note of disagreement with the original key follows.</p>\n<p><strong>Why the immunity is &quot;active&quot;:</strong> BCG is a <strong>live attenuated</strong> strain of <em>Mycobacterium bovis</em>. Like all vaccines, it stimulates the recipient&#x27;s own immune system to mount a response and generate immunologic memory --- this defines <strong>active</strong> immunity, as opposed to passive immunity (transfer of pre-formed antibody, e.g., IVIG or maternal IgG). All four sources reviewed and standard immunology texts classify vaccination as active immunization (Chapel and Haeney&#x27;s Essentials of Clinical Immunology, 7th ed.). This eliminates options 1 and 2.</p>\n<p><strong>Specific vs non-specific --- the crux of the dispute:</strong></p>\n<p><strong>Argument for &quot;active specific&quot; (option 4):</strong> By classical definition, a vaccine induces an <strong>antigen-specific</strong> adaptive response (MHC-restricted T-cell responses and antibody responses directed at mycobacterial antigens). On this basis BCG is active <em>specific</em> immunity, and option 4 is the technically correct textbook answer.</p>\n\n<p>**Argument for &quot;active non-specific&quot; (option 3, the original key):<strong> BCG is uniquely known for potent </strong>heterologous (&quot;non-specific&quot;) effects<em>* mediated by </em>trained immunity* --- epigenetic and metabolic reprogramming of innate immune cells that confers protection against unrelated pathogens and underlies its use as a <strong>non-specific immunostimulant in bladder cancer</strong> (Lange et al., Lancet Infectious Diseases, 2022; Isachesku et al., Scientific Reports, 2025). A surgery exam may have intended this well-known property, since BCG is the textbook example of nonspecific active immunotherapy in surgical oncology.</p>\n<p><strong>Resolution:</strong> Both readings are defensible. If the question is testing vaccine immunology, the answer is <strong>active specific (4)</strong>. If it is testing BCG&#x27;s role as a nonspecific immunostimulant/immunotherapeutic (the more likely intent given the surgical curriculum), the answer is <strong>active non-specific (3)</strong>. The original key&#x27;s choice of 3 is therefore not wrong, but it should be flagged as depending on interpretation.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":23,"stem":"Which vasopressor is also an ionotrope [inotrope]?","options":[{"letter":"1","text":"Levophed."},{"letter":"2","text":"Dobutamine."},{"letter":"3","text":"Phenylephrine."},{"letter":"4","text":"Epinephrine."}],"correct":"4","explanation":"<p><strong>Why 4 is correct:</strong> Epinephrine is a potent agonist at <strong>\u03b21</strong> (strong inotropy and chronotropy), <strong>\u03b22</strong>, and <strong>\u03b11</strong> (vasoconstriction) adrenergic receptors. It therefore acts as both a vasopressor and an inotrope, combining vasoconstriction with robust augmentation of contractility and cardiac output. The Surviving Sepsis Campaign guidelines describe epinephrine as producing &quot;combined vasoconstriction and robust inotropic and chronotropic effects,&quot; making it useful in shock with concomitant cardiac dysfunction.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1 (Levophed / norepinephrine):</strong> Primarily a potent <strong>\u03b11</strong> vasoconstrictor with only <em>mild</em> \u03b21 activity. While it does have some inotropic effect, it is classified and used chiefly as a vasopressor; epinephrine is the far more prototypical combined vasopressor-inotrope. (This makes it the second-best distractor, but epinephrine is the intended best answer.)</p>\n\n<p><strong>2 (Dobutamine):</strong> A predominantly \u03b21 (and \u03b22) agonist --- a pure <strong>inotrope/inodilator</strong> that typically <em>lowers</em> systemic vascular resistance. It is not a vasopressor; it can drop blood pressure.</p>\n\n<p><strong>3 (Phenylephrine):</strong> A pure <strong>\u03b11</strong> agonist --- a vasopressor with <strong>no</strong> \u03b2 activity and therefore <strong>no inotropy</strong>. Experimentally it worsens ventriculoarterial coupling and myocardial performance because it lacks \u03b21 effect (Ducrocq et al., Anesthesiology, 2012).</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":24,"stem":"You are a plastic surgeon, planning to do an elective cosmetic blepharoplasty procedure on a 65 year old patient who underwent angioplasty and cardiac stenting with a drug eluting stents 2 months ago and is now on plavix. They are completely asymptomatic. How do you proceed?","options":[{"letter":"1","text":"Delay surgery for 10 months then operate."},{"letter":"2","text":"Delay surgery for 4 months and then go off plavix then operate."},{"letter":"3","text":"Take off plavix immediately and proceed with surgery."},{"letter":"4","text":"Do surgery without stopping plavix."}],"correct":"1","explanation":"<p><strong>Why 1 is correct:</strong> This is a purely <strong>elective cosmetic</strong> procedure with no urgency, in a patient only <strong>2 months</strong> out from drug-eluting stent (DES) placement --- the period of highest stent thrombosis risk. The guiding principle is to defer elective surgery until dual antiplatelet therapy (DAPT) can be safely completed, and to avoid interrupting DAPT prematurely. Interrupting antiplatelet therapy in the weeks after stenting is one of the strongest risk factors for catastrophic stent thrombosis. Under the framework in force at the time of this exam, elective noncardiac surgery after DES was deferred a full <strong>12 months</strong>; with 2 months already elapsed, waiting an additional <strong>10 months</strong> completes the interval, after which surgery can proceed. For an elective cosmetic operation, delay clearly outweighs any thrombotic or bleeding risk.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>2 (delay 4 months, then stop plavix):</strong> Stopping DAPT at ~6 months total for a non-urgent cosmetic case exposes the patient to unnecessary stent-thrombosis risk when the procedure can simply be postponed until DAPT is complete.</p>\n\n<p><strong>3 (stop plavix immediately and operate):</strong> Discontinuing DAPT at 2 months post-DES and operating carries an unacceptably high risk of acute stent thrombosis, MI, and death --- never justified for cosmetic surgery.</p>\n\n<p><strong>4 (operate without stopping plavix):</strong> Also inappropriate; there is no reason to accept added perioperative bleeding risk for a discretionary procedure that can be deferred.</p>\n<p><strong>Update to current standards:</strong> Guidelines have since shortened the recommended deferral. The 2016 ACC/AHA DAPT focused update changed the delay for elective noncardiac surgery after DES to <strong>&quot;optimally at least 6 months,&quot;</strong> and the 2024 ACC/AHA perioperative guideline advises deferring elective surgery <strong>\u22656 months after PCI for chronic coronary syndrome</strong> (12 months after PCI for acute coronary syndrome), after which the P2Y12 inhibitor can be stopped while low-dose aspirin is continued (Levine et al., 2016; Kumbhani et al., ACC Scientific Statement, 2026). When clopidogrel is stopped, it is held <strong>5 days</strong> preoperatively (Douketis et al., CHEST, 2022). Under current rules, delaying ~4 more months (to reach 6 months) would be acceptable for this stable, asymptomatic patient --- but for an entirely elective cosmetic procedure, deferring until DAPT completion remains the conservative and correct approach.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":25,"stem":"What is the first sign of Malignant Hyperthermia?","options":[{"letter":"1","text":"Muscle rigidity."},{"letter":"2","text":"Increased temp."},{"letter":"3","text":"Increased ET CO2 (end tidal CO2)."},{"letter":"4","text":"Cardiac arrhythmia."}],"correct":"3","explanation":"<p><strong>Why 3 is correct:</strong> The earliest and most sensitive sign of an evolving MH crisis is an <strong>unexplained, rapidly rising end-tidal CO2</strong>, reflecting the hypermetabolic state, together with tachycardia. GeneReviews states that in classic MH &quot;the initial signs are tachycardia, rapidly rising end-tidal CO2, and tachypnea,&quot; and a JAMA clinical review lists &quot;unexplained increase in end-tidal CO2 during general anesthesia&quot; as the leading clinical sign. A scoping review similarly identifies hypercarbia and sinus tachycardia as the most common <strong>initial</strong> signs.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1 (muscle rigidity):</strong> Generalized rigidity (or masseter spasm) is highly specific --- nearly pathognomonic when combined with other signs --- but it appears <strong>after</strong> the rise in ETCO2 and heart rate, so it is not the <em>first</em> sign.</p>\n\n<p><strong>2 (increased temperature):</strong> Hyperthermia is a classic but characteristically <strong>late</strong> manifestation; temperature can rise 1--2 \u00b0C every 5 minutes once the crisis is established, but it lags the metabolic and cardiovascular signs.</p>\n\n<p><strong>4 (cardiac arrhythmia):</strong> Arrhythmias (often from hyperkalemia and catecholamine surge) develop later in the course, secondary to hypercarbia, acidosis, and rhabdomyolysis.</p>\n<p><strong>Background:</strong> Triggers are volatile inhalational anesthetics and succinylcholine. Treatment is immediate cessation of trigger, <strong>dantrolene</strong>, active cooling, and hyperventilation with 100% oxygen.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":26,"stem":"What is the purpose for the CO2 colorimeter detector?","options":[{"letter":"1","text":"Rule out intubation of right mainstem."},{"letter":"2","text":"Confirm placement of ETT in airway."},{"letter":"3","text":"Establish perfusion."}],"correct":"2","explanation":"<p><strong>Why 2 is correct:</strong> A colorimetric CO2 detector uses pH-sensitive paper that changes color (typically purple \u2192 yellow) in the presence of exhaled CO2, providing rapid <strong>qualitative</strong> confirmation that the endotracheal tube is in the trachea rather than the esophagus. AHA guidelines state that colorimetric exhaled CO2 detection or capnography is a more reliable method than auscultation, chest rise, or tube misting for confirming initial ETT placement (2025 AHA/AAP PALS guidelines).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1 (rule out right mainstem intubation):</strong> CO2 detection <strong>cannot</strong> determine tube depth. A tube in the right mainstem bronchus still registers CO2. Detecting mainstem intubation requires auscultation, chest rise assessment, or chest radiograph.</p>\n\n<p><strong>3 (establish perfusion):</strong> While quantitative capnography can <em>reflect</em> pulmonary blood flow (e.g., during CPR), the **qualitative colorimetric** device&#x27;s purpose is airway confirmation, not perfusion assessment. In low-flow states (cardiac arrest, massive PE) it may give false-negative readings despite correct tracheal placement.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":27,"stem":"What is the most common cause of esophageal perforation?","options":[{"letter":"1","text":"Esophageal instrumentation."},{"letter":"2","text":"Forceful emesis."},{"letter":"3","text":"Ingestion of foreign body."},{"letter":"4","text":"Perforating malignancy."}],"correct":"1","explanation":"<p><strong>Why 1 is correct:</strong> The majority (~60%) of esophageal perforations are <strong>iatrogenic</strong>, occurring during diagnostic or therapeutic endoscopic procedures (dilation, variceal ligation/sclerotherapy, EMR/ESD). The WSES esophageal emergencies guideline states &quot;the large majority (60%) of esophageal perforations are iatrogenic,&quot; and the ACS gastrointestinal surgical emergencies text gives 61% iatrogenic. Perforation most often occurs at the anatomic points of narrowing, especially the pharyngoesophageal junction (Killian triangle).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>2 (forceful emesis / Boerhaave syndrome):</strong> Accounts for ~15% --- the most common <strong>spontaneous</strong> (barogenic) cause, but well below iatrogenic.</p>\n\n<p><strong>3 (foreign body ingestion):</strong> ~12%.</p>\n\n<p><strong>4 (perforating malignancy):</strong> Rare, roughly ~1%.</p>\n<p><strong>Background:</strong> Mortality is 10--20%, and delay in diagnosis/treatment is the single most important predictor of death.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":28,"stem":"A patient has a AAA. Which of the following interventions will reduce his risk of rupture?","options":[{"letter":"1","text":"Improved diet."},{"letter":"2","text":"Smoking cessation."},{"letter":"3","text":"Weight loss."},{"letter":"4","text":"Physical training/exercise."}],"correct":"2","explanation":"<p><strong>Why 2 is correct:</strong> Cigarette smoking is the dominant modifiable risk factor for AAA <strong>development, expansion (growth), and rupture</strong>. The 2022 ACC/AHA aortic disease guideline states that smoking is &quot;a major risk factor for the development, growth, and complications of AAA&quot; and recommends smoking cessation as a core element of medical management. Large cohort and meta-analytic data show current smokers have roughly a 10-fold higher risk of <em>ruptured</em> AAA versus never-smokers, and that prolonged cessation reduces risk substantially toward that of never-smokers (Zheng et al., Scientific Reports, 2025; Aune et al., Scientific Reports, 2018).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>1 (improved diet), 3 (weight loss), 4 (exercise):</strong> These general cardiovascular lifestyle measures are reasonable for overall vascular health, but none has been shown to reduce AAA growth or rupture the way smoking cessation has. Notably, moderate physical activity is generally considered safe and does not increase rupture risk, but it is not an established intervention to <em>reduce</em> rupture.</p>\n<p><strong>Background:</strong> Beyond smoking cessation, blood-pressure control and management of atherosclerotic risk factors are advised, and rupture risk is chiefly driven by aneurysm diameter and expansion rate, which dictate the threshold for elective repair (typically ~5.5 cm in men).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":29,"stem":"What is the most accurate means of diagnosing a post-operative myocardial infarction?","options":[{"letter":"1","text":"Troponin."},{"letter":"2","text":"ECG."},{"letter":"3","text":"CK."},{"letter":"4","text":"CK - MB ratio."}],"correct":"1","explanation":"<p>The transcription shows both troponin (highlighted) and ECG (bolded); the single best answer is <strong>troponin</strong>.</p>\n<p><strong>Why 1 is correct:</strong> Cardiac <strong>troponin (cTn), preferably high-sensitivity assay,</strong> is the biomarker of choice for detecting myocardial injury and diagnosing MI, including in the perioperative setting. The Fourth Universal Definition of MI states that &quot;cTnI and cTnT are the preferred biomarkers recommended to both rule in and rule out myocardial injury.&quot; Troponin is more sensitive and specific than CK-MB and has been shown to identify postoperative MI better than CK-MB (Landesberg et al., JACC, 2003). This is especially important postoperatively, where ischemic symptoms are frequently masked by incisional pain and sedation.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>2 (ECG):</strong> Essential and complementary, but **not the most accurate** for postoperative MI. Postoperative ST-segment changes are common and nonspecific, and many perioperative MIs are non-ST-elevation events; ECG alone misses a large fraction. (Note: the transcribed key also bolds ECG, but troponin is the more accurate single test.)</p>\n\n<p><strong>3 (CK):</strong> Total creatine kinase is nonspecific --- it rises with skeletal muscle trauma from surgery itself, making it unreliable postoperatively.</p>\n\n<p><strong>4 (CK-MB ratio):</strong> More cardiac-specific than total CK and historically used, but inferior to troponin in both sensitivity and specificity; the CK-MB assay is now largely supplanted and is recommended only when troponin is unavailable.</p>\n<p><strong>Background:</strong> Because all cardiac and many noncardiac surgeries cause some troponin elevation, the <em>rise-and-fall pattern</em> plus supporting ischemic evidence (symptoms, ECG, imaging) --- not a single value --- establishes the diagnosis.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":30,"stem":"What is the unmeasured anion that contributes to a normal anion gap metabolic acidosis?","options":[{"letter":"1","text":"Albumin."},{"letter":"2","text":"Urea."},{"letter":"3","text":"Lactate."},{"letter":"4","text":"Chloride."}],"correct":"1","explanation":"<p><strong>Why 1 is correct:</strong> The serum anion gap is calculated as Na\u207a \u2212 (Cl\u207b + HCO\u2083\u207b). Under normal conditions the &quot;gap&quot; exists because of <strong>unmeasured anions</strong>, and the single largest contributor is <strong>albumin</strong>, a negatively charged plasma protein. Albumin accounts for the majority of the normal anion gap, which is why hypoalbuminemia lowers the measured gap (roughly 2.5 mEq/L per 1 g/dL fall in albumin) and why a corrected anion gap is used in hypoalbuminemic patients. In a <em>normal</em> anion gap (hyperchloremic) metabolic acidosis, the gap remains normal --- populated by albumin --- because lost bicarbonate is replaced by chloride to preserve electroneutrality.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>2 (Urea):</strong> Urea is <strong>uncharged</strong> (nonionic) and does not contribute to the anion gap; it contributes to osmolality, not to the anion gap.</p>\n\n<p><strong>3 (Lactate):</strong> Lactate is an unmeasured anion, but its accumulation produces a <strong>high (elevated) anion gap</strong> acidosis, not a normal-gap acidosis.</p>\n\n<p><strong>4 (Chloride):</strong> Chloride is a <strong>measured</strong> anion and appears explicitly in the anion gap formula; by definition it is not an unmeasured anion. In normal anion gap acidosis chloride <em>rises</em>, keeping the calculated gap normal.</p>\n<p><strong>Background:</strong> Normal anion gap (hyperchloremic) metabolic acidosis is caused mainly by gastrointestinal bicarbonate loss (diarrhea), renal tubular acidosis, and large-volume normal saline infusion; the urinary anion gap helps distinguish renal from extrarenal causes (Berend et al., New England Journal of Medicine, 2014).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":31,"stem":"Hyponatremia causes which of the following?","options":[{"letter":"1","text":"Increased urine output(?)."},{"letter":"2","text":"Loss of DTR."},{"letter":"3","text":"Tachycardia."},{"letter":"4","text":"Hypotension."}],"correct":"2","explanation":"<p><strong>Why loss of DTR is the intended correct answer:</strong> The clinical manifestations of hyponatremia are dominated by the neurologic consequences of cellular water shift and cerebral edema. As hyponatremia becomes more severe, patients progress from nausea, headache, and weakness to obtundation, depressed consciousness, and seizures. Depressed or lost deep tendon reflexes fit within this spectrum of CNS depression from hyponatremic encephalopathy, making option 2 the best of the four offered (Adrogu\u00e9 et al., JAMA, 2022; Castle-Kirszbaum et al., Neurosurgical Review, 2021).</p>\n<p><strong>Why the other options are incorrect:</strong></p>\n<p><strong>Increased urine output:</strong> The most common mechanism of hyponatremia is impaired water excretion (e.g., SIADH, hypovolemia, heart failure), which is associated with concentrated, low-volume urine --- not polyuria. Increased urine output would tend to correct, not cause, hyponatremia.</p>\n\n<p><strong>Tachycardia / hypotension:</strong> These are markers of intravascular volume depletion, not of hyponatremia per se. A hyponatremic patient can be hypovolemic, euvolemic, or hypervolemic; the sodium level itself does not drive heart rate or blood pressure.</p>\n<p><strong>Note:</strong> This is a weak question. &quot;Loss of DTR&quot; is classically taught as a sign of hypermagnesemia and severe hypercalcemia, and its attribution to hyponatremia is imprecise. It is defensible only as the least-wrong option.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":32,"stem":"What is the most common cause of ventricular arrhythmias in post-operative patients?","options":[{"letter":"1","text":"Hyperkalemia."},{"letter":"2","text":"Hypokalemia."},{"letter":"3","text":"Hypocalcemia."},{"letter":"4","text":"Hyponatremia."}],"correct":"2","explanation":"<p><strong>Why hypokalemia is correct:</strong> Hypokalemia is common perioperatively (from diuretics, GI losses, insulin, catecholamine surges, and alkalosis) and is a well-established trigger for ventricular arrhythmias. At the cellular level, low extracellular potassium reduces Na+/K+-ATPase activity, causing intracellular sodium and calcium overload, sarcoplasmic reticulum calcium leak, and delayed afterdepolarizations that trigger ventricular ectopy and fibrillation (Aronsen et al., J Physiol, 2015; Tazmini et al., Circ Res, 2020). The proarrhythmic risk is amplified by concurrent hypomagnesemia, ischemia, and structural heart disease (Ferreira et al., JACC, 2020).</p>\n<p><strong>Why the other options are incorrect:</strong></p>\n<p><strong>Hyperkalemia:</strong> Also arrhythmogenic, but far less common than hypokalemia in the general post-op population and more typically produces bradyarrhythmias, conduction block, and sine-wave/asystolic patterns rather than being the leading cause of ventricular arrhythmias.</p>\n\n<p><strong>Hypocalcemia:</strong> Prolongs the QT interval and can predispose to torsades, but is a less frequent post-op arrhythmia driver than potassium disturbance.</p>\n\n<p><strong>Hyponatremia:</strong> Primarily a neurologic, not a direct arrhythmogenic, disturbance.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":33,"stem":"A trauma patient was involved in a MVC. At assessment they are found to have an open tibial fracture and a closed head injury. The patient remains tachycardic and hypotensive despite resuscitation with 2L of crystalloid. What is the most likely cause?","options":[{"letter":"1","text":"Intra-cranial hemorrhage."},{"letter":"2","text":"Hemorrhage from fracture site."},{"letter":"3","text":"Missed intra-abdominal injury."}],"correct":"3","explanation":"<p><strong>Why missed intra-abdominal injury is correct:</strong> Persistent shock despite adequate crystalloid resuscitation in a trauma patient signals ongoing occult hemorrhage. The abdomen, pelvis, and retroperitoneum are classic sites that can conceal large-volume blood loss not apparent on initial survey, and rapid evaluation with FAST and pelvic imaging is directed at exactly this scenario (Cannon, NEJM, 2018). A named open tibial fracture and a closed head injury do not account for the hemodynamic picture, so an unidentified truncal source must be assumed and actively sought.</p>\n<p><strong>Why the other options are incorrect:</strong></p>\n<p><strong>Intracranial hemorrhage:</strong> Isolated intracranial bleeding does not cause hypotension in adults --- the cranial vault cannot hold enough blood to produce hemorrhagic shock. (In fact, hypotension after head injury should prompt a search for extracranial bleeding.)</p>\n\n<p><strong>Hemorrhage from the fracture site:</strong> An isolated tibial fracture typically loses on the order of a few hundred mL to ~1 L --- insufficient to sustain shock after 2 L of crystalloid, and the site is visible/compressible.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":34,"stem":"During a laparoscopic cholecystectomy a patient becomes bradycardic down to 40 bpm. What should the anesthetist do in response to this?","options":[{"letter":"1","text":"Begin transcutaneous pacing."},{"letter":"2","text":"Give atropine."},{"letter":"3","text":"Bolus phenylephrine."},{"letter":"4","text":"Continue day-trading stocks/doing sudoku/buying cars/looking at vacation properties."},{"letter":"5","text":"Epinephrine."}],"correct":"2","explanation":"<p><strong>Why atropine is correct:</strong> Acute intraoperative bradycardia during laparoscopy is usually vagally mediated (peritoneal stretch from pneumoperitoneum insufflation). First-line management is to release the pneumoperitoneum and administer atropine, a parasympatholytic that blocks the muscarinic receptor at the sinoatrial node and restores rate at doses of ~0.5--2 mg. A randomized trial in men undergoing elective laparoscopic surgery specifically demonstrated that atropine effectively treats anesthetic/vagally induced sinus bradycardia (Kusumoto et al., ACC/AHA/HRS Bradycardia Guideline, 2018).</p>\n<p><strong>Why the other options are incorrect:</strong></p>\n<p><strong>Transcutaneous pacing:</strong> Reserved for atropine-refractory, hemodynamically unstable bradycardia; not the initial step for a readily reversible vagal event.</p>\n\n<p><strong>Phenylephrine:</strong> A pure alpha-agonist raises blood pressure but has no chronotropic benefit and can reflexively worsen bradycardia.</p>\n\n<p><strong>Option 4:</strong> A joke distractor.</p>\n\n<p><strong>Epinephrine:</strong> A reasonable second-line agent if atropine fails, but not first-line for reversible vagal bradycardia given its arrhythmogenic and myocardial oxygen-demand effects.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":35,"stem":"You are called to see a patient on the ward with new unstable atrial fibrillation. What should you do as your initial intervention?","options":[{"letter":"1","text":"Metoprolol IV push."},{"letter":"2","text":"Bolus 1L crystalloid."},{"letter":"3","text":"Cardioversion."},{"letter":"4","text":"Bolus of amiodarone."}],"correct":"3","explanation":"<p><strong>Why cardioversion is correct:</strong> In hemodynamically unstable atrial fibrillation, immediate synchronized direct-current cardioversion is the treatment of choice across guidelines. This includes patients with hypotension, ischemia, or shock attributable to the arrhythmia (Chyou et al., AHA Scientific Statement, 2023; Panchal et al., AHA ACLS Guidelines, 2020).</p>\n<p><strong>Why the other options are incorrect:</strong></p>\n<p><strong>Metoprolol IV push:</strong> A rate-control agent appropriate for stable AF; in an unstable, potentially hypotensive patient a beta-blocker can precipitate further hemodynamic collapse.</p>\n\n<p><strong>1 L crystalloid bolus:</strong> May be a reasonable adjunct if a reversible trigger such as hypovolemia is suspected, but it does not address the unstable arrhythmia itself and delays definitive therapy.</p>\n\n<p><strong>Amiodarone bolus:</strong> A pharmacologic rhythm/rate agent used chiefly in stable patients or when electrical cardioversion is not immediately feasible; its onset is too slow for an unstable patient who needs urgent cardioversion.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":36,"stem":"Post op day 2 from a TURP, patient has a Na+ of 122 and a low BP. What do you do?","options":[{"letter":"1","text":"Fluid restrict."},{"letter":"2","text":"Give bolus of NS."},{"letter":"3","text":"Give a bolus of 3% sodium."},{"letter":"4","text":"Observe."}],"correct":"2","explanation":"<p><strong>Why isotonic (normal) saline is the better answer:</strong> This patient has a moderate hyponatremia (Na+ 122 mEq/L) accompanied by hypotension, which points to a hypovolemic/volume-depleted state on post-op day 2 rather than acute severe neurologic hyponatremia. Isotonic saline simultaneously restores intravascular volume and gently raises the serum sodium, which is the guideline-endorsed approach for hypovolemic hyponatremia (Adrogu\u00e9 et al., JAMA, 2022).</p>\n<p><strong>Why 3% (hypertonic) saline is not the best answer here:</strong> Hypertonic saline is reserved for hyponatremia with severe manifestations (somnolence, seizures, cardiorespiratory distress) or moderately severe symptoms (vomiting, confusion) in patients at high risk of progression --- given as 100 mL boluses of 3% saline over 10 minutes, targeting a rise of 4--6 mEq/L, with a strict 24-hour correction limit of \u226410 mEq/L (\u22648 mEq/L if at risk of osmotic demyelination) (Adrogu\u00e9 et al., JAMA, 2022; Miller et al., American Family Physician, 2023). At a sodium of 122 without described severe neurologic symptoms, and with hypotension indicating volume depletion, hypertonic saline is not first-line and risks overcorrection.</p>\n<p><strong>Why the other options are incorrect:</strong></p>\n<p><strong>Fluid restrict:</strong> Appropriate for euvolemic/hypervolemic hyponatremia (e.g., SIADH), but inappropriate and potentially harmful in a hypotensive, volume-depleted patient.</p>\n\n<p><strong>Observe:</strong> Inadequate for symptomatic hemodynamic compromise with a sodium of 122.</p>\n<p><strong>Note on classic TURP syndrome:</strong> When TURP syndrome presents acutely intraoperatively/early with severe neurologic symptoms from dilutional hyponatremia due to absorption of hypotonic irrigant, hypertonic saline is indicated. The distinguishing feature in this vignette is the hypotension and later post-op timing, which favor isotonic resuscitation.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":37,"stem":"A patient presented to the ER and is found to have dead bowel. His INR is 2.5 and he is taking warfarin at home. What should you do?","options":[{"letter":"1","text":"Take the patient to the OR immediately."},{"letter":"2","text":"Give Vitamin K and re-check INR in 6hrs."},{"letter":"3","text":"Give Prothrombin complex concentrate then take to the OR (beriplex)."},{"letter":"4","text":"Observe until INR normalizes."}],"correct":"3","explanation":"<p><strong>Why PCC-then-OR is correct:</strong> This patient needs emergent surgery for ischemic/necrotic bowel and is anticoagulated (INR 2.5). Four-factor PCC is the preferred agent for rapid warfarin reversal before urgent surgery: compared with FFP it produces faster INR correction, superior hemostasis, less transfusion, less volume, and shorter time to surgery (Rocca &amp; Ten Cate, NEJM, 2026; Tomaselli et al., ACC Expert Consensus, 2020). Dosing is weight- and INR-based (25--50 IU/kg of factor IX). IV vitamin K should be given concurrently to sustain reversal, since PCC&#x27;s effect is transient. Surgery should not be delayed for the INR to normalize on its own.</p>\n<p><strong>Why the other options are incorrect:</strong></p>\n<p><strong>Straight to OR without reversal:</strong> Operating on necrotic bowel with an INR of 2.5 invites uncontrolled surgical bleeding; reversal takes minutes and should precede/accompany transfer.</p>\n\n<p><strong>Vitamin K and recheck in 6 h:</strong> IV vitamin K alone takes 4--6 hours or longer to correct the INR --- far too slow for dead bowel, which is a surgical emergency.</p>\n\n<p><strong>Observe until INR normalizes:</strong> Unacceptable delay in a life-threatening surgical emergency.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":38,"stem":"If a patient was anticoagulated with Rivaroxaban and needs to be reversed for surgery what would you administer?","options":[{"letter":"1","text":"Give octaplex."},{"letter":"2","text":"FFP."},{"letter":"3","text":"No specific reversal agent exists (Andexanet alfa is being developed)."},{"letter":"4","text":"Vitamin K."}],"correct":"3","explanation":"<p><strong>Why option 3 was correct in 2015:</strong> At the time of this exam, no specific antidote for factor Xa i
