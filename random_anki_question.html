ovascular perfusion, granulation) (Jones et al., JAMA, 2018; Singh et al., Plastic and Reconstructive Surgery, 2020).</p>\n<p>Increased rate of wound healing \u2014 NPWT is associated with decreased wound size and shorter time to healing.</p>\n<p><strong>Note:</strong> Sources vary on whether NPWT truly increases local blood flow (some experimental data show decreased superficial perfusion with higher suction), but the classically taught &quot;does NOT decrease bacterial count&quot; is the intended exception and is the best-supported answer here.</p>","no_key":false,"no_options":false,"free_answer":null,"number":96},{"stem":"Which of the following is most useful in the pre operative cardiac assessment of a surgical patient?","options":[{"letter":"A","text":"Electrocardiogram."},{"letter":"B","text":"Cardiac Echo."},{"letter":"C","text":"Stress test."},{"letter":"D","text":"Chest X-Ray."}],"correct":"C","explanation":"<p><strong>Why it is the best of the four:</strong> Of the listed modalities, functional/stress testing provides the most useful information about inducible ischemia and functional capacity, which drives perioperative cardiac risk. A resting ECG, echo, or chest X-ray gives structural/baseline data but is far less predictive of perioperative events.</p>\n<p><strong>Caveat (current guideline nuance):</strong> The 2024 AHA/ACC perioperative guideline emphasizes that assessment of functional capacity (\u22654 METs) is the cornerstone, and routine stress testing is not recommended for low-risk patients or those with adequate functional capacity (COR 3: No Benefit). Stress testing is reserved for patients undergoing elevated-risk surgery with poor/unknown functional capacity and elevated risk by a validated tool (COR 2b) (Thompson et al., Circulation/JACC, 2024; Smilowitz &amp; Berger, JAMA, 2020). So the &quot;correct&quot; answer is best read as &quot;of these four tests, stress testing is most informative,&quot; not &quot;stress test everyone.&quot;</p>\n<p><strong>Why the others are less useful:</strong></p>\n<p>ECG \u2014 Frequently obtained but low incremental predictive value.</p>\n<p>Cardiac echo \u2014 Useful for suspected HF/valve disease, not routine risk screening.</p>\n<p>Chest X-Ray \u2014 Low yield for cardiac risk stratification.</p>","no_key":false,"no_options":false,"free_answer":null,"number":97},{"stem":"Which of the following statements concerning the anticoagulant drug Argatroban is correct?","options":[{"letter":"A","text":"Activates antithrombin."},{"letter":"B","text":"Is reversed with fresh frozen plasma."},{"letter":"C","text":"Can be monitored by the activated partial thromboplastin time."},{"letter":"D","text":"Has a 3 hour half-life."}],"correct":"C","explanation":"<p><strong>Why it is correct:</strong> Argatroban is a direct thrombin inhibitor; its anticoagulant effect at therapeutic doses correlates with the aPTT (target aPTT ratio ~1.5\u20132.5), and ACT is used during PCI (FDA label; Garcia et al./ACCP, 2012; Makris et al., British Journal of Haematology, 2013).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p>Activates antithrombin \u2014 That is the mechanism of heparins; argatroban binds thrombin&#x27;s active site directly and is antithrombin-independent.</p>\n<p>Reversed with fresh frozen plasma \u2014 There is no specific antidote; management relies on stopping the infusion (short half-life). FFP is not a reversal agent.</p>\n<p>3 hour half-life \u2014 The plasma half-life is ~45 minutes (prolonged in hepatic impairment, as it is hepatically cleared).</p>","no_key":false,"no_options":false,"free_answer":null,"number":98},{"stem":"which area in the typical tertiary hospital is at highest risk for medical errors?","options":[{"letter":"A","text":"Operating room."},{"letter":"B","text":"Intensive care unit."},{"letter":"C","text":"Inpatient wards."},{"letter":"D","text":"Emergency department."}],"correct":"A","explanation":"<p><strong>Why it is defensible:</strong> The landmark Harvard Medical Practice Study found the operating room was the single site of the largest share of adverse events (~41%) (Leape et al., NEJM, 1991). A 2024 multicenter surgical cohort likewise found operating-room adverse events (26%) second only to general care units (Duclos et al., BMJ, 2024).</p>\n<p><strong>Important caveat / competing answer:</strong> If &quot;highest risk&quot; is read as the highest per-patient rate/prevalence of errors, the intensive care unit is the setting with the highest prevalence of adverse events (estimated 15\u201351%), driven by illness severity, invasive procedures and polypharmacy (Garrouste-Orgeas et al., Annals of Intensive Care, 2012; Roncal-Red\u00edn et al., Critical Care, 2026). This question is therefore answer-dependent on &quot;most events&quot; (OR) vs &quot;highest rate&quot; (ICU).</p>\n<p><strong>Why the remaining options are lower-yield answers:</strong> Inpatient wards accumulate many events by volume but at lower acuity/rate; the emergency department has a high error rate but historically a smaller share of total inpatient adverse events.</p>","no_key":false,"no_options":false,"free_answer":null,"number":99},{"stem":"With regard to hemolytic transfusion reactions, which of the following statements is FALSE?","options":[{"letter":"A","text":"They are generally caused by ABO incompatibility."},{"letter":"B","text":"Urticaria and pruritis are the commonest symptoms."},{"letter":"C","text":"Alkalization of the urine helps prevent precipitation of hemoglobin in the kidneys."},{"letter":"D","text":"The laboratory findings include a positive direct hemoglobin test and a free hemoglobin concentration high than 5 mg/dl in a post-transfusion blood sample."}],"correct":"B","explanation":"<p><strong>Why it is false:</strong> Urticaria and pruritus are the hallmark of allergic transfusion reactions, not hemolytic ones. The most common symptom of an acute hemolytic transfusion reaction is fever/chills (~80%), often with the classic triad of fever, flank/back pain and hemoglobinuria (Delaney et al., Lancet, 2016; Panch et al., NEJM, 2019).</p>\n<p><strong>Why the other statements are true (and not the answer):</strong></p>\n<p>Generally caused by ABO incompatibility \u2014 Immune acute hemolytic reactions are usually due to ABO-incompatible red cells, most often from clerical/identification error.</p>\n<p>Urine alkalinization helps prevent hemoglobin precipitation \u2014 Supportive management includes hydration and alkalinization to protect the kidneys from free hemoglobin.</p>\n<p>Positive direct antiglobulin (Coombs) test and free hemoglobin \u2014 A newly positive direct antiglobulin test is pathognomonic of immune hemolysis, and free hemoglobin appears in plasma/urine.</p>","no_key":false,"no_options":false,"free_answer":null,"number":100},{"stem":"Which one of these oncology statements is false?","options":[{"letter":"A","text":"Barrett's esophagus is an example of metaplasia."},{"letter":"B","text":"In situ cancer means that it does not cross the basal membrane."},{"letter":"C","text":"Benign tumors are often associated with cell anaplasia."},{"letter":"D","text":"Hyperplasia happens when there is a multiplication of benign cells."}],"correct":"C","explanation":"<p><strong>Why it is false:</strong> Anaplasia (loss of differentiation, marked pleomorphism, abnormal mitoses) is a hallmark of malignancy, not benign tumors. Benign tumors are well- differentiated.</p>\n<p><strong>Why the others are true (and not the answer):</strong></p>\n<p>Barrett&#x27;s esophagus is metaplasia \u2014 Correct: replacement of squamous by columnar (intestinal) epithelium is classic metaplasia.</p>\n<p>In situ cancer does not cross the basement membrane \u2014 Correct: carcinoma in situ is confined by an intact basement membrane (no invasion).</p>\n<p>Hyperplasia is multiplication of benign cells \u2014 Correct: hyperplasia is an increase in the number of normal cells.</p>","no_key":false,"no_options":false,"free_answer":null,"number":101},{"stem":"The earliest symptoms of extremity compartment syndrome are due to tissue intolerance to hypoxia. Which of the following structures is the most sensitive to hypoxia?","options":[{"letter":"A","text":"Skin."},{"letter":"B","text":"Non-myelinated nerve."},{"letter":"C","text":"Myelinated nerve."},{"letter":"D","text":"Skeletal muscle."}],"correct":"B","explanation":"<p><strong>Why it is correct:</strong> Peripheral nerve tissue is affected earliest in compartment syndrome, and small unmyelinated C fibers (which carry pain) are the most sensitive to ischemia\u2014 explaining why pain out of proportion and paresthesia are the earliest clinical findings, well before pulselessness or paralysis (von Keudell et al., Lancet, 2015; Broadhurst &amp; Robinson, Muscle &amp; Nerve, 2020).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p>Myelinated nerve \u2014 More resistant than unmyelinated fibers; motor deficits/paralysis are later findings.</p>\n<p>Skeletal muscle \u2014 Tolerates ischemia longer (irreversible necrosis typically after several hours).</p>\n<p>Skin \u2014 Among the most ischemia-tolerant; pallor/skin changes are late.</p>","no_key":false,"no_options":false,"free_answer":null,"number":102},{"stem":"According to the NRC Classification of Operative Wounds, entrance of the genitourinary or biliary tracts in the presence of infected urine or bile, is classified as:","options":[{"letter":"A","text":"Class I wound."},{"letter":"B","text":"Class II wound."},{"letter":"C","text":"Class III wound."},{"letter":"D","text":"Class IV wound."}],"correct":"C","explanation":"<p><strong>Why it is correct:</strong> Entering the GU or biliary tract when the urine or bile is infected introduces acute, nonpurulent inflammation into the field\u2014the definition of a Class III (contaminated) wound, alongside major breaks in sterile technique, gross GI spillage, and fresh traumatic wounds (Liu et al., Cochrane, 2018; Goto et al., Cochrane, 2020, citing CDC/HICPAC).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p>Class I (Clean) \u2014 No hollow viscus entered; no inflammation.</p>\n<p>Class II (Clean-contaminated) \u2014 GU/biliary/GI tract entered under controlled conditions without infection or major spillage.</p>\n<p>Class IV (Dirty-infected) \u2014 Reserved for existing clinical purulent infection, perforated viscus, or old traumatic wounds with devitalized tissue.</p>\n<p><strong>Note:</strong> The distinction between Class III and Class IV hinges on infected-but-nonpurulent (III) versus established purulent infection/perforation (IV); infected urine/bile at controlled entry is conventionally Class III.</p>","no_key":false,"no_options":false,"free_answer":null,"number":103},{"stem":"With regard to clinical rejection in transplant medicine which of the following is true.","options":[{"letter":"A","text":"Chronic rejection is the most common."},{"letter":"B","text":"Acute rejection occurs within 12 hours."},{"letter":"C","text":"Hyper acute rejection is triggered by the donors ABO blood group antigens."},{"letter":"D","text":"Pre-transplant blood cross-matching does not decrease the incidence."}],"correct":"C","explanation":"<p><strong>Why it is correct:</strong> Hyperacute rejection results from preformed recipient antibodies\u2014 classically IgM against donor ABO blood-group antigens (and preformed anti-HLA antibodies)\u2014that bind graft endothelium, activate complement, and cause thrombotic occlusion within minutes to hours (Panebianco et al., Clinical Transplantation, 2026; Biglarnia et al., Nature Reviews Nephrology, 2018).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p>Chronic rejection is the most common \u2014 Acute (T-cell\u2013mediated) rejection is the most common clinical rejection type; the card&#x27;s own table labels acute as &quot;most common.&quot;</p>\n<p>Acute rejection occurs within 12 hours \u2014 Acute rejection develops over days to months, not hours (hours = hyperacute).</p>\n<p>Pre-transplant cross-matching does not decrease incidence \u2014 Cross-matching and ABO typing are precisely what prevent hyperacute rejection and reduce antibody-mediated rejection.</p>","no_key":false,"no_options":false,"free_answer":null,"number":104},{"stem":"A 55 yr female with a history of a mechanical aortic valve replacement 5 years ago is undergoing an abdominal hysterectomy for symptomatic fibroids causing discomfort and significant menorrhagia. What would be the most appropriate antimicrobial prophylaxis?","options":[{"letter":"A","text":"IV Ancef (was penicillin) and gentamicin."},{"letter":"B","text":"IV Ampicillin and Tobramycin."},{"letter":"C","text":"IV Clindamycin."},{"letter":"D","text":"IV Vancomycin."}],"correct":"A","explanation":"<p><strong>What is correct:</strong> For an abdominal hysterectomy, the guideline-recommended surgical site infection prophylaxis is cefazolin (Ancef). So the option containing Ancef is the most appropriate SSI prophylaxis of the four listed.</p>\n<p><strong>Disagreement / important update:</strong> The added gentamicin and the implied &quot;endocarditis coverage for a GU/GYN procedure&quot; reasoning is outdated. Current guidelines (2020 ACC/AHA Valvular Heart Disease; 2025 ESC/EACTS; reaffirmed in AAFP 2026) state that infective-endocarditis antibiotic prophylaxis is not recommended for genitourinary or gastrointestinal procedures in the absence of active infection, even in high-risk patients such as those with a prosthetic (mechanical) valve (Otto et al., Circulation/JACC, 2021; Praz et al./ESC, 2025). IE prophylaxis is now reserved chiefly for high-risk dental procedures. If, however, the patient had an active pelvic/urinary infection, treatment of that infection (with enterococcal coverage) would be indicated on its own merits.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p>IV Ampicillin and Tobramycin \u2014 This mirrors the historical (pre-2007) enterococcal GU/GI endocarditis regimen, which is no longer recommended.</p>\n<p>IV Clindamycin \u2014 A \u03b2-lactam allergy alternative; no longer favored even for dental IE prophylaxis, and not standard hysterectomy SSI prophylaxis.</p>\n<p>IV Vancomycin \u2014 Reserved for \u03b2-lactam allergy or MRSA risk, not first-line here.</p>\n<p>Bottom line: Cefazolin (Ancef) is the right drug for hysterectomy SSI prophylaxis; the gentamicin/endocarditis-prophylaxis justification does not reflect current guidelines.</p>","no_key":false,"no_options":false,"free_answer":null,"number":105},{"stem":"A complication of the use of hetastarch colloid solutions IV, which limits its use in surgical patients, is the increased risk of?","options":[{"letter":"A","text":"Bleeding."},{"letter":"B","text":"Hypochloremic alkalosis."},{"letter":"C","text":"Liver failure."},{"letter":"D","text":"Impaired pulmonary function."}],"correct":"A","explanation":"<p><strong>Why it is correct:</strong> Hydroxyethyl starch impairs coagulation (acquired von Willebrand\u2013 type defect, impaired fibrin polymerization, reduced clot firmness), increasing bleeding and transfusion requirements\u2014a dose-related, well-documented limitation (Hilbert- Carius et al., Scientific Reports, 2018; Zampieri &amp; Cavalcanti, JAMA, 2020; Lewis et al., Cochrane, 2018).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p>Hypochloremic alkalosis \u2014 Not a recognized HES effect (large-volume 0.9% saline instead tends to cause hyperchloremic metabolic acidosis).</p>\n<p>Liver failure \u2014 Not the classic limiting toxicity; the other major HES harm is acute kidney injury (and increased mortality in the critically ill), which is why regulators restricted HES.</p>\n<p>Impaired pulmonary function \u2014 Not a characteristic HES complication.</p>","no_key":false,"no_options":false,"free_answer":null,"number":106},{"stem":"All of the following are true about Ogilvie's syndrome EXCEPT:","options":[{"letter":"A","text":"Signs and symptoms of obstruction are present in the absence of a mechanical cause."},{"letter":"B","text":"The main clinical feature is abdominal distension and obstipation."},{"letter":"C","text":"The diagnosis is usually established by colonoscopy without bowel prep."},{"letter":"D","text":"Usually, the cecum and the right colon are involved in the functional problem."}],"correct":"C","explanation":"<p><strong>Why it is false:</strong> The diagnosis is established by imaging\u2014CT abdomen (the gold standard) or water-soluble contrast enema, supported by plain radiographs\u2014</p>\n<p>demonstrating colonic dilation without a mechanical transition point. Colonoscopy is not the routine diagnostic test and carries perforation risk in the dilated colon; it is used therapeutically (decompression) when conservative measures/neostigmine fail (Sen &amp; Chokshi, Current Gastroenterology Reports, 2023; Alavi et al./ASCRS, 2021).</p>\n<p><strong>Why the others are true (and not the answer):</strong></p>\n<p>Obstructive signs/symptoms without a mechanical cause \u2014 This is the definition of pseudo-obstruction.</p>\n<p>Main features are distension and obstipation \u2014 Correct (with pain, nausea, vomiting).</p>\n<p>Cecum and right colon involved \u2014 Correct; dilation predominates in the cecum/ascending/transverse colon, and the cecum is the site at greatest perforation risk (&gt;12 cm).</p>","no_key":false,"no_options":false,"free_answer":null,"number":107},{"stem":"Which of the following patients should undergo post operative screening troponins to identify perioperative ischemia following non-cardiac surgery?","options":[{"letter":"A","text":"64 yr female, smoker, hypertension and dyslipidemia."},{"letter":"B","text":"48 yr male with a remote CVA."},{"letter":"C","text":"48 yr male, smoker, hypertension and dyslipidemia."},{"letter":"D","text":"64 yr female with congestive heart failure and an ICD in place."}],"correct":"B","explanation":"<p><strong>Why the 48 yr male with a remote CVA is a correct choice:</strong> A remote CVA is established atherosclerotic/cerebrovascular disease. Guidelines support troponin surveillance in patients with known cardiovascular disease undergoing elevated-risk surgery; the Canadian Cardiovascular Society criteria specifically include age 45\u201364 with significant</p>\n<p>cardiovascular disease (an RCRI cerebrovascular criterion) (Thompson et al./AHA-ACC, 2024, COR 2b; Ruetzler et al./AHA scientific statement, 2021).</p>\n<p><strong>Caveat / competing option:</strong> The 64 yr female with CHF and an ICD also has known cardiovascular disease (CHF is an RCRI criterion) and would likewise meet surveillance criteria; however, chronic troponin elevation in heart failure makes screening for ischemia harder to interpret. This makes the question imperfect, as two patients meet risk criteria. The remote-CVA patient is the &quot;cleanest&quot; example of established atherosclerotic disease at an age (45\u201364) where established CVD is the qualifying factor.</p>\n<p><strong>Why the two &quot;risk-factor\u2013only&quot; options are weaker:</strong></p>\n<p>64 yr female, smoker/HTN/dyslipidemia and 48 yr male, smoker/HTN/dyslipidemia \u2014 These carry risk factors but no established cardiovascular disease, and both are &lt;65; under the CCS framework, age 45\u201364 requires established CVD (not just risk factors), and neither reaches age \u226565. A baseline preoperative troponin is essential in any patient who will be surveilled, since up to 40% of patients with CVD/risk factors have chronically elevated troponin (Fifth Universal Definition of MI, 2026).</p>","no_key":false,"no_options":false,"free_answer":null,"number":108},{"stem":"A 32 yr insulin dependent diabetic F presents in septic shock related to a post operative necrotizing soft tissue infection following an uncomplicated caesarian section. Which of the following is most important during her early preoperative resuscitation?","options":[{"letter":"A","text":"Initiation of antimicrobial therapy."},{"letter":"B","text":"Insertion of a CVP line."},{"letter":"C","text":"Crystalloid resuscitation."},{"letter":"D","text":"Glucose level and insulin infusion."}],"correct":"C","explanation":"<p><strong>Why it is correct:</strong> In septic shock the immediate priority of early resuscitation is restoring perfusion with IV isotonic crystalloid (Surviving Sepsis: ~30 mL/kg within the first 3</p>\n<p>hours). While source control and antibiotics are urgent, the single most important element of early hemodynamic resuscitation is volume.</p>\n<p><strong>Why the others are lower priority in this framing:</strong></p>\n<p>Initiation of antimicrobial therapy \u2014 Critically important and should be given within the first hour; in this question it is the strongest competing answer, but it is a parallel priority to (not a substitute for) restoring perfusion, and definitive source control (surgical debridement of the necrotizing infection) is ultimately decisive. <strong>Note:</strong> many sepsis experts would argue early antibiotics are co-equal\u2014this is the item&#x27;s main debatable point.</p>\n<p>Insertion of a CVP line \u2014 Central access aids monitoring/vasopressors but does not itself resuscitate; it should not delay fluids.</p>\n<p>Glucose level and insulin infusion \u2014 Glycemic control matters but is not the priority over perfusion in the first minutes to hours.</p>","no_key":false,"no_options":false,"free_answer":null,"number":109},{"stem":"Which ONE of the following is TRUE regarding abnormalities of serum sodium concentration?","options":[{"letter":"A","text":"Changes in the serum sodium concentration typically produce changes in the patient's extracellular fluid status."},{"letter":"B","text":"The preservation of the normal ECF usually has a higher physiological priority than maintaining normal serum osmolality."},{"letter":"C","text":"The main determinant of osmolarity in the extracellular space is chloride."},{"letter":"D","text":"Extracellular hyponatremia leads to depletion of intracellular water."}],"correct":"B","explanation":"<p><strong>Why &quot;ECF preservation takes priority over osmolality&quot; is the true statement:</strong> Volume regulation takes precedence over osmoregulation. With significant hypovolemia (~8\u2013 10%), the body sacrifices tonicity to defend effective circulating volume\u2014non-osmotic ADH release drives water retention (producing hyponatremia) to preserve volume (Castle-Kirszbaum et al., Neurosurgical Review, 2021; Adrogu\u00e9 et al., JAMA, 2022).</p>\n<p><strong>Why the card&#x27;s chosen answer is incorrect:</strong> Serum sodium concentration reflects total body water balance/osmolality (Edelman relationship), whereas ECF volume/status is governed by total body sodium content. A patient can be hyponatremic with low, normal, or high ECF volume, so a change in serum sodium concentration does not reliably &quot;produce changes in ECF status&quot;\u2014it primarily drives transcellular water shifts affecting intracellular volume (Brown &amp; Paloian/AAP, 2023; Adrogu\u00e9 &amp; Madias, NEJM, 2000).</p>\n<p><strong>Why the remaining options are incorrect:</strong></p>\n<p>Main determinant of ECF osmolarity is chloride \u2014 Sodium (with its anions) is the principal extracellular osmole; tonicity is approximated by 2 \u00d7 [Na\u207a].</p>\n<p>Hyponatremia leads to depletion of intracellular water \u2014 The opposite: hypotonic hyponatremia shifts water into cells, causing intracellular water gain (cellular swelling, e.g., cerebral edema).</p>","no_key":false,"no_options":false,"free_answer":null,"number":110},{"stem":"Which ONE of the following is true regarding total body water (TBW)?","options":[{"letter":"A","text":"Females typically have higher TBW then males."},{"letter":"B","text":"The extracellular fluid compartment accounts for more % of body weight than the intracellular fluid compartment."},{"letter":"C","text":"TBW usually decreases with increasing age."},{"letter":"D","text":"The higher the proportion of muscle compared to fat, the higher the TBW."}],"correct":"D","explanation":"<p><strong>Why &quot;more muscle vs fat \u2192 higher TBW&quot; is true:</strong> Lean/muscle tissue is ~73% water whereas fat is only ~10% water, so body composition is the primary determinant of TBW; a higher muscle-to-fat ratio means higher TBW (Sawka et al., Sports Medicine, 2015; Ohashi et al., Seminars in Dialysis, 2018).</p>\n<p><strong>Caveat \u2014 the third option is also true:</strong> &quot;TBW usually decreases with increasing age&quot; is generally correct: TBW as a fraction of body weight declines with age (largely from loss of muscle and gain of fat, most pronounced after 60\u201370 years) (Go\u0142\u0105b et al., 2016; Chumlea et al., Kidney International, 1999). Because the age-related decline is itself driven by the muscle-to-fat shift, both statements are true and linked; the muscle-vs-fat option is the more fundamental/reliably-true answer, but strictly the question has two correct choices.</p>\n<p><strong>Why the other two are incorrect:</strong></p>\n<p>Females have higher TBW than males \u2014 False: females have proportionally more body fat, so a lower % TBW (~50%) than males (~60%).</p>\n<p>ECF &gt; ICF as % of body weight \u2014 False: the intracellular compartment is larger (~2/3 of TBW; ICF:ECF \u2248 62:38).</p>","no_key":false,"no_options":false,"free_answer":null,"number":111},{"stem":"A patients with sickle cell anemia is found to have a hg of 56. What should you do preoperatively?","options":[{"letter":"A","text":"Get a pre-op Hb> 100 transfusion."},{"letter":"B","text":"Get a pre-op Hb> 130 transfusion."},{"letter":"C","text":"Administer hydroxyurea and wait before making its effect."},{"letter":"D","text":"This is a chronic anemia compensated and no action is necessary."}],"correct":"D","explanation":"<p><em>Disagreement with the original key:</em> The source marked &quot;This is a chronic anemia compensated and no action is necessary&quot;, but this analysis disagrees (see explanation below).</p>\n<p><strong>DISAGREEMENT / FLAG:</strong> The source-marked answer (&quot;no action necessary&quot;) disagrees with guideline-directed care and is not correct. Multiple guidelines recommend preoperative simple transfusion to a target hemoglobin of ~10 g/dL (100 g/L) before any surgical procedure requiring general anesthesia in patients with sickle cell anemia. A hemoglobin of 56 g/L (5.6 g/dL) is well below that target and is not a situation to leave untreated preoperatively.</p>\n<p><strong>Why &quot;Get a pre-op Hb &gt; 100 transfusion&quot; is correct:</strong></p>\n<p>The NHLBI Expert Panel Report recommends transfusing RBCs to bring the hemoglobin to 10 g/dL prior to surgery involving general anesthesia in adults and children with sickle cell anemia (Yawn et al., JAMA, 2014; NHLBI Evidence-Based Management of Sickle Cell Disease, 2014).</p>\n<p>This is grounded in the TAPS randomized trial (Transfusion Alternatives Preoperatively in Sickle Cell Disease), which showed fewer perioperative complications\u2014particularly acute chest syndrome\u2014with preoperative transfusion versus no transfusion in low/medium-risk surgery (Howard et al., cited in Rees, Robinson &amp; Howard, British Journal of Haematology, 2018).</p>\n<p>British Society for Haematology guidance similarly recommends simple transfusion to Hb 100 g/L when Hb &lt; 90 g/L (or partial exchange if Hb \u2265 90 g/L) for HbSS patients undergoing low- and medium-risk surgery (Davis et al., British Journal of Haematology, 2017).</p>\n<p><strong>Why the other options are incorrect:</strong></p>\n<p>&quot;Get a pre-op Hb &gt; 130 transfusion&quot;: Over-transfusion is harmful. Post-transfusion hemoglobin should not exceed ~11 g/dL because raising the hematocrit excessively increases blood viscosity and can paradoxically promote vaso-occlusion (ASH 2020 Transfusion Support Guideline, Chou et al.). A target above 130 g/L is too high.</p>\n<p>&quot;Administer hydroxyurea and wait before making its effect&quot;: Hydroxyurea takes months to produce a meaningful rise in fetal hemoglobin and reduction in complications; it has no role in acute preoperative optimization.</p>\n<p>&quot;No action is necessary&quot;: Surgery in sickle cell disease carries a substantial risk of perioperative vaso-occlusive crisis, acute chest syndrome, and death; a hemoglobin of 5.6 g/dL prior to general anesthesia mandates transfusion, not observation (Yawn et al., JAMA, 2014).</p>\n<p><strong>Background:</strong> Simple transfusion is generally used when Hb &lt; 9 g/dL (target 9\u201311 g/dL); exchange transfusion is reserved for higher baseline Hb or very high-risk surgery (neurosurgery, cardiac) where a low HbS% is desired (Chou et al., ASH 2020). Optimize oxygenation, hydration, and warmth perioperatively for all genotypes.</p>","no_key":false,"no_options":false,"free_answer":null,"number":112},{"stem":"A 65 year old man is now six days post resection of an abdominal aortic aneurysm. His vital signs are normal. He is afebrile. His O2 saturation is 92%. Preoperatively he worked full time as an accountant and drank one-two glasses of wine per day. At present he is not orientated to place or time, responds in full sentences that are nonsensical, and has visual hallucinations. Which of the following statements about the patient is true?","options":[{"letter":"A","text":"This patient has delirium tremens."},{"letter":"B","text":"This condition should be treated with lorazepam."},{"letter":"C","text":"Establishing normal sleep/wake cycles will improve his condition."},{"letter":"D","text":"This patient has a higher risk of dying compared to patients without delirium."}],"correct":"D","explanation":"<p>\u2014 AGREE.</p>\n<p><strong>Why &quot;higher risk of dying&quot; is correct:</strong></p>\n<p>Postoperative delirium is independently associated with substantially increased mortality. A systematic review and meta-analysis found higher odds of death at 1 month, 6 months, and 1 year after both elective and emergency non-cardiac surgery (Yan et al., Journal of Clinical Anesthesia, 2023).</p>\n<p>In a national Medicare cohort of &gt;5.5 million patients, postoperative delirium was associated with a 4.5-fold higher risk of 30-day mortality and a 5.5-fold higher risk of death or major complications after risk adjustment (Lander et al., JAMA Network Open, 2025).</p>\n<p>A pooled analysis found delirium associated with roughly a four-fold increase in the odds of death, though the independent (confounder-adjusted) contribution is debated (Hamilton et al., Anesthesiology, 2017).</p>\n<p><strong>Why the other options are incorrect:</strong></p>\n<p>&quot;This patient has delirium tremens&quot;: DTs is a diagnosis of severe alcohol withdrawal, typically occurring 48\u201396 hours after the last drink in heavy, dependent drinkers. This patient drank only 1\u20132 glasses of wine per day (not a typical DT-level intake) and is now 6 days postoperative; postoperative delirium here is far more likely multifactorial (surgery, hypoxemia with SpO2 92%, ICU environment, medications) than DTs. The vignette does not support labeling this as DTs.</p>\n<p>&quot;This condition should be treated with lorazepam&quot;: Benzodiazepines are first-line for alcohol withdrawal/DTs but are NOT first-line for general postoperative/hyperactive delirium, where they can worsen or prolong delirium. Management centers on identifying and treating precipitants and nonpharmacologic measures; antipsychotics are reserved for severe agitation/safety concerns (Jin, Hu &amp; Ma, British Journal of Anaesthesia, 2020). Given this patient&#x27;s minimal alcohol intake, lorazepam is not the indicated treatment.</p>\n<p>&quot;Establishing normal sleep/wake cycles will improve his condition&quot;: This is a valid and recommended nonpharmacologic component of delirium prevention/management and is partially true. However, it is a weaker, less definitive statement than the mortality association, which is robustly established. On a &quot;select the best/true statement&quot; item, the mortality answer is the strongest.</p>\n<p><strong>Background:</strong> First evaluate for reversible precipitants (hypoxemia\u2014note SpO2 92%, infection, metabolic derangement, urinary retention, pain, medications). Non- pharmacologic bundles (reorientation, sleep hygiene, early mobilization, sensory aids) are the foundation of management (Jin, Hu &amp; Ma, 2020).</p>","no_key":false,"no_options":false,"free_answer":null,"number":113},{"stem":"A 31 year old woman with poorly controlled hyperthyroidism has a prolonged and difficult delivery of her first child. Immediately following delivery, her heart rate is 148 per minute, temperature is 39.4\u00b0 C and O2 SAT 94%. She is agitated and restless. Which is the initial treatment of choice?","options":[{"letter":"A","text":"Steroids."},{"letter":"B","text":"Lugol's solution."},{"letter":"C","text":"Propylthiouracil."},{"letter":"D","text":"Ablation with radioactive iodine."}],"correct":"A","explanation":"<p>Best answer: Propylthiouracil (PTU).</p>\n<p><strong>DISAGREEMENT / FLAG:</strong> This is a genuinely debatable item. The clinical picture (poorly controlled hyperthyroidism, precipitating stressor of labor, fever 39.4\u00b0C, tachycardia 148, agitation) is thyroid storm. In standard management the very first drug for symptom control is a beta-blocker (propranolol/esmolol), which is not listed. Among the four options given, glucocorticoids (&quot;steroids&quot;) are a legitimate and rapidly acting</p>\n<p>adjunct\u2014so the source answer is defensible\u2014but the conventional &quot;treatment of choice&quot; and cornerstone antithyroid agent in storm is propylthiouracil, which is why PTU is the stronger answer here.</p>\n<p><strong>Why propylthiouracil is the best answer:</strong></p>\n<p>PTU blocks new thyroid hormone synthesis AND inhibits peripheral conversion of T4 to T3, making it the preferred thionamide in thyroid storm (Ross et al., 2016 ATA Hyperthyroidism Guideline; Wiersinga et al., Lancet Diabetes &amp; Endocrinology, 2023; Lee &amp; Pearce, JAMA, 2023).</p>\n<p>Sequence matters: the thionamide must be given BEFORE iodine, because iodine given first can supply substrate and worsen thyrotoxicosis. PTU therefore logically precedes Lugol&#x27;s solution (Wiersinga et al., 2023; ACOG Practice Bulletin, Thyroid Disease in Pregnancy, 2020).</p>\n<p>ACOG&#x27;s regimen for thyroid storm in pregnancy/postpartum lists PTU 1,000 mg load then 200 mg every 6 hours as the first step (&quot;inhibit thyroid release/synthesis&quot;), with iodine 1\u20132 hours after PTU, and glucocorticoids to block peripheral conversion (ACOG Practice Bulletin, 2020).</p>\n<p>Regarding the source&#x27;s &quot;Steroids&quot;:</p>\n<p>Glucocorticoids (hydrocortisone 300 mg IV load, then 100 mg every 8 hours; or dexamethasone) are a core component of storm therapy\u2014they reduce peripheral T4\u2192T3 conversion and treat relative adrenal insufficiency, and are especially beneficial when Graves disease is the cause (Kopp et al., Journal of Clinical Endocrinology &amp; Metabolism, 2026; Ross et al., 2016). They act quickly, which is likely the rationale for the marked answer. However, they are adjunctive rather than the definitive antithyroid &quot;treatment of choice.&quot;</p>\n<p><strong>Why the remaining options are incorrect:</strong></p>\n<p>&quot;Lugol&#x27;s solution&quot; (iodine): Must NOT be given first. Iodine should be started only ~1 hour after a thionamide to avoid providing substrate for additional hormone synthesis (Ross et al., 2016; Wiersinga et al., 2023). It is wrong as the initial single agent.</p>\n<p>&quot;Ablation with radioactive iodine&quot;: Contraindicated in acute thyroid storm (it does not act acutely and can transiently worsen thyrotoxicosis via radiation thyroiditis) and is contraindicated in breastfeeding women. It is a definitive treatment for stable Graves disease, not an emergency intervention.</p>\n<p>Background \u2014 full storm regimen: beta-blocker (propranolol/esmolol) for adrenergic control \u2192 thionamide (PTU preferred) \u2192 iodine \u22651 hour later \u2192 glucocorticoid \u2192 supportive care (cooling, volume, treat precipitant) in an ICU setting (Ross et al., 2016; Lee &amp; Pearce, JAMA, 2023).</p>","no_key":false,"no_options":false,"free_answer":null,"number":114},{"stem":"Cardiac oxygen delivery can be increased by increasing all of the following EXCEPT?","options":[{"letter":"A","text":"Hemoglobin."},{"letter":"B","text":"Atmospheric pressure."},{"letter":"C","text":"Cardiac output."},{"letter":"D","text":"Inspired oxygen concentration."}],"correct":"B","explanation":"<p>\u2014 AGREE.</p>\n<p><strong>Why &quot;atmospheric pressure&quot; is correct (the exception):</strong></p>\n<p>Oxygen delivery is DO2 = cardiac output \u00d7 arterial oxygen content, where CaO2 = (1.34 \u00d7 Hb \u00d7 SaO2) + (0.003 \u00d7 PaO2) (Wemple, Swenson &amp; Swenson, New England Journal of Medicine, 2024; Lim, Clinical Cardiology, 2016).</p>\n<p>The three clinically meaningful, directly modifiable determinants are therefore hemoglobin, cardiac output, and arterial saturation/PaO2 (raised by increasing inspired oxygen). Barcroft&#x27;s classic classification maps low values of these to stagnant, anemic, and hypoxic hypoxia respectively.</p>\n<p>Atmospheric pressure only influences oxygen content through the dissolved fraction (0.003 \u00d7 PaO2), which contributes ~1\u20132% of total oxygen content and is clinically negligible under normobaric conditions (Sturm et al., Scientific Reports, 2021; Andersen et al., AAP, 2017). Thus, at standard conditions, &quot;increasing atmospheric pressure&quot; is not a practical lever for oxygen delivery\u2014making it the correct EXCEPT.</p>\n<p><strong>Why the other options are incorrect (i.e., they DO increase delivery):</strong></p>\n<p>Hemoglobin: The dominant term in CaO2; raising Hb directly increases oxygen-carrying capacity and delivery.</p>\n<p>Cardiac output: DO2 is linearly proportional to cardiac output; increasing it raises delivery.</p>\n<p>Inspired oxygen concentration: Raising FiO2 increases PaO2 and SaO2, increasing CaO2 (Nam et al., Scientific Reports, 2021).</p>\n<p>Nuance: Strictly, hyperbaric oxygen therapy does increase dissolved oxygen (and total delivery) by markedly raising PaO2, so under hyperbaric conditions atmospheric pressure can raise delivery. Under normal (normobaric) clinical conditions assumed by this question, atmospheric pressure is the correct answer.</p>","no_key":false,"no_options":false,"free_answer":null,"number":115},{"stem":"What happens to old stored units of PRBC's over time","options":[{"letter":"A","text":"Decreased O2 carrying capacity."},{"letter":"B","text":"Increased 2-3 DPG."},{"letter":"C","text":"Metabolic alkalosis."},{"letter":"D","text":"Decreased K+."}],"correct":"C","explanation":"<p><em>Disagreement with the original key:</em> The source marked &quot;Metabolic alkalosis&quot;, but this analysis disagrees (see explanation below).</p>\n<p><strong>DISAGREEMENT / FLAG:</strong> The source-marked answer (&quot;metabolic alkalosis&quot;) is incorrect as a description of the stored unit. Stored blood becomes progressively ACIDOTIC over time, not alkalotic. Metabolic alkalosis is a phenomenon that can occur in the RECIPIENT after massive transfusion (hepatic metabolism of citrate anticoagulant to bicarbonate)\u2014it is not a change that develops within the stored unit over time. The only option that correctly describes the storage lesion is decreased oxygen- carrying/delivery capacity.</p>\n<p><strong>Why &quot;decreased O2 carrying capacity&quot; is correct:</strong></p>\n<p>The storage lesion includes progressive depletion of 2,3-DPG (often undetectable by ~1 week), which increases hemoglobin&#x27;s oxygen affinity (left shift) and reduces oxygen off- loading/delivery to tissues (Klein, Spahn &amp; Carson, Lancet, 2007; Tobian &amp; Ness, New England Journal of Medicine, 2016; Karafin et al., Journal of Clinical Investigation, 2025).</p>\n<p>Stored RBCs also lose ATP, become more rigid, and show reduced oxygen off-loading (Mart\u00ed-Carvajal et al., Cochrane Database of Systematic Reviews, 2015). (<strong>Note:</strong> the 2,3- DPG deficit is largely regenerated within ~24\u201372 hours after transfusion in vivo.)</p>\n<p><strong>Why the other options are incorrect:</strong></p>\n<p>&quot;Increased 2-3 DPG&quot;: The opposite occurs\u20142,3-DPG DECLINES rapidly during storage (Klein et al., 2007; Adams et al., BioMed Research International, 2014).</p>\n<p>&quot;Metabolic alkalosis&quot;: The stored unit becomes ACIDOTIC (lactate accumulation, falling pH; additive solutions are acidic, pH ~5.6\u20135.8) (Adams et al., 2014; Good et al., Cochrane, 2015). Alkalosis is a post-transfusion recipient effect, not a property of the aging unit.</p>\n<p>&quot;Decreased K+&quot;: Potassium INCREASES in the supernatant over time due to leakage from cells as the Na/K-ATPase fails during cold storage (Ran et al., PLoS One, 2011; Mart\u00ed-Carvajal et al., 2015).</p>\n<p><strong>Background:</strong> Key storage lesion changes over time: \u21932,3-DPG, \u2193ATP, \u2193pH (acidosis), \u2191extracellular K+, \u2191free hemoglobin, increased RBC rigidity and microvesiculation, and impaired oxygen delivery (Klein et al., 2007; Tobian &amp; Ness, 2016).</p>","no_key":false,"no_options":false,"free_answer":null,"number":116},{"stem":"What is the best dressing following the application of a split- thickness skin graft:","options":[{"letter":"A","text":"Wet-to-dry."},{"letter":"B","text":"Flamazine."},{"letter":"C","text":"Mafenide-acetate."},{"letter":"D","text":"VAC dressing."}],"correct":"D","explanation":"<p>\u2014 AGREE.</p>\n<p><strong>Why &quot;VAC dressing&quot; (negative-pressure wound therapy) is correct:</strong></p>\n<p>Multiple meta-analyses of randomized trials show NPWT improves graft take compared with conventional dressings. One RCT meta-analysis found ~8% higher overall graft take (and ~10% higher at \u221280 mmHg), higher graft success, and lower graft loss and reoperation rates (Lee et al., Journal of Plastic, Reconstructive &amp; Aesthetic Surgery, 2025).</p>\n<p>Additional meta-analyses concur on improved graft take and reduced reoperation (Jiang et al., Burns, 2021; Yin et al., International Journal of Surgery, 2018).</p>\n<p>NPWT works by applying uniform pressure to prevent graft lift-off from hematoma/seroma/shear, promoting graft adherence and microcirculatory flow (Azzopardi et al., Annals of Plastic Surgery, 2013; Sapino et al., Journal of Clinical Medicine, 2022).</p>\n<p><strong>Why the other options are incorrect:</strong></p>\n<p>&quot;Wet-to-dry&quot;: A debridement dressing; its removal disrupts the delicate, newly applied graft and causes shear\u2014inappropriate for securing a fresh graft.</p>\n<p>&quot;Flamazine&quot; (silver sulfadiazine): A topical antimicrobial for burns/colonized wounds; it does not secure a graft and can form pseudoeschar/impede epithelialization.</p>\n<p>&quot;Mafenide acetate&quot;: A topical burn antimicrobial valued for eschar penetration; it is not a graft-securing/bolster dressing and can be painful and cause metabolic acidosis (carbonic anhydrase inhibition).</p>","no_key":false,"no_options":false,"free_answer":null,"number":117},{"stem":"Which of the following agents has been shown clinically to reduce the deleterious effects of corticosteroids on wound healing?","options":[{"letter":"A","text":"Vitamin C."},{"letter":"B","text":"Vitamin A."},{"letter":"C","text":"Zinc."},{"letter":"D","text":"Transforming growth factor \u03b2."}],"correct":"B","explanation":"<p>\u2014 AGREE.</p>\n<p><strong>Why &quot;vitamin A&quot; is correct:</strong></p>\n<p>Retinoids uniquely reverse the inhibitory effects of anti-inflammatory corticosteroids on wound healing\u2014restoring the inflammatory response, epithelialization, and collagen deposition (Polcz &amp; Barbul, Nutrition in Clinical Practice, 2019; Zinder et al., Nutrition in Clinical Practice, 2019).</p>\n<p>Experimental work confirms retinoids reverse steroid-impaired healing (except wound contraction), including in cutaneous, fascial, and intestinal anastomotic models (Wicke et al., Archives of Surgery, 2000; Phillips et al., American Journal of Surgery, 1992; Hunt, Journal of the American Academy of Dermatology, 1986).</p>\n<p>The most common clinical use of vitamin A supplementation is specifically to offset steroids&#x27; effect on healing (Zinder et al., 2019).</p>\n<p><strong>Why the other options are incorrect:</strong></p>\n<p>&quot;Vitamin C&quot;: Essential cofactor for collagen hydroxylation, and deficiency impairs healing, but it does not specifically counteract corticosteroid-induced impairment.</p>\n<p>&quot;Zinc&quot;: Correcting zinc deficiency supports healing, but supplementation in replete patients does not reverse steroid effects.</p>\n<p>&quot;Transforming growth factor \u03b2&quot;: A growth factor mechanistically involved in repair (and modulated by retinoids), but it is not the clinically used agent to reverse steroid impairment; vitamin A is.</p>\n<p>Background caution: Vitamin A toxicity can be serious; supplementation should be time- limited and dosed carefully, and systemic vitamin A may partially counteract the intended immunosuppressive/anti-inflammatory purpose of the steroid (Polcz &amp; Barbul, 2019).</p>","no_key":false,"no_options":false,"free_answer":null,"number":118},{"stem":"A chronic alcoholic patient may develop delirium tremens following surgery. Which of the following drugs is UNLIKELY to be helpful in the management of this problem?","options":[{"letter":"A","text":"Dilantin."},{"letter":"B","text":"Benzodiazepine."},{"letter":"C","text":"Vitamin B1, (thiamine)."},{"letter":"D","text":"Magnesium sulfate."}],"correct":"A","explanation":"<p>(phenytoin) \u2014 AGREE.</p>\n<p><strong>Why &quot;Dilantin&quot; (phenytoin) is correct (the unhelpful agent):</strong></p>\n<p>Phenytoin is ineffective for preventing or treating alcohol withdrawal seizures and is not recommended unless a concomitant underlying (non-withdrawal) seizure disorder is</p>\n<p>being treated (ASAM Clinical Practice Guideline on Alcohol Withdrawal Management, Alvanzo et al., 2020).</p>\n<p>Alcohol withdrawal seizures are mediated by GABA/glutamate imbalance rather than the sodium-channel mechanisms phenytoin targets; sodium-channel-blocking antiepileptics (phenytoin, carbamazepine) are weak or ineffective in withdrawal-seizure models and in humans (Leach, Mohanraj &amp; Borland, Epilepsia, 2012). A Cochrane analysis found no significant benefit of phenytoin over placebo for withdrawal seizures.</p>\n<p><strong>Why the other options ARE helpful (and therefore incorrect answers):</strong></p>\n<p>Benzodiazepine: First-line therapy for alcohol withdrawal and DTs; reduces the incidence of withdrawal seizures and delirium, and is used for both prophylaxis and treatment (ASAM, Alvanzo et al., 2020).</p>\n<p>Vitamin B1 (thiamine): Essential to prevent/treat Wernicke encephalopathy in chronic alcohol use; standard supportive care in withdrawal (Leach et al., 2012).</p>\n<p>Magnesium sulfate: Hypomagnesemia is common in chronic alcohol use and should be corrected; magnesium repletion is part of supportive management (electrolyte correction is standard, and magnesium facilitates effective potassium correction).</p>\n<p><strong>Background:</strong> Core DT management: benzodiazepines (front-loaded/symptom-triggered), supportive care in a monitored setting, thiamine before glucose, and correction of magnesium/potassium/phosphate. Phenobarbital is an alternative/adjunct in supervised settings; phenytoin is not indicated for withdrawal seizures (ASAM, Alvanzo et al., 2020).</p>","no_key":false,"no_options":false,"free_answer":null,"number":119},{"stem":"When considering surgery in a pregnant individual what do you need to be aware of?","options":[{"letter":"A","text":"The fetus has entered the pelvis as of the 3rd trimester."},{"letter":"B","text":"The fundus is at the umbilicus at the 20 weeks."},{"letter":"C","text":"They should be positioned directly on their back."},{"letter":"D","text":"The fundus is at the costophrenic angle at 24 weeks."}],"correct":"B","explanation":"<p>This agrees with the original answer key.</p>\n<p><strong>Why &quot;the fundus is at the umbilicus at the 20 weeks&quot; is correct:</strong> Fundal height is a reliable clinical marker of gestational age \u2014 the uterine fundus reaches the umbilicus at roughly 20 weeks, and from ~20\u201336 weeks the fundal height in centimeters approximates the weeks of gestation. This anatomic landmark matters surgically because it defines uterine size, the position of abdominal viscera (the gravid uterus displaces bowel cephalad), incision planning, and the degree of aortocaval compression risk.</p>\n<p><strong>Why the other answers are incorrect:</strong></p>\n<p>&quot;The fetus has entered the pelvis as of the 3rd trimester&quot;: Engagement of the fetal presenting part into the pelvis is a late event, typically near term (often after 36 weeks in primigravidas, and frequently not until labor in multiparas). It is not a defining feature of the entire third trimester.</p>\n<p>&quot;They should be positioned directly on their back&quot;: This is actively harmful in the second half of pregnancy. Supine positioning allows the gravid uterus to compress the inferior vena cava and aorta (supine hypotensive syndrome), reducing venous return, cardiac output, and uteroplacental perfusion. The correct maneuver is left lateral tilt (~15\u201330\u00b0) or manual left uterine displacement.</p>\n<p>&quot;The fundus is at the costophrenic angle at 24 weeks&quot;: Incorrect landmark and timing. At 24 weeks the fundus is roughly a few centimeters above the umbilicus. The fundus approaches the costal margin/xiphoid only near 36 weeks.</p>\n<p><strong>Background reading:</strong> Fundal height milestones \u2014 symphysis pubis at ~12 weeks, umbilicus at ~20 weeks, xiphoid at ~36 weeks. When operating on a pregnant patient, left uterine displacement, aspiration precautions, and attention to physiologic changes (increased minute ventilation, dilutional anemia, hypercoagulability) are key.</p>","no_key":false,"no_options":false,"free_answer":null,"number":120},{"stem":"A 60 year old woman undergoes resection of a retroperitoneal sarcoma. On post-operative day 5 her platelet count decreases to 85,000 (her baseline is 325,000). She has been receiving unfractionated heparin for VTE prophylaxis. She has no clinical evidence of bleeding. All of the following are indicated, EXCEPT?","options":[{"letter":"A","text":"Oral warfarin."},{"letter":"B","text":"Direct thrombin inhibitor."},{"letter":"C","text":"Discontinuing all heparin therapy."},{"letter":"D","text":"Testing for heparin-induced thrombocytopenia (HIT) antibodies."}],"correct":"A","explanation":"<p>This agrees with the original answer key.</p>\n<p><strong>Why &quot;oral warfarin&quot; is the EXCEPT (the intervention that is NOT indicated):</strong> This is a classic presentation of heparin-induced thrombocytopenia \u2014 a &gt;50% platelet fall (325,000 \u2192 85,000) beginning on day 5 of unfractionated heparin. Starting a vitamin K antagonist during acute HIT is contraindicated. Warfarin rapidly depletes protein C (short half-life ~6\u20138 h), producing a transient hypercoagulable state before the procoagulant factors (especially factor II) decline, which precipitates warfarin-induced venous limb gangrene and skin necrosis. The 2026 AATS consensus and NEJM both state VKAs should not be given until the platelet count recovers to &gt;150 \u00d7 10\u2079/L on a stable plateau, and only then with overlap of a non-heparin anticoagulant. If a patient is already on warfarin when HIT is diagnosed, it should be reversed with IV vitamin K.</p>\n<p><strong>Why the other answers ARE indicated (correct actions):</strong></p>\n<p>&quot;direct thrombin inhibitor&quot;: Argatroban (or bivalirudin) is a guideline-recommended non- heparin anticoagulant for acute HIT. Even without overt thrombosis, therapeutic-dose (not prophylactic) alternative anticoagulation is required because of the massive thrombin generation and high thrombotic risk.</p>\n<p>&quot;discontinuing all heparin therapy&quot;: Immediate cessation of all heparin (including flushes and LMWH) is a mandatory first step in suspected/confirmed HIT.</p>\n<p>&quot;testing for heparin-induced thrombocytopenia (HIT) antibodies&quot;: Anti-PF4/heparin immunoassay \u00b1 confirmatory functional assay (e.g., serotonin release assay) is</p>\n<p>appropriate, typically after risk-stratifying with the 4Ts score. Testing does not delay stopping heparin and starting a non-heparin anticoagulant.</p>\n<p><strong>Background reading:</strong> 4Ts score stratifies pretest probability. DOACs are increasingly used as an alternative to warfarin once platelets recover. Anticoagulation is continued 4 weeks for isolated HIT and 3 months for HIT with thrombosis.</p>","no_key":false,"no_options":false,"free_answer":null,"number":121},{"stem":"A patient with renal failure is on TPN. They require adjustment of their TPN prescription, what would you decrease in their formula?","options":[{"letter":"A","text":"Lipids."},{"letter":"B","text":"Magnesium."},{"letter":"C","text":"Calcium."},{"letter":"D","text":"Acetate."}],"correct":"B","explanation":"<p>This agrees with the original answer key.</p>\n<p><strong>Why &quot;Magnesium&quot; is correct:</strong> Magnesium is renally excreted. In renal failure, magnesium clearance falls and hypermagnesemia readily develops, so the magnesium content of parenteral nutrition should be reduced (as should potassium and phosphate, which are not listed here). This is the standard TPN modification for impaired renal function.</p>\n<p><strong>Why the other answers are incorrect:</strong></p>\n<p>&quot;Lipids&quot;: Lipid emulsions are an energy source and are not primarily restricted for renal failure per se. Lipids may actually be favored to provide non-protein calories, and there is no renal-failure\u2013specific mandate to decrease them among these options.</p>\n<p>&quot;Calcium&quot;: Renal failure typically causes hypocalcemia (reduced 1,25-dihydroxyvitamin D, hyperphosphatemia). Calcium generally is not decreased; if anything it may need supplementation.</p>\n<p>&quot;acetate&quot;: Acetate is metabolized to bicarbonate and is used to counteract the metabolic acidosis of renal failure. It is often increased (relative to chloride), not decreased.</p>\n<p><strong>Background reading:</strong> In renal-failure TPN, restrict magnesium, potassium, and phosphate; protein may be adjusted to needs (and is not restricted when the patient is on renal replacement therapy); acetate buffering helps offset acidosis.</p>","no_key":false,"no_options":false,"free_answer":null,"number":122},{"stem":"In patients undergoing coronary artery bypass grafting, all of the following have been identified as being associated with an increased operative risk EXCEPT?","options":[{"letter":"A","text":"Advanced age."},{"letter":"B","text":"Low ejection fracture."},{"letter":"C","text":"Male sex."},{"letter":"D","text":"Diabetes."}],"correct":"C","explanation":"<p>This agrees with the original answer key.</p>\n<p><strong>Why &quot;male sex&quot; is the EXCEPT:</strong> Multiple large analyses show female \u2014 not male \u2014 sex is the independent risk factor for operative mortality after isolated CABG. In a meta- analysis of &gt;5 million patients, operative mortality was 4.9% in women vs 3.3% in men (adjusted OR 1.40; 95% CI 1.35\u20131.45), and a separate meta-analysis of &gt;900,000 patients found an OR of 1.77 (95% CI 1.64\u20131.92) for operative mortality in women. Male sex therefore does not confer increased operative risk.</p>\n<p><strong>Why the other answers ARE established risk factors:</strong></p>\n<p>&quot;advanced age&quot;: A core variable in the STS and EuroSCORE risk models; older age increases perioperative mortality and morbidity.</p>\n<p>&quot;low ejection fracture&quot; (i.e., low ejection fraction): Reduced LVEF is a well-validated predictor of higher operative mortality after CABG.</p>\n<p>&quot;diabetes&quot;: Diabetes is associated with increased perioperative morbidity (infection, renal injury) and mortality and is incorporated into cardiac surgical risk scores.</p>\n<p><strong>Background reading:</strong> The excess operative risk in women is only partly explained by older age and greater comorbidity at presentation; a sex-based disparity persists in propensity-matched and risk-adjusted analyses and has not narrowed over the past decade.</p>","no_key":false,"no_options":false,"free_answer":null,"number":123},{"stem":"tracheostomy inserted through the 1st tracheal ring increases the risk of what?","options":[{"letter":"A","text":"Subglottic stenosis."},{"letter":"B","text":"Tracheoinnominate fistula."},{"letter":"C","text":"No increased complication risk."},{"letter":"D","text":"Vocal cord paralysis."}],"correct":"A","explanation":"<p>NOTE \u2014 DISAGREEMENT WITH ORIGINAL ANSWER KEY. The provided key marked &quot;Vocal cord paralysis.&quot; That is not the best answer. A tracheostomy placed too high \u2014 through the first tracheal ring (or involving the cricoid) \u2014 is the classic setup for injury to the cricoid cartilage and subglottis, and the characteristic resulting complication is subglottic stenosis.</p>\n<p><strong>Why &quot;Subglottic stenosis&quot; is correct:</strong> The ideal tracheostomy is placed between the second and third (or third and fourth) tracheal rings, staying below the cricoid. Placement through the first ring sits immediately adjacent to the cricoid cartilage \u2014 the only complete cartilaginous ring and the narrowest part of the pediatric/subglottic airway. Injury or pressure at this level produces subglottic/high tracheal stenosis. Surgical series confirm that tracheostomy-related stenoses cluster at or proximal to the cricoid (72.7% of tracheostomy-related stenoses were at/proximal to the cricoid vs 21.4% of intubation- related stenoses), and cricoid cartilage injury is specifically described as a cause of subglottic stenosis.</p>\n<p><strong>Why the other answers are incorrect:</strong></p>\n<p>&quot;Vocal cord paralysis&quot; (original key&#x27;s choice): Vocal cord paralysis results from recurrent laryngeal nerve injury. The recurrent laryngeal nerves run in the tracheoesophageal grooves laterally; they are not the structure endangered by a midline stoma placed too high. High stomal placement threatens the cricoid/subglottis, not the recurrent laryngeal nerves, so subglottic stenosis is the specific complication linked to a first-ring/high tracheostomy.</p>\n<p>&quot;Tracheoinnominate fistula&quot;: This catastrophic complication is associated with a tracheostomy placed too LOW (against the innominate artery), an over-inflated cuff, or an eroding tube tip \u2014 not a high, first-ring placement.</p>\n<p>&quot;No increased complication risk&quot;: False \u2014 a first-ring/high placement is specifically hazardous for subglottic stenosis and difficult decannulation.</p>\n<p><strong>Background reading:</strong> Optimal window is between rings 2\u20133. Both too-high (cricoid/subglottic stenosis) and too-low (tracheoinnominate fistula) placements carry characteristic complications. Other stenosis risk factors include percutaneous technique, obesity, prolonged pre-tracheostomy intubation, cuff pressure \u226530 mmHg, and larger tube size.</p>","no_key":false,"no_options":false,"free_answer":null,"number":124},{"stem":"Indication for bariatric surgery","options":[{"letter":"A","text":"BMI > 40."},{"letter":"B","text":"BMI > 35."},{"letter":"C","text":"BMI >30 + obesity-related comorbidity."},{"letter":"D","text":"Obesity + T2DM."}],"correct":"A","explanation":"<p>NOTE \u2014 ANSWER IS CORRECT BY THE CLASSIC CRITERIA BUT IS EVOLVING; FLAGGED. By the long-standing 1991 NIH criteria (still reflected in the 2019 AACE/TOS/ASMBS perioperative guideline), the answer &quot;BMI &gt; 40&quot; is defensible: BMI \u2265 40 alone (without any comorbidity) is a stand-alone indication, whereas the other listed thresholds require an accompanying condition to qualify.</p>\n<p><strong>Why &quot;BMI &gt; 40&quot; is the best single answer among these options:</strong> Of the four choices, only &quot;BMI &gt; 40&quot; independently qualifies a patient for surgery without needing a comorbidity. The classic criteria are: BMI \u2265 40, OR BMI \u2265 35 with an obesity-related comorbidity, OR (per more recent guidance) BMI 30\u201334.9 with poorly controlled type 2 diabetes/metabolic disease.</p>\n<p><strong>Why the other options are, as written, incomplete under the classic criteria:</strong></p>\n<p>&quot;BMI &gt; 35&quot;: Under the classic NIH criteria this qualifies only when paired with an obesity-related comorbidity; as written (without a comorbidity) it is incomplete. (See the important update below.)</p>\n<p>&quot;BMI &gt;30 + obesity-related comorbidity&quot;: The classic BMI 30\u201334.9 indication is specifically for type 2 diabetes/metabolic disease with inadequate control, not any obesity-related comorbidity; as phrased it overstates the traditional criterion.</p>\n<p>&quot;Obesity + T2DM&quot;: Too vague \u2014 &quot;obesity&quot; without a BMI threshold does not by itself define surgical eligibility.</p>\n<p>IMPORTANT UPDATE (<strong>why this question is now debatable):</strong> The 2022 ASMBS/IFSO joint guidelines revised these thresholds: metabolic/bariatric surgery is now recommended for BMI \u2265 35 regardless of the presence or absence of comorbidities, and should be considered for BMI 30\u201334.9 with metabolic disease (with lower thresholds, ~BMI \u2265 27.5, for Asian populations). Under the current guideline, &quot;BMI &gt; 35&quot; alone would also be a correct indication. If the exam is testing modern criteria rather than the 1991 NIH standard, more than one option is defensible.</p>\n<p><strong>Background reading:</strong> 1991 NIH criteria vs 2022 ASMBS/IFSO update; ethnicity-adjusted BMI thresholds for Asian patients.</p>","no_key":false,"no_options":false,"free_answer":null,"number":125},{"stem":"A trauma patient comes into the ER. They have a right pubic ramus fracture and there is obvious blood/hematuria coming from the penis. What is the next step?","options":[{"letter":"A","text":"CT KUB."},{"letter":"B","text":"Cystoscopy and retrograde urethrogram."},{"letter":"C","text":"Cystoscopy alone."},{"letter":"D","text":"CT urogram with delayed images to assess collecting system bladder."}],"correct":"B","explanation":"<p>(specifically, retrograde urethrography is the required next step; flexible urethroscopy/cystoscopy is the accepted alternative).</p>\n<p>NOTE \u2014 DISAGREEMENT WITH ORIGINAL ANSWER KEY. The provided key marked &quot;CT urogram with delayed images.&quot; That is incorrect. Blood at the urethral meatus after pelvic trauma is the cardinal sign of urethral injury, and the mandated next step is retrograde urethrography before any attempt at catheterization \u2014 not CT urogram.</p>\n<p><strong>Why &quot;Cystoscopy and retrograde urethrogram&quot; is correct:</strong> Per the AUA Urotrauma guideline, clinicians should perform retrograde urethrography in patients with blood at the urethral meatus after pelvic trauma, and blind catheter passage should be avoided beforehand. The WSES-AAST and ACS guidelines concur that retrograde urethrography is the gold-standard/procedure of choice and must be performed before any other genitourinary manipulation; flexible urethroscopy (cystoscopy) is the accepted alternative, and is actually preferred when there are associated penile injuries or in women (short urethra). Of the listed options, only &quot;Cystoscopy and retrograde urethrogram&quot; contains the correct diagnostic maneuver.</p>\n<p><strong>Why the other answers are incorrect:</strong></p>\n<p>&quot;CT urogram with delayed images to assess collecting system bladder&quot; (original key&#x27;s choice): CT urography evaluates the kidneys, ureters, and bladder, but it does not reliably diagnose a urethral injury, and it does not address the urgent question raised by meatal blood. It also does not substitute for the retrograde urethrogram that must precede catheterization.</p>\n<p>&quot;CT KUB&quot;: A non-contrast CT (or plain film) does not evaluate the urethra and will miss a urethral disruption.</p>\n<p>&quot;Cystoscopy alone&quot;: Reasonable as an alternative urethral evaluation, but the guideline- endorsed first-line study is retrograde urethrography; the option pairing cystoscopy with retrograde urethrogram is the more complete and correct choice.</p>\n<p><strong>Background reading:</strong> Suspect urethral injury with blood at the meatus, inability to void, high-riding prostate, perineal/scrotal (butterfly) hematoma, and pelvic ring disruption. If a urethral injury is confirmed and drainage is needed, place a suprapubic catheter. A single gentle attempt at catheterization by an experienced provider is permitted only in select circumstances.</p>","no_key":false,"no_options":false,"free_answer":null,"number":126},{"stem":"What is the most common cause of death in the surgical ICU","options":[{"letter":"A","text":"Multiple organ dysfunction syndrome (MODS)."},{"letter":"B","text":"Pneumonia."},{"letter":"C","text":"Sepsis."},{"letter":"D","text":"Cardiovascular complications."}],"correct":"A","explanation":"<p>This agrees with the original answer key.</p>\n<p><strong>Why &quot;Multiple organ dysfunction syndrome (MODS)&quot; is correct:</strong> In a prospective study of 3,700 ICU patients (a predominantly surgical population), acute, refractory MODS was the single most frequent cause of death in the ICU, accounting for 47% of ICU deaths \u2014 exceeding single-organ failure or unexpected cardiac arrest. MODS is the common final pathway of the severe systemic inflammatory response that follows major surgery, trauma, and sepsis.</p>\n<p><strong>Why the other answers are incorrect:</strong></p>\n<p>&quot;Sepsis&quot;: Sepsis is the leading trigger/risk factor that drives patients toward MODS, but the terminal cause of death recorded is most often the multi-organ dysfunction itself. (Note some classifications count severe sepsis/septic shock among leading contributors; the question asks the most common cause of death, which is MODS.)</p>\n<p>&quot;Pneumonia&quot;: A common ICU complication and a contributor to sepsis/MODS, but not the most common single cause of ICU death.</p>\n<p>&quot;Cardiovascular complications&quot;: An important cause of death (and a major risk factor for in-ICU death), but less frequent than MODS as the primary cause in surgical ICU cohorts; cardiovascular disease becomes a leading cause of death after ICU discharge rather than in the ICU.</p>\n<p><strong>Background reading:</strong> MODS results from dysregulated inflammation with microvascular endothelial injury; sepsis is its dominant precipitant. After ICU discharge, malignancy and chronic cardiovascular disease become the leading causes of death.</p>","no_key":false,"no_options":false,"free_answer":null,"number":127},{"stem":"67F diabetic presents with flank pain and fever. CT scan shows perinephric gas. What organism is the most likely cause?","options":[{"letter":"A","text":"Staph aureus."},{"letter":"B","text":"E coli."},{"letter":"C","text":"Pseudomonas."},{"letter":"D","text":"Proteus mirabilis."}],"correct":"B","explanation":"<p>This agrees with the original answer key.</p>\n<p><strong>Why &quot;E coli&quot; is correct:</strong> Perinephric/renal gas in a diabetic patient with flank pain and fever is emphysematous pyelonephritis, a necrotizing gas-forming infection; over 90% of cases occur in diabetics. Escherichia coli is by far the most common organism, isolated in &gt;70% of culture-positive cases (older series cite 50\u201375%). Gas is produced by bacterial fermentation of glucose/lactate.</p>\n<p><strong>Why the other answers are incorrect:</strong></p>\n<p>&quot;Proteus mirabilis&quot;: A recognized but less frequent cause of emphysematous pyelonephritis; also classically associated with struvite stones, but not the most likely organism here.</p>\n<p>&quot;Pseudomonas&quot;: An occasional gram-negative cause, but uncommon relative to E. coli.</p>\n<p>&quot;Staph aureus&quot;: A gram-positive organism that is not a typical cause of emphysematous pyelonephritis (which is overwhelmingly gram-negative Enterobacteriaceae).</p>\n<p><strong>Background reading:</strong> After E. coli, Klebsiella pneumoniae is the next most common; Proteus, Enterococcus, and Pseudomonas are less frequent. CT confirms and stages disease (Huang-Tseng classification). Management: resuscitation, glycemic control,</p>\n<p>broad-spectrum antibiotics, relief of obstruction, and percutaneous drainage or nephrectomy for severe/refractory disease.</p>","no_key":false,"no_options":false,"free_answer":null,"number":128},{"stem":"What is the most common brain tumor","options":[{"letter":"A","text":"Metastases."},{"letter":"B","text":"Astrocytoma."},{"letter":"C","text":"Meningioma."},{"letter":"D","text":"Glioblastoma."}],"correct":"A","explanation":"<p>This agrees with the original answer key.</p>\n<p><strong>Why &quot;Metastases&quot; is correct:</strong> Intracranial metastases from systemic cancers (lung, breast, melanoma, renal, colorectal) are the most common brain tumors overall \u2014 more frequent than all primary brain tumors combined. Reported incidence of brain metastases (~8\u201314 per 100,000 person-years) exceeds that of gliomas (~5\u20136 per 100,000 person-years).</p>\n<p><strong>Why the other answers are incorrect:</strong></p>\n<p>&quot;Meningioma&quot;: The most common PRIMARY (and most common non-malignant) brain tumor, but less common than metastatic disease overall.</p>\n<p>&quot;glioblastoma&quot;: The most common malignant PRIMARY brain tumor, but far less common than metastases.</p>\n<p>&quot;Astrocytoma&quot;: A category of glioma; not the most common brain tumor.</p>\n<p><strong>Background reading:</strong> Distinguish &quot;most common brain tumor overall&quot; (metastases) from &quot;most common primary brain tumor&quot; (meningioma) and &quot;most common malignant primary brain tumor&quot; (glioblastoma) \u2014 a frequent exam distinction. Lung cancer is the most common source of brain metastases.</p>","no_key":false,"no_options":false,"free_answer":null,"number":129},{"stem":"What is one of the only remaining indications for the use of Meperidine (Demerol)?","options":[],"correct":null,"free_answer":"Shivering (postoperative/post-anesthetic shivering).","explanation":"<p><strong>Why &quot;shivering&quot; (postoperative/post-anesthetic shivering) is correct:</strong></p>\n<p>Meperidine is the most established and commonly used agent for treating and preventing postoperative and post-anesthetic shivering, with efficacy substantially greater than expected from its analgesic potency (Kranke et al., Anesthesia &amp; Analgesia, 2002; Park et al., Critical Care Medicine, 2012).</p>\n<p>Its distinctive anti-shivering effect is attributed to kappa-opioid receptor activity, which is not shared by other opioids at equianalgesic doses.</p>","no_key":false,"no_options":true,"number":130}];</script>
<script>
(function(){
  const STORAGE_KEY = 'progress-v1';
  // Namespaced by page title so multiple quiz files hosted/opened together
  // (outside Claude, where window.storage isn't available) don't clobber
  // each other's saved progress in the same browser's localStorage.
  const LOCAL_STORAGE_KEY = 'examquiz-progress:' + (document.title || 'default');
  let state = { answers: {}, flagged: {}, struck: {}, notes: {} }; // answers[num]={selected,correct}; struck[num]={LETTER:true}; notes[num]=string
  let filter = 'all';
  let currentIndex = 0;
  let pendingSelections = {}; // qnum -> letter, chosen but not yet confirmed (session-only)
  let notesSaveTimer = null;
  const BANNER_POPUP_IDS = ['calc-panel', 'settings-panel', 'notes-panel-popup'];

  // Builds a pre-filled link to the bug-report Google Form for a given
  // question, using this page's exam title (its <h1>) and the question
  // number. Configured once per skill in quiz_template.html via
  // window.BUG_REPORT_CONFIG -- see SKILL.md's bug-reporting section.
  // Returns '' (and the caller hides the button) if that config still has
  // its placeholder values, so an unconfigured quiz never ships a broken
  // "Report issue" link that quietly goes nowhere.
  function buildReportUrl(questionNumber) {
    const cfg = window.BUG_REPORT_CONFIG || {};
    if (!cfg.formBaseUrl || cfg.formBaseUrl.indexOf('REPLACE_WITH') === 0) return '';
    const examTitle = (document.querySelector('header.top h1') || {}).textContent || document.title || '';
    try {
      const url = new URL(cfg.formBaseUrl);
      url.searchParams.set('usp', 'pp_url');
      if (cfg.examEntryId) url.searchParams.set(cfg.examEntryId, examTitle.trim());
      if (cfg.questionEntryId) url.searchParams.set(cfg.questionEntryId, String(questionNumber));
      return url.toString();
    } catch (e) {
      return '';
    }
  }

  // Closes every banner popover (calculator, settings, notes) except the
  // one whose panel id is passed in -- keeps the three mutually exclusive
  // without each toggle handler needing to know about the other two by
  // name. Add new banner popovers to BANNER_POPUP_IDS above and they get
  // this behavior for free.
  function closeOtherBannerPopups(exceptPanelId) {
    BANNER_POPUP_IDS.forEach(id => {
      if (id === exceptPanelId) return;
      const el = document.getElementById(id);
      if (el) el.classList.add('hidden');
    });
  }

  const FILTERS = [
    ['all', 'All'],
    ['unanswered', 'Unanswered'],
    ['incorrect', 'Incorrect'],
    ['flagged', 'Flagged'],
  ];

  function questionStatus(q) {
    const a = state.answers[q.number];
    if (!a) return 'unanswered';
    if (q.no_options || q.no_key) return 'nokey-done';
    return a.correct ? 'correct' : 'incorrect';
  }

  function visibleList() {
    return QUIZ_DATA.filter(q => {
      if (filter === 'unanswered') return !state.answers[q.number];
      if (filter === 'incorrect') {
        const a = state.answers[q.number];
        return a && !a.correct && !q.no_options && !q.no_key;
      }
      if (filter === 'flagged') return !!state.flagged[q.number];
      return true;
    });
  }

  function renderFilters() {
    const el = document.getElementById('filter-tabs');
    el.innerHTML = '';
    FILTERS.forEach(([key, label]) => {
      const b = document.createElement('button');
      b.textContent = label;
      if (filter === key) b.classList.add('active');
      b.onclick = () => { filter = key; currentIndex = 0; renderAll(); };
      el.appendChild(b);
    });
  }

  function renderGrid() {
    const grid = document.getElementById('qgrid');
    grid.innerHTML = '';
    const list = visibleList();
    if (list.length === 0) {
      const empty = document.createElement('div');
      empty.style.gridColumn = '1 / -1';
      empty.style.color = 'var(--muted)';
      empty.style.fontSize = '12.5px';
      empty.style.textAlign = 'center';
      empty.style.padding = '10px 0';
      empty.textContent = 'No questions here.';
      grid.appendChild(empty);
      return;
    }
    list.forEach((q, i) => {
      const b = document.createElement('button');
      b.textContent = q.number;
      const status = questionStatus(q);
      if (status !== 'unanswered') b.classList.add(status);
      if (i === currentIndex) b.classList.add('current');
      if (state.flagged[q.number]) {
        const dot = document.createElement('span');
        dot.className = 'flagdot';
        b.appendChild(dot);
      }
      b.onclick = () => { currentIndex = i; renderAll(); scrollToTop(); };
      grid.appendChild(b);
    });
  }

  function renderStats() {
    const answeredNums = Object.keys(state.answers);
    const gradable = answeredNums.filter(n => {
      const q = QUIZ_DATA.find(x => x.number == n);
      return q && !q.no_options && !q.no_key;
    });
    const correctCount = gradable.filter(n => state.answers[n].correct).length;
    document.getElementById('stat-answered').textContent = answeredNums.length;
    document.getElementById('stat-correct').textContent = correctCount;
    document.getElementById('stat-pct').textContent = gradable.length
      ? Math.round(100 * correctCount / gradable.length) + '%'
      : '—';
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderPanel() {
    const panel = document.getElementById('qpanel');
    const list = visibleList();
    if (list.length === 0) {
      panel.innerHTML = '<div class="empty-state">Nothing to show for this filter. Try a different tab on the left.</div>';
      return;
    }
    if (currentIndex >= list.length) currentIndex = list.length - 1;
    const q = list[currentIndex];
    const answer = state.answers[q.number];
    const flagged = !!state.flagged[q.number];
    const pending = pendingSelections[q.number]; // letter picked but not confirmed yet

    let html = '';
    html += '<div class="qmeta">';
    html += '<div class="qnum">Question ' + q.number + '</div>';
    html += '<div class="qmeta-actions">';
    html += '<button class="flag-toggle ' + (flagged ? 'on' : '') + '" id="flag-btn">' + (flagged ? '&#9873; Flagged' : '&#9872; Flag for review') + '</button>';
    const reportUrl = buildReportUrl(q.number);
    if (reportUrl) {
      html += '<a class="report-btn" id="report-btn" href="' + reportUrl + '" target="_blank" rel="noopener">&#128027; Report issue</a>';
    }
    html += '</div>';
    html += '</div>';
    html += '<div class="stem">' + escapeHtml(q.stem) + '</div>';

    if (q.no_options) {
      if (!answer) {
        html += '<div class="noopts-box">This question\'s original answer choices weren\'t fully captured in the source material — only the key fact is available.</div>';
        html += '<button class="reveal-btn" id="reveal-btn">Reveal answer</button>';
      } else {
        html += '<div class="explain">';
        html += '<div class="verdict nokey">Key fact</div>';
        html += '<div class="explain-body"><p><strong>' + escapeHtml(q.free_answer || '') + '</strong></p>' + q.explanation + '</div>';
        html += '</div>';
      }
    } else if (q.options) {
      html += '<div class="options">';
      q.options.forEach(opt => {
        const struck = !answer && !!(state.struck[q.number] && state.struck[q.number][opt.letter]);
        let cls = 'opt';
        if (answer) {
          cls += ' locked';
          if (opt.letter === q.correct) cls += ' correct-answer';
          else if (opt.letter === answer.selected) cls += ' wrong-answer';
          if (opt.letter === answer.selected) cls += ' selected';
        } else if (struck) {
          cls += ' struck';
        } else if (pending === opt.letter) {
          cls += ' pending-selected';
        }
        html += '<div class="opt-row">';
        html += '<button class="' + cls + '" data-letter="' + opt.letter + '"' + (struck ? ' disabled' : '') + '>';
        html += '<span class="letter">' + opt.letter + '</span>';
        html += '<span class="text">' + escapeHtml(opt.text) + '</span>';
