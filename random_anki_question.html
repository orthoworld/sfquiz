<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Anki Questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F5F3;
    --surface: #FFFFFF;
    --ink: #1B2430;
    --muted: #64707D;
    --border: #DFE3E0;
    --accent: #3B7DD8;
    --accent-dark: #2A5DA8;
    --accent-tint: #EAF1FB;
    --correct: #1E8A5F;
    --correct-bg: #E7F5EE;
    --correct-border: #A9DDC4;
    --incorrect: #BF3F27;
    --incorrect-bg: #FBEAE5;
    --incorrect-border: #EFB7A8;
    --flag: #B9821A;
    --flag-bg: #FCF1DC;
    --flag-border: #ECD9AC;
    --nokey: #7C6FB0;
    --nokey-bg: #EFEBFA;
    --nokey-border: #D6CDEE;
    --explain-text: #384250;
    --claude-orange: #3B7DD8;
    --claude-orange-dark: #2A5DA8;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(27,36,48,0.06), 0 4px 14px rgba(27,36,48,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181B;
      --surface: #1E2226;
      --ink: #E8EAEC;
      --muted: #97A1A9;
      --border: #333A40;
      --accent: #5B9AE6;
      --accent-dark: #3B7DD8;
      --accent-tint: #1B2A3D;
      --correct: #58D399;
      --correct-bg: #17301F;
      --correct-border: #2D5238;
      --incorrect: #F0876D;
      --incorrect-bg: #3A211B;
      --incorrect-border: #62362A;
      --flag: #E3B04B;
      --flag-bg: #362C15;
      --flag-border: #5B4A24;
      --nokey: #BBA9F5;
      --nokey-bg: #2A2440;
      --nokey-border: #453B66;
      --explain-text: #C7CDD3;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
    }
  }
  /* Explicit user override (Settings menu), regardless of system preference */
  :root[data-theme="dark"] {
    --bg: #15181B;
    --surface: #1E2226;
    --ink: #E8EAEC;
    --muted: #97A1A9;
    --border: #333A40;
    --accent: #5B9AE6;
    --accent-dark: #3B7DD8;
    --accent-tint: #1B2A3D;
    --correct: #58D399;
    --correct-bg: #17301F;
    --correct-border: #2D5238;
    --incorrect: #F0876D;
    --incorrect-bg: #3A211B;
    --incorrect-border: #62362A;
    --flag: #E3B04B;
    --flag-bg: #362C15;
    --flag-border: #5B4A24;
    --nokey: #BBA9F5;
    --nokey-bg: #2A2440;
    --nokey-border: #453B66;
    --explain-text: #C7CDD3;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  /* Explicit full-viewport backdrop, independent of document/content height
     or the host page's own background. Covers overscroll/bounce areas on
     iOS and any gap if the rendered content is shorter than the viewport,
     both of which can otherwise reveal the host app's own background
     color showing through instead of ours. Always in sync with the
     current theme since it references the same live CSS variable. */
  .bg-fill {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: -1;
  }
  #app {
    max-width: 1180px;
    margin: 0 auto;
    padding: 20px 20px 60px;
  }
  .cw-banner {
    background: linear-gradient(135deg, var(--claude-orange), var(--claude-orange-dark));
    color: #fff;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Inter', sans-serif;
  }
  .cw-banner-inner {
    max-width: 1180px;
    margin: 0 auto;
    width: 100%;
    display: grid;
    grid-template-columns: auto 1fr auto;
    grid-template-areas: "brand score settings";
    align-items: center;
    gap: 14px;
  }
  @media (max-width: 640px) {
    .cw-banner-inner {
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "brand settings"
        "score score";
      row-gap: 10px;
    }
    /* 3 icon buttons (notes/calculator/settings) plus the full brand
       cluster (bone + "All Quizzes" pill + "OrthoWorld" title) cannot
       both fit on one row at real phone widths (~375-430px) -- confirmed
       overflowing off the right edge of the viewport at 390px wide, with
       the calculator/settings icons partly or fully cut off. Dropping
       the "OrthoWorld" text here is the fix: the bone icon + home-link
       pill still clearly brand the page (and the domain itself is
       visible in the browser chrome), and it frees enough width that
       the icon row no longer needs to shrink itself to compensate. If
       you ever add a 4th banner icon, re-measure at 375px/390px again
       before assuming this still fits -- don't just eyeball it at
       desktop width.  */
    .cw-banner-title { display: none; }
  }
  .cw-brand {
    grid-area: brand;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cw-home-link {
    color: #fff;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    background: rgba(255,255,255,0.16);
    border-radius: 999px;
    padding: 5px 12px;
    white-space: nowrap;
  }
  .cw-home-link:hover { background: rgba(255,255,255,0.28); }
  .cw-banner-score {
    grid-area: score;
    display: flex;
    justify-content: center;
    min-width: 0;
  }
  .cw-banner-icon {
    flex: 0 0 30px;
    width: 30px;
    height: 30px;
  }
  .cw-banner-title {
    font-weight: 700;
    font-size: 1.4667rem;
    letter-spacing: -0.01em;
  }
  .cw-icons {
    grid-area: settings;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cw-settings { position: relative; }
  .cw-calc { position: relative; }
  .cw-notes { position: relative; }
  .settings-gear {
    background: rgba(255,255,255,0.16);
    border: none;
    border-radius: 8px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
  }
  .settings-gear:hover { background: rgba(255,255,255,0.26); }
  .settings-panel {
    position: absolute;
    top: 42px;
    right: 0;
    width: 264px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    padding: 14px;
    z-index: 20;
    color: var(--ink);
  }
  .settings-panel.hidden { display: none; }
  .calc-panel { width: 224px; }
  .notes-popup-panel { width: 280px; }
  .calc-display {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    text-align: right;
    font-family: 'Source Serif 4', serif;
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--ink);
    overflow-x: auto;
    white-space: nowrap;
  }
  .calc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 10px;
  }
  .calc-btn {
    height: 40px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .calc-btn:hover { border-color: var(--accent); }
  .calc-op { background: var(--accent-tint); color: var(--accent-dark); }
  .calc-zero { grid-column: span 2; }
  .calc-equals { background: var(--accent); color: #fff; border-color: var(--accent); }
  .calc-equals:hover { background: var(--accent-dark); }
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .settings-row + .settings-row { margin-top: 14px; }
  .settings-link {
    display: block;
    width: 100%;
    color: var(--ink);
    font-size: 0.8667rem;
    font-weight: 600;
    text-decoration: none;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .settings-link:hover { color: var(--accent-dark); }
  .settings-label {
    font-size: 0.8667rem;
    font-weight: 600;
    color: var(--muted);
  }
  .settings-stepper {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .settings-stepper button {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: inherit;
  }
  .settings-stepper button:hover { border-color: var(--accent); color: var(--accent-dark); }
  #font-pct {
    font-size: 0.8rem;
    color: var(--muted);
    min-width: 34px;
    text-align: center;
  }
  .settings-seg {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
  }
  .settings-seg button {
    background: var(--bg);
    border: none;
    border-left: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.7333rem;
    font-weight: 600;
    padding: 5px 7px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .settings-seg button:first-child { border-left: none; }
  .settings-seg button.active { background: var(--accent); color: #fff; }
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 28px;
  }
  header.top h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 1.4rem;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header.top .sub {
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.55;
    margin-top: 6px;
  }
  .score-pill {
    display: flex;
    align-items: center;
    gap: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: 999px;
    padding: 8px 20px;
    box-shadow: var(--shadow);
  }
  .score-pill .stat { text-align: center; }
  .score-pill .stat .num { font-size: 1.1333rem; font-weight: 700; font-family: 'Source Serif 4', serif; }
  .score-pill .stat .lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .score-pill .divider { width: 1px; height: 26px; background: var(--border); }

  .layout {
    display: grid;
    grid-template-columns: 264px 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .nav-panel { order: 2; position: static; }
    .qgrid { grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); }
  }
  @media (max-width: 480px) {
    #app { padding: 14px 14px 40px; }
    header.top h1 { font-size: 1.4rem; }
    header.top { margin-bottom: 22px; gap: 16px; }
    .score-pill { padding: 7px 14px; gap: 12px; }
    .score-pill .stat .num { font-size: 1rem; }
    .score-pill .divider { height: 22px; }
    .qpanel { padding: 18px 16px 16px; min-height: 0; }
    .qmeta { flex-direction: column; align-items: flex-start; gap: 10px; }
    .qmeta-actions { width: 100%; }
    .flag-toggle, .report-btn { flex: 1; justify-content: center; }
    .stem { font-size: 1.1333rem; margin-bottom: 16px; }
    .opt { padding: 11px 12px; font-size: 0.9667rem; }
    .strike-btn { flex-basis: 30px; }
    .confirm-btn { width: 100%; text-align: center; }
    .footer-nav { margin-top: 18px; padding-top: 12px; flex-wrap: wrap; }
    .position { order: -1; flex-basis: 100%; text-align: center; margin-bottom: 10px; font-size: 0.8rem; }
    .navbtn { padding: 9px 14px; font-size: 0.8667rem; }
  }

  .nav-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    position: sticky;
    top: 16px;
    box-shadow: var(--shadow);
  }
  .notes-panel-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .notes-panel-title .grid-label { margin-bottom: 0; }
  .notes-qnum {
    font-size: 0.75rem;
    color: var(--muted);
    font-weight: 600;
  }
  .notes-textarea {
    width: 100%;
    min-height: 220px;
    resize: vertical;
    box-sizing: border-box;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
  }
  .notes-textarea:focus { outline: none; border-color: var(--accent); }
  .notes-hint {
    margin-top: 8px;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .filter-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .filter-tabs button {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 600;
    padding: 5px 9px;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
  }
  .filter-tabs button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .grid-label {
    font-size: 0.7333rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .qgrid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    max-height: 360px;
    overflow-y: auto;
    padding-right: 14px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .qgrid::-webkit-scrollbar { width: 8px; }
  .qgrid::-webkit-scrollbar-track { background: transparent; }
  .qgrid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .qgrid::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  .qgrid button {
    aspect-ratio: 1;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    position: relative;
    padding: 0;
  }
  .qgrid button.current { box-shadow: inset 0 0 0 2px var(--accent-dark); }
  .qgrid button.correct { background: var(--correct-bg); border-color: var(--correct-border); color: var(--correct); }
  .qgrid button.incorrect { background: var(--incorrect-bg); border-color: var(--incorrect-border); color: var(--incorrect); }
  .qgrid button.nokey-done { background: var(--nokey-bg); border-color: var(--nokey-border); color: var(--nokey); }
  .qgrid button .flagdot {
    position: absolute; top: 2px; right: 2px;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--flag);
  }
  .legend {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 0.7667rem;
    color: var(--muted);
  }
  .legend span.sw { display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:6px; vertical-align: -1px;}
  .reset-btn {
    margin-top: 14px;
    width: 100%;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.8rem;
    padding: 7px;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
  }
  .reset-btn:hover { color: var(--incorrect); border-color: var(--incorrect-border); }

  .qpanel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 26px 28px 22px;
    box-shadow: var(--shadow);
    min-height: 420px;
  }
  .qmeta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .qmeta .qnum {
    font-size: 0.8333rem;
    font-weight: 700;
    color: var(--accent-dark);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .flag-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid var(--border);
    padding: 5px 11px;
    border-radius: 7px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
  }
  .flag-toggle.on {
    background: var(--flag-bg);
    border-color: var(--flag-border);
    color: var(--flag);
  }
  .qmeta-actions {
    display: flex;
    gap: 8px;
  }
  .report-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid var(--border);
    padding: 5px 11px;
    border-radius: 7px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
    text-decoration: none;
  }
  .report-btn:hover {
    border-color: #c0392b;
    color: #c0392b;
  }
  .stem {
    font-family: 'Source Serif 4', serif;
    font-size: 1.2667rem;
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .options { display: flex; flex-direction: column; gap: 9px; }
  .opt-row { display: flex; align-items: stretch; gap: 8px; }
  .opt-row .opt { flex: 1; }
  .strike-btn {
    flex: 0 0 34px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    border-radius: 8px;
    cursor: pointer;
    color: var(--muted);
    font-size: 0.8667rem;
    font-weight: 600;
    font-family: inherit;
  }
  .strike-btn:hover { border-color: var(--muted); color: var(--ink); }
  .strike-btn.active { background: var(--ink); border-color: var(--ink); color: #fff; }
  .opt {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    text-align: left;
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    font-family: inherit;
    font-size: 1rem;
    color: var(--ink);
    transition: border-color .12s, background .12s;
  }
  .opt:hover:not(.locked):not(.struck) { border-color: var(--accent); background: var(--accent-tint); }
  .opt .letter {
    flex: 0 0 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.8333rem;
    color: var(--muted);
  }
  .opt .text { padding-top: 2px; }
  .opt.selected .letter { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opt.correct-answer { border-color: var(--correct-border); background: var(--correct-bg); }
  .opt.correct-answer .letter { background: var(--correct); border-color: var(--correct); color: #fff; }
  .opt.wrong-answer { border-color: var(--incorrect-border); background: var(--incorrect-bg); }
  .opt.wrong-answer .letter { background: var(--incorrect); border-color: var(--incorrect); color: #fff; }
  .opt.locked { cursor: default; }
  .opt.struck { cursor: default; background: var(--bg); opacity: 0.6; }
  .opt.struck .text { text-decoration: line-through; }
  .opt.pending-selected { border-color: var(--accent); background: var(--accent-tint); }
  .opt.pending-selected .letter { background: var(--accent); border-color: var(--accent); color: #fff; }

  .confirm-btn {
    margin-top: 6px;
    align-self: flex-start;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
  }
  .confirm-btn:hover:not(:disabled) { background: var(--accent-dark); }
  .confirm-btn:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
  }

  .noopts-box {
    background: var(--nokey-bg);
    border: 1px solid var(--nokey-border);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 0.9333rem;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .reveal-btn {
    margin-top: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
  }

<script>
const QUIZ_DATA = [{"number":1,"stem":"A 70 year old woman with chronic renal disease and chronic obstructive pulmonary disease (COPD) is struck by a car while crossing a street. In the Emergency Room she had a GCS of 15 with normal vital signs. She complains of diffuse chest wall pain. Blood tests show: NA 144, K 4.6, Cl 110, CO2 14, Creatinine 350. ABG on nasal prongs 4L/m: pH 7.10, pCO2 65, pO2 70. What is this patient's acid-base disorder?","options":[{"letter":"A","text":"Anion-gap metabolic acidosis."},{"letter":"B","text":"Non-anion gap metabolic acidosis."},{"letter":"C","text":"Respiratory acidosis."},{"letter":"D","text":"Mixed respiratory and metabolic acidosis."}],"correct":"D","explanation":"<p><strong>Why &quot;mixed respiratory and metabolic acidosis&quot; is correct:</strong> The pH of 7.10 indicates significant acidemia. Two independent acid-base derangements are present:</p>\n<p><strong>Metabolic acidosis</strong> \u2014 the bicarbonate (CO2/HCO\u2083\u207b) is low at 14 mmol/L, and the anion gap = Na \u2212 (Cl + HCO\u2083\u207b) = 144 \u2212 (110 + 14) = <strong>20 mEq/L</strong>, which is elevated (normal ~8\u201312). This is a high-anion-gap metabolic acidosis, physiologically consistent with her chronic renal disease (creatinine 350 \u00b5mol/L, retention of unmeasured anions).</p>\n\n<p><strong>Respiratory acidosis</strong> \u2014 the expected respiratory compensation for a bicarbonate of 14 by Winters formula is pCO\u2082 = (1.5 \u00d7 14) + 8 \u00b1 2 = <strong>27\u201331 mmHg</strong>. The measured pCO\u2082 is 65 mmHg, far higher than the compensatory prediction. When the actual pCO\u2082 substantially exceeds the predicted value, a superimposed (primary) respiratory acidosis is diagnosed (Berend, New England Journal of Medicine, 2018; Berend et al., New England Journal of Medicine, 2014). Her COPD (baseline CO\u2082 retention) plus splinting/hypoventilation from traumatic chest wall pain explains the respiratory component.</p>\n<p>Because both a primary metabolic acidosis and a primary respiratory acidosis coexist and drive the pH down together, the single best answer is a mixed disorder.</p>\n<p><strong>Why the other answers are incorrect:</strong></p>\n<p><strong>anion-gap metabolic acidosis:</strong> This is present and true in isolation (gap = 20), but it is incomplete. It ignores the markedly elevated pCO\u2082 of 65, which is not explained by compensation and represents a second primary disorder. Naming only the metabolic component understates the derangement.</p>\n\n<p><strong>non-anion gap metabolic acidosis:</strong> Incorrect on the numbers. The calculated anion gap is elevated at 20, so any metabolic acidosis here is a high-gap, not a normal-gap (hyperchloremic), acidosis.</p>\n\n<p><strong>respiratory acidosis:</strong> True that pCO\u2082 is elevated, but this label alone ignores the low bicarbonate and elevated anion gap. It also cannot by itself explain a pH as low as 7.10 given the degree of hypercapnia.</p>\n<p><strong>Background:</strong> Winters formula (pCO\u2082 = 1.5 \u00d7 [HCO\u2083\u207b] + 8 \u00b1 2) predicts the expected respiratory compensation for a metabolic acidosis; a measured pCO\u2082 above the predicted range signals a concomitant respiratory acidosis, and below it a concomitant respiratory alkalosis (Berend et al., New England Journal of Medicine, 2014). The anion gap, Na \u2212 (Cl + HCO\u2083\u207b), differentiates high-gap from normal-gap metabolic acidosis (Seifter, New England Journal of Medicine, 2014).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":2,"stem":"A 19 year old man is injured in a high speed motor vehicle crash. He is intubated for a GCS of 5. He also suffers from multiple rib fractures and a femur fracture. A CT scan shows evidence of an elevated intracranial pressure. During transfer to a Trauma Centre, his elevated ICP should be managed with all of the following EXCEPT?","options":[{"letter":"A","text":"IV Propofol and muscle paralysis."},{"letter":"B","text":"Mannitol infusion over one hour."},{"letter":"C","text":"Solu-Medrol 1 gram IV bolus."},{"letter":"D","text":"Mechanical ventilation to a pCO2 of 35 mmHg."}],"correct":"C","explanation":"<p><strong>Why &quot;Solu-Medrol 1 gram IV bolus&quot; is correct (the EXCEPT answer):</strong> Corticosteroids are contraindicated in traumatic brain injury. The CRASH trial (10,008 patients) randomized head-injured patients (GCS \u226414) to IV methylprednisolone versus placebo and was halted early for harm: 2-week mortality was 21% with steroids versus 18% with placebo (relative risk 1.18, 95% CI 1.09\u20131.27), with excess mortality persisting at 6 months. This produced a Level I Brain Trauma Foundation recommendation against steroid use in severe TBI (Carney et al., Brain Trauma Foundation, 4th Edition, 2016; Alderson &amp; Roberts, Cochrane, 2005). Giving Solu-Medrol here would be actively harmful, making it the intervention that should NOT be used.</p>\n<p><strong>Why the other answers are incorrect (i.e., they ARE appropriate):</strong></p>\n<p><strong>IV Propofol and muscle paralysis:</strong> Sedation/analgesia is a foundational tier of ICP control \u2014 it reduces cerebral metabolic demand, prevents hypertension and ventilator dyssynchrony, and (with neuromuscular blockade) minimizes surges in intrathoracic and intracranial pressure, which is especially relevant during a bumpy transfer. Appropriate (Stocchetti &amp; Maas, New England Journal of Medicine, 2014).</p>\n\n<p><strong>Mannitol infusion:</strong> Osmotherapy with mannitol (typical effective dose 0.25\u20131.0 g/kg) reduces brain water and ICP and is a standard first-tier measure for elevated ICP, appropriate to give during transfer (Ghajar, Lancet, 2000; Stocchetti &amp; Maas, New England Journal of Medicine, 2014). Note: mannitol is usually given as a relatively rapid infusion (e.g., over 15\u201320 minutes) rather than over a full hour, but the drug itself is a correct and indicated therapy \u2014 it is not the intended &quot;EXCEPT.&quot;</p>\n\n<p><strong>Mechanical ventilation to a pCO2 of 35 mmHg:</strong> Targeting a pCO\u2082 at the low end of normal (around 35 mmHg) is appropriate. Mild, controlled hypocapnia (pCO\u2082 30\u201335 mmHg) is an accepted temporizing measure for elevated ICP, particularly while awaiting definitive neurosurgical care; profound/prophylactic hyperventilation is what is avoided because of ischemia risk (Sahuquillo &amp; Dennis, Cochrane, 2019; Picetti et al., World Society of Emergency Surgery, 2023). A target of 35 mmHg is reasonable and does not represent aggressive hyperventilation.</p>\n<p><strong>Background:</strong> The &quot;staircase&quot; approach to ICP escalates from head elevation, normocarbic ventilation, sedation and analgesia, through CSF drainage, hyperosmolar therapy, mild hypocapnia, and finally barbiturates/decompressive craniectomy (Stocchetti &amp; Maas, New England Journal of Medicine, 2014). Steroids are notably absent from this ladder for trauma because of demonstrated harm.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":3,"stem":"Which of the following statements about organ donation is NOT true?","options":[{"letter":"A","text":"A 65 year old brain dead patient would not be considered for organ donation."},{"letter":"B","text":"Donor management is directed towards maintaining organ perfusion."},{"letter":"C","text":"Separating notification of brain death from the request for donation leads to higher consent rates."},{"letter":"D","text":"Hospitals are required to notify Trillium Gift of Life (organ procurement organization) of deaths."}],"correct":"A","explanation":"<p><strong>Why &quot;a 65 year old brain dead patient would not be considered for organ donation&quot; is correct (the NOT-true answer):</strong> Age is a relative, not absolute, contraindication to donation. Absolute contraindications center on transmissible disease and malignancy (e.g., HIV, active hepatitis B/C, uncontrolled sepsis, prion disease, metastatic cancer) \u2014 not chronologic age (Sairanen et al., European Journal of Neurology, 2013; Araji et al., PLoS One, 2023). The donor pool has deliberately expanded to include older donors, and organs from donors older than 55\u201364 years are routinely used with acceptable outcomes (Hauptman &amp; O&#x27;Connor, New England Journal of Medicine, 1997). A 65-year-old brain-dead patient would absolutely be evaluated by the organ procurement organization, so the blanket statement that they &quot;would not be considered&quot; is false.</p>\n<p><strong>Why the other answers are incorrect (i.e., they ARE true statements):</strong></p>\n<p><strong>donor management is directed towards maintaining organ perfusion:</strong> True. After declaration of death, donor management shifts to physiologic support that preserves end-organ perfusion and viability (hemodynamic, ventilatory, and hormonal support) until recovery (Whalen et al., American Academy of Pediatrics, 2025).</p>\n\n<p><strong>separating notification of brain death from the request for donation leads to higher consent rates:</strong> True. &quot;Decoupling&quot; \u2014 allowing the family to absorb the news of death before a trained requestor (typically the OPO) raises donation \u2014 consistently improves consent rates and is standard best practice.</p>\n\n<p><strong>hospitals are required to notify the organ procurement organization of deaths:</strong> True. Federal/regulatory mandate requires notification of the designated OPO (Trillium Gift of Life in Ontario) for every impending or actual death, so the OPO \u2014 not the treating team \u2014 determines donor suitability (Whalen et al., American Academy of Pediatrics, 2025).</p>\n<p><strong>Background:</strong> The OPO, not the bedside clinician, decides suitability, which is why routine referral of all deaths matters \u2014 clinicians consistently underestimate who can donate, and eligible donors are otherwise missed (Whalen et al., American Academy of Pediatrics, 2025).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":4,"stem":"A 36 year old man with HIV infection and a CD4 count of 500/mm3 has an incarcerated groin hernia. In addition to universal precautions, which of the following is recommended?","options":[{"letter":"A","text":"Avoidance of prosthetic mesh."},{"letter":"B","text":"Disposable surgical instruments."},{"letter":"C","text":"Double gloving."},{"letter":"D","text":"Prophylactic trimethoprim/sulfamethoxazole."}],"correct":"C","explanation":"<p><strong>Why &quot;double gloving&quot; is correct:</strong> Double gloving reduces occupational blood exposure and is recommended for operating on patients with blood-borne infections such as HIV. Moderate-quality Cochrane evidence shows double gloving reduces inner-glove perforation by ~71% and blood contamination by ~65% versus single gloving, with a similar benefit in high-HIV-prevalence settings (Mischke et al., Cochrane, 2014). The classic San Francisco General Hospital data likewise concluded that double gloving should be routine, cutting inner-glove perforation by &gt;60% and preventing cutaneous hand exposure (Gerberding et al., New England Journal of Medicine, 1990). It is the appropriate additional measure here.</p>\n<p><strong>Why the other answers are incorrect:</strong></p>\n<p><strong>avoidance of prosthetic mesh:</strong> Not indicated. HIV infection with a preserved CD4 count (500/mm\u00b3) is not a contraindication to mesh; standard tension-free mesh repair remains appropriate, and avoiding mesh would compromise the durability of the hernia repair with no infection-control benefit to staff.</p>\n\n<p><strong>disposable surgical instruments:</strong> Not required. Standard sterilization/reprocessing of reusable instruments is fully adequate for HIV; disposable instruments confer no additional protection and are not recommended.</p>\n\n<p><strong>prophylactic trimethoprim/sulfamethoxazole:</strong> Not indicated at this CD4 count. Pneumocystis (and toxoplasma) prophylaxis with TMP-SMX is recommended when CD4 falls below ~200/mm\u00b3 (or with specific AIDS-defining criteria). At CD4 500/mm\u00b3 there is no indication for opportunistic-infection prophylaxis, and it plays no role in perioperative occupational protection.</p>\n<p><strong>Background:</strong> Modern infection control is exposure-based rather than diagnosis-based: because serostatus is often unknown, high standards (universal precautions plus barrier measures such as double gloving) should be applied to all patients rather than reserved for those with known HIV (Gerberding et al., New England Journal of Medicine, 1990).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":5,"stem":"Which of the following conditions is not an indication for a \"damage control\" approach to the management of traumatic injuries?","options":[{"letter":"A","text":"Diffuse bleeding secondary to coagulopathy."},{"letter":"B","text":"Severe metabolic acidosis."},{"letter":"C","text":"Hypothermia (core temp <32)."},{"letter":"D","text":"Sustained supraventricular tachycardia (HR >140)."}],"correct":"D","explanation":"<p><strong>Why &quot;sustained supraventricular tachycardia (HR &gt;140)&quot; is correct (the NOT-an-indication answer):</strong> Damage-control surgery is triggered by the &quot;lethal triad&quot; of coagulopathy, acidosis, and hypothermia (plus injury patterns/physiology precluding definitive repair) \u2014 not by an isolated arrhythmia. Sinus tachycardia is an expected response to hemorrhagic shock, but &quot;sustained supraventricular tachycardia&quot; as an intrinsic rhythm is not among the recognized triggers for a damage-control strategy (Spahn et al., European Guideline, Critical Care, 2019; King, New England Journal of Medicine, 2019; Rossaint et al., European Guideline, Critical Care, 2023). It is the odd one out.</p>\n<p><strong>Why the other answers are incorrect (i.e., they ARE indications):</strong></p>\n<p><strong>diffuse bleeding secondary to coagulopathy:</strong> A core component of the lethal triad. Recalcitrant/non-mechanical (&quot;medical&quot;) coagulopathic bleeding is a classic trigger to abort definitive repair, pack, and return after resuscitation (Spahn et al., Critical Care, 2019; King, New England Journal of Medicine, 2019).</p>\n\n<p><strong>severe metabolic acidosis:</strong> A core component of the lethal triad; a threshold of pH \u22647.2 (or base deficit &lt; \u221214 mmol/L) is a widely cited trigger for damage control (Spahn et al., Critical Care, 2019; Urushibata et al., Scientific Reports, 2019).</p>\n\n<p><strong>hypothermia (core temp &lt;32):</strong> A core component of the lethal triad; commonly cited surgical triggers are a temperature \u226434\u201335 \u00b0C, so a core temperature below 32 \u00b0C is well within the indication (Spahn et al., Critical Care, 2019).</p>\n<p><strong>Background:</strong> Damage control mitigates the self-amplifying &quot;bloody vicious cycle&quot; of hypothermia, acidosis, and coagulopathy through an abbreviated initial operation (hemorrhage and contamination control, temporary closure), ICU resuscitation to correct physiology, and planned re-exploration for definitive repair (King, New England Journal of Medicine, 2019). The sixth-edition European guideline stresses reserving damage control for patients in whom the lethal triad is present and definitive surgery is not feasible (Rossaint et al., Critical Care, 2023).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":6,"stem":"A 45 year old man with severe morbid obesity (BMI 70) is about to undergo a laparoscopic gastric bypass procedure. Induction of anesthesia and intubation are best accomplished with?","options":[{"letter":"A","text":"Rapid sequence induction and intubation to avoid aspiration."},{"letter":"B","text":"Routine induction and oral tracheal intubation."},{"letter":"C","text":"Routine induction and nasal tracheal intubation."},{"letter":"D","text":"Awake fiber-optic intubation followed by induction of general anesthesia."}],"correct":"D","explanation":"<p><strong>Why &quot;awake fiber-optic intubation followed by induction of general anesthesia&quot; is correct:</strong> A BMI of 70 represents super-morbid obesity, a setting with markedly reduced functional residual capacity, very short safe apnea time, high rates of difficult mask ventilation, and elevated rates of difficult laryngoscopy (large neck circumference and high Mallampati are the strongest predictors) (Poirier et al., AHA Science Advisory, Circulation, 2009). When a difficult airway is anticipated to this degree, securing the airway while the patient continues to breathe spontaneously is the safest strategy, because loss of spontaneous ventilation before the tube is placed can precipitate a &quot;can&#x27;t intubate, can&#x27;t ventilate&quot; emergency with rapid catastrophic desaturation (Russotto et al., Intensive Care Medicine, 2026). Awake fiber-optic (or awake video-laryngoscopic) intubation preserves ventilation and airway tone until the tube is confirmed, then general anesthesia is induced.</p>\n<p><strong>Practical caveat (modern nuance):</strong> Contemporary difficult-airway and bariatric ERAS pathways increasingly favor awake <strong>video laryngoscopy</strong> as an equally valid alternative to awake fiberoptic intubation in experienced hands, and video laryngoscopy improves first-attempt success versus direct laryngoscopy in patients with obesity (Marinari et al., Surgical Endoscopy, 2022; Carron et al., Obesity Surgery, 2021). The unifying principle the question is testing \u2014 keep the patient breathing and awake until the airway is secured in an anticipated difficult airway \u2014 is what makes the &quot;awake&quot; option correct regardless of the specific device.</p>\n<p><strong>Why the other answers are incorrect:</strong></p>\n<p><strong>Rapid sequence induction and intubation to avoid aspiration:</strong> RSI abolishes spontaneous ventilation and, in a BMI 70 patient, produces rapid desaturation; if intubation then fails, rescue ventilation may be impossible. Aspiration risk does not override the greater danger of an unsecured airway after apnea in this population (Russotto et al., Intensive Care Medicine, 2026).</p>\n\n<p><strong>Routine induction and oral tracheal intubation:</strong> Same fundamental flaw \u2014 inducing general anesthesia before securing an anticipated difficult airway risks loss of both ventilation and intubating conditions (Poirier et al., Circulation, 2009).</p>\n\n<p><strong>Routine induction and nasal tracheal intubation:</strong> Nasotracheal intubation is not indicated for laparoscopic abdominal surgery, adds mucosal trauma and bleeding risk, and still requires induction before the airway is secured; it confers no advantage here.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":7,"stem":"Which of the following ECG changes is least likely to occur with hypokalemia?","options":[{"letter":"A","text":"ST-T segment depression."},{"letter":"B","text":"T-wave inversion."},{"letter":"C","text":"Second or third degree AV block."},{"letter":"D","text":"PVCs."}],"correct":"C","explanation":"<p><strong>Why &quot;second or third degree AV block&quot; is correct:</strong> The characteristic ECG signature of hypokalemia is repolarization change: ST-segment depression, decreased T-wave amplitude with T-wave flattening/inversion, and prominent U waves (which can fuse with the T wave to give apparent QT prolongation) (Sandau et al., AHA Scientific Statement, Circulation, 2017; Bhasin et al., JAMA Internal Medicine, 2021). In a large multicenter cohort, decreasing potassium produced concentration-dependent increases in ST depression and T-wave flattening/inversion (Kildegaard et al., Journal of Internal Medicine, 2024). Hypokalemia is associated with enhanced automaticity and ventricular ectopy (PVCs, VT, torsades). High-grade AV block (second- or third-degree) is not a typical feature \u2014 while hypokalemia can occasionally be associated with first- or second-degree AV block, advanced AV block is distinctly uncommon and is far more characteristic of <strong>hyperkalemia</strong> \u2014 making it the least likely of the listed findings.</p>\n<p><strong>Why the other answers are incorrect (i.e., they ARE likely with hypokalemia):</strong></p>\n<p><strong>ST-T segment depression:</strong> A classic, common hypokalemic finding, present in up to 36% of patients with K\u207a &lt;2.5 mmol/L (Kildegaard et al., Journal of Internal Medicine, 2024).</p>\n\n<p><strong>T-wave inversion:</strong> Reduced T-wave amplitude progressing to T-wave flattening/inversion is a hallmark repolarization change of hypokalemia (DeFilippis &amp; Yeh, JAMA Internal Medicine, 2018).</p>\n\n<p><strong>PVCs:</strong> Hypokalemia promotes ventricular ectopy and arrhythmia (PVCs, VT, torsades de pointes, VF) (Sandau et al., Circulation, 2017).</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":8,"stem":"A 70 year old man with severe COPD requires an elective sigmoid colon resection for cancer. You are particularly concerned about post-op respiratory complications. Which of the following is most likely to help avoid these complications?","options":[{"letter":"A","text":"Post-operative analgesia with PCA morphine."},{"letter":"B","text":"Post-operative epidural analgesia."},{"letter":"C","text":"Perioperative corticosteroid administration."},{"letter":"D","text":"Post-operative mechanical ventilation for 1-2 days."}],"correct":"B","explanation":"<p><strong>Why &quot;post-operative epidural analgesia&quot; is correct:</strong> In COPD patients undergoing major abdominal surgery, epidural analgesia is independently associated with fewer postoperative pulmonary complications. A cohort of 541 COPD patients found epidural analgesia reduced postoperative pneumonia (adjusted OR 0.5; 95% CI 0.3\u20130.9) with the greatest benefit in the most severe COPD (van Lier et al., Anesthesiology, 2011). Regional/neuraxial techniques reduce pneumonia, prolonged ventilator dependence, and unplanned reintubation versus general anesthesia in COPD (Hausman et al., Anesthesia &amp; Analgesia, 2015), and neuraxial blockade reduces pneumonia and respiratory depression across meta-analyses (Wu &amp; Raja, Lancet, 2011). The MASTER trial showed lower respiratory failure with perioperative epidural analgesia in high-risk abdominal surgery (23% vs 30%) (Bartels et al., BMC Anesthesiology, 2022). GOLD notes the surgical site is the strongest predictor of pulmonary complications and that epidural/spinal techniques generally carry lower risk than general anesthesia (GOLD 2026 Report). Effective epidural analgesia reduces opioid requirement, preserves vital capacity and the ability to cough and deep-breathe, and lowers atelectasis and pneumonia risk.</p>\n<p><strong>Why the other answers are incorrect:</strong></p>\n<p><strong>Post-operative analgesia with PCA morphine:</strong> Systemic opioids cause dose-dependent respiratory depression and suppress cough, worsening the exact complications of concern in severe COPD; reducing systemic opioids is a central goal of enhanced-recovery pathways (Bartels et al., BMC Anesthesiology, 2022).</p>\n\n<p><strong>Perioperative corticosteroid administration:</strong> Routine perioperative steroids are not an evidence-based strategy to prevent pulmonary complications in stable COPD undergoing abdominal surgery; they add risks (hyperglycemia, impaired wound healing, infection). GOLD recommends optimizing established COPD medical therapy preoperatively, not empiric systemic steroids for prophylaxis (GOLD 2026 Report).</p>\n\n<p><strong>Post-operative mechanical ventilation for 1-2 days:</strong> Elective prolonged postoperative ventilation increases ventilator-associated pneumonia, barotrauma, and difficulty weaning a COPD patient; it is a complication to avoid, not a preventive measure.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":9,"stem":"A previously healthy 66 year old woman is brought to the Emergency Room after being found unconscious on her bathroom floor. On arrival, she is lethargic (GCS 14). Vitals are HR 110, BP 80/55, RR 18, O2 Sat 90 on N/P oxygen 4L/min. The abdomen is distended with generalized tenderness and guarding. Initial laboratory data include: Hgb 9.0 gm/dl, WBC 23,200 /mm3, Na 131 mol/L, K 2.9 mm/L, Cr 350 mmol/L, pH 7.08, lactate 7.4 mg/dL. The next step in her management should be?","options":[{"letter":"A","text":"Crystalloid resuscitation to normalize her serum lactate."},{"letter":"B","text":"Pulmonary artery catheter placement to guide fluid resuscitation."},{"letter":"C","text":"CT abdomen."},{"letter":"D","text":"Laparotomy."}],"correct":"D","explanation":"<p><strong>Why &quot;laparotomy&quot; is correct:</strong> This is septic shock (hypotension 80/55, tachycardia, profound metabolic/lactic acidosis with pH 7.08 and markedly elevated lactate, leukocytosis 23,200) from a clinically evident intra-abdominal catastrophe \u2014 a distended abdomen with generalized tenderness and guarding indicates diffuse peritonitis, almost certainly a perforated viscus. Source control is the decisive intervention: in gastrointestinal perforation with septic shock, survival falls sharply with each hour of delay to operative source control, with essentially no survivors when surgery is delayed beyond 6 hours (Azuhata et al., Critical Care, 2014). Guidelines direct emergent source control as soon as possible and warn that prolonged medical stabilization without source control in septic shock is unlikely to succeed (Evans et al., Surviving Sepsis Campaign, 2021; Huston et al., Surgical Infection Society 2024 Update, recommending source control within 6 hours in higher-risk patients with septic shock; Coccolini et al., WSES Source Control Guidelines, 2023). Resuscitation (crystalloid, vasopressors, empiric broad-spectrum antibiotics, electrolyte correction) proceeds concurrently, but it does not substitute for the operation.</p>\n<p><strong>Note on the lactate value:</strong> The listed &quot;7.4 mg/dL&quot; is almost certainly meant to be ~7.4 mmol/L given the severe acidemia (pH 7.08); either way the clinical picture is unambiguous lactic acidosis from shock.</p>\n<p><strong>Why the other answers are incorrect:</strong></p>\n<p><strong>Crystalloid resuscitation to normalize her serum lactate:</strong> Fluids are necessary adjuncts but the lactate cannot be normalized while an uncontrolled peritoneal source persists; attempting to &quot;resuscitate to a number&quot; before source control wastes the critical early window (Coccolini et al., WSES, 2023; Meyer &amp; Prescott, NEJM, 2024).</p>\n\n<p><strong>Pulmonary artery catheter placement to guide fluid resuscitation:</strong> A PAC is not indicated for early septic-shock resuscitation, adds delay and procedural risk, and does not address the surgical source.</p>\n\n<p><strong>CT abdomen:</strong> The diagnosis of a surgical abdomen with peritonitis and septic shock is already clinical; a CT delays definitive source control in an unstable patient. Imaging is reserved for cases where the source or need for operation is uncertain, which is not the case here (Evans et al., Surviving Sepsis Campaign, 2021).</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":10,"stem":"A 65 year old woman undergoes a total abdominal hysterectomy and bilateral salpingo-oophorectomy as well as omentectomy for treatment of an ovarian cancer. On post-operative day 2, she becomes acutely short of breath. Vitals are: HR 110, BP 140/90, RR 22, O2 Sat 85% (room air), Temp 37.3. What is the most appropriate next step in her management?","options":[{"letter":"A","text":"Administration of 40 mgs of Lasix IV and placement of a Foley catheter."},{"letter":"B","text":"Sputum for C&S, portable chest x-ray, and administration of broad-spectrum antibiotics."},{"letter":"C","text":"Initiation of anticoagulants with unfractionated heparin, ECG, CT chest (PE protocol)."},{"letter":"D","text":"ABG, portable chest x-ray, ECG, Doppler U/S of both legs."}],"correct":"C","explanation":"<p><strong>Why &quot;initiation of anticoagulants with unfractionated heparin, ECG, CT chest (PE protocol)&quot; is correct:</strong> This is a high pretest-probability pulmonary embolism: an active malignancy (ovarian cancer, a strongly prothrombotic state), recent major pelvic/abdominal surgery, postoperative immobility, and sudden-onset dyspnea, tachycardia, tachypnea, and hypoxemia (SpO\u2082 85%) without fever or signs pointing elsewhere. When clinical probability is high, guidelines direct proceeding straight to CT pulmonary angiography (the diagnostic imaging test of choice) without D-dimer, since D-dimer has essentially no negative predictive value in a hospitalized postoperative cancer patient (Konstantinides et al., 2019 ESC/ERS Guidelines; Falster et al., Lancet Haematology, 2023). Empiric anticoagulation should be started while awaiting confirmatory imaging in intermediate-to-high pretest probability when bleeding risk permits (Falster et al., Lancet Haematology, 2023; Konstantinides et al., ESC 2019). <strong>Unfractionated heparin is the appropriate agent here specifically because it is rapidly titratable and reversible</strong> in a patient two days out from major surgery, and an ECG is a reasonable rapid bedside adjunct (right-heart strain, and to exclude alternatives).</p>\n<p><strong>Bleeding-risk caveat:</strong> Because she is only POD 2 from major cancer surgery, the decision to give empiric heparin requires weighing surgical bleeding risk; the reversibility of unfractionated heparin is exactly why it is preferred over LMWH or a DOAC in this immediate postoperative window, and CTPA should be obtained expeditiously to confirm before committing to a full anticoagulation course.</p>\n<p><strong>Why the other answers are incorrect:</strong></p>\n<p><strong>40 mg IV Lasix and a Foley:</strong> This treats presumed volume overload/pulmonary edema, for which there is no evidence (BP is normal-to-high, no clinical CHF described); diuresis in a postoperative patient who may be intravascularly depleted could worsen perfusion and does not address the likely PE.</p>\n\n<p><strong>Sputum for C&amp;S, portable CXR, broad-spectrum antibiotics:</strong> This treats pneumonia, but she is afebrile with an abrupt, hypoxemic presentation far more consistent with PE; empiric antibiotics do not address the leading diagnosis.</p>\n\n<p><strong>ABG, portable chest x-ray, ECG, Doppler U/S of both legs:</strong> These are supportive tests but none confirms or excludes PE. A negative leg ultrasound does not rule out PE, and this pathway neither establishes the diagnosis (CTPA) nor initiates treatment; it delays definitive care in a high-probability, hypoxemic patient.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":11,"stem":"A 25 year old man is admitted to the ICU because of a severe closed head injury from a skiing accident. He has no other significant injuries. The most appropriate approach to feeding this patient is?","options":[{"letter":"A","text":"Nasogastric feeds."},{"letter":"B","text":"Nasojejunal feeds."},{"letter":"C","text":"Start TPN on day 3."},{"letter":"D","text":"Peripheral caloric support until a feeding gastrostomy can be inserted endoscopically."}],"correct":"A","explanation":"<p><strong>Why &quot;nasogastric feeds&quot; is correct:</strong> Severe TBI produces a hypermetabolic, catabolic state (measured energy expenditure ~100\u2013200% of predicted), and early enteral nutrition is associated with fewer infections and lower mortality. Guidelines recommend initiating enteral nutrition within 24\u201372 hours once hemodynamically stable and reaching full nutritional support within 7 days (American College of Surgeons Best Practices in TBI, 2024; McClave et al., SCCM/ASPEN Guidelines, JPEN, 2016). Enteral feeding preserves gut integrity, limits bacterial translocation, is more physiologic, and is less expensive and safer than parenteral nutrition. Gastric (nasogastric) access is an accepted first-line route when it can be started promptly.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>nasojejunal feeds</strong> \u2014 Not wrong physiologically, and a meta-analysis found small-bowel (postpyloric) feeding reduces pneumonia and ventilator-associated pneumonia versus gastric feeding in severe TBI (Wang et al., J Neurosurg, 2015). The ACS Best Practices state postpyloric feeding is &quot;preferred if it can be obtained rapidly without delaying initiation of EN&quot;; when obtaining postpyloric access would delay feeding, early gastric feeding is acceptable. Nuance: nasojejunal is a defensible answer where postpyloric access is rapidly available; nasogastric is the pragmatic, guideline-endorsed default.</p>\n\n<p><strong>start TPN on day 3</strong> \u2014 Parenteral nutrition is reserved for when enteral feeding is contraindicated or fails; it forgoes the immunologic and gut-integrity benefits of enteral feeding and delays nutrition.</p>\n\n<p><strong>peripheral caloric support until a feeding gastrostomy can be inserted endoscopically</strong> \u2014 Peripheral dextrose is grossly inadequate for the hypermetabolic TBI patient, and there is no reason to wait for a PEG when a nasogastric tube provides immediate enteral access.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":12,"stem":"Which of the following statements concerning chemical injuries is TRUE?","options":[{"letter":"A","text":"Immediate wound care involves application of a neutralizing agent."},{"letter":"B","text":"Acid burns cause liquefaction necrosis."},{"letter":"C","text":"Alkali burns produce deeper injuries than do acid burns."},{"letter":"D","text":"Chemical injuries frequently cause severe hyperkalemia secondary to metabolic acidosis."}],"correct":"C","explanation":"<p><strong>Why &quot;alkali burns produce deeper injuries than do acid burns&quot; is correct:</strong> Alkalis damage tissue by saponifying fats and denaturing proteins, producing liquefaction necrosis. The resulting gelatinous, non-protective tissue allows continued penetration into deeper layers, so alkali burns are typically deeper and more severe than acid burns (Hoffman et al., New England Journal of Medicine, 2020; Nguyen et al., European Journal of Pediatrics, 2021; Chirica et al., Lancet, 2017).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>immediate wound care involves application of a neutralizing agent</strong> \u2014 Neutralization is contraindicated: acid\u2013base neutralization reactions are exothermic and the released heat adds a thermal burn to the chemical injury. Immediate care is copious water irrigation to dilute and remove the agent (Hoffman et al., NEJM, 2020).</p>\n\n<p><strong>acid burns cause liquefaction necrosis</strong> \u2014 Reversed. Acids denature proteins producing coagulation necrosis; the coagulum/eschar tends to limit deeper penetration (Chirica et al., Lancet, 2017; Millar &amp; Cox, Pediatric Surgery International, 2015).</p>\n\n<p><strong>chemical injuries frequently cause severe hyperkalemia secondary to metabolic acidosis</strong> \u2014 This is not a general feature of chemical burns. The classic exception is hydrofluoric acid, where fluoride binds calcium and magnesium causing hypocalcemia/hypomagnesemia, with hyperkalemia from cell death \u2014 a specific, not &quot;frequent,&quot; phenomenon (Hoffman et al., NEJM, 2020).</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":13,"stem":"Five days after an esophagectomy for cancer, a 65 year old man develops fever as well as edema, erythema, and tenderness over the right cheek. Which of the following is TRUE?","options":[{"letter":"A","text":"It is usually due to streptococcal infection."},{"letter":"B","text":"Massage of the area is beneficial."},{"letter":"C","text":"It can be prevented with antibiotics."},{"letter":"D","text":"It is associated with decreased saliva formation."}],"correct":"D","explanation":"<p><strong>Why &quot;it is associated with decreased saliva formation&quot; is correct:</strong> This is acute suppurative (bacterial) parotitis, a disease of elderly, debilitated, dehydrated, and postoperative patients. It is precipitated by reduced salivary flow/salivary stasis (from dehydration, restricted oral intake after surgery, and medications), which permits retrograde migration of oral bacteria up Stensen&#x27;s duct into the gland (Rousseau, JAGS, 1990; Brook, Periodontology 2000, 2009; Lim et al., Clinical Otolaryngology, 2025). A post-esophagectomy patient who is NPO and dehydrated is a classic setting.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>it is usually due to streptococcal infection</strong> \u2014 The predominant pathogen is Staphylococcus aureus, which colonizes the opening of Stensen&#x27;s duct; streptococci and anaerobes are less common (Rousseau, JAGS, 1990; Kim et al., American Family Physician, 2024).</p>\n\n<p><strong>massage of the area is beneficial</strong> \u2014 Gland massage is a management maneuver used to express purulent material and stimulate flow, but the definitive treatment is hydration, antistaphylococcal antibiotics, and oral hygiene; massage is not the key true statement and is secondary. (Note: in isolation gentle massage can help drainage, but the pathophysiologic truth of the question is decreased salivary flow.)</p>\n\n<p><strong>it can be prevented with antibiotics</strong> \u2014 Prevention is by maintaining hydration and salivary flow and good oral hygiene, not by prophylactic antibiotics.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":14,"stem":"Death occurring many weeks after severe injury may be the result of any of the following, EXCEPT?","options":[{"letter":"A","text":"Adrenal failure."},{"letter":"B","text":"Neurologic injury."},{"letter":"C","text":"Sepsis-induced multi-organ system failure."},{"letter":"D","text":"Suicide."}],"correct":"A","explanation":"<p><strong>Why &quot;adrenal failure&quot; is the correct (EXCEPT) answer:</strong> Late trauma mortality (the third peak of the classic trimodal distribution) is dominated by sepsis and multi-organ system failure, plus deaths from the primary neurologic injury and, over the longer term, suicide/self-harm. Primary adrenal failure is not a recognized cause of late post-injury death. (Critical-illness\u2013related corticosteroid insufficiency is a physiologic phenomenon during acute illness, not a discrete cause of death weeks later.)</p>\n<p><strong>Why the others are incorrect (i.e., they ARE causes of late death):</strong></p>\n<p><strong>neurologic injury</strong> \u2014 Severe TBI and its complications are a major cause of late death after trauma.</p>\n\n<p><strong>sepsis-induced multi-organ system failure</strong> \u2014 The single leading cause of late trauma death.</p>\n\n<p><strong>suicide</strong> \u2014 Trauma patients carry elevated long-term risk of death from suicide.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":15,"stem":"A 60 year old man with chronic ascites due to liver disease presents with abdominal pain and fever. Which of the following statements concerning his management is TRUE?","options":[{"letter":"A","text":"Antibiotics should only be started if his ascitic fluid culture is positive."},{"letter":"B","text":"Antibiotics should be started if the leukocyte count in his ascitic fluid is greater than 300 cells/mm3."},{"letter":"C","text":"His ascitic fluid should be drained before starting antibiotic treatment."},{"letter":"D","text":"Laparotomy or laparoscopy is indicated to rule out a GI source of bacteria."}],"correct":"B","explanation":"<p><strong>Why this option is correct (relative to the choices):</strong> SBP is diagnosed and treated empirically based on the ascitic fluid cell count, before culture results return. Empiric IV antibiotics (third-generation cephalosporin for community-acquired disease) should be started as soon as the count crosses the diagnostic threshold (Biggins et al., AASLD Practice Guidance, Hepatology, 2021).</p>\n<p><strong>Precision note:</strong> The guideline threshold is an ascitic fluid polymorphonuclear (PMN/neutrophil) count <strong>&gt;250/mm\u00b3</strong>, not a total leukocyte count of 300/mm\u00b3 (Biggins et al., AASLD, 2021; Wong et al., JAMA, 2008). The exam option&#x27;s wording (&quot;leukocyte count &gt;300&quot;) is imprecise but is clearly the intended correct choice because it captures the core principle \u2014 start antibiotics empirically on the cell count without waiting for culture.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>antibiotics should only be started if his ascitic fluid culture is positive</strong> \u2014 Wrong; waiting for culture delays therapy and increases mortality. Cultures are frequently negative (culture-negative neutrocytic ascites) yet still require treatment.</p>\n\n<p><strong>his ascitic fluid should be drained before starting antibiotic treatment</strong> \u2014 SBP is not managed by drainage; therapeutic large-volume paracentesis is for tense ascites, not for infection control, and antibiotics should not be delayed.</p>\n\n<p><strong>laparotomy or laparoscopy is indicated to rule out a GI source</strong> \u2014 SBP is a spontaneous, typically monomicrobial infection with no surgical source; surgery is reserved for suspected secondary peritonitis (e.g., perforation), suggested by failure to respond and polymicrobial fluid.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":16,"stem":"Intra-operative hypothermia (patient core temperature <34\u00b0 C) is associated with all of the following, EXCEPT?","options":[{"letter":"A","text":"Decreased levels of fibrinogen."},{"letter":"B","text":"Decreased platelet activity."},{"letter":"C","text":"Increased incidence of surgical site infection."},{"letter":"D","text":"Increased blood loss during abdominal surgery."}],"correct":"A","explanation":"<p><strong>Why &quot;decreased levels of fibrinogen&quot; is the correct (EXCEPT) answer:</strong> Hypothermic coagulopathy results from impaired enzyme kinetics of the coagulation cascade and impaired platelet function \u2014 not from a reduction in the quantity of clotting factors or fibrinogen. Standard coagulation assays are run at 37\u00b0C, so they do not even reflect the temperature-dependent slowing (Sessler, Lancet, 2016). Hypothermia does not lower measured fibrinogen levels.</p>\n<p><strong>Why the others are incorrect (i.e., they ARE associated with hypothermia):</strong></p>\n<p><strong>decreased platelet activity</strong> \u2014 Hypothermia reversibly impairs platelet aggregation via reduced thromboxane release (Sessler, Lancet, 2016; Urits et al., Advances in Therapy, 2019).</p>\n\n<p><strong>increased incidence of surgical site infection</strong> \u2014 Hypothermia causes vasoconstriction, reduced tissue oxygen tension, and impaired neutrophil function, increasing SSI (Sessler, Lancet, 2016; Chen et al., BMC Anesthesiology, 2025).</p>\n\n<p><strong>increased blood loss during abdominal surgery</strong> \u2014 Even 1\u00b0C of hypothermia increases blood loss by ~16\u201320% and raises transfusion requirements (Sessler, Lancet, 2016; WSES-AAST consensus, Coccolini et al., 2024).</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":17,"stem":"A 25 year old man is brought to the Emergency room following a MVC. He is hemodynamically stable, GCS 5 with a dilated right pupil. CT scan shows a large right epidural hematoma, multiple rib fractures, a pulmonary contusion and non-opacification of a normal size right kidney. The left kidney opacifies normally. There is no free fluid in the abdomen. The patient is taken to the Operating Room for craniotomy. Following this procedure, management of his right kidney should be?","options":[{"letter":"A","text":"Repair of renal artery using saphenous vein - interposition graft."},{"letter":"B","text":"Endovascular stenting."},{"letter":"C","text":"Nephrectomy."},{"letter":"D","text":"Observation."}],"correct":"D","explanation":"<p><strong>Why &quot;observation&quot; is correct:</strong> Non-opacification of a normal-size kidney with a normally functioning contralateral kidney indicates main renal artery occlusion/thrombosis (a devascularized kidney). In a hemodynamically stable patient \u2014 particularly one whose revascularization would be delayed by an emergent craniotomy \u2014 the warm ischemia window for successful salvage is exceeded, and non-operative management is the standard. In the National Trauma Data Bank series of isolated blunt renal artery injuries, ~95% were managed with observation (Owattanapanich et al., J Trauma Acute Care Surg, 2021). The WSES-AAST guidelines explicitly state that &quot;the presence of non-viable tissue (devascularized kidney) is not an indication to operative management in the acute setting in the absence of other indications for laparotomy&quot; (Coccolini et al., WSES-AAST Kidney and Uro-Trauma Guidelines, 2019).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>repair of renal artery using saphenous vein interposition graft</strong> \u2014 Arterial repair has a low success rate (~25\u201335%) and is reserved for a solitary kidney or bilateral injuries; here the contralateral kidney is normal, and warm ischemia time has elapsed (Coccolini et al., WSES-AAST, 2019).</p>\n\n<p><strong>endovascular stenting</strong> \u2014 Percutaneous revascularization is only indicated in specialized centers with limited warm ischemia time (&lt;240 min) and remains rarely used; the delay for craniotomy makes salvage futile (Coccolini et al., WSES-AAST, 2019; Owattanapanich et al., 2021).</p>\n\n<p><strong>nephrectomy</strong> \u2014 Not indicated acutely for a devascularized kidney in a stable patient without bleeding; delayed nephrectomy is considered only if complications arise (e.g., refractory renin-mediated hypertension) (Coccolini et al., WSES-AAST, 2019).</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":18,"stem":"After application of positive end-expiration pressure (PEEP) of 8 cm H2O, which of the following parameters is likely to INCREASE?","options":[{"letter":"A","text":"PaCO2."},{"letter":"B","text":"Cardiac output."},{"letter":"C","text":"Functional residual capacity."},{"letter":"D","text":"Left ventricular end-systolic volume."}],"correct":"C","explanation":"<p><strong>Why &quot;functional residual capacity&quot; is correct:</strong> PEEP prevents end-expiratory alveolar collapse and recruits atelectatic alveoli, raising end-expiratory lung volume \u2014 i.e., it increases FRC, improving compliance and ventilation\u2013perfusion matching (Santa Cruz et al., Cochrane, 2021; Belfiore et al., Scientific Reports, 2022).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>PaCO2</strong> \u2014 At a modest PEEP of 8 cm H2O with improved V/Q matching, PaCO2 is not expected to rise; a clinically meaningful increase in PaCO2 occurs mainly at high PEEP through increased dead space/overdistension, making this a poor &quot;likely to increase&quot; answer.</p>\n\n<p><strong>cardiac output</strong> \u2014 PEEP raises intrathoracic pressure, reducing venous return (RV preload) and generally decreasing cardiac output, not increasing it (Alviar et al., JACC, 2018; Boesing et al., Critical Care, 2024).</p>\n\n<p><strong>left ventricular end-systolic volume</strong> \u2014 PEEP reduces LV preload and LV afterload; it does not increase LV end-systolic volume.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":19,"stem":"Lung injury due to smoke inhalation is caused by?","options":[{"letter":"A","text":"Thermal injury to major airways."},{"letter":"B","text":"Adult respiratory distress syndrome (ARDS) induced by the burn wound."},{"letter":"C","text":"Small airway obstruction with soot."},{"letter":"D","text":"Toxic chemicals in smoke."}],"correct":"D","explanation":"<p><strong>Why &quot;toxic chemicals in smoke&quot; is correct:</strong> Smoke inhalation lung injury is predominantly a chemical injury. Because the specific heat of air is low and the upper airway efficiently dissipates heat, most parenchymal and lower-airway damage is caused by noxious organic chemicals carried on the surface of smoke particles, which deposit in the distal airways and alveoli and trigger inflammation, mucosal edema, cast formation, and increased permeability (Enkhbaatar et al., Lancet, 2016; Walker et al., Critical Care, 2015).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>thermal injury to major airways</strong> \u2014 True thermal injury below the vocal cords is rare because heat is dissipated in the upper airway; direct thermal burns are largely confined to the supraglottic airway (Enkhbaatar et al., Lancet, 2016).</p>\n\n<p><strong>ARDS induced by the burn wound</strong> \u2014 ARDS can be a downstream consequence of severe inhalation injury or systemic burn inflammation, but it is not the primary mechanism of the lung injury itself.</p>\n\n<p><strong>small airway obstruction with soot</strong> \u2014 Soot-particle deposition and cast/obstruction contribute to the pathology, but the injurious agents are the toxic chemicals adsorbed onto those particles; obstruction is a consequence, not the primary cause. This is the strongest distractor, but &quot;toxic chemicals in smoke&quot; is the more accurate root cause.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":20,"stem":"Following injury or surgery, nutrient intake is often inadequate for many days. The CNS and white blood cells rely on energy supplied by glucose which must be synthesized de novo. Glucose is mainly synthesized from?","options":[{"letter":"A","text":"Amino acids released from skeletal muscle."},{"letter":"B","text":"Fatty acids released from adipose tissue."},{"letter":"C","text":"Liver glycogen stores."},{"letter":"D","text":"Lactate produced by the Cori cycle."}],"correct":"A","explanation":"<p><strong>Why &quot;amino acids released from skeletal muscle&quot; is correct:</strong> After the first ~24 hours of fasting/stress, hepatic gluconeogenesis becomes the main source of glucose, and its principal carbon substrate is amino acids (especially alanine and glutamine) mobilized from skeletal muscle proteolysis \u2014 the basis of the negative nitrogen balance and lean-mass loss of critical illness.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>fatty acids released from adipose tissue</strong> \u2014 Free fatty acids are a major fuel after trauma, but they cannot undergo net conversion to glucose (acetyl-CoA cannot become net glucose in humans); glycerol from triglyceride contributes only minimally.</p>\n\n<p><strong>liver glycogen stores</strong> \u2014 Hepatic glycogen is depleted within roughly 24 hours and cannot sustain days of glucose needs.</p>\n\n<p><strong>lactate produced by the Cori cycle</strong> \u2014 The Cori cycle recycles glucose-derived lactate back to glucose; it regenerates existing carbon rather than providing net new glucose, and requires energy from fatty acid/amino acid oxidation.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":21,"stem":"Post-operative nausea and vomiting (PONV) is one of the most prevalent factors leading to delay in discharge from ambulatory surgical centers or unanticipated hospitalization after out-patient procedures. Which of the following statements about PONV is TRUE?","options":[{"letter":"A","text":"PONV is associated with opioid use."},{"letter":"B","text":"PONV occurs frequently following induction of general anesthesia with propofol."},{"letter":"C","text":"PONV prophylaxis should be administered to all patients before ambulatory surgery."},{"letter":"D","text":"PONV is increased in adults who are required to ingest oral fluids before discharge."}],"correct":"A","explanation":"<p><strong>Why &quot;PONV is associated with opioid use&quot; is correct:</strong> Opioids are a well-established, independent risk factor for PONV (one of the four Apfel score criteria, along with female sex, nonsmoking status, and history of PONV/motion sickness). Opioids stimulate \u03bc-receptors in the vestibular apparatus and chemoreceptor trigger zone and slow GI motility (Irani et al., ASCRS/SAGES ERAS Guidelines, 2023; Kovac, BJA Education, 2025; Pignot et al., World J Urol, 2022).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>PONV occurs frequently following induction of general anesthesia with propofol</strong> \u2014 Propofol is antiemetic; total intravenous anesthesia with propofol reduces PONV (Kovac, BJA Education, 2025).</p>\n\n<p><strong>PONV prophylaxis should be administered to all patients before ambulatory surgery</strong> \u2014 Prophylaxis is risk-stratified and multimodal; although liberal multimodal prophylaxis is increasingly advocated, universal prophylaxis for every patient is not the established rule and is not the &quot;true&quot; statement intended here.</p>\n\n<p><strong>PONV is increased in adults who are required to ingest oral fluids before discharge</strong> \u2014 Mandatory oral intake before discharge is not required and early oral intake is generally protective, not causative, for delayed PONV (Laki\u0107evi\u0107 et al., Scientific Reports, 2026).</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":22,"stem":"A 47 year old man is investigated because of a three week history of intermittent fever and back pain. He is found to have a staph aureus psoas abscess of unknown etiology. This would be best treated with?","options":[{"letter":"A","text":"Percutaneous drainage and 2 weeks of IV cloxacillin."},{"letter":"B","text":"Percutaneous drainage and 6 weeks of IV cloxacillin."},{"letter":"C","text":"Surgical drainage and 6 weeks of IV cloxacillin."},{"letter":"D","text":"Surgical drainage and 2 weeks of IV cloxacillin followed by oral cloxacillin once a day for life."}],"correct":"B","explanation":"<p><strong>Why &quot;percutaneous drainage and 6 weeks of IV cloxacillin&quot; is correct:</strong> Source control by drainage plus a prolonged antistaphylococcal course is the standard. Percutaneous (image-guided) catheter drainage is first-line and is associated with low mortality, reserving surgery for failure or complex/multiloculated collections (Cheng et al., J Microbiol Immunol Infect, 2026). A primary/hematogenous S. aureus abscess of unknown source (implying possible bacteremia and deep-seated/metastatic infection) is complicated, high-risk disease warranting 4\u20136 weeks of therapy; cloxacillin is an appropriate antistaphylococcal penicillin for methicillin-susceptible S. aureus (Tong et al., JAMA, 2025). Real-world psoas abscess series report median antibiotic durations of ~48 days (Kayaaslan et al., BMC Infectious Diseases, 2026).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>percutaneous drainage and 2 weeks of IV cloxacillin</strong> \u2014 Two weeks is the course for uncomplicated, low-risk S. aureus bacteremia; a deep-seated abscess of unknown source is complicated and undertreated by 2 weeks (Tong et al., JAMA, 2025).</p>\n\n<p><strong>surgical drainage and 6 weeks of IV cloxacillin</strong> \u2014 The duration is right, but open surgical drainage is not first-line; percutaneous drainage is preferred when feasible, with surgery reserved for failure or unfavorable anatomy (Cheng et al., 2026).</p>\n\n<p><strong>surgical drainage and 2 weeks of IV cloxacillin followed by oral cloxacillin once a day for life</strong> \u2014 Both the modality (surgery first) and the regimen are wrong; lifelong once-daily oral cloxacillin is not a recognized regimen and would be inadequate suppression.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":23,"stem":"All the following are known complications of heparin administration, EXCEPT?","options":[{"letter":"A","text":"Skin necrosis."},{"letter":"B","text":"Cholestatic hepatic injury."},{"letter":"C","text":"Arterial thrombosis."},{"letter":"D","text":"Osteoporosis."}],"correct":"B","explanation":"<p><strong>Why &quot;cholestatic hepatic injury&quot; is the correct (EXCEPT) answer:</strong> Heparin can raise serum aminotransferases (AST/ALT), but this is a transient hepatocellular pattern that is not accompanied by a rise in bilirubin and has no known clinical consequence \u2014 it is not cholestatic injury (Garcia et al., ACCP Antithrombotic Guidelines, Chest, 2012). Cholestatic hepatic injury is not a recognized heparin complication.</p>\n<p><strong>Why the others are incorrect (i.e., they ARE heparin complications):</strong></p>\n<p><strong>skin necrosis</strong> \u2014 Cutaneous necrosis after systemic heparin is a recognized adverse reaction (FDA heparin sodium label; Garcia et al., Chest, 2012).</p>\n\n<p><strong>arterial thrombosis</strong> \u2014 Heparin-induced thrombocytopenia (HIT) is a prothrombotic, immune-mediated syndrome that causes venous and arterial thrombosis (Garcia et al., Chest, 2012).</p>\n\n<p><strong>osteoporosis</strong> \u2014 Long-term high-dose heparin causes osteoporosis via effects on osteoblasts/osteoclasts (FDA label; Garcia et al., Chest, 2012).</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":24,"stem":"A 28 year old woman is an unrestrained driver in a MVC. She has stable vital signs and left upper quadrant abdominal tenderness, but no peritoneal signs. What is the next step in her management?","options":[{"letter":"A","text":"Admission for observation."},{"letter":"B","text":"Abdominal ultrasound."},{"letter":"C","text":"Diagnostic peritoneal lavage."},{"letter":"D","text":"CT scan abdomen/pelvis."}],"correct":"B","explanation":"<p><em>Disagreement with the original key:</em> The original answer key marked &quot;abdominal ultrasound,&quot; but the evidence supports CT scan abdomen/pelvis as the definitive next step in a hemodynamically stable patient with focal abdominal tenderness.</p>\n<p><strong>Why &quot;CT scan abdomen/pelvis&quot; is the better answer:</strong> In hemodynamically stable blunt trauma patients, contrast-enhanced abdominal/pelvic CT is the reference (gold) standard, with sensitivity and specificity of ~96\u2013100% for intra-abdominal injury, and is specifically recommended for patients with abdominal tenderness or a high-risk mechanism (Nishijima et al., JAMA, 2012; Coccolini et al., WSES Liver Trauma Guidelines, 2020; Iacobellis et al., ESER/European Radiology, 2026). LUQ tenderness raises concern for splenic injury, which CT both detects and grades to guide non-operative management.</p>\n<p><strong>Why abdominal ultrasound (FAST) is not the best answer:</strong> FAST is a rapid bedside triage tool that detects free fluid, but it has inadequate sensitivity for solid-organ and hollow-viscus injury; a negative FAST does not exclude injury and should prompt further imaging in a stable patient. FAST is most decisive in the unstable patient (Spahn et al., European trauma bleeding guideline, Critical Care, 2019; Nishijima et al., JAMA, 2012). Its role in a stable patient is preliminary, not definitive.</p>\n<p><strong>Why the remaining options are incorrect:</strong></p>\n<p><strong>admission for observation</strong> \u2014 Serial exams are an adjunct, but leaving a symptomatic patient with a concerning mechanism without definitive imaging risks a missed injury.</p>\n\n<p><strong>diagnostic peritoneal lavage</str
