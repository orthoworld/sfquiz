enerally a contraindication to elective surgery.</p>\n<p><strong>Significant arrhythmias:</strong> High-grade conduction disease and symptomatic ventricular/atrial arrhythmias are active cardiac conditions.</p>\n<p><strong>Severe valvular heart disease:</strong> Symptomatic severe aortic stenosis (mean gradient &gt;40 mmHg or peak velocity &gt;4 m/s) is a recognized high-risk condition.</p>\n<p>Background</p>\n<p>The Revised Cardiac Risk Index (RCRI) formalizes six stable predictors (ischemic heart disease, cerebrovascular disease, heart failure, insulin-treated diabetes, creatinine &gt;2 mg/dL, high-risk surgery); &quot;active cardiac conditions&quot; sit above the index as conditions warranting delay/optimization (Cao et al., Nature Reviews Cardiology, 2021).</p>","no_key":false,"no_options":false,"free_answer":null,"number":63},{"stem":"Twelve hours after an open hysterectomy, a 45 year old woman develops a fever of 39.5\u00b0 C. On examination, she has foul-smelling \"dishwater\" pus draining from her wound. A gram stain reveals gram-positive rods. Which of the following statements regarding this condition is true?","options":[{"letter":"A","text":"The causative organism is an aerobe."},{"letter":"B","text":"Emergency operative debridement of the wound is indicated."},{"letter":"C","text":"High-dose flagyl (metronidazole) is the antibiotic of choice."},{"letter":"D","text":"The organism produces an endotoxin."}],"correct":"B","explanation":"<p><strong>Why &quot;emergency operative debridement is indicated&quot; is correct:</strong> Foul &quot;dishwater&quot; discharge with gram-positive rods early after surgery is clostridial wound infection/gas gangrene (myonecrosis, typically <em>Clostridium perfringens</em>). Management is a surgical emergency: <strong>urgent operative exploration and debridement of all necrotic tissue</strong> is the cornerstone of therapy and should not be delayed (Stevens et al., IDSA Skin/Soft Tissue Infection Guideline, 2014; Stevens and Bryant, New England Journal of Medicine, 2017).</p>\n<p><strong>Why the other statements are false:</strong> <strong>&quot;The organism is an aerobe&quot;:</strong> <em>Clostridium</em> species are anaerobes (spore-forming, gram-positive rods).</p>\n<p><strong>&quot;High-dose metronidazole is the antibiotic of choice&quot;:</strong> The recommended definitive regimen is <strong>penicillin plus clindamycin</strong> \u2014 penicillin for cidal activity and clindamycin to suppress toxin production; metronidazole monotherapy is not the drug of choice (Stevens and Bryant, NEJM, 2017; IDSA, 2014). Empiric therapy before diagnosis is broad-spectrum (e.g., vancomycin plus piperacillin-tazobactam or a carbapenem).</p>\n<p><strong>&quot;The organism produces an endotoxin&quot;:</strong> <em>C. perfringens</em> pathogenesis is driven by <strong>exotoxins</strong> (notably alpha-toxin/phospholipase C), not endotoxin (endotoxin/LPS is a feature of gram-negative bacteria).</p>\n<p>Background</p>\n<p>Hyperbaric oxygen is adjunctive and controversial; it must never delay resuscitation, antibiotics, or debridement (IDSA, 2014).</p>","no_key":false,"no_options":false,"free_answer":null,"number":64},{"stem":"A 50 year old man suffers from acute respiratory distress syndrome following treatment for an obstructed left ureter. He is orally intubated with ventilator settings of AC 16, TV 800 cc's, FIO2 0.7, PEEP of 15 cm H2O. The ventilator high pressure alert signals and the RT has great difficulty bagging the patient. The arterial blood pressure and O2 saturation drop precipitously. You should immediately?","options":[{"letter":"A","text":"Extubate and re-intubate the patient suspecting a mucous plug in the endotracheal tube."},{"letter":"B","text":"Obtain a stat chest x-ray."},{"letter":"C","text":"Paralyze the patient to achieve increased chest wall compliance."},{"letter":"D","text":"Insert bilateral 14 gauge angiocaths in the anterior 2nd interspace to R/O tension pneumothorax."}],"correct":"D","explanation":"<p><strong>Why immediate needle decompression is correct:</strong> The combination of high peak airway pressures, difficulty bagging, and simultaneous hemodynamic and oxygenation collapse in a patient on high PEEP (15 cm H2O) and large tidal volume (800 mL) is the classic picture of <strong>tension pneumothorax</strong> (barotrauma). Tension pneumothorax is a clinical diagnosis and a life-threatening emergency requiring <strong>immediate decompression</strong> \u2014 bilateral empiric decompression is justified when the side is unknown and the patient is peri-arrest. Emergent needle/finger decompression precedes imaging.</p>\n<p><strong>Why the other options are incorrect:</strong> <strong>Obtain a stat chest x-ray:</strong> Waiting for imaging in a peri-arrest tension physiology can be fatal; decompression must not be delayed for a film.</p>\n<p><strong>Extubate and re-intubate for a mucous plug:</strong> A plug can cause high pressures, but it would not typically cause the abrupt combined cardiovascular collapse seen here, and extubating a hypoxic ARDS patient with PEEP dependence is dangerous. (If pneumothorax is excluded, ETT patency should be checked by passing a suction catheter, not by reflex extubation.)</p>\n<p><strong>Paralyze the patient:</strong> Neuromuscular blockade may improve ventilator synchrony/chest-wall compliance in ARDS but does nothing for the underlying tension pneumothorax and wastes critical time.</p>\n<p>Background</p>\n<p>The patient&#x27;s tidal volume (800 mL) is markedly non\u2013lung-protective for ARDS, increasing barotrauma risk; lung-protective ventilation targets ~4\u20138 mL/kg predicted body weight.</p>","no_key":false,"no_options":false,"free_answer":null,"number":65},{"stem":"A 45 year old woman undergoes an abdominal hysterectomy because of uterine cancer. The following morning she is found obtunded with a temperature of 39, heart rate 130, blood pressure 100/70, respiratory rate 25. The skin around her incision is noted to be gray in colour. In addition to resuscitation, the next steps in her management include all of the following, EXCEPT?","options":[{"letter":"A","text":"Broad spectrum antibiotics."},{"letter":"B","text":"High dose intravenous immunoglobulin infusion."},{"letter":"C","text":"Exploration of the wound and peritoneal cavity in the operating room."},{"letter":"D","text":"Administration of hyperbaric oxygen."}],"correct":"B","explanation":"<p><strong>Why &quot;high-dose IVIG&quot; is correct (i.e., the EXCEPTION / not a core next:</strong> step)</p>\n<p>This is a rapidly progressive necrotizing soft-tissue infection (gray, dusky incision with septic physiology) \u2014 likely clostridial/mixed. The evidence-based next steps are source control plus antibiotics; IVIG is <em>not</em> an established therapy here. IVIG&#x27;s rationale (toxin neutralization) and its supportive data are specific to <strong>invasive group A streptococcal infection / streptococcal toxic shock syndrome</strong>, where meta-analyses of clindamycin-treated patients suggest a survival benefit (McDermott et al., JAMA Surgery, 2024; Hua et al., Lancet Infectious Diseases, 2023). For necrotizing soft-tissue infections overall, the randomized INSTINCT trial showed no benefit, and guidelines do not recommend IVIG for non-streptococcal (e.g., clostridial) infection (Madsen et al., 2020; Stevens and Bryant, NEJM, 2017).</p>\n<p><strong>Why the other options ARE appropriate next steps:</strong> <strong>Broad-spectrum antibiotics:</strong> Standard immediate therapy (e.g., vancomycin plus piperacillin-tazobactam or a carbapenem) pending cultures.</p>\n<p><strong>Operative exploration and debridement:</strong> The single most important intervention \u2014 urgent surgical source control of the wound and peritoneal cavity.</p>\n<p><strong>Hyperbaric oxygen:</strong> Listed as a reasonable <em>adjunct</em> for clostridial infection in some frameworks; although its benefit is controversial and it must never delay surgery/antibiotics, it is a recognized consideration, whereas IVIG for this (non-streptococcal) picture is not.</p>\n<p><strong>Disagreement note (minor):</strong> Both IVIG and hyperbaric oxygen have weak/controversial evidence, so the item hinges on IVIG being the <em>least</em> supported for a clostridial/mixed NSTI. That is defensible: IVIG&#x27;s benefit is confined to streptococcal disease, making it the best &quot;EXCEPT&quot; answer. HBO, while also debated, is more traditionally associated with clostridial gas gangrene.</p>","no_key":false,"no_options":false,"free_answer":null,"number":66},{"stem":"Which of the following statements concerning the resuscitation of trauma patients is TRUE?","options":[{"letter":"A","text":"Treatment should be terminated if the patient requires continuing resuscitation after receiving 50 units of packed RBCs."},{"letter":"B","text":"Hypotensive patients with blunt abdominal trauma should not be resuscitated until they are able to receive definitive care."},{"letter":"C","text":"Hypothermia affects platelet function."},{"letter":"D","text":"Hypertonic saline improves survival."}],"correct":"C","explanation":"<p><strong>Why &quot;hypothermia affects platelet function&quot; is correct: </strong>Hypothermia is one leg of the classic &quot;lethal triad&quot; (hypothermia, acidosis, coagulopathy). The European trauma bleeding guideline states explicitly that the effects of hypothermia include altered platelet function, impaired coagulation-factor function (roughly a 10% drop in function per 1\u00b0C fall in temperature), enzyme inhibition, and fibrinolysis (Rossaint et al., Critical Care, 2023; Spahn et al., Critical Care, 2019). Platelet dysfunction is measurable between 33\u201337\u00b0C, and clotting-factor and fibrinogen effects appear below 33\u00b0C (Perlman et al., Critical Care, 2016). This is why maintaining normothermia (core temperature 36\u201337\u00b0C) is a formal recommendation in trauma resuscitation.</p>\n<p><strong>Why the other choices are incorrect:</strong></p>\n<p><strong>&quot;terminate after 50 units of packed RBCs&quot;</strong> \u2014 There is no validated fixed transfusion ceiling at which resuscitation must be abandoned. Decisions to stop are individualized (physiologic futility, non-survivable injury, cardiac arrest without response), not pegged to an arbitrary unit count. Modern massive-transfusion practice emphasizes balanced-ratio resuscitation, not a numeric cutoff.</p>\n<p><strong>&quot;hypotensive blunt abdominal trauma should not be resuscitated until definitive care&quot;</strong> \u2014 False. The controlled/permissive-hypotension concept (delaying aggressive crystalloid to avoid clot disruption) is best supported in penetrating torso trauma with a short time to operative control; it does not translate to withholding all resuscitation in blunt trauma, and is contraindicated with traumatic brain injury where perfusion pressure must be maintained. Hypotensive blunt-trauma patients are resuscitated (blood products) while moving toward hemorrhage control.</p>\n<p><strong>&quot;hypertonic saline improves survival&quot;</strong> \u2014 False. Despite favorable cellular/physiologic rationale (see Question 3), prehospital randomized trials of hypertonic saline (\u00b1 dextran) in hemorrhagic shock and in traumatic brain injury did not demonstrate a survival benefit over conventional fluid.</p>","no_key":false,"no_options":false,"free_answer":null,"number":67},{"stem":"The most important prognostic factor in patients with advanced cancer is?","options":[{"letter":"A","text":"Progression of disease during chemotherapy."},{"letter":"B","text":"Metastatic spread."},{"letter":"C","text":"Karnofsky score."},{"letter":"D","text":"Clinical judgement."}],"correct":"C","explanation":"<p><strong>Why &quot;Karnofsky score&quot; is correct: </strong>Performance status \u2014 most classically the Karnofsky Performance Status (KPS) \u2014 is the single most consistently validated prognostic factor across advanced cancers. It is a global measure of functional capacity that repeatedly predicts survival, is used for trial eligibility, and serves as an adjustment factor in treatment-effect analyses (Lamont &amp; Christakis, JAMA, 2003). A KPS &lt;50% in palliative populations suggests a life expectancy under ~8 weeks, and survival falls roughly 50% with each worsening performance level (Fahy, Journal of Surgical Oncology, 2019). KPS also has the best inter-rater reliability among the common performance scales (Chow et al., Supportive Care in Cancer, 2020).</p>\n<p><strong>Nuance worth knowing for the exam:</strong> Modern head-to-head data suggest performance status alone is not perfect. Simmons et al. (The Oncologist, 2019) and Laird et al. (Clinical Cancer Research, 2013) found that combining performance status with an inflammation-based score (modified Glasgow Prognostic Score, from CRP and albumin) predicts survival better than performance status alone, and clinician-predicted survival also carries independent value. Among the four options offered, however, <strong>Karnofsky score is the best-validated objective single answer</strong>, and is the intended key.</p>\n<p><strong>Why the other choices are incorrect:</strong></p>\n<p><strong>&quot;progression of disease during chemotherapy&quot;</strong> \u2014 Progression is prognostically meaningful but is a later, treatment-dependent event; it does not outperform baseline performance status as a general prognostic anchor and is not measurable in all patients.</p>\n<p><strong>&quot;metastatic spread&quot;</strong> \u2014 In advanced/metastatic cancer, the presence of metastases is largely a given; burden and site matter, but performance status remains the stronger and more generalizable predictor.</p>\n<p><strong>&quot;clinical judgement&quot;</strong> \u2014 Clinician-predicted survival is useful and independently prognostic, but it is subjective, systematically over-optimistic, and less reproducible than a validated performance-status scale; it is not considered the single most important factor.</p>","no_key":false,"no_options":false,"free_answer":null,"number":68},{"stem":"Hypovolemic shock secondary to blood loss occurs commonly in surgical patients. Which of the following statements accurately characterizes the fluid shifts that occur during hemorrhagic shock?","options":[{"letter":"A","text":"The loss of intravascular volume is usually fully compensated by movement of extra vascular interstitial fluid into the vascular space."},{"letter":"B","text":"Intracellular fluid volume decreases as fluid shifts from the intracellular to the extra cellular fluid compartment to compensate for the intravascular loss."},{"letter":"C","text":"The extracelluar and intravascular fluid volume is best restored using packed red blood cell transfusion and fresh frozen plasma."},{"letter":"D","text":"There is a decrease in the transmembrane potential resulting in increased sodium permeability and an influx of sodium into the cell."}],"correct":"D","explanation":"<p><strong>Why this statement is correct: </strong>This is the classic Shires/Gann cellular model of shock. In both hemorrhagic and septic shock, cell membranes progressively depolarize (skeletal muscle transmembrane potential falls from roughly \u221282 mV toward \u221265 mV), driven by failure of energy-dependent (Na\u207a/K\u207a-ATPase) active transport and, at least in part, by a circulating depolarizing plasma protein. The result is movement of sodium, chloride, and water into cells, which swells cells and worsens the extracellular fluid deficit (Eastridge et al., Annals of Surgery, 1994; Illner, Cunningham &amp; Shires, American Journal of Surgery, 1982; Nakayama et al., Journal of Surgical Research, 1985). Notably, small-volume hypertonic saline can transiently repolarize the membrane back toward normal and reverse the intracellular fluid shift \u2014 the physiologic rationale behind hypertonic resuscitation (even though it did not improve clinical survival; see Question 1).</p>\n<p><strong>Why the other choices are incorrect:</strong></p>\n<p><strong>&quot;loss of intravascular volume is usually fully compensated by movement of extravascular interstitial fluid&quot;</strong> \u2014 Transcapillary refill (interstitial fluid moving into the vascular space) is a real early compensatory mechanism, but it only partially compensates and is quickly overwhelmed in significant hemorrhage. &quot;Fully compensated&quot; is false.</p>\n<p><strong>&quot;intracellular fluid volume decreases as fluid shifts out of the cell&quot;</strong> \u2014 This is the reverse of what actually happens. In shock, fluid moves INTO the cell (cellular swelling) as the membrane depolarizes; intracellular volume increases, it does not decrease.</p>\n<p><strong>&quot;extracellular and intravascular volume best restored using PRBC and FFP&quot;</strong> \u2014 Blood products restore oxygen-carrying capacity and coagulation factors and refill the intravascular space, but the expanded interstitial/extracellular fluid deficit of shock requires isotonic crystalloid; PRBC + FFP alone do not optimally restore the extracellular compartment.</p>","no_key":false,"no_options":false,"free_answer":null,"number":69},{"stem":"A 65 year old man is brought to the Emergency Room with an open fracture of the left tibia and fibula. He is taking aspirin and plavix for known coronary artery disease. The orthopedic surgeon wants to do an open reduction and internal fixation operation in the next six hours, but is concerned about post-operative bleeding causing a compartment syndrome. The best way to reverse the action of aspirin and plavix for immediate surgery is?","options":[{"letter":"A","text":"Administer von Willebrands factor."},{"letter":"B","text":"Administer 5 units of platelets."},{"letter":"C","text":"Administer activated factor 7A."},{"letter":"D","text":"Dialyze the patient for four hours."}],"correct":"B","explanation":"<p><strong>Why platelet transfusion is correct: </strong>Aspirin and clopidogrel (Plavix) both irreversibly inhibit circulating platelets \u2014 aspirin via COX-1/thromboxane, clopidogrel via the P2Y12 receptor \u2014 and there is no specific antidote for either. When high-bleeding-risk surgery cannot wait for the 5\u20137 day washout needed to regenerate a new platelet pool, transfusing donor (unaffected) platelets is the accepted strategy to restore hemostasis (Keeling et al., British Journal of Haematology, 2016; Kumbhani et al., ACC Scientific Statement, JACC, 2026). Guidance suggests 2\u20134 (up to ~2\u20133 adult doses) units of platelets, given at least ~2 hours after the last aspirin dose and \u22656\u201324 hours after the last clopidogrel dose so that circulating active drug does not simply inhibit the transfused platelets. Aspirin reversal is more complete and needs fewer units; ADP-antagonist (clopidogrel) reversal is less certain and may need higher doses. A &quot;5 units of platelets&quot; answer captures this principle.</p>\n<p><strong>Why the other choices are incorrect:</strong></p>\n<p><strong>&quot;von Willebrand factor&quot;</strong> \u2014 vWF concentrate treats von Willebrand disease; it does not overcome irreversible platelet cyclooxygenase/P2Y12 blockade. (DDAVP/desmopressin is sometimes used adjunctively, but exogenous vWF is not the answer.)</p>\n<p><strong>&quot;activated factor VIIa&quot;</strong> \u2014 rFVIIa drives thrombin generation and is used in select factor-deficiency/hemophilia-with-inhibitor and refractory bleeding scenarios; it is not a validated reversal for antiplatelet agents and carries arterial thrombotic risk, especially dangerous in a patient with coronary artery disease.</p>\n<p><strong>&quot;dialyze for four hours&quot;</strong> \u2014 Neither aspirin&#x27;s antiplatelet effect (irreversible acetylation already accomplished) nor clopidogrel&#x27;s effect is reversed by dialysis; the active drug/metabolite exposure has already permanently inhibited the existing platelets.</p>","no_key":false,"no_options":false,"free_answer":null,"number":70},{"stem":"A 60 year old man undergoes bowel resection because of infarction caused by thrombosis of his superior mesenteric artery. Post-operatively he does well but requires long term home TPN. Which type of central intravenous line is least likely to cause sepsis in this patient?","options":[{"letter":"A","text":"Polyvinylchloride triple lumen catheter in the subclavian vein."},{"letter":"B","text":"Single-lumen Hickman catheter in the subclavian vein."},{"letter":"C","text":"Double-lumen PICC line in the right cephalic vein."},{"letter":"D","text":"Single-lumen polyvinylchloride line in the right internal jugular vein."}],"correct":"B","explanation":"<p><strong>Why the single-lumen Hickman is correct: </strong>For long-term (life-long) home parenteral nutrition after short-gut from SMA thrombosis, a tunneled, cuffed catheter (Hickman) is the preferred device, and a single lumen minimizes infection risk further. The ASPEN guideline for central venous access in adult home PN concluded that, across 8 comparative studies, tunneled catheters had lower infection rates and a longer time to first infection than PICCs or ports and are preferable when HPN is expected over a long period (Kovacevich et al., ASPEN Guidelines, 2019). Fewer lumens means fewer access points and lower CLABSI risk, and the subcutaneous tunnel plus Dacron cuff creates a mechanical/antimicrobial barrier. Two of the other options are non-tunneled polyvinylchloride catheters intended for short-term inpatient use \u2014 inappropriate and higher-risk for years of home TPN.</p>\n<p><strong>Important nuance / conflicting evidence:</strong> The literature is genuinely mixed. Several comparative studies and a meta-analysis found <em>lower</em> CRBSI rates with PICCs than tunneled catheters over the observed period (Hon et al., JPEN, 2019; Chopra, JAMA, 2025), and a 2025 quality-improvement cohort found PICCs had significantly <em>higher</em> CLABSI rates than tunneled catheters (Fessler et al., Nutrition in Clinical Practice, 2025). The practical synthesis: PICCs are reasonable for expected durations \u22644 weeks, while for durations &gt;30 days a tunneled catheter is favored \u2014 which fits this patient&#x27;s indefinite need. Among the four options, the single-lumen tunneled Hickman is the best answer.</p>\n<p><strong>Why the other choices are incorrect:</strong></p>\n<p><strong>&quot;polyvinylchloride triple-lumen catheter, subclavian&quot;</strong> \u2014 Non-tunneled, short-term ICU-type catheter; triple lumen maximizes infection risk. Wrong device for years of home TPN.</p>\n<p><strong>&quot;double-lumen PICC, right cephalic&quot;</strong> \u2014 Usable for shorter courses, but two lumens and long-term PICC use raise both infection (over time) and thrombosis risk; not the lowest-sepsis option for indefinite HPN.</p>\n<p><strong>&quot;single-lumen polyvinylchloride line, right internal jugular&quot;</strong> \u2014 Non-tunneled short-term catheter; IJ site is also poorly suited to durable home care and has higher infection/dressing challenges. Wrong for long-term use.</p>","no_key":false,"no_options":false,"free_answer":null,"number":71},{"stem":"A 37 year old man has a tracheostomy for two months following treatment for a severe closed head injury. He is on the Neurosurgery Ward receiving FIO2 0.28 via trach mask. You are called to see him because of acute respiratory distress with central cyanosis. You should immediately?","options":[{"letter":"A","text":"Change the inspired oxygen to 100%."},{"letter":"B","text":"Remove the inner tube of the tracheostomy."},{"letter":"C","text":"Intubate the patient orally."},{"letter":"D","text":"Obtain a STAT portable chest x-ray."}],"correct":"B","explanation":"<p><strong>Why removing the inner cannula is correct: </strong>In an established tracheostomy patient with sudden respiratory distress, the leading and most rapidly reversible cause is obstruction of the tube by inspissated secretions/mucus plugging. Standard tracheostomy emergency algorithms direct the responder to immediately remove the inner cannula (which can be cleaned/replaced), then suction and assess patency \u2014 a simple maneuver that relieves a blocked lumen within seconds (Mu et al., Journal of Clinical Nursing, 2024, summarizing ICS/consensus guidance: &quot;when the inner cannula is blocked, remove the inner cannula, administer oxygen, clean and reinsert&quot;). Mucus plugging is a well-recognized, preventable, rapidly fatal complication (Masood et al., JAMA Otolaryngology\u2013Head &amp; Neck Surgery, 2018). Removing the inner tube is the fastest life-saving step and should be first.</p>\n<p><strong>Why the other choices are incorrect:</strong></p>\n<p><strong>&quot;change inspired oxygen to 100%&quot;</strong> \u2014 Increasing FiO2 is appropriate supportive care but does nothing if the tube lumen is obstructed; oxygen cannot reach the lungs through a plugged cannula. It does not address the cause.</p>\n<p><strong>&quot;intubate the patient orally&quot;</strong> \u2014 This is an escalation reserved for when tracheostomy-directed maneuvers (remove inner cannula, suction, attempt to pass a suction catheter/replace the tube) fail. Premature and more invasive than the immediate first step; note a cuffed tracheostomy also complicates oral ventilation.</p>\n<p><strong>&quot;obtain a STAT portable chest x-ray&quot;</strong> \u2014 Imaging takes time and delays treatment of an airway emergency; the airway must be secured/cleared before diagnostics.</p>","no_key":false,"no_options":false,"free_answer":null,"number":72},{"stem":"An anesthetized patient is erroneously transfused with a unit of ABO incompatible blood. This may cause all of the following, EXCEPT?","options":[{"letter":"A","text":"Unexplained hypotension."},{"letter":"B","text":"Ventricular arrhythmias."},{"letter":"C","text":"Diffuse bleeding."},{"letter":"D","text":"Hemoglobinuria."}],"correct":"B","explanation":"<p><strong>Why &quot;ventricular arrhythmias&quot; is the correct EXCEPT answer: </strong>An acute hemolytic transfusion reaction from ABO incompatibility triggers complement-mediated intravascular hemolysis and a systemic inflammatory/cytokine response. In an anesthetized patient (who cannot report fever, flank pain, or chest pain), the classic detectable triad is unexplained hypotension, hemoglobinuria, and diffuse bleeding (DIC). Ventricular arrhythmias are not a characteristic feature of the hemolytic reaction itself. (Arrhythmias in transfusion are more typically linked to hyperkalemia from large-volume/rapid transfusion or citrate-related hypocalcemia \u2014 distinct mechanisms from ABO incompatibility.)</p>\n<p><strong>Why the other choices DO occur (and are therefore not the answer):</strong></p>\n<p><strong>unexplained hypotension</strong> \u2014 Complement activation and vasoactive mediator/cytokine release cause shock; in an anesthetized patient this may be the first and only visible sign.</p>\n<p><strong>diffuse bleeding</strong> \u2014 Disseminated intravascular coagulation is a hallmark; oozing from the surgical field/IV sites may be the presenting sign under anesthesia.</p>\n<p><strong>hemoglobinuria</strong> \u2014 Free hemoglobin from intravascular hemolysis is filtered and produces red/brown urine, a classic marker (and a driver of acute kidney injury).</p>","no_key":false,"no_options":false,"free_answer":null,"number":73},{"stem":"A 31 year old woman with poorly controlled hyperthyroidism has a prolonged and difficult delivery of her first child. Immediately following delivery, her heart rate is 148 per minute, temperature is 39.4\u00b0C and O2 SAT 94%. She is agitated and restless. Which of the following statements about the initial treatment of her condition is NOT true?","options":[{"letter":"A","text":"The patient should be hydrated with balanced salt solution containing glucose."},{"letter":"B","text":"Intravenous propranolol should be given."},{"letter":"C","text":"Salicylates should be used to cool the patient."},{"letter":"D","text":"Intravenous hydrocortisone should be given."}],"correct":"C","explanation":"<p><strong>Why &quot;salicylates should be used to cool the patient&quot; is the NOT-true (correct) answer: </strong>This is peripartum thyroid storm (Burch-Wartofsky physiology: fever, tachycardia, agitation, precipitated by labor). Salicylates (aspirin) are contraindicated because they displace T4 and T3 from thyroid-binding proteins, raising free hormone levels and worsening thyrotoxicosis (Kopp et al., Journal of Clinical Endocrinology &amp; Metabolism, 2026; De Leo et al., Lancet, 2016; Cooper &amp; Laurberg, Lancet Diabetes &amp; Endocrinology, 2013). Fever in thyroid storm is treated with acetaminophen (paracetamol) and external cooling, not salicylates.</p>\n<p><strong>Why the other statements ARE true (and thus not the answer):</strong></p>\n<p><strong>hydration with balanced salt solution containing glucose</strong> \u2014 True. Storm patients are volume-depleted (diaphoresis, vomiting, insensible losses) with high metabolic demand and depleted glycogen; fluids with dextrose are appropriate supportive care.</p>\n<p><strong>IV propranolol</strong> \u2014 True. Beta-blockade controls the peripheral adrenergic effects (rate control) and, at higher doses, modestly reduces T4\u2192T3 conversion; propranolol is first-line for the sympathetic manifestations.</p>\n<p><strong>IV hydrocortisone</strong> \u2014 True. Glucocorticoids reduce peripheral T4\u2192T3 conversion and treat possible relative adrenal insufficiency of severe thyrotoxicosis (e.g., hydrocortisone 100 mg q8h after a loading dose).</p>","no_key":false,"no_options":false,"free_answer":null,"number":74},{"stem":"Most bacterial abscesses require treatment with drainage and antibiotics however, all of the following abscesses can be treated with antibiotics alone, EXCEPT?","options":[{"letter":"A","text":"Lung abscess."},{"letter":"B","text":"Amebic liver abscess."},{"letter":"C","text":"Tubo-ovarian abscess."},{"letter":"D","text":"Empyema of the gallbladder."}],"correct":"D","explanation":"<p><strong>Why &quot;empyema of the gallbladder&quot; is the correct answer: </strong>Empyema of the gallbladder is a suppurative, obstructed, pus-filled gallbladder \u2014 effectively an abscess within an obstructed viscus. It cannot be cured by antibiotics alone; it requires source control by cholecystectomy (or cholecystostomy drainage in the unfit patient) in addition to antibiotics. It is the one lesion here that mandates a drainage/surgical procedure.</p>\n<p><strong>Why the other choices CAN often be managed with antibiotics alone:</strong></p>\n<p><strong>lung abscess</strong> \u2014 The large majority resolve with prolonged antibiotics plus postural drainage/physiotherapy; because they typically drain spontaneously via the bronchial tree, invasive drainage is reserved for failures.</p>\n<p><strong>amebic liver abscess</strong> \u2014 Classic teaching: responds to antiamebic therapy (metronidazole/tinidazole followed by a luminal agent) without drainage in the majority; aspiration is reserved for large, left-lobe, or non-responding/impending-rupture lesions.</p>\n<p><strong>tubo-ovarian abscess</strong> \u2014 Smaller TOAs (commonly cited threshold &lt;7 cm) frequently respond to broad-spectrum IV antibiotics alone, with drainage/surgery reserved for large abscesses, rupture, or failure to improve.</p>","no_key":false,"no_options":false,"free_answer":null,"number":75},{"stem":"A 70 year old man undergoes laparotomy for perforated sigmoid diverticulitis four days following elective right total hip replacement. He has known significant coronary artery disease. 12 hours post-operatively in the ICU his vitals are: Heart rate 100, blood pressure 140/80, respiratory rate 15 (ventilated), O2 saturation 96. Laboratory values are hemoglobin 72, albumin 19 g/L, creatinine 140. His urine output is 20 ml/hr. What would be the optimal fluid management at this time?","options":[{"letter":"A","text":"1,000 ccs normal saline bolus."},{"letter":"B","text":"100 ccs 25% albumin bolus."},{"letter":"C","text":"2 units packed red blood cells over 2 hours each."},{"letter":"D","text":"Lasix 20 mgs IV x1 dose."}],"correct":"C","explanation":"<p><strong>Why PRBC transfusion is the best answer: </strong>This patient has hemoglobin 72 g/L (7.2 g/dL) with significant coronary artery disease, oliguria (20 mL/hr), and a normal-to-high blood pressure \u2014 he is anemic and under-perfused rather than simply hypovolemic from an empty tank. In a patient with active cardiac disease and evidence of inadequate oxygen delivery, correcting profound anemia with PRBCs both raises oxygen-carrying capacity and expands intravascular volume, addressing the low urine output. This aligns with a higher (\u22488 g/dL) transfusion threshold in symptomatic cardiovascular disease. Giving each unit over ~2 hours limits circulatory overload in a patient with CAD.</p>\n<p><strong>Why the other choices are inferior:</strong></p>\n<p><strong>1,000 cc normal saline bolus</strong> \u2014 A large crystalloid bolus in a hypoalbuminemic (albumin 19), critically ill patient with CAD leaks quickly into the interstitium, risks pulmonary edema, and does nothing for the severe anemia; it is the wrong primary therapy here.</p>\n<p><strong>100 cc 25% albumin bolus</strong> \u2014 Colloid may transiently pull fluid intravascularly, but it neither corrects the anemia nor reliably improves outcomes, and evidence does not support hyperoncotic albumin as first-line resuscitation in this setting.</p>\n<p><strong>Lasix 20 mg IV</strong> \u2014 Diuresing an oliguric, under-resuscitated, anemic patient is counterproductive and would worsen perfusion and renal function; low urine output here reflects inadequate oxygen delivery/effective volume, not fluid overload.</p>","no_key":false,"no_options":false,"free_answer":null,"number":76},{"stem":"In morbidly obese patients (BMI >40), obstructive sleep apnea often results in all but which of the following conditions?","options":[{"letter":"A","text":"Hypoxemia."},{"letter":"B","text":"Hypercapnia."},{"letter":"C","text":"Right heart failure."},{"letter":"D","text":"Left heart failure."}],"correct":"D","explanation":"<p><strong>Why &quot;left heart failure&quot; is the correct EXCEPT answer: </strong>The classic, direct pathophysiologic cascade of OSA is: repetitive upper-airway obstruction \u2192 intermittent hypoxemia and (especially with obesity hypoventilation) hypercapnia \u2192 hypoxic pulmonary vasoconstriction and pulmonary hypertension \u2192 increased right ventricular afterload \u2192 right heart failure/cor pulmonale (Yeghiazarians et al., AHA Scientific Statement, 2021; Ibn Hadj Amor et al., Sleep &amp; Breathing, 2022). Left heart failure is not the characteristic direct consequence of OSA in this framing, making it the &quot;all but&quot; answer.</p>\n<p><strong>Caveat for the exam:</strong> This is the intended answer, but note the relationship is not absolute. Contemporary cardiology reviews describe genuine mechanisms by which OSA also adversely affects the left ventricle \u2014 large negative intrathoracic pressure swings raise LV transmural pressure/afterload, and OSA is strongly associated with both systolic and diastolic LV dysfunction (Javaheri et al., JACC State-of-the-Art Review, 2024). The classic teaching (and the intended key) is that OSA&#x27;s hallmark cardiac consequence is right-sided failure via pulmonary hypertension, so left heart failure is selected as the exception.</p>\n<p><strong>Why the other choices DO occur:</strong></p>\n<p><strong>hypoxemia</strong> \u2014 The defining physiologic disturbance of obstructive apneas (repetitive desaturation).</p>\n<p><strong>hypercapnia</strong> \u2014 Occurs with obstructive events and is prominent in the obesity-hypoventilation phenotype common at BMI &gt;40.</p>\n<p><strong>right heart failure</strong> \u2014 The downstream result of chronic hypoxic pulmonary vasoconstriction and pulmonary hypertension (cor pulmonale).</p>","no_key":false,"no_options":false,"free_answer":null,"number":77},{"stem":"Which of the following is least likely to occur in conjunction with a surgically induced stress response?","options":[{"letter":"A","text":"Increased metabolic rate."},{"letter":"B","text":"Hypercoagulability."},{"letter":"C","text":"Immune response suppression."},{"letter":"D","text":"Increased secretion of thyroid stimulating hormone (TSH)."}],"correct":"D","explanation":"<p><strong>Why &quot;increased TSH secretion&quot; is the correct answer: </strong>The surgical stress response is a neuroendocrine/catabolic reaction dominated by activation of the hypothalamic-pituitary-adrenal axis and sympathetic nervous system (cortisol, catecholamines, glucagon, growth hormone, ADH, aldosterone). The thyroid axis instead typically shows a &quot;euthyroid sick&quot;/nonthyroidal illness pattern \u2014 reduced T3 (impaired peripheral T4\u2192T3 conversion), with TSH usually normal or suppressed rather than increased. A rise in TSH is therefore the least likely finding.</p>\n<p><strong>Why the other choices ARE expected features of the stress response:</strong></p>\n<p><strong>increased metabolic rate</strong> \u2014 Catecholamine and cortisol surge drives a hypermetabolic, catabolic state (increased oxygen consumption, gluconeogenesis, protein breakdown, lipolysis).</p>\n<p><strong>hypercoagulability</strong> \u2014 Surgery shifts hemostasis toward a prothrombotic state (increased procoagulant factors, platelet activation, reduced fibrinolysis), contributing to postoperative VTE risk.</p>\n<p><strong>immune response suppression</strong> \u2014 Cortisol and stress mediators produce relative immunosuppression (lymphopenia, impaired cell-mediated immunity), part of why surgical stress increases infection susceptibility.</p>","no_key":false,"no_options":false,"free_answer":null,"number":78},{"stem":"With regard to the pathophysiology of multiple organ failure in ICU patients, which of the following statements is FALSE?","options":[{"letter":"A","text":"Sepsis is a major risk factor."},{"letter":"B","text":"Injury to the microvascular endothelium is uniformly present."},{"letter":"C","text":"Neutrophil-mediated injuries depend on adherence to the microvascular endothelium."},{"letter":"D","text":"The high concentration of xanthene oxidase in ischemic endothelial cells prevents the generation of toxic oxygen radicals."}],"correct":"D","explanation":"<p><strong>Why &quot;the high concentration of xanthine oxidase \u2026 prevents:</strong> the generation of toxic oxygen radicals&quot; is correct (i.e., it is the FALSE statement)</p>\n<p>This statement is the one that is false, which is what the question asks for. Xanthine oxidase does the opposite of &quot;prevent&quot; \u2014 it is a major source of reactive oxygen species (ROS) in ischemic/reperfused tissue. During ischemia, ATP is degraded to hypoxanthine and xanthine dehydrogenase is converted to xanthine oxidase; when oxygen is reintroduced at reperfusion, xanthine oxidase uses O\u2082 as the electron acceptor to convert hypoxanthine/xanthine to uric acid, releasing superoxide (O\u2082\u207b) and hydrogen peroxide (Di Meo and Venditti, Oxidative Medicine and Cellular Longevity, 2020; Xiang et al., Oxidative Medicine and Cellular Longevity, 2020; Gunata and Parlakpinar, Cell Biochemistry and Function, 2021). The ROS generated then damage adhesion molecules such as P-selectin and ICAM-1 and propagate microvascular injury (Gunata and Parlakpinar, 2021). Because the enzyme generates rather than prevents toxic oxygen radicals, the statement is false and is the correct choice.</p>\n<p><strong>Why the other statements are incorrect (i.e., they are TRUE):</strong> &quot;sepsis is a major risk factor&quot; \u2014 True. Sepsis is the archetypal driver of multiple organ dysfunction; dysregulated host response, endotheliopathy, immunothrombosis, and microvascular dysfunction converge to produce organ failure (Iba et al., Inflammation Research, 2026; Angus and van der Poll, New England Journal of Medicine, 2013).</p>\n<p>&quot;injury to the microvascular endothelium is uniformly present&quot; \u2014 True. Endothelial dysfunction (glycocalyx degradation, loss of barrier function, procoagulant shift) is a near-universal, central feature of the pathway to organ failure in critical illness (Joffre and Hellman, Antioxidants &amp; Redox Signaling, 2021; Dolmatova et al., Cardiovascular Research, 2021).</p>\n<p>&quot;neutrophil-mediated injuries depend on adherence to the microvascular endothelium&quot; \u2014 True. Neutrophil sequestration through adhesion-molecule\u2013mediated binding to endothelium is a key initiating step; adherent neutrophils release lytic factors and cytokines that injure endothelium,</p>\n<p>increase permeability, and cause microvascular occlusion (Brown et al., Lancet, 2006).</p>","no_key":false,"no_options":false,"free_answer":null,"number":79},{"stem":"A 58 year old single unemployed woman on social assistance, is admitted to hospital with an upper GI blood. She has a long history of alcohol abuse. Investigation reveals a malignant appearing gastric ulcer as the source of her ongoing bleeding. Her physician believes she would die in the next few days without surgery, but the patient refuses surgical intervention. You, the surgeon, should?","options":[{"letter":"A","text":"Declare her incompetent, and then operate on her."},{"letter":"B","text":"Ask the hospital chaplain to see her."},{"letter":"C","text":"Consult psychiatry."},{"letter":"D","text":"Transfer her to a palliative care unit."}],"correct":"C","explanation":"<p><strong>Why &quot;consult psychiatry&quot; is correct:</strong> A competent adult has the right to refuse even life-saving surgery, so the pivotal issue is whether this patient currently has decision-making capacity. Capacity assessment turns on four functional abilities (communicate a choice, understand, reason, and appreciate the consequences), and any concern for confounders \u2014 depression, active alcohol use/withdrawal, encephalopathy, or delirium \u2014 warrants formal evaluation before her refusal can be honored or overridden (Kodadek et al., AAST Clinical Consensus Document, 2024). When there is uncertainty about capacity, it is reasonable to request evaluation by a clinician who routinely performs capacity assessments (Kodadek et al., 2024). A psychiatric consult both clarifies capacity and treats any reversible condition impairing it; it is the appropriate next step.</p>\n<p><strong>Why the other choices are incorrect:</strong> &quot;declare her incompetent, and then operate on her&quot; \u2014 Incorrect and unsafe. &quot;Incompetence&quot; is a legal determination, not something a surgeon unilaterally declares, and capacity has not yet been assessed. Proceeding to operate over the objection of a patient whose capacity is</p>\n<p>intact would be battery; treatment over objection is permissible only after capacity is shown to be absent and a structured ethical/surrogate process is followed (Fischkoff et al., Journal of the American College of Surgeons, 2021; Kodadek et al., 2024).</p>\n<p>&quot;ask the hospital chaplain to see her&quot; \u2014 Incorrect as the decisive next step. Spiritual support may be valuable but does not resolve the capacity question or alter the acute decision about consent.</p>\n<p>&quot;transfer her to a palliative care unit&quot; \u2014 Incorrect and premature. Transitioning to comfort-focused care before establishing whether the refusal is a capacitated decision abandons a potentially reversible, life-threatening but treatable problem and forecloses curative options.</p>","no_key":false,"no_options":false,"free_answer":null,"number":80},{"stem":"Seizure and coma develop in a patient four days after removal of a brain tumor. Vital signs are: heart rate 112, blood pressure 110/70, respiratory rate 14, temperature 37.5\u00b0C, urine output 3-4 ml/kg/h. Laboratory tests demonstrate: Na 112, K 4.1, Cl 80, HCO3 26, creatinine 110, urinalysis normal, urine NA 170. Which of the following is the most likely diagnosis:","options":[{"letter":"A","text":"Diabetes insipidus."},{"letter":"B","text":"Syndrome of inappropriate antidiuretic hormone (SIADH)."},{"letter":"C","text":"Cerebral salt wasting."},{"letter":"D","text":"High-output renal failure."}],"correct":"C","explanation":"<p><em>Note:</em> No answer was marked on the original slide for this question; the answer above reflects the reviewer's own best assessment.</p>\n<p><strong>Why &quot;cerebral salt wasting&quot; is correct:</strong> The combination points to cerebral(-renal) salt wasting (CSW): profound hyponatremia (Na 112) with symptomatic neurologic deterioration, a high urine output (3\u20134 mL/kg/h), high urine sodium (170), and clinical signs of extracellular-fluid depletion \u2014 tachycardia (HR 112) with a relatively low-normal blood pressure. CSW after an intracranial insult is characterized by renal salt wasting producing volume</p>\n<p>depletion, high urinary sodium losses, and hyponatremia (Castle-Kirszbaum et al., Neurosurgical Review, 2021). The single most useful discriminator from SIADH is volume status: CSW is hypovolemic with normal-to-elevated urine output, whereas SIADH is euvolemic and typically has low urine output (Cui et al., Frontiers in Neuroscience, 2019; Solano et al., AAP case, 2016; Driano et al., AAP, 2021). The high urine output and hypovolemic signs here favor CSW over SIADH.</p>\n<p>Note: urinary sodium concentration alone does not reliably separate CSW from SIADH (both are elevated), so the discriminating features in this vignette are the elevated urine output and the volume-depletion signs, not the urine Na value itself (Castle-Kirszbaum et al., 2021). Treatment differs importantly \u2014 CSW requires volume and salt repletion, whereas SIADH is managed with fluid restriction \u2014 making the distinction clinically critical.</p>\n<p><strong>Why the other choices are incorrect:</strong> &quot;diabetes insipidus&quot; \u2014 Incorrect. DI also causes high urine output, but it produces hypernatremia with dilute urine and</p>\n<p>low urine sodium, the opposite of this patient&#x27;s Na 112 with urine Na 170.</p>\n<p>&quot;syndrome of inappropriate antidiuretic hormone (SIADH)&quot; \u2014 Incorrect here. SIADH would produce euvolemic hyponatremia with concentrated urine but characteristically low/normal urine output and no signs of volume depletion; the high urine output (3\u20134 mL/kg/h) and tachycardia argue against it (Cui et al., 2019; Driano et al., 2021).</p>\n<p>&quot;high-output renal failure&quot; \u2014 Incorrect. Intrinsic renal failure is not supported: the urinalysis is normal and the creatinine (110) is essentially normal, arguing against significant renal parenchymal failure as the cause of the hyponatremia and seizures.</p>","no_key":false,"no_options":false,"free_answer":null,"number":81},{"stem":"A 75 year old man is in the Intensive Care Unit on a ventilator seven days after undergoing a repair of a ruptured abdominal aortic aneurysm. For the last few days, his urine output has decreased to 10-20 cc's per hour. Creatinine has increased from 100 two days ago to 150 at present. He has remained hypertensive (180/90) with a CVP >15 throughout. With regards to his renal function, the next step in his management should be?","options":[{"letter":"A","text":"Examine the urine sediment and check urine sodium."},{"letter":"B","text":"Obtain renal ultrasound."},{"letter":"C","text":"Consult nephrology."},{"letter":"D","text":"Change the foley catheter."}],"correct":"D","explanation":"<p><strong>Why &quot;change the foley catheter&quot; is correct:</strong> In acute oliguria, the fastest, cheapest, and highest-yield first maneuver is to exclude a mechanical/post-renal cause \u2014 most commonly a blocked or malpositioned Foley catheter \u2014 before pursuing laboratory or imaging workup. This is especially compelling here because the hemodynamics argue against a prerenal, hypovolemic cause: the patient is hypertensive (180/90) with a CVP &gt;15, indicating he is well- filled rather than volume-depleted. Confirming that the</p>\n<p>catheter is patent (flush and/or change it) immediately rules out the simplest reversible explanation for abrupt oliguria and is the appropriate first step before more elaborate evaluation.</p>\n<p><strong>Why the other choices are incorrect (as the next step):</strong> &quot;examine the urine sediment and check urine sodium&quot; \u2014 A reasonable subsequent step to characterize intrinsic AKI (e.g., ATN, which is common after ruptured-AAA ischemia/reperfusion), but it should follow exclusion of a blocked catheter; the prerenal-vs-intrinsic distinction is also less informative when the CVP is already &gt;15.</p>\n<p>&quot;obtain renal ultrasound&quot; \u2014 Useful to evaluate for obstruction above the bladder, but it is slower and costlier than simply verifying catheter patency; ultrasound is warranted if oliguria persists after the catheter is confirmed patent.</p>\n<p>&quot;consult nephrology&quot; \u2014 Premature. Nephrology input is appropriate for established or refractory intrinsic renal failure or if renal replacement is being considered, not before the bedside exclusion of an obstructed catheter.</p>","no_key":false,"no_options":false,"free_answer":null,"number":82},{"stem":"Patients being treated for malignancy are frequently malnourished. Enteral or parental nutritional support in these patients' versus no supplementation has been shown in clinical trials to?","options":[{"letter":"A","text":"Increase length of survival by 15%."},{"letter":"B","text":"Decrease tumour recurrence rate by 10% following surgical excision."},{"letter":"C","text":"Allow significantly more successful completions of aggressive chemotherapy regimes in patients with GI malignancies."},{"letter":"D","text":"Has not shown any convincing evidence of improvement in overall survival."}],"correct":"D","explanation":"<p><strong>Why &quot;has not shown any convincing evidence of improvement:</strong> in overall survival&quot; is correct</p>\n<p>Randomized and pooled evidence has not demonstrated a convincing overall-survival benefit from routine enteral or parenteral nutritional support in cancer patients. A 1990 meta-analysis found total parenteral nutrition (TPN) in patients receiving chemotherapy was associated with reduced survival and increased infectious complications, and the authors concluded routine TPN should be strongly discouraged; a 2019 systematic review focused on advanced cancer graded the evidence &quot;weak,&quot; and its randomized trials showed no significant improvement in overall survival (Roeland et al., ASCO Cancer Cachexia Guideline, 2020). A 2020 RCT of parenteral nutrition versus oral feeding in malnourished advanced-cancer patients likewise showed no survival or quality-of-life benefit and more adverse effects (as summarized in Alderman et al., MASCC guidance, Supportive Care in Cancer, 2022). Cumulative meta-analysis of enteral versus parenteral nutrition similarly finds neither route</p>\n<p>superior for mortality (Chow et al., Supportive Care in Cancer, 2020).</p>\n<p><strong>Why the other choices are incorrect:</strong> &quot;increase length of survival by 15%&quot; \u2014 Incorrect; no reliable trial evidence shows a defined survival increase of this magnitude, and some data (chemotherapy-era TPN) show worse survival (Roeland et al., 2020).</p>\n<p>&quot;decrease tumour recurrence rate by 10% following surgical excision&quot; \u2014 Incorrect; there is no convincing trial evidence that nutritional support reduces tumor recurrence after resection.</p>\n<p>&quot;allow significantly more successful completions of aggressive chemotherapy regimes in patients with GI malignancies&quot; \u2014 Incorrect; nutritional support has not been shown in trials to significantly improve chemotherapy completion rates, and routine TPN during chemotherapy has been associated with harm (Roeland et al., 2020).</p>\n<p>Clinical caveat: This does not mean nutrition is never indicated. Clinically assisted nutrition remains appropriate for</p>\n<p>selected patients who cannot ingest adequate nutrients, and enteral is generally preferred over parenteral when the GI tract is functional (Alderman et al., 2022; Chow et al., 2020) \u2014 but the survival claim is the point being tested, and it is not supported.</p>","no_key":false,"no_options":false,"free_answer":null,"number":83},{"stem":"A 23 year old woman has a severe closed head injury following a motor vehicle crash. She has no intracranial mass lesion. Her GCS is 4T. Transcranial Doppler estimation of her ICP is 26 mmHg. Her PaCO2 is 35 mmHg, CVP 3 cm H2O, and CPP pressure 60 mmHg. She should be treated with?","options":[{"letter":"A","text":"Hypertonic saline."},{"letter":"B","text":"Mannitol."},{"letter":"C","text":"Hyperventilation."},{"letter":"D","text":"Norepinephrine."}],"correct":"A","explanation":"<p><strong>Why hypertonic saline is correct: This patient has intracranial:</strong> hypertension (ICP 26 mmHg; normal &lt;20\u201322) with a low CVP of 3 cm H2O, indicating she is intravascularly volume- depleted. Hypertonic saline is uniquely suited here because it lowers ICP by osmotically drawing water out of brain tissue while simultaneously expanding intravascular volume \u2014</p>\n<p>correcting both problems at once. Systematic reviews find hypertonic saline is at least equivalent, and probably superior, to mannitol for reducing ICP after traumatic brain injury, with a longer duration of effect, shorter ICU stay, and a trend toward better ICP control and higher cerebral perfusion pressure (Karamian et al., Neurological Research, 2024; Schwimmbeck et al., Journal of Neurosurgical Anesthesiology, 2021; Chen et al., Cochrane Database of Systematic Reviews, 2020).</p>\n<p><strong>Why the other choices are incorrect:</strong> Mannitol: It is an osmotic diuretic and would aggravate this patient&#x27;s already low CVP (3 cm H2O) by inducing further diuresis and hypovolemia, risking hypotension and a fall in cerebral perfusion pressure. It is relatively contraindicated in a hypovolemic patient (Chen et al., Cochrane Database of Systematic Reviews, 2020).</p>\n<p>Hyperventilation: Her PaCO2 is already 35 mmHg (low- normal). Prophylactic or aggressive hyperventilation causes cerebral vasoconstriction that reduces cerebral blood flow</p>\n<p>and can precipitate ischemia; it is reserved as a temporizing measure for impending herniation, not first-line ICP control.</p>\n<p>Norepinephrine: Cerebral perfusion pressure is already 60 mmHg, at the accepted target (guidelines target roughly 60\u2013 70 mmHg). A vasopressor is not the next step when CPP is already adequate, and it does nothing to treat the elevated ICP.</p>\n<p>Background reading: Hyperosmolar therapy is the pharmacologic cornerstone of raised-ICP management; in the hypotensive or hypovolemic head-injured patient, hypertonic saline is generally preferred over mannitol.</p>","no_key":false,"no_options":false,"free_answer":null,"number":84},{"stem":"A 17 year old man is brought to the emergency room following a motor vehicle crash. The paramedics report that he lost his vital signs 15 minutes prior to arrival to the emergency room and that CPR was initiated. On arrival, he is being bag mask ventilated with bilateral air entry. His pupils are not reactive and he is apneic with no palpable pulses. His","options":[{"letter":"A","text":"ECG shows a wide complex QRS at a rate of 36. The most appropriate management would be?"},{"letter":"B","text":"Intubate, resuscitative left thoracotomy."},{"letter":"C","text":"Intubate, IV access and massive transfusion."},{"letter":"D","text":"Intubate, IV access, massive transfusion and pericardiocentesis."}],"correct":"B","explanation":"<p><strong>Why termination is correct: This is a blunt traumatic cardiac:</strong> arrest with no signs of life and prolonged prehospital CPR (15 minutes) presenting with an agonal wide-complex bradycardic rhythm and fixed pupils. The Eastern Association for the Surgery of Trauma explicitly recommends against emergency department thoracotomy in patients presenting pulseless and without signs of life after blunt injury: in their systematic review, only 1 of 825 such patients survived neurologically intact (Seamon et al., EAST Practice Management Guideline, 2015). A decade of subsequent national data confirms futility</p>\n<p>\u2014 survival for blunt trauma without signs of life was 1.7% (3 of 173) and did not improve despite continued use of the procedure (Panossian et al., Journal of Surgical Research, 2026).</p>\n<p><strong>Why the other choices are incorrect:</strong> Intubate, resuscitative left thoracotomy: Resuscitative thoracotomy salvages primarily penetrating trauma with tamponade (survival &gt;15%), versus &lt;2% for blunt trauma; it is not indicated in blunt arrest without signs of life. Guidelines restrict thoracotomy for blunt trauma to patients arriving with signs of life or a witnessed arrest under ~10 minutes prior (Dewey et al., Journal of Trauma and Acute Care Surgery, 2025; Sam et al., European Journal of Trauma and Emergency Surgery, 2022).</p>\n<p>Intubate, IV access and massive transfusion / plus pericardiocentesis: Aggressive resuscitation and pericardiocentesis presuppose a survivable, reversible cause. After 15 minutes of blunt-arrest CPR with no signs of life, fixed pupils, and an agonal rhythm, these interventions are futile and divert resources; tamponade (the target of</p>\n<p>pericardiocentesis) is characteristic of penetrating, not blunt, mechanisms.</p>\n<p>Background reading: Signs of life on arrival and mechanism of injury (penetrating vs blunt) are the two variables that most drive survival after resuscitative thoracotomy; both are absent/unfavorable here.</p>","no_key":false,"no_options":false,"free_answer":null,"number":85},{"stem":"In what trimester does the fetus receive the most exposure to radiation with x-rays?","options":[{"letter":"A","text":"First."},{"letter":"B","text":"Second."},{"letter":"C","text":"Third."},{"letter":"D","text":"All are equal exposure."}],"correct":"A","explanation":"<p><strong>Why First is correct: The developing conceptus is most:</strong> radiosensitive early in pregnancy. During major organogenesis (~2\u20138 weeks post-conception) the embryo is vulnerable to</p>\n<p>malformation and growth restriction, and the central nervous system is maximally radiosensitive at 8\u201315 weeks \u2014 periods that fall within the first trimester and its border with the second (ACR\u2013SPR Practice Parameter, 2023; American College of Obstetricians and Gynecologists Committee Opinion, 2017). Radiation teratogenesis \u2014 congenital abnormalities and lethality \u2014 peaks during organogenesis and falls sharply thereafter (Zanzonico et al., JACC: Cardiovascular Imaging, 2016). Reviews of occupational exposure likewise state that the most sensitive time for fetal complications is early in pregnancy (Glazer et al., JAMA Surgery, 2024).</p>\n<p><strong>Why the other choices are incorrect:</strong> Second / Third: By the second and especially third trimesters, organogenesis is complete and radiosensitivity for teratogenic and lethal effects declines substantially; the main residual concern is a small stochastic increase in childhood cancer risk.</p>\n<p>All are equal exposure: Radiation risk is not constant across gestation \u2014 the type and probability of injury depend heavily on gestational age at exposure.</p>\n<p>Note on wording: The question says &quot;most exposure,&quot; but the clinically meaningful concept \u2014 and the intent of the answer \u2014 is greatest vulnerability/radiosensitivity, which is highest in the first trimester (organogenesis). For diagnostic x-rays, fetal doses are generally well below the ~50\u2013100 mGy threshold for deterministic harm regardless of trimester.</p>","no_key":false,"no_options":false,"free_answer":null,"number":86},{"stem":"In diabetic foot ulcers what is the underlying mechanism?","options":[{"letter":"A","text":"Vasculopathy."},{"letter":"B","text":"Small vessel arthrosclerosis (arteriosclerosis)."},{"letter":"C","text":"Venous insufficiency."},{"letter":"D","text":"Neuropathy."}],"correct":"D","explanation":"<p><strong>Why neuropathy is correct: Peripheral neuropathy is the:</strong> central, most common pathway to ulceration. Sensory neuropathy causes loss of protective sensation so that minor</p>\n<p>trauma, foreign bodies, or pressure go unnoticed; motor neuropathy produces foot deformity and abnormal loading with callus formation; autonomic neuropathy causes dry, cracked skin. The International Working Group on the Diabetic Foot states that diabetic peripheral neuropathy plays the central role, with roughly 90% of ulcers being purely neuropathic or neuro-ischemic (Schaper et al., IWGDF Guidelines, Diabetes/Metabolism Research and Reviews, 2020; Armstrong et al., JAMA, 2023; Voelker, JAMA, 2023).</p>\n<p><strong>Why the other choices are incorrect:</strong> Vasculopathy / peripheral artery disease: PAD is present in up to ~50% of patients with a diabetic foot ulcer and is a major driver of impaired healing and amputation, but it is usually a co-contributor (neuro-ischemic ulcers) rather than the primary cause; purely ischemic ulcers are a minority (Schaper et al., IWGDF, 2020).</p>\n<p>Small vessel arteriosclerosis (&quot;small vessel disease&quot;/microangiopathy): Explicitly stated not to be the primary cause of ulceration or poor wound healing (Schaper et al., IWGDF, 2020).</p>\n<p>Venous insufficiency: This is the mechanism of venous stasis (gaiter-area) ulcers, a distinct entity from the neuropathic/neuro-ischemic diabetic foot ulcer.</p>\n<p>Background reading: The classic sequence is neuropathy \u2192 insensate/deformed foot \u2192 repetitive or minor trauma \u2192 callus and breakdown \u2192 ulcer, with PAD impairing healing once an ulcer forms.</p>","no_key":false,"no_options":false,"free_answer":null,"number":87},{"stem":"The most common clinical symptom of a post-operative myocardial infarction is?","options":[{"letter":"A","text":"None."},{"letter":"B","text":"Retrosternal chest pain."},{"letter":"C","text":"Dyspnea."},{"letter":"D","text":"Sudden post-operative death."}],"correct":"A","explanation":"<p><strong>Why &quot;none&quot; is correct: Postoperative MI is most often:</strong> silent/asymptomatic. Sedation, analgesia, and pain at the</p>\n<p>surgical site mask ischemic symptoms; up to two-thirds of patients have no ischemic symptoms (Mills et al., Fifth Universal Definition of Myocardial Infarction, 2026). In the VISION cohort, only ~7% of patients with myocardial injury after noncardiac surgery had ischemic symptoms and only ~25% had ischemic ECG changes; 80\u201390% of MINS is asymptomatic (Ruetzler et al., AHA Scientific Statement, 2021; Thompson et al., 2024 Perioperative Cardiovascular Guideline). Roughly two-thirds of perioperative MIs would go undetected without routine troponin surveillance (Devereaux and Sessler, New England Journal of Medicine, 2015).</p>\n<p><strong>Why the other choices are incorrect:</strong> Retrosternal chest pain: The hallmark of MI in the nonsurgical setting, but present in only ~6% of postoperative patients with troponin elevation.</p>\n<p>Dyspnea: May occur but is neither the most common nor a specific manifestation postoperatively.</p>\n<p>Sudden post-operative death: A catastrophic but uncommon outcome, not the &quot;most common clinical symptom.&quot;</p>\n<p>Background reading: Because symptoms are usually absent, guidelines recommend routine postoperative troponin surveillance (with a pre-op baseline) in high-risk patients to detect MINS/postoperative MI.</p>","no_key":false,"no_options":false,"free_answer":null,"number":88},{"stem":"You are a plastic surgeon, planning to do an elective cosmetic procedure on a patient who underwent cardiac stenting with a drug eluting stent 2 months ago and now on plavix, how do you manage?","options":[{"letter":"A","text":"Delay surgery for 10 months."},{"letter":"B","text":"Delay surgery for 4 months and then go off plavix."},{"letter":"C","text":"Take off plavix immediately and proceed with surgery."},{"letter":"D","text":"Do surgery without stopping plavix."}],"correct":"A","explanation":"<p><strong>Why delaying 10 months is correct: The procedure is purely:</strong> elective and cosmetic, so there is no penalty for waiting and every reason to minimize stent thrombosis risk. Stent thrombosis risk is highest in the first 4\u20136 weeks and remains elevated for months; interrupting dual antiplatelet therapy early is one of the strongest risk factors for catastrophic stent thrombosis (Levine et al., 2016 ACC/AHA DAPT Focused Update). Waiting 10 more months from the current 2-month point reaches ~12 months post-PCI, at which point the P2Y12 inhibitor can be stopped (continuing low-dose aspirin) with minimal thrombotic risk (Kumbhani et al., 2026 ACC Scientific Statement).</p>\n<p><strong>Why the other choices are incorrect:</strong> Delay 4 months then go off plavix (\u22486 months total): Six months is the guideline minimum acceptable delay for elective noncardiac surgery after DES in chronic coronary syndrome, and is a legitimate option \u2014 but for an entirely discretionary cosmetic procedure the more conservative 12- month wait is preferable, which is why the 10-month option is the best answer here (see nuance).</p>\n<p>Take off plavix immediately and proceed: Stopping DAPT at only 2 months post-DES and operating imposes an unacceptable stent thrombosis risk; strongly contraindicated for elective surgery.</p>\n<p>Do surgery without stopping plavix: Operating on uninterrupted clopidogrel markedly increases perioperative bleeding for a non-urgent cosmetic case with no offsetting benefit.</p>\n<p>Nuance / practice update: Current guidance (2024 AHA/ACC perioperative guideline; 2026 ACC Scientific Statement) permits deferring elective noncardiac surgery \u22656 months after PCI for chronic coronary syndrome (12 months if the stent was placed for acute coronary syndrome). So if the stent was placed for stable disease, &quot;delay 4 months then off plavix&quot; (~6 months total) is now also guideline-concordant. For a purely cosmetic procedure, however, the 12-month wait (delay 10 months) remains the safest choice and is the intended answer. When P2Y12 inhibition is stopped, clopidogrel is discontinued 5 days before surgery (Douketis et al., CHEST Guideline, 2022).</p>","no_key":false,"no_options":false,"free_answer":null,"number":89},{"stem":"What is the most common cause of ventricular arrhythmias in post-operative patients?","options":[{"letter":"A","text":"Hyperkalemia."},{"letter":"B","text":"Hypokalemia."},{"letter":"C","text":"Hypocalcemia."},{"letter":"D","text":"Hyponatremia."}],"correct":"B","explanation":"<p><strong>Why hypokalemia is correct: Hypokalemia is the electrolyte:</strong> disturbance most commonly implicated in ventricular arrhythmias and is especially frequent postoperatively (fluid shifts, diuretics, GI/nasogastric losses, insulin, catecholamine- driven intracellular potassium shift). In the LYTE-VT study, hypokalemia was present in 35.7% of patients presenting with sustained VT/VF versus 12.9% of heart-failure controls (Laslett et al., American Journal of Cardiology, 2020). Guidelines identify hypokalemia (with hypomagnesemia) as a common,</p>\n<p>correctable trigger for ventricular arrhythmia and torsades, and recommend maintaining potassium and magnesium in these settings (Al-Khatib et al., 2017 AHA/ACC/HRS Ventricular Arrhythmia Guideline; Zipes et al., ACC/AHA/ESC 2006 Guideline).</p>\n<p><strong>Why the other choices are incorrect:</strong> Hyperkalemia: Also arrhythmogenic (peaked T waves \u2192 sine wave \u2192 VF/asystole), but less commonly the cause of ventricular arrhythmias in the general postoperative population than hypokalemia; a major concern chiefly in renal failure, crush injury, and acidosis.</p>\n<p>Hypocalcemia: Prolongs the QT interval and can predispose to torsades but is a far less common precipitant of postoperative ventricular arrhythmias than hypokalemia.</p>\n<p>Hyponatremia: The most common electrolyte abnormality overall in hospitalized/heart-failure patients, but it manifests primarily with neurologic effects and is not a typical direct cause of ventricular arrhythmia.</p>\n<p>Background reading: Correct both potassium and magnesium \u2014 hypomagnesemia often coexists and must be repleted to allow effective potassium correction; keep potassium roughly 4.0\u20134.5 mmol/L in at-risk cardiac patients.</p>","no_key":false,"no_options":false,"free_answer":null,"number":90},{"stem":"The Bacille Calmette-Guerin vaccine is an example of which type of immunity?","options":[{"letter":"A","text":"Passive and specific."},{"letter":"B","text":"Passive and non-specific."},{"letter":"C","text":"Active and nonspecific."},{"letter":"D","text":"Active and specific."}],"correct":"C","explanation":"<p><strong>Why &quot;active&quot; is unambiguously correct: BCG is a live:</strong> attenuated vaccine. It stimulates the recipient&#x27;s own immune</p>\n<p>system to generate a response, which is the definition of active immunity \u2014 as opposed to passive immunity (transfer of pre-formed antibodies, e.g., immunoglobulin or maternal antibody). Both &quot;passive&quot; options are therefore wrong.</p>\n<p><strong>The specific vs. non-specific tension:</strong> <strong>Argument for &quot;non-specific&quot; (the marked answer): BCG is the:</strong> textbook example of a vaccine with prominent non-specific / heterologous protective effects. Beyond tuberculosis, it reduces all-cause neonatal mortality and confers protection against unrelated infections through &quot;trained immunity&quot; \u2014 epigenetic and metabolic reprogramming of innate monocytes/macrophages and heterologous lymphocyte activation (Parmar et al., American Journal of the Medical Sciences, 2021; Lange et al., Lancet Infectious Diseases, 2022; Lee et al., Nature Immunology, 2024). This property also underlies intravesical BCG for bladder cancer. If the exam intends BCG as the classic illustration of non-specific immunostimulation, &quot;active and non-specific&quot; is the intended answer.</p>\n<p><strong>Argument for &quot;active and specific&quot; (classic vaccinology): The:</strong> primary, defining function of any vaccine, including BCG, is to induce antigen-specific adaptive immunity \u2014 BCG generates a specific Th1 (IFN-\u03b3) response against mycobacterial antigens (Parmar et al., American Journal of the Medical Sciences, 2021). By the standard immunology framework used to classify vaccines, the expected answer would be active and specific.</p>\n<p>Bottom-line caveat: &quot;Active&quot; is certainly correct. The choice between &quot;specific&quot; and &quot;non-specific&quot; depends on interpretation: active + specific is the conventional textbook classification of any vaccine, whereas active + non-specific captures BCG&#x27;s distinctive trained-immunity/heterologous effects. The source key (&quot;active and nonspecific&quot;) is reasonable given BCG&#x27;s fame for non-specific immunity, but this item is ambiguous, and &quot;active and specific&quot; is a strongly defensible alternative that many examiners would accept. This disagreement/ambiguity is flagged rather than resolved.</p>\n<p><strong>Why the remaining choices are incorrect:</strong> Passive and specific / passive and non-specific: Both are wrong because BCG is a vaccine and produces active, not passive, immunity.</p>","no_key":false,"no_options":false,"free_answer":null,"number":91},{"stem":"A 6 week old term infant baby boy is brought into the ER by parents because of projectile, non-bilious emesis. Examination reveals dry mucous membranes and a sunken fontanel. He is afebrile, has a HR of 136, BP 73/50 and RR 30. His weight is 5 kg. Investigations are pending. What is the most appropriate INITIAL fluid order?","options":[{"letter":"A","text":"100 ml bolus with D10NS."},{"letter":"B","text":"20 ml bolus with NS."},{"letter":"C","text":"100 ml bolus with NS."},{"letter":"D","text":"100 ml bolus with 0.45% NS."}],"correct":"C","explanation":"<p><strong>Why &quot;100 ml bolus with NS&quot; is correct:</strong> The picture is hypertrophic pyloric stenosis with hypochloremic, hypokalemic metabolic alkalosis and clinical dehydration. Resuscitation uses isotonic crystalloid (0.9% saline) at 20 mL/kg per bolus; for a 5 kg infant, 20 mL/kg = 100 mL of normal saline (Stewart et al., Pediatrics in Review/AAP, 2023; Dalton et al., Journal of Pediatric Surgery, 2016). Boluses are repeated (two 20 mL/kg boluses if presenting chloride \u226497 mmol/L, three if &lt;85 mmol/L) with maintenance fluid at 1.5\u20132\u00d7 maintenance thereafter.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p>20 ml bolus with NS \u2014 This is only ~4 mL/kg, a sub-therapeutic bolus. The distractor exploits confusing &quot;20 mL/kg&quot; with &quot;20 mL.&quot;</p>\n<p>100 ml bolus with D10NS \u2014 Dextrose-containing fluid is not the initial resuscitation fluid; isotonic saline is used to restore volume and chloride.</p>\n<p>100 ml bolus with 0.45% NS \u2014 Hypotonic saline is inappropriate for acute volume resuscitation and does not correct the chloride deficit driving the alkalosis.</p>","no_key":false,"no_options":false,"free_answer":null,"number":92},{"stem":"Regarding prevention of surgical site infections (SSI's), which ONE of the following is correct?","options":[{"letter":"A","text":"Tunnelled central lines have an increased infection rate compared to non-tunnelled central venous lines."},{"letter":"B","text":"Decrease in foley catheter use has been associated with decrease in SSI's."},{"letter":"C","text":"In clean wounds skin closure with staples compared to subcuticular sutures have been proven to significantly decrease SSI's."},{"letter":"D","text":"Antibiotic administration just prior to incision for clean operations decreases SSI's."}],"correct":"D","explanation":"<p><strong>Why it is correct:</strong> Appropriately timed antimicrobial prophylaxis given before incision (within 120 min, and closer to incision for short-half-life agents such as cefazolin) reduces SSI. The landmark Classen trial showed lowest infection rates when antibiotics were given within 2 hours before incision, with rising rates when given after incision (Classen et al., NEJM, 1992; Allegranzi et al./WHO, Lancet Infectious Diseases, 2016).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p>Tunnelled lines have higher infection rate \u2014 The opposite is true; tunnelled/cuffed catheters have lower catheter-related bloodstream infection rates, and these are line infections rather than SSIs.</p>\n<p>Decreased foley use decreases SSIs \u2014 Reducing catheter days lowers catheter-associated UTIs, not surgical site infections.</p>\n<p>Staples vs subcuticular sutures significantly decrease SSIs \u2014 Evidence does not show a significant SSI reduction with staples; subcuticular closure is at least equivalent (Goto et al., Cochrane, 2020).</p>","no_key":false,"no_options":false,"free_answer":null,"number":93},{"stem":"Which of the following is the major fuel source for the brain after 24 days of fasting or starvation.","options":[{"letter":"A","text":"Ketone bodies."},{"letter":"B","text":"Glucose."},{"letter":"C","text":"Fatty acids."},{"letter":"D","text":"Amino acids."}],"correct":"A","explanation":"<p><strong>Why it is correct:</strong> In prolonged starvation the brain shifts from glucose to ketone bodies (\u03b2-hydroxybutyrate, acetoacetate) produced by hepatic fatty-acid oxidation. After several weeks of fasting roughly two-thirds (~60%) of the brain&#x27;s energy is supplied by ketones, sparing protein/glucose (Kolb et al., BMC Medicine, 2021; de Cabo &amp; Mattson, NEJM, 2019).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p>Glucose \u2014 The default fuel in the fed state and early fasting, but hepatic glycogen is depleted within ~24 h and gluconeogenic substrate is limited in prolonged starvation.</p>\n<p>Fatty acids \u2014 Long-chain fatty acids do not efficiently cross the blood\u2013brain barrier; the brain cannot use them directly, which is precisely why ketones are required.</p>\n<p>Amino acids \u2014 Used indirectly for gluconeogenesis early on, but protein is preserved during prolonged fasting via the ketone switch.</p>","no_key":false,"no_options":false,"free_answer":null,"number":94},{"stem":"A pedestrian is pinned against a wall by an automobile and suffers a significant crush injury to her lower legs. Two day later her urine is noted to be dark brown in color. Her urine output is 10-20 ccs/h. Her serum creatinine kinase is 38,000. Treatment of this condition should include all of the following EXCEPT?","options":[{"letter":"A","text":"Management of bilateral lower leg compartment syndrome."},{"letter":"B","text":"Aggressive IV fluid hydration."},{"letter":"C","text":"5% dextrose in water with 3 amps of sodium bicarbonate/L infusion."},{"letter":"D","text":"Cystoscopy and 24 hours urine for creatinine clearance."}],"correct":"D","explanation":"<p><strong>Why it is the EXCEPT (the incorrect treatment):</strong> This is rhabdomyolysis with pigment (myoglobin) nephropathy. Cystoscopy has no role, and a 24-hour urine creatinine clearance is neither diagnostic nor therapeutic in an evolving acute kidney injury\u2014it delays care and is invalid in non\u2013steady-state renal function (Szugye/AAP, 2020; Zeng et al., Cochrane, 2014).</p>\n<p><strong>Why the other options are appropriate (and therefore not the answer):</strong></p>\n<p>Aggressive IV fluid hydration \u2014 Cornerstone of therapy: early, vigorous isotonic fluid to maintain brisk urine output and prevent pigment cast nephropathy.</p>\n<p>5% dextrose with sodium bicarbonate infusion \u2014 Urinary alkalinization (goal urine pH &gt;6.0\u20136.5) reduces myoglobin/Tamm-Horsfall precipitation; commonly used when acidotic (Le Quang et al., Journal of Neurology, 2024).</p>\n<p>Management of bilateral lower leg compartment syndrome \u2014 Crush injury frequently causes compartment syndrome; identifying and treating it (fasciotomy when indicated) is essential.</p>","no_key":false,"no_options":false,"free_answer":null,"number":95},{"stem":"Compared with wet to dry dressing changes, negative pressure wound therapy is associated with all of the following EXCEPT?","options":[{"letter":"A","text":"Increased local blood flow."},{"letter":"B","text":"Decreased tissue edema."},{"letter":"C","text":"Decreased bacterial count."},{"letter":"D","text":"Increased rate of wound healing."}],"correct":"C","explanation":"<p><strong>Why it is the EXCEPT:</strong> The most consistently disputed and least-established NPWT effect is a reduction in bacterial burden. Reviews explicitly note the effect on bacterial contamination is uncertain/inconsistent, and controlled data (e.g., the cesarean SSI RCT) failed to show infection reduction; some studies show no change or even increased bacterial counts (Norman et al., Cochrane, 2022; Tuuli et al., JAMA, 2020).</p>\n<p><strong>Why the other options are established (and not the answer):</strong></p>\n<p>Increased local blood flow / granulation and decreased tissue edema \u2014 Classic proposed mechanisms of NPWT (removal of exudate, reduced edema, increased micr
