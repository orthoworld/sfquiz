ong> \u2014 Largely obsolete, invasive, and non-specific; supplanted by FAST and CT.</p>\n<p><strong>Caveat:</strong> If the exam&#x27;s intent was the initial ATLS bedside step in the trauma bay, FAST is performed first in essentially all trauma patients; however, as the definitive &quot;next step in management&quot; for a stable patient with localized tenderness, CT abdomen/pelvis is the guideline-supported answer.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":25,"stem":"A 37 year old woman with a history of short bowel syndrome due to Crohn's disease is managed with home TPN. She comes to the emergency room complaining of fever, neck pain, and paresthesia of her arms. The next step in her management should be?","options":[{"letter":"A","text":"Lumbar puncture for C&S."},{"letter":"B","text":"Urgent MR spine."},{"letter":"C","text":"Retrograde blood culture from the central line."},{"letter":"D","text":"Remove central line and send tip for culture."}],"correct":"B","explanation":"<p><strong>Why &quot;urgent MR spine&quot; is correct:</strong> The combination of fever, neck (spinal) pain, and neurologic symptoms (bilateral upper-extremity paresthesias) in a patient with a chronic indwelling central venous catheter (a source of S. aureus bacteremia) is the classic presentation of a spinal epidural abscess with early cord/root involvement. Urgent contrast-enhanced MRI of the spine is the diagnostic study of choice and must be obtained emergently, because progression to cord compression and irreversible deficit can occur rapidly and may require urgent surgical decompression.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>lumbar puncture for C&amp;S</strong> \u2014 Contraindicated/hazardous when an epidural abscess is suspected: the needle can traverse and seed the abscess or precipitate herniation/deterioration, and it does not localize the lesion. Imaging comes first.</p>\n\n<p><strong>retrograde blood culture from the central line</strong> \u2014 Blood cultures (central and peripheral) are appropriate and should be drawn, but they do not address the time-critical threat to the spinal cord; imaging cannot wait for culture results.</p>\n\n<p><strong>remove central line and send tip for culture</strong> \u2014 Source control of a likely catheter-related bloodstream infection is important, but the immediate priority is diagnosing the neurologic emergency with MRI; line management follows and should not delay imaging.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":26,"stem":"A 53 year old man is admitted to hospital for investigation and treatment of a partially obstructing mid esophageal cancer. Which of the following statements concerning the use of pre-operative TPN to prevent post-operative complications is TRUE?","options":[{"letter":"A","text":"It is useful even if used for as little as 3 days."},{"letter":"B","text":"It is efficacious only if the patient is severely malnourished."},{"letter":"C","text":"There is no evidence that it lowers the risk of complications."},{"letter":"D","text":"Slightly overfeeding for 7 days with mild to moderate hyperglycemia reduces the risk of septic complications."}],"correct":"B","explanation":"<p><strong>Why &quot;it is efficacious only if the patient is severely malnourished&quot; is correct:</strong> The landmark VA Cooperative Study showed that 7\u201315 days of preoperative TPN reduced noninfectious (healing-related) complications only in the subgroup of severely malnourished patients; mildly/moderately malnourished patients derived no benefit and had more infectious complications (Souba, New England Journal of Medicine, 1997). ASPEN guidance restricts preoperative PN to moderately-to-severely malnourished patients when surgery can safely be delayed 7\u201314 days (Worthington et al., JPEN, 2017).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><em>It is useful even if used for as little as 3 days:</em> Benefit requires roughly 7\u201314 days of repletion; 3 days is insufficient to alter outcomes (Worthington et al., JPEN, 2017).</p>\n\n<p><em>There is no evidence that it lowers the risk of complications:</em> Understates a real ~10% reduction in complications demonstrated in malnourished subgroups (Koretz et al., Gastroenterology, 2001).</p>\n\n<p><em>Slightly overfeeding for 7 days with mild to moderate hyperglycemia reduces septic complications:</em> Overfeeding and hyperglycemia increase, not decrease, septic complications (Worthington et al., JPEN, 2017).</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":27,"stem":"Part of the cardiovascular response to injury or infection is arterial vasodilation and increased protein permeability in the capillary membranes. Which of the following inflammatory mediators causes arterial vasodilatation but NOT increased capillary permeability?","options":[{"letter":"A","text":"Nitric oxide."},{"letter":"B","text":"Bradykinin."},{"letter":"C","text":"Histamine."},{"letter":"D","text":"Platelet-activating factor."}],"correct":"A","explanation":"<p><strong>Why &quot;nitric oxide&quot; is correct:</strong> Nitric oxide is a potent endothelium-derived vasodilator (via smooth-muscle guanylate cyclase/cGMP) that relaxes arteriolar tone but does not itself produce the endothelial gap formation and protein leak that characterizes increased microvascular permeability.</p>\n<p><strong>Why the others are incorrect \u2014 all three increase capillary permeability in addition to causing vasodilation:</strong></p>\n<p><em>Bradykinin:</em> A classic mediator of both vasodilation and increased vascular permeability (endothelial contraction/gap formation).</p>\n\n<p><em>Histamine:</em> The prototypical permeability mediator, causing postcapillary venule leak (wheal-and-flare) as well as vasodilation.</p>\n\n<p><em>Platelet-activating factor:</em> Causes vasodilation and markedly increases vascular permeability (more potent than histamine on a molar basis).</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":28,"stem":"A 30 year old woman is brought to the emergency room with a stab wound to the abdomen sustained during a robbery attempt in which she was also knocked unconscious. She is hypotensive and ultrasound of the abdomen is positive for free intraperitoneal fluid. She is taken to the operating room for Laparotomy. During the procedure, the family arrives and informs the hospital staff that she is a Jehovah's Witness and would not want a blood transfusion. She is hypotensive with a hemoglobin of 5 mg/dl. The most appropriate management would be?","options":[{"letter":"A","text":"Transfusion as medically necessary."},{"letter":"B","text":"Vasopressors."},{"letter":"C","text":"Ask police to check her clothes and home for a Jehovah Witness card."},{"letter":"D","text":"Stop blood transfusion and complete operation expeditiously."}],"correct":"A","explanation":"<p><strong>Why &quot;transfusion as medically necessary&quot; is correct:</strong> The patient is incapacitated (unconscious/under anesthesia) and has no available, valid advance directive refusing blood. When an incapacitated patient requiring lifesaving transfusion has no blood-refusal directive or authorized surrogate available, the standard is to transfuse as a lifesaving measure under presumed consent (Wiser and Gauer, American Family Physician, 2024). Emergency-surgery consensus guidance states that if there is no clear indication of the patient&#x27;s own treatment instructions, surgeons are on solid ground treating with all available modalities under presumed consent (Coccolini et al., WSES-AAST Consensus, 2024). A family&#x27;s secondhand report of religious affiliation is not a legally valid, patient-executed refusal.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><em>Vasopressors:</em> Do not treat the underlying oxygen-carrying deficit at Hgb 5 g/dL with hemorrhagic shock; a temporizing adjunct at best, not definitive management.</p>\n\n<p><em>Ask police to check her clothes and home for a Jehovah Witness card:</em> Introduces an unacceptable delay in a life-threatening emergency; even a found card would not be a substitute for a validated advance directive, and resuscitation cannot wait.</p>\n\n<p><em>Stop blood transfusion and complete operation expeditiously:</em> Would honor an unverified surrogate report over the patient&#x27;s own (unknown) wishes and likely result in preventable death; withholding lifesaving blood requires the patient&#x27;s own valid, informed refusal.</p>\n<p><em>Note:</em> Had the patient herself possessed a clear, signed advance directive refusing blood, that directive would have to be followed; the decisive issue here is the absence of any valid patient-executed refusal.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":29,"stem":"A 3 year old child is brought to the emergency room because she has a painful left leg. Physical examination demonstrates a hematoma in the left thigh muscle. She is also found to have old ecchymosis on her chest and x-ray demonstrated at least two old rib fractures. The best course of action at this time is?","options":[{"letter":"A","text":"Admit the child to hospital for further investigation."},{"letter":"B","text":"Consult social worker re possible child abuse."},{"letter":"C","text":"Report the case to the police immediately."},{"letter":"D","text":"Discharge the patient home and inform the parents that you will be contacting the Children's Aid society because of your suspicion of child abuse."}],"correct":"A","explanation":"<p><strong>Why &quot;admit the child to hospital for further investigation&quot; is correct:</strong> Multiple injuries in different stages of healing (acute thigh hematoma, old chest ecchymoses, healing rib fractures) constitute strong concern for physical abuse. Rib fractures in a young child are highly specific for abuse. Admission accomplishes the two priorities simultaneously: it protects the child from returning to a potentially unsafe environment and permits the recommended workup \u2014 skeletal survey (indicated up to age 2, and up to ~5 in selected cases), laboratory evaluation (calcium, phosphorus, alkaline phosphatase, and screening for occult injury), and multidisciplinary/child-abuse specialist consultation (Christian and AAP Committee on Child Abuse and Neglect, Pediatrics, 2015; Haney et al., AAP Clinical Report, 2025). Hospitalization for medical evaluation, treatment, and/or protection is explicitly endorsed by the AAP.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><em>Consult social worker re possible child abuse:</em> A necessary component of care but insufficient as the single &quot;best course&quot; \u2014 it neither ensures the child&#x27;s immediate physical safety nor initiates the medical workup for occult injury.</p>\n\n<p><em>Report the case to the police immediately:</em> Mandatory reporting of reasonable suspicion of abuse is required, but the appropriate agency in this setting is the child protection authority (e.g., Children&#x27;s Aid Society/CPS), not primarily the police; reporting alone also does not provide medical evaluation or in-hospital protection. (Reporting obligations run concurrently with admission.)</p>\n\n<p><em>Discharge the patient home and inform the parents that you will be contacting the Children&#x27;s Aid society:</em> Returns the child to a potentially dangerous environment, forgoes the diagnostic workup, and forewarns caregivers \u2014 unsafe and inappropriate.</p>\n<p><em>Note:</em> Admission does not relieve the clinician of the concurrent legal duty to report reasonable suspicion of abuse to the child protection agency.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":30,"stem":"A 25 year old man is brought to the emergency room with a gunshot wound to the left mid cervical region. Vitals on arrival are HR 120, BP 130/70, RR 25. O2SAT 92, GCS 14. He is noted to have a right hemiparesis. The next step in his management should be?","options":[{"letter":"A","text":"Endotracheal intubation."},{"letter":"B","text":"CTA head and neck."},{"letter":"C","text":"Carotid arteriography with possible endovascular stenting."},{"letter":"D","text":"Immediate neck exploration in OR for repair of carotid injury."}],"correct":"A","explanation":"<p><strong>Why &quot;endotracheal intubation&quot; is correct:</strong> ATLS priorities dictate airway first. A penetrating zone II neck injury carries the threat of an expanding hematoma and rapid airway compromise; the patient already shows tachypnea (RR 25) and borderline oxygenation (SpO\u2082 92%). Early, controlled definitive airway (endotracheal intubation) is the next step before diagnostic imaging or operative planning.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><em>CTA head and neck:</em> Appropriate diagnostic study for a stable penetrating neck injury without hard signs, but only after the airway is secured; it does not take priority over airway protection.</p>\n\n<p><em>Carotid arteriography with possible endovascular stenting:</em> A potential later intervention once vascular injury is defined; not the immediate step and premature before airway/imaging.</p>\n\n<p><em>Immediate neck exploration in OR for repair of carotid injury:</em> No hard sign mandating immediate operation is described; the airway must be secured and injury characterized first.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":31,"stem":"A morbidly obese 43 year old man is brought to the emergency room after a high-speed MVC. On arrival, vitals are: HR 130, BP 80 mmHg systolic despite 2,000 normal saline. Chest x-ray is normal. FAST is indeterminate because of obesity. Pelvic x-ray shows a complex pelvic fracture. He remains in shock despite transfusion of 2 units of packed RBC. The next step in the management of this patient should be?","options":[{"letter":"A","text":"CT scan head, C-spine, chest, abdomen and pelvis."},{"letter":"B","text":"Diagnostic peritoneal lavage."},{"letter":"C","text":"Placement of pelvic external fixator."},{"letter":"D","text":"Abdominal and pelvic angiography."}],"correct":"C","explanation":"<p><strong>Why &quot;placement of pelvic external fixator&quot; is correct:</strong> This is a hemodynamically unstable patient (persistent shock despite crystalloid and 2 units PRBC) with a complex pelvic fracture. Unstable patients should undergo immediate mechanical stabilization and hemostatic control; early reduction/stabilization of the disrupted pelvic ring (binder/external fixation) reduces pelvic volume and tamponades venous/cancellous bleeding and is a core damage-control maneuver (Spahn et al., European trauma bleeding guideline, Critical Care, 2019). Among the listed options it is the appropriate immediate next step in an unstable patient.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><em>CT scan head, C-spine, chest, abdomen and pelvis:</em> Contraindicated in a persistently unstable (&quot;won&#x27;t transport&quot;) patient \u2014 the CT scanner is a dangerous place for a patient in refractory shock.</p>\n\n<p><em>Diagnostic peritoneal lavage:</em> Largely supplanted by FAST/CT; although it can help identify an intraperitoneal source when FAST is indeterminate, in this unstable patient with an obvious bleeding pelvic fracture the priority is pelvic stabilization/hemorrhage control rather than DPL.</p>\n\n<p><em>Abdominal and pelvic angiography:</em> Angioembolization is a key hemorrhage-control tool but typically follows/accompanies mechanical stabilization; it is most useful for arterial bleeding and is often combined with external fixation \u00b1 preperitoneal packing.</p>\n<p><em>Note:</em> External fixation is the immediate step, but definitive management is multimodal \u2014 mechanical stabilization plus preperitoneal packing and/or angioembolization (\u00b1 REBOA), and an intraperitoneal source must still be excluded given the indeterminate FAST.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":32,"stem":"A 90 year old woman with Type II diabetes mellitus is admitted to hospital because of acute sigmoid diverticulitis. On the second hospital day, she was noted to have a decreased level of consciousness (GCS 12). Blood work demonstrates: Na 125, K 3.1, Cr 157, Glucose 26.2. All of the following treatments would be appropriate, EXCEPT:","options":[{"letter":"A","text":"IV normal saline."},{"letter":"B","text":"Insulin infusion."},{"letter":"C","text":"Broad-spectrum antibiotics."},{"letter":"D","text":"Mannitol."}],"correct":"D","explanation":"<p><strong>Why &quot;mannitol&quot; is the correct EXCEPTION:</strong> The picture is a hyperosmolar hyperglycemic state (marked hyperglycemia \u2014 glucose 26.2 mmol/L \u2248 470 mg/dL \u2014 with obtundation) precipitated by infection (diverticulitis). These patients are profoundly volume-depleted and hyperosmolar. Mannitol is an osmotic diuretic that worsens dehydration, hypovolemia, and hyperosmolarity, and its label warns it can itself cause hyperosmolarity (FDA mannitol label). It is therefore inappropriate.</p>\n<p><strong>Why the others are appropriate (not the exception):</strong></p>\n<p><em>IV normal saline:</em> The cornerstone of HHS therapy is aggressive isotonic crystalloid rehydration (Stoner, American Family Physician, 2017; Lin et al., Diabetic Medicine, 2026).</p>\n\n<p><em>Insulin infusion:</em> Fixed-rate IV insulin infusion (\u22480.1 units/kg/h after fluid resuscitation is underway) is standard to correct hyperglycemia (Stoner, AFP, 2017).</p>\n\n<p><em>Broad-spectrum antibiotics:</em> Appropriate to treat the precipitating infection (acute diverticulitis), the trigger of the crisis.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":33,"stem":"Forty-eight hours after total mastectomy, high fever, diarrhea, vomiting and skin erythema over the entire body and hypotension develops in a 48 year old woman. The mastectomy incision appears unremarkable. The following day, diffuse desquamation develops. The most likely bacterial etiology of this condition is:","options":[{"letter":"A","text":"Clostridium perfringens."},{"letter":"B","text":"Beta-hemolytic streptococcus."},{"letter":"C","text":"Staphylococcus aureus."},{"letter":"D","text":"Bacteroides fragilis."}],"correct":"C","explanation":"<p><strong>Why &quot;staphylococcus aureus&quot; is correct:</strong> This is classic staphylococcal toxic shock syndrome \u2014 fever, hypotension, diffuse macular erythroderma, prominent GI symptoms (vomiting/diarrhea), multiorgan involvement, and characteristic later desquamation. Postoperative (non-menstrual) TSS characteristically develops within about 48 hours of surgery and often with an unremarkable-appearing surgical wound, because the TSST-1 superantigen dampens the local inflammatory response (Lappin and Ferguson, Lancet Infectious Diseases, 2009; Di Bella et al., Eur J Clin Microbiol Infect Dis, 2025). Desquamation is a hallmark of staphylococcal TSS occurring 1\u20132 weeks after onset (Chan and Maurice, New England Journal of Medicine, 2013).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><em>Beta-hemolytic streptococcus:</em> Streptococcal TSS is usually associated with a severe, painful soft-tissue infection/necrotizing fasciitis and positive blood cultures; the bland surgical wound and prominent early erythroderma/desquamation pattern here fit staphylococcal TSS. (S. aureus and S. pyogenes are the two TSS agents; S. aureus best fits this vignette \u2014 Gottlieb et al., J Emerg Med, 2018.)</p>\n\n<p><em>Clostridium perfringens:</em> Causes gas gangrene/myonecrosis with a painful, crepitant wound and systemic toxicity \u2014 not a toxin-mediated diffuse erythroderma with desquamation.</p>\n\n<p><em>Bacteroides fragilis:</em> An anaerobe of intra-abdominal/pelvic infections and abscesses; does not cause superantigen-mediated toxic shock with erythroderma and desquamation.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":34,"stem":"Which of the following drugs is most useful in the pre-operative management of patients with a pheochromocytoma?","options":[{"letter":"A","text":"Phenoxybenzamine (alpha blocker)."},{"letter":"B","text":"Metoprolol (beta blocker)."},{"letter":"C","text":"Furosemide (diuretic)."},{"letter":"D","text":"Enalapril (ACE inhibitor)."}],"correct":"A","explanation":"<p><strong>Why &quot;phenoxybenzamine (alpha blocker)&quot; is correct:</strong> Preoperative alpha-adrenergic blockade is the cornerstone of preparation for pheochromocytoma resection, started 7\u201314 days before surgery with volume repletion and a high-salt diet, to control blood pressure and prevent intraoperative hypertensive crises (NCCN Neuroendocrine and Adrenal Tumors, PHEO-2, v1.2026; Neumann et al., New England Journal of Medicine, 2019). Phenoxybenzamine is the classic nonselective alpha blocker used for this purpose.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><em>Metoprolol (beta blocker):</em> Beta blockade must never be given first/alone \u2014 it removes beta-mediated vasodilation and leaves unopposed alpha stimulation, which can precipitate severe hypertension/cardiopulmonary decompensation. Beta blockers are added only after adequate alpha blockade, for residual tachycardia (Neumann et al., NEJM, 2019).</p>\n\n<p><em>Furosemide (diuretic):</em> Contraindicated in principle \u2014 these patients are volume-contracted and require volume expansion, not diuresis.</p>\n\n<p><em>Enalapril (ACE inhibitor):</em> Not effective for catecholamine-driven crises and not the recommended agent; alpha blockade (\u00b1 calcium channel blockade/metyrosine) is standard.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":35,"stem":"Which of the following statements about low molecular weight heparin (LMWH) for the initial treatment of DVT is TRUE?","options":[{"letter":"A","text":"Unfractionated heparin has more predictable pharmacokinetics than LMWH."},{"letter":"B","text":"LMWH does not require laboratory monitoring in most patients."},{"letter":"C","text":"LMWH does not require dosage adjustments in patients with chronic renal failure."},{"letter":"D","text":"LMWH is useful in patients with heparin-induced thrombocytopenia."}],"correct":"B","explanation":"<p><strong>Why &quot;LMWH does not require laboratory monitoring in most patients&quot; is correct:</strong> LMWH has a predictable, weight-based dose response and does not require routine coagulation monitoring in most patients; anti-Xa monitoring is reserved for special populations (severe renal impairment, obesity, pregnancy).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><em>Unfractionated heparin has more predictable pharmacokinetics than LMWH:</em> The reverse is true \u2014 UFH binds plasma proteins/endothelium unpredictably and requires aPTT-guided titration, whereas LMWH is more predictable.</p>\n\n<p><em>LMWH does not require dosage adjustments in patients with chronic renal failure:</em> False \u2014 LMWH is renally cleared and accumulates in renal impairment, requiring dose reduction/monitoring or use of UFH instead.</p>\n\n<p><em>LMWH is useful in patients with heparin-induced thrombocytopenia:</em> False \u2014 LMWH cross-reacts with HIT antibodies and is contraindicated in HIT; non-heparin anticoagulants (e.g., argatroban, fondaparinux) are used.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":36,"stem":"A 67 year old woman is scheduled for a right hemicolectomy for carcinoma. She has adult-onset diabetes and is dyspneic when climbing stairs. An ECG shows a left bundle-branch block. The serum creatinine is 220. What is the most appropriate next step?","options":[{"letter":"A","text":"Proceed with surgery and book ICU bed for post-operative care."},{"letter":"B","text":"Institute beta-blockade with metoprolol and proceed with surgery."},{"letter":"C","text":"Consult cardiology for work-up with a cardiac catheterization."},{"letter":"D","text":"Administer a dobutamine stress echocardiogram."}],"correct":"D","explanation":"<p><strong>Why &quot;administer a dobutamine stress echocardiogram&quot; is correct:</strong> This patient has poor/uncertain functional capacity (dyspneic climbing stairs, ~&lt;4 METs), diabetes, renal dysfunction, and an LBBB, before intermediate-risk surgery. With LBBB, exercise ECG is uninterpretable, and exercise or vasodilator myocardial perfusion imaging produces false-positive septal perfusion defects; pharmacologic stress imaging is preferred, and dobutamine stress echocardiography has substantially higher specificity than perfusion imaging in LBBB (Fleisher et al., ACC/AHA Perioperative Guideline, JACC, 2007; Pellikka et al., ASE Stress Echocardiography Guideline, 2020). Noninvasive stress testing is the appropriate next step when it will change management.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><em>Proceed with surgery and book an ICU bed:</em> Skips indicated preoperative risk stratification in a symptomatic patient with multiple risk factors and an abnormal ECG; ICU booking does not address undiagnosed ischemia.</p>\n\n<p><em>Institute beta-blockade with metoprolol and proceed with surgery:</em> Initiating beta-blockade acutely just before surgery is not appropriate empiric management and does not evaluate the patient&#x27;s ischemic risk; perioperative beta-blocker initiation carries its own risks.</p>\n\n<p><em>Consult cardiology for work-up with a cardiac catheterization:</em> Invasive angiography is not the appropriate first step; noninvasive stress imaging should precede any consideration of catheterization.</p>\n<p><em>Note:</em> Current (2024 ACC/AHA) guidance emphasizes assessing functional capacity first and testing only if the result would change management; here the poor functional capacity plus uninterpretable ECG make noninvasive pharmacologic stress imaging (dobutamine stress echo) the best listed choice.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":37,"stem":"Which of the following is not needed in the calculation of systemic vascular resistance?","options":[{"letter":"A","text":"Mean arterial pressure."},{"letter":"B","text":"Pulmonary capillary wedge pressure."},{"letter":"C","text":"Cardiac output."},{"letter":"D","text":"Central venous pressure."}],"correct":"B","explanation":"<p><strong>Why &quot;pulmonary capillary wedge pressure&quot; is correct:</strong> Systemic vascular resistance is calculated as SVR = [(MAP \u2212 CVP) / CO] \u00d7 80 (dynes\u00b7s\u00b7cm\u207b\u2075). It requires the mean arterial pressure, the central venous (right atrial) pressure, and the cardiac output. The pulmonary capillary wedge pressure is not part of the SVR equation \u2014 it is instead used to calculate pulmonary vascular resistance (PVR = [(mean PAP \u2212 PCWP) / CO] \u00d7 80).</p>\n<p><strong>Why the others are needed (not the answer):</strong></p>\n<p><em>Mean arterial pressure:</em> The upstream (inflow) pressure of the systemic circuit.</p>\n\n<p><em>Cardiac output:</em> The flow term in the resistance equation.</p>\n\n<p><em>Central venous pressure:</em> The downstream (outflow) pressure of the systemic circuit.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":38,"stem":"Initial administration of normal saline during the resuscitation of a patient with a gunshot wound of the abdomen results in a rise in blood pressure to 110/80. At this point, the patient's blood gases are: pH 7.25, pO2 95, pCO2 25, HCO3 15. The patient's metabolic acidosis would be best treated with?","options":[{"letter":"A","text":"Sodium bicarbonate IV."},{"letter":"B","text":"Hyperventilation."},{"letter":"C","text":"Administration of 500 cc Pentaspan."},{"letter":"D","text":"Immediate laparotomy."}],"correct":"D","explanation":"<p><strong>Why &quot;Immediate laparotomy&quot; is correct:</strong> The blood gas shows a metabolic acidosis (low HCO3 of 15) with appropriate respiratory compensation (pCO2 of 25). In a patient with an abdominal gunshot wound, this is a lactic acidosis from hemorrhagic hypoperfusion. The only definitive treatment is hemorrhage/source control in the operating room; the transient blood-pressure response to crystalloid identifies a &quot;transient responder&quot; who has ongoing bleeding. Hemodynamic instability and a penetrating abdominal wound are themselves absolute indications for immediate laparotomy (Biffl and Leppaniemi, World Journal of Surgery, 2015; Sander et al., European Journal of Trauma and Emergency Surgery, 2022).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><em>Sodium bicarbonate IV</em> \u2014 Bicarbonate does not treat the underlying cause and is not recommended for trauma-related acidosis when pH is &gt;7.2, with questionable utility even below that; the primary means of correcting the acidosis is hemorrhage control and blood-product resuscitation (AAST/ACS-COT Damage-Control Resuscitation Protocol, 2024).</p>\n\n<p><em>Hyperventilation</em> \u2014 The low pCO2 is already the compensatory response to the metabolic acidosis; further hyperventilation does nothing for the metabolic derangement and cannot address ongoing blood loss.</p>\n\n<p><em>Administration of 500 cc Pentaspan</em> \u2014 A synthetic colloid may transiently raise blood pressure but does not achieve source control, can worsen coagulopathy, and delays the needed operation.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":39,"stem":"A 64 year old previously healthy man is admitted to hospital because of closed head injury and a ruptured spleen following an MVA. He is given 2/3 \u2014 1/3 glucose/saline solution at 125 ml/hr. The patient is somnolent but easily aroused until the 5th day when he is noted to be in a deep coma. Shortly afterwards he has a grand mal seizure. Serum electrolytes: Na+ 122, K+ 1.9, Cl- 96, HCO3 19. Serum osmolarity 260. Urine electrolytes: Na+ 61, K+ 18. What is the most likely cause of the patient's seizure?","options":[{"letter":"A","text":"Hypokalemia."},{"letter":"B","text":"Hyponatremia."},{"letter":"C","text":"Intracranial bleeding."},{"letter":"D","text":"Hypomagnesemia."}],"correct":"B","explanation":"<p><strong>Why &quot;Hyponatremia&quot; is correct:</strong> The patient developed acute hypotonic hyponatremia (Na 122, serum osmolarity 260) from days of hypotonic maintenance fluid (2/3\u20131/3 dextrose/saline) \u2014 a classic iatrogenic, hospital-acquired water intoxication, likely amplified by the SIADH that accompanies head injury and the postoperative state. Acute hyponatremia causes cerebral edema; generalized tonic\u2013clonic seizures typically appear when sodium falls rapidly, and acutely released glutamate lowers the seizure threshold (Castilla-Guerra et al., Epilepsia, 2006; Sterns, New England Journal of Medicine, 2015; Adrogu\u00e9 et al., JAMA, 2022). The elevated urine sodium (61) with hypotonicity is consistent with SIADH-type physiology.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><em>Hypokalemia</em> \u2014 Although K+ is low at 1.9, hypokalemia causes weakness and cardiac arrhythmia rather than seizures and is not a recognized cause of grand mal seizure.</p>\n\n<p><em>Intracranial bleeding</em> \u2014 Possible given the head injury, but the delayed 5-day course paralleling progressive fluid-induced hyponatremia, together with the profound biochemical derangement, makes hyponatremia the far more likely proximate cause. (Bleeding should still be excluded with imaging.)</p>\n\n<p><em>Hypomagnesemia</em> \u2014 Magnesium was not measured, so it cannot be identified as the &quot;most likely&quot; cause; the documented severe hyponatremia is the explanatory abnormality.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":40,"stem":"A 32 year old HIV-positive IV drug user is admitted to hospital following a seizure. A CT scan of the head with IV contrast shows two ring-enhancing lesions. Which of the following statements is correct?","options":[{"letter":"A","text":"Neurologic symptoms are extremely unusual as the first manifestation of AIDS."},{"letter":"B","text":"Toxoplasmosis is the most common cause of focal-enhancing lesions on CT scan in HIV-infected patients."},{"letter":"C","text":"Biopsy should be performed on all enhancing lesions in HIV patients."},{"letter":"D","text":"Primary CNS lymphoma is less common in HIV patients than in immunosuppressed transplant patients."}],"correct":"B","explanation":"<p><strong>Why this statement is correct:</strong> In HIV/AIDS (especially with CD4 &lt;100), cerebral toxoplasmosis is the most common cause of focal ring-enhancing brain lesions, with a predilection for the basal ganglia and gray\u2013white junction, and multiple lesions are typical (NIH/OARAC Opportunistic Infection Guidelines, 2026; Gottlieb et al., New England Journal of Medicine, 2020; Van Cauter et al., Neuroradiology, 2020). Standard practice is an empiric anti-toxoplasma trial with reassessment at ~2 weeks rather than upfront biopsy.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><em>Neurologic symptoms extremely unusual as first AIDS manifestation</em> \u2014 False; CNS opportunistic disease is a common initial AIDS-defining presentation.</p>\n\n<p><em>Biopsy should be performed on all enhancing lesions</em> \u2014 False; because of biopsy risk, a presumptive diagnosis with empiric therapy is standard, reserving biopsy for treatment failure or atypical features (NIH/OARAC, 2026).</p>\n\n<p><em>Primary CNS lymphoma less common in HIV than transplant patients</em> \u2014 False; primary CNS lymphoma (EBV-driven) is strongly associated with advanced HIV and is a leading cause of ring-enhancing lesions in this population, alongside toxoplasmosis.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":41,"stem":"With regard to anaerobic bacterial infections, which of the following statements is NOT true?","options":[{"letter":"A","text":"Anaerobic bacteria are common inhabitants of the skin and mucous membranes."},{"letter":"B","text":"Bacteroides species are the most common isolates in anaerobic infections."},{"letter":"C","text":"If appropriate cultures are obtained, anaerobes are found in about 25% of intra-abdominal abscesses."},{"letter":"D","text":"Proper treatment of anaerobic infections consists of drainage, debridement of necrotic material and appropriate antibiotic therapy."}],"correct":"C","explanation":"<p><strong>Why this is the correct answer (i.e., the untrue statement):</strong> When proper anaerobic cultures are obtained, the recovery rate of anaerobes in intra-abdominal/complicated infections is far higher than 25% \u2014 commonly reported at roughly 30\u201380%, and likely underestimated because anaerobes are difficult to culture (Nakashima et al., BMC Infectious Diseases, 2026; Lee et al., Drugs, 2015; Brook and Frazier, Journal of Medical Microbiology, 2000, found mixed aerobic/anaerobic flora in ~74\u201377% of specimens). The &quot;about 25%&quot; figure understates the true prevalence, making the statement false.</p>\n<p><strong>Why the others are incorrect (i.e., they are true statements):</strong></p>\n<p><em>Anaerobes are common inhabitants of skin and mucous membranes</em> \u2014 True; they are dominant components of the normal skin, oral, gut, and genital flora.</p>\n\n<p><em>Bacteroides species are the most common isolates in anaerobic infections</em> \u2014 True; Bacteroides (notably B. fragilis) are the most frequently isolated obligate anaerobes in intra-abdominal infection.</p>\n\n<p><em>Proper treatment consists of drainage, debridement, and appropriate antibiotics</em> \u2014 True; source control (drainage/debridement) plus targeted antimicrobials is the cornerstone of anaerobic infection management.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":42,"stem":"Which of the following characteristics of tetracycline is true?","options":[{"letter":"A","text":"Bacteriocidal."},{"letter":"B","text":"Active against mycobacterium."},{"letter":"C","text":"Discoloration of teeth."},{"letter":"D","text":"Narrow spectrum of activity."}],"correct":"C","explanation":"<p><strong>Why &quot;Discoloration of teeth&quot; is correct:</strong> Tetracyclines are incorporated into calcifying dental tissue and cause permanent yellow-gray-brown tooth discoloration and enamel hypoplasia when given during tooth development (last half of pregnancy through age 8); this is an explicit FDA-label warning (Tetracycline Hydrochloride FDA label; Ravindra et al., Pediatrics/AAP systematic review, 2023).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><em>Bacteriocidal</em> \u2014 Tetracyclines are bacteriostatic, inhibiting protein synthesis by binding the 30S ribosomal subunit (Smilack, Mayo Clinic Proceedings, 1999).</p>\n\n<p><em>Active against mycobacterium</em> \u2014 Not a characteristic use; tetracyclines are not standard antimycobacterial agents.</p>\n\n<p><em>Narrow spectrum of activity</em> \u2014 Incorrect; tetracyclines are broad-spectrum, covering many gram-positive and gram-negative organisms plus atypicals, rickettsiae, chlamydiae, and spirochetes.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":43,"stem":"Bacterial factors may aid the development of surgical site infections. Which of the following statements is NOT correct?","options":[{"letter":"A","text":"A thick polysaccharide capsule around certain bacteria inhibits phagocytosis."},{"letter":"B","text":"Surface components on gram-negative bacteria (endotoxin) can have a toxic effect on Neutrophils."},{"letter":"C","text":"The ability of a microbe to secrete exotoxins may greatly facilitate infection."},{"letter":"D","text":"Staphylococcus epidermidis contaminating a clean surgical incision will usually result in infection."}],"correct":"D","explanation":"<p><strong>Why this is the correct answer (i.e., the untrue statement):</strong> S. epidermidis is a low-virulence skin commensal. Simple contamination of a clean incision does not usually cause infection; clinically significant S. epidermidis infection characteristically requires a foreign body/prosthetic material on which the organism forms biofilm. So the statement that it &quot;will usually result in infection&quot; is false.</p>\n<p><strong>Why the others are incorrect (i.e., they are true statements):</strong></p>\n<p><em>A thick polysaccharide capsule inhibits phagocytosis</em> \u2014 True; encapsulation is a well-established anti-phagocytic virulence mechanism.</p>\n\n<p><em>Gram-negative endotoxin can be toxic to neutrophils</em> \u2014 True; lipopolysaccharide (endotoxin) has toxic and dysregulating effects on host immune cells.</p>\n\n<p><em>Exotoxin secretion may greatly facilitate infection</em> \u2014 True; exotoxins promote tissue invasion and injury, facilitating infection.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":44,"stem":"A 60 year old man is admitted to the ICU for treatment of septic shock following removal of an obstructing right ureteral calculus at cystoscopy. Which of the following treatments is most likely to increase his survival probability?","options":[{"letter":"A","text":"Solucortef 100 mgs IV TID x72 hr."},{"letter":"B","text":"Administration of IL-1 receptor antagonist."},{"letter":"C","text":"Administration of broad-spectrum antibiotics for 5-10 days."},{"letter":"D","text":"Administration of activated protein C."}],"correct":"C","explanation":"<p><strong>Why &quot;broad-spectrum antibiotics&quot; is correct:</strong> With source control already achieved (relief of the obstructing stone), prompt appropriate broad-spectrum antimicrobial therapy is the intervention with a proven survival benefit in septic shock; early appropriate antibiotics are consistently associated with reduced mortality.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><em>Solucortef (hydrocortisone) 100 mg IV TID</em> \u2014 Corticosteroids may reduce time to shock reversal in vasopressor-dependent septic shock but have not reliably improved overall survival and are not the single best survival-improving choice here.</p>\n\n<p><em>IL-1 receptor antagonist</em> \u2014 Anti-inflammatory/anti-mediator strategies of this type have not demonstrated a mortality benefit in unselected sepsis.</p>\n\n<p><em>Administration of activated protein C</em> \u2014 Recombinant human activated protein C (drotrecogin alfa/Xigris) was withdrawn from the market in 2011 after the PROWESS-SHOCK trial showed no mortality benefit; it is no longer available and does not improve survival (Ranieri et al., New England Journal of Medicine, 2012; Weitz et al., CHEST/ACCP, 2012). <em>(Note: this option was likely the intended distractor even at the time; it is now definitively incorrect.)</em></p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":45,"stem":"A 46 year old woman is about to undergo hepatic resection for metastatic carcinoid tumor. During anaesthesia induction, her blood pressure decreases to 80 mmHg systolic and her heart rate increases to 110. Her entire body appears flushed. Her temperature is normal as is end-tidal CO2. Management consists of?","options":[{"letter":"A","text":"Corticosteroids."},{"letter":"B","text":"Octreotide."},{"letter":"C","text":"Abort operation."},{"letter":"D","text":"Dantrolene."}],"correct":"B","explanation":"<p><strong>Why &quot;octreotide&quot; is correct:</strong> The picture \u2014 hypotension, tachycardia, and diffuse flushing on induction/tumor manipulation in a patient with metastatic carcinoid \u2014 is an intraoperative carcinoid crisis from release of vasoactive substances. Octreotide is the disease-specific agent and the only listed option that directly addresses the syndrome (NCCN Neuroendocrine and Adrenal Tumors, 2026).</p>\n<p><em>Important update:</em> Current evidence and guidelines emphasize that intravenous fluids and vasopressors (e.g., phenylephrine/vasopressin) are first-line for the hemodynamic instability of carcinoid crisis and that octreotide administration should not delay them; prophylactic octreotide does not reliably prevent crisis, and one comparative study found vasopressors superior to octreotide as first-line treatment (McCully et al., Annals of Surgical Oncology, 2024; ASCO Guideline, 2025; NCCN, 2026). Octreotide is used adjunctively alongside fluids/vasopressors.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><em>Corticosteroids</em> \u2014 Not the treatment for carcinoid crisis.</p>\n\n<p><em>Abort operation</em> \u2014 Crises are typically managed pharmacologically and hemodynamically; aborting is rarely necessary and is not first-line management.</p>\n\n<p><em>Dantrolene</em> \u2014 Treats malignant hyperthermia, which is excluded here by the normal temperature and normal end-tidal CO2.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":46,"stem":"Which of the following statements concerning tetanus infection is correct?","options":[{"letter":"A","text":"Active immunization with tetanus toxoid is the mainstay of therapy."},{"letter":"B","text":"Generalized toxic convulsions are produced by an exotoxin."},{"letter":"C","text":"Mental confusion is a common finding."},{"letter":"D","text":"Severe local infection is present at the site of injury."}],"correct":"B","explanation":"<p><strong>Why this statement is correct:</strong> Tetanus is caused by tetanospasmin, the exotoxin (tetanus neurotoxin) of Clostridium tetani, which blocks release of inhibitory neurotransmitters and produces the characteristic muscle rigidity and spasms (Yen and Thwaites, Lancet, 2019; Rhinesmith and Fu, AAP, 2018).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><em>Active immunization is the mainstay of therapy</em> \u2014 Tetanus toxoid vaccination is the mainstay of prevention, not of treatment of established disease; treatment centers on wound debridement, antitoxin (human tetanus immune globulin), antibiotics, spasm control (benzodiazepines), and supportive/intensive care.</p>\n\n<p><em>Mental confusion is a common finding</em> \u2014 The sensorium is characteristically clear; tetanus does not typically impair consciousness.</p>\n\n<p><em>Severe local infection is present at the site of injury</em> \u2014 The inciting wound is often trivial or unremarkable; disease results from potent toxin from a small bacterial inoculum, not from severe local infection.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":47,"stem":"Massive blood losses are replaced with packed RBC, fresh frozen plasma and pooled platelets. Cryoprecipitate is sometimes needed to replace losses of?","options":[{"letter":"A","text":"Factor VIII."},{"letter":"B","text":"Von Willebrand's factor."},{"letter":"C","text":"Thrombin."},{"letter":"D","text":"Fibrinogen."}],"correct":"D","explanation":"<p><strong>Why &quot;fibrinogen&quot; is correct:</strong> In massive transfusion, fibrinogen is the first coagulation factor to fall to critically low levels, and cryoprecipitate is the standard concentrated product used to replace it (Cohn and Shaz, JAMA, 2023; Hunt et al., British Journal of Haematology, 2015; Davenport et al./CRYOSTAT-2, JAMA, 2023). This is the clinical reason cryoprecipitate is &quot;sometimes needed&quot; during massive hemorrhage.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><em>Factor VIII</em> \u2014 Cryoprecipitate does contain factor VIII, but in massive transfusion FFP already supplies coagulation factors adequately; the specific indication for adding cryoprecipitate is fibrinogen repletion, not factor VIII.</p>\n\n<p><em>Von Willebrand&#x27;s factor</em> \u2014 Also present in cryoprecipitate, but it is not the reason cryoprecipitate is required during massive transfusion.</p>\n\n<p><em>Thrombin</em> \u2014 Thrombin is generated from prothrombin in the coagulation cascade and is not a component supplied by cryoprecipitate.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":48,"stem":"The most important amino acid used for gluconeogenesis by the liver is?","options":[{"letter":"A","text":"Glutamine."},{"letter":"B","text":"Serine."},{"letter":"C","text":"Alanine."},{"letter":"D","text":"Tyrosine."}],"correct":"C","explanation":"<p><strong>Why &quot;alanine&quot; is correct:</strong> Alanine is the principal amino acid substrate for hepatic gluconeogenesis, delivered from skeletal muscle to the liver via the glucose\u2013alanine (Cahill) cycle; in the liver, alanine is transaminated to pyruvate and used for glucose synthesis (Alvarez-Guaita et al., Journal of Cellular Physiology, 2025; Luczkowska et al., Journal of Biological Chemistry, 2024).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><em>Glutamine</em> \u2014 A major gluconeogenic substrate, but predominantly in the kidney and intestine rather than the liver.</p>\n\n<p><em>Serine</em> \u2014 A glucogenic amino acid, but a minor contributor and not the principal hepatic substrate.</p>\n\n<p><em>Tyrosine</em> \u2014 Only partly glucogenic (also ketogenic) and not a major gluconeogenic substrate.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":49,"stem":"In the management of hemorrhagic shock, the best clinical sign of successful fluid resuscitation is?","options":[{"letter":"A","text":"A increase in blood pressure."},{"letter":"B","text":"An increase in urine output."},{"letter":"C","text":"An increase in arterial oxygenation."},{"letter":"D","text":"A decrease in tachycardia."}],"correct":"B","explanation":"<p><strong>Why &quot;an increase in urine output&quot; is correct:</strong> Urine output (target \u22650.5 mL/kg/h) is the classic bedside marker of restored <em>end-organ</em> perfusion, and normalization of perfusion \u2014 not any single vital sign \u2014 is the goal of resuscitation. Modern resuscitation endpoints emphasize reversal of tissue hypoperfusion, tracked by restored urine output alongside falling lactate and correcting base deficit (Cannon, <em>New England Journal of Medicine</em>, 2018). A prospective trauma RCT explicitly lists urine output &gt;0.5 mL/kg/min among its criteria for successful shock resuscitation (Zhang et al., <em>Trials</em>, 2022).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>A increase in blood pressure:</strong> Blood pressure is an <em>insensitive</em> early marker; robust compensatory vasoconstriction keeps blood pressure near-normal until &gt;30% of blood volume is lost, so it can normalize before perfusion is truly restored and can be transiently raised by fluid without correcting the oxygen debt (Cannon, <em>NEJM</em>, 2018).</p>\n\n<p><strong>An increase in arterial oxygenation:</strong> Arterial oxygenation reflects pulmonary gas exchange, not circulating volume or perfusion, and is not a resuscitation endpoint for hemorrhagic shock.</p>\n\n<p><strong>A decrease in tachycardia:</strong> Heart rate is nonspecific and confounded by pain, anxiety, and catecholamines; it is a supporting trend, not the best single sign of adequate perfusion (Pinsky et al., <em>Critical Care</em>, 2022).</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":50,"stem":"The single most important factor in determining whether to perform a transplant between a specific donor and recipient is?","options":[{"letter":"A","text":"Mixed lymphocyte culture assays of the donor and recipient."},{"letter":"B","text":"HLA type of the donor and recipient."},{"letter":"C","text":"Closeness of the relationship between the donor and recipient."},{"letter":"D","text":"ABO blood types of the donor and recipient."}],"correct":"D","explanation":"<p><strong>Why &quot;ABO blood types&quot; is correct:</strong> ABO compatibility is the fundamental gate for solid-organ transplantation. ABO antigens are expressed on vascular endothelium, so an ABO-incompatible graft triggers preformed isohemagglutinin binding and hyperacute (immediate) rejection with graft thrombosis. Donor and recipient ABO types must therefore be compatible before a transplant proceeds (Igboanusi et al., <em>Scientific Reports</em>, 2024).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>HLA type:</strong> HLA matching strongly influences long-term graft survival and rejection risk and is important, but transplants are routinely and successfully performed across HLA mismatches; HLA compatibility optimizes outcome rather than gating <em>whether</em> a transplant can be done (Wekerle et al., <em>Lancet</em>, 2017).</p>\n\n<p><strong>Mixed lymphocyte culture assays:</strong> A historical research/tissue-typing tool, largely supplanted by molecular HLA typing and crossmatching; not the decisive factor for proceeding.</p>\n\n<p><strong>Closeness of the relationship:</strong> Relatedness raises the probability of HLA sharing but is not itself the determinant; unrelated well-matched donors are used routinely, and a close relative who is ABO-incompatible still cannot donate without special desensitization protocols.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":51,"stem":"In the awake, non-anesthetized patient suspected of having a hemolytic post-transfusion reaction, the most characteristic signs are:","options":[{"letter":"A","text":"Diffuse bleeding and hypotension."},{"letter":"B","text":"Oliguria and hemoglobinuria."},{"letter":"C","text":"Nausea and vomiting."},{"letter":"D","text":"Fever and chills."}],"correct":"B","explanation":"<p><strong>Why &quot;oliguria and hemoglobinuria&quot; is correct:</strong> These are the signs most <em>specific</em> to acute intravascular hemolysis. Complement-mediated lysis of incompatible red cells releases free hemoglobin that overwhelms haptoglobin, producing hemoglobinemia and hemoglobinuria; free heme scavenges nitric oxide and causes renal vasoconstriction and acute tubular necrosis, hence oliguria/renal failure (Panch et al., <em>New England Journal of Medicine</em>, 2019). Reddish urine (hemoglobinuria) is part of the classic diagnostic triad.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>Fever and chills:</strong> These are the most <em>common</em> and often earliest sign (~80% of reactions) but are nonspecific \u2014 they also occur with febrile non-hemolytic reactions and sepsis \u2014 so they are not the most characteristic <em>of hemolysis</em> (Delaney et al., <em>Lancet</em>, 2016).</p>\n\n<p><strong>Diffuse bleeding and hypotension:</strong> This is the classic presentation in the <em>anesthetized</em> patient (DIC and hypotension may be the only clues); the question specifies an awake patient, in whom hemoglobinuria and flank pain dominate.</p>\n\n<p><strong>Nausea and vomiting:</strong> Nonspecific and not characteristic of hemolysis.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":52,"stem":"A 75 year-old woman is admitted to hospital because of acute cholecystitis and treated with broad-spectrum antibiotics. On the 3rd hospital day, her temperature rises to 40\u00b0 and her blood pressure falls to 80/40. Laboratory studies reveal platelet count 49, INR 1.9, PTT 50.3. The most important step in the correction of this patient's coagulopathy is:","options":[{"letter":"A","text":"Administration of fresh frozen plasma."},{"letter":"B","text":"Administration of activated factor VII a."},{"letter":"C","text":"Administration of epsilon-amino caproic acid."},{"letter":"D","text":"Laparotomy."}],"correct":"D","explanation":"<p><strong>Why &quot;laparotomy&quot; is correct:</strong> This is septic shock with disseminated intravascular coagulation (fever, hypotension, thrombocytopenia, prolonged INR/PTT) from an uncontrolled biliary source that has failed antibiotics. The cornerstone of DIC management is treatment of the underlying cause; the coagulopathy will not correct until the septic focus is controlled (Levi et al., <em>British Journal of Haematology</em>, 2009; Hunt, <em>NEJM</em>, 2014). Source control \u2014 operative (cholecystectomy) or drainage (cholecystostomy) \u2014 is therefore the single most important step. Blood-product support is adjunctive and transient without source control (Levi &amp; Scully, <em>Blood</em>, 2018).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>Fresh frozen plasma:</strong> Appropriate only as supportive replacement in a <em>bleeding</em> DIC patient; it does not treat the driver and its effect is fleeting while sepsis continues (Levi et al., 2009).</p>\n\n<p><strong>Activated factor VIIa:</strong> Not indicated for septic DIC; it is prothrombotic and risks worsening microvascular thrombosis with no outcome benefit.</p>\n\n<p><strong>Epsilon-amino caproic acid:</strong> Antifibrinolytics are generally contraindicated in DIC because inhibiting fibrinolysis promotes microvascular thrombosis and organ failure (Levi et al., 2009).</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":53,"stem":"Harmful effects of significant alkalosis following trauma resuscitation or major surgery include all of the following, EXCEPT:","options":[{"letter":"A","text":"Decreased cerebral blood flow."},{"letter":"B","text":"Hypercalcemia."},{"letter":"C","text":"Hypokalemia."},{"letter":"D","text":"Tissue hypoxia."}],"correct":"B","explanation":"<p><strong>Why &quot;hypercalcemia&quot; is the exception (does not occur):</strong> Alkalosis <em>lowers</em> ionized calcium. A rise in pH removes protons from albumin, increasing its negative charge and its binding of calcium, so the free (ionized) fraction falls \u2014 producing hypocalcemia, not hypercalcemia (acute respiratory alkalosis drops ionized calcium ~0.04 mmol/L per 0.1 rise in pH) (Cheng et al., <em>American Academy of Pediatrics</em>, 2023; Krapf et al., <em>Kidney International</em>, 1992). Hypocalcemic tetany is a recognized consequence of alkalosis (Kaye et al., <em>American Journal of Kidney Diseases</em>, 1997).</p>\n<p><strong>Why the others are genuine harmful effects:</strong></p>\n<p><strong>Decreased cerebral blood flow:</strong> Alkalosis (low PaCO\u2082) causes cerebral vasoconstriction and reduced cerebral perfusion.</p>\n\n<p><strong>Hypokalemia:</strong> Alkalosis drives transcellular potassium shift into cells, lowering serum potassium.</p>\n\n<p><strong>Tissue hypoxia:</strong> Alkalosis shifts the oxyhemoglobin dissociation curve leftward, increasing hemoglobin&#x27;s oxygen affinity and impairing oxygen unloading at the tissues.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":54,"stem":"In the acute-phase response to injury or infection, levels of which of the following serum proteins is decreased?","options":[{"letter":"A","text":"C-reactive protein."},{"letter":"B","text":"Fibrinogen."},{"letter":"C","text":"Ceruloplasmin."},{"letter":"D","text":"Albumin."}],"correct":"D","explanation":"<p><strong>Why &quot;albumin&quot; is correct:</strong> Albumin is the prototypical <em>negative</em> acute-phase reactant. During inflammation, hepatic synthesis is reprioritized toward positive reactants, and albumin concentration falls (compounded by increased capillary permeability and catabolism) (Evans et al., ASPEN Position Paper, 2021; Mantovani &amp; Garlanda, <em>New England Journal of Medicine</em>, 2023).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>C-reactive protein:</strong> The archetypal <em>positive</em> acute-phase protein, rising up to ~1000-fold.</p>\n\n<p><strong>Fibrinogen:</strong> A positive acute-phase reactant that increases (contributing to elevated ESR).</p>\n\n<p><strong>Ceruloplasmin:</strong> A positive acute-phase reactant that increases with inflammation.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":55,"stem":"Which of the following statements regarding epithelialization is true?","options":[{"letter":"A","text":"It produces a watertight seal of surgical incisions within 48hr."},{"letter":"B","text":"A re-epithelialized wound develops hair follicles and sweat glands as does normal skin."},{"letter":"C","text":"The process is normally not inhibited by surface contact with other epithelial cells."},{"letter":"D","text":"Disruption of normal healing, such as in a chronic wound, may produce malignancy."}],"correct":"D","explanation":"<p><strong>Why this statement is correct:</strong> Chronic, non-healing wounds and scars can undergo malignant transformation \u2014 a Marjolin ulcer \u2014 most often squamous cell carcinoma (75\u201396% of cases), typically after a long latency (Chong et al., <em>American Journal of Clinical Dermatology</em>, 2023; Khan et al., <em>Advances in Skin &amp; Wound Care</em>, 2020). Persistent injury, repeated failed re-epithelialization, and a chronically inflamed, poorly vascularized bed drive neoplastic change (<em>Archives of Surgery</em>, Image of the Month, 2006).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>Watertight seal within 48 hr:</strong> Overstated \u2014 epithelial migration begins early, but a durable, mature epithelial barrier is not established that quickly; a truly &quot;watertight&quot; seal takes longer than 48 hours.</p>\n\n<p><strong>Develops hair follicles and sweat glands:</strong> False \u2014 re-epithelialized wounds and scars do <em>not</em> regenerate adnexal structures (hair follicles, sweat/sebaceous glands); these are absent in healed scar tissue.</p>\n\n<p><strong>Not inhibited by surface contact:</strong> False \u2014 epithelialization is governed by <em>contact inhibition</em>: migrating keratinocytes stop once they meet advancing cells from the opposite edge, which halts the process when the surface is covered.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":56,"stem":"A 65 year old woman presents to the Emergency Room with a right hip fracture. She is scheduled for open reduction and internal fixation the following day. The orthopedic resident notices that the patient is tachycardic and hyper-reflexic. Blood tests confirm that the patient has hyperthyroidism. The appropriate peri-operative management of this condition is?","options":[{"letter":"A","text":"Close observation in the ICU post-operatively."},{"letter":"B","text":"Begin propylthiouracil and proceed with surgery."},{"letter":"C","text":"Begin beta blockage with propranolol and proceed with surgery."},{"letter":"D","text":"Arrange urgent radio-iodine ablation and proceed with surgery."}],"correct":"C","explanation":"<p><strong>Why &quot;beta blockade with propranolol&quot; is correct:</strong> Hip fracture repair is semi-urgent and should not be delayed for weeks. When a thyrotoxic patient cannot be rendered euthyroid before urgent surgery, the ATA recommends rapid control with \u03b2-adrenergic blockade (plus, ideally, iodide and glucocorticoids) in the immediate preoperative period to blunt the risk of perioperative thyroid storm (Ross et al., 2016 ATA Guidelines; Burch &amp; Cooper, <em>JAMA</em>, 2015). Propranolol both controls adrenergic symptoms (tachycardia) and, at higher doses, inhibits peripheral T4\u2192T3 conversion, and it works within hours (Lee &amp; Pearce, <em>JAMA</em>, 2023).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>Propylthiouracil and proceed:</strong> Antithyroid drugs take days to weeks to achieve euthyroidism; starting PTU alone does not make the patient safe for next-day surgery (though it is a reasonable <em>adjunct</em>).</p>\n\n<p><strong>Radio-iodine ablation and proceed:</strong> RAI acts over weeks to months and can transiently worsen thyrotoxicosis; it is irrelevant to acute perioperative control.</p>\n\n<p><strong>ICU observation post-operatively:</strong> Fails to address the <em>pre</em>- and intra-operative risk of thyroid storm; control must be instituted before surgery, not merely monitored afterward.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":57,"stem":"A 27 year old man is brought to the Emergency Room after being thrown from a motorcycle at high speed. His systolic blood pressure is 60. A chest x-ray shows a widened mediastinum. In addition to appropriate resuscitation, the next step in his management should be:","options":[{"letter":"A","text":"Immediate left thoracotomy."},{"letter":"B","text":"CT thorax."},{"letter":"C","text":"Aortic ach angiogram and possible stenting."},{"letter":"D","text":"Abdominal ultrasound (FAST)."}],"correct":"D","explanation":"<p><strong>Why &quot;FAST&quot; is correct:</strong> A hypotensive trauma patient must first have the source of shock identified at the bedside, and hemorrhagic shock in a patient who survives to the ED is most often due to bleeding into the abdomen, pelvis, or extremities \u2014 not the aorta, which usually causes immediate exsanguination (Pr\u00eatre &amp; Chilcott, <em>NEJM</em>, 1997). FAST is performed within moments of arrival and directs immediate hemorrhage control; a hypotensive patient &quot;does not belong in the CT suite&quot; (King, <em>NEJM</em>, 2019). The widened mediastinum here is a distractor that must not divert attention from an actively bleeding intracavitary source.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>CT thorax:</strong> An unstable, hypotensive patient should not be taken to CT; CT for aortic injury is appropriate only once hemodynamically stabilized (Pr\u00eatre, <em>NEJM</em>, 1997).</p>\n\n<p><strong>Aortic arch angiogram and possible stenting:</strong> Wastes critical time; even if aortic injury is present, a contained injury is managed with impulse (blood-pressure/heart-rate) control while a bleeding abdominal/pelvic source is excluded first.</p>\n\n<p><strong>Immediate left thoracotomy:</strong> Reserved for massive hemothorax or profuse chest-tube output; not indicated as the reflex next step for a widened mediastinum with shock.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":58,"stem":"A 53 year old woman who underwent brain tumour resection four days ago develops left lower extremity pain and swelling. An ultrasound examination demonstrates clot in the femoral popliteal veins on the left. The most appropriate treatment for this is?","options":[{"letter":"A","text":"Begin ambulation and discontinue bed rest."},{"letter":"B","text":"Begin intravenous heparin administration."},{"letter":"C","text":"Use intermittent leg compression and graduated-compression stockings."},{"letter":"D","text":"Place an IVC filter."}],"correct":"B","explanation":"<p><strong>Why &quot;begin intravenous heparin (or LMWH)&quot; is correct:</strong> This is an acute <em>proximal</em> (femoropopliteal) DVT, which requires therapeutic anticoagulation. Although recent craniotomy and a brain tumor are relative bleeding concerns, contemporary evidence supports anticoagulation as first-line for VTE in brain-tumor patients when there is no active intracranial hemorrhage, with LMWH (and increasingly DOACs) preferred over unfractionated heparin in stable patients (Leader et al., <em>Blood</em>, 2024; Schaff &amp; Mellinghoff, <em>JAMA</em>, 2023). In the acute inpatient/emergency setting, heparin is the standard first-line agent (Suarez-Meade et al., <em>Current Oncology Reports</em>, 2022). The card&#x27;s parenthetical (&quot;Lovenox these days&quot;) reflects the shift toward LMWH.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<p><strong>IVC filter:</strong> Reserved for patients with a genuine contraindication to anticoagulation (e.g., active/recent intracranial bleed) or failure of anticoagulation; filters carry a ~30% rate of recurrent VTE and do not treat the existing clot. It is the <em>alternative</em>, not the first choice, absent a contraindication (Suarez-Meade et al., 2022; NCCN Cancer-Associated VTE, 2026).</p>\n\n<p><strong>Ambulation / discontinue bed rest:</strong> Does not treat an acute proximal DVT and leaves the patient at risk of pulmonary embolism.</p>\n\n<p><strong>Intermittent compression and graduated stockings:</strong> These are <em>prophylactic/adjunctive</em> mechanical measures, inadequate as treatment for an established proximal DVT.</p>\n<p><em>Clinical note:</em> If this patient had evidence of postoperative intracranial hemorrhage or another absolute contraindication, an IVC filter would become the appropriate choice \u2014 so the answer hinges on the absence of a bleeding contraindication.</p>","no_key":false,"no_options":false,"free_answer":null}];</script>
<script>
(function(){
  const STORAGE_KEY = 'progress-v1';
  // Namespaced by page title so multiple quiz files hosted/opened together
  // (outside Claude, where window.storage isn't available) don't clobber
  // each other's saved progress in the same browser's localStorage.
  const LOCAL_STORAGE_KEY = 'examquiz-progress:' + (document.title || 'default');
  let state = { answers: {}, flagged: {}, struck: {}, notes: {} }; // answers[num]={selected,correct}; struck[num]={LETTER:true}; notes[num]=string
  let filter = 'all';
  let currentIndex = 0;
  let pendingSelections = {}; // qnum -> letter, chosen but not yet confirmed (session-only)
  let notesSaveTimer = null;
  const BANNER_POPUP_IDS = ['calc-panel', 'settings-panel', 'notes-panel-popup'];

  // Builds a pre-filled link to the bug-report Google Form for a given
  // question, using this page's exam title (its <h1>) and the question
  // number. Configured once per skill in quiz_template.html via
  // window.BUG_REPORT_CONFIG -- see SKILL.md's bug-reporting section.
  // Returns '' (and the caller hides the button) if that config still has
  // its placeholder values, so an unconfigured quiz never ships a broken
  // "Report issue" link that quietly goes nowhere.
  function buildReportUrl(questionNumber) {
    const cfg = window.BUG_REPORT_CONFIG || {};
    if (!cfg.formBaseUrl || cfg.formBaseUrl.indexOf('REPLACE_WITH') === 0) return '';
    const examTitle = (document.querySelector('header.top h1') || {}).textContent || document.title || '';
    try {
      const url = new URL(cfg.formBaseUrl);
      url.searchParams.set('usp', 'pp_url');
      if (cfg.examEntryId) url.searchParams.set(cfg.examEntryId, examTitle.trim());
      if (cfg.questionEntryId) url.searchParams.set(cfg.questionEntryId, String(questionNumber));
      return url.toString();
    } catch (e) {
      return '';
    }
  }

  // Closes every banner popover (calculator, settings, notes) except the
  // one whose panel id is passed in -- keeps the three mutually exclusive
  // without each toggle handler needing to know about the other two by
  // name. Add new banner popovers to BANNER_POPUP_IDS above and they get
  // this behavior for free.
  function closeOtherBannerPopups(exceptPanelId) {
    BANNER_POPUP_IDS.forEach(id => {
      if (id === exceptPanelId) return;
      const el = document.getElementById(id);
      if (el) el.classList.add('hidden');
    });
  }

  const FILTERS = [
    ['all', 'All'],
    ['unanswered', 'Unanswered'],
    ['incorrect', 'Incorrect'],
    ['flagged', 'Flagged'],
  ];

  function questionStatus(q) {
    const a = state.answers[q.number];
    if (!a) return 'unanswered';
    if (q.no_options || q.no_key) return 'nokey-done';
    return a.correct ? 'correct' : 'incorrect';
  }

  function visibleList() {
    return QUIZ_DATA.filter(q => {
      if (filter === 'unanswered') return !state.answers[q.number];
      if (filter === 'incorrect') {
        const a = state.answers[q.number];
        return a && !a.correct && !q.no_options && !q.no_key;
      }
      if (filter === 'flagged') return !!state.flagged[q.number];
      return true;
    });
  }

  function renderFilters() {
    const el = document.getElementById('filter-tabs');
    el.innerHTML = '';
    FILTERS.forEach(([key, label]) => {
      const b = document.createElement('button');
      b.textContent = label;
      if (filter === key) b.classList.add('active');
      b.onclick = () => { filter = key; currentIndex = 0; renderAll(); };
      el.appendChild(b);
    });
  }

  function renderGrid() {
    const grid = document.getElementById('qgrid');
    grid.innerHTML = '';
    const list = visibleList();
    if (list.length === 0) {
      const empty = document.createElement('div');
      empty.style.gridColumn = '1 / -1';
      empty.style.color = 'var(--muted)';
      empty.style.fontSize = '12.5px';
      empty.style.textAlign = 'center';
      empty.style.padding = '10px 0';
      empty.textContent = 'No questions here.';
      grid.appendChild(empty);
      return;
    }
    list.forEach((q, i) => {
      const b = document.createElement('button');
      b.textContent = q.number;
      const status = questionStatus(q);
      if (status !== 'unanswered') b.classList.add(status);
      if (i === currentIndex) b.classList.add('current');
      if (state.flagged[q.number]) {
        const dot = document.createElement('span');
        dot.className = 'flagdot';
        b.appendChild(dot);
      }
      b.onclick = () => { currentIndex = i; renderAll(); scrollToTop(); };
      grid.appendChild(b);
    });
  }

  function renderStats() {
    const answeredNums = Object.keys(state.answers);
    const gradable = answeredNums.filter(n => {
      const q = QUIZ_DATA.find(x => x.number == n);
      return q && !q.no_options && !q.no_key;
    });
    const correctCount = gradable.filter(n => state.answers[n].correct).length;
    document.getElementById('stat-answered').textContent = answeredNums.length;
    document.getElementById('stat-correct').textContent = correctCount;
    document.getElementById('stat-pct').textContent = gradable.length
      ? Math.round(100 * correctCount / gradable.length) + '%'
      : '—';
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderPanel() {
    const panel = document.getElementById('qpanel');
    const list = visibleList();
    if (list.length === 0) {
      panel.innerHTML = '<div class="empty-state">Nothing to show for this filter. Try a different tab on the left.</div>';
      return;
    }
    if (currentIndex >= list.length) currentIndex = list.length - 1;
    const q = list[currentIndex];
    const answer = state.answers[q.number];
    const flagged = !!state.flagged[q.number];
    const pending = pendingSelections[q.number]; // letter picked but not confirmed yet

    let html = '';
    html += '<div class="qmeta">';
    html += '<div class="qnum">Question ' + q.number + '</div>';
    html += '<div class="qmeta-actions">';
    html += '<button class="flag-toggle ' + (flagged ? 'on' : '') + '" id="flag-btn">' + (flagged ? '&#9873; Flagged' : '&#9872; Flag for review') + '</button>';
    const reportUrl = buildReportUrl(q.number);
    if (reportUrl) {
      html += '<a class="report-btn" id="report-btn" href="' + reportUrl + '" target="_blank" rel="noopener">&#128027; Report issue</a>';
    }
    html += '</div>';
    html += '</div>';
    html += '<div class="stem">' + escapeHtml(q.stem) + '</div>';

    if (q.no_options) {
      if (!answer) {
        html += '<div class="noopts-box">This question\'s original answer choices weren\'t fully captured in the source material — only the key fact is available.</div>';
        html += '<button class="reveal-btn" id="reveal-btn">Reveal answer</button>';
      } else {
        html += '<div class="explain">';
        html += '<div class="verdict nokey">Key fact</div>';
        html += '<div class="explain-body"><p><strong>' + escapeHtml(q.free_answer || '') + '</strong></p>' + q.explanation + '</div>';
        html += '</div>';
      }
    } else if (q.options) {
      html += '<div class="options">';
      q.options.forEach(opt => {
        const struck = !answer && !!(state.struck[q.number] && state.struck[q.number][opt.letter]);
        let cls = 'opt';
        if (answer) {
          cls += ' locked';
          if (opt.letter === q.correct) cls += ' correct-answer';
          else if (opt.letter === answer.selected) cls += ' wrong-answer';
          if (opt.letter === answer.selected) cls += ' selected';
        } else if (struck) {
          cls += ' struck';
        } else if (pending === opt.letter) {
          cls += ' pending-selected';
        }
        html += '<div class="opt-row">';
        html += '<button class="' + cls + '" data-letter="' + opt.letter + '"' + (struck ? ' disabled' : '') + '>';
        html += '<span class="letter">' + opt.letter + '</span>';
        html += '<span class="text">' + escapeHtml(opt.text) + '</span>';
        html += '</button>';
        if (!answer) {
          html += '<button class="strike-btn ' + (struck ? 'active' : '') + '" data-strike-letter="' + opt.letter + '" title="Cross out this option">&#9587;</button>';
        }
        html += '</div>';
      });
      html += '</div>';

      if (!answer) {
        html += '<button class="confirm-btn" id="confirm-btn" ' + (pending ? '' : 'disabled') + '>Confirm answer</button>';
      }

      if (answer) {
        html += '<div class="explain">';
        if (q.no_key) {
          html += '<div class="verdict nokey">Reviewed</div>';
          html += '<div class="nokey-note">No answer key was available for this question in the source material, so it isn\'t graded — use it for your own review.</div>';
        } else {
          html += '<div class="verdict ' + (answer.correct ? 'correct' : 'incorrect') + '">' + (answer.correct ? '✓ Correct' : '✗ Incorrect — correct answer is ' + q.correct) + (answer.emoji ? ' <span class="verdict-emoji">' + answer.emoji + '</span>' : '') + '</div>';
        }
        html += '<div class="explain-body">' + q.explanation + '</div>';
        html += '</div>';
      }
    }

    html += '<div class="footer-nav">';
    html += '<button class="navbtn" id="prev-btn" ' + (currentIndex === 0 ? 'disabled' : '') + '>&larr; Previous</button>';
    html += '<div class="position">Position ' + (currentIndex + 1) + ' of ' + list.length + '</div>';
    html += '<button class="navbtn primary" id="next-btn" ' + (currentIndex === list.length - 1 ? 'disabled' : '') + '>Next &rarr;</button>';
    html += '</div>';

    panel.innerHTML = html;

    if (!answer && q.options) {
      panel.querySelectorAll('.opt:not(.struck)').forEach(btn => {
        btn.onclick = () => {
          pendingSelections[q.number] = btn.getAttribute('data-letter');
          renderPanel(); // just re-render the panel, no need to touch grid/stats for a pending pick
        };
      });
      panel.querySelectorAll('.strike-btn').forEach(btn => {
        btn.onclick = () => toggleStrike(q.number, btn.getAttribute('data-strike-letter'));
      });
      const cb = document.getElementById('confirm-btn');
      if (cb) cb.onclick = () => {
        if (pendingSelections[q.number]) confirmAnswer(q, pendingSelections[q.number]);
      };
    }
    if (q.no_options) {
      const rb = document.getElementById('reveal-btn');
      if (rb) rb.onclick = () => confirmAnswer(q, null);
    }
    document.getElementById('flag-btn').onclick = () => toggleFlag(q.number);
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    if (prevBtn) prevBtn.onclick = () => { if (currentIndex > 0) { currentIndex--; renderAll(); scrollToTop(); } };
    if (nextBtn) nextBtn.onclick = () => { const l = visibleList(); if (currentIndex < l.length - 1) { currentIndex++; renderAll(); scrollToTop(); } };
  }

  const CELEBRATE_EMOJIS = ['🎉', '🌟', '✨', '🙌', '🎊', '👏', '💪', '🥳'];
  const SAD_EMOJIS = ['🥲', '😿', '🫠', '🙈', '🥺', '😢'];

  function pickEmoji(correct) {
    const arr = correct ? CELEBRATE_EMOJIS : SAD_EMOJIS;
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function confirmAnswer(q, letter) {
    const correct = q.no_options ? true : (letter === q.correct);
    const graded = !q.no_options && !q.no_key; // only genuinely-scored answers get a reaction emoji
    state.answers[q.number] = {
      selected: letter,
      correct: correct,
      emoji: graded ? pickEmoji(correct) : null,
    };
    delete pendingSelections[q.number];
    saveProgress();
    renderAll();
  }

  function toggleStrike(num, letter) {
    if (!state.struck[num]) state.struck[num] = {};
    if (state.struck[num][letter]) {
      delete state.struck[num][letter];
    } else {
      state.struck[num][letter] = true;
      if (pendingSelections[num] === letter) delete pendingSelections[num];
    }
    saveProgress();
    renderPanel();
  }

  function toggleFlag(num) {
    if (state.flagged[num]) delete state.flagged[num];
    else state.flagged[num] = true;
    saveProgress();
    renderAll();
  }

  async function saveProgress() {
    const payload = JSON.stringify(state);
    let savedViaClaude = false;
    try {
      if (window.storage) {
        await window.storage.set(STORAGE_KEY, payload, false);
        savedViaClaude = true;
      }
    } catch (e) {
      // window.storage can be flaky/transient in some sessions -- fall through
      // to the localStorage backup below rather than treating this as fatal.
    }
    if (savedViaClaude) return;
    try {
      localStorage.setItem(LOCAL_STORAGE_KEY, payload);
    } catch (e) {
      // Only genuinely worth surfacing if BOTH save paths failed -- otherwise
      // this is just noise, since the other path already has the data safe.
