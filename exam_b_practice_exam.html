<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2015 Practice Exam B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F5F3;
    --surface: #FFFFFF;
    --ink: #1B2430;
    --muted: #64707D;
    --border: #DFE3E0;
    --accent: #3B7DD8;
    --accent-dark: #2A5DA8;
    --accent-tint: #EAF1FB;
    --correct: #1E8A5F;
    --correct-bg: #E7F5EE;
    --correct-border: #A9DDC4;
    --incorrect: #BF3F27;
    --incorrect-bg: #FBEAE5;
    --incorrect-border: #EFB7A8;
    --flag: #B9821A;
    --flag-bg: #FCF1DC;
    --flag-border: #ECD9AC;
    --nokey: #7C6FB0;
    --nokey-bg: #EFEBFA;
    --nokey-border: #D6CDEE;
    --explain-text: #384250;
    --claude-orange: #3B7DD8;
    --claude-orange-dark: #2A5DA8;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(27,36,48,0.06), 0 4px 14px rgba(27,36,48,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181B;
      --surface: #1E2226;
      --ink: #E8EAEC;
      --muted: #97A1A9;
      --border: #333A40;
      --accent: #5B9AE6;
      --accent-dark: #3B7DD8;
      --accent-tint: #1B2A3D;
      --correct: #58D399;
      --correct-bg: #17301F;
      --correct-border: #2D5238;
      --incorrect: #F0876D;
      --incorrect-bg: #3A211B;
      --incorrect-border: #62362A;
      --flag: #E3B04B;
      --flag-bg: #362C15;
      --flag-border: #5B4A24;
      --nokey: #BBA9F5;
      --nokey-bg: #2A2440;
      --nokey-border: #453B66;
      --explain-text: #C7CDD3;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
    }
  }
  /* Explicit user override (Settings menu), regardless of system preference */
  :root[data-theme="dark"] {
    --bg: #15181B;
    --surface: #1E2226;
    --ink: #E8EAEC;
    --muted: #97A1A9;
    --border: #333A40;
    --accent: #5B9AE6;
    --accent-dark: #3B7DD8;
    --accent-tint: #1B2A3D;
    --correct: #58D399;
    --correct-bg: #17301F;
    --correct-border: #2D5238;
    --incorrect: #F0876D;
    --incorrect-bg: #3A211B;
    --incorrect-border: #62362A;
    --flag: #E3B04B;
    --flag-bg: #362C15;
    --flag-border: #5B4A24;
    --nokey: #BBA9F5;
    --nokey-bg: #2A2440;
    --nokey-border: #453B66;
    --explain-text: #C7CDD3;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  /* Explicit full-viewport backdrop, independent of document/content height
     or the host page's own background. Covers overscroll/bounce areas on
     iOS and any gap if the rendered content is shorter than the viewport,
     both of which can otherwise reveal the host app's own background
     color showing through instead of ours. Always in sync with the
     current theme since it references the same live CSS variable. */
  .bg-fill {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: -1;
  }
  #app {
    max-width: 1180px;
    margin: 0 auto;
    padding: 20px 20px 60px;
  }
  .cw-banner {
    background: linear-gradient(135deg, var(--claude-orange), var(--claude-orange-dark));
    color: #fff;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Inter', sans-serif;
  }
  .cw-banner-inner {
    max-width: 1180px;
    margin: 0 auto;
    width: 100%;
    display: grid;
    grid-template-columns: auto 1fr auto;
    grid-template-areas: "brand score settings";
    align-items: center;
    gap: 14px;
  }
  @media (max-width: 640px) {
    .cw-banner-inner {
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "brand settings"
        "score score";
      row-gap: 10px;
    }
    /* 3 icon buttons (notes/calculator/settings) plus the full brand
       cluster (bone + "All Quizzes" pill + "OrthoWorld" title) cannot
       both fit on one row at real phone widths (~375-430px) -- confirmed
       overflowing off the right edge of the viewport at 390px wide, with
       the calculator/settings icons partly or fully cut off. Dropping
       the "OrthoWorld" text here is the fix: the bone icon + home-link
       pill still clearly brand the page (and the domain itself is
       visible in the browser chrome), and it frees enough width that
       the icon row no longer needs to shrink itself to compensate. If
       you ever add a 4th banner icon, re-measure at 375px/390px again
       before assuming this still fits -- don't just eyeball it at
       desktop width.  */
    .cw-banner-title { display: none; }
  }
  .cw-brand {
    grid-area: brand;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cw-home-link {
    color: #fff;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    background: rgba(255,255,255,0.16);
    border-radius: 999px;
    padding: 5px 12px;
    white-space: nowrap;
  }
  .cw-home-link:hover { background: rgba(255,255,255,0.28); }
  .cw-banner-score {
    grid-area: score;
    display: flex;
    justify-content: center;
    min-width: 0;
  }
  .cw-banner-icon {
    flex: 0 0 30px;
    width: 30px;
    height: 30px;
  }
  .cw-banner-title {
    font-weight: 700;
    font-size: 1.4667rem;
    letter-spacing: -0.01em;
  }
  .cw-icons {
    grid-area: settings;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cw-settings { position: relative; }
  .cw-calc { position: relative; }
  .cw-notes { position: relative; }
  .settings-gear {
    background: rgba(255,255,255,0.16);
    border: none;
    border-radius: 8px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
  }
  .settings-gear:hover { background: rgba(255,255,255,0.26); }
  .settings-panel {
    position: absolute;
    top: 42px;
    right: 0;
    width: 264px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    padding: 14px;
    z-index: 20;
    color: var(--ink);
  }
  .settings-panel.hidden { display: none; }
  .calc-panel { width: 224px; }
  .notes-popup-panel { width: 280px; }
  .calc-display {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    text-align: right;
    font-family: 'Source Serif 4', serif;
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--ink);
    overflow-x: auto;
    white-space: nowrap;
  }
  .calc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 10px;
  }
  .calc-btn {
    height: 40px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .calc-btn:hover { border-color: var(--accent); }
  .calc-op { background: var(--accent-tint); color: var(--accent-dark); }
  .calc-zero { grid-column: span 2; }
  .calc-equals { background: var(--accent); color: #fff; border-color: var(--accent); }
  .calc-equals:hover { background: var(--accent-dark); }
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .settings-row + .settings-row { margin-top: 14px; }
  .settings-label {
    font-size: 0.8667rem;
    font-weight: 600;
    color: var(--muted);
  }
  .settings-stepper {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .settings-stepper button {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: inherit;
  }
  .settings-stepper button:hover { border-color: var(--accent); color: var(--accent-dark); }
  #font-pct {
    font-size: 0.8rem;
    color: var(--muted);
    min-width: 34px;
    text-align: center;
  }
  .settings-seg {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
  }
  .settings-seg button {
    background: var(--bg);
    border: none;
    border-left: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.7333rem;
    font-weight: 600;
    padding: 5px 7px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .settings-seg button:first-child { border-left: none; }
  .settings-seg button.active { background: var(--accent); color: #fff; }
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 28px;
  }
  header.top h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 1.4rem;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header.top .sub {
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.55;
    margin-top: 6px;
  }
  .score-pill {
    display: flex;
    align-items: center;
    gap: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: 999px;
    padding: 8px 20px;
    box-shadow: var(--shadow);
  }
  .score-pill .stat { text-align: center; }
  .score-pill .stat .num { font-size: 1.1333rem; font-weight: 700; font-family: 'Source Serif 4', serif; }
  .score-pill .stat .lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .score-pill .divider { width: 1px; height: 26px; background: var(--border); }

  .layout {
    display: grid;
    grid-template-columns: 264px 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .nav-panel { order: 2; position: static; }
    .qgrid { grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); }
  }
  @media (max-width: 480px) {
    #app { padding: 14px 14px 40px; }
    header.top h1 { font-size: 1.4rem; }
    header.top { margin-bottom: 22px; gap: 16px; }
    .score-pill { padding: 7px 14px; gap: 12px; }
    .score-pill .stat .num { font-size: 1rem; }
    .score-pill .divider { height: 22px; }
    .qpanel { padding: 18px 16px 16px; min-height: 0; }
    .stem { font-size: 1.1333rem; margin-bottom: 16px; }
    .opt { padding: 11px 12px; font-size: 0.9667rem; }
    .strike-btn { flex-basis: 30px; }
    .confirm-btn { width: 100%; text-align: center; }
    .footer-nav { margin-top: 18px; padding-top: 12px; }
    .navbtn { padding: 9px 14px; font-size: 0.8667rem; }
    .position { font-size: 0.8rem; }
  }

  .nav-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    position: sticky;
    top: 16px;
    box-shadow: var(--shadow);
  }
  .notes-panel-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .notes-panel-title .grid-label { margin-bottom: 0; }
  .notes-qnum {
    font-size: 0.75rem;
    color: var(--muted);
    font-weight: 600;
  }
  .notes-textarea {
    width: 100%;
    min-height: 220px;
    resize: vertical;
    box-sizing: border-box;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
  }
  .notes-textarea:focus { outline: none; border-color: var(--accent); }
  .notes-hint {
    margin-top: 8px;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .filter-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .filter-tabs button {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 600;
    padding: 5px 9px;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
  }
  .filter-tabs button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .grid-label {
    font-size: 0.7333rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .qgrid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    max-height: 360px;
    overflow-y: auto;
    padding-right: 14px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .qgrid::-webkit-scrollbar { width: 8px; }
  .qgrid::-webkit-scrollbar-track { background: transparent; }
  .qgrid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .qgrid::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  .qgrid button {
    aspect-ratio: 1;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    position: relative;
    padding: 0;
  }
  .qgrid button.current { box-shadow: inset 0 0 0 2px var(--accent-dark); }
  .qgrid button.correct { background: var(--correct-bg); border-color: var(--correct-border); color: var(--correct); }
  .qgrid button.incorrect { background: var(--incorrect-bg); border-color: var(--incorrect-border); color: var(--incorrect); }
  .qgrid button.nokey-done { background: var(--nokey-bg); border-color: var(--nokey-border); color: var(--nokey); }
  .qgrid button .flagdot {
    position: absolute; top: 2px; right: 2px;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--flag);
  }
  .legend {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 0.7667rem;
    color: var(--muted);
  }
  .legend span.sw { display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:6px; vertical-align: -1px;}
  .reset-btn {
    margin-top: 14px;
    width: 100%;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.8rem;
    padding: 7px;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
  }
  .reset-btn:hover { color: var(--incorrect); border-color: var(--incorrect-border); }

  .qpanel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 26px 28px 22px;
    box-shadow: var(--shadow);
    min-height: 420px;
  }
  .qmeta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .qmeta .qnum {
    font-size: 0.8333rem;
    font-weight: 700;
    color: var(--accent-dark);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .flag-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid var(--border);
    padding: 5px 11px;
    border-radius: 7px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
  }
  .flag-toggle.on {
    background: var(--flag-bg);
    border-color: var(--flag-border);
    color: var(--flag);
  }
  .stem {
    font-family: 'Source Serif 4', serif;
    font-size: 1.2667rem;
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .options { display: flex; flex-direction: column; gap: 9px; }
  .opt-row { display: flex; align-items: stretch; gap: 8px; }
  .opt-row .opt { flex: 1; }
  .strike-btn {
    flex: 0 0 34px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    border-radius: 8px;
    cursor: pointer;
    color: var(--muted);
    font-size: 0.8667rem;
    font-weight: 600;
    font-family: inherit;
  }
  .strike-btn:hover { border-color: var(--muted); color: var(--ink); }
  .strike-btn.active { background: var(--ink); border-color: var(--ink); color: #fff; }
  .opt {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    text-align: left;
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    font-family: inherit;
    font-size: 1rem;
    color: var(--ink);
    transition: border-color .12s, background .12s;
  }
  .opt:hover:not(.locked):not(.struck) { border-color: var(--accent); background: var(--accent-tint); }
  .opt .letter {
    flex: 0 0 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.8333rem;
    color: var(--muted);
  }
  .opt .text { padding-top: 2px; }
  .opt.selected .letter { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opt.correct-answer { border-color: var(--correct-border); background: var(--correct-bg); }
  .opt.correct-answer .letter { background: var(--correct); border-color: var(--correct); color: #fff; }
  .opt.wrong-answer { border-color: var(--incorrect-border); background: var(--incorrect-bg); }
  .opt.wrong-answer .letter { background: var(--incorrect); border-color: var(--incorrect); color: #fff; }
  .opt.locked { cursor: default; }
  .opt.struck { cursor: default; background: var(--bg); opacity: 0.6; }
  .opt.struck .text { text-decoration: line-through; }
  .opt.pending-selected { border-color: var(--accent); background: var(--accent-tint); }
  .opt.pending-selected .letter { background: var(--accent); border-color: var(--accent); color: #fff; }

  .confirm-btn {
    margin-top: 6px;
    align-self: flex-start;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
  }
  .confirm-btn:hover:not(:disabled) { background: var(--accent-dark); }
  .confirm-btn:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
  }

  .noopts-box {
    background: var(--nokey-bg);
    border: 1px solid var(--nokey-border);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 0.9333rem;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .reveal-btn {
    margin-top: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
  }

  .explain {
    margin-top: 20px;
    border-top: 1px solid var(--border);
    padding-top: 18px;
    animation: fadein .15s ease-in;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px);} to { opacity:1; transform: translateY(0);} }
  .verdict {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .verdict.correct { background: var(--correct-bg); color: var(--correct); }
  .verdict.incorrect { background: var(--incorrect-bg); color: var(--incorrect); }
  .verdict.nokey { background: var(--nokey-bg); color: var(--nokey); }
  .verdict-emoji { font-size: 1rem; margin-left: 2px; }
  .explain-body { font-size: 0.9667rem; color: var(--explain-text); }
  .explain-body p { margin: 0 0 10px; }
  .explain-body ul { margin: 0 0 10px; padding-left: 20px; }
  .explain-body li { margin-bottom: 6px; }
  .explain-body strong { color: var(--ink); }

<script>
const QUIZ_DATA = [{"number":1,"stem":"You are asked to see a previously healthy 90 year old man who developed severe abdominal pain and has free air under the diaphragm. CT scan of the abdomen suggests a perforated duodenal ulcer as the cause. You think he needs an exploratory laparotomy. After you explain the procedure in detail the patient politely declines surgery as he feels that \"god will heal him\". The next most appropriate step is:","options":[{"letter":"A","text":"Take the patient to the operating room against his will."},{"letter":"B","text":"Contact the patient's family and discuss the situation."},{"letter":"C","text":"Formally assess the patient's competency."},{"letter":"D","text":"Change the patient to comfort focused care."}],"correct":"C","explanation":"<p>Correct: A refusal of life-saving surgery that rests on a belief that &quot;god will heal him&quot; should prompt a formal capacity assessment before the refusal is accepted. Capacity requires that the patient understands the diagnosis, the proposed treatment and its risks/benefits, the consequences of refusal, and can reason and communicate a consistent choice. If capacity is intact, the refusal must be honored; if not, a substitute decision-maker is engaged. Assessing capacity is the necessary next step that determines every subsequent action.</p>\n\n<p>a) Wrong: Operating on a competent adult who refuses is battery. Whether surgery can proceed depends entirely on the capacity determination, which has not yet been made.</p>\n\n<p>b) Wrong: The family is only relevant if the patient lacks capacity (as substitute decision-makers). It is premature and does not respect the patient&#x27;s own decision if he is competent.</p>\n\n<p>d) Wrong: Comfort-focused care is a legitimate pathway only after capacity is confirmed and the patient makes an informed choice; converting to comfort care now skips the capacity assessment.</p>\n\n<p>Background: Contrast this with Q8, where the patient clearly demonstrates understanding \u2014 there the principle illustrated is autonomy, and no formal capacity testing is triggered. Here the stated reasoning raises doubt about understanding, so capacity must be evaluated first.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":2,"stem":"Which of the following regarding tranexamic acid is FALSE?","options":[{"letter":"A","text":"It is accepted treatment for heavy menstrual bleeding."},{"letter":"B","text":"Use during orthopedic spinal surgery has been shown to decrease blood transfusions."},{"letter":"C","text":"DVT 6 months prior is not a contraindication to IV administration."},{"letter":"D","text":"Administration within 3 hours of traumatic injury is of benefit in patients with hemorrhage."}],"correct":"C","explanation":"<p>Correct: The FDA label lists active thromboembolic disease and a history of thrombosis or thromboembolism (e.g., DVT, PE) as contraindications to tranexamic acid; a recent DVT therefore is a labeled contraindication, making statement (c) false (US FDA Tranexamic Acid label, Contraindications). The exam&#x27;s parenthetical rule (DVT/PE \u226412 months as a contraindication) reflects this.</p>\n\n<p>a) True: Tranexamic acid is FDA-approved for cyclic heavy menstrual bleeding (US FDA Tranexamic Acid label).</p>\n\n<p>b) True: TXA reduces transfusion in spine and other orthopedic surgery (Park et al., JAMA Surgery, 2025).</p>\n\n<p>d) True: In trauma, TXA given within 3 hours reduces bleeding-related mortality (CRASH-2, cited in Delgado et al., JAMA Surgery, 2025).</p>\n\n<p>Background note: Contemporary meta-analytic evidence (Taeuber et al., JAMA Surgery, 2021; and large arthroplasty cohorts) shows no increased thromboembolic risk with IV TXA, even in patients with prior thromboembolism, and many now argue a history of thrombosis alone should not preclude use. Nonetheless, the drug label still lists it as a contraindication, so (c) remains the intended &quot;false&quot; statement.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":3,"stem":"The treatment priority for necrotizing soft tissue infections at the time of diagnosis is:","options":[{"letter":"A","text":"Hyperbaric oxygen."},{"letter":"B","text":"Debridement of all necrotic tissue."},{"letter":"C","text":"IV immunoglobulin to bind the bacterial toxin."},{"letter":"D","text":"Imaging prior to operation to determine extent of tissue involvement."}],"correct":"B","explanation":"<p>Correct: Prompt, aggressive surgical debridement of all necrotic tissue is the primary therapeutic modality and the single intervention most associated with survival; broad-spectrum antibiotics are started concurrently but do not substitute for source control (Stevens et al., IDSA Skin and Soft Tissue Infection Guidelines, 2014).</p>\n\n<p>a) Wrong: Hyperbaric oxygen is at most an unproven adjunct and must never delay operative debridement.</p>\n\n<p>c) Wrong: IVIG is only a possible adjunct in streptococcal toxic shock; it is not the priority and does not achieve source control.</p>\n\n<p>d) Wrong: Necrotizing infection is a clinical/surgical diagnosis; waiting for imaging delays the life-saving operation. Surgical exploration remains the gold standard (Stevens &amp; Bryant, NEJM, 2017).</p>\n\n<p>Background: Patients typically return to the OR at 24\u201336 hours for repeat debridement until no further necrosis is found.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":4,"stem":"Which medication dosage cannot be given safely to a 5 yo, 15 kg boy, with no known personal or familial allergies, after tonsillectomy at home?","options":[{"letter":"A","text":"Acetaminophen 225 mg po Q4H prn."},{"letter":"B","text":"Dimenhydranate (ex: Gravol \u00a9) 15 mg po Q6H prn."},{"letter":"C","text":"Morphine 1.5 mg po Q4H prn."},{"letter":"D","text":"Codeine 7.5 mg po Q4H prn."},{"letter":"E","text":"Cephalexin (ex: Keflex\u00a9) 500 mg po Q8H."}],"correct":"D","explanation":"<p>Correct: The FDA issued a boxed warning and contraindication against codeine for pain after tonsillectomy/adenoidectomy in children because CYP2D6 ultra-rapid metabolizers convert codeine to morphine unpredictably, causing fatal respiratory depression (Mitchell et al., AAO-HNS Tonsillectomy Guideline, 2019; Kelley-Quon et al., JAMA Surgery, 2021). It cannot be given safely regardless of the calculated dose.</p>\n\n<p>a) Safe: Acetaminophen 225 mg \u2248 15 mg/kg, an appropriate weight-based dose; acetaminophen \u00b1 ibuprofen is first-line.</p>\n\n<p>b) Safe: Dimenhydrinate ~1 mg/kg is within antiemetic dosing.</p>\n\n<p>c) Safe: Morphine 1.5 mg (0.1 mg/kg) is a reasonable oral dose if an opioid is needed; unlike codeine it has a predictable effect (though opioids should be used sparingly post-tonsillectomy).</p>\n\n<p>e) Safe: Cephalexin dosing is not the intended trap; the definitive unsafe choice is codeine due to the contraindication.</p>\n\n<p>Background: The contraindication is strongest in children &lt;12 years and in those with OSA (a common tonsillectomy indication) (Mitchell et al., 2019).</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":5,"stem":"According to the Parkland formula, what intravenous fluids are required for a 70 kg patient who has second degree burns on his back and posterior side of both lower limbs?","options":[{"letter":"A","text":"Lactated Ringers 4cc x 70kg x 36% over 24h."},{"letter":"B","text":"Lactated Ringers 4cc x 70kg x 18% over 8h."},{"letter":"C","text":"Lactated Ringers 2 cc x 70kg x 18% over 24h."},{"letter":"D","text":"NSD5% (D5NS) 4 cc x 70kg x 36% over 24h."}],"correct":"A","explanation":"<p>Correct: By the rule of nines, the entire back = 18% and the posterior surface of both legs = 18% (9% each), totaling 36% TBSA. Parkland = 4 mL \u00d7 weight (kg) \u00d7 %TBSA of lactated Ringer&#x27;s over 24 hours, with half in the first 8 hours (Greenhalgh, NEJM, 2019).</p>\n\n<p>b) Wrong: Uses 18% (only one region) and compresses the whole calculation into 8 hours.</p>\n\n<p>c) Wrong: Uses the modified Brooke coefficient (2 mL) and the wrong TBSA (18%).</p>\n\n<p>d) Wrong: Crystalloid should be lactated Ringer&#x27;s, not D5NS; dextrose-containing fluid is not used for primary burn resuscitation.</p>\n\n<p>Background: Formula-derived volume is only the starting rate; titrate to urine output 0.5 mL/kg/h in adults (Greenhalgh, NEJM, 2019). The ABA now endorses starting at 2 mL/kg/%TBSA to limit &quot;fluid creep,&quot; but the classic Parkland coefficient tested here is 4 mL.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":6,"stem":"What is the initial management of a trauma patient presenting with stable vital signs and a Glasgow coma score at 8?","options":[{"letter":"A","text":"Elevate the head at 30 degrees."},{"letter":"B","text":"Give 3% saline bolus."},{"letter":"C","text":"Procede with endotracheal intubation."},{"letter":"D","text":"Do a brain CT scan."}],"correct":"C","explanation":"<p>Correct: ATLS and EAST teach that a GCS \u22648 mandates a definitive airway for airway protection and to prevent secondary brain injury (Hatchimonji et al., Eur J Trauma Emerg Surg, 2021; Rossaint et al., European trauma bleeding guideline 6th ed., Recommendation 3, 2023). Airway (A) precedes circulation and diagnostics.</p>\n\n<p>a) Wrong: Head elevation is an ICP adjunct, not the initial airway priority.</p>\n\n<p>b) Wrong: Hypertonic saline treats raised ICP/herniation, not the immediate airway.</p>\n\n<p>d) Wrong: CT identifies the lesion but must not precede securing the airway in an obtunded patient.</p>\n\n<p>Background: &quot;GCS \u22648, intubate&quot; is the classic teaching. Some recent observational data question a strict cutoff, but current guidelines still recommend intubation at GCS \u22648.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":7,"stem":"Which of the following are thought to contribute to coagulopathy in patients who have a massive transfusion of packed red blood cells?","options":[{"letter":"A","text":"Increase in fibrinogen."},{"letter":"B","text":"Decreased blood viscosity."},{"letter":"C","text":"Hyperkalemia."},{"letter":"D","text":"Decreased platelets."}],"correct":"D","explanation":"<p>Correct: Massive transfusion of packed cells causes dilutional thrombocytopenia (and dilution/consumption of clotting factors), a major driver of coagulopathy.</p>\n\n<p>a) Wrong: Fibrinogen falls (is consumed/diluted), it does not rise; hypofibrinogenemia contributes to bleeding.</p>\n\n<p>b) Wrong: Decreased viscosity is not a recognized mechanism of coagulopathy.</p>\n\n<p>c) Wrong: Hyperkalemia does occur with stored blood but is not considered a cause of coagulopathy (as the exam note states).</p>\n\n<p>Background: This links to the trauma &quot;lethal triad&quot; (Q18): hypothermia and acidosis from massive resuscitation further impair clotting.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":8,"stem":"You are asked to see a 99-year-old man with metastatic colorectal cancer undergoing palliative chemotherapy who developed severe abdominal pain and has free air under the diaphragm. CT scan of the abdomen suggests a perforated duodenal ulcer as the cause. You think he needs an exploratory laparotomy. You explain the procedure in detail the patient politely declines surgery. He understands that he likely will die without surgery but feels he has lived a good life. Which ethical principle is illustrated in this case?","options":[{"letter":"A","text":"Autonomy."},{"letter":"B","text":"Beneficence."},{"letter":"C","text":"Nonmaleficence."},{"letter":"D","text":"Justice."}],"correct":"A","explanation":"<p>Correct: The competent patient clearly understands his condition and consequences and makes an informed refusal; honoring that choice is respect for autonomy.</p>\n\n<p>b) Wrong: Beneficence = acting in the patient&#x27;s best interest (e.g., offering treatment); it is not the principle being exercised by his refusal.</p>\n\n<p>c) Wrong: Nonmaleficence = &quot;do no harm&quot;; not the operative principle here.</p>\n\n<p>d) Wrong: Justice concerns fair distribution of resources, irrelevant to an individual refusal.</p>\n\n<p>Background: Unlike Q1, this patient demonstrates capacity within the vignette, so autonomy (not a capacity assessment) is the answer.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":9,"stem":"An 80 year-old female patient is brought to hospital with a one day history of confusion. On examination her heart rate is 60, blood pressure is 120/60 and she has cool and clammy extremities. Her serum creatinine is 500 and she has only a small amount of foul smelling, concentrated urine when a catheter is placed. Is this patient in shock?","options":[{"letter":"A","text":"No."},{"letter":"B","text":"She is in compensated shock."},{"letter":"C","text":"Yes."},{"letter":"D","text":"Unclear."}],"correct":"C","explanation":"<p>Correct: Shock is defined by inadequate tissue perfusion, not by hypotension. She has all three &quot;windows&quot; of hypoperfusion \u2014 neurologic (confusion), renal (oliguria, acute kidney injury with Cr 500), and cutaneous (cool, clammy) \u2014 so she is in shock despite a &quot;normal&quot; blood pressure (Vincent &amp; De Backer, NEJM, 2013; De Backer, Critical Care, 2017).</p>\n\n<p>a) Wrong: A normal BP does not exclude shock; compensatory vasoconstriction can preserve pressure.</p>\n\n<p>b) Wrong: She already has established end-organ dysfunction (AKI, altered mentation), which is beyond a purely &quot;compensated&quot; state; the best single answer is that she is in shock.</p>\n\n<p>d) Wrong: The perfusion findings make the diagnosis clear.</p>\n\n<p>Background: The HR of 60 is notable \u2014 an elderly and/or beta-blocked patient may not mount compensatory tachycardia, which can mask the severity. Likely septic (urosepsis) shock given foul, concentrated urine.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":10,"stem":"All of the following increase the INR EXCEPT:","options":[{"letter":"A","text":"Factor II deficiency."},{"letter":"B","text":"Antiphospholipid antibody."},{"letter":"C","text":"Factor V deficiency."},{"letter":"D","text":"Factor XI deficiency."}],"correct":"D","explanation":"<p>Correct: The PT/INR reflects the extrinsic and common pathways (factors VII, X, V, II, and fibrinogen). Factor XI is an intrinsic-pathway factor; its deficiency prolongs the aPTT, not the INR.</p>\n\n<p>a) Increases INR: Factor II (prothrombin) is a common-pathway factor.</p>\n\n<p>b) Increases INR: Antiphospholipid antibodies can artifactually prolong the PT/INR (reagent- and device-dependent, most notably with point-of-care assays) (Garcia &amp; Erkan, NEJM, 2018; Vandevelde et al., 2026).</p>\n\n<p>c) Increases INR: Factor V is a common-pathway factor.</p>\n\n<p>Background: A prolonged aPTT with a normal PT points to intrinsic-pathway factors (VIII, IX, XI, XII).</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":11,"stem":"A 50 year-old female is brought to hospital with shortness of breath and is diagnosed on chest x-ray with a large lobar pneumonia. Her heart rate is 130 and her blood pressure is 70/30 despite 2 litres of fluid resuscitation. The intervention that is supported by the most evidence of improving outcome is:","options":[{"letter":"A","text":"Early administration of vasopressors."},{"letter":"B","text":"Early aggressive fluid resuscitation."},{"letter":"C","text":"Early transfer to an intensive care unit."},{"letter":"D","text":"Early administration of antibiotics."}],"correct":"D","explanation":"<p>Correct: In septic shock, early appropriate antimicrobial therapy is among the most effective interventions to reduce mortality; the Surviving Sepsis Campaign gives a strong recommendation to give antibiotics immediately, ideally within 1 hour, in septic shock, and the mortality association with timing is strongest in shock (Prescott et al., Surviving Sepsis Campaign, 2026; Ferrer et al., Crit Care Med, 2014).</p>\n\n<p>a) Wrong: Vasopressors are indicated for fluid-refractory hypotension and improve hemodynamics, but antibiotics have the strongest mortality evidence and treat the underlying cause.</p>\n\n<p>b) Wrong: She has already had 2 L and remains in shock; further indiscriminate fluid is not the highest-yield step.</p>\n\n<p>c) Wrong: ICU transfer facilitates care but is not itself the outcome-improving intervention.</p>\n\n<p>Background: Source control plus early antibiotics and resuscitation are the cornerstones.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":12,"stem":"A 50 year-old female is brought to hospital with shortness of breath and is diagnosed on chest x-ray with a large lobar pneumonia. Her temperature is 39 degrees, heart rate is 130 and her blood pressure is 70/30 despite 2 litres of fluid resuscitation. All of the following are features of Systemic Inflammatory Response Syndrome (SIRS) EXCEPT:","options":[{"letter":"A","text":"Tachycardia (>90 beats/min)."},{"letter":"B","text":"Tachypnea (> 20 resp/min)."},{"letter":"C","text":"Hypotension (<90 mmHg)."},{"letter":"D","text":"Temperature (<35 \u02daC or >38\u02daC)."}],"correct":"C","explanation":"<p>Correct: The four SIRS criteria are temperature &gt;38\u00b0C or &lt;36\u00b0C, heart rate &gt;90, respiratory rate &gt;20 (or PaCO\u2082 &lt;32), and WBC &gt;12,000 or &lt;4,000 (or &gt;10% bands) (Bone criteria, 1992). Hypotension is not a SIRS criterion \u2014 it signifies progression to severe sepsis/septic shock.</p>\n\n<p>a, b, d) Wrong (they ARE SIRS criteria): tachycardia, tachypnea, and temperature derangement are all SIRS variables.</p>\n\n<p>Background: SIRS + infection = sepsis (Sepsis-1/2); Sepsis-3 (2016) replaced SIRS with SOFA/qSOFA, but the SIRS criteria remain the answer to this classic item.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":13,"stem":"Which of the following is not a component of a pre-operative briefing:","options":[{"letter":"A","text":"Introduction of team members by name and function."},{"letter":"B","text":"Review of airway concerns, allergies, special medications and expectations for recovery."},{"letter":"C","text":"Identification of patient, site, side and procedure to be undertaken."},{"letter":"D","text":"Procedural concerns, anticipated difficulties, expected duration of case, anticipated amount of blood loss and need for nonstandard instruments or supplies."},{"letter":"E","text":"Review of all medications received in the previous 48 hrs."}],"correct":"E","explanation":"<p>Correct: A preoperative team briefing covers introductions, patient/site/side/procedure verification, airway/allergy/critical-medication concerns, and anticipated procedural challenges (duration, blood loss, special equipment). A retrospective review of all medications given over the prior 48 hours is not a component of the briefing (Hicks et al., JAMA Surgery, 2014).</p>\n<p>a, b, c, d) Wrong (they ARE components): each is a standard element of the WHO-style briefing/time-out \u2014 introducing the team by name and function, reviewing airway/allergy/medication concerns, confirming patient/site/side/procedure, and discussing anticipated procedural difficulties, duration, blood loss, and equipment needs.</p>\n<p>Background: Structured OR briefings improve teamwork and safety.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":14,"stem":"In a neck trauma, which of the following is not an indication for neck exploration?","options":[{"letter":"A","text":"Non expanding hematoma."},{"letter":"B","text":"External hemorrhage."},{"letter":"C","text":"Stridor."},{"letter":"D","text":"Dysphagia."}],"correct":"A","explanation":"<p>Correct: A non-expanding (stable) hematoma is a &quot;soft sign&quot; and is managed with imaging/observation, not mandatory exploration (Schroeder et al., ACR Appropriateness Criteria, 2017; Sperry et al., WTA Penetrating Neck Trauma, 2013).</p>\n\n<p>b) Wrong (is an indication): active external hemorrhage is a hard sign mandating operative control.</p>\n\n<p>c) Wrong (is an indication): stridor/airway compromise is a hard sign.</p>\n\n<p>d) Wrong (is an indication in this item&#x27;s framing): dysphagia signals possible aerodigestive injury warranting operative/urgent evaluation; here it is treated as an exploration trigger.</p>\n\n<p>Background: Hard signs (expanding/pulsatile hematoma, active hemorrhage, airway compromise, bruit/thrill, shock) \u2192 OR; soft signs (non-expanding hematoma, venous ooze, subcutaneous emphysema) \u2192 CTA/observation.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":15,"stem":"In Canada, which of the following is NOT part of the components of informed consent?","options":[{"letter":"A","text":"It must be voluntary."},{"letter":"B","text":"The patient must have the mental capacity to consent."},{"letter":"C","text":"The patient must not have received any pain killers."},{"letter":"D","text":"The patient must be properly informed."}],"correct":"C","explanation":"<p>Correct: The elements of valid consent are that it be voluntary, given by a patient with capacity, and properly informed (adequate disclosure and understanding). Simply having received analgesia does not invalidate consent; what matters is whether capacity is intact.</p>\n\n<p>a, b, d) Wrong (they ARE components): voluntariness, capacity, and adequate disclosure/understanding are all required.</p>\n\n<p>Background: Analgesics or sedatives matter only insofar as they impair capacity in a given patient \u2014 the blanket statement in (c) is false.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":16,"stem":"A 60 year old patient suffers a head injury and is brought intubated to the trauma bay by EMS. CT head reveals an acute subdural hemorrhage that requires immediate evacuation. Police are trying to contact the patient's family members and think they will be able to track them down in the next hour. The next best step is:","options":[{"letter":"A","text":"Take the patient immediately to surgery \u2014 no consent is necessary."},{"letter":"B","text":"Take the patient immediately to surgery \u2014 obtain consent as soon as reasonably possible."},{"letter":"C","text":"Delay the surgery as the family should be imminently available."},{"letter":"D","text":"Obtain consent from the public trustee as no family is available."}],"correct":"B","explanation":"<p>Correct: A life-threatening SDH requiring immediate evacuation in an incapacitated patient invokes the emergency exception \u2014 treatment proceeds without delay \u2014 but the duty to obtain consent from a substitute decision-maker as soon as reasonably possible still applies.</p>\n\n<p>a) Wrong: Framing it as &quot;no consent is necessary&quot; is too absolute; the obligation to seek substitute consent when feasible remains.</p>\n\n<p>c) Wrong: Delaying an emergent, life-saving craniotomy for up to an hour to await family risks death/herniation and is not acceptable.</p>\n\n<p>d) Wrong: The public trustee is a last resort when no substitute decision-maker exists and there is time; it does not apply to an immediate emergency.</p>\n\n<p>Background: Emergency doctrine permits necessary treatment to preserve life/prevent serious harm when consent cannot be obtained in time.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":17,"stem":"Regarding abdominal compartment syndrome, which intra-abdominal pressure measurement is considered an indication to perform a surgical decompression?","options":[{"letter":"A","text":"20 mmHg."},{"letter":"B","text":"25 mmHg."},{"letter":"C","text":"30 mmHg."},{"letter":"D","text":"35 mmHg."}],"correct":"B","explanation":"<p>Correct (per the cited source): The classic teaching (Meldrum et al., Am J Surg, 1997), which this question references, uses an intra-abdominal pressure of ~25 mmHg (with organ dysfunction) as a threshold for decompressive laparotomy.</p>\n\n<p>a) Per this grading, 20 mmHg alone is not yet the decompression trigger.</p>\n\n<p>c, d) Higher thresholds (30, 35) exceed the value the referenced grading uses for decompression.</p>\n\n<p>Important contemporary note: Current WSACS (World Society of the Abdominal Compartment Society) criteria define ACS as sustained IAP &gt;20 mmHg with new organ dysfunction, and recommend decompressive laparotomy for ACS refractory to medical management \u2014 i.e., the modern trigger is &gt;20 mmHg with organ dysfunction, not an isolated 25 mmHg number (K\u0148azovick\u00fd et al., Langenbecks Arch Surg, 2026; Van Damme &amp; De Waele, Critical Care, 2018). The decision is driven by organ dysfunction plus failure of medical measures, not by the pressure value alone.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":18,"stem":"In the trauma damage control damage control literature, which of the following is not part of the \"lethal triad\"?","options":[{"letter":"A","text":"Hypothermia."},{"letter":"B","text":"Hypotension."},{"letter":"C","text":"Coagulopathy."},{"letter":"D","text":"Acidosis."}],"correct":"B","explanation":"<p>Correct: The &quot;lethal triad&quot; (bloody vicious cycle) of trauma is hypothermia, coagulopathy, and acidosis (Rossaint et al., European trauma bleeding guideline, 2023; Spahn et al., 2019). Hypotension is a consequence of hemorrhage but is not one of the three triad components.</p>\n\n<p>a, c, d) Wrong (they ARE triad members): hypothermia, coagulopathy, and metabolic acidosis mutually reinforce one another.</p>\n\n<p>Background: These derangements trigger damage control surgery \u2014 abbreviated laparotomy, packing, temporary closure, and ICU physiologic restoration before definitive repair. (Note this also disambiguates Q34, where the triad is incorrectly stated with &quot;metabolic alkalosis.&quot;)</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":19,"stem":"In evaluating the effects of duty hour restriction for surgical residents, MOST studies have shown (choose the best answer):","options":[{"letter":"A","text":"No change or worsening patient safety (morbidity and mortality); no change or improvement in resident wellness except for those restricted to 16 hr shifts in which case no change or worsening resident wellness; no change or worsened resident education."},{"letter":"B","text":"Improved patient safety (morbidity and mortality); no change or improvement in resident wellness except for those restricted to 16 hr shifts in which case no change or worsening resident wellness; no change or worsened resident education."},{"letter":"C","text":"Improved patient safety (morbidity and mortality); improvement in resident wellness especially for those restricted to 16 hr shifts; no change or worsened resident education."},{"letter":"D","text":"Improved patient safety (morbidity and mortality); improvement in resident wellness especially for those restricted to 16 hr shifts; improved resident education."},{"letter":"E","text":"No change or worsening patient safety (morbidity and mortality); no change or improvement in resident wellness especially for those restricted to 16 hr shifts; improved resident education."}],"correct":"A","explanation":"<p>Correct: The systematic review of surgical resident duty-hour restrictions found no consistent improvement (and sometimes worsening) in patient safety, no clear wellness benefit \u2014 with wellness possibly worse under 16-hour shift caps \u2014 and no improvement (sometimes worsening) in education (Ahmed, Devitt et al., Annals of Surgery, 2014).</p>\n\n<p>b, c, d) Wrong: These overstate benefits; restrictions did not reliably improve patient safety, and 16-hour caps were not associated with wellness gains.</p>\n\n<p>e) Wrong: Duty-hour restriction was not shown to improve resident education.</p>\n\n<p>Background: This item summarizes the surgical literature specifically, which differs from some findings in non-surgical specialties.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":20,"stem":"Which of the following regarding sepsis is true?","options":[{"letter":"A","text":"Hypothermia is an more common in patients over the age of 65 years of age."},{"letter":"B","text":"Antibiotics should be withheld until cultures are drawn."},{"letter":"C","text":"The abdomen is the most common source."},{"letter":"D","text":"More than 50% of patients presenting to the emergency department will have a temperature \u226538.5\u00b0C."}],"correct":"A","explanation":"<p>Correct: Elderly patients frequently mount a blunted or absent febrile response and are more likely to present with hypothermia (and atypical features such as delirium), contributing to their higher sepsis mortality (Gould et al., West J Emerg Med, 2026).</p>\n\n<p>b) Wrong: Antibiotics must not be delayed for cultures in sepsis/septic shock; obtain cultures if it does not meaningfully delay therapy, then give antibiotics immediately (Prescott et al., Surviving Sepsis Campaign, 2026).</p>\n\n<p>c) Wrong: The respiratory tract (pneumonia) is the most common source of sepsis, not the abdomen.</p>\n\n<p>d) Wrong: A substantial minority of septic patients are afebrile or hypothermic; more than half do not present with temperature \u226538.5\u00b0C, and SIRS uses a lower fever threshold (&gt;38\u00b0C).</p>\n\n<p>Background: The absence of fever should never lower suspicion for sepsis, especially in older adults.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":21,"stem":"Which of the following has an increased risk of thrombosis?","options":[{"letter":"A","text":"Antithrombin deficiency."},{"letter":"B","text":"Glanzmann's thrombasthenia."},{"letter":"C","text":"Factor XI deficiency."},{"letter":"D","text":"Alpha II antiplasmin deficiency."}],"correct":"A","explanation":"<p>Antithrombin is the principal endogenous inhibitor of thrombin and factor Xa. Its deficiency (inherited or acquired) produces a hypercoagulable, thrombophilic state and is also the mechanism behind heparin resistance, since heparin acts by potentiating antithrombin.</p>\n<p>Why the others are wrong \u2014 all three cause bleeding, not thrombosis:</p>\n<p>Glanzmann&#x27;s thrombasthenia is a defect of platelet glycoprotein IIb/IIIa, impairing platelet aggregation and causing mucocutaneous bleeding.</p>\n\n<p>Factor XI deficiency (hemophilia C) causes a variable bleeding tendency.</p>\n\n<p>Alpha-2-antiplasmin deficiency removes the main inhibitor of plasmin, producing unopposed fibrinolysis and a bleeding phenotype.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":22,"stem":"Which of the following regarding Disseminated Intravascular Coagulation (DIC) is FALSE?","options":[{"letter":"A","text":"Patients with neuro trauma are at a decreased risk of developing DIC."},{"letter":"B","text":"Exposure of blood to tissue factor is thought to be one of the early events in the process of DIC."},{"letter":"C","text":"It can originate from and cause damage to the microvasculature."},{"letter":"D","text":"It may be a complication of hyperthermia."}],"correct":"A","explanation":"<p>Neurotrauma is an increased, not decreased, risk for DIC. The brain is extraordinarily rich in tissue factor, which is normally sequestered behind the blood\u2013brain barrier. Traumatic brain injury disrupts that barrier and releases tissue factor (and brain-derived, tissue-factor\u2013bearing microparticles) into the circulation, triggering the extrinsic pathway, consumptive coagulopathy, and DIC that can appear within 6 hours of injury. Studies show the coagulofibrinolytic changes in isolated TBI are essentially identical to DIC with a hyperfibrinolytic phenotype.</p>\n<p>Why the other statements are true (and therefore not the answer):</p>\n<p>(b) Tissue factor exposure/expression is indeed an early initiating event in DIC.</p>\n\n<p>(c) DIC both originates from and damages the microvasculature, causing microthrombosis and organ injury.</p>\n\n<p>(d) DIC can complicate hyperthermia (e.g., heat stroke), as well as sepsis, malignancy, and obstetric catastrophes.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":23,"stem":"You are taking a patient to the operating room for an elective inguinal hernia repair. Your attending asks you to get the patient's consent but you are unsure what potential complications need to be discussed with the patient. In Canada, by what standard is the adequacy of consent legally judged?","options":[{"letter":"A","text":"By the local standard of care."},{"letter":"B","text":"By the reasonable patient standard."},{"letter":"C","text":"By the opinion of a panel of experts."},{"letter":"D","text":"By the North American consent standard."}],"correct":"B","explanation":"<p>Canadian law (rooted in Reibl v. Hughes, 1980, and Hopp v. Lepp) judges disclosure by what a reasonable person in the patient&#x27;s position would want to know \u2014 a patient-centered (&quot;modified objective&quot;) standard \u2014 rather than by what a reasonable physician would customarily disclose. Material risks, including rare but serious ones, must be disclosed.</p>\n<p>Why the others are wrong:</p>\n<p>(a) The physician-centered &quot;professional/local standard of care&quot; (the Bolam test) governs disclosure in some other jurisdictions historically, but Canada rejected it for consent.</p>\n\n<p>(c) There is no expert-panel standard for judging consent adequacy.</p>\n\n<p>(d) &quot;North American consent standard&quot; is not a recognized legal concept.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":24,"stem":"In evaluating the transfer of technical skills to the clinical operative setting, residents trained with which technique perform the best? (choose the best answer)","options":[{"letter":"A","text":"Best: learner with clinical patient training; second best: learner with simulation training; last: learner without patient or simulation training."},{"letter":"B","text":"Best: learner without patient or simulation training; second best: learner with clinical patient training; last: learner with simulation training."},{"letter":"C","text":"Best: learner with simulation training; second bests: learner without patient or simulation training same as learner with clinical patient training."},{"letter":"D","text":"Bests: learner with simulation training same as learner with clinical patient training; last: learner without patient or simulation training."},{"letter":"E","text":"Best: learner with simulation training; second best: learner with clinical patient training; last: learner without patient or simulation training."}],"correct":"D","explanation":"<p>Per the cited systematic review of skills transfer after surgical simulation-based training (Dawe SR, Pena GN, et al., BJS 2014;101:1063\u20131076), simulation-based training transfers to the operative setting at least as well as, and no worse than, conventional patient-based training, and both are clearly superior to no training. Hence simulation-trained and clinically-trained learners perform comparably (both &quot;best&quot;), while untrained learners perform worst.</p>\n<p>Why the others are wrong: options (a), (b), (c), and (e) all rank one modality clearly above the other or subordinate simulation, which the review&#x27;s data do not support \u2014 the key finding is equivalence of simulation and clinical training, both better than none.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":25,"stem":"With regards to the safe use of a tourniquet, which statement is true? (choose the best answer)","options":[{"letter":"A","text":"Under local anesthesia, most patients tolerate an upper limb tourniquet for 30 minutes; the recommended setting above systolic blood pressure for tourniquet inflation is 100-125 mmHg for the upper limb and 150-250 mmHg for the lower limb."},{"letter":"B","text":"Under local anesthesia, most patients tolerate an upper limb tourniquet for 30 minutes; the recommended setting below systolic blood pressure for tourniquet inflation is 50-75 mmHg for the upper limb and 90-150 mmHg for the lower limb."},{"letter":"C","text":"Under local anesthesia, most patients tolerate an upper limb tourniquet for 20 minutes; the recommended setting above systolic blood pressure for tourniquet inflation is 50-75 mmHg for the upper limb and 90-150 mmHg for the lower limb."},{"letter":"D","text":"Under local anesthesia, most patients tolerate an upper limb tourniquet for 30 minutes; the recommended setting above systolic blood pressure for tourniquet inflation is 10-25 mmHg for the upper limb and 50-75 mmHg for the lower limb."},{"letter":"E","text":"Under local anesthesia, most patients tolerate an upper limb tourniquet for 20 minutes; the recommended setting below systolic blood pressure for tourniquet inflation is 10-25 mmHg for the upper limb and 50-75 mmHg for the lower limb."}],"correct":"C","explanation":"<p>The reference values are: awake patients under local anesthesia tolerate an upper-limb tourniquet for roughly 20 minutes before ischemic discomfort; inflation is set above systolic pressure \u2014 about 50\u201375 mmHg above systolic for the upper limb and 90\u2013150 mmHg above systolic for the lower limb. Total tourniquet time (regardless of anesthesia) is generally kept under ~2 hours to avoid ischemic nerve/muscle injury.</p>\n<p>Why the others are wrong: the correct answer requires the pressure to be set above systolic (eliminating b and e, which say &quot;below&quot;) with the specific upper/lower limb increments of 50\u201375 and 90\u2013150 mmHg (eliminating a, which overstates the increments, and d, which understates them). The &quot;20 minutes&quot; tolerance under local anesthesia is also a distinguishing feature of option c.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":26,"stem":"A 70 year-old previously healthy female presents with septic shock from urosepsis as a result of an impacted renal calculi. Her initial hemoglobin level is 75. According to the surviving sepsis campaign guidelines what transfusion trigger should be used in this patient?","options":[{"letter":"A","text":"Transfuse if hgb<70."},{"letter":"B","text":"Transfuse if hgb<90 and in shock."},{"letter":"C","text":"Transfuse if hgb<80."},{"letter":"D","text":"Transfuse if hgb<65."}],"correct":"A","explanation":"<p>The Surviving Sepsis Campaign gives a strong recommendation for a restrictive transfusion strategy, with a hemoglobin trigger of 70 g/L in adults with sepsis or septic shock (in the absence of extenuating circumstances such as active myocardial ischemia, severe hypoxemia, or acute hemorrhage). This is anchored by the TRISS trial (70 vs 90 g/L in 998 septic shock patients: no difference in 90-day mortality, with fewer transfusions in the restrictive arm) and TRICC. This patient&#x27;s Hgb of 75 g/L is above the trigger, so transfusion is not indicated on the basis of hemoglobin alone.</p>\n<p>Why the others are wrong: 90 (b), 80 (c), and 65 (d) do not correspond to the guideline trigger. Note the older Rivers early goal-directed therapy protocol targeted hematocrit \u226530% during the first 6 hours, but this liberal early-transfusion approach was abandoned after ProCESS/ARISE/ProMISe showed no benefit.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":27,"stem":"A 60 year-old female presented with fever and right flank pain and she is found to have an impacted right renal calculus and hydronephrosis. She is hypotensive and tachycardic. Which of the following likely represents her hemodynamic parameters: (CI \u2014 cardiac index, CVP \u2014 central venous pressure, PCWP \u2014 pulmonary capillary wedge pressure, MVO2 \u2014 mixed venous oxygen saturation)","options":[{"letter":"A","text":"CI 5.0, CVP 2, PCWP 2, MV02 85%."},{"letter":"B","text":"CI 1.5, CVP 2, PCWP 2, MV02 40%."},{"letter":"C","text":"CI 5.0, CVP 20, PCWP 17, MV02 40%."},{"letter":"D","text":"CI 3.5, CVP 25, PCWP 5, MV02 70%."}],"correct":"A","explanation":"<p>This is obstructing-stone urosepsis \u2192 septic (distributive) shock. The hyperdynamic pattern is: high cardiac index (vasodilation, low afterload), low filling pressures (CVP and PCWP low from venodilation and capillary leak/hypovolemia), and high mixed venous oxygen saturation (impaired tissue oxygen extraction and arteriovenous shunting). Option (a) matches this profile.</p>\n<p>Why the others are wrong:</p>\n<p>(b) Low CI with low filling pressures and low MVO2 = hypovolemic shock.</p>\n\n<p>(c) High CI but high CVP/PCWP with low MVO2 is internally inconsistent and not the classic distributive pattern (high filling pressures argue against distributive shock).</p>\n\n<p>(d) High CVP with low PCWP suggests isolated right-heart/obstructive physiology, not urosepsis.</p>\n<p>Note: very early septic shock, before volume resuscitation, can transiently show low CI and low wedge pressure; the hyperdynamic high-CI/high-MVO2 picture emerges after (or with) fluid repletion and is the pattern intended here.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":28,"stem":"A 65-year-old man presents to the emergency with 4 days of productive cough, fever, chills, and left-sided pleuritic chest pain. His vitals are: temperature 38.9\u00b0C, heart rate 118, respiratory rate 32, blood pressure 75/40 mm Hg, and oxygen saturation 82% on room air. He has not been fluid resuscitated. A chest radiograph shows a left lower lobe consolidation. This patient's condition can best be defined as which of the following?","options":[{"letter":"A","text":"Sepsis."},{"letter":"B","text":"Septic shock."},{"letter":"C","text":"Severe sepsis."},{"letter":"D","text":"Systemic inflammatory response syndrome (SIRS)."}],"correct":"C","explanation":"<p>Under the older SIRS-based (Sepsis-2) definitions the exam uses: this patient meets multiple SIRS criteria (T 38.9\u00b0C, HR 118, RR 32) plus a documented source (pneumonia) = sepsis, and has organ dysfunction (hypoxemia, hypotension) = severe sepsis. Because he has not yet received fluid resuscitation, &quot;septic shock&quot; (defined then as hypotension persisting despite adequate fluid resuscitation) cannot yet be assigned \u2014 had he remained hypotensive after fluids, the label would be septic shock.</p>\n<p>Note (disagreement with current terminology, not with the exam&#x27;s intended answer): The Sepsis-3 consensus (2016) eliminated the categories &quot;SIRS-based sepsis&quot; and &quot;severe sepsis.&quot; Under Sepsis-3, sepsis = infection + organ dysfunction (SOFA increase \u22652), and septic shock = sepsis with vasopressor-requiring hypotension plus lactate &gt;2 mmol/L. By current definitions this patient has sepsis with organ dysfunction, and the SIRS-versus-fluid-resuscitation distinction used to separate &quot;severe sepsis&quot; from &quot;septic shock&quot; is obsolete. The answer &quot;severe sepsis&quot; is correct only within the exam&#x27;s Sepsis-2 framework.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":29,"stem":"Which of the following ventilation strategies is recommended for patients with ARDS?","options":[{"letter":"A","text":"Ventilator mode should be synchronized intermittent mandatory ventilation."},{"letter":"B","text":"PEEP of 5 cm H2O."},{"letter":"C","text":"Increase respiratory rate >24 breaths/min."},{"letter":"D","text":"Tidal volumes should be 6 ml/kg."}],"correct":"D","explanation":"<p>Low-tidal-volume, lung-protective ventilation is the cornerstone of ARDS management. The landmark ARDSNet (ARMA) trial showed 6 mL/kg PBW versus 12 mL/kg PBW reduced mortality by ~22% relative (31% vs 40%), with a plateau pressure target \u226430 cm H2O. Current guidelines target 4\u20138 mL/kg PBW.</p>\n<p>Why the others are wrong:</p>\n<p>(a) No specific mode (SIMV) is required or preferred; the key is the volume/pressure limitation, not the mode.</p>\n\n<p>(b) PEEP is typically started around 5 cm H2O, but a fixed PEEP of 5 is not the recommended strategy \u2014 PEEP is titrated to oxygenation, and higher PEEP is reserved for moderate-to-severe ARDS.</p>\n\n<p>(c) Deliberately raising RR &gt;24 is not itself a protective strategy; rate is adjusted to manage minute ventilation/permissive hypercapnia within the low-tidal-volume framework.</p>\n<p>Note on the exam&#x27;s cited rationale: the claim that &quot;higher PEEP&quot; improves survival is not supported for unselected ARDS. Meta-analyses show higher PEEP benefits only moderate-to-severe ARDS (P/F \u2264200); the survival benefit that is robust across all ARDS is the low tidal volume itself.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":30,"stem":"What is an early sign/symptom of sepsis?","options":[{"letter":"A","text":"Weak, thready pulse."},{"letter":"B","text":"Delirium."},{"letter":"C","text":"Decrease in body temperature."},{"letter":"D","text":"Shortness of breath."}],"correct":"B","explanation":"<p>Acute change in mentation/confusion (sepsis-associated encephalopathy) is an early and sensitive marker of sepsis \u2014 altered mental status is one component of the quick SOFA (qSOFA) score precisely because it appears early and predicts deterioration.</p>\n<p>Why the others are wrong \u2014 each is a comparatively late finding:</p>\n<p>(a) A weak, thready pulse reflects advanced hypoperfusion/decompensated shock.</p>\n\n<p>(c) Hypothermia is a late/ominous sign (and, per Question 20, is more common in the elderly).</p>\n\n<p>(d) Frank dyspnea/respiratory failure is typically later than the initial subtle tachypnea and mental status change.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":31,"stem":"The following is the best fluid for resuscitation of a burn in the first 24 hours.","options":[{"letter":"A","text":"Normal Saline."},{"letter":"B","text":"Blood."},{"letter":"C","text":"Albumin."},{"letter":"D","text":"Ringer's Lactate."},{"letter":"E","text":"D5 half Normal Saline."}],"correct":"D","explanation":"<p>Balanced isotonic crystalloid \u2014 warmed lactated Ringer&#x27;s \u2014 is the standard first-24-hour burn resuscitation fluid (Parkland: 4 mL/kg/%TBSA; modified Brooke: 2 mL/kg/%TBSA), titrated to a urine output of 0.5\u20131.0 mL/kg/h in adults. LR is preferred over normal saline because large-volume saline causes hyperchloremic metabolic acidosis.</p>\n<p>Why the others are wrong:</p>\n<p>(a) Normal saline is inferior to LR for large-volume resuscitation (acidosis).</p>\n\n<p>(b) Blood is not used for initial burn resuscitation absent hemorrhage.</p>\n\n<p>(c) Albumin/colloid is generally withheld in the first ~8\u201312 hours (capillary leak) though &quot;colloid rescue&quot; is used later to combat fluid creep; recent RCTs (ABRUPT/ABRUPT2) show adjunctive 5% albumin reduces crystalloid volume, but crystalloid remains the primary/initial fluid.</p>\n\n<p>(e) Hypotonic dextrose-containing fluid (D5 \u00bd NS) is inappropriate for resuscitation.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":32,"stem":"Which of the following statements regarding burn depth is true?","options":[{"letter":"A","text":"First-degree burns are characterized by erythema, pain, and blistering of the skin."},{"letter":"B","text":"Second-degree burns involve the epidermis only."},{"letter":"C","text":"Third-degree burns are characterized by erythema, pain, bullae, and moisture from fluid extravasation."},{"letter":"D","text":"Fourth-degree burns involve muscle or bone."},{"letter":"E","text":"Third-degree burns blanch to the touch."}],"correct":"D","explanation":"<p>Fourth-degree burns extend through the full thickness of skin and subcutaneous tissue into underlying fascia, muscle, and/or bone.</p>\n<p>Why the others are wrong:</p>\n<p>(a) First-degree (superficial) burns cause erythema and pain but do NOT blister (blistering indicates second-degree/partial-thickness).</p>\n\n<p>(b) Second-degree (partial-thickness) burns involve the epidermis AND part of the dermis, not the epidermis only (that describes first-degree).</p>\n\n<p>(c) That description (erythema, pain, bullae, moist, painful) is a second-degree burn; third-degree (full-thickness) burns are typically dry, leathery, insensate, and non-blanching.</p>\n\n<p>(e) Third-degree burns do NOT blanch (the dermal capillary plexus is destroyed); blanching implies preserved perfusion of a more superficial burn.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":33,"stem":"Select the correct statement:","options":[{"letter":"A","text":"Vascular anastomoses are best performed starting with the posterior wall first."},{"letter":"B","text":"Arterial injuries are technically easier to reconstruct than venous injuries."},{"letter":"C","text":"Regarding vascular injuries, distal control should always be obtained first."},{"letter":"D","text":"For vessels <6 mm, PTFE is the first choice for interpositional graft use."},{"letter":"E","text":"5 cm mobilization of blood vessels can be performed for primary repair of vascular injuries."}],"correct":"A","explanation":"<p>Beginning the anastomosis on the posterior (back) wall allows accurate suture placement under direct vision before the anterior wall is closed, particularly for deep or difficult-to-rotate vessels.</p>\n<p>Why the others are wrong:</p>\n<p>(b) Arteries are not inherently easier than veins; thin-walled, low-pressure veins are technically demanding, but the statement as a general rule is false.</p>\n\n<p>(c) Proximal control is obtained first, then distal control \u2014 not distal first.</p>\n\n<p>(d) For small-caliber vessels (&lt;6 mm), autologous vein is the graft of choice; prosthetic PTFE performs poorly at small diameters (thrombosis).</p>\n\n<p>(e) Excessive mobilization/tension leads to anastomotic failure; a short segmental gap generally requires an interposition graft rather than primary repair under tension. (The specific &quot;5 cm&quot; claim is false as a rule for tension-free primary repair.)</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":34,"stem":"Regarding damage control surgery, what is a false statement?","options":[{"letter":"A","text":"The goal of DCS is to control surgical bleeding and limit GI spillage."},{"letter":"B","text":"A temperature of <35 degrees C is an indication to initiate DCS."},{"letter":"C","text":"An arterial pH <7.2 is an indication to initiate DCS."},{"letter":"D","text":"The purpose of DCS is to limit operative time so patients can be transferred to the ICU for physiologic restoration."},{"letter":"E","text":"The bloody vicious cycle is the combination of coagulopathy, hypothermia, and metabolic alkalosis."}],"correct":"E","explanation":"<p>The lethal triad (&quot;bloody vicious cycle&quot;) of trauma is coagulopathy, hypothermia, and metabolic ACIDOSIS \u2014 not alkalosis. Substituting &quot;alkalosis&quot; makes the statement false.</p>\n<p>Why the other statements are true (not the answer):</p>\n<p>(a) DCS aims for rapid hemorrhage control and containment of GI/enteric contamination, deferring definitive repair.</p>\n\n<p>(b) Hypothermia &lt;35\u00b0C is a recognized trigger for a damage-control approach.</p>\n\n<p>(c) Acidosis (arterial pH &lt;7.2) is a recognized trigger.</p>\n\n<p>(d) The core principle is to abbreviate the operation so the patient can be warmed, resuscitated, and corrected in the ICU before returning for definitive surgery. (This links to Question 18: the lethal triad omits hypotension, which is not one of the three components.)</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":35,"stem":"Which of the following Familial Cancer Syndrome is associated with Acoustic Neuroma?","options":[{"letter":"A","text":"Cowden Disease."},{"letter":"B","text":"Multiple Endocrine Neoplasia-1 (MEN-1)."},{"letter":"C","text":"(blank)."},{"letter":"D","text":"Neurofibromatosis Type 2."},{"letter":"E","text":"Von Hippel-Lindau syndrome."}],"correct":"D","explanation":"<p>Bilateral vestibular schwannomas (acoustic neuromas) are the pathognomonic hallmark of NF2, an autosomal dominant syndrome from germline mutation of the NF2 tumor suppressor on chromosome 22q12 (encoding merlin). NF2 also predisposes to meningiomas, other cranial/spinal schwannomas, and ependymomas.</p>\n<p>Why the others are wrong:</p>\n<p>(a) Cowden disease (PTEN) \u2192 breast, thyroid, and endometrial cancers, mucocutaneous hamartomas, Lhermitte-Duclos.</p>\n\n<p>(b) MEN-1 \u2192 parathyroid, pancreatic (gastrinoma/insulinoma), and pituitary tumors.</p>\n\n<p>(e) Von Hippel-Lindau \u2192 CNS/retinal hemangioblastomas, clear-cell renal carcinoma, pheochromocytoma. None of these features acoustic neuroma.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":36,"stem":"During a general surgery rotation, a junior team resident left the operating room angry and did not talk to you for a few days. When you meet him later, he told you that you never let him practice simple procedures in the OR. He wants to get a better surgical exposition during this rotation. Based on conflict resolution principles, what should you do next?","options":[{"letter":"A","text":"Ignore him since you are his senior and deserve being exposed to all surgeries."},{"letter":"B","text":"Propose him to go get a coffee to listen to his needs and feelings about the situation."},{"letter":"C","text":"Tell him that he should accept the situation like this and that he will have plenty of surgical opportunities in the future."},{"letter":"D","text":"Ask your attending to talk to him."},{"letter":"E","text":"Lodge complaints against him to your program director."}],"correct":"B","explanation":"<p>Effective conflict resolution begins with a collaborative approach: creating a low-pressure setting, actively listening, and understanding the other party&#x27;s underlying needs and interests before problem-solving. This is the integrative/collaborating style that seeks a mutually acceptable outcome.</p>\n<p>Why the others are wrong:</p>\n<p>(a) Ignoring/asserting seniority is a competing/avoiding stance that leaves the conflict unresolved.</p>\n\n<p>(c) Dismissing his concern shuts down dialogue.</p>\n\n<p>(d) Escalating to the attending prematurely bypasses direct, respectful resolution.</p>\n\n<p>(e) Filing a complaint is punitive and inappropriate for a normal training grievance.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":37,"stem":"In wound healing by primary intention, which cell type would be expected to be the most abundant on post-operative day 7?","options":[{"letter":"A","text":"Platelets."},{"letter":"B","text":"Macrophages."},{"letter":"C","text":"Fibroblasts."},{"letter":"D","text":"Neutrophils."}],"correct":"C","explanation":"<p>Wound healing proceeds in overlapping phases. By day 7 the wound is in the proliferative/fibroplasia phase, dominated by fibroblasts producing collagen and extracellular matrix.</p>\n<p>Why the others are wrong \u2014 each dominates an earlier window:</p>\n<p>(a) Platelets are central in the immediate hemostatic phase (minutes to hours).</p>\n\n<p>(d) Neutrophils predominate in the early inflammatory phase (~days 1\u20132).</p>\n\n<p>(b) Macrophages take over around days 2\u20134 (peak ~day 3), orchestrating the transition to proliferation. By day 7, fibroblasts are the predominant cell.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":38,"stem":"One hundred people test positive for a rare viral infection with a new diagnostic test (Test A). Only 95 truly have the disease based on the most accurate test available (gold standard). Which of the following is true regarding Test A?","options":[{"letter":"A","text":"The sensitivity is 95%."},{"letter":"B","text":"The positive predictive value is 95%."},{"letter":"C","text":"The specificity is 95%."},{"letter":"D","text":"The negative predictive value is 95%."}],"correct":"B","explanation":"<p>Positive predictive value = true positives \u00f7 all who test positive = 95 \u00f7 100 = 95%. The data describe only people who tested positive and how many truly have disease \u2014 that is precisely PPV.</p>\n<p>Why the others are wrong \u2014 each requires information not provided:</p>\n<p>(a) Sensitivity = TP \u00f7 (TP + FN); the number of diseased people who tested negative is unknown.</p>\n\n<p>(c) Specificity = TN \u00f7 (TN + FP); requires data on those without disease.</p>\n\n<p>(d) NPV = TN \u00f7 (TN + FN); requires data on those who tested negative.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":39,"stem":"Adequate informed consent entails four basic elements. Which one of these statements is FALSE?","options":[{"letter":"A","text":"The surgeon discloses to the patient details regarding the diagnosis and the treatment options sufficiently for the patient."},{"letter":"B","text":"The patient demonstrates understanding of the disclosed information before authorizing freely a specific treatment plan."},{"letter":"C","text":"The surgeon documents that the patient or surrogate has the capacity to make a medical decision."},{"letter":"D","text":"Children should always participate in the process of informed consent in the same way as adults."}],"correct":"D","explanation":"<p>Children do not participate in consent in the same way as adults. Legal consent for a minor is generally provided by a parent/guardian; the child&#x27;s developmentally appropriate assent is sought where feasible, but this is not equivalent to adult informed consent. (Mature-minor doctrines are jurisdiction-specific exceptions, not the general rule.)</p>\n<p>Why the other statements are true (they describe the genuine elements of consent): (a) adequate disclosure, (b) voluntary authorization with demonstrated understanding, and (c) documentation of decision-making capacity are all legitimate components.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":40,"stem":"A group of Orthopaedic Surgeons decides to evaluate their hospital's infection rate. They use synovial white cell count (SWCC) from a joint aspiration as their diagnostic test. If the gold standard is a SWCC cutoff of 1000 cells/\u00b5L (i.e., over 1000 cells/\u00b5L is considered positive for infection) and this group decides to use a value of 2000 cells/\u00b5L as their cutoff, what is likely to happen to the sensitivity and specificity of this test?","options":[{"letter":"A","text":"Sensitivity and specificity will both increase."},{"letter":"B","text":"Sensitivity will increase and specificity decrease."},{"letter":"C","text":"Both will go down."},{"letter":"D","text":"Sensitivity will decrease and specificity will increase."}],"correct":"D","explanation":"<p>Raising the positivity threshold from 1000 to 2000 cells/\u00b5L makes the test more stringent: fewer results are called positive. Some truly infected patients (1000\u20132000 cells/\u00b5L) will now be missed \u2192 more false negatives \u2192 lower sensitivity. Conversely, fewer uninfected patients are wrongly flagged \u2192 fewer false positives \u2192 higher specificity.</p>\n<p>Why the others are wrong: this reflects the universal inverse trade-off between sensitivity and specificity as a cutoff moves. A higher cutoff cannot raise both (a) or specifically raise sensitivity (b); and it does not lower both (c) \u2014 specificity improves.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":41,"stem":"Which of these factors does not affect wound healing?","options":[{"letter":"A","text":"Anemia."},{"letter":"B","text":"Advanced age."},{"letter":"C","text":"Diabetes."},{"letter":"D","text":"Gender."},{"letter":"E","text":"Steroids."}]
