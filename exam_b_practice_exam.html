,"correct":"D","explanation":"<p>Why it is correct (as intended): In the classic surgical teaching (Schwartz), the major impairments to wound healing are tissue hypoxia/ischemia, infection, diabetes, advanced age, malnutrition, corticosteroids, and smoking. Gender is the one option not listed among the traditional major determinants.</p>\n<p>Why the others are incorrect: Anemia contributes to tissue hypoxia and impaired healing; advanced age thins the dermis and reduces the cutaneous vascular/nerve reserve; diabetes impairs healing through hypoxia, fibroblast/epithelial dysfunction, impaired angiogenesis, and reduced host immunity; corticosteroids (steroids) blunt the inflammatory phase and collagen synthesis.</p>\n<p>Caveat \u2014 disagreement in nuance: Contemporary literature does show that sex hormones influence wound healing (estrogens upregulate healing-related genes, whereas androgens impair them, and acute wounds heal somewhat more slowly in males). &quot;Gender&quot; is still the best answer among the choices because it is not a classic major impairing factor, but it is not strictly true that sex has no effect. Note this if the item is used for teaching.</p>\n<p>Background: Guo and DiPietro&#x27;s widely cited review lists oxygenation, infection, age and sex hormones, stress, diabetes, obesity, medications, alcohol, smoking, and nutrition as the significant modifiers of cutaneous healing.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":42,"stem":"Which of the following is an important consideration for basal skull fractures?","options":[{"letter":"A","text":"Prophylactic antibiotics."},{"letter":"B","text":"Avoid blind NG placement."},{"letter":"C","text":"Elevate head of bed."},{"letter":"D","text":"Hypotension."}],"correct":"B","explanation":"<p>Why it is correct: A basal (skull-base) fracture \u2014 especially cribriform plate/anterior fossa \u2014 creates a potential communication between the nasopharynx and the cranial vault. Blind nasogastric (or nasotracheal) tube insertion risks intracranial passage of the tube. The orogastric route is preferred, or NG placement should be done under direct/imaging guidance.</p>\n<p>Why the others are incorrect: Prophylactic antibiotics for basal skull fracture (even with CSF leak) are not supported by evidence to reduce meningitis and are not a defining &quot;important consideration.&quot; Head-of-bed elevation is generic and not the key fracture-specific concern. Hypotension is harmful in head injury (secondary brain injury), not a &quot;consideration&quot; to pursue.</p>\n<p>Background: Clinical signs suggesting basal skull fracture include periorbital ecchymosis (&quot;raccoon eyes&quot;), retroauricular ecchymosis (Battle sign), hemotympanum, and CSF rhinorrhea/otorrhea.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":43,"stem":"A 32-year-old male is pinned against a wall by a front-end loader and sustains a closed pelvic fracture. He receives 8 L of crystalloid and 2 units of packed red blood cells. His BP is still 80/50 with HR 150. What is the MOST appropriate next step?","options":[{"letter":"A","text":"ORIF of the pelvic fracture."},{"letter":"B","text":"External fixation of the pelvic fracture."},{"letter":"C","text":"Laparotomy and ligation of the internal iliac artery."},{"letter":"D","text":"Angiography and embolization."},{"letter":"E","text":"Retrograde urethrogram."}],"correct":"C","explanation":"<p><strong>Keyed answer: c) Laparotomy and ligation of the internal iliac artery</strong>, per the original exam answer key.</p>\n<p><strong>Disagreement \u2014 this is not well supported by current trauma evidence.</strong> The best-supported answer among the options is <strong>d) Angiography and embolization</strong> (with mechanical stabilization such as a binder/external fixation as the immediate first maneuver and preperitoneal packing as an alternative/adjunct hemostatic technique), but the exam keys this question to c).</p>\n<p>Why the exam&#x27;s answer (c) is problematic: Surgical ligation of the internal iliac (hypogastric) arteries is largely ineffective for traumatic pelvic hemorrhage because of the rich pelvic collateral circulation, and most pelvic bleeding is venous/cancellous rather than from a single ligatable arterial trunk. Recent systematic review of bilateral internal iliac artery ligation in trauma found its effectiveness uncertain, and current guidelines on hemodynamically unstable pelvic fractures do not include it.</p>\n<p>Why (d) is the better answer: For a hemodynamically unstable pelvic fracture refractory to resuscitation, contemporary damage-control management is (1) immediate mechanical pelvic compression/stabilization (binder, then external fixation or C-clamp) to reduce pelvic volume and tamponade venous bleeding, and (2) rapid hemostasis via angioembolization (for arterial extravasation) and/or preperitoneal pelvic packing. Angiography with embolization directly addresses ongoing arterial hemorrhage.</p>\n<p>Why the remaining options are incorrect: ORIF (a) is a definitive orthopedic procedure inappropriate in the crashing patient. External fixation alone (b) controls bony/venous bleeding by reducing pelvic volume but is a stabilization maneuver rather than the definitive hemostatic step for ongoing arterial bleeding \u2014 it is best paired with embolization/packing. Retrograde urethrogram (e) evaluates for urethral injury and does not address life-threatening hemorrhage.</p>\n<p>Background: European trauma guidelines emphasize a bundled approach \u2014 pelvic closure/compression, damage-control resuscitation, and hemostasis by angioembolization and/or preperitoneal packing, with REBOA as a temporizing bridge in extremis.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":44,"stem":"Which of the following chemical carcinogens is associated with bladder cancer?","options":[{"letter":"A","text":"Asbestos."},{"letter":"B","text":"Cadmium."},{"letter":"C","text":"Benzidine."},{"letter":"D","text":"Beryllium."}],"correct":"C","explanation":"<p>Why it is correct: Benzidine is an aromatic amine (arylamine) used historically in the dye industry and is a well-established human bladder carcinogen (IARC/EPA/NTP Group 1). Occupational cohorts of dye workers show dramatically elevated bladder cancer risk (up to 100-fold with heavy arylamine exposure).</p>\n<p>Why the others are incorrect: Asbestos is classically linked to mesothelioma and lung cancer; cadmium is associated with lung (and prostate) cancer; beryllium is associated with lung cancer and berylliosis.</p>\n<p>Background: Other aromatic amines implicated in bladder cancer include 2-naphthylamine and 4-aminobiphenyl. Tobacco smoking remains the single most important risk factor (~50% of cases); occupational arylamine exposure is the second-largest contributor.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":45,"stem":"Burkitt's lymphoma is most commonly associated with which virus?","options":[{"letter":"A","text":"Epstein-Barr virus."},{"letter":"B","text":"HIV."},{"letter":"C","text":"Human papilloma virus."},{"letter":"D","text":"Human T-cell lymphotrophic virus (HTLV)."}],"correct":"A","explanation":"<p>Why it is correct: EBV was the first virus definitively linked to a human cancer \u2014 it was isolated from Burkitt lymphoma in 1964. Endemic (African) Burkitt lymphoma is EBV-positive in &gt;90% of cases; sporadic Burkitt lymphoma is EBV-associated in a minority (~20\u201330%). All variants share the hallmark IG::MYC translocation (t(8;14)).</p>\n<p>Why the others are incorrect: HIV predisposes to lymphomas broadly via immunosuppression but is not the specific oncogenic virus of Burkitt lymphoma. HPV is associated with cervical, anogenital, and oropharyngeal squamous cancers. HTLV-1 causes adult T-cell leukemia/lymphoma.</p>\n<p>Background: Endemic Burkitt lymphoma co-associates with holoendemic Plasmodium falciparum malaria, which impairs T-cell control of EBV-infected B cells.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":46,"stem":"Select the true statement about cancer statistics.","options":[{"letter":"A","text":"Colorectal cancer causes the most yearly deaths in both men and women."},{"letter":"B","text":"Lung cancer is the most commonly diagnosed cancer in men."},{"letter":"C","text":"Lung cancer causes the most yearly deaths in both men and women."},{"letter":"D","text":"Prostate cancer causes the most yearly deaths in men."},{"letter":"E","text":"Breast cancer causes the most yearly deaths in women."}],"correct":"C","explanation":"<p>Why it is correct: Lung cancer is the leading cause of cancer death in both sexes.</p>\n<p>Why the others are incorrect: Colorectal cancer is a leading cause of death but not the top in either sex. The most commonly diagnosed cancer is prostate in men and breast in women \u2014 so (b) is wrong. Prostate cancer is a leading but not the leading cause of male cancer death (lung is), so (d) is wrong. Breast cancer is a leading but not the leading cause of female cancer death (lung is), so (e) is wrong.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":47,"stem":"Which of the following best describes stage III cancer?","options":[{"letter":"A","text":"T2N0M0 breast cancer."},{"letter":"B","text":"T1N1M1 melanoma."},{"letter":"C","text":"T3N2M0 colon cancer."},{"letter":"D","text":"T1SN0M0 breast cancer."},{"letter":"E","text":"T3N1M1 lung cancer."}],"correct":"C","explanation":"<p>Why it is correct: Any node-positive disease without distant metastasis (M0) generally corresponds to stage III. T3N2M0 colon cancer is node-positive, non-metastatic \u2192 stage III.</p>\n<p>Why the others are incorrect: Any M1 (distant metastasis) is stage IV \u2014 this eliminates (b) T1N1M1 and (e) T3N1M1. T2N0M0 breast (a) is node-negative, non-metastatic \u2192 stage I/II. T1(is)N0M0 breast (d) is in-situ/very early \u2192 stage 0/I.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":48,"stem":"Which of the following is true regarding cohort studies?","options":[{"letter":"A","text":"They are usually randomized."},{"letter":"B","text":"They are only retrospective."},{"letter":"C","text":"They are efficient at evaluating rare outcomes."},{"letter":"D","text":"One of its advantages is the ability to assess multiple outcomes."}],"correct":"D","explanation":"<p>Why it is correct: Cohort studies follow groups defined by exposure status and can measure incidence of multiple different outcomes from a single exposure.</p>\n<p>Why the others are incorrect: Cohort studies are observational, not randomized (a). They can be prospective or retrospective, not only retrospective (b). They are inefficient for rare outcomes (a case-control design is preferred for rare outcomes); cohorts are well suited to rare exposures (c).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":49,"stem":"Which of the following is true concerning the correlation coefficient in biostatistics?","options":[{"letter":"A","text":"It measures the strength of the relationship between two variables."},{"letter":"B","text":"It has a value (r) from 0 to 1.0."},{"letter":"C","text":"A value of 1 means there is a poor correlation."},{"letter":"D","text":"Often used to show causality of a disease."}],"correct":"A","explanation":"<p>Why it is correct: The (Pearson) correlation coefficient r quantifies the strength and direction of a linear association between two continuous variables.</p>\n<p>Why the others are incorrect: r ranges from \u22121 to +1, not 0 to 1 (b). A value of \u00b11 indicates a perfect (not poor) linear correlation (c). Correlation does not establish causation (d).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":50,"stem":"Which incision is most appropriate for exposure of a proximal left subclavian artery injury?","options":[{"letter":"A","text":"Median sternotomy."},{"letter":"B","text":"Right anterolateral thoracotomy."},{"letter":"C","text":"Trap door thoracotomy."},{"letter":"D","text":"9th intercostal space posterolateral thoracotomy."},{"letter":"E","text":"Clamshell thoracotomy."}],"correct":"C","explanation":"<p>Why it is correct: The proximal left subclavian artery arises directly from the aortic arch and lies deep behind the clavicle/first rib, making it difficult to expose. The classic approach is the &quot;trap door&quot; \u2014 a combination of a left anterolateral thoracotomy, partial upper median sternotomy, and supraclavicular incision \u2014 providing proximal control and wide exposure.</p>\n<p>Why the others are incorrect: Median sternotomy (a) is ideal for the innominate artery, proximal right subclavian/carotid, and ascending aorta, but gives poor access to the proximal left subclavian. Right anterolateral thoracotomy (b) is used for right-sided/hilar access. A low (9th interspace) posterolateral thoracotomy (d) exposes the descending thoracic aorta/lower chest, not the arch/subclavian origin. Clamshell (e) gives broad bilateral access but is not the targeted incision of choice for isolated proximal left subclavian control.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":51,"stem":"Regarding lower extremity fasciotomies, the following are true:","options":[{"letter":"A","text":"The posterior compartments can be well accessed by a lateral incision."},{"letter":"B","text":"To decompress the deep posterior compartment, the soleus muscle must be detached from the tibia."},{"letter":"C","text":"To decompress the lateral compartment, the fibula must be exposed."},{"letter":"D","text":"The anterior compartment can be accessed through a medial incision."},{"letter":"E","text":"The superficial peroneal nerve can be injured when performing the posterior compartment decompression."}],"correct":"B","explanation":"<p>Why it is correct: In the standard two-incision, four-compartment fasciotomy, the medial incision releases the superficial and deep posterior compartments; adequate deep posterior release requires detaching the soleus origin from the posteromedial tibia to reach the deep compartment fascia (tibialis posterior, FDL, FHL).</p>\n<p>Why the others are incorrect: The lateral incision accesses the anterior and lateral compartments, not the posterior compartments (a). The lateral compartment is decompressed without needing to expose/resect the fibula (fibulectomy is not required) (c). The anterior compartment is released via the lateral (anterolateral) incision, not a medial incision (d). The superficial peroneal nerve is at risk during lateral compartment decompression (it pierces the fascia laterally), not during posterior compartment release (e).</p>\n<p>Background: The leg has four compartments \u2014 anterior, lateral, superficial posterior, and deep posterior. Two incisions (an anterolateral and a posteromedial ~2 cm behind the tibial border) reliably release all four.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":52,"stem":"Which of the following is the most common cause of death in pediatric traumas?","options":[{"letter":"A","text":"Abuse."},{"letter":"B","text":"Head injury."},{"letter":"C","text":"Blunt abdominal injury."},{"letter":"D","text":"House fires."},{"letter":"E","text":"Bicycle accidents."}],"correct":"B","explanation":"<p>Why it is correct: Traumatic brain injury is the leading cause of death in injured children. Anatomically, children have proportionally larger heads and thinner cranial bones, making head injury both common and lethal.</p>\n<p>Why the others are incorrect: Abuse, blunt abdominal injury, house fires, and bicycle-related trauma are important mechanisms/contributors but are not the most common cause of pediatric trauma death.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":53,"stem":"Vitamin C is important for which of the following steps in wound healing?","options":[{"letter":"A","text":"Epithelial proliferation."},{"letter":"B","text":"Production of pre-procollagen."},{"letter":"C","text":"DNA synthesis."},{"letter":"D","text":"Cross-linking of collagen."}],"correct":"D","explanation":"<p>Why it is correct: Ascorbic acid (vitamin C) is an essential cofactor for prolyl and lysyl hydroxylase, the enzymes that hydroxylate proline and lysine residues. Hydroxylation is required for stable triple-helix formation and subsequent collagen cross-linking. Deficiency (scurvy) causes impaired collagen cross-linking, weak scar, and wound breakdown.</p>\n<p>Why the others are incorrect: Epithelial proliferation (a) and DNA synthesis (c) are not the vitamin C-dependent step in question. &quot;Production of pre-procollagen&quot; (b) refers to peptide synthesis; vitamin C acts on the hydroxylation/cross-linking that stabilizes collagen, not on the initial polypeptide production.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":54,"stem":"Which of the following statements about keloid scars is TRUE?","options":[{"letter":"A","text":"Have increased concentration of Type III collagen."},{"letter":"B","text":"Unlikely to recur when surgically excised."},{"letter":"C","text":"Increased glycosaminoglycan concentration."},{"letter":"D","text":"Differentiated from hypertrophic scars by histology."}],"correct":"A","explanation":"<p>Why it is correct: Keloids contain disorganized, abundant collagen with a relatively increased proportion of type III (immature) collagen.</p>\n<p>Why the others are incorrect: Keloids characteristically recur (often worse) after simple excision (b). While keloids do have altered matrix, the classic distinguishing &quot;TRUE&quot; statement selected here is the type III collagen content; and importantly keloids and hypertrophic scars cannot be reliably distinguished by histology alone (they are differentiated clinically \u2014 keloids extend beyond the original wound margins, hypertrophic scars stay within them), which is why (d) is false.</p>\n<p>Background: Keloids extend beyond the original wound borders, are more common in darkly pigmented skin, tend to occur months after injury, and generally do not regress spontaneously.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":55,"stem":"Which of these statements is TRUE about conflict?","options":[{"letter":"A","text":"Conflict is inevitable: to fully take part in social life is to desire, invite and initiate human contact\u2014and contact begets conflict."},{"letter":"B","text":"Conflict is bad: most people should fear conflict and do their best to keep out of it and away from it."},{"letter":"C","text":"Conflict is impossible to resolve because it is not preventable and most of the time escalates."},{"letter":"D","text":"All disagreements escalate into conflicts."},{"letter":"E","text":"Most conflicts should be dealt quickly with professional help such as a lawyer."}],"correct":"A","explanation":"<p>Why it is correct: Conflict-resolution frameworks treat conflict as a normal, inevitable feature of human interaction that, managed constructively, can be productive.</p>\n<p>Why the others are incorrect: (b) frames conflict as inherently bad and to be avoided; (c) claims conflict is unresolvable and usually escalates; (d) overgeneralizes that all disagreements escalate; (e) inappropriately defaults to legal/professional escalation. All contradict standard conflict-resolution principles.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":56,"stem":"There are several approaches to conflicts. Which of these statements describes the avoiding style?","options":[{"letter":"A","text":"This approach is highly aggressive and minimally cooperative."},{"letter":"B","text":"These are the \"my way or the highway\" people."},{"letter":"C","text":"These are the \"head in the sand\" people."},{"letter":"D","text":"It can be used when an issue is of low importance and delay is of no consequence."},{"letter":"E","text":"It satisfies all parties equally."}],"correct":"C","explanation":"<p>Why it is correct: In the Thomas-Kilmann model, the avoiding style is low in both assertiveness and cooperativeness \u2014 the person sidesteps or withdraws from the conflict (&quot;head in the sand&quot;).</p>\n<p>Why the others are incorrect: (a) and (b) describe the competing/forcing style (high assertiveness, low cooperativeness). (d) describes an appropriate use-case for avoiding but is a &quot;when to use&quot; statement, not a description of the style itself \u2014 and the item asks which statement describes the avoiding style. (e) describes an idealized compromising/collaborating outcome.</p>\n<p>Note: Option (d) is a legitimate situational use of avoidance; if the question intends the descriptive characterization of the style, (c) is the best fit.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":57,"stem":"Which of the following equations best describes the sensitivity of a diagnostic test?","options":[{"letter":"A","text":"TN/(TN + FP)."},{"letter":"B","text":"TP/(TP + FN)."},{"letter":"C","text":"TP/(TP + FP)."},{"letter":"D","text":"(TP + FN)/TP."}],"correct":"B","explanation":"<p>Why it is correct: Sensitivity = true positives / all who truly have disease = TP/(TP + FN).</p>\n<p>Why the others are incorrect: TN/(TN + FP) is specificity (a). TP/(TP + FP) is positive predictive value (c). (TP + FN)/TP is not a standard test characteristic (d).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":58,"stem":"Select the grouping of alkylating agents:","options":[{"letter":"A","text":"Cyclophosphamide, Busulfan, Mitomycin C."},{"letter":"B","text":"Chlorambucil, Mitotane, Bleomycin."},{"letter":"C","text":"Paclitaxel, Vinblastine, Cyclophosphamide."},{"letter":"D","text":"Methotrexate, Bleomycin, Mitotane."},{"letter":"E","text":"Doxorubicin, Azathioprine, Gemcitabine."}],"correct":"A","explanation":"<p>Why it is correct: All three act as alkylating (or alkylating-like) agents that cross-link DNA. Cyclophosphamide and busulfan are classic alkylators; mitomycin C is an alkylating-type antibiotic.</p>\n<p>Why the others are incorrect: Each of the other groupings mixes drug classes \u2014 e.g., bleomycin (antitumor antibiotic), mitotane (adrenolytic), paclitaxel/vinblastine/vincristine (plant alkaloids/antimicrotubule), methotrexate/gemcitabine (antimetabolites), doxorubicin (anthracycline), azathioprine (antimetabolite/immunosuppressant). These are not pure alkylating-agent groups.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":59,"stem":"Regarding sentinel lymph node biopsy, select the correct statement:","options":[{"letter":"A","text":"The sentinel lymph node has equal probability of containing metastases as every other node in the basin."},{"letter":"B","text":"Performing sentinel lymph node biopsy in breast cancer improves survival."},{"letter":"C","text":"Sentinel lymph node biopsy identifies all positive lymph nodes."},{"letter":"D","text":"Sentinel lymph node biopsy is the standard of care in the management of melanoma and breast cancer."},{"letter":"E","text":"The false positive rate in sentinel lymph node biopsy is greater than the false negative rate."}],"correct":"D","explanation":"<p>Why it is correct: SLNB is the standard nodal staging procedure for clinically node-negative early breast cancer and for appropriately selected clinically node-negative melanoma, having replaced routine axillary/complete lymph node dissection with far lower morbidity and equivalent survival.</p>\n<p>Why the others are incorrect: The sentinel node is, by definition, the node with the highest probability of harboring metastasis \u2014 not equal to other nodes (a). SLNB is primarily a staging/prognostic tool; it provides regional disease control but has not been proven to improve overall survival (b). SLNB samples the first-echelon node(s) and can miss disease (false negatives ~5%), so it does not identify all positive nodes (c). The false-negative rate exceeds the false-positive rate \u2014 the opposite of (e).</p>\n<p>Background: In melanoma, SLN status is the strongest predictor of survival and guides adjuvant therapy decisions; NCCN recommends discussing/offering SLNB when the risk of a positive node is roughly \u22655\u201310%.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":60,"stem":"Which statement is not included in the WHO Surgical Safety Checklist?","options":[{"letter":"A","text":"Has the patient confirmed consent?"},{"letter":"B","text":"Is the operative site marked?"},{"letter":"C","text":"Does the patient have an allergy?"},{"letter":"D","text":"Has antibiotic prophylaxis been given within 60 minutes of incision?"},{"letter":"E","text":"Amount of local anesthetic used during the procedure."}],"correct":"E","explanation":"<p>Why it is correct: The WHO Surgical Safety Checklist items span three phases (Sign In, Time Out, Sign Out) and include consent confirmation, site marking, allergy check, airway/aspiration risk, anticipated blood loss, and antibiotic prophylaxis within 60 minutes of incision. Documenting the volume of local anesthetic used during the procedure is not a checklist item.</p>\n<p>Why the others are incorrect: (a) consent, (b) site marking, (c) allergy review, and (d) antibiotic prophylaxis timing are all explicit checklist components.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":61,"stem":"What is the primary role of neutrophils in wound healing?","options":[{"letter":"A","text":"Angiogenesis."},{"letter":"B","text":"Cytokines production."},{"letter":"C","text":"Phagocytosis of bacterias and tissue debris."},{"letter":"D","text":"Collagen synthesis."},{"letter":"E","text":"Oxygen radical and nitric oxide synthesis."}],"correct":"C","explanation":"<p>Neutrophils are the first inflammatory cells to arrive at a wound (peaking at day 1\u20132). Their primary function is local phagocytosis and killing of bacteria and digestion of devitalized tissue debris, using reactive oxygen species, cationic peptides, proteases (elastase, cathepsin G), and neutrophil extracellular traps (de Oliveira et al., Nature Reviews Immunology, 2016; Olczyk et al., BioMed Research International, 2013).</p>\n<p>Why the others are wrong:</p>\n<p><strong>a) Angiogenesis</strong> \u2014 a secondary/downstream function, driven mainly by macrophages and endothelial cells (macrophages are the dominant VEGF source, see Q65).</p>\n\n<p><strong>b) Cytokine production</strong> \u2014 neutrophils do release IL-1 and TNF-\u03b1, but this is a supporting, not primary, role.</p>\n\n<p><strong>d) Collagen synthesis</strong> \u2014 this is the fibroblast&#x27;s role (see Q62).</p>\n\n<p><strong>e) Oxygen radical and nitric oxide synthesis</strong> \u2014 the exam key attributes this to macrophages. Neutrophils do generate ROS as part of their bactericidal killing, but the intended &quot;primary role&quot; answer is phagocytosis; the distractor is meant to point to macrophage-predominant sustained ROS/NO production.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":62,"stem":"Which type of cells is responsible for matrix synthesis in wound healing?","options":[{"letter":"A","text":"Macrophages."},{"letter":"B","text":"T lymphocytes."},{"letter":"C","text":"Neutrophils."},{"letter":"D","text":"Fibroblasts."},{"letter":"E","text":"Endothelial cells."}],"correct":"D","explanation":"<p>Fibroblasts are the principal effector cells of the proliferative phase: they synthesize collagen, proteoglycans, and other extracellular matrix components, and later differentiate into myofibroblasts to mediate wound contraction.</p>\n<p>Why the others are wrong:</p>\n<p><strong>a) Macrophages</strong> \u2014 orchestrate healing by secreting growth factors (including VEGF) and cytokines, and perform phagocytosis/efferocytosis, but do not synthesize matrix.</p>\n\n<p><strong>b) T lymphocytes</strong> \u2014 modulate the immune/reparative response; not matrix producers.</p>\n\n<p><strong>c) Neutrophils</strong> \u2014 early debridement/antimicrobial cells (see Q61).</p>\n\n<p><strong>e) Endothelial cells</strong> \u2014 mediate angiogenesis (new vessel formation), not matrix synthesis.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":63,"stem":"Which statement is TRUE about disclosure of errors?","options":[{"letter":"A","text":"Only technical errors are responsible for most errors resulting in complications or death."},{"letter":"B","text":"Mortality and Morbidity conference is a good method for analyzing causes of errors and for developing methods to prevent them."},{"letter":"C","text":"The proceeding of Mortality and Morbidity conference is most of the time shared with patients."},{"letter":"D","text":"Disclosure of errors is consistent with the ethical tenets of openness with the patients and the involvement of patients in their care."},{"letter":"E","text":"Disclosure of errors is not a good method to avoid lawsuits and complaints against surgeons."}],"correct":"D","explanation":"<p>Open, honest disclosure of adverse events and errors is an ethical obligation grounded in respect for patient autonomy and the therapeutic relationship.</p>\n<p>Note: Option (b) is also a defensible true statement in isolation \u2014 M&amp;M conferences are indeed a valuable tool for analyzing error and developing prevention strategies. The exam intends (d) as the best answer because it addresses &quot;disclosure&quot; directly, which is the subject of the question. This is a mild weakness of the item.</p>\n<p>Why the others are wrong:</p>\n<p><strong>a)</strong> Most serious errors are multifactorial (systems, communication, and institutional factors), not solely technical.</p>\n\n<p><strong>c)</strong> M&amp;M proceedings are peer-review/quality-improvement forums and are generally NOT shared with patients (and are often legally protected).</p>\n\n<p><strong>e)</strong> Transparent disclosure and apology programs have been associated with fewer, not more, lawsuits and complaints.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":64,"stem":"Acute local side effects of radiation therapy include the following except:","options":[{"letter":"A","text":"Nausea."},{"letter":"B","text":"Mucositis."},{"letter":"C","text":"Bone necrosis."},{"letter":"D","text":"Sterility."},{"letter":"E","text":"Conjunctivitis."}],"correct":"C","explanation":"<p>Osteoradionecrosis is a LATE (chronic) complication of radiation, resulting from progressive vascular damage and fibrosis over months to years. The question asks for the acute effect that does NOT belong.</p>\n<p>Why the others are wrong (all are acute effects):</p>\n<p><strong>a) Nausea</strong> \u2014 acute, especially with abdominal/pelvic or cranial fields.</p>\n\n<p><strong>b) Mucositis</strong> \u2014 a hallmark acute effect on rapidly dividing mucosal epithelium.</p>\n\n<p><strong>d) Sterility</strong> \u2014 gonadal tissue is highly radiosensitive; impaired spermatogenesis/oogenesis occurs acutely.</p>\n\n<p><strong>e) Conjunctivitis</strong> \u2014 an acute reaction of ocular mucosa within the treatment field.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":65,"stem":"During the proliferative phase of wound healing, which type of cells is the major source of vascular endothelial growth factor (VEGF) promoting angiogenesis?","options":[{"letter":"A","text":"Endothelial cells."},{"letter":"B","text":"B lymphocytes."},{"letter":"C","text":"Neutrophils."},{"letter":"D","text":"Macrophages."},{"letter":"E","text":"Fibroblasts."}],"correct":"D","explanation":"<p>Macrophages are the dominant source of VEGF driving angiogenesis during the proliferative phase, secreting a broad array of pro-angiogenic and reparative growth factors.</p>\n<p>Why the others are wrong:</p>\n<p><strong>a) Endothelial cells</strong> \u2014 respond to VEGF (they carry the VEGF receptors and form new vessels) but are not the major producing cell.</p>\n\n<p><strong>b) B lymphocytes and c) Neutrophils</strong> \u2014 do not meaningfully produce VEGF (neutrophils can release some ECM-bound VEGF, but are not the major source).</p>\n\n<p><strong>e) Fibroblasts</strong> \u2014 produce lesser amounts of VEGF than macrophages.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":66,"stem":"Which of these statements is TRUE about keloids?","options":[{"letter":"A","text":"Keloids are 50 times more common in darker pigmented ethnicities (African, Spanish and Asian)."},{"letter":"B","text":"Keloids tend to occur three weeks after the initial insult."},{"letter":"C","text":"Keloids can occur after injections, tattoos and acne."},{"letter":"D","text":"Keloids usually regress spontaneously after one year."},{"letter":"E","text":"Keloids are more prevalent than hypertrophic scars."}],"correct":"C","explanation":"<p>Keloids can form after any dermal injury, including minor ones such as injections, tattoos, ear piercing, and acne.</p>\n<p>Why the others are wrong:</p>\n<p><strong>a)</strong> Keloids are roughly 15\u00d7 (not 50\u00d7) more common in darker-pigmented individuals.</p>\n\n<p><strong>b)</strong> They typically appear ~3 months (not 3 weeks) after the insult.</p>\n\n<p><strong>d)</strong> Keloids characteristically do NOT regress spontaneously and tend to recur after excision.</p>\n\n<p><strong>e)</strong> Hypertrophic scars are more prevalent than keloids.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":67,"stem":"Which of the following chemotherapeutic agents is a plant alkaloid?","options":[{"letter":"A","text":"Cyclophosphamide."},{"letter":"B","text":"Bleomycin."},{"letter":"C","text":"Azathioprine."},{"letter":"D","text":"Vincristine."}],"correct":"D","explanation":"<p>Vincristine is a vinca (plant) alkaloid derived from Catharanthus roseus; it disrupts microtubule assembly, arresting cells in metaphase.</p>\n<p>Why the others are wrong:</p>\n<p><strong>a) Cyclophosphamide</strong> \u2014 an alkylating agent.</p>\n\n<p><strong>b) Bleomycin</strong> \u2014 an antitumor antibiotic that causes DNA strand breaks.</p>\n\n<p><strong>c) Azathioprine</strong> \u2014 a purine antimetabolite/immunosuppressant, not an antineoplastic plant alkaloid.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":68,"stem":"Carcinoembryonic Antigen (CEA) is a tumour marker most commonly used for the management of which type of cancer?","options":[{"letter":"A","text":"Colorectal."},{"letter":"B","text":"Gastric."},{"letter":"C","text":"Germ cell tumours of the ovary and testis."},{"letter":"D","text":"Kidney."}],"correct":"A","explanation":"<p>CEA is the standard tumor marker for colorectal cancer \u2014 used for prognosis, postoperative surveillance for recurrence, and monitoring response to therapy in metastatic disease. It is not a screening test.</p>\n<p>Why the others are wrong:</p>\n<p><strong>b) Gastric</strong> \u2014 CA 19-9 and CEA may be elevated, but CEA is not the defining marker.</p>\n\n<p><strong>c) Germ cell tumors</strong> \u2014 markers are AFP, \u03b2-hCG, and LDH.</p>\n\n<p><strong>d) Kidney</strong> \u2014 renal cell carcinoma has no established serum tumor marker in routine use.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":69,"stem":"Which of the following is not caused by a mutation in collagen production?","options":[{"letter":"A","text":"Ehlers-Danlos syndrome."},{"letter":"B","text":"Marfan Syndrome."},{"letter":"C","text":"Osteogenesis Imperfecta."},{"letter":"D","text":"Cutis Laxia."}],"correct":"D","explanation":"<p>Cutis laxa is caused by defects in elastic fiber components (e.g., elastin/ELN, fibulin), not collagen, so (d) is a correct &quot;not collagen&quot; answer.</p>\n<p>Note that we disagree with this being a clean single-answer question: <strong>Marfan syndrome (b) is also NOT a collagen disorder</strong> \u2014 it is caused by mutations in fibrillin-1 (FBN1), a component of elastic microfibrils. Only Ehlers-Danlos syndrome (most types) and osteogenesis imperfecta (type I collagen) are true collagen-synthesis disorders. Both (b) and (d) are technically correct answers to the question as written. If forced to pick the single &quot;most correct&quot; answer intended by the exam, (d) Cutis Laxia is defensible, but the item should be flagged.</p>\n<p>Why the true collagen disorders are wrong choices:</p>\n<p><strong>a) Ehlers-Danlos</strong> \u2014 defects in collagen synthesis/structure (multiple types).</p>\n\n<p><strong>c) Osteogenesis Imperfecta</strong> \u2014 type I collagen defect.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":70,"stem":"Which of the following treatments should NOT be used to improve a hypertrophic scar 2 months after primary closure of an incision?","options":[{"letter":"A","text":"Re-excise and closure."},{"letter":"B","text":"Silicone Gel Sheeting."},{"letter":"C","text":"Pressure."},{"letter":"D","text":"Corticosteroid injections."}],"correct":"A","explanation":"<p>At only 2 months, the scar is still remodeling and may improve substantially over the following 12+ months. Early surgical re-excision is premature and risks producing an equal or worse scar. First-line conservative measures should be used and surgery deferred (generally \u22651 year).</p>\n<p>Why the others are appropriate first-line measures:</p>\n<p><strong>b) Silicone gel sheeting</strong>, <strong>c) Pressure therapy</strong>, and <strong>d) Intralesional corticosteroid injections</strong> are all standard non-operative treatments for hypertrophic scars.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":71,"stem":"The Major Histocompatibility Complex (MHC):","options":[{"letter":"A","text":"Occurs on the 7th Human Chromosome."},{"letter":"B","text":"Assists in process of antigen presentation."},{"letter":"C","text":"There are 3 classes of MHC \u2014 Class I, II and III important in transplantation."},{"letter":"D","text":"MHC molecules are only important in transplanted tissues and the body's response to them."}],"correct":"B","explanation":"<p>The core biological function of MHC molecules is to present peptide antigens to T cells (MHC class I to CD8+ T cells, class II to CD4+ T cells).</p>\n<p>Why the others are wrong:</p>\n<p><strong>a)</strong> The MHC (HLA) locus is on chromosome 6, not 7.</p>\n\n<p><strong>c)</strong> Although three classes exist, only class I and class II are the molecules directly relevant to transplant rejection/matching; class III encodes other immune proteins (e.g., complement) and is not central to transplantation.</p>\n\n<p><strong>d)</strong> MHC molecules are fundamental to all normal immune responses, not just transplant biology.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":72,"stem":"Which is not a stated goal in Rivers' protocol (goal-directed therapy)?","options":[{"letter":"A","text":"CVP between 8 \u2014 12 (12-15 if mechanically ventilated)."},{"letter":"B","text":"MAP > 65."},{"letter":"C","text":"SpO2 > 70%."},{"letter":"D","text":"Hgb > 100."}],"correct":"D","explanation":"<p>The Rivers early goal-directed therapy (EGDT) protocol targets, in sequence within the first 6 hours: CVP 8\u201312 mmHg (12\u201315 if ventilated), MAP \u226565 mmHg, urine output \u22650.5 mL/kg/h, and central venous oxygen saturation (ScvO\u2082) \u226570%. Red-cell transfusion to a hematocrit \u226530% is used ONLY if ScvO\u2082 remains &lt;70% after CVP and MAP goals are met \u2014 so a hemoglobin &gt;100 is not an independent stated goal (Rivers et al., NEJM, 2001).</p>\n<p>Note on wording: option (c) reads &quot;SpO2 &gt;70%,&quot; which is not a Rivers target as written (normal SpO\u2082 is &gt;95%). The item almost certainly intends &quot;ScvO\u2082 &gt;70%,&quot; which IS a Rivers goal; read that way, (c) is a valid protocol target and (d) is the intended odd-one-out. The typo makes the item imprecise, but the intended answer (d) stands because hemoglobin/hematocrit is only a conditional, downstream target.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":73,"stem":"Which is not a clinical sign that characterizes MODS?","options":[{"letter":"A","text":"Respiratory distress."},{"letter":"B","text":"Renal failure."},{"letter":"C","text":"Increased cardiac output."},{"letter":"D","text":"Decreased SVR."},{"letter":"E","text":"Increased SVR."}],"correct":"E","explanation":"<p>Multiple organ dysfunction syndrome (MODS), driven by a systemic inflammatory/distributive process, produces a hyperdynamic circulation: increased cardiac output with DECREASED systemic vascular resistance. An increased SVR is the opposite of the expected pattern.</p>\n<p>Why the others are wrong (all are features of MODS):</p>\n<p><strong>a) Respiratory distress</strong> (ARDS is a common component).</p>\n\n<p><strong>b) Renal failure</strong> (acute kidney injury).</p>\n\n<p><strong>c) Increased cardiac output</strong> \u2014 the hyperdynamic state.</p>\n\n<p><strong>d) Decreased SVR</strong> \u2014 the hallmark of distributive physiology.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":74,"stem":"Which of the following statements are true with regard to informed consent?","options":[{"letter":"A","text":"Consent should be obtained by the person doing the operation."},{"letter":"B","text":"Written communication material must always be in English."},{"letter":"C","text":"All possible risks, however remote the chance, should be explained in detail."},{"letter":"D","text":"Legally, a signed consent from a patient is proof that valid consent has been properly obtained."}],"correct":"A","explanation":"<p>Ideally, informed consent is obtained by the operator (or someone with equivalent knowledge of the procedure) who can accurately discuss the risks, benefits, and alternatives.</p>\n<p>Why the others are wrong:</p>\n<p><strong>b)</strong> Consent materials/discussion must be in a language the patient understands (interpreters/translated materials as needed) \u2014 not necessarily English.</p>\n\n<p><strong>c)</strong> Consent requires disclosure of material risks (those a reasonable patient would want to know), not every remotely possible risk.</p>\n\n<p><strong>d)</strong> A signed form is documentation, not proof, of valid consent; valid consent requires capacity, voluntariness, disclosure, and understanding \u2014 the signature alone does not establish these.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":75,"stem":"In a 55 year old with hypertension only, which of these preoperative screening tests is NOT a consensus recommendation?","options":[{"letter":"A","text":"Electrocardiogram."},{"letter":"B","text":"Coagulation studies."},{"letter":"C","text":"Creatinine."},{"letter":"D","text":"Urinalysis."}],"correct":"B","explanation":"<p>Routine coagulation testing (PT/PTT/INR) is NOT recommended in the absence of a bleeding history, anticoagulant use, or liver disease \u2014 it has low yield and does not predict surgical bleeding. Guidelines for hypertension work-up recommend basic labs (electrolytes, creatinine/eGFR, urinalysis) and an ECG, but not routine coagulation panels (Whelton et al., JACC, 2022).</p>\n<p>Why the others are reasonable/consensus:</p>\n<p><strong>a) ECG</strong> \u2014 appropriate in a 55-year-old with hypertension (assesses LV hypertrophy, ischemia, baseline).</p>\n\n<p><strong>c) Creatinine</strong> \u2014 part of standard hypertension evaluation and perioperative risk assessment.</p>\n\n<p><strong>d) Urinalysis</strong> \u2014 part of the routine hypertension work-up for hypertension-mediated organ damage.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":76,"stem":"What is the first step in the treatment of malignant hyperthermia occurring during a surgical procedure?","options":[{"letter":"A","text":"Complete the planned surgical procedure as quickly as possible."},{"letter":"B","text":"Administer dantrolene intravenously."},{"letter":"C","text":"Stop all volatile anesthetics."},{"letter":"D","text":"Administer a calcium channel blocker."},{"letter":"E","text":"Draw bloodwork for genetic testing for a mutation in the ryanodine receptor gene."}],"correct":"C","explanation":"<p>The immediate first action on recognizing malignant hyperthermia is to discontinue all triggering agents \u2014 volatile anesthetics and succinylcholine \u2014 while calling for help and hyperventilating with 100% oxygen. IV dantrolene is the definitive/targeted therapy and must be given as early as possible, but &quot;stopping the triggers&quot; is the very first step (GeneReviews, Nonsyndromic MH Susceptibility, 2025; Dantrium FDA label).</p>\n<p>Why the others are wrong:</p>\n<p><strong>a)</strong> The procedure should be halted/concluded as rapidly as safely possible, not pushed forward; managing the crisis takes priority.</p>\n\n<p><strong>b) Dantrolene</strong> \u2014 the essential targeted treatment, but it follows/accompanies stopping triggers; the question asks the FIRST step.</p>\n\n<p><strong>d) Calcium channel blockers are contraindicated</strong> \u2014 combined with dantrolene they can cause life-threatening hyperkalemia and cardiovascular collapse.</p>\n\n<p><strong>e)</strong> Genetic/confirmatory testing is a later, non-urgent step and has no role in acute management.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":77,"stem":"The leading cause of perioperative death in elderly surgical patients is:","options":[{"letter":"A","text":"Infections (including iatrogenic)."},{"letter":"B","text":"Postoperative delirium."},{"letter":"C","text":"Surgical errors (eg. retained foreign body, accidental organ or vessel injury)."},{"letter":"D","text":"Cardiac complications."},{"letter":"E","text":"Trauma."}],"correct":"D","explanation":"<p>Cardiovascular events (perioperative myocardial infarction/injury, arrhythmia, heart failure) are the leading cause of perioperative mortality in elderly patients, reflecting the high prevalence of cardiovascular disease with age and the hemodynamic stress of surgery (Smilowitz &amp; Berger, JAMA, 2020).</p>\n<p>Why the others are wrong:</p>\n<p><strong>a) Infections</strong> \u2014 an important cause of morbidity/mortality but not the leading one.</p>\n\n<p><strong>b) Postoperative delirium</strong> \u2014 common and associated with worse outcomes, but not the direct leading cause of death.</p>\n\n<p><strong>c) Surgical errors</strong> \u2014 a much less common contributor to overall perioperative mortality.</p>\n\n<p><strong>e) Trauma</strong> \u2014 not a perioperative cause of death in this elective/surgical context.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":78,"stem":"A 60 year patient has bacteremia associated with a red, tender intravenous site. The most likely pathogen is:","options":[{"letter":"A","text":"E. coli."},{"letter":"B","text":"Candida albicans."},{"letter":"C","text":"S. aureus."},{"letter":"D","text":"S. viridans."},{"letter":"E","text":"C. perfringens."}],"correct":"C","explanation":"<p>A red, tender peripheral IV site with bacteremia indicates a catheter-related/skin-flora infection. Staphylococcus aureus (along with coagulase-negative staphylococci) is the most common pathogen in catheter-associated bloodstream infection and suppurative thrombophlebitis.</p>\n<p>Why the others are wrong:</p>\n<p><strong>a) E. coli</strong> \u2014 a gut/urinary organism, not the typical skin/line source.</p>\n\n<p><strong>b) Candida albicans</strong> \u2014 associated with prolonged central lines, TPN, broad-spectrum antibiotics, and immunosuppression, not a simple red peripheral site.</p>\n\n<p><strong>d) S. viridans</strong> \u2014 oral flora linked to endocarditis, not IV-site infection.</p>\n\n<p><strong>e) C. perfringens</strong> \u2014 cause of gas gangrene/clostridial myonecrosis, not line sepsis.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":79,"stem":"A 60-year patient has bacteremia associated with a red, tender intravenous site. After removal of the cannula, and treatment with antibiotics, the area of redness and bacteremia persists. The next best step is:","options":[{"letter":"A","text":"Removal of the affected vein."},{"letter":"B","text":"Incision and drainage of the area of redness."},{"letter":"C","text":"Change antibiotics."},{"letter":"D","text":"Anti-coagulation."},{"letter":"E","text":"Placement of port-a-cath for long term antibiotics."}],"correct":"A","explanation":"<p>Persistent bacteremia and local inflammation despite catheter removal and appropriate antibiotics indicates suppurative (septic) thrombophlebitis \u2014 the infected, thrombosed vein has become a walled-off nidus. Surgical excision of the involved vein segment is the definitive treatment.</p>\n<p>Why the others are wrong:</p>\n<p><strong>b) Incision and drainage</strong> \u2014 inadequate; the source is the infected intraluminal thrombus, not a drainable abscess.</p>\n\n<p><strong>c) Change antibiotics</strong> \u2014 the infection persists because of the anatomic nidus; source control (venectomy), not antibiotic switching, is required.</p>\n\n<p><strong>d) Anticoagulation</strong> \u2014 adjunctive at best; does not eradicate the infected thrombus.</p>\n\n<p><strong>e) Port-a-cath</strong> \u2014 inappropriate; placing new hardware does not address the septic focus.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":80,"stem":"The risk of leak from using a new type of staples is 1 out of 50, the risk with the control group of staples is 4 out of 100. What is the absolute risk reduction?","options":[{"letter":"A","text":"0.02."},{"letter":"B","text":"0.04."},{"letter":"C","text":"0.03."},{"letter":"D","text":"0.01."},{"letter":"E","text":"0.50."}],"correct":"A","explanation":"<p>Absolute risk reduction (ARR) = (control event rate) \u2212 (experimental event rate).</p>\n<p>Control (old staples): 4/100 = 0.04</p>\n\n<p>Experimental (new staples): 1/50 = 0.02</p>\n\n<p>ARR = 0.04 \u2212 0.02 = <strong>0.02</strong></p>\n<p>Why the others are wrong:</p>\n<p><strong>b) 0.04</strong> \u2014 the control event rate alone, not the difference.</p>\n\n<p><strong>c) 0.03</strong> \u2014 not derived from the data.</p>\n\n<p><strong>d) 0.01</strong> \u2014 not derived from the data.</p>\n\n<p><strong>e) 0.50</strong> \u2014 this is the relative risk reduction (RRR = ARR/CER = 0.02/0.04 = 50%), a different measure.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":81,"stem":"Rejection of Allograft in Transplantation:","options":[{"letter":"A","text":"Occurs only through the direct response."},{"letter":"B","text":"Can never be reversed if it occurs."},{"letter":"C","text":"T cells are responsible for rejection and are alloreactive."},{"letter":"D","text":"T cell treatments for rejection are preventative approximately 90% of the time."}],"correct":"C","explanation":"<p>T lymphocytes are the central effectors of allograft rejection. Recipient T cells recognize donor alloantigen and become alloreactive, driving acute cellular rejection; this is why calcineurin inhibitors and other T-cell\u2013directed agents are the backbone of immunosuppression (Sabiston, Ch. 26).</p>\n<p>Why the others are incorrect:</p>\n<p><strong>a)</strong> Allorecognition occurs through both the direct pathway (recipient T cells recognizing intact donor MHC on donor APCs) and the indirect pathway (recipient APCs presenting processed donor peptide). Stating &quot;direct&quot; alone is incomplete \u2014 the exam key notes the answer is direct and indirect.</p>\n\n<p><strong>b)</strong> Acute rejection is frequently reversible with augmented immunosuppression; it is the one form that can typically be reversed (hyperacute and chronic rejection generally cannot).</p>\n\n<p><strong>d)</strong> T-cell\u2013directed treatment reverses/prevents rejection roughly 70% of the time per the exam&#x27;s referenced source, not 90%.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":82,"stem":"Azathioprine is used as an immunosuppressive and it:","options":[{"letter":"A","text":"It targets cells undergoing cell death."},{"letter":"B","text":"It is a adenine analogue."},{"letter":"C","text":"It is used on its own as an immunosuppressive."},{"letter":"D","text":"It undergoes hepatic conversion with several metabolites."}],"correct":"D","explanation":"<p>Azathioprine is a prodrug that is metabolized (non-enzymatically and hepatically) to 6-mercaptopurine and then to several active thiopurine metabolites (including 6-thioguanine nucleotides), which incorporate into DNA and inhibit purine synthesis in rapidly dividing lymphocytes.</p>\n<p>Why the others are incorrect:</p>\n<p><strong>a)</strong> It targets rapidly dividing/proliferating cells, not cells already undergoing cell death.</p>\n\n<p><strong>b)</strong> It is a <strong>purine analogue</strong> (a 6-mercaptopurine prodrug), not an adenine analogue.</p>\n\n<p><strong>c)</strong> It is used as maintenance immunosuppression, generally in combination with other agents, not on its own.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":83,"stem":"Which of the following descriptions is true:","options":[{"letter":"A","text":"A porcine liver transplanted into a dog is an allotransplant."},{"letter":"B","text":"A kidney transplanted from one identical twin to another is an orthotopic Transplant."},{"letter":"C","text":"A cadaveric heart transplanted into a patient is a heterotopic transplant."},{"letter":"D","text":"A living-donor liver transplant from a parent to a child is an orthotopic transplant."},{"letter":"E","text":"A non-related living-donor kidney transplant is a xenotransplant."}],"correct":"D","explanation":"<p>Orthotopic means the graft is placed in the normal anatomic position; a partial liver graft placed in the hepatic bed is orthotopic (Schwartz 10e, Ch. 11).</p>\n<p>Why the others are incorrect:</p>\n<p><strong>a)</strong> Pig-to-dog is cross-species \u2014 a <strong>xenotransplant</strong>, not an allotransplant.</p>\n\n<p><strong>b)</strong> Identical-twin (genetically identical) transfer is an <strong>isograft/syngeneic</strong> transplant; &quot;orthotopic&quot; describes location, not donor relationship, and a kidney is typically placed <strong>heterotopically</strong> (iliac fossa).</p>\n\n<p><strong>c)</strong> A standard cadaveric heart transplant is <strong>orthotopic</strong> (native heart removed, donor heart placed in its position).</p>\n\n<p><strong>e)</strong> A non-related human-to-human kidney is an <strong>allotransplant</strong>, not a xenotransplant.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":84,"stem":"A 22 year old patient takes prednisone 10mg per day as immunosuppression for a kidney transplant 5 years prior. He is scheduled to undergo minor outpatient surgery (eg. inguinal hernia repair). What is the appropriate preop steroid order.","options":[{"letter":"A","text":"Patient is NPO, hold all oral medications."},{"letter":"B","text":"Take regular prednisone dose with a sip of water on the morning of surgery."},{"letter":"C","text":"Solumedrol (methylprednisolone) 50mg IV x 1 preoperatively."},{"letter":"D","text":"Solucortef (hydrocortisone) 100mg IV x 1 preoperatively."}],"correct":"B","explanation":"<p>For minor/low-stress surgery, a patient on chronic low-dose glucocorticoids should simply continue their usual maintenance dose on the morning of surgery. Supraphysiologic &quot;stress-dose&quot; steroids are not required for minor procedures and add risk (hyperglycemia, impaired wound healing, infection).</p>\n<p>Why the others are incorrect:</p>\n<p><strong>a)</strong> Chronic glucocorticoids must not be abruptly withheld \u2014 doing so risks adrenal insufficiency.</p>\n\n<p><strong>c) and d)</strong> IV stress-dose steroids are reserved for moderate-to-major surgical stress, not a minor outpatient hernia repair; giving them here is unnecessary over-treatment.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":85,"stem":"You have noticed that you have seen the same complication in a number of laparoscopic surgeries; It has not been previously described that you could find. You decide to report these. What format would you use?","options":[{"letter":"A","text":"Case report."},{"letter":"B","text":"Randomized control trial."},{"letter":"C","text":"Case series."},{"letter":"D","text":"Retrospective cohort study."},{"letter":"E","text":"Cross sectional survey."}],"correct":"C","explanation":"<p>A collection of multiple similar cases with no comparison/control group and no formal exposure-outcome cohort structure is, by definition, a case series \u2014 the appropriate format for describing a newly observed, not-previously-reported pattern across several patients.</p>\n<p>Why the others are incorrect:</p>\n<p><strong>a)</strong> A case report describes a single patient; here there are several.</p>\n\n<p><strong>b)</strong> An RCT requires randomization to intervention vs control \u2014 not applicable to reporting an observed complication.</p>\n\n<p><strong>d)</strong> A retrospective cohort defines groups by exposure and follows for outcomes with comparison \u2014 more structured than what is described.</p>\n\n<p><strong>e)</strong> A cross-sectional survey measures exposures/outcomes at a single point in a population, not a series of index cases.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":86,"stem":"Which is not one of the 3 key points in the definition of shock?","options":[{"letter":"A","text":"Inadequate tissue perfusion."},{"letter":"B","text":"Decreased oxygen carrying capacity."},{"letter":"C","text":"Decreased delivery of required metabolic substrates."},{"letter":"D","text":"Inadequate removal of cellular waste products."}],"correct":"B","explanation":"<p>Shock is fundamentally a state of inadequate tissue/cellular perfusion \u2014 insufficient delivery of oxygen and metabolic substrates and inadequate removal of waste products. Decreased oxygen-carrying capacity (e.g., anemia) is one possible contributor to impaired delivery but is not part of the core definition of shock.</p>\n<p>Why the others are incorrect:</p>\n<p><strong>a), c), d)</strong> are the three defining elements of shock as a perfusion/delivery failure.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":87,"stem":"Which is not one of the 3 key steps in the pathophysiology of shock?","options":[{"letter":"A","text":"Initial drive = tissue hypoperfusion."},{"letter":"B","text":"Imbalance between cellular supply and demand."},{"letter":"C","text":"Inadequate temperature regulation."},{"letter":"D","text":"Neuroendocrine and inflammatory response specific to type of shock."}],"correct":"C","explanation":"<p>The pathophysiologic sequence of shock is: an initiating insult causing tissue hypoperfusion, a resulting imbalance between cellular oxygen/substrate supply and demand, and a neuroendocrine/inflammatory response specific to the shock type. Temperature dysregulation is not one of these core steps.</p>\n<p>Why the others are incorrect:</p>\n<p><strong>a), b), d)</strong> are the three recognized pathophysiologic steps.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":88,"stem":"Three-week old male who has lost weight, approximately 0.4 kgs (4.0 kgs to 3.6 kgs). Examination finds his anterior fontanels flattened and his mucous membranes dry. Laboratory data are as follows: Na 132, K 3.2, Cl 91, CO2 28, Capillary pH 7.47. This patient is suffering from which of the following acid-base disorders?","options":[{"letter":"A","text":"None."},{"letter":"B","text":"Metabolic alkalosis."},{"letter":"C","text":"Respiratory alkalosis."},{"letter":"D","text":"Compensated metabolic acidosis."}],"correct":"B","explanation":"<p>High pH (7.47) with an elevated bicarbonate/CO2 content (28) indicates a <strong>metabolic alkalosis</strong>. In a dehydrated 3-week-old with weight loss, hypochloremia (Cl 91) and hypokalemia (K 3.2), this is the classic hypochloremic, hypokalemic metabolic alkalosis of <strong>hypertrophic pyloric stenosis</strong> from recurrent vomiting of gastric HCl.</p>\n<p>Why the others are incorrect:</p>\n<p><strong>a)</strong> The pH and bicarbonate are clearly abnormal.</p>\n\n<p><strong>c)</strong> A respiratory alkalosis would show a <strong>low</strong> PaCO2 as the primary derangement; here the elevated CO2 content reflects elevated bicarbonate.</p>\n\n<p><strong>d)</strong> In metabolic acidosis the pH would be low (&lt;7.35); this pH is alkalemic.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":89,"stem":"A 75 year old man is recovery from surgery following a hip fracture. Gases are drawn by the RT. Ph 7.33, HCO3 23 mEq/L, PaCO2 46 mmHg. What is the acid / base abnormality?","options":[{"letter":"A","text":"Metabolic acidosis without compensation."},{"letter":"B","text":"Respiratory acidosis without compensation."},{"letter":"C","text":"Respiratory acidosis with metabolic compensation."},{"letter":"D","text":"Metabolic alkalosis with respiratory compensation."}],"correct":"B","explanation":"<p>Low pH (7.33) with an elevated PaCO2 (46) and a normal bicarbonate (23) defines an <strong>acute (uncompensated) respiratory acidosis</strong> \u2014 consistent with post-operative hypoventilation (opioids, splinting, atelectasis) in an elderly hip-fracture patient.</p>\n<p>Why the others are incorrect:</p>\n<p><strong>a)</strong> Metabolic acidosis would show a <strong>low</strong> HCO3, which is not present.</p>\n\n<p><strong>c)</strong> Metabolic compensation would raise the bicarbonate above normal; here HCO3 is still normal, indicating the process is acute/uncompensated.</p>\n\n<p><strong>d)</strong> The pH is acidemic, not alkalemic, so this is not a metabolic alkalosis.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":90,"stem":"A cirrhotic patient has the following values on preoperative assessment: Slight ascites, Bilirubin 34 \u03bcmol/L, 31 g/L [albumin], INR 2.1. How should one approach surgery in this situation?","options":[{"letter":"A","text":"Patient has Child-Pugh Class A cirrhosis, therefore proceed with surgery."},{"letter":"B","text":"Patient has Child-Pugh Class B cirrhosis, therefore proceed with surgery."},{"letter":"C","text":"Patient has Child-Pugh Class B cirrhosis, therefore proceed with caution if necessary."},{"letter":"D","text":"Patient has Child-Pugh Class C cirrhosis, therefore consider alternatives to surgery."}],"correct":"C","explanation":"<p>Scoring the Child-Pugh components: bilirubin 34 \u00b5mol/L (~2.0 mg/dL) \u2248 2 points, albumin 31 g/L (28\u201335) = 2 points, INR 2.1 (1.7\u20132.3) = 2 points, slight/mild ascites = 2 points, and no encephalopathy = 1 point \u2192 total \u2248 9 points = <strong>Child-Pugh Class B</strong> (7\u20139 points). Class B carries substantially increased perioperative morbidity and mortality, so elective surgery should proceed only with caution when necessary, after optimization.</p>\n<p>Why the others are incorrect:</p>\n<p><strong>a)</strong> The scored total exceeds the Class A range (5\u20136 points).</p>\n\n<p><strong>b)</strong> Correctly identifies Class B but understates the risk \u2014 Class B patients are not simply cleared to &quot;proceed.&quot;</p>\n\n<p><strong>d)</strong> Class C is \u226510 points; this patient scores in the Class B range.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":91,"stem":"Regarding common herbal medicines, which of the following recommendations are true?","options":[{"letter":"A","text":"Gingko should be discontinued at least 7 days before surgery due to an increased risk of hypoglycemia."},{"letter":"B","text":"Garlic should be discontinued 24 hours before surgery due to an increased risk of bleeding."},{"letter":"C","text":"Echinacea should be discontinued at least 7 days before surgery due to induction of the cytochrome p450 enzyme system."},{"letter":"D","text":"St. John's Wort should be discontinued at least 7 days before surgery due to induction of the cytochrome p450 enzyme system."}],"correct":"D","explanation":"<p>St. John&#x27;s Wort is a potent inducer of cytochrome P450 (notably CYP3A4) and P-glycoprotein, which accelerates metabolism of many perioperative drugs (including cyclosporine, warfarin, and others); the ASA recommends discontinuation at least 5 days (commonly cited as ~7 days) before surgery.</p>\n<p>Why the others are incorrect:</p>\n<p><strong>a)</strong> Ginkgo&#x27;s perioperative concern is <strong>increased bleeding</strong> (platelet-activating factor inhibition), not hypoglycemia; it should be stopped ~36 hours before surgery.</p>\n\n<p><strong>b)</strong> Garlic increases bleeding risk but should be discontinued <strong>at least ~7 days</strong> preoperatively, not 24 hours.</p>\n\n<p><strong>c)</strong> Echinacea&#x27;s concerns are allergic reactions and immunomodulation (and possible hepatotoxicity/impaired healing), not P450 induction; there is no specific pre-op discontinuation interval established, and it is not a P450 inducer.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":92,"stem":"Which of the following patients should be referred for preoperative cardiac assessment prior to major elective non-cardiac surgery:","options":[{"letter":"A","text":"A 42 year old male with a 20-pack-year smoking history."},{"letter":"B","text":"A 70 year old female with lower chest pain on deep inspiration, reproducible when palpating the costal margin."},{"letter":"C","text":"65 year old male who underwent CABG 5 years ago and is now asymptomatic."},{"letter":"D","text":"A 73 year old female who sometimes has angina when climbing one flight of stairs."},{"letter":"E","text":"A 55 year old obese male who requires a CPAP machine at night."}],"correct":"D","explanation":"<p>This patient has both <strong>active anginal symptoms</strong> and <strong>poor functional capacity</strong> (unable to climb one flight without symptoms \u2192 &lt;4 METs). Under the stepwise perioperative framework, a patient at elevated risk with symptomatic ischemia and poor functional capacity warrants further cardiac evaluation before major elective surgery, especially if the results would change management.[61][62]</p>\n<p>Why the others are incorrect:</p>\n<p><strong>a)</strong> An isolated smoking history without cardiac symptoms or established disease is not itself an indication for preoperative cardiac testing.</p>\n\n<p><strong>b)</strong> Reproducible chest wall pain on palpation is musculoskeletal (costochondral), not cardiac.</p>\n\n<p><strong>c)</strong> An asymptomatic patient with prior revascularization and preserved functional capacity generally does not need further testing; routine revascularization/testing does not reduce perioperative risk.[61]</p>\n\n<p><strong>e)</strong> Obesity and OSA warrant airway/pulmonary planning but are not, by themselves, indications for a formal preoperative <strong>cardiac</strong> workup.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":93,"stem":"A 70 year old male patient is admitted for urgent surgery (on the emergency list, to be done within the next 24 hours). In which of the following scenarios should beta blocker be ordered prior to his surgery:","options":[{"letter":"A","text":"The patient has a history of stable angina, and at home he takes metoprolol 25mg BID."},{"letter":"B","text":"The patient has a history of hypertension which is well controlled with a thiazide diuretic."},{"letter":"C","text":"The patient is tachycardic (HR 110, regular) due to preoperative pain."},{"letter":"D","text":"All of the above patients should be treated with pre-op beta blocker."},{"letter":"E","text":"None of the above patients should be given a beta blocker preoperatively because they are NPO (nil per os)."}],"correct":"A","explanation":"<p>Patients already on chronic beta-blocker therapy should have it <strong>continued</strong> through the perioperative period; abrupt withdrawal risks rebound tachycardia, ischemia, and arrhythmia. The evidence cautions strongly against <strong>starting</strong> high-dose beta-blockade de novo just before surgery (increased stroke and mortality), so the correct scenario is the patient who is already established on the drug.[61]</p>\n<p>Why the others are incorrect:</p>\n<p><strong>b)</strong> There is no indication to add a beta-blocker for hypertension already controlled on a thiazide.</p>\n\n<p><strong>c)</strong> Pain-driven sinus tachycardia should be treated by addressing the pain, not by newly initiating a perioperative beta-blocker.</p>\n\n<p><strong>d)</strong> Only the patient already on chronic therapy should receive it \u2014 not all.</p>\n\n<p><strong>e)</strong> NPO status does not justify withholding a needed beta-blocker; it can be given by an alternative route, and stopping chronic therapy is harmful.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":94,"stem":"Which of the following metabolic changes is seen routinely in patients who have received massive transfusion of red blood cells?","options":[{"letter":"A","text":"Hypokalemia."},{"letter":"B","text":"Hypercalcemia."},{"letter":"C","text":"Alkalosis."},{"letter":"D","text":"Thrombocytosis."}],"correct":"C","explanation":"<p>The citrate anticoagulant in stored blood is metabolized by the liver to bicarbonate, so massive transfusion routinely produces a <strong>metabolic alkalosis</strong>.</p>\n<p>Why the others are incorrect:</p>\n<p><strong>a)</strong> Potassium leaks from stored RBCs, so <strong>hyperkalemia</strong> (not hypokalemia) is the transfusion concern (though intracellular shifts can later cause hypokalemia, the classic acute change is hyperkalemia).</p>\n\n<p><strong>b)</strong> Citrate binds ionized calcium, causing <strong>hypocalcemia</strong>, not hypercalcemia.</p>\n\n<p><strong>d)</strong> Massive transfusion causes dilutional <strong>thrombocytopenia</strong>, not thrombocytosis.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":95,"stem":"Which of the following is a STANDARD (ie. non-optional) blood management intervention used to prevent perioperative blood loss?","options":[{"letter":"A","text":"Use of regional anaesthesia."},{"letter":"B","text":"Use of hypotensive anaesthesia."},{"letter":"C","text":"Use of fibrinolytic drugs such as desmopressin acetate and tranexamic acid."},{"letter":"D","text":"Restriction of perioperative phlebotomy to necessary tests."}],"correct":"D","explanation":"<p>Minimizing unnecessary blood draws is a universally applicable, low-risk, standard blood-conservation measure appropriate for essentially all patients.</p>\n<p>Why the others are incorrect:</p>\n<p><strong>a) and b)</strong> Regional and hypotensive/deliberate-hypotension anesthesia are <strong>optional/selective</strong> techniques used in appropriate cases, not universal standards.</p>\n\n<p><strong>c)</strong> Desmopressin and tranexamic acid are <strong>antifibrinolytic/hemostatic</strong> agents (the option mislabels them &quot;fibrinolytic&quot;), and their use is selective rather than a non-optional standard.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":96,"stem":"The most common virally mediated tumor (malignancy) that occurs in transplant patients is","options":[{"letter":"A","text":"HIV - human immunodeficiency."},{"letter":"B","text":"EBV \u2014 Ebstein Barr virus."},{"letter":"C","text":"HPV \u2014 Human pappiloma virus."},{"letter":"D","text":"CMV \u2014 Cytomegalovirus."}],"correct":"B","explanation":"<p>EBV drives <strong>post-transplant lymphoproliferative disorder (PTLD)</strong>, the most common virally mediated malignancy in immunosuppressed transplant recipients (Sabiston, Ch. 26).</p>\n<p>Why the others are incorrect:</p>\n<p><strong>a)</strong> HIV is not the characteristic driver of post-transplant malignancy.</p>\n\n<p><strong>c)</strong> HPV causes skin/anogenital cancers in transplant patients but is not the most common virally mediated tumor overall in this population.</p>\n\n<p><strong>d)</strong> CMV is the most common clinically significant viral <strong>infection</strong> post-transplant but is not primarily oncogenic.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":97,"stem":"In a patient with Hepatitis C, Post Liver Transplant:","options":[{"letter":"A","text":"Re-Infection does recur in the new liver."},{"letter":"B","text":"The aggressiveness of recurrence of Hepatitis C post-transplant can be predicted."},{"letter":"C","text":"Re-infection risk is linked to pre-transplant treatment."},{"letter":"D","text":"The level of viremia of the recipient is not important pending the pre-transplant treatment for the hepatitis."}],"correct":"A","explanation":"<p>In the pre\u2013direct-acting-antiviral era referenced by this exam, HCV reinfection of the allograft was essentially <strong>universal</strong> when the recipient was viremic at transplant (Sabiston, Ch. 26).</p>\n<p>Why the others are incorrect:</p>\n<p><strong>b)</strong> The aggressiveness of recurrence <strong>cannot</strong> be reliably predicted.</p>\n\n<p><strong>c)</strong> Reinfection risk relates to <strong>post-transplant</strong> immunosuppression/treatment intensity, not pre-transplant treatment as stated.</p>\n\n<p><strong>d)</strong> Recipient <strong>viremia level is very important</strong> \u2014 it strongly predicts recurrence.</p>\n<p>Note: modern direct-acting antivirals now allow cure before or after transplant, markedly changing this picture, but the exam item reflects the older framework.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":98,"stem":"The following about keloid scars are true:","options":[{"letter":"A","text":"Less likely to be familial."},{"letter":"B","text":"Often subside in time."},{"letter":"C","text":"More common in dark skinned individuals."},{"letter":"D","text":"Confined to the margins of the wound."},{"letter":"E","text":"More likely to be associated with contractures."}],"correct":"C","explanation":"<p>Keloids occur far more frequently in darker-pigmented individuals and have a recognized familial/genetic predisposition.</p>\n<p>Why the others are incorrect:</p>\n<p><strong>a)</strong> Keloids <strong>are</strong> frequently familial.</p>\n\n<p><strong>b)</strong> Keloids typically <strong>do not</strong> regress spontaneously (unlike hypertrophic scars, which often improve over time).</p>\n\n<p><strong>d)</strong> Extension <strong>beyond</strong> the original wound margins is the defining feature distinguishing keloids from hypertrophic scars (which stay within the wound).</p>\n\n<p><strong>e)</strong> Contractures are more characteristic of hypertrophic scars/burn scars; keloids are defined by growth beyond wound borders rather than contracture.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":99,"stem":"The most common pathogen causing post-operative urinary tract infection is:","options":[{"letter":"A","text":"E.coli."},{"letter":"B","text":"Candida ablicans."},{"letter":"C","text":"B. fragilis."},{"letter":"D","text":"D. P aeruginosa."},{"letter":"E","text":"E. Enterococcus."}],"correct":"A","explanation":"<p>Escherichia coli is the most common uropathogen overall, including in the post-operative and catheter-associated setting.</p>\n<p>Why the others are incorrect:</p>\n<p><strong>b)</strong> Candida causes catheter-associated funguria, particularly with prolonged catheterization/antibiotics, but is not the most common cause.</p>\n\n<p><strong>c)</strong> Bacteroides fragilis is an anaerobe of intra-abdominal/pelvic infections, not a typical uropathogen.</p>\n\n<p><strong>d)</strong> Pseudomonas aeruginosa causes healthcare-associated/complicated UTIs but is less common than E. coli.</p>\n\n<p><strong>e)</strong> Enterococcus is a frequent nosocomial uropathogen but ranks behind E. coli.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":100,"stem":"Early sign of sepsis in the post-operative patient include:","options":[{"letter":"A","text":"Respiratory acidosis."},{"letter":"B","text":"Decreased cardiac output."},{"letter":"C","text":"Hypoglycemia."},{"letter":"D","text":"Cutaneous vasodilation."},{"letter":"E","text":"Hypotension."}],"correct":"D","explanation":"<p>Early (&quot;warm&quot;) sepsis is a hyperdynamic, distributive state: peripheral vasodilation produces warm, flushed skin, with high cardiac output and low systemic vascular resistance. This precedes the later &quot;cold,&quot; decompensated phase.</p>\n<p>Why the others are incorrect:</p>\n<p><strong>a)</strong> Early sepsis characteristically causes a <strong>respiratory alkalosis</strong> from tachypnea, not respiratory acidosis.</p>\n\n<p><strong>b)</strong> Cardiac output is typically <strong>increased</strong> early (hyperdynamic); it falls only late.</p>\n\n<p><strong>c)</strong> Early sepsis usually causes <strong>hyperglycemia</strong> (stress response); hypoglycemia is a late, ominous finding.</p>\n\n<p><strong>e)</strong> Hypotension is a <strong>late</strong> sign after compensatory mechanisms fail.</p>\n","no_key":false,"no_options":false,"free_answer":null},{"number":101,"stem":"The American Society of Anesthesiologist (ASA) classification for a 45 year old, poorly-controlled type 2 diabetic (blood glucose measurements usually 8-12), with a BMI of 39 is:","options":[{"letter":"A","text":"I."},{"letter":"B","text":"II."},{"letter":"C","text":"III."},{"letter":"D","text":"IV."},{"letter":"E","text":"IV-E."}],"correct":"C","explanation":"<p>A patient with a <em>poorly-controlled</em> systemic disease (poorly-controlled diabetes) plus a second significant comorbidity (BMI 39, class II obesity) has substantive functional limitation from severe systemic disease, which defines ASA III. The ASA Physical Status system classifies ASA III as a patient with severe systemic disease that is a substantive functional limitation, including examples such as poorly controlled diabetes or hypertension, COPD, morbid obesity (BMI \u226540), active hepatitis, alcohol dependence/abuse, or a history (&gt;3 months) of MI, CVA, or stents.</p>\n<p><strong>a) I</strong> \u2014 Incorrect. ASA I is a normal healthy patient with no systemic disease; this patient has poorly controlled diabetes and obesity.</p>\n\n<p><strong>b) II</strong> \u2014 Incorrect. ASA II is <em>mild</em> systemic disease without substantive functional limitation (e.g., well-controlled diabetes/hypertension, obesity with BMI 30\u201340, current smoker, social alcohol use). Well-controlled diabetes and BMI 30\u201340 alone would be ASA II, but &quot;poorly-controlled&quot; diabetes upgrades this patient to III.</p>\n\n<p><strong>d) IV</strong> \u2014 Incorrect. ASA IV is severe systemic disease that is a <em>constant threat to life</em> (e.g., recent MI/CVA/stents &lt;3 months, ongoing cardiac ischemia, severe valve dysfunction, sepsis, DIC). This patient&#x27;s disease is not an acute constant threat to life.</p>\n\n<p><strong>e) IV-E</strong> \u2014 Incorrect. The &quot;E&quot; modifier denotes an <em>emergency</em> procedure; nothing indicates an emergency, and the underlying class is III, not IV.</p>\n<p>Background: The distinction that most often trips people up is that BMI 30\u201340 is ASA II, while BMI \u226540 is ASA III \u2014 so the obesity component here (BMI 39) is class II. It is the <em>poorly-controlled</em> diabetes that anchors this patient at ASA III.</p>","no_key":false,"no_options":fal
