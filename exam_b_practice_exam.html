se,"free_answer":null},{"number":102,"stem":"In a patient going for non-major surgery who is >60 years old or with additional risk factors, what is the recommended strategy for prevention of thromboembolism?","options":[{"letter":"A","text":"No specific measures are required other than aggressive mobilization."},{"letter":"B","text":"Low-dose unfractionated heparin q12h, low molecular weight heparin, elastic stockings, or intermittent pneumatic compression."},{"letter":"C","text":"Low-dose unfractionated heparin q8h, low molecular weight heparin, or intermittent pneumatic compression."},{"letter":"D","text":"Low molecular weight heparin, oral anticoagulants, intermittent pneumatic compression + LDUH/LMWH or adjusted dose heparin."}],"correct":"C","explanation":"<p>A patient &gt;60 (or 40\u201360 with additional risk factors) undergoing non-major surgery falls into the &quot;high risk&quot; category of the classic surgical VTE risk stratification, for which recommended prophylaxis is LDUH q8h, LMWH, or intermittent pneumatic compression (IPC).</p>\n<p><strong>a)</strong> \u2014 Incorrect. Early/aggressive mobilization alone is reserved for the <em>low-risk</em> group (minor surgery, age &lt;40, no additional risk factors).</p>\n\n<p><strong>b)</strong> \u2014 Incorrect. LDUH q12h, LMWH, elastic stockings, or IPC describes the <em>moderate-risk</em> group (e.g., minor surgery with additional risk factors, or age 40\u201360 without risk factors). The key difference from the correct answer is dosing frequency (q12h moderate vs. q8h high risk).</p>\n\n<p><strong>d)</strong> \u2014 Incorrect. Combination pharmacologic + mechanical prophylaxis (LMWH, oral anticoagulants, IPC combined with LDUH/LMWH or adjusted-dose heparin) is reserved for the <em>highest-risk</em> group (multiple risk factors, major orthopedic surgery, trauma, prior VTE, malignancy).</p>\n<p>Background: This four-tier stratification (low / moderate / high / highest) derives from older ACCP-based surgical prophylaxis frameworks. Contemporary practice increasingly individualizes prophylaxis with validated risk tools (e.g., the Caprini score), but the tiered escalation of intensity remains the underlying concept.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":103,"stem":"Side effects of azathioprine immunosuppression include:","options":[{"letter":"A","text":"Pancreatitis."},{"letter":"B","text":"Leukopenia."},{"letter":"C","text":"Pulmonary fibrosis."},{"letter":"D","text":"Significant drug interaction with allopurinol."},{"letter":"E","text":"All of the above."}],"correct":"E","explanation":"<p>Azathioprine is a purine analog metabolized to 6-mercaptopurine; its side-effect profile includes all of the listed effects.</p>\n<p><strong>a) Pancreatitis</strong> \u2014 Correct as a recognized adverse effect.</p>\n\n<p><strong>b) Leukopenia</strong> \u2014 Correct; dose-limiting myelosuppression (leukopenia) is the classic and most common toxicity.</p>\n\n<p><strong>c) Pulmonary fibrosis</strong> \u2014 Correct; a recognized, less common pulmonary toxicity.</p>\n\n<p><strong>d) Significant drug interaction with allopurinol</strong> \u2014 Correct and clinically critical. Azathioprine is metabolized by xanthine oxidase; allopurinol inhibits xanthine oxidase, causing accumulation of active metabolites and potentially fatal myelosuppression. The azathioprine dose must be reduced (roughly to 25\u201333%) or the combination avoided.</p>\n\n<p>Because a\u2013d are all true, <strong>e) All of the above</strong> is correct.</p>\n<p>Background: TPMT (thiopurine methyltransferase) genotype/phenotype also predicts myelosuppression risk; patients with low TPMT activity are at markedly higher risk of profound cytopenias.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":104,"stem":"Which of the following is the most common viral infection in immunosuppressed transplant patients?","options":[{"letter":"A","text":"Hepatitis B virus."},{"letter":"B","text":"Hepatitis C virus."},{"letter":"C","text":"Varicella zoster virus."},{"letter":"D","text":"Herpes simplex virus."},{"letter":"E","text":"Human papilloma virus."}],"correct":"D","explanation":"<p>(per the exam&#x27;s cited source, Schwartz 10e, Ch. 11)</p>\n<p>Per the Schwartz text the exam references, HSV is the most common viral infection in immunosuppressed transplant patients, typically as reactivation early after transplantation.</p>\n<p><strong>a) HBV / b) HCV</strong> \u2014 Incorrect; important in transplant candidacy and hepatic outcomes but not the most common viral infection overall.</p>\n\n<p><strong>c) VZV</strong> \u2014 Incorrect; occurs (as zoster reactivation) but less commonly than HSV.</p>\n\n<p><strong>e) HPV</strong> \u2014 Incorrect; contributes to later skin and anogenital malignancies but is not the most common early viral infection.</p>\n<p>Note (nuance / potential disagreement): This item hinges on how &quot;most common&quot; is defined. Many transplant references instead emphasize <strong>cytomegalovirus (CMV)</strong> as the most clinically important and one of the most common viral pathogens after solid-organ transplant, and EBV as the driver of PTLD (as tested in Q96 of this same exam). If the intended framing is &quot;clinically most significant viral pathogen,&quot; CMV would be the expected answer. The answer HSV is defensible only within the specific Schwartz passage the exam cites.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":105,"stem":"Interaction of this factor with Tissue Factor (TF) initiates the extrinsic cascade of the coagulation pathway.","options":[{"letter":"A","text":"XII."},{"letter":"B","text":"IXa."},{"letter":"C","text":"VIII."},{"letter":"D","text":"VII."}],"correct":"D","explanation":"<p>The extrinsic (tissue factor) pathway is initiated when circulating factor VII/VIIa binds exposed tissue factor at the site of vascular injury, forming the TF\u2013VIIa complex that activates factors X and IX.</p>\n<p><strong>a) XII</strong> \u2014 Incorrect; factor XII (Hageman factor) initiates the <em>intrinsic</em> (contact) pathway.</p>\n\n<p><strong>b) IXa</strong> \u2014 Incorrect; factor IXa is a component of the intrinsic pathway (and is also activated by TF\u2013VIIa), not the initiator of the extrinsic pathway.</p>\n\n<p><strong>c) VIII</strong> \u2014 Incorrect; factor VIII is a cofactor for factor IXa within the intrinsic tenase complex, not the extrinsic initiator.</p>\n<p>Background: The TF\u2013VIIa complex is the principal physiologic trigger of coagulation in vivo; the historical &quot;intrinsic vs. extrinsic&quot; division is now understood as a highly interconnected single system, with TF\u2013VIIa activating both X and IX.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":106,"stem":"When stored between 1 to 6C, this blood product can be safely used for up to 35 days.","options":[{"letter":"A","text":"Whole blood."},{"letter":"B","text":"Leukocyte-reduced red blood cells."},{"letter":"C","text":"Fresh frozen plasma."},{"letter":"D","text":"Cryoprecipitate."}],"correct":"A","explanation":"<p>Whole blood (and packed red cells) collected in CPDA-1 anticoagulant-preservative and stored at 1\u20136\u00b0C has a shelf life of 35 days.</p>\n<p><strong>b) Leukocyte-reduced red blood cells</strong> \u2014 Incorrect in this framing. RBCs stored in additive solutions (AS-1/AS-3/AS-5) have a shelf life of <em>42 days</em>, not 35, so this does not match the &quot;up to 35 days&quot; descriptor.</p>\n\n<p><strong>c) Fresh frozen plasma</strong> \u2014 Incorrect; FFP is stored <em>frozen</em> (\u2264 \u221218\u00b0C, typically up to 12 months), not refrigerated at 1\u20136\u00b0C. Once thawed it must be used within 24 hours (or up to 5 days as &quot;thawed plasma&quot;).</p>\n\n<p><strong>d) Cryoprecipitate</strong> \u2014 Incorrect; cryoprecipitate is also stored <em>frozen</em> (up to 12 months) and used within hours once thawed.</p>\n<p>Background: The 35-day figure is specific to CPDA-1 whole blood/RBCs; additive-solution RBCs extend storage to 42 days by supplying supplemental substrate. Longer storage increases the &quot;storage lesion&quot; (rising supernatant potassium, falling 2,3-DPG, hemolysis).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":107,"stem":"The use of citrate solutions in the preparation of blood for transfusion is done for the following reason:","options":[{"letter":"A","text":"Prevent coagulation by binding sodium."},{"letter":"B","text":"Prevent coagulation by binding calcium."},{"letter":"C","text":"Extend the storage life of the cells."},{"letter":"D","text":"Prevent changes in red blood cell deformability."}],"correct":"B","explanation":"<p>Citrate is the anticoagulant in stored blood; it chelates ionized calcium, and because calcium (factor IV) is an essential cofactor at multiple steps of the coagulation cascade, its removal prevents clotting in the stored unit.</p>\n<p><strong>a)</strong> \u2014 Incorrect; citrate binds calcium, not sodium.</p>\n\n<p><strong>c)</strong> \u2014 Incorrect; storage life is extended by the other components of the preservative solution (dextrose, adenine, phosphate \u2014 CPDA/additive solutions), not by the anticoagulant action of citrate.</p>\n\n<p><strong>d)</strong> \u2014 Incorrect; red cell deformability actually <em>declines</em> during storage (part of the storage lesion); citrate does not preserve it.</p>\n<p>Background: This mechanism explains citrate toxicity in massive transfusion \u2014 when large volumes are given faster than the liver can metabolize citrate (or in hepatic dysfunction/hypoperfusion), ionized calcium falls, producing hypocalcemia (and hypomagnesemia). Citrate is metabolized to bicarbonate, which is why massive transfusion also tends toward metabolic alkalosis (see Q94).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":108,"stem":"A 67 yo male has been admitted to the General Surgery Service with a bowel obstruction and has a laparotomy and subsequent ileus. The team is starting TPN. Which component of the TPN is the most dense in calories?","options":[{"letter":"A","text":"Protein."},{"letter":"B","text":"Lipids."},{"letter":"C","text":"Glucose."},{"letter":"D","text":"Starch."}],"correct":"B","explanation":"<p>Fat/lipid is the most calorically dense macronutrient, providing approximately 9 kcal/g.</p>\n<p><strong>a) Protein</strong> \u2014 Incorrect; ~4 kcal/g (and in TPN protein is intended for anabolism/nitrogen balance rather than as a calorie source).</p>\n\n<p><strong>c) Glucose / d) Starch</strong> \u2014 Incorrect; carbohydrate provides ~4 kcal/g (IV dextrose is often cited as ~3.4 kcal/g because it is hydrated). Starch is not used as a TPN component.</p>\n<p>Background: A balanced TPN prescription supplies calories from dextrose and lipid while providing amino acids for protein synthesis; overfeeding with dextrose can cause hyperglycemia, hepatic steatosis, and excess CO\u2082 production.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":109,"stem":"A 78 yo woman is post-operative day 7 from an abdominal hysterectomy, bilateral salpingo-oophorectomy and debulking for ovarian cancer. Which of the following metabolic changes are occurring during the flow phase of her injury response from surgery?","options":[{"letter":"A","text":"Decrease in basal metabolic rate."},{"letter":"B","text":"Increase in blood glucose."},{"letter":"C","text":"Increasing nitrogen balance."},{"letter":"D","text":"Decrease in gluconeogenesis from fats."}],"correct":"B","explanation":"<p>The &quot;flow&quot; phase of the injury response is a catabolic, hypermetabolic state characterized by hyperglycemia (from catecholamine-, cortisol-, and glucagon-driven gluconeogenesis and insulin resistance).</p>\n<p><strong>a) Decrease in basal metabolic rate</strong> \u2014 Incorrect; the flow phase <em>increases</em> metabolic rate (the preceding brief &quot;ebb&quot; phase is the low-flow, hypometabolic period immediately after injury).</p>\n\n<p><strong>c) Increasing nitrogen balance</strong> \u2014 Incorrect; the flow phase produces <em>negative</em> nitrogen balance from protein catabolism/muscle breakdown.</p>\n\n<p><strong>d) Decrease in gluconeogenesis from fats</strong> \u2014 Incorrect; lipolysis and gluconeogenesis both <em>increase</em>.</p>\n<p>Background: The classic Cuthbertson model divides the injury response into the early, short-lived <strong>ebb phase</strong> (hypometabolic, decreased cardiac output) and the subsequent <strong>flow phase</strong> (hypermetabolic, hyperglycemic, catabolic with negative nitrogen balance and increased lipolysis), which supplies substrate for healing but drives lean-body-mass loss.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":110,"stem":"A 25 yo male is involved in a motor vehicle collision and sustains a severe head injury requiring craniotomy. Post-operatively he does well and is extubated. His mental status however is decreased. Which of the following would be a contra-indicated method of nutritional support?","options":[{"letter":"A","text":"Percutaneous feeding jejunostomy."},{"letter":"B","text":"Total parenteral nutrition."},{"letter":"C","text":"Nasogastric feeding."},{"letter":"D","text":"Nasojejunal feeding."}],"correct":"C","explanation":"<p>Intragastric feeding carries the highest aspiration risk, and this risk is greatest in patients with altered mental status or who are paralyzed. With a decreased level of consciousness, gastric (nasogastric) feeding risks regurgitation of gastric contents into the tracheobronchial tree.</p>\n<p><strong>a) Percutaneous feeding jejunostomy / d) Nasojejunal feeding</strong> \u2014 Not contraindicated; post-pyloric (jejunal) delivery bypasses the stomach and reduces aspiration risk, making it preferred in patients at high aspiration risk.</p>\n\n<p><strong>b) Total parenteral nutrition</strong> \u2014 Not contraindicated by aspiration risk (though enteral nutrition is generally preferred whenever the gut is functional).</p>\n<p>Background: Enteral nutrition is favored over parenteral when feasible; in patients with impaired airway protection, post-pyloric access is the enteral route of choice to lower aspiration/pneumonia risk.</p>","no_key":false,"no_options":false,"free_answer":null}];</script>
<script>
(function(){
  const STORAGE_KEY = 'progress-v1';
  // Namespaced by page title so multiple quiz files hosted/opened together
  // (outside Claude, where window.storage isn't available) don't clobber
  // each other's saved progress in the same browser's localStorage.
  const LOCAL_STORAGE_KEY = 'examquiz-progress:' + (document.title || 'default');
  let state = { answers: {}, flagged: {}, struck: {}, notes: {} }; // answers[num]={selected,correct}; struck[num]={LETTER:true}; notes[num]=string
  let filter = 'all';
  let currentIndex = 0;
  let pendingSelections = {}; // qnum -> letter, chosen but not yet confirmed (session-only)
  let notesSaveTimer = null;
  const BANNER_POPUP_IDS = ['calc-panel', 'settings-panel', 'notes-panel-popup'];

  // Closes every banner popover (calculator, settings, notes) except the
  // one whose panel id is passed in -- keeps the three mutually exclusive
  // without each toggle handler needing to know about the other two by
  // name. Add new banner popovers to BANNER_POPUP_IDS above and they get
  // this behavior for free.
  function closeOtherBannerPopups(exceptPanelId) {
    BANNER_POPUP_IDS.forEach(id => {
      if (id === exceptPanelId) return;
      const el = document.getElementById(id);
      if (el) el.classList.add('hidden');
    });
  }

  const FILTERS = [
    ['all', 'All'],
    ['unanswered', 'Unanswered'],
    ['incorrect', 'Incorrect'],
    ['flagged', 'Flagged'],
  ];

  function questionStatus(q) {
    const a = state.answers[q.number];
    if (!a) return 'unanswered';
    if (q.no_options || q.no_key) return 'nokey-done';
    return a.correct ? 'correct' : 'incorrect';
  }

  function visibleList() {
    return QUIZ_DATA.filter(q => {
      if (filter === 'unanswered') return !state.answers[q.number];
      if (filter === 'incorrect') {
        const a = state.answers[q.number];
        return a && !a.correct && !q.no_options && !q.no_key;
      }
      if (filter === 'flagged') return !!state.flagged[q.number];
      return true;
    });
  }

  function renderFilters() {
    const el = document.getElementById('filter-tabs');
    el.innerHTML = '';
    FILTERS.forEach(([key, label]) => {
      const b = document.createElement('button');
      b.textContent = label;
      if (filter === key) b.classList.add('active');
      b.onclick = () => { filter = key; currentIndex = 0; renderAll(); };
      el.appendChild(b);
    });
  }

  function renderGrid() {
    const grid = document.getElementById('qgrid');
    grid.innerHTML = '';
    const list = visibleList();
    if (list.length === 0) {
      const empty = document.createElement('div');
      empty.style.gridColumn = '1 / -1';
      empty.style.color = 'var(--muted)';
      empty.style.fontSize = '12.5px';
      empty.style.textAlign = 'center';
      empty.style.padding = '10px 0';
      empty.textContent = 'No questions here.';
      grid.appendChild(empty);
      return;
    }
    list.forEach((q, i) => {
      const b = document.createElement('button');
      b.textContent = q.number;
      const status = questionStatus(q);
      if (status !== 'unanswered') b.classList.add(status);
      if (i === currentIndex) b.classList.add('current');
      if (state.flagged[q.number]) {
        const dot = document.createElement('span');
        dot.className = 'flagdot';
        b.appendChild(dot);
      }
      b.onclick = () => { currentIndex = i; renderAll(); scrollToTop(); };
      grid.appendChild(b);
    });
  }

  function renderStats() {
    const answeredNums = Object.keys(state.answers);
    const gradable = answeredNums.filter(n => {
      const q = QUIZ_DATA.find(x => x.number == n);
      return q && !q.no_options && !q.no_key;
    });
    const correctCount = gradable.filter(n => state.answers[n].correct).length;
    document.getElementById('stat-answered').textContent = answeredNums.length;
    document.getElementById('stat-correct').textContent = correctCount;
    document.getElementById('stat-pct').textContent = gradable.length
      ? Math.round(100 * correctCount / gradable.length) + '%'
      : '—';
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderPanel() {
    const panel = document.getElementById('qpanel');
    const list = visibleList();
    if (list.length === 0) {
      panel.innerHTML = '<div class="empty-state">Nothing to show for this filter. Try a different tab on the left.</div>';
      return;
    }
    if (currentIndex >= list.length) currentIndex = list.length - 1;
    const q = list[currentIndex];
    const answer = state.answers[q.number];
    const flagged = !!state.flagged[q.number];
    const pending = pendingSelections[q.number]; // letter picked but not confirmed yet

    let html = '';
    html += '<div class="qmeta">';
    html += '<div class="qnum">Question ' + q.number + '</div>';
    html += '<button class="flag-toggle ' + (flagged ? 'on' : '') + '" id="flag-btn">' + (flagged ? '&#9873; Flagged' : '&#9872; Flag for review') + '</button>';
    html += '</div>';
    html += '<div class="stem">' + escapeHtml(q.stem) + '</div>';

    if (q.no_options) {
      if (!answer) {
        html += '<div class="noopts-box">This question\'s original answer choices weren\'t fully captured in the source material — only the key fact is available.</div>';
        html += '<button class="reveal-btn" id="reveal-btn">Reveal answer</button>';
      } else {
        html += '<div class="explain">';
        html += '<div class="verdict nokey">Key fact</div>';
        html += '<div class="explain-body"><p><strong>' + escapeHtml(q.free_answer || '') + '</strong></p>' + q.explanation + '</div>';
        html += '</div>';
      }
    } else if (q.options) {
      html += '<div class="options">';
      q.options.forEach(opt => {
        const struck = !answer && !!(state.struck[q.number] && state.struck[q.number][opt.letter]);
        let cls = 'opt';
        if (answer) {
          cls += ' locked';
          if (opt.letter === q.correct) cls += ' correct-answer';
          else if (opt.letter === answer.selected) cls += ' wrong-answer';
          if (opt.letter === answer.selected) cls += ' selected';
        } else if (struck) {
          cls += ' struck';
        } else if (pending === opt.letter) {
          cls += ' pending-selected';
        }
        html += '<div class="opt-row">';
        html += '<button class="' + cls + '" data-letter="' + opt.letter + '"' + (struck ? ' disabled' : '') + '>';
        html += '<span class="letter">' + opt.letter + '</span>';
        html += '<span class="text">' + escapeHtml(opt.text) + '</span>';
        html += '</button>';
        if (!answer) {
          html += '<button class="strike-btn ' + (struck ? 'active' : '') + '" data-strike-letter="' + opt.letter + '" title="Cross out this option">&#9587;</button>';
        }
        html += '</div>';
      });
      html += '</div>';

      if (!answer) {
        html += '<button class="confirm-btn" id="confirm-btn" ' + (pending ? '' : 'disabled') + '>Confirm answer</button>';
      }

      if (answer) {
        html += '<div class="explain">';
        if (q.no_key) {
          html += '<div class="verdict nokey">Reviewed</div>';
          html += '<div class="nokey-note">No answer key was available for this question in the source material, so it isn\'t graded — use it for your own review.</div>';
        } else {
          html += '<div class="verdict ' + (answer.correct ? 'correct' : 'incorrect') + '">' + (answer.correct ? '✓ Correct' : '✗ Incorrect — correct answer is ' + q.correct) + (answer.emoji ? ' <span class="verdict-emoji">' + answer.emoji + '</span>' : '') + '</div>';
        }
        html += '<div class="explain-body">' + q.explanation + '</div>';
        html += '</div>';
      }
    }

    html += '<div class="footer-nav">';
    html += '<button class="navbtn" id="prev-btn" ' + (currentIndex === 0 ? 'disabled' : '') + '>&larr; Previous</button>';
    html += '<div class="position">' + (currentIndex + 1) + ' of ' + list.length + '</div>';
    html += '<button class="navbtn primary" id="next-btn" ' + (currentIndex === list.length - 1 ? 'disabled' : '') + '>Next &rarr;</button>';
    html += '</div>';

    panel.innerHTML = html;

    if (!answer && q.options) {
      panel.querySelectorAll('.opt:not(.struck)').forEach(btn => {
        btn.onclick = () => {
          pendingSelections[q.number] = btn.getAttribute('data-letter');
          renderPanel(); // just re-render the panel, no need to touch grid/stats for a pending pick
        };
      });
      panel.querySelectorAll('.strike-btn').forEach(btn => {
        btn.onclick = () => toggleStrike(q.number, btn.getAttribute('data-strike-letter'));
      });
      const cb = document.getElementById('confirm-btn');
      if (cb) cb.onclick = () => {
        if (pendingSelections[q.number]) confirmAnswer(q, pendingSelections[q.number]);
      };
    }
    if (q.no_options) {
      const rb = document.getElementById('reveal-btn');
      if (rb) rb.onclick = () => confirmAnswer(q, null);
    }
    document.getElementById('flag-btn').onclick = () => toggleFlag(q.number);
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    if (prevBtn) prevBtn.onclick = () => { if (currentIndex > 0) { currentIndex--; renderAll(); scrollToTop(); } };
    if (nextBtn) nextBtn.onclick = () => { const l = visibleList(); if (currentIndex < l.length - 1) { currentIndex++; renderAll(); scrollToTop(); } };
  }

  const CELEBRATE_EMOJIS = ['🎉', '🌟', '✨', '🙌', '🎊', '👏', '💪', '🥳'];
  const SAD_EMOJIS = ['🥲', '😿', '🫠', '🙈', '🥺', '😢'];

  function pickEmoji(correct) {
    const arr = correct ? CELEBRATE_EMOJIS : SAD_EMOJIS;
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function confirmAnswer(q, letter) {
    const correct = q.no_options ? true : (letter === q.correct);
    const graded = !q.no_options && !q.no_key; // only genuinely-scored answers get a reaction emoji
    state.answers[q.number] = {
      selected: letter,
      correct: correct,
      emoji: graded ? pickEmoji(correct) : null,
    };
    delete pendingSelections[q.number];
    saveProgress();
    renderAll();
  }

  function toggleStrike(num, letter) {
    if (!state.struck[num]) state.struck[num] = {};
    if (state.struck[num][letter]) {
      delete state.struck[num][letter];
    } else {
      state.struck[num][letter] = true;
      if (pendingSelections[num] === letter) delete pendingSelections[num];
    }
    saveProgress();
    renderPanel();
  }

  function toggleFlag(num) {
    if (state.flagged[num]) delete state.flagged[num];
    else state.flagged[num] = true;
    saveProgress();
    renderAll();
  }

  async function saveProgress() {
    const payload = JSON.stringify(state);
    let savedViaClaude = false;
    try {
      if (window.storage) {
        await window.storage.set(STORAGE_KEY, payload, false);
        savedViaClaude = true;
      }
    } catch (e) {
      // window.storage can be flaky/transient in some sessions -- fall through
      // to the localStorage backup below rather than treating this as fatal.
    }
    if (savedViaClaude) return;
    try {
      localStorage.setItem(LOCAL_STORAGE_KEY, payload);
    } catch (e) {
      // Only genuinely worth surfacing if BOTH save paths failed -- otherwise
      // this is just noise, since the other path already has the data safe.
      console.error('Could not save progress via window.storage or localStorage', e);
    }
  }

  async function loadProgress() {
    try {
      if (window.storage) {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          if (parsed && parsed.answers) state = Object.assign({ answers: {}, flagged: {}, struck: {}, notes: {} }, parsed);
        }
        return;
      }
    } catch (e) {
      // no saved progress yet via window.storage, that's fine
    }
    try {
      const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.answers) state = Object.assign({ answers: {}, flagged: {}, struck: {}, notes: {} }, parsed);
      }
    } catch (e) {
      // no saved progress yet via localStorage either, that's fine
    }
  }

  function renderAll() {
    renderFilters();
    renderGrid();
    renderStats();
    renderPanel();
    renderNotes();
  }

  // Notes are keyed by question number and persisted as part of the same
  // `state` blob as answers/flags (see saveProgress/loadProgress), so they
  // ride along with existing progress-save/reset behavior for free. This
  // only needs to run when the CURRENT question changes -- renderPanel()
  // re-renders its own innerHTML independently and never touches this
  // textarea, so calling this only from renderAll() (not on every
  // in-panel re-render, e.g. picking a pending answer) avoids yanking
  // focus/cursor away from someone mid-note.
  function renderNotes() {
    const ta = document.getElementById('notes-textarea');
    if (!ta) return;
    const qnumLabel = document.getElementById('notes-qnum');
    const list = visibleList();
    if (list.length === 0) { ta.value = ''; ta.disabled = true; if (qnumLabel) qnumLabel.textContent = ''; return; }
    ta.disabled = false;
    let idx = currentIndex;
    if (idx >= list.length) idx = list.length - 1;
    const q = list[idx];
    if (qnumLabel) qnumLabel.textContent = 'Question ' + q.number;
    ta.value = state.notes[q.number] || '';
    ta.oninput = () => {
      clearTimeout(notesSaveTimer);
      notesSaveTimer = setTimeout(() => {
        const val = ta.value;
        if (val) state.notes[q.number] = val;
        else delete state.notes[q.number];
        saveProgress();
      }, 400);
    };
  }

  document.getElementById('reset-btn').onclick = async () => {
    if (!confirm('Clear all your saved answers and flags for this quiz?')) return;
    state = { answers: {}, flagged: {}, struck: {}, notes: {} };
    pendingSelections = {};
    currentIndex = 0;
    try {
      if (window.storage) await window.storage.delete(STORAGE_KEY, false);
    } catch (e) {}
    try {
      localStorage.removeItem(LOCAL_STORAGE_KEY);
    } catch (e) {}
    renderAll();
  };

  // ---- Settings: text size + light/dark override ----------------------
  const SETTINGS_KEY = 'ui-settings-v1';
  const SETTINGS_LOCAL_KEY = 'examquiz-ui-settings';
  const FONT_STEPS = [13, 14, 15, 16, 17, 18, 19]; // px; index 2 (15px) is the default/100%

  // Explicit light/dark palettes, mirroring the CSS custom properties in
  // quiz_template.html's :root and @media(prefers-color-scheme:dark) blocks.
  // Applied as INLINE styles on <html> (not just a data-theme attribute) so
  // an explicit user override always repaints reliably -- some WebKit/iOS
  // Safari versions don't consistently repaint custom-property values that
  // only change via an attribute-selector match, so relying solely on
  // `:root[data-theme="light"]` CSS could silently leave the old (dark)
  // painted colors on screen even though the DOM attribute is correct.
  // Inline style mutation is always synchronously repainted, so this is the
  // robust path; the CSS attribute selectors stay in place too as a harmless
  // no-op reinforcement for engines that don't have this quirk.
  const THEME_VARS = {
    light: {
      '--bg': '#F3F5F3', '--surface': '#FFFFFF', '--ink': '#1B2430', '--muted': '#64707D',
      '--border': '#DFE3E0', '--accent': '#3B7DD8', '--accent-dark': '#2A5DA8', '--accent-tint': '#EAF1FB',
      '--correct': '#1E8A5F', '--correct-bg': '#E7F5EE', '--correct-border': '#A9DDC4',
      '--incorrect': '#BF3F27', '--incorrect-bg': '#FBEAE5', '--incorrect-border': '#EFB7A8',
      '--flag': '#B9821A', '--flag-bg': '#FCF1DC', '--flag-border': '#ECD9AC',
      '--nokey': '#7C6FB0', '--nokey-bg': '#EFEBFA', '--nokey-border': '#D6CDEE',
      '--explain-text': '#384250',
      '--shadow': '0 1px 2px rgba(27,36,48,0.06), 0 4px 14px rgba(27,36,48,0.05)',
    },
    dark: {
      '--bg': '#15181B', '--surface': '#1E2226', '--ink': '#E8EAEC', '--muted': '#97A1A9',
      '--border': '#333A40', '--accent': '#5B9AE6', '--accent-dark': '#3B7DD8', '--accent-tint': '#1B2A3D',
      '--correct': '#58D399', '--correct-bg': '#17301F', '--correct-border': '#2D5238',
      '--incorrect': '#F0876D', '--incorrect-bg': '#3A211B', '--incorrect-border': '#62362A',
      '--flag': '#E3B04B', '--flag-bg': '#362C15', '--flag-border': '#5B4A24',
      '--nokey': '#BBA9F5', '--nokey-bg': '#2A2440', '--nokey-border': '#453B66',
      '--explain-text': '#C7CDD3',
      '--shadow': '0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25)',
    },
  };
  let settings = { fontStep: 2, theme: 'system' };

  async function loadSettings() {
    let raw = null;
    try {
      if (window.storage) {
        const res = await window.storage.get(SETTINGS_KEY, false);
        if (res && res.value) raw = res.value;
      }
    } catch (e) {}
    if (raw === null) {
      try { raw = localStorage.getItem(SETTINGS_LOCAL_KEY); } catch (e) {}
    }
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        if (parsed) settings = Object.assign(settings, parsed);
      } catch (e) {}
    }
  }

  async function saveSettings() {
    const payload = JSON.stringify(settings);
    try {
      if (window.storage) { await window.storage.set(SETTINGS_KEY, payload, false); return; }
    } catch (e) {}
    try { localStorage.setItem(SETTINGS_LOCAL_KEY, payload); } catch (e) {}
  }

  function applyFontStep() {
    const px = FONT_STEPS[settings.fontStep];
    document.documentElement.style.fontSize = px + 'px';
    const pctEl = document.getElementById('font-pct');
    if (pctEl) pctEl.textContent = Math.round((px / 15) * 100) + '%';
  }

  function applyTheme() {
    const rootStyle = document.documentElement.style;
    const allVarNames = Object.keys(THEME_VARS.light);
    if (settings.theme === 'system') {
      allVarNames.forEach(name => rootStyle.removeProperty(name));
      document.documentElement.removeAttribute('data-theme');
    } else {
      const vars = THEME_VARS[settings.theme] || THEME_VARS.light;
      allVarNames.forEach(name => rootStyle.setProperty(name, vars[name]));
      document.documentElement.setAttribute('data-theme', settings.theme);
    }
    document.querySelectorAll('#theme-seg button').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-theme-choice') === settings.theme);
    });
  }

  // ---- Basic on-screen calculator ---------------------------------------
  // Session-only, deliberately not persisted -- this is scratch arithmetic
  // for working through a question, not part of quiz state. Implemented as
  // an explicit state machine (not eval()) so it behaves like a real
  // 4-function calculator: each operator press immediately resolves any
  // pending operation left-to-right, rather than respecting precedence.
  const calcState = { display: '0', prevValue: null, operator: null, waitingForOperand: false };

  function calcRound(n) {
    // Avoids floating-point noise like 0.1 + 0.2 -> 0.30000000000000004.
    return Math.round((n + Number.EPSILON) * 1e10) / 1e10;
  }

  function calcCompute(a, b, op) {
    switch (op) {
      case 'add': return calcRound(a + b);
      case 'subtract': return calcRound(a - b);
      case 'multiply': return calcRound(a * b);
      case 'divide': return b === 0 ? 0 : calcRound(a / b);
      default: return b;
    }
  }

  function calcInputDigit(digit) {
    if (calcState.waitingForOperand) {
      calcState.display = digit;
      calcState.waitingForOperand = false;
    } else {
      calcState.display = calcState.display === '0' ? digit : calcState.display + digit;
    }
  }

  function calcInputDecimal() {
    if (calcState.waitingForOperand) {
      calcState.display = '0.';
      calcState.waitingForOperand = false;
      return;
    }
    if (calcState.display.indexOf('.') === -1) calcState.display += '.';
  }

  function calcClear() {
    calcState.display = '0';
    calcState.prevValue = null;
    calcState.operator = null;
    calcState.waitingForOperand = false;
  }

  function calcBackspace() {
    if (calcState.waitingForOperand) return;
    calcState.display = calcState.display.length > 1 ? calcState.display.slice(0, -1) : '0';
  }

  function calcPercent() {
    calcState.display = String(calcRound(parseFloat(calcState.display) / 100));
  }

  function calcPerformOperation(nextOperator) {
    const inputValue = parseFloat(calcState.display);
    if (calcState.prevValue === null) {
      calcState.prevValue = inputValue;
    } else if (calcState.operator) {
      calcState.prevValue = calcCompute(calcState.prevValue, inputValue, calcState.operator);
      calcState.display = String(calcState.prevValue);
    }
    calcState.waitingForOperand = true;
    calcState.operator = nextOperator;
  }

  function calcEquals() {
    if (calcState.operator === null || calcState.prevValue === null) return;
    const inputValue = parseFloat(calcState.display);
    calcState.display = String(calcCompute(calcState.prevValue, inputValue, calcState.operator));
    calcState.prevValue = null;
    calcState.operator = null;
    calcState.waitingForOperand = true;
  }

  function initCalculator() {
    const toggle = document.getElementById('calc-toggle');
    const panel = document.getElementById('calc-panel');
    const display = document.getElementById('calc-display');
    if (!toggle || !panel || !display) return;

    function updateDisplay() { display.textContent = calcState.display; }

    toggle.onclick = (e) => {
      e.stopPropagation();
      const opening = panel.classList.contains('hidden');
      if (opening) closeOtherBannerPopups('calc-panel');
      panel.classList.toggle('hidden');
    };
    document.addEventListener('click', (e) => {
      if (!panel.classList.contains('hidden') && !panel.contains(e.target) && e.target !== toggle) {
        panel.classList.add('hidden');
      }
    });

    panel.querySelectorAll('.calc-btn').forEach(btn => {
      btn.onclick = () => {
        const action = btn.getAttribute('data-calc');
        if (/^[0-9]$/.test(action)) calcInputDigit(action);
        else if (action === 'decimal') calcInputDecimal();
        else if (action === 'clear') calcClear();
        else if (action === 'backspace') calcBackspace();
        else if (action === 'percent') calcPercent();
        else if (action === 'equals') calcEquals();
        else calcPerformOperation(action); // add / subtract / multiply / divide
        updateDisplay();
      };
    });
  }

  function initNotesPopup() {
    const toggle = document.getElementById('notes-toggle');
    const panel = document.getElementById('notes-panel-popup');
    if (!toggle || !panel) return;

    toggle.onclick = (e) => {
      e.stopPropagation();
      const opening = panel.classList.contains('hidden');
      if (opening) closeOtherBannerPopups('notes-panel-popup');
      panel.classList.toggle('hidden');
      // Notes content can go stale while the popup is closed (e.g. after
      // navigating questions with the popup shut), so refresh on open --
      // cheap, and avoids a second code path just to keep it in sync.
      if (opening) renderNotes();
    };
    document.addEventListener('click', (e) => {
      if (!panel.classList.contains('hidden') && !panel.contains(e.target) && e.target !== toggle) {
        panel.classList.add('hidden');
      }
    });
  }

  function initSettingsUI() {
    const toggle = document.getElementById('settings-toggle');
    const panel = document.getElementById('settings-panel');
    toggle.onclick = (e) => {
      e.stopPropagation();
      const opening = panel.classList.contains('hidden');
      if (opening) closeOtherBannerPopups('settings-panel');
      panel.classList.toggle('hidden');
    };
    document.addEventListener('click', (e) => {
      if (!panel.classList.contains('hidden') && !panel.contains(e.target) && e.target !== toggle) {
        panel.classList.add('hidden');
      }
    });

    document.getElementById('font-dec').onclick = () => {
      settings.fontStep = Math.max(0, settings.fontStep - 1);
      applyFontStep();
      saveSettings();
    };
    document.getElementById('font-inc').onclick = () => {
      settings.fontStep = Math.min(FONT_STEPS.length - 1, settings.fontStep + 1);
      applyFontStep();
      saveSettings();
    };
    document.querySelectorAll('#theme-seg button').forEach(btn => {
      btn.onclick = () => {
        settings.theme = btn.getAttribute('data-theme-choice');
        applyTheme();
        saveSettings();
      };
    });

    applyFontStep();
    applyTheme();
  }

  (async function init() {
    await loadSettings();
    initSettingsUI();
    initCalculator();
    initNotesPopup();
    await loadProgress();
    renderAll();
  })();
})();
</script>
</body>
</html>
